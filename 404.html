<script>
(function () {
  "use strict";
  var games = (window.LOCAL_GAMES || []).slice();
  var grid = document.querySelector("[data-nf-grid]");
  var wrap = document.querySelector("[data-nf-picks]");
  if (!games.length || !grid || !wrap) return;

  // Six at random, seeded by the address so a reload keeps the same six and a
  // different broken link offers a different set.
  var seed = 0;
  var path = window.location.pathname || "/";
  for (var i = 0; i < path.length; i += 1) seed = (seed * 31 + path.charCodeAt(i)) >>> 0;
  for (var j = games.length - 1; j > 0; j -= 1) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    var k = seed % (j + 1);
    var swap = games[j]; games[j] = games[k]; games[k] = swap;
  }

  games.slice(0, 6).forEach(function (game) {
    var link = document.createElement("a");
    link.className = "notfound-card";
    link.href = "/" + game.file;
    var img = document.createElement("img");
    img.src = "/assets/img/pack/" + game.file.split("/").pop().replace(/\.html?$/, "") + ".jpg";
    img.alt = "";
    img.width = 512;
    img.height = 384;
    img.loading = "lazy";
    var name = document.createElement("span");
    name.textContent = game.title;
    link.appendChild(img);
    link.appendChild(name);
    grid.appendChild(link);
  });
  wrap.hidden = false;
}());
</script>
