		<script>//dachu
//executable

var Dachu = function () {
	var self = this;

	//<editor-fold> game
	this.cam = {
		x: 0,
		y: 0
	};
	this.vp = {
        w: 640,
        h: 480
    };
	this.ply = {
		pos: {
			x: 3*32,
			y: 4*32
		},
		vel: {
			x: 0,
			y: 0
		},
		rot: -1,
		frame: 0,
		framewait: 0,
		jumpreset: true,
		hasgun: false,
		hp: 5,
		keysdown: {}
	};
	this.creatures = [];
	this.bullets = [];
	this.scraps = [];
	this.scrapsleft = 3;
	this.stage = 0;
	//</editor-fold>

	//<editor-fold> canvas
	this.canvas = document.createElement("canvas");
	this.canvas.width = 640;
	this.canvas.height = 480;
	this.canvas.id = "game";
	document.body.appendChild(this.canvas);
	this.ctx = this.canvas.getContext("2d");
	this.ctx.font = "28px Courier New";
	this.ctx.webkitImageSmoothingEnabled = false;
	this.ctx.mozImageSmoothingEnabled = false;
	this.ctx.imageSmoothingEnabled = false;
	//</editor-fold>

	//<editor-fold> game events
	window.requestAnimFrame = (function() {
		return  window.requestAnimationFrame       ||
				window.webkitRequestAnimationFrame ||
				window.mozRequestAnimationFrame    ||
				window.oRequestAnimationFrame      ||
				window.msRequestAnimationFrame     ||
		        function(callback) {
		        	window.setTimeout(callback, 17);
		        };
    })();
	this.start = function() {
		this.pollInput();
		this.generateStars();
		this.populateEnemies();
		this.populateScraps();
		if (!(!(window.ActiveXObject) && "ActiveXObject" in window)) this.readMusic(title);
		this.update();
	};
	this.update = function() {
		//sorry this is a mess, never had time to refactor
		if (this.stage == 0) {
			bc("#000011", this.ctx);
			this.drawStars();
			this.drawUFO();
			this.drawText("DACHU", 215, 400, 50, 50, 40);
			this.drawText("SPACE TO BEGIN", 210, 350, 20, 20, 15);
			if (this.ply.keysdown[32]) {
				this.stage = 1;
				this.waittimer = 150;
			}
		}
		if (this.stage == 1) {
			bc("#000011", this.ctx);
			this.stopmusic = 1;
			this.drawStars();
			this.drawUFO();
			if (this.waittimer > 0) {
				this.waittimer--;
			} else {
				if (this.asteroidframe < 390) {
					this.drawFires();
				}
				this.drawAsteriod();
				if (this.asteroidframe < -500) {
					this.fadeOut();
					if (this.fadeframe == 0) {
						this.stage = 2;
						this.loadMap(0);
						this.fadeIn();
						if (!(!(window.ActiveXObject) && "ActiveXObject" in window)) this.readMusic(world);
					}
				}
			}
		}
		if (this.stage == 2) {
			bc("#000011", this.ctx);
			this.drawMoon();
			this.drawText("MOVE = WASD", 0-this.cam.x+400, 250, 20, 20, 15);
			this.drawText("JUMP = SPACE", 0-this.cam.x+700, 250, 20, 20, 15);
			this.drawText("BIG JUMP = HOLD SPACE", 0-this.cam.x+1000, 150, 20, 20, 15);
			this.drawPortal(43, 3);
			if (this.ply.pos.x > (33*32)) {
				this.drawText("LOOKS LIKE SOMEONE", 0-this.cam.x+1500, 150, 20, 20, 15);
				this.drawText("STOLE MY SHIP ...", 0-this.cam.x+1500, 200, 20, 20, 15);
				this.drawText("AND LEFT THIS PORTAL", 0-this.cam.x+1500, 250, 20, 20, 15);
			}
			if (this.ply.pos.x > (43*32)) {
				this.flashIn();
				this.loadMap(1);
				this.stage = 3;
				this.ply.pos.x = 3*32;
				this.ply.pos.y = 6*32;
				this.ply.vel.y = 0;
			}
		}
		if (this.stage == 3) {
			var grd = this.ctx.createLinearGradient(0, 0, 0, 480);
			grd.addColorStop(0, "#ffffd8");
			grd.addColorStop(1, "#ffd04f");
			var fs = this.ctx.fillStyle;
			this.ctx.fillStyle = grd;
			this.ctx.fillRect(0, 0, 640, 480);
			this.ctx.fillStyle = fs;
			this.drawText("COLLECT THREE SCRAPS", 0-this.cam.x+400, 0-this.cam.y+350, 20, 20, 15);
			this.drawText("OF MY UFO TO FIX IT", 0-this.cam.x+400, 0-this.cam.y+400, 20, 20, 15);
		}
		if (this.stage == 2 || this.stage == 3) {
			this.drawTerrain();
			if (this.ply.hp > 0) {
				this.drawPlayer();
				this.drawGun();
				this.drawBullets();
			}
			if (this.stage == 3) this.drawBlobos();
			if (this.stage == 3) this.drawScraps();
			this.updateCamera();
			if (this.ply.hp > 0) this.movePlayer();
			if (this.stage == 3) this.moveBlobos();
			this.drawStats();
			if (this.fadeframe != 0) {
				this.fadeIn();
			}
			if (this.flashframe != 0) {
				this.flashIn();
			}
			if (this.ply.pos.y > 1792) this.ply.hp = 0;
			if (this.scrapsleft <= 0) {
				this.drawText("IT IS FIXED. LETS GET OUT OF HERE.", 50, 350, 20, 20, 15);
				this.drawPortal(37,50);
				if (this.ply.pos.x > (37*32) &&
						this.ply.pos.y > (49*32)) {
					this.stage = 4;
					this.fadeOut();
				}
			}
			this.drawCursor();
		}
		if (this.stage == 4) {
			this.ctx.fillStyle = "#000";
			this.ctx.fillRect(0, 0, 640, 480);
			this.drawText("DACHU", 200, 250, 20, 20, 15);
			this.drawText("CREATED IN NINE DAYS?", 50, 300, 20, 20, 15);
			this.drawText("THANKS FOR PLAYING.", 50, 350, 20, 20, 15);
		}
		window.requestAnimFrame(function() { self.update(); });
	};
	//</editor-fold>

	//<editor-fold> background, menu, and other effects
	this.ufoframe = 0;
	this.asteroidframe = 700;
	this.fadeframe = 0;
	this.portalframe = 0;
	this.flashframe = 0;
	this.shipfire = false;
	this.stars = [];
	//</editor-fold>

	//<editor-fold> compression
	this.decompressString = function(str) {
		var data = [];
		for (var i = 0; i < str.length; i++) {
			var c = str.charCodeAt(i) - 35;
			if (c == 0) {
				data.push(NaN);
				continue;
			}
			data.push(c);
		}
		return data;
	};
	//</editor-fold>

	//<editor-fold> tilemap
	this.tileSize = 32;
	this.maxWidth = (this.vp.w/this.tileSize)+2;  //maximum amount of tiles shown horizontally
	this.maxHeight = (this.vp.h/this.tileSize)+2; //maximum amount of tiles shown vertically
	this.halfWidth = this.vp.w/2;
	this.halfHeight = this.vp.h/2;
	this.mapWidth = 50;
	this.mapHeight = 9;
	this.tileSetWidth = 6;
	this.riptime = 600;
	this.map = [];
	//</editor-fold>

	//<editor-fold> input
	this.setupInput();
	//</editor-fold>
}
</script>

//music

Dachu.prototype.gain = function(i) {
	this.gains[i] = this.actx.createGain();
	this.gains[i].connect(this.actx.destination);
	this.gains[i].gain.value = 0.2;
};

Dachu.prototype.fd = function(i) {
	var that = this;
	var thatosc = this.oscs[i];
	var thatgain = this.gains[i];
	thatgain.gain.setTargetAtTime(0, this.actx.currentTime, 0.015);
	setTimeout(function() {
		thatosc.stop();
	}, 100);
}

Dachu.prototype.playSound = function(num, time, inst) {
	if (this.oscs[inst]) {
		if (this.osct[inst] == 0) {
			this.fd(inst);
		} else {
			this.osct[inst]--;
		}
	}
	if (typeof num === "undefined") return;
	if (this.oscs[inst]) this.fd(inst);
	this.gain(inst);
	var osc = this.actx.createOscillator();
	osc.connect(this.gains[inst]);
	osc.type = inst == 2 ? "triangle" : "sine"; //cheap, I know
	osc.frequency.value = Math.pow(Math.pow(2,(1/12)),(num-33))*440;
	this.oscs[inst] = osc;
	this.osct[inst] = time;
	osc.start();
	//osc.stop(this.actx.currentTime+(ms/1000));
};

Dachu.prototype.readMusic = function(str) {
	this.gains = [];
	this.oscs = [];
	this.osct = [];
	this.actx = new(window.AudioContext || window.webkitAudioContext)();
	this.instd = Array(3);
	for (var i=0;i<3;i++) this.instd[i]=Array();
	this.stopmusic = false;

	var wait = parseInt(str.slice(0,3));
	var loopend = parseInt(str.slice(3,5));
	var loopstart = parseInt(str.slice(5,7));
	var data = this.decompressString(str.substring(7));
	var inst = 0;
	var mode = 0;
	var seek = 0;
	for(var i=0;i<data.length;i++)data[i]=data[i]-1;
	for(var j=0;j<data.length;j+=2) {
		if (data[j]==50) {
			inst = data[j+1];
			seek = 0;
		} else if (data[j]==51) {
			mode = data[j+1];
		} else if (data[j]==52) {
			seek += data[j+1]*3;
		} else {
			this.instd[inst][seek] = data[j];
			this.instd[inst][seek+1] = data[j+1];
			this.instd[inst][seek+2] = mode;
			seek += 3*data[j+1];
		}
	}

	var that = this;
	var tick = 0;
	var id = setInterval(function() {
		for(var k=0;k<3;k++) {
			that.playSound(that.instd[k][tick],that.instd[k][tick+1],k);
		}
		tick+=3;
		if(tick>loopend*3*16)tick=loopstart*3*16;
		if(that.stopmusic) {
			for(var l=0;l<3;l++) {
				if(that.oscs[l])that.oscs[l].stop();
			}
			that.oscs = [];
			that.osct = [];
			that.gains = [];
			that.instd = Array(3);
			for (var i=0;i<3;i++)that.instd[i]=Array();
			tick = 0;
			that.stopmusic = false;
			clearInterval(id);
		}
	}, wait);
};

Dachu.prototype.calculateAABB = function(posx, posy, velx, vely) {
    var tX = posx + velx;
    var tY = posy + vely;

    var t_y_up   = Math.floor(tY / this.tileSize);
    var t_y_down = Math.ceil(tY / this.tileSize);
    var y_near1  = Math.round((posy - 15) / this.tileSize);
    var y_near2  = Math.round((posy + 15) / this.tileSize);

    var t_x_left  = Math.floor(tX / this.tileSize);
    var t_x_right = Math.ceil(tX / this.tileSize);
    var x_near1   = Math.round((posx - 15) / this.tileSize);
    var x_near2   = Math.round((posx + 15) / this.tileSize);

	var top1    = this.isSolid(x_near1, t_y_up);
    var top2    = this.isSolid(x_near2, t_y_up);
    var bottom1 = this.isSolid(x_near1, t_y_down);
    var bottom2 = this.isSolid(x_near2, t_y_down);
    var left1   = this.isSolid(t_x_left, y_near1);
    var left2   = this.isSolid(t_x_left, y_near2);
    var right1  = this.isSolid(t_x_right, y_near1);
    var right2  = this.isSolid(t_x_right, y_near2);
	
    return {
    	bottom: bottom1 || bottom2,
    	top: top1 || top2,
    	left: left1 || left2,
    	right: right1 || right2
    };
}

//all from the platformer codepen
Dachu.prototype.collideplayer = function() {
	var aabb = this.calculateAABB(
		this.ply.pos.x, this.ply.pos.y,
		this.ply.vel.x, this.ply.vel.y);

	if (aabb.bottom) {
		this.ply.vel.y = 0;
		this.jumpreset = true;
	}
	if (aabb.top) {
		this.ply.vel.y = 0.1;
	}
	if (aabb.left) {
		this.ply.pos.x = Math.floor(this.ply.pos.x)-this.ply.vel.x+0.5;
		this.ply.vel.x = 0;
	}
	if (aabb.right) {
		this.ply.pos.x = Math.ceil(this.ply.pos.x)-this.ply.vel.x-0.5;
		this.ply.vel.x = 0;
	}
};

Dachu.prototype.collideblobo = function(creature) {
	var aabb = this.calculateAABB(
		creature.x, creature.y,
		creature.vx, creature.vy);

	if (aabb.bottom) {
		creature.vy = 0;
		creature.jumping = false;
	}
	if (aabb.top) {
		creature.vy = 0.0;
	}
	if (aabb.left) {
		creature.x = Math.floor(creature.x)-creature.vx+1.5;
		creature.vx = 0;
	}
	if (aabb.right) {
		creature.x = Math.ceil(creature.x)-creature.vx-1.5;
		creature.vx = 0;
	}
};

Dachu.prototype.isSolid = function(x, y) {
	return !isNaN(this.getBlock(x, y));
};

	var sx = this.ply.pos.x - this.tileSize / 2 - this.cam.x + this.vp.w / 2;
	var sy = this.ply.pos.y - this.tileSize / 2 - this.cam.y + this.vp.h / 2;
	var fx = this.ply.rot * sx - (this.ply.rot == -1 ? this.tileSize : 0);
	//nasty trick to flip image (and to recenter it ^^^)
	this.ctx.scale(this.ply.rot, 1);
	this.ctx.drawImage(dachu_a, xp, yp, this.tileSize, this.tileSize, fx, sy, this.tileSize, this.tileSize);
	this.ctx.setTransform(1, 0, 0, 1, 0, 0);

	if (this.damagetimer > 0) this.damagetimer--;
};

Dachu.prototype.updateCamera = function () {
	var pxh = Math.round(this.ply.pos.x);
	var pyh = Math.round(this.ply.pos.y);
	this.cam.x = pxh;
	this.cam.y = pyh;
	//keeps the camera in bounds
	this.cam.x = Math.max(this.vp.w/2, this.cam.x);
	this.cam.x = Math.min(this.mapWidth * this.tileSize - this.tileSize/2 - this.vp.w/2, this.cam.x);
	this.cam.y = Math.max(this.vp.h/2, this.cam.y);
	this.cam.y = Math.min(this.mapHeight * this.tileSize - this.tileSize/2 - this.vp.h/2, this.cam.y);
};

Dachu.prototype.inflictDamage = function () {
	if (this.damagetimer > 0) return;
	this.damagetimer = 200;
	this.ply.hp--;
	this.ply.vel.y -= 5;
};

Dachu.prototype.shootGun = function () {
	var bbr = this.canvas.getBoundingClientRect();
	var mx = gmx - bbr.left;
	var my = gmy - bbr.top;
	var sx = mx + this.cam.x / this.tileSize;
	var sy = my + this.cam.y / this.tileSize;
	var psx = this.ply.pos.x - this.tileSize / 2 - this.cam.x + this.vp.w / 2;
	var psy = this.ply.pos.y - this.tileSize / 2 - this.cam.y + this.vp.h / 2;
	var direction = (Math.atan2(psy-sy,sx-psx)) * 180 / Math.PI; //close enough, not enough time to fix anyway
	this.bullets.push({x: this.ply.pos.x+16, y: this.ply.pos.y+22, d: direction});
};

Dachu.prototype.drawBullets = function () {
	var fs = this.ctx.fillStyle;
	var ol = this.ctx.strokeStyle;
	this.ctx.fillStyle = "#f00";
	var lenc = 0;
	for (var i = 0; i < this.bullets.length - lenc; i++) {
		var bullet = this.bullets[i];
		var movement = this.localTranslation(bullet.x, bullet.y, bullet.d, 8);
		bullet.x = movement.x;
		bullet.y = movement.y;
		var sx = bullet.x-1 - this.tileSize / 2 - this.cam.x + this.vp.w / 2;
		var sy = bullet.y-1 - this.tileSize / 2 - this.cam.y + this.vp.h / 2;
		this.ctx.fillRect(sx, sy, 2, 2);
		if (this.isSolid(Math.floor(bullet.x/32), Math.floor(bullet.y/32))) {
			this.bullets.splice(i, 1);
			i--;
			lenc++;
		}
	}
	this.ctx.fillStyle = fs;
	this.ctx.strokeStyle = ol;
};

Dachu.prototype.localTranslation = function (x, y, dir, dist) {
	var nx = x + dist * Math.cos(-dir*Math.PI/180);
	var ny = y + dist * Math.sin(-dir*Math.PI/180);
	return {x: nx, y: ny};
};
</script>

function bc(color, ctx) {

	ctx.fillStyle = color;
	ctx.fillRect(0, 0, 640, 480);

}

function tc(text, x, y, color, ctx) {

	ctx.fillStyle = color;
	ctx.fillText(text, x, y);
	ctx.fillStyle = fs;
}

function di(img, x, y, sx, sy, is, ctx) {
	ctx.drawImage(img, x, y, is, is, sx, sy, is, is);
}

function clear(ctx) {
	ctx.clearRect(0, 0, 640, 480);
}

var gmx, gmy;
function mouseMove(evt) {
	gmx = evt.clientX;
	gmy = evt.clientY;
}
document.addEventListener('mousemove', mouseMove, false);
