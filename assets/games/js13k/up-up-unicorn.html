<script>/*global input: true*/
/*global Event*/
input =
(function () {
"use strict";

var left, right, up, touchPos,
	deprecatedKeys = {
		Spacebar: ' ',
		Left: 'ArrowLeft',
		Up: 'ArrowUp',
		Right: 'ArrowRight'
	}, keys = {
		37: 'ArrowLeft',
		38: 'ArrowUp',
		39: 'ArrowRight'
	},
	fullscreenToggle = document.getElementById('fullscreen'),
	audioToggle = document.getElementById('sound');

function getKey (e) { //basic support for old browsers
	if (e.key && e.key !== 'Unidentified') {
		return deprecatedKeys[e.key] || e.key;
	}
	return keys[e.keyCode];
}

function onKeyDown (e) {
	var unhandled = false;
	switch (getKey(e)) {
	case 'ArrowLeft':
	case 'a':
	case 'q':
		left = true;
		break;
	case 'ArrowUp':
	case 'w':
	case 'z':
	case ' ':
		up = true;
		break;
	case 'ArrowRight':
	case 'd':
		right = true;
		break;
	case 'f':
		fullscreenToggle.checked = !fullscreenToggle.checked;
		fullscreenToggle.dispatchEvent(new Event('change'));
		break;
	case 'm':
		audioToggle.checked = !audioToggle.checked;
		audioToggle.dispatchEvent(new Event('change'));
		break;
	default:
		unhandled = true;
	}
	if (!unhandled) {
		e.preventDefault();
	}
}

function onKeyUp (e) {
	var unhandled = false;
	switch (getKey(e)) {
	case 'ArrowLeft':
	case 'a':
	case 'q':
		left = false;
		break;
	case 'ArrowUp':
	case 'w':
	case 'z':
	case ' ':
		up = false;
		break;
	case 'ArrowRight':
	case 'd':
		right = false;
		break;
	default:
		unhandled = true;
	}
	if (!unhandled) {
		e.preventDefault();
	}
}

function onTouch (e) {
	if (e.type === 'touchstart' || e.type === 'touchmove') {
		e.preventDefault();
	}
	if (e.touches.length !== 1) {
		touchPos = -1;
	} else {
		touchPos = e.touches[0].clientX / document.documentElement.clientWidth;
	}
}

function enable () {
	left = false;
	right = false;
	up = false;
	touchPos = -1;
	document.addEventListener('keydown', onKeyDown);
	document.addEventListener('keyup', onKeyUp);
	document.addEventListener('touchstart', onTouch, {passive: false});
	document.addEventListener('touchmove', onTouch, {passive: false});
	document.addEventListener('touchend', onTouch);
	document.addEventListener('touchcancel', onTouch);
}

function disable () {
	document.removeEventListener('keydown', onKeyDown);
	document.removeEventListener('keyup', onKeyUp);
	document.removeEventListener('touchstart', onTouch, {passive: false});
	document.removeEventListener('touchmove', onTouch, {passive: false});
	document.removeEventListener('touchend', onTouch);
	document.removeEventListener('touchcancel', onTouch);
}

return {
	enable: enable,
	disable: disable,
	dir: function () {
		if (touchPos > -1) {
			return touchPos > 0.5 ? 1 : -1;
		}
		if (left && !right) {
			return -1;
		}
		if (right && !left) {
			return 1;
		}
		return 0;
	},
	jump: function () {
		if (touchPos > -1) {
			return true;
		}
		return up;
	}
};
})();</script>
<script>/*global fullscreen: true*/
fullscreen =
(function () {
"use strict";

var updateHandler;

function isFullscreen () {
	return document.fullscreenElement ||
		document.mozFullScreenElement ||
		document.webkitFullscreenElement ||
		document.msFullscreenElement ||
		document.webkitIsFullScreen;
}

function enterFullscreen () {
	var el;
	if (isFullscreen()) {
		return;
	}
	el = document.documentElement;
	if (el.requestFullscreen) {
		el.requestFullscreen();
	} else if (el.webkitRequestFullscreen) {
		el.webkitRequestFullscreen();
	} else if (el.mozRequestFullScreen) {
		el.mozRequestFullScreen();
	} else if (el.msRequestFullscreen) {
		el.msRequestFullscreen();
	}
}

function exitFullscreen () {
	if (!isFullscreen()) {
		return;
	}
	if (document.exitFullscreen) {
		document.exitFullscreen();
	} else if (document.webkitExitFullscreen) {
		document.webkitExitFullscreen();
	} else if (document.mozCancelFullScreen) {
		document.mozCancelFullScreen();
	} else if (document.msExitFullscreen) {
		document.msExitFullscreen();
	}
}

function onUpdate () {
	if (updateHandler) {
		updateHandler(isFullscreen());
	}
}

function setUpdateHandler (handler) {
	updateHandler = handler;
}

document.addEventListener('fullscreenchange', onUpdate);
document.addEventListener('webkitfullscreenchange', onUpdate);
document.addEventListener('mozfullscreenchange', onUpdate);
document.addEventListener('msfullscreenchange', onUpdate);
document.addEventListener('fullscreenerror', onUpdate);
document.addEventListener('webkitfullscreenerror', onUpdate);
document.addEventListener('mozfullscreenerror', onUpdate);
document.addEventListener('msfullscreenerror', onUpdate);

return {
	//is: isFullscreen,
	enter: enterFullscreen,
	exit: exitFullscreen,
	setUpdateHandler: setUpdateHandler
};
})();</script>
<script>/*global audio: true*/
audio =
(function () {
"use strict";

var isPlaying = false, AC, audioContext, nodes = [], staffs;

function getFreq (note, key) {
	return key[note];
}

function getNode (time, type) {
	var i, osc, gain;
	type = type || 'sine';
	for (i = 0; i < nodes.length; i++) {
		if (nodes[i].osc.type === type && nodes[i].t < time) {
			return i;
		}
	}
	osc = audioContext.createOscillator();
	gain = audioContext.createGain();
	osc.type = type;
	gain.gain.value = 0;
	osc.connect(gain);
	gain.connect(audioContext.destination);
	osc.start();
	nodes.push({osc: osc, gain: gain});
	return nodes.length - 1;
}

function playNote (start, end, freq, volume) {
	var i = getNode(start);
	nodes[i].osc.frequency.setValueAtTime(freq, start);
	nodes[i].gain.gain.setValueAtTime(0.001, start);
	nodes[i].gain.gain.exponentialRampToValueAtTime(volume, start + 0.05);
	nodes[i].gain.gain.linearRampToValueAtTime(volume, end - 0.05);
	nodes[i].gain.gain.exponentialRampToValueAtTime(0.001, end);
	nodes[i].gain.gain.setValueAtTime(0, end + 0.01);
	nodes[i].t = end + 0.01;
}

function playNotes (notes, dur, start, key, volume) {
	var i, end = start + dur;
	for (i = 0; i < notes.length; i++) {
		playNote(start, end, getFreq(notes[i], key), volume);
	}
	return end;
}

function playStaff (staff) {
	var notes;
	while (staff.time - audioContext.currentTime < 1) {
		notes = staff.notes[staff.pos];
		if (notes[0][0] === 'z') {
			staff.time += notes[1] * staff.baseDur;
		} else {
			staff.time = playNotes(
				notes[0], notes[1] * staff.baseDur,
				staff.time,
				staff.key,
				staff.volume
			);
		}
		staff.pos = (staff.pos + 1) % staff.notes.length;
	}
}

function playStaffs () {
	var i, time;
	if (!isPlaying) {
		return;
	}
	if (!audioContext) {
		audioContext = new AC();
	}
	for (i = 0; i < staffs.length; i++) {
		if (staffs[i].time === -1) {
			if (!time) {
				time = audioContext.currentTime + 0.1;
			}
			staffs[i].time = time;
		}
		playStaff(staffs[i]);
	}
}

function stop () {
	var i, time;
	isPlaying = false;
	if (!audioContext) {
		return;
	}
	time = audioContext.currentTime + 0.1;
	for (i = 0; i < nodes.length; i++) {
		nodes[i].osc.frequency.cancelScheduledValues(time);
		nodes[i].gain.gain.cancelScheduledValues(time);
		nodes[i].gain.gain.setValueAtTime(0, time);
		nodes[i].t = time;
	}
	for (i = 0; i < staffs.length; i++) {
		staffs[i].time = -1;
		staffs[i].pos = 0;
	}
}

function initStaff (notes, key, volume, baseDur) {
	staffs.push({
		time: -1,
		pos: 0,
		notes: notes,
		key: key,
		volume: volume,
		baseDur: baseDur
	});
}

function parseNotes (notes) {
	return notes.split(' ').map(function (n) {
		var l;
		n = n.split(/([\^_]?[a-zA-Z][',]*)/);
		l = Number(n.pop() || 1);
		return [
			n.filter(function (a) {
				return a;
			}),
			l
		];
	});
}

function init (data, baseDur) {
	var i;
	staffs = [];
	for (i = 0; i < data.length; i++) {
		initStaff(parseNotes(data[i][0]), data[i][1], data[i][2], baseDur);
	}
}

function setMelody () {
	var eFlatMajor, eFlatMajorLower, voice0, voice1;
	/*jshint quotmark: false*/
	//jscs:disable validateQuoteMarks

	eFlatMajor = { //NOTE one octave lower than usual
		E: Math.pow(2, -6 / 12) * 220,
		F: Math.pow(2, -4 / 12) * 220,
		G: Math.pow(2, -2 / 12) * 220,
		A: Math.pow(2, -1 / 12) * 220,
		B: Math.pow(2, 1 / 12) * 220,
		c: Math.pow(2, 3 / 12) * 220,
		d: Math.pow(2, 5 / 12) * 220,
		e: Math.pow(2, 6 / 12) * 220,
		f: Math.pow(2, 8 / 12) * 220,
		g: Math.pow(2, 10 / 12) * 220,
		a: Math.pow(2, 11 / 12) * 220,
		b: Math.pow(2, 13 / 12) * 220,
		"c'": Math.pow(2, 15 / 12) * 220,
		"d'": Math.pow(2, 17 / 12) * 220,
		"e'": Math.pow(2, 18 / 12) * 220,
		"f'": Math.pow(2, 20 / 12) * 220,
		"g'": Math.pow(2, 22 / 12) * 220
	};

	//jscs:disable maximumLineLength
	voice0 = "G0.5 B0.5 c c0.5 e0.5 d0.75 B0.25 e0.5 f0.5 e Bd c0.5 d0.5 c B G2 G0.5 B0.5 c c0.5 e0.5 d0.75 B0.25 e0.5 f0.5 g Bg cg0.5 f0.5 e cf e2 b0.5 g0.5 f f e0.5 g0.5 f B b0.5 g0.5 f f g0.5 b0.5 c'2 c'0.5 d'0.5 c'e' bd' ac' gb ee' eg f0.5 e0.5 f g fb2 eg0.5 b0.5 ec' c'0.5 e'0.5 fd'0.75 b0.25 be'0.5 f'0.5 e' bd' c'0.5 d'0.5 c' db eg2 g0.5 b0.5 c' c'0.5 e'0.5 d'0.75 b0.25 e'0.5 f'0.5 g' gg' g'0.5 f'0.5 e' af' ge'2 b0.5 g0.5 f f e0.5 g0.5 f B b0.5 g0.5 f f g0.5 b0.5 c'2 c'0.5 d'0.5 c'e' bd' ac' gb ee' eg f0.5 e0.5 f g fb2 eg0.5 b0.5 ec' c'0.5 e'0.5 fd'0.75 b0.25 be'0.5 f'0.5 e' bd' c'0.5 d'0.5 c' db eg2 g0.5 b0.5 c' c'0.5 e'0.5 d'0.75 b0.25 e'0.5 f'0.5 g' gg' g'0.5 f'0.5 e' af' ge'2 z";
	voice1 = "z Ae z Bf Ge z Ge Ae z Bd ce2 Bd Ae z Bf Ge z E0.5 G0.5 Ae z ca z eg Ge Bf z cg db z Ge Bf z eb a g fa cg Bg Ae Ge Fe Ee Af fa eb d c B Ae z Bf Ge z Ge Ae z Bf ce2 Bd Ae z Bf Ge z E0.5 G0.5 Ae z ca Eg2 Ge Bf z cg db z Ge Bf z eb a g fa cg Bg Ae Ge Fe Ee Af fa eb d c B Ae z Bf Ge z Ge Ae z Bf ce2 Bd Ae z Bf Ge z E0.5 G0.5 Ae z ca Eg2 z";
	//jscs:enable maximumLineLength
	/*jshint quotmark: true*/
	//jscs:enable validateQuoteMarks

	eFlatMajorLower = {};
	Object.keys(eFlatMajor).forEach(function (k) {
		eFlatMajorLower[k] = eFlatMajor[k] / 2;
	});

	init([
		[voice0, eFlatMajor, 0.2],
		[voice1, eFlatMajorLower, 0.2]
	], 60 / 80);
}

function generateSound (freq, incr, delay, times, vol, type) {
	//based on https://github.com/foumart/JS.13kGames/blob/master/lib/SoundFX.js
	//which is why the parameters are a little odd
	var i, start, end;

	if (!audioContext) {
		audioContext = new AC();
	}
	start = audioContext.currentTime + 0.01;
	end = start + delay * times / 1000;
	i = getNode(start, ['square', 'sawtooth', 'triangle', 'sine'][type || 0]);

	nodes[i].osc.frequency.setValueAtTime(freq, start);
	nodes[i].osc.frequency.linearRampToValueAtTime(freq + incr * times, end);
	nodes[i].gain.gain.setValueAtTime(vol, start);
	nodes[i].gain.gain.linearRampToValueAtTime(0, end);
	nodes[i].t = end;
}

function playSound (sound) {
	if (!isPlaying) {
		return;
	}
	switch (sound) {
	case 'coin':
		generateSound(510, 0, 15, 20, 0.1);
		setTimeout(function () {
			generateSound(2600, 1, 10, 50, 0.2);
		}, 80);
		break;
	case 'up':
		generateSound(220, 15, 60, 15, 0.3, 2);
		break;
	case 'down':
		generateSound(440, -15, 60, 15, 0.3, 2);
		break;
	case 'die':
		generateSound(100, -10, 10, 25, 0.5);
		generateSound(125, -5, 20, 45, 0.1, 1);
		generateSound(40, 2, 20, 20, 1, 2);
		generateSound(200, -4, 10, 100, 0.25, 2);
	}
}

AC = window.AudioContext || window.webkitAudioContext;
setMelody();

return {
	start: function () {
		isPlaying = true;
	},
	stop: stop,
	tick: AC ? playStaffs : function () {},
	sound: AC ? playSound : function () {}
};

})();
</script>

Unicorn.prototype.move = function (dir, jump, dt) {
	var coin, cloud, oldY;
	oldY = this.y;
	if (dir) {
		this.dir = -dir;
		this.x += dir * VX * dt;
		if (this.x < WIDTH / 2) {
			this.x = WIDTH / 2;
		} else if (this.x > this.game.width - WIDTH / 2) {
			this.x = this.game.width - WIDTH / 2;
		}
	}
	this.y += this.vy * dt;
	if (this.fly > 0) {
		this.fly -= dt;
		if (this.fly > 0) {
			return;
		}
		audio.sound('down');
		this.fly = 0;
	}
	coin = this.game.getCoin(this.x, Math.min(this.y, oldY), Math.max(this.y, oldY) + HEIGHT);
	if (coin) {
		this.coins++;
		coin.removed = true;
		audio.sound('coin');
	}
	cloud = this.game.getCloud(this.x, this.y, oldY);
	if (cloud) {
		this.y = cloud.y;
		if (jump || !cloud.sticky) {
			this.vy = JUMP;
		} else if (cloud.sticky) {
			this.vy = 0;
			cloud.player = this;
		}
		if (cloud.fadeOut) {
			cloud.fading = true;
		}
		if (cloud.rainbow) {
			this.fly = FLY;
			audio.sound('up');
		}
	} else {
		this.vy -= GRAVITY * dt;
	}
};

return Unicorn;

<script>/*global Sky: true*/
Sky =
(function () {
"use strict";

function frac (x) {
	return x - Math.floor(x);
}

function Sky (w, h) {
	this.w = w;
	this.h = h;
	this.t = 0;
}

Sky.prototype.move = function (dt) {
	this.t += dt;
};

Sky.prototype.draw = function (topY, ctx) {
	var p = (Math.sin(this.t / 10000) + 1) / 2, y, dy;
	ctx.fillStyle = 'hsl(240,100%,' + (5 + 50 * p) + '%)';
	ctx.fillRect(0, 0, this.w, this.h);
	if (p < 0.4) {
		ctx.fillStyle = 'rgba(255,255,255,' + (1 - p / 0.4) + ')';
		for (y = 0; y < this.h; y++) {
			dy = Math.round(topY) - y;
			if (Math.sin(1.2354 * dy) > 0.9) {
				ctx.beginPath();
				ctx.arc(frac(Math.sin(dy)) * this.w, y, 0.75, 0, 7);
				ctx.fill();
			}
		}
	}
};

return Sky;
})();</script>
<script>/*global Cloud: true*/
Cloud =
(function () {
"use strict";

var THRESHOLD = 7,
	rainbowGradient;

function halfCircle (x, y, r, ctx) {
	ctx.moveTo(x - r, y);
	ctx.arcTo(x - r, y - r, x, y - r, r);
	ctx.arcTo(x + r, y - r, x + r, y, r);
}

function gapLine (ctx, x0, y, x1, gapPos, gapWidth) {
	gapWidth = gapWidth || 5;
	var xm = x0 + gapPos * (x1 - x0);
	if (xm - gapWidth > x0) {
		ctx.moveTo(x0, y);
		ctx.lineTo(xm - gapWidth, y);
	}
	if (xm + gapWidth < x1) {
		ctx.moveTo(xm + gapWidth, y);
		ctx.lineTo(x1, y);
	}
}

function openingGapLine (ctx, x0, y, x1, gapPos, p) {
	gapLine(ctx, x0, y, x1, gapPos, 5 + p * ((x1 - x0) * Math.max(gapPos, 1 - gapPos) - 5));
}

function createRainbowGradient (ctx) {
	rainbowGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 10);
	rainbowGradient.addColorStop(0, 'hsla(300,100%,50%,0)');
	rainbowGradient.addColorStop(0.4, 'hsla(300,100%,50%,0)');
	rainbowGradient.addColorStop(0.4, 'hsl(300,100%,50%)');
	rainbowGradient.addColorStop(0.5, 'hsl(240,100%,50%)');
	rainbowGradient.addColorStop(0.6, 'hsl(180,100%,50%)');
	rainbowGradient.addColorStop(0.7, 'hsl(120,100%,50%)');
	rainbowGradient.addColorStop(0.8, 'hsl(60,100%,50%)');
	rainbowGradient.addColorStop(0.9, 'hsl(30,100%,50%)');
	rainbowGradient.addColorStop(1, 'hsl(0,100%,50%)');
}

function Cloud (x, y, l, options) {
	this.x = x;
	this.y = y;
	this.l = l; //half of the length
	options = options || {};
	this.vx = options.vx || 0;
	this.fadeOut = options.fadeOut || 0;
	this.fading = false;
	this.fade = 1;
	this.rainbow = options.rainbow || false;
	this.sticky = options.sticky || false;
	this.random = [Math.random(), Math.random(), Math.random()];
}

Cloud.prototype.draw = function (topY, ctx) {
	var r0, r1, r2;
	if (this.rainbow) {
		this.drawRainbow(topY, ctx);
	} else if (this.fadeOut) {
		this.drawFading(topY, ctx);
	} else {
		if (this.l > 50) {
			//2 * r0 + r2 > this.l
			//2 * r1 + r2 > this.l
			//r2 > r0, r2 > r1
			r2 = this.l * (0.4 + 0.3 * this.random[0]);
			r0 = this.l * 0.3 + this.random[1] * (r2 / 6 - 0.015);
			r1 = this.l * 0.3 + this.random[2] * (r2 / 6 - 0.015);
		} else {
			//r0 + r1 > this.l
			r0 = this.l * (0.3 + 0.4 * this.random[0]);
			r1 = this.l * (0.93 + 0.1 * this.random[1]) - 0.75 * r0;
		}
		this.drawCloud(topY, ctx, r0, r1, r2);
	}
};

Cloud.prototype.drawFading = function (topY, ctx) {
	var x0 = this.x - this.l + THRESHOLD / 2,
		x1 = this.x + this.l - THRESHOLD / 2,
		y0 = topY - this.y + THRESHOLD / 2,
		y1 = topY - this.y - 3 - THRESHOLD / 2;
	ctx.strokeStyle = 'rgba(255,255,255,' + this.fade + ')';
	ctx.lineWidth = THRESHOLD;
	//ctx.lineCap = 'round'; set globally
	ctx.beginPath();
	gapLine(ctx, x0, y0, x1, 0.15 + 0.7 * this.random[0]);
	openingGapLine(ctx, x0, y1, x1, 0.15 + 0.7 * this.random[1], 1 - this.fade);
	ctx.stroke();
};

Cloud.prototype.drawCloud = function (topY, ctx, r0, r1, r2) {
	var x0 = this.x - this.l,
		x1 = this.x + this.l,
		y = topY - this.y;

	ctx.moveTo(x0, y);
	ctx.lineTo(x1, y);

	ctx.strokeStyle = '#aaa';
	ctx.fillStyle = '#fff';

		ctx.beginPath();
		halfCircle((x0 + x1) / 2, y, r2, ctx);

		halfCircle(x0 + r0, y, r0, ctx);

	ctx.beginPath();
	if (r0 > r1) {
		halfCircle(x1 - r1, y, r1, ctx);
	} else {
		halfCircle(x0 + r0, y, r0, ctx);
	}
	ctx.fill();
	ctx.stroke();
};

Cloud.prototype.drawRainbow = function (topY, ctx) {
	if (!rainbowGradient) {
		createRainbowGradient(ctx);
	}
	ctx.fillStyle = rainbowGradient;
	ctx.save();
	ctx.translate(this.x, topY - this.y + THRESHOLD);
	ctx.scale(this.l / 10, this.l / 10);
	ctx.beginPath();
	halfCircle(0, 0, 10, ctx);
	ctx.fill();
	ctx.restore();
};

Cloud.prototype.move = function (dt, w) {
	var oldX = this.x;
	if (this.vx) {
		this.x += dt * this.vx;
		if (this.x < this.l) {
			this.x = 2 * this.l - this.x;
			this.vx = -this.vx;
		} else if (this.x > w - this.l) {
			this.x = 2 * (w - this.l) - this.x;
			this.vx = -this.vx;
		}
	}
	if (this.fading) {
		this.fade -= dt * this.fadeOut;
	}
	if (this.player) {
		this.player.x += (this.x - oldX);
		/*if (oldX > this.x) {
			this.player.dir = 1;
		} else {
			this.player.dir = -1;
		}*/
		this.player = null;
	}
};

Cloud.prototype.contains = function (x, y0, y1) {
	return Math.abs(this.x - x) <= this.l && (
		Math.abs(this.y - y0) <= THRESHOLD ||
		(y0 < this.y && this.y < y1) ||
		(y1 < this.y && this.y < y0)
	);
};

return Cloud;
})();</script>
<script>/*global Coin: true*/
Coin =
(function () {
"use strict";

var R = 20;

function Coin (x, y) {
	this.x = x;
	this.y = y;
}

Coin.prototype.draw = function (topY, ctx) {
	if (this.removed) {
		return;
	}
	ctx.lineWidth = 1.5;
	ctx.strokeStyle = '#f80';
	ctx.fillStyle = '#ff0';
	ctx.beginPath();
	ctx.arc(this.x, topY - this.y, R, 0, 7);
	ctx.fill();
	ctx.stroke();
};

Coin.prototype.contains = function (x, y0, y1) {
	return !this.removed && Math.abs(this.x - x) <= R && (
		Math.abs(this.y - y0) <= R ||
		(y0 < this.y && this.y < y1) ||
		(y1 < this.y && this.y < y0)
	);
};

return Coin;
})();</script>
<script>/*global Game: true*/
/*global Unicorn, Sky, Cloud, Coin, storage, input, audio*/
Game =
(function () {
"use strict";

var VY = 0.04;

function Game (mode, ctx) {
	this.mode = mode;
	this.ctx = ctx;
	this.width = ctx.canvas.width;
	this.height = ctx.canvas.height;
	this.topY = ctx.canvas.height;
	this.player = new Unicorn(this.width / 2, 10, storage.get('style'), this);
	this.sky = new Sky(this.width, this.height);
	this.initClouds();
	this.initCoins();
}

Game.prototype.initClouds = function () {
	this.clouds = [];
	this.clouds.push(new Cloud(this.width / 2, 10, this.mode === 2 ? 30 : 80, {
		vx: this.mode === 1 ? 0.1 : 0,
		sticky: this.mode === 1
	}));
	this.updateClouds();
};

Game.prototype.initCoins = function () {
	this.coins = [];
	this.coins.push(this.newCoin(0));
	this.updateCoins();
};

Game.prototype.getValue = function (v0, v1) {
	var t = this.topY - this.height;
	return v1 / (1 + (v1 / v0 - 1) * Math.exp(-t / 12000));
};

Game.prototype.newCloud = function (lastY, lastX, noRainbow) {
	var x, y, l, rainbow = Math.random() < 0.01, options;
	l = this.mode === 2 ? 30 : this.getValue(50, 25) + Math.random() * this.getValue(40, 5) * (rainbow ? 0.2 : 1);
	x = l + Math.random() * (this.width - 2 * l);
	if (Math.abs(x - lastX) < 40) { //try again if above
		x = l + Math.random() * (this.width - 2 * l);
	}
	//lastY + 240 is just doable
	if (this.mode === 2) {
		y = lastY + this.getValue(50, 100) + Math.random() * this.getValue(10, 120);
	} else {
		y = lastY + this.getValue(75, 120) + Math.random() * this.getValue(50, 120);
	}
	options = {
		vx: this.mode === 1 || Math.random() < this.getValue(0.02, 0.6) ?
			(Math.random() < 0.5 ? 1 : -1) * (0.1 + Math.random() * 0.1) * (this.mode === 1 ? this.getValue(0.75, 1) : 1) : 0,
		fadeOut: Math.random() < this.getValue(0.02, 0.6) ? (this.mode === 1 ? 0.0002 : 0.001) : 0,
		sticky: this.mode === 1
	};
	if (rainbow && !noRainbow) {
		return this.newRainbow(x, y, l, options);
	}
	return new Cloud(x, y, l, options);
};

Game.prototype.newRainbow = function (x, y, l, options) {
	//1500: duration of a rainbow flight, 0.95: speed (see unicorn.js)
	var x2 = x - options.vx * 1500; //will normalize long enough before visible
	return [
		new Cloud(x, y, l, {
			vx: options.vx,
			rainbow: true
		}),
		new Cloud(x2, y + 1500 * 0.95, l, {
			vx: options.vx,
			fadeOut: options.fadeOut,
			sticky: options.sticky
		})
	];
};

Game.prototype.newCoin = function (lastY) {
	var x = 25 + Math.random() * (this.width - 50),
		y = lastY + this.height * 0.7 + 5 * this.height * Math.random();
	return new Coin(x, y);
};

Game.prototype.updateClouds = function () {
	var prev, cloud;
	//add new clouds
	while (this.clouds[this.clouds.length - 1].y < this.topY) {
		prev = this.clouds[this.clouds.length - 1];
		cloud = this.newCloud(prev.y, prev.x);
		if (Array.isArray(cloud)) {
			this.clouds.push(cloud[0]); //rainbow
			while (this.clouds[this.clouds.length - 1].y + 50 <= cloud[1].y) {
				//filler clouds
				prev = this.clouds[this.clouds.length - 1];
				this.clouds.push(this.newCloud(prev.y, prev.x, true));
			}
			this.clouds.pop(); //remove last cloud
			this.clouds.push(cloud[1]); //landing cloud for rainbow
		} else {
			this.clouds.push(cloud);
		}
	}
	//remove old clouds
	while (this.clouds[0].y + this.height < this.topY) {
		this.clouds.shift();
	}
};

Game.prototype.updateCoins = function () {
	while (this.coins[this.coins.length - 1].y < this.topY) {
		this.coins.push(this.newCoin(this.coins[this.coins.length - 1].y));
	}
	while (this.coins[0].y + this.height < this.topY) {
		this.coins.shift();
	}
};

Game.prototype.getCloud = function (x, y0, y1) {
	var i, cloud;
	for (i = this.clouds.length - 1; i >= 0; i--) {
		cloud = this.clouds[i];
		if (cloud.y < Math.min(y0, y1)) {
			return;
		}
		if (cloud.contains(x, y0, y1)) {
			return cloud;
		}
	}
};

Game.prototype.getCoin = function (x, y0, y1) {
	var i, coin;
	for (i = this.coins.length - 1; i >= 0; i--) {
		coin = this.coins[i];
		if (coin.contains(x, y0, y1)) {
			return coin;
		}
	}
};

Game.prototype.draw = function () {
	var i;
	this.sky.draw(this.topY, this.ctx);
	for (i = 0; i < this.clouds.length; i++) {
		this.clouds[i].draw(this.topY, this.ctx);
	}
	for (i = 0; i < this.coins.length; i++) {
		this.coins[i].draw(this.topY, this.ctx);
	}
	this.player.draw(this.topY, this.ctx);
};

Game.prototype.move = function (dt) {
	var i, dy;
	this.sky.move(dt);
	this.player.move(this.mode !== 1 ? input.dir() : 0, input.jump(), dt);
	for (i = 0; i < this.clouds.length; i++) {
		this.clouds[i].move(dt, this.width);
	}
	this.clouds = this.clouds.filter(function (cloud) {
		return cloud.fade > 0;
	});
	dy = this.height * (this.mode === 1 ? 0.8 : 0.4) - this.topY + this.player.y;
	if (this.mode === 2 && this.topY > this.height) {
		dy = Math.max(dy, VY * dt);
	}
	if (dy > 0) {
		this.topY += dy;
	}
};

Game.prototype.step = function (dt) {
	this.move(dt);
	this.updateClouds();
	this.updateCoins();
	this.draw();
	return this.topY - this.player.y <= this.height;
};

Game.prototype.run = function (callback) {
	var lastT,
		rAF = window.mozRequestAnimationFrame || window.requestAnimationFrame,
		step = function (t) {
			var dist;
			audio.tick();
			if (!lastT) {
				lastT = t;
			}
			if (this.step(t - lastT)) {
				lastT = t;
				rAF(step);
			} else {
				dist = this.topY - this.height;
				this.topY = this.player.y + this.height;
				this.player.happy = false;
				this.draw();
				audio.sound('die');
				input.disable();
				callback(dist, this.player.coins);
			}
		}.bind(this);
	input.enable();
	rAF(step);
};

return Game;
})();</script>
<script>/*global unlock: true*/
/*global Unicorn, storage*/
unlock =
(function () {
"use strict";

var style = storage.get('style'),
	canvas = document.getElementById('unicorn'),
	ctx = canvas.getContext('2d', {alpha: false}),
	inputs, el, i, j;

ctx.lineCap = 'round';
ctx.scale(3, 3);

function draw () {
	var unicorn = new Unicorn(60, 5, style);
	ctx.fillStyle = '#00f';
	ctx.fillRect(0, 0, 120, 120);
	unicorn.draw(120, ctx);
}

function getStyle () {
	return inputs.map(function (group) {
		var i;
		for (i = 0; i < group.length; i++) {
			if (group[i].checked) {
				return i;
			}
		}
	});
}

function changeStyle () {
	style = getStyle();
	storage.set('style', style);
	draw();
}

function unlock () {
	var n = Math.ceil((1 + storage.get('coins')) / 5),
		//The following is actually a fixed number,
		//but I messed up too often, so let's just calculate it every time.
		max = inputs.length * (inputs[0].length - 1),
		unlocked = false,
		i, el;
	if (n >= max) {
		n = max;
		document.getElementById('more').style.display = 'none';
	}
	for (i = 0; i < n; i++) {
		el = inputs[i % inputs.length][1 + Math.floor(i / inputs.length)];
		if (el.disabled) {
			el.disabled = false;
			unlocked = true;
		}
	}
	return unlocked;
}

inputs = [];
for (i = 0; i < 6; i++) {
	inputs.push([]);
	for (j = 0; j < 5; j++) {
		el = document.getElementById('style' + String(i) + String(j));
		el.disabled = j > 0;
		el.checked = style[i] === j;
		el.addEventListener('change', changeStyle);
		inputs[i].push(el);
	}
}

unlock();
draw();

return unlock;
})();</script>
<script>/*global storage, fullscreen, unlock, audio, Game*/
(function () {
"use strict";

var canvas = document.getElementById('canvas'), ctx,
	sectionMenu = document.getElementById('menu'),
	sectionCustomize = document.getElementById('customize'),
	sectionGame = document.getElementById('game'),
	header = document.getElementById('header'),
	fullscreenToggle = document.getElementById('fullscreen'),
	audioToggle = document.getElementById('sound'),
	overlay = document.getElementById('overlay'),
	inGame = false, mode;

ctx = canvas.getContext('2d', {alpha: false});
ctx.lineCap = 'round';

function resize () {
	var docEl = document.documentElement, width;
	width = Math.floor(Math.min(
		1,
		docEl.clientWidth / canvas.width,
		docEl.clientHeight / canvas.height
	) * canvas.width) + 'px';
	canvas.style.width = width;
	header.style.width = width;
}

function play () {
	var game = new Game(mode, ctx);
	inGame = true;
	if (fullscreenToggle.checked) {
		fullscreen.enter();
	}
	overlay.hidden = true;
	sectionMenu.hidden = true;
	sectionGame.hidden = false;
	if (storage.get('audio')) {
		audio.start();
	}
	game.run(function (d, c) {
		audio.stop();
		var c2 = Math.ceil(d / 10000), records = storage.get('records'), newRecord = false;
		if (d > records[mode]) {
			c2++;
			newRecord = records[mode] > 0;
			records[mode] = d;
			storage.set('records', records);
		}
		storage.set('coins', storage.get('coins') + c + c2);
		updateCoinsRecords();
		document.getElementById('result').innerHTML =
			'You fell off a cloud<br>after reaching a height of ' + Math.round(d / 10) + '.' +
			(newRecord ? '<br>That’s a new record!' : '') +
			'<br>For this you earn ' + c2 + ' coin' + (c2 > 1 ? 's' : '') + '.' +
			(c ? '<br>You also collected ' + c + ' coin' + (c > 1 ? 's' : '') + '.' : '') +
			(unlock() ? '<br>You just unlocked new customizations!' : '');
		overlay.hidden = false;
	});
}

function showCustomize () {
	sectionMenu.hidden = true;
	sectionCustomize.hidden = false;
}

function play0 () {
	mode = 0;
	play();
}

function play1 () {
	mode = 1;
	play();
}

function play2 () {
	mode = 2;
	play();
}

function showMenu () {
	inGame = false;
	fullscreen.exit();
	sectionCustomize.hidden = true;
	sectionGame.hidden = true;
	sectionMenu.hidden = false;
}

function updateCoinsRecords () {
	var c = storage.get('coins'), r = storage.get('records'), i;
	if (c === 0) {
		c = 'no coins';
	} else if (c === 1) {
		c = '1 coin';
	} else {
		c += ' coins';
	}
	document.getElementById('coins').textContent = c;
	for (i = 0; i < r.length; i++) {
		document.getElementById('record' + i).textContent = r[i] ? Math.round(r[i] / 10) : '–';
	}
}

document.getElementById('button-play0').addEventListener('click', play0);
document.getElementById('button-play1').addEventListener('click', play1);
document.getElementById('button-play2').addEventListener('click', play2);
document.getElementById('button-customize').addEventListener('click', showCustomize);
document.getElementById('button-back').addEventListener('click', showMenu);
document.getElementById('button-retry').addEventListener('click', play);
document.getElementById('button-menu').addEventListener('click', showMenu);

resize();
window.addEventListener('resize', resize);
fullscreenToggle.checked = storage.get('fullscreen');
fullscreenToggle.parentElement.addEventListener('touchstart', function (e) {
	e.stopPropagation();
}, true);
fullscreenToggle.addEventListener('change', function () {
	storage.set('fullscreen', fullscreenToggle.checked);
	if (fullscreenToggle.checked) {
		fullscreen.enter();
	} else {
		fullscreen.exit();
	}
});
fullscreen.setUpdateHandler(function (isFullscreen) {
	if (inGame) {
		fullscreenToggle.checked = isFullscreen;
		storage.set('fullscreen', isFullscreen);
	}
});

audioToggle.checked = storage.get('audio');
audioToggle.parentElement.addEventListener('touchstart', function (e) {
	e.stopPropagation();
}, true);
audioToggle.addEventListener('change', function () {
	storage.set('audio', audioToggle.checked);
	if (audioToggle.checked) {
		audio.start();
	} else {
		audio.stop();
	}
});

updateCoinsRecords();
})();</script>
