<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Path Finder</title>
    <style>body {
  margin: 0;
  padding: 0;
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAALUlEQVQYV2PsCeT6HzM9lWFJ5mwGGM344kX+f5AADIAkGGEqYYIgBfhVIpsJAA/lITSrvR5SAAAAAElFTkSuQmCC"); }

* {
  user-select: none; }

.foot, .foot1, .foot2, .foot3 {
  position: absolute;
  width: 20vw;
  height: 20vw; }

.foot1 {
  left: -2vw;
  top: -2vw; }

.foot2 {
  left: 13vw;
  top: 10vw; }

.foot3 {
  top: 22vw; }

.pillow, .left, .middle-left, .middle-right, .right, .pillow-left, .pillow-right {
  position: relative;
  border-radius: 100%;
  background-color: black;
  display: block; }

.emojis {
  position: absolute;
  top: 40vw;
  left: 0;
  height: 40vw;
  width: 50vw;
  overflow: auto;
  overflow-wrap: break-word;
  font-size: 16px; }

.footsteps-container {
  position: absolute;
  left: 0;
  top: 0;
  width: 40vw;
  height: 40vw; }

.finger {
  width: 3vw;
  height: 5vw; }

.left {
  left: 4vw;
  top: 6vw;
  transform: rotate(-30deg); }

.middle-left {
  left: 8vw;
  top: -2vw; }

.middle-right {
  left: 12vw;
  top: -7vw;
  transform: rotate(20deg); }

.right {
  left: 15vw;
  top: -7vw;
  transform: rotate(60deg); }

.pillow-left {
  width: 4vw;
  height: 6vw;
  left: 8vw;
  top: -10vw;
  transform: rotate(45deg);
  border-bottom-right-radius: 80%; }

.pillow-right {
  width: 4vw;
  height: 6vw;
  left: 10vw;
  top: -16vw;
  transform: rotate(-45deg);
  border-bottom-left-radius: 80%; }

.shop-container {
  position: absolute;
  right: 0;
  width: 50vw; }

.buyable {
  margin: 5px auto;
  padding: 5px;
  box-shadow: 1px 1px 5px #000;
  width: 90%;
  height: 100px;
  line-height: 2.5;
  background: radial-gradient(circle at top left, #BEB9B8 0%, #726F6E, #BEB9B8 100%);
  font: 18px Monospace; }
  .buyable:active {
    transform: translate(2px, 1px); }

.owned {
  position: relative;
  width: 100%;
  text-align: right;
  top: 40px; }
  .owned::before {
    content: "Owned: "; }

.cost {
  position: relative;
  width: 100%;
  text-align: right;
  top: 40px; }
  .cost::before {
    content: "Cost: "; }

.particles-container {
  position: absolute;
  top: 0;
  left: 0; }

@keyframes particle-animation {
  from {
    opacity: 1;
    transform: translate(0, 0); }
  to {
    opacity: 0;
    transform: translate(0, -50px); } }

.particle {
  font: 22px Monospace;
  animation-name: particle-animation;
  animation-duration: 1s;
  animation-fill-mode: forwards; }

.points-display {
  font: 16px Monospace;
  color: white;
  position: absolute;
  bottom: 0;
  left: 5px;
  width: 50vw; }
</style>
</head>
<body>
    <div id="particles" class="particles-container"></div>
    <div class="footsteps-container" onclick="addPoints();">
        <div class="foot1">
            <div class="finger left"> </div>
            <div class="finger middle-left"> </div>
            <div class="finger middle-right"> </div>
            <div class="finger right"> </div>
            <div class="pillow-left"> </div>
            <div class="pillow-right"> </div>
        </div>
        <div class="foot2">
            <div class="finger left"> </div>
            <div class="finger middle-left"> </div>
            <div class="finger middle-right"> </div>
            <div class="finger right"> </div>
            <div class="pillow-left"> </div>
            <div class="pillow-right"> </div>
        </div>
        <div class="foot3">
            <div class="finger left"> </div>
            <div class="finger middle-left"> </div>
            <div class="finger middle-right"> </div>
            <div class="finger right"> </div>
            <div class="pillow-left"> </div>
            <div class="pillow-right"> </div>
        </div>
    </div>
    <div id="emojis" class="emojis"></div>
    <div id="shop" class="shop-container">
    </div>
    <div class="points-display">
        <div id="pps" class="pps-display">0 Footsteps per Second</div>
        <div id="points" class="point-display">0 Footsteps</div>
    </div>
    <script>var points = 0,
    pointsPerClick = 1,
    production = 0,
    pointsDisplay = document.getElementById('points'),
    ppsDisplay = document.getElementById('pps'),
    emojisContainer = document.getElementById('emojis'),
    shopContainer = document.getElementById('shop'),
    particlesContainer = document.getElementById('particles'),
    buildings = [
        { name: 'Loupe', cost: 10, additionalPPC: 1, owned: 0, emoji: '\uD83D\uDD0D' },
        { name: 'Rabbit', cost: 500, production: 8, owned: 0, emoji: '\uD83D\uDC07' },
        { name: 'Dog', cost: 2e3, production: 48, owned: 0, emoji: '\uD83D\uDC3A' },
        { name: 'Compass', cost: 1e4, production: 301, owned: 0, emoji: '\u2196\uFE0F' },
        { name: 'Map', cost: 160942, production: 1337, owned: 0, emoji: '\uD83D\uDDFA\uFE0F' },
        { name: 'GPS', cost: 9999999, production: 9999, owned: 0, emoji: '\uD83D\uDEF0\uFE0F' }
    ];

if (localStorage.save) {
    var save = JSON.parse(localStorage.save);
    points = save.points,
        pointsPerClick = save.pointsPerClick,
        production = save.production,
        buildings = save.buildings,
        emojisContainer.innerHTML = '',
        ppsDisplay.innerHTML = `${production} Footsteps per Second`,
        pointsDisplay.innerHTML = `${Math.floor(points)} Footsteps`;
    for (var a of buildings)
        for (var b = 0; b < a.owned; b++)
            emojisContainer.innerHTML += a.emoji
}

var addPoints = function () {
    var a = Math.round;
    points += pointsPerClick,
        pointsDisplay.innerHTML = `${Math.floor(points)} Footsteps`;
    var b = document.createElement('div');
    b.innerHTML = `+${pointsPerClick}`,
        b.className = 'particle',
        b.style.position = 'absolute',
        b.style.left = `${a(10 + 20 * Math.random())}vw`,
        b.style.top = `${a(10 + 20 * Math.random())}vw`,
        particlesContainer.appendChild(b),
        b.addEventListener('webkitAnimationEnd', (a) => { particlesContainer.removeChild(a.srcElement) }, !1)
};

var buy = function (a) {
    var b = Math.floor;
    var c = buildings[a];
    if (c.cost <= points) {
        points -= c.cost,
            c.production ? (production += c.production, ppsDisplay.innerHTML = `${production} Footsteps per Second`) : pointsPerClick += c.additionalPPC;
        c.owned++;
        c.cost = b(1.1 * c.cost);
        c.div.children[0].children[0].innerHTML = c.owned;
        c.div.children[0].children[1].innerHTML = c.cost;
        pointsDisplay.innerHTML = `${b(points)} Footsteps`, emojisContainer.innerHTML = '';
        var a = buildings[0].owned;
        d = 10 <= a;
        for (let b of buildings) {
            d && b.owned != a && (d = !1);
            for (let a = 0; a < b.owned; a++) emojisContainer.innerHTML += b.emoji
        } d && alert('You\'ve won! Congratultions!')
    }
}

var loop = function () {
    0 < production && (points += production / 30, pointsDisplay.innerHTML = `${Math.floor(points)} Footsteps`), setTimeout(loop, 1e3 / 30)
};

window.onload = function () {
    for (let a of buildings) {
        let b = document.createElement('div');
        b.innerHTML = `<div class="buyable" onclick="buy(${buildings.indexOf(a)});"> ${a.name} <div class="owned">${a.owned}</div> <div class="cost">${a.cost}</div> </div>`;
        a.div = b;
        shopContainer.appendChild(b);
    }
    loop();
}; 

var saveGame = function() { 
    localStorage.save = JSON.stringify({ points, pointsPerClick, production, buildings });
}; 

setInterval(saveGame, 5e3), window.onbeforeunload = saveGame;</script>
</body>
</html>
