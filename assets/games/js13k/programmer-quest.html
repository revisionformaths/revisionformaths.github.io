    <body>
        <div class="game-screen">
            <div id="game-screen__events_log">
                <h3>Events</h3>
                <div id="game-screen__events_log-box"></div>
            </div>
            <div class="game-screen__canvas-container">
                <canvas id="gameScreen" width="800" height="400"></canvas>
                <div id="actionsMenu">
                    <div class="action-button" skill="write-code" cost="8" type="off">Write code (8)</div>
                    <div class="action-button" skill="debug" cost="16" type="off">Debug (16)</div>
                    <div class="action-button" skill="meditate" cost="0" type="def">Meditate (0)</div>
                    <div class="action-button" skill="meeting" cost="13" type="off">Meeting (13)</div>
                    <div class="action-button" skill="pair-programming" cost="10" type="off">Pair Programming (10)</div>
                    <div class="action-button" skill="procrastinate" cost="0" type="def">Procrastinate (0)</div>
                </div>
            </div>
            <div class="game-screen__information-display">
                <div id="enemiesContainer" class="u-half u-centered-row"></div>
                <div class="u-half u-centered-row">
                    <table>
                        <tr>
                            <td>Level:</td><td id="playerLevel">0</td>
                        </tr>
                        <tr>
                            <td>HP:</td><td id="playerHp">250 / 250</td>
                        </tr>
                        <tr>
                            <td>Focus:</td><td id="playerFocus">100%</td>
                        </tr>
                        <tr>
                            <td>Stress:</td><td id="playerStress">0%</td>
                        </tr>
                        <tr>
                            <td>Programming:</td><td id="playerProgramming">1</td>
                        </tr>
                        <tr>
                            <td>Problem Solving:</td><td id="playerProblemSolving">1</td>
                        </tr>
                        <tr>
                            <td>Communication:</td><td id="playerCommunication">1</td>
                        </tr>
                        <tr>
                            <td>Team Work:</td><td id="playerTeamWork">1</td>
                        </tr>
                        <tr>
                            <td>XP:</td><td id="playerXp">0 / 500</td>
                        </tr>
                    </table>
                </div>
            </div>
            <div id="online-block"><div class="online-block__text">
                <p>You won't get promoted if you spend all the day on internet. Disconnect!</p>
            </div></div>
        </div>
