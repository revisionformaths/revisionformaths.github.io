        <script>let addCoin = indexOfRoadSegmentCoveredByCar => {
    let { road, roadIndex } = _getTargetSegment();    
    if (_canAddCoin(road, roadIndex, indexOfRoadSegmentCoveredByCar)) {
        let { x, y } = _getCoinPosition(road);
        _addCoin(x, y, road);
    }
}

let removeCoin = coin => {
    coin.road.hasCoin = false;
    gameContext.coins = gameContext.coins.filter(c => c != coin);
}

let _canAddCoin = (targetSegment, targetIndex, indexOfRoadSegmentCoveredByCar) => {
    if (gameContext.coins.length >= _maxCoins()) {
        return false;
    } 
    if (targetSegment.hasCoin) {
        return false;
    }
    if (Math.abs(indexOfRoadSegmentCoveredByCar - targetIndex) < 5) {
        return false;
    }
    return true;
}

let _getTargetSegment = () => {
    var index = Math.floor(Math.random() * gameContext.roads.length);
    return { road: gameContext.roads[index], roadIndex: index }
}

let _getCoinPosition = segment => {
    var { x, y, w, h } = getRoadRectangle(segment); 
    return { x: Math.round(x + Math.random() * w), y: Math.round(y + Math.random() * h) };
}

let _getCoinValue = () => {    
    let value1 = gameContext.valueNeeded();
    let value2 = value1 / 4;
    let length = Math.abs(value1 + value2);
    let min = value1 > 0 ? -value2 : value1;
    let value = Math.floor(min + Math.random() * length);
    return value == 0 ? 1 : value;
}

let _getCoinTicksToLive = () => MINCOINTICKS + (MAXCOINTICKS-MINCOINTICKS) * Math.random();

let _addCoin = (x, y, road) => {
    var coin = createCoin(x, y, _getCoinValue(), _getCoinTicksToLive());
    gameContext.coins.push(coin);
    coin.road = road;
    road.hasCoin = true;    
}

let _maxCoins = () => {
    let score = Math.abs(gameContext.valueNeeded());
    if (score < 10) return 40;
    if (score < 50) return 30;
    if (score < 100) return 20;
    return 10;
}

const MAXCOINTICKS = 500;
const MINCOINTICKS = 100;

        <script>let createCar = (x, y, dir) => { 
    return { x: x, y: y, xf: x, yf: y, rotation: degToRad(dir) }; 
}

let drawCar = (car, ctx) => {
    ctx.translate(car.x+30, car.y+15);
    ctx.rotate(car.rotation);
    ctx.fillStyle = "green";
    ctx.fillRect(-30, -15, 60, 30);
    ctx.fillStyle = "white";
    ctx.fillRect(-30, -5, 60, 4);
    ctx.fillRect(-30, 1, 60, 4);
    ctx.fillStyle = "#222222";
    ctx.fillRect(-20, -13, 8, 26);
    ctx.fillRect(0, -13, 12, 26);
    ctx.fillRect(23, -13, 5, 8);
    ctx.fillRect(23, 5, 5, 8);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "black";
    ctx.strokeRect(-30, -15, 60, 30);
    ctx.rotate(-car.rotation);
    ctx.translate(-(car.x+30), -(car.y+15));
}

let updateCar = (car, turnLeft, turnRight, driveFast, dt) => {
    var delayFactor = 17/dt;

    car.frontLeft = {
        x: car.x + 30 - _diag * Math.cos(_angle2 + car.rotation),
        y: car.y + 15 - _diag * Math.sin(_angle2 + car.rotation),
    };
    car.frontRight = {
        x: car.x + 30 + _diag * Math.cos(_angle1 + car.rotation),
        y: car.y + 15 + _diag * Math.sin(_angle1 + car.rotation),
    };
    car.rearRight = {
        x: car.x + 30 + _diag * Math.cos(_angle2 + car.rotation),
        y: car.y + 15 + _diag * Math.sin(_angle2 + car.rotation),
    };
    car.rearLeft = {
        x: car.x + 30 - _diag * Math.cos(_angle1 + car.rotation),
        y: car.y + 15 - _diag * Math.sin(_angle1 + car.rotation),
    };
    if (turnLeft) {
        car.rotation -= degToRad(2*gameContext.speedFactor*delayFactor);
    }
    else if (turnRight) {
        car.rotation += degToRad(2*gameContext.speedFactor*delayFactor);
    }
    if (driveFast) {
        _driveForward(car, 10*gameContext.speedFactor*delayFactor);
    }
    else {
        _driveForward(car, 3*gameContext.speedFactor*delayFactor);
    }
}

let _diag = Math.sqrt(30*30+15*15);
let _angle1 = Math.atan(1/2);
let _angle2 = Math.PI/2 + Math.atan(2);

let _driveForward = (car, steps) => {
    const cos = Math.cos(car.rotation);
    const sin = Math.sin(car.rotation);

    car.xf = car.xf + steps * cos;
    var nextX = Math.round(car.xf);
    if (nextX > dimensions.maxX) {
        gameContext.scrollX = dimensions.maxX - nextX;
        gameContext.x += gameContext.scrollX;
        car.xf = dimensions.maxX;
        car.x = dimensions.maxX;
    }
    else if (nextX < dimensions.minX) {
        gameContext.scrollX = dimensions.minX - nextX;
        gameContext.x += gameContext.scrollX;
        car.xf = dimensions.minX;
        car.x = dimensions.minX;
    }
    else {
        gameContext.scrollX = 0;
        car.x = nextX;
    }

    car.yf = car.yf + steps * sin;
    var nextY = Math.round(car.yf);
    if (nextY > dimensions.maxY) {
        gameContext.scrollY = dimensions.maxY - nextY;
        gameContext.y += gameContext.scrollY;
        car.yf = dimensions.maxY;
        car.y = dimensions.maxY;
    }
    else if (nextY < dimensions.minY) {
        gameContext.scrollY = dimensions.minY - nextY;
        gameContext.y += gameContext.scrollY;
        car.yf = dimensions.minY;
        car.y = dimensions.minY;
    }
    else {
        gameContext.scrollY = 0;
        car.y = nextY;
    }
}
</script>

            break;

        case GameState.GAMEOVER:

            if (gameContext.highScoreSet) {

        case GameState.WELLDONE:

            fillText(`coin value needed: ${gameContext.valueNeeded()}`, dimensions.w-100, 60, "24px Arial", "right", "white", ctx);
            break;
    }
}

let _background = ctx => fillRect(0, 0, dimensions.w, dimensions.h, "black", ctx);

let _overlayText = (text, y, ctx) => fillText(text, dimensions.cx, y, "24px Arial", "center", "white", ctx);

let _energyBarGradient = ctx => {
    var g = ctx.createLinearGradient(0, 0, dimensions.w, 0);
    g.addColorStop(0, "red");

        <script>let createStraightRoad = (x, y, rotation) => _createRoad(x, y, rotation, "straight");

let createCurvedRoad = (x, y, rotation) => _createRoad(x, y, rotation, "curve");

let createCrossRoad = (x, y, rotation) => _createRoad(x, y, rotation, "cross");

let _createRoad = (x, y, rotation, type) => {
    return { x: x, y: y, rotation: degToRad(rotation), type: type }; 
}

getRoadRectangle = r => {
    return { x: r.x, y: r.y, w: 100, h: 100 };
}

drawRoad = (road, ctx) => {
    if (road.type == "straight") {
        ctx.translate(road.x+50, road.y+50);
        ctx.rotate(road.rotation);
        ctx.strokeStyle = "#aaaaaa";
        ctx.fillStyle = "#aaaaaa";
        ctx.fillRect(-50, -50, 100, 100);
        ctx.fillStyle = "white";
        ctx.fillRect(-50, -3, 20, 6);
        ctx.fillRect(-20, -3, 40, 6);
        ctx.fillRect(30, -3, 20, 6);
        ctx.rotate(-road.rotation);
        ctx.translate(-(road.x+50), -(road.y+50));
    }
    else if (road.type == "cross") {
        ctx.translate(road.x+50, road.y+50);
        ctx.rotate(road.rotation);
        ctx.translate(-50, -50);
        ctx.strokeStyle = "#aaaaaa";
        ctx.fillStyle = "#aaaaaa";
        ctx.fillRect(0, 0, 100, 100);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 47, 20, 6);
        ctx.fillRect(30, 47, 40, 6);
        ctx.fillRect(80, 47, 20, 6);
        ctx.fillRect(47, 0, 6, 20);
        ctx.fillRect(47, 30, 6, 40);
        ctx.fillRect(47, 80, 6, 20);
        ctx.translate(50, 50);
        ctx.rotate(-road.rotation);
        ctx.translate(-(road.x+50), -(road.y+50));
    }
    else if (road.type == "curve") {
        ctx.translate(road.x+50, road.y+50);
        ctx.rotate(road.rotation);

        ctx.fillStyle = "#aaaaaa";
        ctx.strokeStyle = '#aaaaaa';
        ctx.beginPath();
        ctx.arc(-50, 50, 100, 3*Math.PI/2, Math.PI*2);
        ctx.lineTo(-50, 50);
        ctx.lineTo(-50, -50);
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.strokeStyle = 'white';
        ctx.beginPath();
        ctx.arc(-50, 50, 53, 3*Math.PI/2, Math.PI*2);
        ctx.lineTo(-50, 50);
        ctx.lineTo(-50, -50);
        ctx.fill();

        ctx.fillStyle = "#aaaaaa";
        ctx.strokeStyle = '#aaaaaa';
        ctx.beginPath();
        ctx.arc(-50, 50, 47, 3*Math.PI/2, Math.PI*2);
        ctx.lineTo(-50, 50);
        ctx.lineTo(-50, -50);
        ctx.fill();

        ctx.rotate(-road.rotation);
        ctx.translate(-(road.x+50), -(road.y+50));
    }
}

let updateRoad = road => {
    road.x += gameContext.scrollX;
    road.y += gameContext.scrollY;
}

let isInsideRoad = (p, r) => {
    var rr = getRoadRectangle(r);
    return !(p.x < rr.x || p.x > rr.x + rr.w || p.y < rr.y || p.y > rr.y + rr.h);
}

    let rots = [];
    for (var i = 0; i < xcount * ycount; i++) {
        rots.push(Math.random() * 2 * Math.PI);
    }
    return { x: x, y: y, rot: 0, size: {x: -40, y: -40, w: 100 * (xcount-1) + 80, h: 100 * (ycount-1)+80}, draw: () => { 
        for (var xc=0; xc < xcount; xc++) {
            for (var yc=0; yc < ycount; yc++) {
                var rot = rots[yc + xc*ycount];
                context.translate(xc * 100, yc * 100);
                context.rotate(rot);
                context.translate(-50, -50); 
                context.drawImage(_getCanvas("tree"), 0, 0); 
                context.translate(50, 50); 
                context.rotate(-rot);
                context.translate(-(xc * 100), -(yc * 100));
            }     
        } 
    }};

        <script>const GameState = {
    IDLE: 1,
    PLAYING: 2,
    PAUSED: 3,
    PAUSED_FOR_RESIZE: 4,
    CONTINUING: 5,
    WELLDONE: 6,
    PRESENTLEVEL: 7,
    GAMEOVER: 8
}

const HIGHSCORESTRING = "johan.ahlgren.404.highscore";

var gameContext = {
    x: 0,
    y: 0,
    scrollX : 0, 
    scrollY : 0,
    gameState: GameState.IDLE,
    tick: 0,
    score: 0,
    value: 0, 
    startTime: 0,
    linksFound: 0,
    bestTime: null,

    reset() {
        this.x = 0;
        this.y = 0;
        this.tick = 0;
        this.score = 0;
        this.linksFound = 0;
        this.startTime = Date.now();
        this.roads = [];
        this.coins = [];
        this.environment = [];
        this.energy = 500;
        this.speedFactor = 1;
        this.level = 1;
        this.course = 0;
        this.getHighScore();
        this.highScoreSet = false;
    },

    resetcourse() {
        this.x = 0;
        this.y = 0;
        this.tick = 0;
        this.energy = 500;
        this.value = 0;
        this.coins = [];
        var {x, y, dir } = buildCourse(this.course);
        this.car = createCar(x, y, dir);
        resetInput();
    },

    update(dt) {
        if (this.gameState == GameState.PLAYING) {
            if (pause()) {
                this.setGameState(GameState.PAUSED);
                return;
            }
            this.tick++;
            this.coins.filter(c => !coinIsAlive(c)).forEach(c => c.road.hasCoin = false);
            this.coins = this.coins.filter(c => coinIsAlive(c));
            this.roads.forEach(r => updateRoad(r));
            this.environment.forEach(e => updateEnvironment(e));
            this.coins.forEach(c => updateCoin(c));
            updateCar(this.car, turnLeft(), turnRight(), fastForward(), dt);
            if (this.carHitsEnvironment()) {
                this.removeEnergy(this.energy);
            }
            var coveredRoad = this.coveredRoad();
            if (coveredRoad == -1) {
                this.removeEnergy(2);
            }
            addCoin(coveredRoad);
            var coinHit = this.coins.find(c => this.carInsideCoin(c));
            if (coinHit) {
                this.value += coinHit.value;
                if (this.valueNeeded() == 0) {
                    this.linksFound++;
                    this.score += this.energy;
                    this.setGameState(GameState.WELLDONE);
                }
                removeCoin(coinHit);
                this.addEnergy(10);
            }
            if (this.tick % 20 == 0) {
                this.removeEnergy(1);
            }
        }
    },

    render() {
        if (this.gameState == GameState.PLAYING) {
            this.environment.forEach(e => drawEnvironment(e, context));
            this.roads.forEach(r => drawRoad(r, context));
            this.coins.forEach(c => drawCoin(c, context));
            drawCar(this.car, context);
        }
    },

    addEnergy(value) {
        this.energy += value;
        if (this.energy > 500) {
            this.energy = 500;
        }
    },

    removeEnergy(value) {
        if (!CHEAT) {
            if (this.energy > 0) {
                this.energy -= value;
                if (this.energy <= 0) {
                    this.highScoreSet = this.setHighScore(this.score);
                    this.setGameState(GameState.GAMEOVER);
                }
            }
        }
    },

    setGameState(newState) {
        switch(newState) {
            case GameState.PLAYING:
                this.resetcourse();
                this.gameState = GameState.PLAYING;
                break;
            case GameState.CONTINUING:
                this.gameState = GameState.PLAYING;
                break;
            case GameState.GAMEOVER:
                this.gameState = GameState.GAMEOVER;
                setTimeout(() => this.setGameState(GameState.IDLE), 3000);
                break;
            case GameState.WELLDONE:
                this.gameState = GameState.WELLDONE;
                this.energy = 500;
                this.course++;
                if (this.course == _courses.length) {
                    this.course = 0;
                    this.speedFactor *= 1.5;
                    this.level++;
                }
                setTimeout(() => this.setGameState(GameState.PRESENTLEVEL), 3000);
                break;
            case GameState.PRESENTLEVEL:
                this.gameState = GameState.PRESENTLEVEL;
                setTimeout(() => this.setGameState(GameState.PLAYING), 3000);
                break;
            case GameState.IDLE:
                this.gameState = GameState.IDLE;
                this.reset();
                break;
            default:
                this.gameState = newState;
        }
    },

    coveredRoad() {
        flInside = false;
        frInside = false;
        rrInside = false;
        rlInside = false;
        for (var i=0; i < this.roads.length; i++) {
            var r = this.roads[i];
            flInside = flInside || isInsideRoad(this.car.frontLeft, r); 
            frInside = frInside || isInsideRoad(this.car.frontRight, r); 
            rrInside = rrInside || isInsideRoad(this.car.rearRight, r); 
            rlInside = rlInside || isInsideRoad(this.car.rearLeft, r);
            if (flInside && frInside && rrInside && rlInside) {
                return i;
            } 
        }
        return -1;
    },

    carInsideCoin(coin) {
        return isInsideCoin(this.car.frontLeft, coin) || 
            isInsideCoin(this.car.frontRight, coin) || 
            isInsideCoin(this.car.rearRight, coin) || 
            isInsideCoin(this.car.rearLeft, coin);
    },

    valueNeeded() {
        return 404 - this.value;
    },

    carInsideRect(r) {
        return this.pointInsideRect(this.car.frontLeft, r) || 
            this.pointInsideRect(this.car.frontRight, r) || 
            this.pointInsideRect(this.car.rearRight, r) || 
            this.pointInsideRect(this.car.rearLeft, r);
    },

    pointInsideRect(p, r) {
        return !(p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h);
    },

    carHitsEnvironment() {
        for (var i = 0; i < this.environment.length; i++) {
            var r = getEnvironmentRectangle(this.environment[i]);
            if (r && this.carInsideRect(r)) {
                return true;
            }
        }
        return false;
    },

    getHighScore() {
        this.highScore = parseInt(localStorage.getItem(HIGHSCORESTRING)) || 0;
    },

    setHighScore() {
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem(HIGHSCORESTRING, this.score);
            return true;
        }
        return false;
    },
}
</script>

        if (canvasIsLargeEnough()) {
            if (gameContext.gameState == GameState.IDLE) {
                gameContext.setGameState(GameState.PRESENTLEVEL);
            }
            else if (gameContext.gameState == GameState.PAUSED) {
                gameContext.setGameState(GameState.CONTINUING);
            }
            else if (gameContext.gameState == GameState.PAUSED_FOR_RESIZE) {
                gameContext.setGameState(gameStateToResumeAfterResize);
            }
        }
    });
    gameContext.setGameState(GameState.IDLE);
    handleResize(window.innerWidth, window.innerHeight);
    initInput(document);
    gameLoop();
}

getCanvasSize = () => {
    return { w: canvas.clientWidth, h: canvas.clientHeight };
}

canvasIsLargeEnough = () => {
    var { w, h } = getCanvasSize();
    return w >= 800 && h >= 800;
}

window.addEventListener('load', () => initialize()); 
</script>
