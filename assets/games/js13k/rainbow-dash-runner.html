<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Runner</title>
    <meta name="description" content="Unicorn running minigame! Collect stars and race down the rainbow road.">
    
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #fff2f9; 
            background-image: 
                radial-gradient(circle at top left, #ff9de2 0%, transparent 60%),
                radial-gradient(circle at top right, #72f5ff 0%, transparent 60%),
                radial-gradient(circle at bottom right, #ffe17d 0%, transparent 60%),
                radial-gradient(circle at bottom left, #ffb3c6 0%, transparent 60%); 
            touch-action: none;
        }
        .canvas-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #cloudCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #sparkleCanvas { z-index: 3; pointer-events: none; }
        #gameHUD {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none;
        }
        .hud-main-bar {
            display: flex; gap: clamp(16px, 4vw, 48px);
            background: rgba(30, 20, 40, 0.85); padding: 8px clamp(16px, 4vw, 48px);
            border-radius: 40px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 182, 215, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700; font-size: clamp(18px, 4.5vw, 32px); color: #ff9de2;
            backdrop-filter: blur(8px); align-items: center; white-space: nowrap;
        }
        #hudBestBadge {
            margin-top: 6px; background: rgba(25, 15, 35, 0.85);
            border: 2px solid rgba(255, 215, 0, 0.6); border-radius: 14px;
            padding: 6px 22px 7px 22px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: clamp(15px, 3.5vw, 20px); font-weight: 700; color: #ffe17d;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px);
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;
        }
        .hud-best-icon { width: clamp(24px, 5vw, 32px); height: clamp(24px, 5vw, 32px); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4)); margin-top: -2px; }
        .hud-item { display: flex; align-items: center; gap: clamp(8px, 2vw, 16px); }
        .hud-icon { width: clamp(28px, 6vw, 56px); height: clamp(28px, 6vw, 56px); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); margin: -4px 0; }
        .hud-icon.unicorn-icon { width: clamp(22px, 4.8vw, 38px); height: clamp(22px, 4.8vw, 38px); }
        .hud-icon.heart-icon { width: clamp(24px, 5.2vw, 40px); height: clamp(24px, 5.2vw, 40px); }
        #floatingContainer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 20; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .floating-toast {
            position: absolute; top: 35%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.94); border: 3px solid rgba(255, 182, 215, 0.8);
            border-radius: 40px; padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 28px);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 900;
            font-size: clamp(15px, 4.5vw, 24px); color: #ff006e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); backdrop-filter: blur(8px);
            display: flex; align-items: center; gap: clamp(8px, 2vw, 12px); text-align: center;
            max-width: min(90vw, 540px); animation: floatUpFade 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .floating-toast img { width: clamp(22px, 5.5vw, 32px); height: clamp(22px, 5.5vw, 32px); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2)); }
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(-50%) scale(0.85); }
            15% { opacity: 1; transform: translateY(-50%) scale(1); }
            75% { opacity: 1; transform: translateY(calc(-50% - 60px)) scale(1); }
            100% { opacity: 0; transform: translateY(calc(-50% - 120px)) scale(0.92); }
        }
        #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(20, 10, 30, 0.45); backdrop-filter: blur(4px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; text-align: center; padding: 20px;
        }
        #gameOverScreen h1 { font-size: clamp(32px, 7vw, 56px); color: #72f5ff; margin-bottom: 10px; text-shadow: 0 4px 20px rgba(114, 245, 255, 0.5); }
        #newRecordBanner { font-size: clamp(16px, 4vw, 24px); color: #ffe17d; font-weight: 800; margin-bottom: 15px; animation: pulse 1s infinite; min-height: 30px; }
        .stats-container {
            background: rgba(30, 20, 40, 0.75); border: 2px solid rgba(255, 182, 215, 0.4);
            border-radius: 24px; padding: 24px 40px; margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; flex-direction: column;
            gap: 16px; min-width: min(340px, 90vw); backdrop-filter: blur(8px);
        }
        .stat-row { display: flex; align-items: center; justify-content: space-between; font-size: clamp(18px, 4.5vw, 24px); gap: 24px; }
        .stat-label-group { display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: clamp(28px, 6vw, 36px); height: clamp(28px, 6vw, 36px); object-fit: contain; }
        .stat-label { color: #ff9de2; font-weight: 600; }
        .stat-value { color: #fff; font-weight: 700; }
        #restartHint { font-size: clamp(14px, 3vw, 18px); color: rgba(255, 255, 255, 0.85); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>

    <canvas id="cloudCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>

</div>

<script>
const [cloudCanvas, canvas, sparkleCanvas] = ['cloudCanvas', 'gameCanvas', 'sparkleCanvas'].map(id => document.getElementById(id));
const [cloudCtx, ctx, sparkleCtx] = [cloudCanvas, canvas, sparkleCanvas].map(c => c.getContext('2d'));

const [hudStarsElem, hudDistElem, hudLivesElem, hudBestElem] = ['hudStars', 'hudDist', 'hudLives', 'hudBest'].map(id => document.getElementById(id));
const [floatingContainer, gameOverScreen, gameOverTitle, statDist, statTopDist, distanceStatRow, newRecordBanner, restartHint] = 
    ['floatingContainer', 'gameOverScreen', 'gameOverTitle', 'statDist', 'statTopDist', 'distanceStatRow', 'newRecordBanner', 'restartHint'].map(id => document.getElementById(id));

const gameOverTitles = [
    "GREAT RUN! READY FOR THE NEXT?", "MAGNIFICENT DASH! KEEP IT UP!",
    "YOU SPARKLED BRIGHTLY TODAY!", "FANTASTIC EFFORT ON THE RAINBOW!", "STELLAR PERFORMANCE! TRY AGAIN?"
];

const objectiveMessages = [
    "Collect 100 stars to slow down time!", "Gather 100 stars to ease the pace!",
    "Grab 100 stars to trigger a slowdown!", "Collect 100 stars to catch your breath!", "Catch 100 stars to tame the rush!"
];

const ASSETS = Object.fromEntries(
    ['star', 'sparkle', 'redGate', 'greenGate', 'cloud', 'rainbow', 'unicorn', 'trophy', 'heart'].map(name => {
        const img = new Image();
        img.src = `assets/${name.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}.svg`;
        return [name, img];
    })
);

const ENTITY_SPEED = 0.1, SPAWN_INTERVAL = 0.5, RAINBOW_SPAWN_INTERVAL = 5.0;
const spawnLaneSequence = [0, 1, 2, 1];

let gameTime = 0, gameDistance = 0, collectedStars = 0, lastLifeMilestone = 0;
let globalSpeedMultiplier = 1.0, lives = 3, isGameOver = false, restartTimeout = null;
let topDistanceRecord = parseInt(localStorage.getItem('rainbowRunner_topDist') || '0', 10);

let shakeDuration = 0, shakeIntensity = 0, shakeOffsetX = 0, shakeOffsetY = 0;
let pendingMessages = [], messageQueueTimer = 0, spawnTimer = 0, rainbowTimer = 0, nextSpawnLaneIndex = 0;

const player = { lane: 1, currentX: 0, size: 160, facing: 'right', yOffset: 0, yVelocity: 0 };
const entities = [], particles = [];

const updateHUDRecord = () => hudBestElem.textContent = Math.max(topDistanceRecord, Math.floor(gameDistance));
updateHUDRecord();

const moveLeft = () => !isGameOver && player.lane > 0 && (player.facing = player.lane-- === 2 ? 'left' : 'right');
const moveRight = () => !isGameOver && player.lane < 2 && (player.facing = player.lane++ === 0 ? 'right' : 'left');
const jumpPlayer = () => !isGameOver && player.yOffset === 0 && (player.yVelocity = 650);

window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === 'arrowleft' || key === 'a') moveLeft();
    if (key === 'arrowright' || key === 'd') moveRight();
    if (['arrowup', 'w', ' '].includes(key)) jumpPlayer();
});

let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', (e) => {
    if (isGameOver) return restartGame();
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) dx > 0 ? moveRight() : moveLeft();
    else if (dy < -30) jumpPlayer();
}, { passive: true });

window.addEventListener('click', () => isGameOver && restartGame());

function createFloatingText(text, iconAsset = null) {
    const toast = document.createElement('div');
    toast.className = 'floating-toast';
    if (iconAsset?.src) {
        const img = document.createElement('img');
        img.src = iconAsset.src;
        toast.appendChild(img);
    }
    const textNode = document.createElement('span');
    textNode.textContent = text;
    toast.appendChild(textNode);
    floatingContainer.appendChild(toast);
    toast.addEventListener('animationend', () => toast.remove());
}

const createObjectiveText = () => createFloatingText(objectiveMessages[Math.floor(Math.random() * objectiveMessages.length)]);

function createStarBurst(x, y, count = 14, speedMult = 1, imgAsset = ASSETS.star) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4 - 0.2);
        const speed = (180 + Math.random() * 220) * speedMult;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            size: (20 + Math.random() * 25) * speedMult, alpha: 1.0,
            rotation: Math.random() * Math.PI * 2, vRot: (Math.random() - 0.5) * 8,
            life: 1.0, decay: (1.8 + Math.random() * 0.8) / speedMult, img: imgAsset
        });
    }
}

function resize() {
    [cloudCanvas, canvas, sparkleCanvas].forEach(c => { c.width = window.innerWidth; c.height = window.innerHeight; });
}
window.addEventListener('resize', resize);
resize();

const projection = {
    getCubeParams() {
        const w = canvas.width, h = canvas.height;
        return { size: Math.min(w, h) * 0.45, zBack: 25000, zFront: 150, fov: 400, cx: w / 2, cy: h * 0.38 };
    },
    project(ent, out = {}) {
        const p = this.getCubeParams();
        out.currentZ = p.zBack - (p.zBack - p.zFront) * ent.z;
        out.scale = p.fov / out.currentZ;
        out.x = (ent.x * p.size) * out.scale + p.cx;
        out.y = ((ent.yRel - 0.5) * p.size * 2) * out.scale + p.cy;
        return out;
    }
};

const getRandomFullSpanX = () => -2.5 + Math.random() * 5.0;
const getCloudSize = () => (120 + Math.random() * 100) * (window.innerWidth < 768 ? 3.5 : 9);

function spawnBackgroundEntities() {
    for (let i = 0; i < 200; i++) entities.push({ type: 'sparkle', x: getRandomFullSpanX(), yRel: Math.random(), z: Math.random(), size: 10 + Math.random() * 16, speed: ENTITY_SPEED });
    for (let i = 0; i < 100; i++) entities.push({ type: 'cloud', x: getRandomFullSpanX() * 10, yRel: 1.5 + Math.random() * 0.5, z: Math.random(), size: getCloudSize() * 1.5, speed: ENTITY_SPEED });
}
spawnBackgroundEntities();

function resetEntity(ent) {
    ent.z = 0.0;
    if (ent.type === 'sparkle') { ent.x = getRandomFullSpanX(); ent.yRel = Math.random(); ent.size = 10 + Math.random() * 16; } 
    else if (ent.type === 'cloud') { ent.x = getRandomFullSpanX() * 3; ent.yRel = 1.3 + Math.random() * 0.5; ent.size = getCloudSize(); }
}

function getPlayerBoundingBox() {
    const p = projection.getCubeParams();
    const origin = projection.project({ x: 0, yRel: 1.0, z: -5.0 });
    const front = projection.project({ x: player.currentX, yRel: 1.0, z: 1.0 });
    const screenY = canvas.height * 0.78 - player.yOffset;
    const t = (screenY - origin.y) / (front.y - origin.y);
    const screenX = origin.x + (front.x - origin.x) * t;
    
    player.size = Math.max(120, Math.min(264, p.size * 0.42));
    const w = player.size * (60 / 85);
    return {
        x: screenX - (w * 0.4),
        y: (screenY + (player.yOffset === 0 ? Math.sin(gameTime * 14) * 8 : 0) - (player.size / 2)) - (player.size * 0.4),
        width: w * 0.8, height: player.size * 0.8
    };
}

function triggerGameOver() {
    isGameOver = true;
    const finalDist = Math.floor(gameDistance);
    const isNewRecord = finalDist > topDistanceRecord;
    
    topDistanceRecord = Math.max(topDistanceRecord, finalDist);
    localStorage.setItem('rainbowRunner_topDist', topDistanceRecord);

    statDist.textContent = finalDist + ' m';
    statTopDist.textContent = topDistanceRecord + ' m';
    distanceStatRow.style.display = isNewRecord ? 'none' : 'flex';
    newRecordBanner.textContent = isNewRecord ? 'New Record Reached! Amazing Job!' : '';
    gameOverTitle.textContent = gameOverTitles[Math.floor(Math.random() * gameOverTitles.length)];
    gameOverScreen.style.display = 'flex';

    let countdown = 10;
    restartHint.textContent = `Restarting in ${countdown}s or click anywhere...`;
    const interval = setInterval(() => {
        if (--countdown > 0) restartHint.textContent = `Restarting in ${countdown}s or click anywhere...`;
        else clearInterval(interval);
    }, 1000);
    restartTimeout = setTimeout(restartGame, 10000);
}

function restartGame() {
    if (restartTimeout) clearTimeout(restartTimeout);
    gameOverScreen.style.display = 'none';
    topDistanceRecord = parseInt(localStorage.getItem('rainbowRunner_topDist') || '0', 10);
    gameTime = gameDistance = collectedStars = lastLifeMilestone = spawnTimer = rainbowTimer = messageQueueTimer = 0;
    globalSpeedMultiplier = 1.0; lives = 3; isGameOver = false;
    pendingMessages.length = entities.length = particles.length = 0;
    floatingContainer.innerHTML = '';
    spawnBackgroundEntities();
    updateHUDRecord();
    createObjectiveText();
}

function update(dt) {
    if (isGameOver) return;
    gameTime += dt;
    gameDistance += 2 * globalSpeedMultiplier * dt;

    if (pendingMessages.length > 0) {
        messageQueueTimer -= dt;
        if (messageQueueTimer <= 0) {
            const msg = pendingMessages.shift();
            createFloatingText(msg === '1up' ? '1 UP' : 'SLOW DOWN!', msg === '1up' ? ASSETS.heart : null);
            messageQueueTimer = 0.4;
        }
    }

    if (player.yOffset > 0 || player.yVelocity !== 0) {
        player.yVelocity -= 1800 * dt;
        player.yOffset = Math.max(0, player.yOffset + player.yVelocity * dt);
        if (player.yOffset === 0) player.yVelocity = 0;
    }

    if (shakeDuration > 0) {
        shakeDuration -= dt;
        shakeOffsetX = (Math.random() - 0.5) * 2 * shakeIntensity;
        shakeOffsetY = (Math.random() - 0.5) * 2 * shakeIntensity;
        if (shakeDuration <= 0) shakeOffsetX = shakeOffsetY = 0;
    }

    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    player.currentX += (((-size + (player.lane * laneWidth) + laneWidth / 2) / size) - player.currentX) * 15 * dt;

    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL / globalSpeedMultiplier) {
        spawnTimer -= SPAWN_INTERVAL / globalSpeedMultiplier;
        const laneIndex = spawnLaneSequence[nextSpawnLaneIndex];
        nextSpawnLaneIndex = (nextSpawnLaneIndex + 1) % spawnLaneSequence.length;
        const laneCenterX = (-size + (laneIndex * laneWidth) + laneWidth / 2) / size;
        const randRoll = Math.random();
        
        if (randRoll < 0.67) {
            entities.push({ type: 'star', lane: laneIndex, x: laneCenterX, yRel: 1.0 - ((laneWidth * 0.6) / (4 * size)), z: 0.0, size: laneWidth * 0.8, speed: ENTITY_SPEED });
        } else if (randRoll < 0.92) {
            entities.push({ type: 'gate', gateType: 'red', lane: laneIndex, x: laneCenterX, yRel: 1.0 - ((laneWidth * 0.75) / (4 * size)), z: 0.0, size: laneWidth * 0.75, speed: ENTITY_SPEED });
        } else {
            entities.push({ type: 'gate', gateType: 'green', lane: -1, x: 0, yRel: 1.0 - (size / (4 * size)), z: 0.0, size: size * 2, speed: ENTITY_SPEED });
        }
    }

    rainbowTimer += dt;
    if (rainbowTimer >= RAINBOW_SPAWN_INTERVAL / globalSpeedMultiplier) {
        rainbowTimer -= RAINBOW_SPAWN_INTERVAL / globalSpeedMultiplier; 
        entities.push({ type: 'rainbow', x: 0, yRel: 0.5, z: 0.0, speed: ENTITY_SPEED, passed: false });
    }

    const playerBox = getPlayerBoundingBox();

    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.z += ent.speed * globalSpeedMultiplier * dt;

        if (ent.type === 'star' && ent.z >= 0.82 && ent.lane === player.lane) {
            const p = projection.project(ent);
            const drawSize = ent.size * p.scale;
            if (playerBox.x < p.x + drawSize * 0.4 && playerBox.x + playerBox.width > p.x - drawSize * 0.4 && playerBox.y < p.y + drawSize * 0.4 && playerBox.y + playerBox.height > p.y - drawSize * 0.4) {
                collectedStars++;
                const isHundredth = collectedStars % 100 === 0;
                createStarBurst(p.x, p.y, isHundredth ? 28 : 14, isHundredth ? 1.8 : 1.0);

                if (Math.floor(collectedStars / 100) > lastLifeMilestone) {
                    lastLifeMilestone = Math.floor(collectedStars / 100);
                    lives++;
                    globalSpeedMultiplier = Math.max(0.2, globalSpeedMultiplier * 0.5);
                    pendingMessages.push('1up', 'slowdown');
                }
                entities.splice(i, 1);
                continue;
            }
        }

        if (ent.type === 'gate' && ent.z >= 0.82 && ((ent.gateType === 'red' && ent.lane === player.lane) || (ent.gateType === 'green' && player.yOffset < 10))) {
            const p = projection.project(ent);
            const drawW = ent.size * p.scale;
            const drawH = ent.gateType === 'red' ? drawW : (ent.size * 0.5) * p.scale;

            if (playerBox.x < p.x + drawW * 0.5 && playerBox.x + playerBox.width > p.x - drawW * 0.5 && playerBox.y < p.y + drawH * 0.5 && playerBox.y + playerBox.height > p.y - drawH * 0.5) {
                lives--;
                shakeIntensity = 25; shakeDuration = 0.45;
                createStarBurst(p.x, p.y, 45, 2.2, ent.gateType === 'red' ? ASSETS.redGate : ASSETS.greenGate);

                if (lives < 0 && !isGameOver) {
                    lives = 0;
                    setTimeout(triggerGameOver, 450);
                }
                entities.splice(i, 1);
                continue;
            }
        }

        if (ent.type === 'rainbow' && !ent.passed && ent.z >= 0.82) {
            const p = projection.project(ent);
            const drawW = 1400 * p.scale, drawH = 800 * p.scale;
            if (playerBox.x < p.x + drawW * 0.4 && playerBox.x + playerBox.width > p.x - drawW * 0.4 && playerBox.y < p.y + drawH * 0.4 && playerBox.y + playerBox.height > p.y - drawH * 0.4) {
                ent.passed = true;
                globalSpeedMultiplier *= 1.05;
                createFloatingText('SPEED UP!');
            }
        }

        if (ent.z >= 0) {
            const p = projection.project(ent);
            const drawSize = (ent.type === 'rainbow' ? 1400 : ent.size) * p.scale;
            const yExt = ent.type === 'cloud' ? drawSize * 0.25 : drawSize * 0.5;

            if (ent.z >= 1.0 || p.y - yExt > canvas.height + 100 || p.y + yExt < -100 || p.x + drawSize * 0.5 < -100 || p.x - drawSize * 0.5 > canvas.width + 100) {
                ['star', 'gate', 'rainbow'].includes(ent.type) ? entities.splice(i, 1) : resetEntity(ent);
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rotation += p.vRot * dt; p.life -= p.decay * dt;
        p.alpha = Math.max(0, p.life);
        if (p.life <= 0) particles.splice(i, 1);
    }

    hudStarsElem.textContent = collectedStars;
    hudDistElem.textContent = Math.floor(gameDistance);
    hudLivesElem.textContent = lives;
    updateHUDRecord();
}

function renderLanes() {
    const { size } = projection.getCubeParams();
    const laneWidth = (size * 2) / 3;
    const origin = projection.project({ x: 0, yRel: 1.0, z: -5.0 });
    const colors = [['rgba(255, 190, 11,', '#fb5607'], ['rgba(58, 134, 255,', '#8338ec'], ['rgba(255, 0, 110,', '#90003a']];

    for (let i = 0; i < 3; i++) {
        const xStart = -size + (i * laneWidth);
        const frontRight = projection.project({ x: (xStart + laneWidth) / size, yRel: 1.0, z: 1.0 });
        const frontLeft = projection.project({ x: xStart / size, yRel: 1.0, z: 1.0 });

        const extRight = frontRight.y >= canvas.height ? frontRight : { x: origin.x + (frontRight.x - origin.x) * ((canvas.height - origin.y) / (frontRight.y - origin.y)), y: canvas.height };
        const extLeft = frontLeft.y >= canvas.height ? frontLeft : { x: origin.x + (frontLeft.x - origin.x) * ((canvas.height - origin.y) / (frontLeft.y - origin.y)), y: canvas.height };

        const grad = ctx.createLinearGradient(origin.x, origin.y, (frontLeft.x + frontRight.x) / 2, (frontLeft.y + frontRight.y) / 2);
        grad.addColorStop(0.0, colors[i][0] + ' 0)');
        grad.addColorStop(0.1, colors[i][0] + ' 1)');
        grad.addColorStop(0.5, colors[i][1]);

        ctx.save();
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(extRight.x, extRight.y);
        ctx.lineTo(extLeft.x, extLeft.y);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

function renderPlayer() {
    const p = projection.getCubeParams();
    const origin = projection.project({ x: 0, yRel: 1.0, z: -5.0 });
    const front = projection.project({ x: player.currentX, yRel: 1.0, z: 1.0 });
    const screenY = canvas.height * 0.78 - player.yOffset;
    const screenX = origin.x + (front.x - origin.x) * ((screenY - origin.y) / (front.y - origin.y));
    
    player.size = Math.max(120, Math.min(264, p.size * 0.42));
    const h = player.size, w = h * (60 / 85);

    ctx.save();
    ctx.translate(screenX, screenY + (player.yOffset === 0 ? Math.sin(gameTime * 14 * Math.sqrt(globalSpeedMultiplier)) * 8 : 0));
    ctx.rotate(Math.sin(gameTime * 7) * 0.03);
    if (player.facing === 'left') ctx.scale(-1, 1);

    if (ASSETS.unicorn.complete && ASSETS.unicorn.naturalWidth) ctx.drawImage(ASSETS.unicorn, -w / 2, -h, w, h);
    else { ctx.fillStyle = '#ff006e'; ctx.beginPath(); ctx.arc(0, -h / 2, h / 4, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
}

function renderParticles() {
    particles.forEach(p => {
        const img = p.img || ASSETS.star;
        if (!img.complete || !img.naturalWidth) return;
        sparkleCtx.save();
        sparkleCtx.globalAlpha = p.alpha;
        sparkleCtx.translate(p.x, p.y);
        sparkleCtx.rotate(p.rotation);
        sparkleCtx.drawImage(img, -p.size * p.life / 2, -p.size * p.life / 2, p.size * p.life, p.size * p.life);
        sparkleCtx.restore();
    });
}

function render() {
    [cloudCtx, ctx, sparkleCtx].forEach((c, i) => {
        const canvases = [cloudCanvas, canvas, sparkleCanvas];
        c.clearRect(0, 0, canvases[i].width, canvases[i].height);
        c.save();
        c.translate(shakeOffsetX, shakeOffsetY);
    });

    renderLanes();
    entities.sort((a, b) => projection.project(b).currentZ - projection.project(a).currentZ);

    entities.forEach(ent => {
        if (ent.z < 0) return;
        const p = projection.project(ent);
        const targetCtx = ent.type === 'cloud' ? cloudCtx : (ent.type === 'sparkle' ? sparkleCtx : ctx);
        const bw = (ent.type === 'rainbow') ? 1400 * p.scale : ent.size * p.scale;
        const bh = (ent.type === 'rainbow') ? 800 * p.scale : (ent.type === 'cloud' ? bw * 0.5 : (ent.type === 'gate' && ent.gateType === 'green' ? (ent.size * 0.5) * p.scale : bw));
        
        targetCtx.save();
        if (['cloud', 'rainbow'].includes(ent.type)) targetCtx.globalAlpha = Math.max(0.0, Math.min(1.0, ent.z));
        const img = ASSETS[ent.type] || (ent.gateType === 'red' ? ASSETS.redGate : ASSETS.greenGate);

        if (img?.complete && img.naturalWidth) {
            targetCtx.drawImage(img, p.x - bw / 2, p.y - bh / 2, bw, bh);
        } else if (ent.type === 'cloud') {
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            targetCtx.beginPath();
            targetCtx.ellipse(p.x, p.y, bw / 2, bh / 2, 0, 0, Math.PI * 2);
            targetCtx.fill();
        }
        targetCtx.restore();
    });

    renderPlayer(); 
    renderParticles();
    [cloudCtx, ctx, sparkleCtx].forEach(c => c.restore());
}

let lastTime = 0, isTabPaused = false;
document.addEventListener('visibilitychange', () => {
    isTabPaused = document.hidden;
    if (!isTabPaused) lastTime = performance.now();
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (!isTabPaused) update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

createObjectiveText();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
