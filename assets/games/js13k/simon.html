<!DOCTYPE html>
<html lang="">
   <head>
      <meta charset="UTF-8">
      <title>Simon</title>

      <style>body {
 background-color:#2c3e50;   
}
.simon {

  width:600px;
  height:600px;
  margin: auto;

    -webkit-transition: all 10s ease-in-out;
    -moz-transition: all 10s ease-in-out;
    -o-transition: all 10s ease-in-out;
    transition: all 10s ease-in-out;
}

#sound{
	color:gray;
	text-decoration:none;
	font-family:"Arial", Helvetica, sans-serif;
}

.dialog {
    background-color: #bdc3c7;
    font-family:"Courier New", Courier, monospace;
    width: 270px;
    margin: 0 auto;
    text-align: center;
 
}

#intro,#fail,#win {
	padding-top:65px;
	font-family:"Arial", Helvetica, sans-serif;
    margin: 0 auto;   
    width: 80%;
    
}

#story {
	font-size:40px;
	height:430px;
	text-align:center;
}

#winText, #failText {
	font-size:45px;
	min-height:250px;
	text-align:center;
}

#play {
	font-size:90px;
	border-style:dashed;
	border-width:5px;
	border-color:#7f8c8d;
}

#lives {
    color:white;
    font-size: 3em;
    font-family:"Courier New", Courier, monospace;
}
#circle {
 height: 200px;
 width: 200px;
 border-radius: 300px 300px 300px 300px;   
 margin: 200px;
 position: absolute;
 background-color:black;
 color: white;
 text-align: center;
 line-height: 200px;
 font-size: 5em;
 font-family:"Courier New", Courier, monospace;
}

.tile {
	opacity: .4;
	-webkit-transition: opacity 250ms ease;
	-moz-transition: opacity 250ms ease;
	-ms-transition: opacity 250ms ease;
	-o-transition: opacity 250ms ease;
	transition: opacity 250ms ease;
}

#blue.tile.lit {
	opacity: 1;
    -webkit-box-shadow: 0px 0px 5px 5px rgba(0, 0, 255, 1);
    box-shadow: 0px 0px 5px 5px rgba(0, 0, 255, 1);
}
#green.tile.lit {
	opacity: 1;
    -webkit-box-shadow: 0px 0px 5px 5px rgba(0, 255, 0, 1);
    box-shadow: 0px 0px 5px 5px rgba(0, 255, 0, 1);
}
#red.tile.lit {
	opacity: 1;
    -webkit-box-shadow: 0px 0px 5px 5px rgba(255, 0, 0, 1);
    box-shadow: 0px 0px 5px 5px rgba(255, 0, 0, 1);
}
#yellow.tile.lit {
	opacity: 1;
    -webkit-box-shadow: 0px 0px 5px 5px rgba(255, 255, 0, 1);
    box-shadow: 0px 0px 5px 5px rgba(255, 255, 0, 1);
}


#red, #blue, #yellow, #green {
	height: 600px;
    width: 600px;
	border-radius: 300px 300px 300px 300px;
	position:absolute;
}

#red:hover, #blue:hover, #yellow:hover, #green:hover {
	border: 2px solid;
    opacity: .6;
}

#red {
    background-color:#e74c3c;
    clip: rect(0px, 600px, 300px, 300px);
	width: 600px;
}
#green {
    background-color: #2ecc71;
    clip: rect(300px,600px, 600px, 300px);
	width: 600px;
}
#blue {
    background-color: #3498db;
    clip: rect(0px, 300px, 300px, 0px);
	width: 600px;
}
#yellow {
    background-color: #f1c40f;
    clip: rect(300px, 300px, 600px, 0px);
	width: 600px;
}


#space, .stars {
  overflow: hidden;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.stars {
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 200px 200px;
  animation: zoom 5s infinite;
  opacity: 0;
}

.stars:nth-child(1) {
  background-position: 50% 50%;
  animation-delay: 0s;
}
.stars:nth-child(2) {
  background-position: 20% 60%;
  animation-delay: 1s;
}
.stars:nth-child(3) {
  background-position: -20% -30%;
  animation-delay: 2s;
}
.stars:nth-child(4) {
  background-position: 40% -80%;
  animation-delay: 3s;
}
.stars:nth-child(5) {
  background-position: -20% 30%;
  animation-delay: 4s;
}

@keyframes zoom {
  0% {
    opacity: 0;
    transform: scale(0.5);
    animation-timing-function: ease-in;
  } 
  85% {
    opacity: 1;
    transform: scale(2.8);
    animation-timing-function: linear;
  }
  100% {
    opacity: 0;
    transform: scale(3.5);
  }
}</style>
      <script>(function( global ) {

/*
 * Private stuffz
 */

var enharmonics = 'B#-C|C#-Db|D|D#-Eb|E-Fb|E#-F|F#-Gb|G|G#-Ab|A|A#-Bb|B-Cb',
  middleC = 440 * Math.pow( Math.pow( 2, 1 / 12 ), -9 ),
  numeric = /^[0-9.]+$/,
  octaveOffset = 4,
  space = /\s+/,
  num = /(\d+)/,
  offsets = {};

// populate the offset lookup (note distance from C, in semitones)
enharmonics.split('|').forEach(function( val, i ) {
  val.split('-').forEach(function( note ) {
    offsets[ note ] = i;
  });
});

/*
 * Note class
 *
 * new Note ('A4 q') === 440Hz, quarter note
 * new Note ('- e') === 0Hz (basically a rest), eigth note
 * new Note ('A4 es') === 440Hz, dotted eighth note (eighth + sixteenth)
 * new Note ('A4 0.0125') === 440Hz, 32nd note (or any arbitrary
 * divisor/multiple of 1 beat)
 *
 */

// create a new Note instance from a string
function Note( str ) {
  var couple = str.split( space );
  // frequency, in Hz
  this.frequency = Note.getFrequency( couple[ 0 ] ) || 0;
  // duration, as a ratio of 1 beat (quarter note = 1, half note = 0.5, etc.)
  this.duration = Note.getDuration( couple[ 1 ] ) || 0;
}

// convert a note name (e.g. 'A4') to a frequency (e.g. 440.00)
Note.getFrequency = function( name ) {
  var couple = name.split( num ),
    distance = offsets[ couple[ 0 ] ],
    octaveDiff = ( couple[ 1 ] || octaveOffset ) - octaveOffset,
    freq = middleC * Math.pow( Math.pow( 2, 1 / 12 ), distance );
  return freq * Math.pow( 2, octaveDiff );
};

// convert a duration string (e.g. 'q') to a number (e.g. 1)
// also accepts numeric strings (e.g '0.125')
// and compund durations (e.g. 'es' for dotted-eight or eighth plus sixteenth)
Note.getDuration = function( symbol ) {
  return numeric.test( symbol ) ? parseFloat( symbol ) :
    symbol.toLowerCase().split('').reduce(function( prev, curr ) {
      return prev + ( curr === 'w' ? 4 : curr === 'h' ? 2 :
        curr === 'q' ? 1 : curr === 'e' ? 0.5 :
        curr === 's' ? 0.25 : 0 );
    }, 0 );
};

typeof module !== 'undefined' && ( module.exports = Note );

/*
 * Sequence class
 */

// create a new Sequence
function Sequence( ac, tempo, arr ) {
  this.ac = ac || new AudioContext();
  this.createFxNodes();
  this.tempo = tempo || 120;
  this.loop = true;
  this.smoothing = 0;
  this.staccato = 0;
  this.notes = [];
  this.push.apply( this, arr || [] );
}

// create gain and EQ nodes, then connect 'em
Sequence.prototype.createFxNodes = function() {
  var eq = [ [ 'bass', 100 ], [ 'mid', 1000 ], [ 'treble', 2500 ] ],
    prev = this.gain = this.ac.createGain();
  eq.forEach(function( config, filter ) {
    filter = this[ config[ 0 ] ] = this.ac.createBiquadFilter();
    filter.type = 'peaking';
    filter.frequency.value = config[ 1 ];
    prev.connect( prev = filter );
  }.bind( this ));
  prev.connect( this.ac.destination );
  return this;
};

// accepts Note instances or strings (e.g. 'A4 e')
Sequence.prototype.push = function() {
  Array.prototype.forEach.call( arguments, function( note ) {
    this.notes.push( note instanceof Note ? note : new Note( note ) );
  }.bind( this ));
  return this;
};

// create a custom waveform as opposed to "sawtooth", "triangle", etc
Sequence.prototype.createCustomWave = function( real, imag ) {
  // Allow user to specify only one array and dupe it for imag.
  if ( !imag ) {
    imag = real;
  }

  // Wave type must be custom to apply period wave.
  this.waveType = 'custom';

  // Reset customWave
  this.customWave = [ new Float32Array( real ), new Float32Array( imag ) ];
};

// recreate the oscillator node (happens on every play)
Sequence.prototype.createOscillator = function() {
  this.stop();
  this.osc = this.ac.createOscillator();

  // customWave should be an array of Float32Arrays. The more elements in
  // each Float32Array, the dirtier (saw-like) the wave is
  if ( this.customWave ) {
    this.osc.setPeriodicWave(
      this.ac.createPeriodicWave.apply( this.ac, this.customWave )
    );
  } else {
    this.osc.type = this.waveType || 'square';
  }

  this.osc.connect( this.gain );
  return this;
};

// schedules this.notes[ index ] to play at the given time
// returns an AudioContext timestamp of when the note will *end*
Sequence.prototype.scheduleNote = function( index, when ) {
  var duration = 60 / this.tempo * this.notes[ index ].duration,
    cutoff = duration * ( 1 - ( this.staccato || 0 ) );

  this.setFrequency( this.notes[ index ].frequency, when );

  if ( this.smoothing && this.notes[ index ].frequency ) {
    this.slide( index, when, cutoff );
  }

  this.setFrequency( 0, when + cutoff );
  return when + duration;
};

// get the next note
Sequence.prototype.getNextNote = function( index ) {
  return this.notes[ index < this.notes.length - 1 ? index + 1 : 0 ];
};

// how long do we wait before beginning the slide? (in seconds)
Sequence.prototype.getSlideStartDelay = function( duration ) {
  return duration - Math.min( duration, 60 / this.tempo * this.smoothing );
};

// slide the note at <index> into the next note at the given time,
// and apply staccato effect if needed
Sequence.prototype.slide = function( index, when, cutoff ) {
  var next = this.getNextNote( index ),
    start = this.getSlideStartDelay( cutoff );
  this.setFrequency( this.notes[ index ].frequency, when + start );
  this.rampFrequency( next.frequency, when + cutoff );
  return this;
};

// set frequency at time
Sequence.prototype.setFrequency = function( freq, when ) {
  this.osc.frequency.setValueAtTime( freq, when );
  return this;
};

// ramp to frequency at time
Sequence.prototype.rampFrequency = function( freq, when ) {
  this.osc.frequency.linearRampToValueAtTime( freq, when );
  return this;
};

// run through all notes in the sequence and schedule them
Sequence.prototype.play = function( when ) {
  when = typeof when === 'number' ? when : this.ac.currentTime;

  this.createOscillator();
  this.osc.start( when );

  this.notes.forEach(function( note, i ) {
    when = this.scheduleNote( i, when );
  }.bind( this ));

  this.osc.stop( when );
  this.osc.onended = this.loop ? this.play.bind( this, when ) : null;

  return this;
};

// stop playback, null out the oscillator, cancel parameter automation
Sequence.prototype.stop = function() {
  if ( this.osc ) {
    this.osc.onended = null;
    this.osc.disconnect();
    this.osc = null;
  }
  return this;
};

typeof module !== 'undefined' && ( module.exports = Sequence );

global.Note = Note;
global.Sequence = Sequence;

}( typeof window !== 'undefined' ? window : this ) );
</script>

   <body>
      <div id="content">
         <a id="sound" href="javascript: toggleSound()" onclick="">Sound On</a>
         <div id="intro">
            <div id="story" style="color:white"></div>
            <div class="dialog" id="play" onClick="playStateInit();">Play</div>
         </div>
         <div id="gameState" style="display:none">
            <div id="space">
               <div class="stars"></div>
               <div class="stars"></div>
            </div>
            <div id="lives">Player Lives: </div>
            <div id="simon" class="simon">
               <div id="blue" class="tile"></div>
               <div id="red" class="tile"></div>
               <div id="green" class="tile"></div>
               <div id="yellow" class="tile"></div>
               <div id="circle"></div>
            </div>
         </div>
         <div id="fail" style="display:none">
            <div id="failText" style="color:white">
            
            </div>
            <div class="dialog" id="play" onClick="playStateInit();">Retry</div>
         </div>
          
        <div id="win" style="display:none">
            <div id="winText" style="color:white"> </div>
            <div class="dialog" id="play" onClick="playStateInit();">Again</div>
         </div>
      </div>
      <script>var ac = new AudioContext();
var tempo = 120;
var soundOn = true;

var simon = {
    health: 10,

    octave: 3,
    moves: [],
    
    isPresenting: false,

    timeouts: [],

    blue: document.getElementById("blue"),
    red: document.getElementById("red"),
    green: document.getElementById("green"),
    yellow: document.getElementById("yellow"),
    centerCircle: document.getElementById("circle"),


    init: function()
    {
        this.blue.onclick = padClicked;
        this.red.onclick = padClicked;
        this.green.onclick = padClicked;
        this.yellow.onclick = padClicked;
    },

    intro: function()
    {
        /*
        deg = 100;
        div = document.getElementById("simon");
        div.style.webkitTransform = 'rotate('+deg+'deg)'; 
        div.style.mozTransform    = 'rotate('+deg+'deg)'; 
        div.style.msTransform     = 'rotate('+deg+'deg)'; 
        div.style.oTransform      = 'rotate('+deg+'deg)'; 
        div.style.transform       = 'rotate('+deg+'deg)'; */

        this.isPresenting = true;
        if (soundOn == true)
        {
            var sequence = new Sequence(ac, tempo, ['E4 q', 'A4 q', 'E3 q', 'C#4 q']);
            sequence.loop = false;
            sequence.play();
        }
        that = this;
        this.lightPad(this.blue);
        setTimeout(function()
        {
            that.clearPads();
            that.lightPad(that.red);
            setTimeout(function()
            {
                that.clearPads();
                that.lightPad(that.green);
                setTimeout(function()
                {
                    that.clearPads();
                    that.lightPad(that.yellow);
                    setTimeout(function()
                    {
                        that.clearPads();
                        that.isPresenting = false;
                    }, 400);
                }, 400);
            }, 400);
        }, 400);



        playNote('E', '3', 'w', .2);
        playNote('A', '3', 'w', .2);
        playNote('E', '2', 'w', .2);
        playNote('C#', '3', 'w', .2);
    },

    newMove: function()
    {
        var potentialMoves = ["blue", "red", "green", "yellow"];
        this.moves.push(potentialMoves[Math.floor(Math.random() * 4)]);
    },

    presentMoves: function()
    {
        player.currentMove = 0;
        var i = 0;
        var that = this;
        this.isPresenting = true;
        var interval = setInterval(function()
        {
            if (i >= that.moves.length)
            {
                clearInterval(interval);
                that.clearPads()
                that.isPresenting = false;
            }
            that.clearPads();

            switch (that.moves[i])
            {
                case "blue":
                    playNote('E', that.octave, 'q');
                    that.lightPad(that.blue);
                    break;
                case "red":
                    playNote('A', that.octave, 'q');
                    that.lightPad(that.red);
                    break;
                case "green":
                    playNote('E', that.octave - 1, 'q');
                    that.lightPad(that.green);
                    break;
                case "yellow":
                    playNote('C#', that.octave, 'q');
                    that.lightPad(that.yellow);
                    break;
            }
            i++;

        }, 500);

    },
    clearPads: function()
    {
        this.blue.className = "tile";
        this.red.className = "tile";
        this.green.className = "tile";
        this.yellow.className = "tile";
    },

    lightPad: function(pad)
    {
        pad.className = pad.className + " lit";
    }


}

var player = {
    currentMove: 0,
    goingReverse: false,
    lives: 3,
    livesDiv: document.getElementById("lives"),

}

function padClicked(event)
{
    if (simon.isPresenting == false)
    {
        padClicked = event.target.id;
        simon.clearPads();
        if (player.currentMove == 0)
        {
            if (simon.moves[simon.moves.length - 1] == padClicked)
            {
                player.goingReverse = true;
            }
            else
            {
                player.goingReverse = false;
            }
        }
        if ((simon.moves[player.currentMove] == padClicked && player.goingReverse == false) || (simon.moves[simon.moves.length - player.currentMove - 1] == padClicked && player.goingReverse == true))
        {

            switch (padClicked)
            {
                case "blue":
                    playNote('E', simon.octave, 'q');
                    simon.lightPad(simon.blue);
                    break;
                case "red":
                    playNote('A', simon.octave, 'q');
                    simon.lightPad(simon.red);
                    break;
                case "green":
                    playNote('E', simon.octave - 1, 'q');
                    simon.lightPad(simon.green);
                    break;
                case "yellow":
                    playNote('C#', simon.octave, 'q');
                    simon.lightPad(simon.yellow);
                    break;
            }
            player.currentMove++;

            if (player.currentMove >= simon.moves.length)
            {
                setTimeout(function()
                {
                    if (player.goingReverse)
                    {
                        simon.health -= simon.moves.length;
                        if (simon.health <= 0)
                        {
                            winStateInit()
                            newGame();
                        }
                    }
                    updateUI();
                    simon.newMove();
                    simon.presentMoves();

                }, 200);
            }
        }
        else
        {
            simon.moves = [];
            player.currentMove = 0;
            player.lives -= 1;
            updateUI();
            playNote("F#", "1", 'q');
            if (player.lives < 0)
            {
                failStateInit();
            }
            else
            {
                setTimeout(function()
                {
                    simon.newMove();
                    simon.presentMoves();

                }, 400);
            }
        }
    }

}

function newGame()
{
    player.lives = 3;
    simon.moves = [];
    simon.health = 80;
    player.currentMove = 0;
    

    updateUI();

    //
    simon.newMove();
    simon.presentMoves();
}

function playNote(note, octave, length, gain)
{
    if (soundOn == true)
    {
        if (gain === undefined)
            gain = 1.0;
        var sequence = new Sequence(ac, tempo, [note + octave + " " + length]);
        sequence.gain.gain.value = gain;
        sequence.loop = false;
        sequence.play();
    }
}

function updateUI()
{
    player.livesDiv.innerHTML = "Player Lives: " + player.lives;
    simon.centerCircle.innerHTML = simon.health;
}


function storyDisplay(i, story, div, divParent)
{


    document.getElementById(div).innerHTML += story.charAt(i);
    i++;
    if (story.length > i && document.getElementById(divParent).style.display != "none")
    {
        delay = Math.floor(Math.random() * 100) + 25;
        if (story.charAt(i - 1) === ".")
        {
            playNote("B", "2", ".1", ".4");
            delay = 200;
        }
        else if (story.charAt(i - 1) === " ")
        {
            delay = 200;
        }
        else
        {
            playNote("C", "2", ".01", ".4");
        }
        setTimeout(storyDisplay, delay, i,story, div, divParent);
    }
}


function playStateInit()
{
    document.getElementById("gameState").style.display = "block";
    document.getElementById("intro").style.display = "none";
    document.getElementById("fail").style.display = "none";
    document.getElementById("win").style.display = "none"; 
    simon.intro();
    setTimeout(function()
    {
        //simon.init();
        newGame();
    }, 2200);
}

function storyStateInit()
{
    document.getElementById("intro").style.display = "bock";
    document.getElementById("gameState").style.display = "none";
    document.getElementById("story").innerHTML = "";
    var story = "Long ago a kids game was introduced onto the human populace.  In 1978 an electronic version of this game was introduced.  What was not known at the time was that this ‘game’ was created to condition humans to do as instructed by an extraterrestrial intelligence known as Simon commanded.   Today Simon has made his presence known and there is only one way to stop it… to beat him at his own game by doing the opposite of what SIMON SAYS. ";
    storyDisplay(0, story, "story", "intro");
    
}

function failStateInit()
{
    document.getElementById("intro").style.display = "none";
    document.getElementById("gameState").style.display = "none";
    document.getElementById("fail").style.display = "block";
    document.getElementById("win").style.display = "none"; 
    document.getElementById("failText").innerHTML = "";
    var story = "You have failed mankind.  Simon the omnipotent being has continued his journey to Earth unstopped. ";
    storyDisplay(0, story, "failText", "fail");
}

function winStateInit()
{
    document.getElementById("intro").style.display = "none";
    document.getElementById("gameState").style.display = "none";
    document.getElementById("fail").style.display = "none";
    document.getElementById("win").style.display = "block"; 
    document.getElementById("winText").innerHTML = "";
    var story = "With the nefarious Simon defeated Earth has been saved.  No longer do we have to look up at the sky and fear the dreaded chord of doom.";
    storyDisplay(0, story, "winText", "win");
}

function toggleSound()
{
    if (soundOn == true)
    {
        soundOn = false;
        document.getElementById("sound").innerHTML = "Sound Off";
    }
    else
    {
        soundOn = true;
        document.getElementById("sound").innerHTML = "Sound On";
    }

    return false;
}
simon.init();
storyStateInit();</script>
   </body>
