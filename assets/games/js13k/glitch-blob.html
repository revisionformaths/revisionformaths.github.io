    <style>*, *:before, *:after {
    position: relative;
    box-sizing: border-box;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    top: 0;
    left: 0;
}

*:before, *:after {
    content: "";
    display: block;
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 5;
}

.hide,
.level-1 .hide-level-1,
.level-2 .hide-level-2,
.level-3 .hide-level-3 { display: none !important; }

html, body {
    font-family: sans-serif;
    padding: 0;
    margin: 0;
    background: #000;
    height: 100%;
}

body.level-1:before {
    position: fixed;
    background: #aaa linear-gradient(90deg, transparent, transparent 50%, #bbb 50%, #bbb 51%, transparent 52%, transparent);
    background-size: 25% 100%;
    transform: translate3d(0, 0, 0);
}

body.level-1:after {
    position: fixed;
    background: radial-gradient(circle at 14% -14%, transparent 0%, rgba(0,0,0,0.7) 45%, #000 100%) 100% 100%;
    z-index: 20;
    opacity: 0.8;
    animation: flicker 8s linear infinite;
    transform: translate3d(0, 0, 0);
}

body.level-2:before {
    position: fixed;
    background-color: #eee;
    background-image: linear-gradient(45deg, cornflowerblue 25%, transparent 25%, transparent 75%, cornflowerblue 75%, cornflowerblue), linear-gradient(-45deg, cornflowerblue 25%, transparent 25%, transparent 75%, cornflowerblue 75%, cornflowerblue);
    background-size: 326px 326px;
    background-position: -80px -80px;
    z-index: 3;
    transform: translate3d(0, 0, 0);
}

body.level-2:after {
    position: fixed;
    height: 75vh;
    min-height: 600px;
    width: 100%;
    background: #fff;
    z-index: 4;
    top: auto;
    bottom: 4vh;
    transform: translate3d(0, 0, 0);
    background-image: linear-gradient(180deg, white, white 12%, #222 12%, #999 13.4%, #eee 15%, white 16%, transparent), radial-gradient(ellipse 150% 100% at 50% 32%, transparent 0%, rgba(0,0,0,0.8) 77%, #111 100%);
    border-radius: 0% 0% 15% 15%;
}

body.level-3 {
    background: #eee linear-gradient(44deg, rgba(0,0,0,0.1), rgba(0,0,0,0.14) 40%, #fff);
}

body.level-3:after {
    position: fixed;
    height: 15vh;
    width: 100%;
    background: #555;
    z-index: 4;
    top: auto;
    bottom: 0;
    transform: translate3d(0, 0, 0);
    background-image: linear-gradient(180deg, silver, silver 12%, #222 12%, #999 13.4%, #eee 15%, silver 16%, transparent), radial-gradient(ellipse 150% 100% at 50% 32%, transparent 0%, rgba(0,0,0,0.8) 77%, #111 100%);
}

.level-1 .extras {
    z-index: 5;
    position: fixed;
    height: 80vh;
    width: 80%;
    min-width: 880px;
    max-height: 700px;
    background: yellow;
    top: auto;
    left: auto;
    bottom: 0;
    transform: translate3d(0, 0, 0);
    background-image: linear-gradient(180deg, yellow, yellow 12%, rgba(0,0,0,0.9) 12%, rgba(0,0,0,0.8) 13.4%, rgba(0,0,0,0.7) 15%, yellow 16%, transparent);
    border-radius: 0;
    right: 0;
}

.level-1 .extras:after {
    position: absolute;
    height: 9.48vh;
    max-height: 84px;
    left: -7%;
    width: 8%;
    background: yellow;
    top: 0;
    border-radius: 30% 0 0 0;
    z-index: 4;
}


.level-3 .extras {
    z-index: 16;
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.level-3 .extras:before {
    height: 475px;
    width: 621px;
    background-image: linear-gradient(0deg, rgba(0, 100, 0, 1), rgba(88, 190, 218, 1) 11%, rgba(88, 190, 218, 0.4) 60%, rgba(88, 190, 218, 0.4) 89%, transparent 90%, transparent), linear-gradient(90deg, rgba(255, 255, 255, 0.3), transparent 5%, transparent 80%, rgba(255, 255, 255, 0.4));    top: auto;
    bottom: 15vh;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 3px 3px 5% 5%;
    border: 2px solid rgba(0,0,0,0.1);
    border-top-color: rgba(255,255,255,0.8);
    z-index: 9;
}

.level-3 .extras:after {
    height: 83%;
    width: 21px;
    background-image: linear-gradient(-90deg, rgba(255, 255, 255, 0.7), transparent 95%, rgba(255, 255, 255, 0.7));
    top: auto;
    bottom: 15vh;
    left: calc(50% - 238px);;
    transform: translateX(-50%) rotate(-14deg);
    border-radius: 20px;
    max-height: 800px;
}

.scene-wrap {
    height: 100%;
    width: 100%;
    font-size: 0;
    text-align: center;
}

.level-1 .scene-wrap:before {
    width: 5px;
    height: 40vh;
    border: 3px solid #796417;
    border-radius-bottom-left: 100%;
    left: 4vw;
    z-index: 14;
    background: #666;
    border-bottom: 130px solid #666;
    border-radius: 30px;
}

.scene-wrap:after {
    display: table-cell;
    position: relative;
    width: 0px;
    vertical-align: middle;
}

.scene {
    z-index: 5;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

.level-1 .scene:before {
    background: brown;
    width: 7vw;
    min-width: 80px;
    transform: rotate(20deg);
    right: 19%;
    height: 210%;
    left: auto;
    top: -12vw;
    background-image: linear-gradient(90deg, transparent, #000);
    z-index: 23;
}

.game {
    background: blue;
    height: 400px;
    width: 600px;
    margin: 0 auto;
    border-radius: 0;
    top: auto;
    z-index: 6;
    bottom: 18vh;
    position: absolute;
    left: 50%;
    transform: translate(-50%);
    overflow: hidden;
}

.level-1 .game {
    bottom: 8vh;
}

.game:before {
    z-index: 20;
    pointer-events: none;
    transform: translate3d(0, 0, 0);
}

.level-2 .game:before {
    display: none;
}

.game:after {
    z-index: 19;
    pointer-events: none;
    background-color: rgba(255,255,53,0.5);

}

.level-2 .game {
    background: #fff;
}

.level-2 .game:after {
    background-color: blue;
    opacity: 0.3;
    z-index: 1;
}

.level-3 .game,
.level-3 .game:after  {
    background: transparent;
}


.level {
    overflow: visible;
    height: 100%;
    border-radius: 0;
    cursor: pointer;

}

.level div {
    display: none;
}

.screen-glitch:before,
.screen-glitch *:before {
    background: linear-gradient(-45deg, black 25%, transparent 25%, transparent 50%, black 50%, black 75%, transparent 75%, transparent) !important;
    background-size: 42px 24px !important;
    animation: glitch-bg linear 0.001s infinite;
}

    <style>.title-screen {
    background: #000;
    color: #fff;
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 9000;
    top: 0;
    left: 0;
    overflow: hidden;
}

.title-screen.fade-out {
    opacity: 0;
}

.title-screen.hide {
    display: none;
}

.title-text {
    position: absolute;
    width: 100%;
    top: 50%;
    transform: translateY(-60%);
    text-align: center;
    z-index: 2;
}

.title-text > div {
    display: inline-block;
    font-size: 36px;
    font-size: 10vw;
    padding: 10px;
    transform: translateY(0);
}

.title-text > div:before {
    position: relative;
    opacity: 0;
}

.title-text.play > div:before {
    transition: 1s linear;
    opacity: 1;
}


.title-text .glitch:before {
    content: 'Glitch';
    animation: glitchJump3 3s linear infinite;
}

.title-text.stop .glitch:before {
    content: 'Glitch';
    /*transform: translateY(100vh);*/
}

.title-text .blob-text:before {
    content: 'Blob';
    -webkit-filter: drop-shadow(0px 0px 0px rgba(255,255,255,1));
}

.title-text.stop .blob-text:before {
    content: 'Blob';
    -webkit-filter: drop-shadow(0px 0px 0px rgba(255,255,255,1));
}

.title-text.play .blob-text:before {
    content: 'Blob';
    color: gold;
    text-shadow: 0 0 0.5vw rgba(255,215,0,1), 0 0 0.5vw rgba(255,215,0,1), 0 0 0.5vw rgba(255,215,0,1), 0 0 0.5vw rgba(255,215,0,1), 0 0 0.5vw rgba(255,215,0,1), 0 0 0.5vw rgba(255,215,0,1);
}

.title-text .play {
    display: block;
    width: 100%;
    font-size: 4vw;
    opacity: 0;
    top: 30px;
    cursor: pointer;
}


.title-text .play.show{
    animation: blink 2s linear infinite;
}

.haiku {
    text-align: center;
    height: 100%;
    width: 100%;
    z-index: 1;
    position: absolute;
    cursor: pointer;
    animation: glitchJump2 4s linear infinite;
}

.haiku:before,
.haiku:after {
    width: 100%;
    height: auto;
    top: 50%;
    position: absolute;
    transform: translateY(-50%);
    padding: 30px;
    font-size: 3vw;
    white-space: pre;
    line-height: 1.5;
}

.haiku.part-2:before {
    display: none;
}

.haiku:after {
    display: none;
}

.haiku.part-2:after {
    display: block;
}

.level-1 .haiku:before {
    content: 'Late night janitor,\A awaiting sweet thievable.\A Woah. Blobs poop monies!';
}

.level-1 .haiku:after {
    content: 'Damn these cameras! \A Night guard\'s caught me red-handed.\AKids need college, man.'
}

.level-2 .haiku:before {
    content: 'Home safe. Hi honey.\A Don\'t \'honey\' me. What is that?\A You know you can\'t lie.';
}

.level-2 .haiku:after {
    content: 'Unsurprising rage,\A so placate or die trying.\A A new pair of shoes?'
}

.level-3 .haiku:before {
    content: 'Pretty sure I\'m lost.\A I don\'t see this ending soon.\A Oh great. It\'s the fuzz.';
}

.level-3 .haiku:after {
    content: 'Doomed to rot in jail.\A But could blobs save all mankind?\A Time to make a deal.';
}

.win .haiku:before {
    content: 'Crisis averted.\A Still vague on a lot of things.\A I think that\'s okay.';
}

.win .haiku:after {
    content: 'A cold bed back home.\A Safe to say, I\'ve lost my job.\A *sigh* The end, I guess.';
}

.lose .haiku:before {
    content: 'Gosh, what a poor show.\A World\'s been taken by the glitch.\A What do I do now?';
}

.lose .haiku:after {
    content: 'Only a matter\A of time I suppose, until...';
}

.credits .haiku:before {
    content: 'Created by Jordan Watkins for js13k 2016';
}

.credits .haiku:after {
    content: 'Fin';
}

@keyframes blink {
    0% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

@keyframes glitchJump2 {
    0% {
        top: 0;
        left: 0;
    }

    29.85% {
        top: 0;
        left: 0;
    }
    29.9% {
        top: 300px;
        left: 100px;
    }
    30% {
        top: 0;
        left: 0;
    }

    59.85% {
        top: 0;
        left: 0;
    }
    59.9% {
        top: -200px;
        left: -1125px;
    }
    60% {
        top: 0;
        left: 0;
    }
    69.85% {
        top: 0;
        left: 0;
    }
    69.9% {
        left: 1125px;
        top: -150px;
    }
    70% {
        top: 0;
        left: 0;
    }
    99.85% {
        top: 0;
        left: 0;
    }
    99.9% {
        top: -150px;
        left: -1125px;
    }
    100% {
        top: 0;
        left: 0;
    }
}

@keyframes glitchJump3 {
    0% {
        transform: translate3d(0, 0, 0);
    }

    29.85% {
        transform: translate3d(0, 0, 0);
    }
    29.9% {
        transform: translate3d(150%, 100%, 0);
    }
    30% {
        transform: translate3d(0, 0, 0);
    }

    59.85% {
        transform: translate3d(0, 0, 0);
        left: 0;
    }
    59.9% {

        transform: translate3d(-150%, -200%, 0);
    }
    60% {
        transform: translate3d(0, 0, 0);
    }
    69.85% {
        transform: translate3d(0, 0, 0);
    }
    69.9% {
        transform: translate3d(-150%, 100%, 0);
    }
    70% {
        transform: translate3d(0, 0, 0);
    }
    99.85% {
        transform: translate3d(0, 0, 0);
    }
    99.9% {
        transform: translate3d(-150%, -200%, 0);
    }
    100% {
        transform: translate3d(0, 0, 0);
    }
}

.blob.glitch:before,
.blob.glitch:after {
    background: #fff;
    border: 5px solid #000;
}

.blob.glitch:before {
    top: 60%;
}


@keyframes glitchJump {
    0% {
        left: 0;
    }
    59.89% {
        left: 0;
    }
    59.9% {
        left: -25px;
    }
    60% {
        left: 0;
    }
    99.89% {
       left: 0;
    }
    99.9% {
        left: 25px;
    }
    100% {
        left: 0;
    }
}

.blob.blink:before,
.blob.blink:after,
.blob.ma.birthing:before,
.blob.ma.birthing:after {
    height: 1px;
    border: 0;
    top: 8px;
    width: 14px;
    background: #333;
}

@keyframes mouthY {
    0% {
        transform: scaleY(1);
    }
    50% {
        transform: scaleY(0.1);
    }
    100% {
        transform: scaleY(1);
    }
}


/* blob ma */
.blob.ma > div:after {
    border-radius: 100%;
    background: orange;
    transform: scale(1.6, 1.9);
    transform-origin: 50% 25%;
    z-index: 2;
}

.blob.birthing:not(.dead) > div:after {
    transform: scale(2.9, 3.5);
    transform-origin: 50% 25%;
    transition: transform 7s linear;
}

@keyframes birth {
    0% {
        transform: scale(1.6, 1.9);
        transform-origin: 50% 25%;
    }

    100% {
        transform: scale(2.9, 3.5);
        transform-origin: 50% 25%;
    }
}


/* blob eater */

.blob.eater,
.blob.eater *{
    background: transparent;
    z-index: 3;
}

.blob.eater:after {
    width: 0;
    height: 0;
    border: solid transparent;
    border-width: 55px 35px;
    border-bottom-color: red;
    transform: translate(-50%, -50%);
    border-radius: 0;
    background: none;
    left: 50%;
    top: -100%;
    z-index: 1;
}

.blob.eater:before {
    left: 0%;
    top: -55%;
}

.blob.right.eater:before {
    left: 45%;
}

.blob.eater > div {
    width: 10px;
    height: 20px;
    background: #000;
    border-radius: 100%;
    top: 8px;
    left: 5px;

    z-index: 2;
}

.blob.eater.hungry > div {
    animation: mouthX linear 0.4s infinite;
}

.blob.eater.right > div {
    left: 18px;
}


.blob.eater > div:before,
.blob.eater > div:after {
    background: #fff;
    border-radius: 50%;
    width: 4px;
    height: 4px;
    top: 5px;
    left: 0;
}

.blob.eater > div:after {
    top: 10px;
    right: 0;
    left: auto;
}

@keyframes mouthX {
    0% {
        transform: scaleX(1);
    }
    50% {
        transform: scaleX(0.1);
    }
    100% {
        transform: scaleX(1);
    }
}

/* blob transformer */
.blob.trans {
    width: 20px;
    height: 50px;
    background: lightblue;
}

.blob.trans:before,
.blob.trans:after {
    transform: scale(0.7, 0.7);
    transform-origin: -20% 0;
}

.blob.trans > div {
    position: absolute;
    width: 30px;
    height: 24px;
    top: calc(100% + 3px);
    left: -6px;
    transform: rotate(90deg);
    background: linear-gradient(135deg, red 25%, rgba(0,0,0,0) 25%), linear-gradient(225deg, red 25%, rgba(0,0,0,0) 25%), linear-gradient(315deg, red 25%, rgba(0,0,0,0) 25%), linear-gradient(45deg, red 25%, rgba(0,0,0,0) 25%);
    background-position: -4px -4px, -4px -4px, 0 -4px, 0 -4px;
    background-origin: padding-box;
    background-clip: border-box;
    background-size: 8px 8px;
    background-color: transparent;
}

.blob.trans > div:before,
.blob.trans > div:after {
    display: none;
}

<script>function addBlob(startPoint = {x: 200, y: 200}, subtype) {
  var blob = (blobPool.length > 0) ? blobPool.pop() : elFromString('<div><div/></div>');

  subtype = subtype || '';

  blob.active = true;
  blob.dead = false;
  blob.className = 'blob ' + subtype;
  blob.x = startPoint.x;
  blob.y = startPoint.y;
  blob.gameType = 'blob';
  blob.transforms = [];
  blob.width = 32;
  blob.height = 25;
  blob.hunger = 400 * Math.random();
  blob.blinkWait = blinkWait * Math.random();
  blob.growth = 0;
  blob.foodEaten = 0;
  blob.poopWait = Math.round(poopWait * Math.random());
  blob.birthWait = Math.round(birthWait + birthWait * Math.random());
  blob.deathWait = 800;
  blob.chaseWait = chaseWait;
  blob.subtype = subtype;

  if (!blob.inDom) {
    blobs.push(blob);
    elLevel.appendChild(blob);
    blob.inDom = true;
  }

  totalBlobs++;
  elBlobCount.innerHTML = totalBlobs;
}

function updateBlob() {
  if (blob.hunger < maxHunger && !blob.digesting) blob.hunger++;

  blobSpeed = 0.07 * delta;
  closeFoodDistance = 9999;
  closeFood = false;

  if (blob.dead) {
    wander();

    blob.deathWait--;

    if (blob.deathWait <= 0) {
      // Destroy blob
      blob.active = false;
      blob.className = '';
      blobPool.push(blob);
    }
  } else {
    blob.blinkWait--;

    if (blob.blinkWait <= 0) {
      blob.classList.add('blink');
      blob.blinkWait = blinkWait;

      setTimeout(function () {
        if (this.digesting !== true) {
          this.classList.remove('blink');
        }
      }.bind(blob), 300);
    }

    handleHunger();

    if (blob.closeFood && blob.closeFood.active) {
        chaseFood();
    } else {
      if (blob.digesting !== true) {
        wander();
      }

      blob.closeFood = null;
    }

    if (blob.subtype === 'ma') {
      tryBirth();
    } else if (blob.subtype !== 'trans') {
      tryPoop();
    }
  }

  move(blob);
}

function handleHunger() {
  if (blob.hunger > hungerLevel) {
    blob.classList.add('hungry');

    if (blob.hunger > hungerLevel * 2) blob.classList.add('very-hungry');

    if (blob.hunger > hungerLevel * 3) {
      blob.classList.add('dead');
      blob.dead = true;
      totalBlobs--;
      elBlobCount.innerHTML = totalBlobs;
    } else {
      blob.chaseWait--;

      if (blob.chaseWait === 0) {
        blob.chaseWait = chaseWait;

        if (blob.subtype === 'trans') {
          for (j = 0; j < poops.length; j++) {
            food = poops[j];

            if (!food.active || food.type !== 'raw-anti-glitch') continue;

            tryForCloserFood();
          }
        } else if (blob.subtype === 'eater') {
          for (j = 0; j < blobs.length; j++) {
            food = blobs[j];

            if (food === blob || food.subtype || !food.active) continue;

            tryForCloserFood();
          }
        } else {
          for (j = 0; j < activeFoods.length; j++) {
            food = activeFoods[j];

            tryForCloserFood();
          }
        }

        function tryForCloserFood() {
          distanceToFood = Math.abs((food.x - blob.x) + (food.y - blob.y));

          if (distanceToFood < closeFoodDistance) {
            closeFoodDistance = distanceToFood;
            blob.closeFood = food;
          }
        }
      }
    }
  }
}

function chaseFood() {
  var antiGlitch,
      tempY,
      tempX;

  if (blob.subtype === 'trans') {
    tempY = blob.y + blob.height * 3;
    tempX = blob.x + blob.width / 2 - 5;
  } else {
    tempY = blob.y + blob.height / 2;
    tempX = blob.x + blob.width / 2;
  }

  if (blob.closeFood.x + blob.closeFood.width / 2 < tempX - 1) {
    blob.x -= blobSpeed;
    blob.classList.add('left');
    blob.classList.remove('right');
  } else if (blob.closeFood.x + blob.closeFood.width / 2 > tempX + 1) {
    blob.x += blobSpeed;
    blob.classList.add('right');
    blob.classList.remove('left');
  }

  if (blob.closeFood.y + blob.closeFood.height / 2 < tempY - 1) {
    blob.y -= blobSpeed;
  } else if (blob.closeFood.y + blob.closeFood.height / 2 > tempY + 1) {
    blob.y += blobSpeed;
  }

  //if (boxesCollide(blob, blob.closeFood)) {
  if (boxesCollide({x: tempX, y: tempY, width: 4, height: 4}, {x: blob.closeFood.x + blob.closeFood.width / 2, y: blob.closeFood.y + blob.closeFood.height / 2, width: 4, height: 4})) {
    // eat food
    blob.hunger -= hungerLevel;
    blob.classList.remove('hungry', 'very-hungry');

    if (blob.growth < maxGrowth) {
      blob.foodEaten++;
      blob.wanderPt = null;

      if (blob.foodEaten === 2) {
        blob.foodEaten = 0;
        blob.growth++;

        if (blob.growth === 1) {
          blob.transforms = (blob.subtype === '') ? ['scale(1.2)'] : ['scale(1.1)'];
        } else {
          blob.transforms = (blob.subtype === '') ? ['scale(1.5)'] : ['scale(1.2)'];
        }
      }
    }

    if (blob.subtype === 'trans') {
      blob.closeFood.active = false;
      food.transforming = true;
      blob.digesting = true;
      blob.hunger = 0;
      blob.classList.add('blink');
      antiGlitch = blob.closeFood;

      setTimeout(function () {
        this.digesting = false;
        this.classList.remove('blink');

        antiGlitch.active = true;
        antiGlitch.type = 'pure-anti-glitch';
        antiGlitch.classList.add('pure-anti-glitch');
        antiGlitch.transforming = false;

        this.closeFood = null;
      }.bind(blob), 2000);
    } else {
      // Destroy food
      blob.closeFood.active = false;
      blob.closeFood.className = '';

      if (blob.subtype === 'eater') {
        totalBlobs--;
        blobPool.push(blob.closeFood);
      } else {
        foodPool.push(blob.closeFood);
      }
    }

    blob.closeFood = null;
  }
}

function tryPoop() {
  if (blob.growth > 0) {
    blob.poopWait--;

    if (blob.poopWait === 0) {
      blob.poopWait = poopWait;

      var poopType = (blob.growth === 2) ? 'gold' : 'silver';

      if (blob.subtype === 'eater') {
        poopType = 'raw-anti-glitch';
      }

      addPoop({
          x: blob.x,
          y: blob.y
      }, poopType);
    }
  }
}

function tryBirth() {
    blob.birthWait--;

    if (blob.birthWait === 0) {
      blob.classList.add('birthing');
      blob.birthWait = birthWait;


      setTimeout(function () {


        addBlob({
          x: this.x + this.width / 2,
          y: this.y + this.height * 2
        });

        this.classList.remove('birthing');
      }.bind(blob), 5000)
    }
}

function wander() {
  // wander
  blobSpeed = 0.01 * delta;

  blob.wanderPt = blob.wanderPt || {
    x: blob.x + 120 * Math.random() * ((Math.random() > 0.5) ? -1 : 1),
    y: blob.y + 120 * Math.random() * ((Math.random() > 0.5) ? -1 : 1)
  };

  if (blob.dead && blob.y - blobSpeed > 0) {
    blob.y -= blobSpeed;
  } else {
    if (blob.wanderPt.x < blob.x - 1 && blob.wanderPt.x > 0) {
      blob.x -= blobSpeed;
      blob.classList.add('left');
      blob.classList.remove('right');
    } else if (blob.wanderPt.x > blob.x + 1 && blob.wanderPt.x < 600) {
      blob.x += blobSpeed;
      blob.classList.add('right');
      blob.classList.remove('left');
    } else {
      blob.wanderPt.x = blob.x + 140 * Math.random() * ((Math.random() > 0.5) ? -1 : 1);
    }

    if (blob.wanderPt.y < blob.y - 1 && blob.wanderPt.y > 0) {
      blob.y -= blobSpeed;
    } else if (blob.wanderPt.y > blob.y + 1 && blob.wanderPt.y < 400) {
      blob.y += blobSpeed;
    } else {
      blob.wanderPt.y = blob.y + 140 * Math.random() * ((Math.random() > 0.5) ? -1 : 1);
    }
  }
}

<script>function elFromString(htmlString) {
    var div = document.createElement('div');

    if (htmlString) {
        div.innerHTML = htmlString;
    }

    return div.childNodes[0];
}

function move(el) {
  el.style.transform = 'translate3d(' + el.x + 'px, ' + el.y + 'px, 0) ' + el.transforms.join(' ');
}

function collectPoop(poop) {
  poop.active = false;
  poop.className = '';
  poopPool.push(poop);
}

function addFood(startPoint) {
  var food = (foodPool.length > 0) ? foodPool.pop() : document.createElement('div');

  food.active = true;
  food.className = 'food';
  food.x = startPoint.x;
  food.y = startPoint.y;
  food.gameType = 'food';
  food.transforms = [];
  food.width = 20;
  food.height = 15;

  if (!food.inDom) {
    foods.push(food);
    elLevel.appendChild(food);
    food.inDom = true;
  }
}

function addPoop(startPoint, type) {
  var poop = (poopPool.length > 0) ? poopPool.pop() : document.createElement('div');

  poop.x = startPoint.x;
  poop.y = startPoint.y;
  poop.active = true;
  poop.gameType = 'poop';
  poop.transforms = [];
  poop.width = 15;
  poop.height = 20;
  poop.type = type;

  setTimeout(function () {
    poop.className = 'poop';
    poop.classList.add(type);
  }, 30);


  if (!poop.inDom) {
    poops.push(poop);
    elLevel.appendChild(poop);
    poop.inDom = true;
  }
}

function boxesCollide(box1, box2) {
    if (box1 === box2) return false;

    return (
        box1.x < box2.x + box2.width &&
        box1.x + box1.width > box2.x &&
        box1.y < box2.y + box2.height &&
        box1.height + box1.y > box2.y
   );
}
</script>
<script>function update(timestamp) {
  delta = (lastFrameTimeMs) ? timestamp - lastFrameTimeMs: 0;

  lastFrameTimeMs = timestamp;

  if (!run) return;

  if (totalBlobs <= 0 && points < 100) {
    elBody.classList = 'lose';

    endLevel();
  }

  activeFoods = [];

  // update food
  foodSpeed = 0.05 * delta;

  for (i = 0; i < foods.length; i++) {
    food = foods[i];

    if (!food.active) continue;

    food.y += foodSpeed;

    if (food.y > 400) {
      food.active = false;
      food.className = '';
      foodPool.push(food);
    } else {
      move(food);
    }

    if (food.active) activeFoods.push(food);
  }

  // update poop
  poopSpeed = 0.05 * delta;

  for (i = 0; i < poops.length; i++) {
    poop = poops[i];

    if (!poop.active) continue;

    if (!poop.transforming) {
       poop.y += poopSpeed;
    }

    move(poop);

    if (poop.y > 400) {
      poop.active = false;
      poop.className = '';
      poopPool.push(poop);
    }

    if (poop.active) activePoops.push(poop);
  }

  // update blob
  for (i = 0; i < blobs.length; i++) {

    blob = blobs[i];

    if (!blob.active) continue;

    updateBlob();
  }

  //run = false;

  requestAnimationFrame(update);
}

<script>console.log('game start');

var delta, lastFrameTimeMs, closeFoodDistance, closeFood, distanceToFood, foodSpeed, blobSpeed, i, j, food, blob,
    elBody = document.body,
    elGame = document.querySelector('.game'),
    elLevel = document.querySelector('.level'),
    elPoints = document.querySelector('.points').children[0],
    elBlobCount = document.querySelector('.blob-count').children[0],

    blobs = [], foods = [], poops = [],
    activeFoods = [], activePoops = [],
    hungerLevel = 600, maxHunger = hungerLevel * 3 + 1, maxGrowth = 2,

var elTitleScreen = document.querySelector('.title-screen'),

titleScreen();

      blob.className = '';
      blobPool.push(blob);
    }
  });

  setTimeout(function () {
    elTitleScreen.classList.add('screen-glitch');

  setTimeout(function () {
    elTitleScreen.classList.remove('screen-glitch');
  }, 700);

  setTimeout(function () {
    elTitleText.classList.remove('stop');
    elTitleText.classList.add('play');
  }, 800);

  setTimeout(function () {
    elTitleScreen.classList.add('screen-glitch');
  }, 2200);

  setTimeout(function () {
    elTitleScreen.classList.remove('screen-glitch');
  }, 2400);

  setTimeout(function () {
    elBlobText.classList.add('screen-glitch');
  }, 2800);

  setTimeout(function () {
    elBlobText.classList.remove('screen-glitch');
    elPlay.classList.add('show');
  }, 3000);
}

elPoints.innerHTML = points;

onTap(elBody, tapActions);

onTap(elPlay, function (e) {

  setTimeout(function () {
    elTitleText.classList.add('hide');

  setTimeout(function () {

});

onTap(elHaiku, function (e) {

    setTimeout(function () {

    e.target.classList.add('part-2');
  } else {
    elHaiku.classList.remove('part-2');

    addBlob({x: 300, y: 240});

    if (!elBody.classList.contains('level-1')) {

    points = 30;
    elPoints.innerHTML = points;

    elTitleScreen.classList.add('hide');

    if (elBody.classList.contains('lose')) {
      elTitleScreen.classList.remove('hide');

    } else if (elBody.classList.contains('win')) {

function tapActions(e) {
  if (e.target.className === 'level') {
    if (points >= 2) {

      var rect = e.target.getBoundingClientRect();

      addFood({
        x: e.offsetX || e.targetTouches[0].pageX - rect.left - elBody.scrollLeft,

    }
  }

  run = true;
}

requestAnimationFrame(update);

function endLevel() {
  elBody.classList.add('screen-glitch');

  points = 130;
  totalBlobs = 0;

  blobs.forEach(function (blob) {
    if (blob.active) {
      blob.active = false;
      blob.className = '';
      blobPool.push(blob);
    }
  });

  setTimeout(function () {
    elHaiku.classList.remove('part-2');

    elTitleText.classList.add('hide');
    elTitleScreen.classList.remove('hide');

    if (elBody.classList.contains('lose')) {

    } else if (elBody.classList.contains('level-1')) {
      elBody.classList.remove('level-1');
      elBody.classList.add('level-2');
    } else if (elBody.classList.contains('level-2')) {
      elBody.classList.remove('level-2');
      elBody.classList.add('level-3');
    } else {
      elBody.classList.remove('level-3');
      elBody.classList.add('win');
    }

    elBody.classList.remove('screen-glitch');
  }, 200);
}


function onTap(el, callback) {
    var touched = false,
        tapCallback = handleTap();

    el.addEventListener('touchstart', tapCallback);
    el.addEventListener('click', tapCallback);

    return tapCallback;

    function handleTap() {
        return function (e) {
            // prevent click event event if triggering event was touchstart
            if (e.type === 'touchstart') {
                e.preventDefault();
                touched = true;
            } else if (touched === true) {
                touched = false;
                return false;
            }

            callback(e);
        };
    }
}
