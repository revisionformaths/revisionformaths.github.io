<!DOCTYPE html>
<html>
<head>
	<title>Color Switch</title>

<style>#myCanvas {
    padding-left: 0;
    padding-right: 0;
    margin:auto;
    display: none;
    border:4px solid;
    border-color: #d3d3d3;
    background-color: white;


}

#score{
	display: none;
	margin-top: auto;
	margin-bottom: auto;
	width: 100px;
	height: 70px;
	font-size: 50px;
}

#start{
	display: none;
}

#countdown{
	display:block;
	margin: auto;
	width: 50px;
	height: 20px;
	font-size: 20px;
	color: #F91208;

}

#levels{
	display: block;
}
#Rules{
	display: none;
}


body{
	background-color: #23D6D3;
}</style>

</head>
<body>
<h1 style="text-align: center;">Color Switch</h1>
<div id="levels" style="text-align: center;">
	<button id="level1" value="1" onclick="window.prepare_level(this)">LEVEL 1</button>
	<br><br>
	<button id="level2" value="2" onclick="window.prepare_level(this)">LEVEL 2</button>
	<br><br>
	<button id="level3" value="3" onclick="window.prepare_level(this)">LEVEL 3</button>
	
</div>
<div id="Rules" style="text-align: center;">
	<h3> Rules</h3>
	<ul>
		<li>Hit Backspace to change the direction of movement </li>
		<li>change the direction only when color of ball and ring are same</li>
	</ul>
</div> 
<div id="start" style="text-align: center;">Hit "enter" to start the game</div>
<div id="countdown"></div>
<canvas id="myCanvas" width="600" height="600">
Your browser does not support the HTML5 canvas tag.</canvas>

<div id="score"></div>


<script type="text/javascript">var c = document.getElementById("myCanvas");
var ctx = c.getContext("2d");
var multiplier=1;
var flag=0;
var sign=1;
//var speed_hero=40;
var speed_ring=70;
var level3;
//-------------------------------------------------------------------------------------------------



//contains property of ring
function Ring() {
    this.center = {
        'x': 300,
        'y': 300
    };
    this.radius = 200;
    this.inner_radius = 180;
    this.segments = 4;
    this.colors = ["red", "blue", "green", "yellow"];
    this.st_point = 0;
    this.draw = function(data) {
  
        var end_point = this.st_point + 0.5 * Math.PI;

        for (var i = 0; i < 4; i++) {

            ctx.beginPath();
            ctx.arc(this.center['x'], this.center['y'], this.radius, this.st_point, end_point);
            ctx.stroke();
            ctx.lineTo(this.center['x'], this.center['y']);
            ctx.fillStyle = this.colors[i];
            ctx.fill();

            ctx.beginPath();
            ctx.arc(this.center['x'], this.center['y'], this.inner_radius, this.st_point, end_point);
            ctx.stroke();
            ctx.lineTo(this.center['x'], this.center['y']);
            ctx.fillStyle = "white";
            ctx.fill();
            this.st_point = end_point;
            end_point = end_point + 0.5 * Math.PI;

        }
    this.move = function(para){
    	var dthetaR = para*(-Math.PI /speed_ring);
        if(level3)
    	this.st_point = this.st_point + sign*dthetaR;
        else
        this.st_point = this.st_point + dthetaR;

    }    
    };
}


//----------------------------------------------------------------------------------------------



//properties of hero


function Hero(params) {

    this.radius = 20;
    this.curr_track_col = 'yellow';
    this.theta = params['theta'];
    this.sense = 1;
    this.color = params['color'];
    this.center = {
        'x': 300 + Math.sin(this.theta),
        'y': 80 + (1 - Math.cos(this.theta))
    }
    this.draw = function() {
        ctx.beginPath();
        ctx.beginPath();
        ctx.arc(this.center['x'], this.center['y'], this.radius, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.fillStyle = this.color;
        ctx.fill();
    }
    this.move = function() {
        
        var dtheta = Math.PI / speed.spd;
        dtheta = dtheta * this.sense;
        this.center['x'] = 300 + (this.radius + ring.radius) * Math.sin(this.theta + dtheta);
        this.center['y'] = 80 + (this.radius + ring.radius) * (1 - Math.cos(this.theta + dtheta));
        this.theta = this.theta + dtheta;

    }

}


//-------------------------------------------------------------------------------------


//score function

function Score(value) {
	this.val = value ;
    this.draw = function() {
        ctx.font = "30px Arial";
        ctx.fillText("score :" + this.val, 10, 50);
    }
}

//---------------------------------------------------------------------------------------

function Speed(spd){
    this.spd = spd;
    this.draw = function(){
        ctx.font = "30px Arial";
        ctx.fillText("speed :" + (100-this.spd), 450, 40);
    }
}

//game function send ring and hero object and score to msin .js
function Game() {
    theta = 0;
    this.level;
    this.start = false;
    this.ring = new Ring();
    this.hero = new Hero({
        'color': "blue",
        'theta': 3*Math.PI/2
    });
    this.score = new Score(0);
    this.speed = new Speed(40);
    this.set_level = function(level) {
        document.getElementById("levels").style.display = "none";
        document.getElementById("start").style.display = "block";
        document.getElementById("Rules").style.display = "block";
        if(level==1){
            multiplier = 0;
            speed_ring = 50;
        }
        else
        {
            multiplier = 1;
            speed_ring = 70;

        }
        if(level == 3)
            level3=true;
    };
    return {
        'ring': this.ring,
        'hero': this.hero,
        'score': this.score,
        'speed': this.speed,
        'game' : this
    };



}
//-------------------------------------------------------------------------------------------</script>
<script type="text/javascript">document.onreadystatechange = function(){
if(true)
{
	
	var game_ele =  Game();
	var ring = game_ele['ring'];
	var hero = game_ele['hero'];
	var score = game_ele['score'];
	var speed = game_ele['speed'];
	var game = game_ele['game'];
	var colors = ["yellow","red","blue","green"];
	var checks = false;
	var signal=false;//for hit enter to start the game
	var speed_signal = false;
	var start =false;

	var x=document.getElementById("countdown");//for ready steady go
	ring.draw();
	hero.draw(speed.spd);


	//keeps track of spacebar hit
	var $body = document.body;
	$body.onkeypress = function(key){
	  
	};



	$body.onkeydown = function(key){
	   	if(key.which===98){
		speed.spd++;
		
		}
	};




	$body.onkeydown = function(key){
	   	if(key.which===104){
		speed.spd--;
		}
	};


	$body.onkeydown = function(key){
	   	if(key.which===27){
		if(signal)
			signal=false;
		else
			signal=true;
		}
	};




	//keeps track of enter hit (also for countdown)




	$body.onkeypress = function(key){
		    
		    if(key.which===32){
				hero.sense = -hero.sense;
				if(game.start == true)
				check(hero.curr_track_col);
				score.val++;
			}
		    
			if(key.which===13 && game.level != null){
				document.getElementById("start").style.display = "none";
				document.getElementById("Rules").style.display = "none";
				document.getElementById("myCanvas").style.display = "block";

				setTimeout(function(){ x.innerHTML="READY" }, 0);
		     	setTimeout(function(){ x.innerHTML="STEADY",x.style.color="#F9F908" }, 1000);
	    		setTimeout(function(){ x.innerHTML="GO",x.style.color="#23D62B" }, 2000);
	    		setTimeout(function(){ x.style.display="none"}, 3000);
	    		setTimeout(function(){ document.getElementById("score").style.display="block"}, 3000);
	    		setTimeout(function(){ signal=true; }, 3000);
	    		setTimeout(function(){ speed_signal=true; }, 3000);
	    		game.start = true;

			}
		};


	//repeatOften function---------------------------------------------------------------

	function repeatOften(){
		if(signal) {
			difference = ((simplify_angle(simplify_angle(hero.theta)-simplify_angle(ring.st_point))));
			hero.curr_track_col = cal_col(difference);
			if(hero.color == hero.curr_track_col)
				checks = true;

			if(checks==true){
			
				
				if(lost(hero.curr_track_col)){
				
					alert('lost');

					restart();
				}	
			}

			hero.move();
			ring.move(multiplier);
		    ctx.clearRect(0,0,600,600);}

		    if(speed_signal){
		    ctx.clearRect(400,0,200,60);
				speed.draw();
								}


			if (signal){

		    ring.draw();
		    hero.draw();
			score.draw();


			flag++;
			if(flag>160){
				flag=0;
				sign=-sign;
			}
		}
		requestAnimationFrame(repeatOften);

	}

		repeatOften();

	//--------------------------------------------------------------------------------


	function check(col) { 

		if(hero.color != col){
			game.start = false;
			alert("lost");
			restart();
		}
	  
		else{
			var randi=Math.floor(Math.random()*4)%4;
			if(hero.color==colors[randi])
				randi=(randi+1)%4;
			
			hero.color=colors[randi];
			goal_col = hero.color;
			checks = false;
		}

	}

	function simplify_angle(theta) {
		if(theta<0)
		{
		theta = theta*-1;
		theta = theta%( 2*Math.PI);
		theta = 2*Math.PI - theta;
		}
		else
		{
			theta = theta % (2*Math.PI);
		}
		return theta;
	}

	function lost(col) {    

	   if(col != hero.color)
	   	{
	   		checks=false;
	   		return true;
	   	}	
	   else
			return false;
	   
		
	}

	function restart(){

	    location.reload();
	}
	function cal_col(theta_diff) {
		col = (Math.floor(((2*theta_diff)/Math.PI)))%4;
		return colors[col];

	}	

	window.prepare_level = function(ele) {
		var	 level = ele.value;
		game.set_level(level);
		game.level = level;
		
	}

}
}
</script>

</body>
</html>
