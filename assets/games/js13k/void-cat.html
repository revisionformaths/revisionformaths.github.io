    <style>:root{--gw: 370px;--tkb: var(--b) 3px solid;--tnb: var(--b) 1.5px solid;--b: #000;--gyd: #727272;--gy: #b4b4b4;--w: #fff;--ph: rgb(255, 136, 195);--p: #ffddee;--pd: #b384d4;--t: #96e4d2;--grn: #a2ea5e;--yl: rgb(248, 248, 71);--o: rgb(254, 180, 43);--red: rgb(249, 63, 63);--cat-z: 100000;--atk-z: 100001}body{margin:0;height:100vh}main{height:calc(100vh - 24px);font-family:monospace;margin:0 auto;padding:12px 0;background:#e3c5f8}button{background:var(--w);border:var(--tkb);border-radius:10px;cursor:pointer;font-family:monospace;font-size:24px}button:focus{outline:5px solid var(--ph)}button:disabled{cursor:not-allowed}.top{display:flex;align-items:flex-end;justify-content:space-between;width:100%}.top .phd{width:160px}.middle{display:flex;justify-content:space-between;width:100%}.middle .phd,.drama{width:100%;margin:0 12px 36px 24px}.drama{outline:var(--tnb);border-radius:10px;background:var(--w);overflow-y:scroll;height:calc(var(--gw) + 24px);font-size:16px}.drama div{padding:24px;line-height:24px;border-bottom:var(--tnb)}#sg,#si{display:flex;align-items:center;justify-content:center;flex-direction:column}#sg{display:none}#si{text-align:center;margin:0;padding:36px 48px}#sit{font-size:124px;margin:32px 0}#sib{padding:24px}#meters{display:flex;justify-content:space-between;width:var(--gw);margin:0 auto 12px}.meter{text-align:center;min-width:60px;font-size:16px;font-weight:700}.meter p{margin:6px 0}.mn{display:flex;justify-content:center;padding:12px;border:var(--tkb);border-radius:10px;font-size:24px;font-weight:400}.turn .mn{background:var(--t)}.energy .mn{background:var(--grn)}.money .mn{background:var(--yl)}.calories .mn{background:var(--o)}#next-holder{text-align:right;margin:0 12px 12px 0}#next-holder button{padding:12px}.warning{animation:warning-kf 2s infinite}@keyframes warning-kf{0%{background:var(--w)}50%{background:var(--t)}}.attn{animation:attn-kf .6s ease}@keyframes attn-kf{0%{transform:scale(1) rotate(0);filter:brightness(100%)}20%{transform:scale(1.2) rotate(-2deg);filter:brightness(110%)}40%{transform:scale(1.2) rotate(2deg);filter:brightness(110%)}60%{transform:scale(1.1) rotate(-1deg);filter:brightness(105%)}80%{transform:scale(1.05) rotate(1deg);filter:brightness(102%)}to{transform:scale(1) rotate(0);filter:brightness(100%)}}.st-attn{animation:st-attn-kf .4s ease}@keyframes st-attn-kf{0%{transform:scale(1);filter:brightness(100%)}25%{transform:scale(1.1);filter:brightness(110%)}50%{transform:scale(1.1);filter:brightness(110%)}75%{transform:scale(1.05);filter:brightness(105%)}to{transform:scale(1);filter:brightness(100%)}}#grid{display:grid;gap:6px;padding:12px;border-radius:12px;margin:0 auto 32px;background:var(--pd);outline:var(--tnb)}.tile{outline:var(--tnb);display:flex;justify-content:center;align-items:center;border-radius:5px;font-size:48px}.attack:after{content:"";background:var(--red);opacity:50%;display:block;width:100%;border-radius:5px;aspect-ratio:1/1;position:relative;z-index:var(--atk-z);transition:opacity .3s ease}.attack.attacking:after{opacity:1}.floor{background:var(--t)}.grass{background:var(--grn)}.street{background:var(--gyd)}.space{background:var(--b);background-image:radial-gradient(var(--w) 1px,transparent 1px),radial-gradient(var(--gy) 1px,transparent 1px),radial-gradient(var(--p) 1px,transparent 1px);background-size:80px 50px,80px 80px,120px 40px;background-position:0 0,20px 20px,40px 60px;animation:star 90s linear infinite}@keyframes star{0%{background-position:0 0,20px 20px,40px 60px}to{background-position:500px 0,200px 20px,300px 60px}}.thing{position:absolute;display:flex;justify-content:center;align-items:center}.coin{width:30px;height:30px;font-size:16px;box-shadow:var(--o) -2px 1px;background:var(--yl);color:var(--red);border-radius:100%;font-weight:700}.planet{width:50px;height:50px;border-radius:100%;box-shadow:inset -8px -5px 15px var(--b)}.planet-1{background:linear-gradient(to bottom right,var(--o),var(--red))}.planet-2{background:linear-gradient(to bottom right,var(--p),var(--pd))}.planet-3{background:var(--grn)}#cat{position:relative;width:200px;height:300px;border-radius:50%/55%;background:var(--b);zoom:40%;transition:left .5s,top .5s,height .5s;z-index:var(--cat-z)}#cat.longcat{height:475px}#cat.nap{height:160px}.ear{position:absolute;width:40px;height:40px;background:var(--b);clip-path:polygon(50% 0%,0% 100%,100% 100%);top:-9px}.ear.left{left:10px;transform:rotate(-44deg);transition:left .5s}#cat.longcat .ear.left{left:23px}.ear.right{right:10px;transform:rotate(44deg);transition:right .5s}#cat.longcat .ear.right{right:23px}.face{position:relative;top:-16px}.eye{position:absolute;width:30px;height:16px;background:var(--grn);border-radius:50%;top:45px}.eye:after{content:"";position:absolute;width:12px;height:20px;background:#000;border-radius:50%;top:-2px;left:9px}.eye.left{left:59px}.eye.right{right:59px}.nose{position:absolute;background:var(--p);width:9px;height:5px;top:63px;left:95px;border-radius:5px}.smile{position:absolute;width:25px;height:12px;border-bottom:3px solid var(--ph);border-radius:0 0 60px 60px;top:68px;left:50%;transform:translate(-50%)}.paw{position:absolute;width:40px;height:60px;background:#000;border-radius:50%;border:3px solid var(--gyd)}.paw.front-left{top:100px;left:30px;transform:rotate(-30deg)}.paw.front-right{top:100px;right:20px;transform:rotate(21deg)}.paw.back-left{bottom:20px;left:40px;transform:rotate(-10deg)}.paw.back-right{bottom:20px;right:40px;transform:rotate(10deg)}.glowing{box-shadow:0 0 66px 16px var(--ph)}#card-holder,#cards-rotators{display:flex;gap:32px}.card,.arrow{align-items:center;background:var(--w);border-radius:10px;border:8px solid var(--t);cursor:pointer;display:flex;font-size:16px;flex-direction:column;height:190px;justify-content:space-between;outline:var(--tkb);padding:12px;text-align:center;width:160px}.arrow{font-size:100px;line-height:50px}.card:focus{outline-width:10px}.stats{display:flex;width:100%;gap:12px;justify-content:space-between}.stats div{background:var(--o);padding:12px 16px;border-radius:4px;outline:var(--tkb);font-size:24px;line-height:24px}.stats div:nth-child(2){background:var(--grn)}
</style>
  </head>
  <body>
    <main>
      <section id="sg">
        <div class="top">
          <div class="phd"></div>
          <div id="meters">
            <div class="meter calories">
              <p>Cals</p>
              <div class="mn">0</div>
            </div>
            <div class="meter money">
              <p>Money</p>
              <div class="mn">0</div>
            </div>
            <div class="meter energy">
              <p>Energy</p>
              <div class="mn">
                <span class="nmr">5</span>/<span class="dnr"
                  >5</span
                >
              </div>
            </div>
            <div class="meter turn">
              <p>Turn</p>
              <div class="mn">
                <span class="nmr">1</span>/<span class="dnr"
                  >5</span
                >
              </div>
            </div>
          </div>
          <div id="next-holder">
            <button class="next">Next turn</button>
          </div>
        </div>
        <div class="middle">
          <div class="phd"></div>
          <div id="grid">
            <div id="cat"></div>
          </div>
          <div class="drama"></div>
        </div>
        <div id="cards-rotators">
          <button class="card arrow left">
            <div>↻</div>
            <div class="stats">
              <div>0</div>
              <div>1</div>
            </div>
          </button>
          <div id="card-holder"></div>
          <button class="card arrow right">
            <div>↺</div>
            <div class="stats">
              <div>0</div>
              <div>1</div>
            </div>
          </button>
        </div>
      </section>

      <section id="si">
        <p id="sit"></p>
        <button
          id="sib"
          class="next"
        ></button>
      </section>
    </main>
  </body>
</html>
