<!DOCTYPE HTML>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>body{
  font-family:sans-serif;
}

#disc,#edit{
  background:lightblue;
}

canvas{
  max-width:100%;
  max-height:100%;
  position:absolute;
  top:0;
  left:0;
  display:none;
}

#levels,#help,#speed,#menu,#size,#number{
  position:absolute;
  top:0;
  left:0;
  height:100vw;
  width:100vw;
  max-height:100vh;
  max-width:100vh;
  overflow:auto;
  display:none;
}

#levels{
  display:block;
  background:#b71;
}

#levels>div[id]{
  width:20%;
  height:20%;
  position:relative;
  float:left;
  counter-increment:num;
  cursor:pointer;
  background:lightblue;
  border-radius:5px;
}

#levels>div[id]:before{
  content:counter(num);
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  text-align:center;
  font-size:15vh;
  line-height:15vh;
  box-sizing:border-box;
}

#levels>div[id]:after{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:5vh;
  line-height:4vh;
  font-size:4vh;
  text-align:center;
}

#levels>div[id][class]{
  background:darkblue;
}

.s1:after{
  content:">";
}
.s2:after{
  content:">>";
}
.s3:after{
  content:">>>";
}

#help{
  display:none;
  background:silver;
  overflow:auto;
}
#helpClose{
  position:absolute;
  top:5px;
  left:5px;
  cursor:pointer;
  z-index:2;
}
#helpIcon{
  position:absolute;
  top:0;
  right:-16%;
  width:5vh;
  height:5vh;
  line-height:5vh;
  font-size:5vh;
  cursor:pointer;
}
#help>.row{
  width:70%;
  padding-left:30%;
  position:relative;
  margin-bottom:10px;
  min-height:100px;
}
#help img{
  display:block;
  width:auto;
  height:auto;
  max-width:25%;
  max-height:100%;
  left:1%;
  top:0;
  position:absolute;
}
#speed{
  display:none;
  background:silver;
}
#speed label{
  width:25%;
  margin-top:40%;
  height:60%;
  text-align:center;
  dispaly:block;
  font-size:5vh;
  float:left;
}
#speed  button{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:10px;
}

.header{
  width:75%;
  margin:0 auto;
  position:relative;
  text-align:center;
  clear:both;
  float:none;
  height:15vh;
}

.header div{
  float:left;
  width:calc(100% / 7);
  position:absolute;
  line-height:15vh;
  font-size:10vh;
  color:lightblue;
  animation:10s infinite linear alternate;
}

#h1{
  left:calc(100%/7*0);
  animation-name:h1;
}
#h2{
  left:calc(100%/7*1);
  animation-name:h2;
}
#h3{
  left:calc(100%/7*2);
  animation-name:h3;
}
#h4{
  left:calc(100%/7*3);
}
#h5{
  left:calc(100%/7*4);
  animation-name:h5;
}
#h6{
  left:calc(100%/7*5);
  animation-name:h6;
}
#h7{
  left:calc(100%/7*6);
  animation-name:h7;
}
@keyframes h1{
    30%{left:calc(100%/7*0);}
    70%{left:calc(100%/7*6);}
    100%{left:calc(100%/7*6);}
}
@keyframes h2{
    30%{left:calc(100%/7*1);}
    70%{left:calc(100%/7*5);}
    100%{left:calc(100%/7*5);}
}
@keyframes h3{
    30%{left:calc(100%/7*2);}
    70%{left:calc(100%/7*4);}
    100%{left:calc(100%/7*4);}
}
@keyframes h5{
    30%{left:calc(100%/7*4);}
    70%{left:calc(100%/7*2);}
    100%{left:calc(100%/7*2);}
}
@keyframes h6{
    30%{left:calc(100%/7*5);}
    70%{left:calc(100%/7*1);}
    100%{left:calc(100%/7*1);}
}
@keyframes h7{
    30%{left:calc(100%/7*6);}
    70%{left:calc(100%/7*0);}
    100%{left:calc(100%/7*0);}
}

#editIcon{
  position:absolute;
  top:0;
  left:-16%;
  width:5vh;
  height:5vh;
  line-height:5vh;
  font-size:5vh;
  cursor:pointer;
  display:none;
}
#number{
  background:silver;
}
#number select{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
}
#number  button{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:10px;
}

#menu{
  background:silver;
}

#menu canvas{
  display:block;
  width:auto;
  height:auto;
  max-width:23%;
  margin:1%;
  position:relative;
  float:left;
  cursor:pointer;
}

#size{
  background:silver;
}
#size label{
  width:33.333%;
  height:33.33%;
  text-align:center;
  dispaly:block;
  font-size:5vh;
  float:left;
}
#size  button{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:10px;
}</style>

<script type="text/javascript">/*

R:up/right

b:border

/*

p:position

E:Entry/Exit

M:menu

D:dimensions

levels=[
'0242*335es3e',
'0272*665s3es2esese4se2s2es3es2e3ses',
'0110*33leR3eleL',
'0226*5515et2eL6e',
'0141*33reR3eleL',
'0262,5056,0363*55s13es5es3es',
'0263,0556*55sr2elet2e5eleR3e4es'
];


help=[
'e*Choose a level to begin playing. Click on an edge to reverse a column or row and try to get the discs to the matching squares. If you complete all the levels there is a bonus.'+
   'If that is to hard/long run `editor()` in the console.',
's*Run into this and the game ends.',
't*Run into this and you will bounce in the opposite direction',

'P*Start game',
'S*Set the game speed',
'X*Go back to menu',
'O*Reset the board'

<script type="text/javascript">function q(a){return document.getElementById(a)}
img={e:0};
COLORS=['red','green','blue'];
state={
  stopped:true,
  ended:false,
  width:0,
  height:0,
  arr:[],
  discs:[],
  speeds:[.05,.1,.3,.5],
  speed:2,
  id:0
}
edit={
  
}
/****************************\
EDITOR
\****************************/

function parseEdit(str){
  edit.points=[];
  str=str.split('*');
  var start=str[0].split(','),
  str=str[1],
  width=+str[0],
  l=height=+str[1],
  arr=[],
  i=2,
  j=0,
  d=0,
  c;
  while(l--){
    arr.push([]);
  }
  l=str.length;
  for(;i<l;i++){
    c=str[i];
    if(/\d/.test(c)){
      if(d){
        d+=''+c;
      }
      else{
        d=c-0;
      }
    }
    else{
      if(d){
        while(d--){
          arr[Math.floor(j/width)][j++%width]=c;
        }
      }
      else{
        arr[Math.floor(j/width)][j++%width]=c;
      }
      d=0;
    }
  }
  l=height,i=0;
  for(;i<l;i++){
    arr[i].unshift('b');
    arr[i].push('b');
  }
  c='bbbbbbbbb'.substring(0,width);
  arr.unshift(('c'+c+'N').split(''));
  arr.push(('B'+c+'D').split(''));
  edit.width=width+2;
  edit.height=height+2;
  edit.arr=arr;
  //Add discs
  if(start[0]){
    start.map(function(v,i){
      edit.points.push([+v[0],+v[1]]);
      if(v[2]!==undefined){
        edit.points.push([+v[2],+v[3]]);
      }
    });
  }
  else{
    
  }
  editE();
  drawEdit();
}

function editE(){
  var l=edit.points.length,col=COLORS[Math.floor(l/2)],c=edit.E.getContext('2d');
  c.fillStyle='#b71';
  c.fillRect(10,10,180,180);
  if(l>6)return;
  c.lineWidth=5;
  c.fillStyle=col;
  c.strokeStyle=col;
  if(l%2){
    c.strokeRect(50,50,100,100);
  }
  else{
    c.beginPath();
    c.arc(100,100,50,0,Math.PI*2);
    c.fill();
  }
}

function drawEdit(){
  var w=edit.width,h=edit.height,a=edit.arr,cw=1e3/w,ch=1e3/h,e=q('edit'),c=e.getContext('2d'),i=x=y=0,l=w*h,b;
  c.clearRect(0,0,1e3,1e3);
  //grid
  for(;i<l;i++){
    x=i%w;
    y=Math.floor(i/w);
    b=img[a[y][x]];
    if(b)c.drawImage(b,x*cw,y*ch,cw,ch);
  }
  
  //entry exit points
  edit.points.map(function(v,i){
    var col=COLORS[Math.floor(i/2)];
    c.lineWidth=5;
    c.fillStyle=col;
    c.strokeStyle=col;
    if(i%2){
      c.strokeRect(v[0]*cw+cw/4,v[1]*ch+ch/4,cw/2,ch/2);
    }
    else{
      c.beginPath();
      c.arc(v[0]*cw+cw/2,v[1]*ch+ch/2,cw/4,0,Math.PI*2);
      c.fill();
    }
  });
  
  
}
function reducePoints(x,y){
  var arr=[],test=false;
  edit.points=edit.points.filter(function(v){
    if(test){
      return false;
    }
    else if(v[0]==x&&v[1]==y){
      test=true;
      return false;
    }
    else{
      return true;
    }
  });
}
function saveEdit(){
  var arr=edit.arr,l=edit.width-2,str='',e=document.createElement('div');
  edit.points.map(function(v,i){
    if(!(i%2)){
      str+=',';
    }
    str+=v[0]+''+v[1];
  });
  str=str.slice(1);
  str+='*'+l+l;
  arr=arr.slice(1,l+1);
  arr.map(function(v){
    str+=v.slice(1,l+1).join('');
  });
  if(edit.level!==undefined){
    levels[edit.level]=str;
    edit.level=undefined;
  }
  else{
    levels.push(str);
    e.id=levels.length-1;
    q('levels').appendChild(e);
  }
  q('edit').style.display='';
}

function createNumber(){
  var con=document.createDocumentFragment(),e;
  con.id=numberSelect;
  e=document.createElement('option');
  e.value=0;
  e.innerHTML='No Change';
  con.appendChild(e);
  levels.map(function(v,i){
    e=document.createElement('option');
    e.value=i+1;
    e.innerHTML=i+1;
    con.appendChild(e);
  });
  q('numberSelect').innerHTML='';
  q('numberSelect').appendChild(con);
}
/****************************\
EDITOR
\****************************/

function Disc(start,end,i){
  var t=this,w=state.width;
  if(start[0]&&start[1]){
    t.dir=start[0]!=w-1?[0,-1]:[-1,0];
  }
  else{
    t.dir=start[0]?[0,1]:[1,0];
  }
  w=1000/w;
  t.x=start[0]*w+w/2;
  t.y=start[1]*w+w/2;
  t.start=start;
  t.end=end;
  t.radius=w*.9/2;
  t.color=COLORS[i];
}

function parseLevel(str){
  state.discs=[];
  state.stopped=true;
  state.ended=false;
  str=str.split('*');
  var start=str[0].split(','),
  str=str[1],
  width=+str[0],
  l=height=+str[1],
  arr=[],
  i=2,
  j=0,
  d=0,
  c;
  while(l--){
    arr.push([]);
  }
  l=str.length;
  for(;i<l;i++){
    c=str[i];
    if(/\d/.test(c)){
      if(d){
        d+=''+c;
      }
      else{
        d=c-0;
      }
    }
    else{
      if(d){
        while(d--){
          arr[Math.floor(j/width)][j++%width]=c;
        }
      }
      else{
        arr[Math.floor(j/width)][j++%width]=c;
      }
      d=0;
    }
  }
  l=height,i=0;
  for(;i<l;i++){
    arr[i].unshift('b');
    arr[i].push('b');
  }
  c='bbbbbbbbb'.substring(0,width);
  arr.unshift(('P'+c+'O').split(''));
  arr.push(('X'+c+'S').split(''));
  state.width=width+2;
  state.height=height+2;
  state.arr=arr;
  //Add discs
  start.map(function(v,i){
    var m=[+v[0],+v[1]],n=[+v[2],+v[3]];
    state.discs.push(new Disc(m,n,i));
  });
  state.stopped=true;
  drawDisc();
  drawGame();
}

function countdown(){
  var c=q('game').getContext('2d'),i=3,id;
  c.textAlign='center';
  c.textBaseline='middle';
  c.font='300px sans-serif';
  c.fillStyle='#fff';
  c.fillText(i--,500,500);
  id=setInterval(function(){
    drawGame();
    c.fillStyle='#fff';
    c.fillText(i,500,500);
    if(!i--){
      clearInterval(id);
      drawGame();
      state.stopped=false;
    }
  },1000);
}

function drawGame(){
  var w=state.width,h=state.height,a=state.arr,cw=1e3/w,ch=1e3/h,e=q('game'),c=e.getContext('2d'),i=x=y=0,l=w*h,b;
  c.clearRect(0,0,1e3,1e3);
  //grid
  for(;i<l;i++){
    x=i%w;
    y=Math.floor(i/w);
    b=img[a[y][x]];
    if(b)c.drawImage(b,x*cw,y*ch,cw,ch);
  }
  
  //entry exit points
  state.discs.map(function(v,i){
    var col=COLORS[i],s=v.start,e=v.end;
    c.lineWidth=5;
    c.fillStyle=col;
    c.strokeStyle=col;
    c.beginPath();
    c.arc(s[0]*cw+cw/2,s[1]*ch+ch/2,cw/4,0,Math.PI*2);
    c.fill();
    if(v.safe){
      c.fillRect(e[0]*cw+cw/4,e[1]*ch+ch/4,cw/2,ch/2);
    }
    else{
      c.strokeRect(e[0]*cw+cw/4,e[1]*ch+ch/4,cw/2,ch/2);
    }
  });
  
  
}
function drawDisc(){
  var c=q('disc').getContext('2d');
  c.clearRect(0,0,1e3,1e3);
  state.discs.map(function(v){
    c.fillStyle=v.color;
    c.beginPath();
    c.arc(v.x,v.y,v.radius,0,Math.PI*2);
    c.fill();
  });
}

function flipRow(arr,j){
  var old=arr[j],row=old.slice(1,state.width-1).reverse();
  row.unshift(old[0]);
  row.push(old[old.length-1]);
  arr[j]=row;
}
function flipCol(arr,j){
  var h=arr.length,l=h/2-.5,i=1,t;
  for(;i<l;i++){
    t=arr[i][j];
    arr[i][j]=arr[h-i-1][j];
    arr[h-i-1][j]=t;
  }
}

function turn(d,x,y,dist,m,n,ent){
  var w=1e3/state.width,h=1e3/state.height,pt=[w*x+m*w,h*y+n*h],circ=d.radius*Math.PI*2,angle,
  dif=Math.abs(pt[0]-d.x)>Math.abs(pt[1]-d.y);
  if(d.x>x*w&&d.y>y*h&&d.x<x*w+w&&d.y<y*h+h){
    angle=Math.atan((d.x-pt[0])/(d.y-pt[1]));
    angle=(angle/(Math.PI*2)*circ+dist*d.spin)/circ*Math.PI*2;
    d.dir=[d.spin*Math.cos(angle),d.spin*-Math.sin(angle)];
  }
  else{
    if(ent){
      d.spin=d.spin||(dif^!m)*2-1;
      if(Math.round(d.dir[1])){
        if(d.y-h*y>0^n){
          state.ended=true;
        }
      }
      else{
        if(d.x-w*x>0^m){
          state.ended=true;
        }
      }
    }
    else{
      d.dir=[Math.round(d.dir[0]),Math.round(d.dir[1])];
      d.spin=undefined;
      if(d.dir[0]){
        d.y+=((w*y+w/2)-d.y)/2
      }
      else{
        d.x+=((h*x+h/2)-d.x)/2
      }
    }
  }
}

function cellEnter(d,x,y,distance){
  var cell=state.arr[y][x];
  if(d.start[0]==x&&d.start[1]==y&&(-d.start[0]+1)*d.dir[0]>=0&&(-d.start[1]+1)*d.dir[1]>=0){}
  else if(d.end[0]==x&&d.end[1]==y){}
  else{
    switch(cell){
      case'e':
        break;
      case's':
      case'b':
        state.ended=true;
        break;
      case't':
        d.dir=[d.dir[0]*-1,d.dir[1]*-1];
        d.x+=d.dir[0]*5;
        d.y+=d.dir[1]*5;
        break;
      case'l':
        turn(d,x,y,distance,0,1,1);
        break;
      case'L':
        turn(d,x,y,distance,0,0,1);
        break;
      case'R':
        turn(d,x,y,distance,1,0,1);
        break;
      case'r':
        turn(d,x,y,distance,1,1,1);
        break;
    }
  }
}
function cellExit(d,x,y,distance){
  var cell=state.arr[y][x];
  if(d.start[0]==x&&d.start[1]==y){}
  else if(d.end[0]==x&&d.end[1]==y){//Disc completed
    d.finish=true;
    drawGame();
  }
  else{
    switch(cell){
      case'e':
        break;
      case's':
      case't':
        state.ended=true;
        break;
      case'l':
        turn(d,x,y,distance,0,1);
        break;
      case'L':
        turn(d,x,y,distance,0,0);
        break;
      case'R':
        turn(d,x,y,distance,1,0);
        break;
      case'r':
        turn(d,x,y,distance,1,1);
        break;
    }
  }
}

function gameLoop(T){
  if(state.stopped||state.ended)return;
  var won=true,w=state.width,h=state.height,distance=state.speeds[state.speed]*T;
  state.discs.map(function(v){
    if(won&&v.finish){
      won=true;
    }
    else if(!v.finish){
      won=false;
      cellEnter(v,Math.floor((v.x+v.dir[0]*v.radius)/(1000/w)),Math.floor((v.y+v.dir[1]*v.radius)/(1000/h)),distance);
      cellExit(v,Math.floor((v.x+v.dir[0]*-1*v.radius)/(1000/w)),Math.floor((v.y+v.dir[1]*-1*v.radius)/(1000/h)),distance);
      v.x+=v.dir[0]*distance;
      v.y+=v.dir[1]*distance;
    }
  });
  if(won){
    state.stopped=true;
    var e=q(state.id);
    if(!e.className||e.className[1]<state.speed){
      e.className='s'+state.speed;
    }
    if(levels.every(function(v,i){
      return q(i).className!=='';
    })){
      editor();
    }
    q('game').style.display='';
    q('disc').style.display='';
  }
  drawDisc();
}

function editor(){
  q('editIcon').style.display='block';
}

function animLoop(render){
  var running, lastFrame=+new Date;
  function loop(now){
    // stop the loop if render returned false
    if (running!==false){
      requestAnimationFrame(loop);
      var T=now-lastFrame;
      if(T<100&&T>0){
        running = render(T);
      }
      lastFrame = now;
    }
  }
  loop(lastFrame);
}
animLoop(gameLoop);

q('edit').onclick=function(e){
  var x=e.pageX-this.offsetLeft,y=e.pageY-this.offsetTop,
  W=edit.width,H=edit.height,
  w=this.offsetWidth/W,h=this.offsetHeight/W,
  t=edit.tile,
  i,c,borderPoint=false;
  x=Math.floor(x/w);
  y=Math.floor(y/h);
  i=W*y+x;
  edit.points.map(function(v){
    if(v[0]==x&&v[1]==y){
      borderPoint=true;
    }
  });
  
  if(x==0||x==W-1){
    if(y==0){
      if(x){
        //Levels
        createNumber();
        q('number').style.display='block';
      }
      else{
        //Menu
        q('menu').style.display='block';
        
      }
    }
    else if(y==H-1){
      if(x){
        //Size
        q('size').style.display='block';
      }
      else{
        //Back
        saveEdit();
      }
    }
    else{
      //EE
      if(t=='E'&&edit.points.length<6&&!borderPoint){
        edit.points.push([x,y]);
      }
      else if(t=='c'&&borderPoint){
        reducePoints(x,y);
      }
      editE();
      drawEdit();
    }
  }
  else if(y==0||y==H-1){
    //EE
    if(t=='E'&&edit.points.length<6&&!borderPoint){
      edit.points.push([x,y]);
    }
    else if(t=='c'&&borderPoint){
      reducePoints(x,y);
    }
    editE();
    drawEdit();
  }
  else{
    if(t=='c'){
      edit.arr[y][x]='e';
      drawEdit();
    }
    else if(t!='E'){
      edit.arr[y][x]=t;
      drawEdit();
    }
  }
}

q('game').onclick=function(e){
  var x=e.pageX-this.offsetLeft,y=e.pageY-this.offsetTop,
  W=state.width,H=state.height,
  w=this.offsetWidth/W,h=this.offsetHeight/W,
  i,c;
  x=Math.floor(x/w);
  y=Math.floor(y/h);
  i=W*y+x
  if(x==0||x==W-1){
    if(y==0){
      if(x){
        //Reset
        parseLevel(levels[state.id]);
      }
      else{
        //Play
        if(state.ended){
          parseLevel(levels[state.id]);
          countdown();
        }
        else if(state.stopped){
          countdown();
        }
      }
    }
    else if(y==H-1){
      if(x){
        //Speed
        if(state.stopped||state.ended){
          q('speed').style.display='block';
        }
      }
      else{
        //Back
        state.ended=true;
        q('game').style.display='';
        q('disc').style.display='';
      }
    }
    else{
      flipRow(state.arr,y);
      drawGame();
    }
  }
  else if(y==0||y==H-1){
    flipCol(state.arr,x);
    drawGame();
  }
  else{ 
    c=state.arr[y][x];
    if(/[rlRL]/.test(c)){
      state.arr[y][x]={r:'L',l:'R',R:'l',L:'r'}[c];
    }
    drawGame();
  }
}

q('speedClose').onclick=function(){
  state.speed=document.querySelector('input[name="speed"]:checked').value;
  q('speed').style.display='';
}</script>
