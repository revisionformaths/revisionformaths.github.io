const cos = Math.cos;
const sqrt = Math.sqrt;
const sign = Math.sign;
const clamp = (num, min, max) => Math.min(Math.max(num, min), max);
const abs = (value) => Math.abs(value);
const toRad = (deg) => deg * (PI / 180);
const toDeg = (rad) => rad / (PI / 180);
const round = Math.round;
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => round(rand(min, max));
const hexToInt = (h) => parseInt('0x' + h);
const intToHex = (d) => (d <=15 ? "0" : "") + Number(d).toString(16);

function getRandomEntry(list) {
    return list[Math.floor((Math.random()*list.length))];
}



const samePosition = (p1, p2, delta) => abs(p1.x - p2.x) < delta && abs(p1.y - p2.y) < delta;

// handle Canvas sizes, generate 2d-contexts
const initCanvas = (id) => {
    let canvasElement = document.querySelector('#' + id);
    canvasElement.width = BASEWIDTH; 
    canvasElement.height = BASEHEIGHT;
    return [canvasElement,canvasElement.getContext("2d")];
}
const [canvas, ctx] =  initCanvas('gameCanvas');
const bgGradientDiv = document.querySelector('#bg > div');

let currentCtx = ctx;

// delta-time for updates
let lastUpdate = Date.now();
function getDelta() {
    let now = Date.now();
    let delta = clamp((now - lastUpdate) / 1000, 0, 0.1);
    lastUpdate = now;
    return delta;
}

// canvas-specific method-shortcuts for better minification of the code
function setCurrentContext(context) {
    currentCtx = context;
}
function translateContext(x, y) {
    let [tx,ty] = getCameraView({x,y});
    currentCtx.translate(tx,ty);
}
const rotateContext = (angleDegrees) => currentCtx.rotate(toRad(angleDegrees));
const saveContext = () => currentCtx.save();
const restoreContext = () => currentCtx.restore();
const strokeStyle = (color) => currentCtx.strokeStyle = color;
const fillStyle = (color) => currentCtx.fillStyle = color;
const beginPath = () => currentCtx.beginPath();
const moveTo = (x,y) => currentCtx.moveTo(x,y);
const lineTo = (x,y) => currentCtx.lineTo(x,y);
const stroke = () => currentCtx.stroke();
const fill = () => currentCtx.fill();
const fillRect = (x,y,w,h) => currentCtx.fillRect(x,y,w,h);
const rect = (x,y,w,h) => {beginPath(); currentCtx.rect(x,y,w,h); stroke();}
const drawImage = (source,x,y) => currentCtx.drawImage(source,x,y);
const setFillModeDelete = () => currentCtx.globalCompositeOperation = "destination-out";
const setFillModeFill = () => currentCtx.globalCompositeOperation = "source-over";

const circle = (x, y, r) => currentCtx.arc(x, y, r, 0, PI*2);
const ellipse = (x, y, rx, ry, rot, start, end) => currentCtx.ellipse(x, y, rx, ry, rot, start, end);

    <script>let inputGamepadIndex = -1;
const inputGamepadButtons = [];
const inputGamepadAxes = [];
const gamepadMappingStandard = "standard";
window.addEventListener("gamepadconnected", (ev) => {
    if(ev.gamepad.mapping == gamepadMappingStandard) {
        inputGamepadIndex = ev.gamepad.index
    }
});
window.addEventListener("gamepaddisconnected", (ev) => {
    inputGamepadIndex = -1
    navigator.getGamepads().find(gamepad => gamepad.mapping == gamepadMappingStandard)
});

const STICK_LEFT_HORIZONTAL = 0;
const STICK_LEFT_VERTICAL = 1;
const STICK_RIGHT_HORIZONTAL = 2;
const STICK_RIGHT_VERTICAL = 3;
const GAMEPAD_LEFT = 14;
const GAMEPAD_RIGHT = 15;
const GAMEPAD_UP = 12;
const GAMEPAD_DOWN = 13;
const GAMEPAD_THRUST= 7;

const GAMEPAD_A = 0;
const GAMEPAD_B = 1;
const GAMEPAD_X = 2;
const GAMEPAD_Y = 3;

function gamepadConnected() {
    return inputGamepadIndex >= 0;
}
function getGamepadState() {
    if(gamepadConnected()) {
        let inputGamepad = navigator.getGamepads()[inputGamepadIndex];
        inputGamepad.buttons.forEach((btn,i) => {
            inputGamepadButtons[i] = btn.pressed;
        });
        inputGamepad.axes.forEach((axe, i) => {
            inputGamepadAxes[i] = axe;
        });
    }
}
function getGamepadStickValue(index) {
    if(gamepadConnected()) {
        return inputGamepadAxes[index];
    }
    return 0;
}
function getGamepadStickVector(xIndex, yIndex) {
    return createPoint(getGamepadStickValue(xIndex), getGamepadStickValue(yIndex));
}

function getGamepadButtonPressed(index) {
    if(gamepadConnected()) {
        return inputGamepadButtons[index];
    }
    return false;
}

    <script>const camera = {
    // camera looks at middle of the screen
    x:BASEWIDTH/2,
    y:BASEHEIGHT/2,
    bb:{ // boundingbox
        l:0,
        r:BASEWIDTH,
        t:0,
        b:BASEHEIGHT
    },
    dx:0,
    dy:0,
    // effects (Screenshake)
    ex:0,
    ey:0,
    et:0,
    // target to look at
    t:null,
    _u:() => {}
}
camera._u = (delta) => updateCamera(camera, delta);

function updateCamera(cam, delta) {
    if(cam.t) {
        let aimVector = {
            x:cam.t.x - cam.x, 
            y:cam.t.y - cam.y
        };
        let speed = vectorLength({x:cam.t.p.dx, y: cam.t.p.dy})
        cam.dx =aimVector.x * speed;
        cam.dy =aimVector.y * speed;
        cam.x += cam.dx * delta;
        cam.y += cam.dy * delta;
        //boundingbox
        cam.bb.l = cam.x-BASEWIDTH/2;
        cam.bb.r = cam.x+BASEWIDTH/2;
        cam.bb.t = cam.y-BASEHEIGHT/2;
        cam.bb.b = cam.y+BASEHEIGHT/2;
    }
    if(cam.et > 0) {
        cam.et -= delta;
        cam.ex = clamp(cam.ex + rand(-5,5),-10,10);
        cam.ey = clamp(cam.ey + rand(-5,5),-10,10);
    } else {
        cam.ex = 0;
        cam.ey = 0;
    }
}

function isInView(gameObject, buffer) {
    return gameObject.x >= camera.bb.l - buffer
        && gameObject.x <= camera.bb.r + buffer
        && gameObject.y >= camera.bb.t - buffer
        && gameObject.y <= camera.bb.b + buffer;
}

function getCameraView(point) {
    return [
        point.x - camera.x + BASEWIDTH/2 + camera.ex,
        point.y - camera.y + BASEHEIGHT/2 + camera.ey
    ];
}

function cameraShake(duration) {
    camera.et = duration;
}</script>
	<script>/**
 * create a new point
 * @param {number} x the x coordinate
 * @param {number} y the y coordinate
 * @returns 
 */
function createPoint (x,y){
    return {x,y, a:0}
};

/**
 * creates a Point with radius
 * @param {number} x the x coordinate
 * @param {number} y the y coordinate
 * @param {number} r the radius
 * @returns 
 */
function createCircle (x,y,r) {
    return {x,y,r, a:0}
}

/**
 * creates a new Point as difference vector from p1 to p2
 * @param {Point} p1 
 * @param {Point} p2 
 * @returns Point the diff-vector
 */
function pointDifferenceVector(p1, p2) {
    return createPoint(p2.x - p1.x, p2.y - p1.y);
}

/**
 * calculates the length of a vector (Point)
 * @param {Point} v 
 * @returns length as number
 */
function vectorLength(v) {
    return sqrt(v.x*v.x + v.y*v.y);
}

/**
 * calculate the distance between two points
 * @param {Point} p 
 * @param {Point} p2 
 * @returns distance as number
 */
function pointDistance(p1, p2) {
    return vectorLength(pointDifferenceVector(p1, p2));
}

/**
 * multiplies the parts of the vector with the given factor
 * @param {Point} v the Vector
 * @param {number} factor the mutliplicator
 * @returns the new Vector/Point
 */
function multiplyVector(v, factor) {
    return createPoint(v.x * factor, v.y*factor);
}

/**
 * adds the given points
 * @param {Point} p 
 * @param {Point} p2 
 * @returns the sum-point
 */
function addPoints(p, p2) {
    return createPoint(p.x + p2.x, p.y + p2.y);
}


function getVectorAngle(v) {
    return Math.atan2(v.y, v.x);
}

function getVectorAngleDegrees(v) {
    return toDeg(getVectorAngle(v));
}

function createAngleVector(angleDegrees, distance = 1) {
    let a = toRad(angleDegrees);
    let v = {x:cos(a), y:sin(a)};
    if(distance != 1) {
        return multiplyVector(v, distance);
    }
    return v;
}

function getStandardVector(vector, targetLength = 1) {
    let length = vectorLength(vector);
    return multiplyVector(vector, targetLength/length);
}

function sumVectors(v1, v2) {
    return {
        x:v1.x + v2.x,
        y:v1.y + v2.y
    };
}

	<script>/**
 * adds a child-point to the given parent-point
 * @param {Point} parentPoint the parent point
 * @param {Point} childPoint the child point
 * @param {number} distance the distance constraint
 * @returns the child point
 */
function chainPoint (parentPoint, childPoint, distance) {
    parentPoint.c = childPoint;
    parentPoint.d = distance;
    childPoint.p = parentPoint;
    childPoint.pd = distance;
    if(!parentPoint.p && !parentPoint._r) {
        parentPoint._r = ()=> renderChain(parentPoint);
    }
    return childPoint;
}


/**
 * fix the distances between the chain points (rekursive parent to child)
 * @param {Point} point the partenpoint to start with 
 */
function fixChainDistances(point, maxAngle = 180) {
    if(point.c) {
        let child = point.c;
        let distanceVector = pointDifferenceVector(point, child);
        let dist = vectorLength(distanceVector);
        //if(abs(dist - point.d) > 0.5) {
            let v2 = multiplyVector(distanceVector, point.d / dist);
            child.a = getVectorAngleDegrees(v2);

            let newchildPos = addPoints(point, v2)
            child.x = newchildPos.x;
            child.y = newchildPos.y;

            let diffAngle = (point.a - child.a + 180) % 360 - 180;
            let updateNeeded = false;
            if(diffAngle < -maxAngle) {
                diffAngle = -maxAngle;
                updateNeeded = true;
            } else if(diffAngle > maxAngle) {
                diffAngle = maxAngle;
                updateNeeded = true;
            }
            if(updateNeeded) {
                child.a = normalizeAngle(point.a + 720 - diffAngle);
                let diffVector = createAngleVector(child.a, point.d);
                let newchildPos = addPoints(point, diffVector);
                child.x = newchildPos.x;
                child.y = newchildPos.y;
            }
                
        //}
        fixChainDistances(child, maxAngle);
    }
}

function normalizeAngle(angle) {
    while(angle >= 360) {
        angle -= 360;
    }
    while(angle < 0) {
        angle += 360;
    }
    return angle;
}


function renderChain(head) {
    saveContext();
    translateContext(head.x, head.y);
    let currentpoint = head;
    while(currentpoint.c) {
        beginPath();
        strokeStyle(COLOR_WHITE);
        circle(currentpoint.x-head.x, currentpoint.y-head.y, currentpoint.r);
        stroke();
        currentpoint = currentpoint.c;
    }
    restoreContext();
}
</script>
	<script>const SMOKE_RATE_ONE_HP = 0.1;
const PLAYER_MAX_HEIGHT = BASEHEIGHT * 8;
function createPlayer(x,y,rotationAngle) {
    let player = {
        // position
        x,
        y,
        // rotation in degrees
        a:rotationAngle,
        // rotationspeed in degree per second
        as:180,
        // current speed
        dx:0,
        dy:0,
        dv:createPoint(0,0), // speed vector
        dva:0, // speed angle
        dvl:0, // speed length
        // camera target
        t:{x,y},
        // fire rate in time between shots
        fr:0.5/gameData[GAMEDATA_SHIP_FIRERATE],
        l:gameData[GAMEDATA_SHIP_WEAPON],
        // last fire triggered (seconds)
        lf:0,
        // hitpoints
        h:10,
        mh:10,
        alive:true,
        // collision
        cr:10, // collision circle-radius
        ct:0, // timeout from enemy-collision
        // last smoke particle generated (seconds)
        ls:0
    };
    player._r = ()=>renderPlayer(player);
    player._u = (delta)=>updatePlayer(player, STICK_LEFT_HORIZONTAL, STICK_LEFT_VERTICAL, delta);
    player.t.p = player;
    camera.t = player.t;
    return player;
}

function renderPlayer(player) {
    if(!player.alive) {
        return;
    }
    let tip = [0,-25];
    let points = [
        -2,-12,
        -6,-11,
        -5,-9,
        -3,-8,
        -4,-5,
        -14,4, //-8,
        -13,7, //-5,
        -5,2,
        -6,9,
        -3,9,
        -2,8
    ];
    let length = points.length;
    saveContext();
    translateContext(player.x, player.y);
    rotateContext(player.a+90);

    beginPath();
    fillStyle(COLOR_BLACK);
    strokeStyle(COLOR_WHITE);
    moveTo(tip[0], tip[1]);
    for(let i = 0; i<length-1; i+=2) {
        lineTo(points[i], points[i+1]);
    }
    for(let i = length-2; i>=0; i-=2) {
        lineTo(-points[i], points[i+1]);
    }
    lineTo(tip[0], tip[1]);
    fill();
    stroke();

    restoreContext();


}


const PLAYER_MODE_DIRECTIONAL = 1;
const PLAYER_MODE_ROTATIONAL = 2;
let playerMode = PLAYER_MODE_ROTATIONAL;
function updatePlayer(player, stick_horizontal, stick_vertical, delta) {
    player.ct -= delta;
    let gravity = 1;
    let maxDy = 10;
    if(player.h <= 0) {
        player.a -= 360 * delta;
        stopAudio(AUDIO_SFX_ENGINE);
        gravity = 3;
        maxDy = 30;
    } else if(player.y < -PLAYER_MAX_HEIGHT+GROUND_HEIGHT) {
        player.a += 180 * delta;
        gravity = 5;
        maxDy = 50;
    } else {
        let gamepadVector = getGamepadStickVector(stick_horizontal, stick_vertical);
        playerMode = gamepadVector && vectorLength(gamepadVector) > 0.2 ? PLAYER_MODE_DIRECTIONAL : PLAYER_MODE_ROTATIONAL;
        if(playerMode == PLAYER_MODE_DIRECTIONAL) {
        
            let targetAngle = getVectorAngleDegrees(gamepadVector)+360;
            let diffAngle = (targetAngle - player.a  + 180) % 360 - 180;
            let turnspeed = 360; // angle per second
            let maxTurn = turnspeed * delta;
            if(diffAngle < 0) {
                player.a += diffAngle < -maxTurn ? -maxTurn : diffAngle;
            } else if(diffAngle > 0) {
                player.a += diffAngle > maxTurn ? maxTurn : diffAngle;
            }
            player.a = normalizeAngle(player.a);

        } else if(playerMode == PLAYER_MODE_ROTATIONAL) {
            let stickHorizontal = getGamepadStickValue(STICK_LEFT_HORIZONTAL);
            if(keyActive(KEY_ACTION_LEFT) || getGamepadButtonPressed(GAMEPAD_LEFT)) {
                stickHorizontal = -1;
            }
            if(keyActive(KEY_ACTION_RIGHT) || getGamepadButtonPressed(GAMEPAD_RIGHT)) {
                stickHorizontal = 1;
            }
            if(abs(stickHorizontal) > 0.1) {
                player.a += stickHorizontal * delta * player.as;
            }
            
        }
        let thrustInput = 0;
        if(keyActive(KEY_ACTION_UP)|| getGamepadButtonPressed(GAMEPAD_UP)|| getGamepadButtonPressed(GAMEPAD_THRUST)) {
            thrustInput = -1;
        }
        if(thrustInput < -0.1) {
            let thrustDirectionVector = createAngleVector(player.a + rand(-10,10));
            let thrust = multiplyVector(thrustDirectionVector, -thrustInput * 7 * delta);
            player.dx += thrust.x;
            player.dy += thrust.y;
            gameObjects.push(createParticleExhaust(player.x, player.y, player.dx-thrustDirectionVector.x * 400, player.dy-thrustDirectionVector.y * 400, 1));
            playAudio(AUDIO_SFX_ENGINE, false);
        } else {
            player.dx *= 0.995;
            stopAudio(AUDIO_SFX_ENGINE);
        }
    }

    if(player.dy < maxDy) {
        player.dy += gravity * delta;
    }
    
    player.x += player.dx;
    player.y += player.dy;
    
    // Ground collision
    if(player.y > GROUND_HEIGHT-8) {
        if(player.dy > 0.5) {
            addGameObject(createParticleSplash(player.x, player.y, 1));
            camera.et = 0.25;
        }
        player.y = GROUND_HEIGHT-8.1;
        player.dy = 0;
        player.a = 270;
        player.dx = 0;
        if(player.h <= 0 && player.alive) {
            player.alive = false;
            playAudio(AUDIO_SFX_EXPLOSION);
            addGameObject(createParticleExplosion(player.x, player.y,COLOR_RGB_YELLOW));
            for(let i = 0; i < 40; i++) {
                addGameObject(createParticleDebris(player.x, player.y, 3, -300));
            }
            msgDiv.classList.remove('hidden');
            let text = levels[currentLevel].failure;
            if(levels[currentLevel].count) {
                text +="\n\nScore Details: " + killCount.e + " scouts, " + killCount.sn + " jabberwockies, " + killCount.sq + " squids and " + killCount.sqr + " starfishs."
            }
            msgDiv.innerText = text;
            player.lf = -2;
        }
    }
    
    
    let v = createAngleVector(player.a); // vector, the player is facing to
    // fire triggered?
    player.lf += delta;
    player.ls += delta;
    let firePressed = getGamepadButtonPressed(GAMEPAD_A) || keyActive(KEY_ACTION_FIRE);
    if(firePressed && player.lf >= player.fr && player.alive && !player.won) {
        playAudio(AUDIO_SFX_LASER);
        if(player.l == 1 || player.l == 3 && player.alive) {
            gameObjects.push(createParticleLaser(player.x, player.y, v.x * 1200, v.y * 1200, 2));
        }
        if(player.l == 2) {
            let v1 = createAngleVector(player.a-2);
            let v2 = createAngleVector(player.a+2);
            gameObjects.push(createParticleLaser(player.x, player.y, v1.x * 1200, v1.y * 1200, 2));
            gameObjects.push(createParticleLaser(player.x, player.y, v2.x * 1200, v2.y * 1200, 2));
        } else if(player.l == 3) {
            let v1 = createAngleVector(player.a-5);
            let v2 = createAngleVector(player.a+5);
            gameObjects.push(createParticleLaser(player.x, player.y, v.x * 1200, v.y * 1200, 2));
            gameObjects.push(createParticleLaser(player.x, player.y, v1.x * 1200, v1.y * 1200, 2));
            gameObjects.push(createParticleLaser(player.x, player.y, v2.x * 1200, v2.y * 1200, 2));
        }
        player.lf= 0;
    }
    if(getGamepadButtonPressed(GAMEPAD_B)) {
        cameraShake(0.25);
    }
    // smoke
    if(player.h < player.mh && SMOKE_RATE_ONE_HP * player.h < player.ls) {
        gameObjects.push(createParticleSmoke(player.x, player.y));
        player.ls = 0;
    }
    // wrap
    let wrapDiffX = 0;
    if(player.x < leftMostEnemy - WRAP_DISTANCE * 1.1) {
        wrapDiffX = (rightMostEnemy + WRAP_DISTANCE) - player.x;
    }
    if(player.x > rightMostEnemy + WRAP_DISTANCE * 1.1) {
        wrapDiffX = -(player.x - (leftMostEnemy - WRAP_DISTANCE));
    }
    if(wrapDiffX != 0) {
        player.x += wrapDiffX;
        camera.x += wrapDiffX;
    }
    // set camera target position (100 pixel ahead)
    let t = sumVectors(player, multiplyVector(v, 100));
    player.t.x = t.x;
    player.t.y = t.y;
    // update player speed vector
    player.dv.x = player.dx;
    player.dv.y = player.dy;
    player.dva = getVectorAngleDegrees(player.dv);
    player.dvl = vectorLength(player.dv);
}</script>
	<script>function createParticle(x, y, dx, dy, ttl, renderMethod, updateMethod) {
    let particle = {x,y,dx,dy,ttl};
    particle.ittl = ttl; // initial ttl
    particle.s = 1; // splashcount
    particle.sf = 1; // splashforce multiplier
    if(renderMethod) {
        particle._r = () => {
            saveContext();
            translateContext(particle.x, particle.y);
            renderMethod(particle);
            restoreContext();
        }
    }
    updateMethod = updateMethod ? updateMethod : updateParticle;
    particle._u = (delta) => updateMethod(particle, delta);
    return particle;
}

function updateParticle(particle, delta) {
    if(particle.g) {
        particle.dy += particle.g * delta;
    }
    particle.x += particle.dx * delta;
    particle.y += particle.dy * delta;
    particle.ttl -= delta;
}

function updateParticleHitGround(particle, delta, withSplash) {
    updateParticle(particle, delta);
    if(particle.y > GROUND_HEIGHT) {
        particle.ttl = -1;
        if(withSplash) {
            for(let i = 0; i < particle.s; i++) {
                addGameObject(createParticleSplash(particle.x+rand(-10,10), particle.y, particle.sf));
            }
        }
    }
}

function updateParticleHitGroundSplash(particle, delta) {
    updateParticleHitGround(particle, delta, true);
}

function updateParticleSplash(particle, delta) {

}

function createParticleExhaust(x, y, dx, dy, ttl) {

	<script>
function createSnake(x, y, headsize, segments, speed, ot = GAMEOBJECT_TYPE_SNAKE ) {
    let headPoint = createSnakeSegment(x,y, headsize);
    headPoint.ot = ot;
    headPoint.ma = 25; // max Angle for Segments
    headPoint.hp = 10;
    headPoint.s = speed;
    headPoint._r = () => renderSnake(headPoint);
    // gamepad control? 
    // headPoint._u = (delta) => updateSnake(headPoint, STICK_RIGHT_HORIZONTAL, STICK_RIGHT_VERTICAL, delta);
    headPoint._u = (delta) => updateSnake(headPoint, delta);
    let currentpoint = headPoint;
    for(let i = 1; i <= segments; i++) {
        let size = headsize - i*(headsize/segments);
        currentpoint = chainPoint(currentpoint, createSnakeSegment(x-400,y-i*headsize, size), size);
    }

    return headPoint;
}

function createSnakeSegment(x, y, radius) {
    let segment = createCircle(x, y, radius);
    segment.a = 0;
    return segment;
}

function updateSnake(head, delta) {
    if(head.ot == GAMEOBJECT_TYPE_SNAKE) {
        let targetPoint = createPoint(player.x, player.y);
        let targetVector = pointDifferenceVector(head, targetPoint);
        let targetAngle = getVectorAngleDegrees(targetVector) + 720;
        head.ta = targetAngle;
        if(head.inited) {
            let headAngle = head.a-180;
            let diffAngle = (targetAngle - headAngle + 180) % 360 - 180;
            let turnspeed = head.s; // angle per second == speed
            let maxTurn = turnspeed * delta;
            if(diffAngle < 0) {
                head.a -= maxTurn;
            } else if(diffAngle > 0) {
                head.a += maxTurn;
            }
        } else {
            head.a = targetAngle+180;
            head.inited = true;
        }
        // normalize angle
        head.a = normalizeAngle(head.a);

        let targetStandardVector = createAngleVector(head.a-180, head.s * delta); 
        head.x += targetStandardVector.x;
        head.y += targetStandardVector.y;
    }
    fixChainDistances(head, head.ma);
}



function renderSnake(head) {
    if(!isInView(head, head.r) && !head.sq) {
        renderHudMarker(head, 3);
    }
    let tail = head;
    while(tail.c) {
        tail = tail.c;
    }
    if(isInView(head,head.r) || isInView(tail, head.r)) {
        saveContext();
        translateContext(head.x, head.y);
        let pointsRight = [];
        let pointsLeft = [];
        let currentpoint = head;
        let isHead = true;
        let counter = 0;
        while(currentpoint.c) {
            let x = currentpoint.x-head.x;
            let y = currentpoint.y-head.y;
            
            setFillModeDelete();
            beginPath();
            fillStyle(COLOR_BLACK);
            circle(x, y, currentpoint.r);
            fill();
            setFillModeFill();
            
            if(isHead && head.ot == GAMEOBJECT_TYPE_SNAKE) {
                [[180,1],[170,2],[160,1],[150,1.5],[140,1],[130,1.2]].forEach(d => {
                    pointsLeft.unshift(calculateCirclePointAtAngle(x,y,currentpoint,d[0],d[1]));
                    pointsRight.push(calculateCirclePointAtAngle(x,y,currentpoint,-d[0],d[1]));
                });
            }
            pointsLeft.unshift(calculateCirclePointAtAngle(x,y,currentpoint,90));
            pointsRight.push(calculateCirclePointAtAngle(x,y,currentpoint,-90));
            if(counter % 2 == 0 ) {
                let factor = counter == 2 && head.ot == GAMEOBJECT_TYPE_SNAKE ? 2 : 1;
                [[70,1.5],[65,1.1]].forEach(d=>{
                    pointsLeft.unshift(calculateCirclePointAtAngle(x,y,currentpoint,d[0],d[1]*factor));
                    pointsRight.push(calculateCirclePointAtAngle(x,y,currentpoint,-d[0],d[1]*factor));
                });

            }

            currentpoint = currentpoint.c;
            isHead = false;
            counter++;
        }
        beginPath();
        strokeStyle(COLOR_WHITE);
        let points = [...pointsRight, ...pointsLeft];
        points.forEach((p, i) => {
            if(i == 0) {
                moveTo(p.x, p.y);
            } else {
                lineTo(p.x, p.y);
            }
        });
        stroke();
        if(head.ot == GAMEOBJECT_TYPE_SNAKE) {
            let eyeRadius = head.r/4;
            let pupilRadius = eyeRadius/2;
            [90,-90].forEach(a => {
                let eyePoint = calculateCirclePointAtAngle(0,0,head,a, .7);
                renderEye(eyePoint.x, eyePoint.y, eyeRadius, pupilRadius, head.ta);
            });
        }
        
        restoreContext();
    }
}

function renderEye(x, y, eyeRadius, pupilRadius, targetEyeAngle) {
    let targetEyeVector = createAngleVector(targetEyeAngle, eyeRadius-pupilRadius);
    beginPath();
    fillStyle(COLOR_WHITE);
    circle(x, y, eyeRadius);
    fill();
    beginPath();
    fillStyle(COLOR_BLACK);
    circle(x+targetEyeVector.x, y+targetEyeVector.y, pupilRadius);
    fill();
}


function calculateCirclePointAtAngle(x, y, currentpoint, angle, radiusMultiplier = 1) {
    let r = currentpoint.r * radiusMultiplier; 
    let v = createAngleVector(currentpoint.a + angle);
    return createPoint(x+v.x*r, y + v.y*r);
}

function explodeSnake(head) {
    let currentpoint = head;
    while(currentpoint.c) {
        gameObjects.push(createParticleSmoke(currentpoint.x + rand(-currentpoint.r,currentpoint.r), currentpoint.y + rand(-currentpoint.r,currentpoint.r),3));
        for(let i = 0; i < rand(3,7); i++) {
            addGameObject(createParticleDebris(currentpoint.x+rand(-currentpoint.r,currentpoint.r), currentpoint.y+rand(-currentpoint.r,currentpoint.r)));
        }
        currentpoint = currentpoint.c;
    }
    countKill(GAMEOBJECT_TYPE_SNAKE);
}

	<script>const SQUID_TYPE_NORMAL = 8;
const SQUID_TYPE_ROTATING = 9;

function createSquid(x,y, size, type = SQUID_TYPE_NORMAL) {
    let squid = {
        x:x, 
        y:y, 
        s:size, 
        ot:GAMEOBJECT_TYPE_SQUID,
        t:[],
        hp:20,
        st:type
    };
    squid._r = () => renderSquid(squid);
    squid._u = (delta) => updateSquid(squid, delta);
    if(type == SQUID_TYPE_NORMAL) {
        squid.t.push(createTentacle(squid, x,y+size/2,size/4,18, 30,150));
        squid.t.push(createTentacle(squid, x-size/2,y+size/3,size/4,15, 40,180));
        squid.t.push(createTentacle(squid, x+size/2,y+size/3,size/4,15, 0,140));
    } else if(type == SQUID_TYPE_ROTATING) {
        squid.t.push(createRotatingTentacle(squid, x,y+size/2,size/4,18, 120, 70));
        squid.t.push(createRotatingTentacle(squid, x,y-size/2,size/4,18, 240, 70));
        squid.t.push(createRotatingTentacle(squid, x,y-size/2,size/4,18, 360, 70));
        squid.t.push(createRotatingTentacle(squid, x,y+size/2,size/4,18, 120, -50));
        squid.t.push(createRotatingTentacle(squid, x,y-size/2,size/4,18, 240, -50));
        squid.t.push(createRotatingTentacle(squid, x,y-size/2,size/4,18, 360, -50));
        squid.t.forEach(t=>t.ma = 10);
        squid.hp = 30;
    }
    return squid;
}

function createTentacle(squid, x,y,size,segments, minAngle, maxAngle) {
    let tentacle = createSnake(x,y,size,segments,0,GAMEOBJECT_TYPE_TENTACLE);
    tentacle.a = 90;
    tentacle.aMin = minAngle;
    tentacle.aMax = maxAngle;
    tentacle.da = 90; // rotation per second
    tentacle.ma = 5; // max segment angle
    tentacle._u(0);
    tentacle.tt = SQUID_TYPE_NORMAL;
    tentacle.sq = squid;
    return tentacle
}

function createRotatingTentacle(squid, x,y,size, segments, angle, speed) {
    let tentacle = createSnake(x,y,size,segments,0,GAMEOBJECT_TYPE_TENTACLE);
    tentacle.a = angle;
    tentacle.da = speed; // rotation per second
    tentacle.tt = SQUID_TYPE_ROTATING;
    tentacle.sq = squid;
    return tentacle;
}

function renderSquid(squid) {
    if(!isInView(squid, squid.s)) {
        renderHudMarker(squid,4);
    }
    if(isInView(squid, squid.s*2)) {
        saveContext();
        translateContext(squid.x, squid.y);
        beginPath();
        strokeStyle(COLOR_WHITE);
        circle(0,0,squid.s);
        stroke();
        restoreContext();
        squid.t.forEach(t => t._r());
        saveContext();
        setFillModeDelete();
        translateContext(squid.x, squid.y);
        beginPath();
        fillStyle(COLOR_WHITE);
        circle(0,0,squid.s-2);
        fill();
        setFillModeFill();

        renderEye(0, -squid.s/2, squid.s/3, squid.s/6, squid.ta);
        renderEye(squid.s/2, squid.s/4, squid.s/5, squid.s/9, squid.ta);
        renderEye(-squid.s/2, squid.s/4, squid.s/5, squid.s/9, squid.ta);
        restoreContext();
    }
}

function updateSquid(squid, delta) {
    let targetPoint = createPoint(player.x, player.y);
    let targetVector = pointDifferenceVector(squid, targetPoint)
    let targetAngle = getVectorAngleDegrees(targetVector) + 720;
    squid.ta = targetAngle;
    let moveVector = getStandardVector(targetVector, 50*delta);
    squid.x += moveVector.x,
    squid.y += moveVector.y;
    squid.t.forEach(t => {
        if(t.tt == SQUID_TYPE_NORMAL) {
            t.x += moveVector.x,
            t.y += moveVector.y;
        
            t.a += t.da*delta;
            if(t.a < t.aMin || t.a > t.aMax) {
                t.da *= -1;
                t.a += 20*t.da * delta;
            }
        } else if(t.tt == SQUID_TYPE_ROTATING) {
            t.a += t.da*delta;
            let tentaclePositionVector = addPoints(createAngleVector(t.a, t.sq.s*0.9), t.sq);
            t.x = tentaclePositionVector.x;
            t.y = tentaclePositionVector.y;
        }
        t._u(delta);
    });
       
    if(squid.hp <= 0) {
        if(respawns > 0) {
            respawns--;
            let xdiff = rand(0,1) >= 0.5 ? BASEWIDTH: -BASEWIDTH
            addGameObject(createSquid(squid.x + xdiff, squid.y - BASEHEIGHT/4, squid.s, squid.st));
        } 
        squid.ttl = -1;
        squid.t.forEach(t => {
            t.ot = GAMEOBJECT_TYPE_SNAKE;

            t.y += rand(-squid.s, squid.s);
            t.a = rand(0,360);
            t.inited = true;
            t.s = rand(100,180);
            t.sq = null;
            addGameObject(t);
        });
        explodeSquid(squid);
    }
}

function explodeSquid(squid) {

    }
    countKill(squid.st);

	<script>function createEnemy(x, y, components) {
    let enemy = {
        x:x,
        y:y,
        dx:0,
        dy:0,
        a:rand(0,360),
        c:components,
        ttl:Infinity,
        ot:GAMEOBJECT_TYPE_ENEMY,
        r:15, // collission radius
        hp:2,
        s:rand(50,120), // Speed in pixel per second
        t:{x:BASEWIDTH/2 + rand(-500, 500),y:BASEHEIGHT/2 + rand(-400, 400)},
        ti:rand(2,5), // TargetChangeInterval in seconds
        tc:0, //targetChangeCountdown
        fi:rand(2,3), // fire interval
        fc:0, // fire countdown
    };
    enemy.tc = enemy.ti;
    enemy.fc = enemy.fi;
    
    createEnemyImage(enemy);
    enemy._r = () => renderEnemy(enemy);
    enemy._u = (delta) => updateEnemy(delta, enemy);

    return enemy;
}

function updateEnemy(delta, enemy) {
    enemy.tc -= delta;
    enemy.fc -= delta;
    if(enemy.tc <= 0) {
        enemy.t = {x:player.x+rand(-200,200), y:player.y+rand(-200,200)};
        enemy.tc = enemy.ti;
    }
    
    let targetVector = pointDifferenceVector(enemy, enemy.t);
    let targetAngle = getVectorAngleDegrees(targetVector) + 720;
    let headAngle = enemy.a-180;
    let diffAngle = (targetAngle - headAngle + 180) % 360 - 180;
    let turnspeed = enemy.s; // angle per second
    let maxTurn = turnspeed * delta;
    if(diffAngle < 0) {
        enemy.a -= maxTurn;
    } else if(diffAngle > 0) {
        enemy.a += maxTurn;
    }
    
    // normalize angle
    enemy.a = normalizeAngle(enemy.a);

    let targetStandardVector = createAngleVector(enemy.a-180, enemy.s * delta); 
    enemy.x += targetStandardVector.x;
    enemy.y += targetStandardVector.y;

    if(enemy.fc <= 0) {
        enemy.fc = enemy.fi;
        let v = createAngleVector(enemy.a);
        addGameObject(createParticleEnemyBullet(enemy.x +v.x * -15, enemy.y +v.y * -20, v.x * -200, v.y * -200, 8));
    }
   
    if(enemy.hp <= 0) {
        if(respawns > 0) {
            respawns--;
            enemy.y -= BASEHEIGHT/2;
            enemy.x += rand(0,1) >= 0.5 ? BASEWIDTH: -BASEWIDTH;
            enemy.hp = 2;
        } else {
            enemy.ttl = -1;
        }
        explodeEnemy(enemy);
    }
}

function explodeEnemy(enemy) {
    gameObjects.push(createParticleSmoke(enemy.x + rand(-enemy.r,enemy.r), enemy.y + rand(-enemy.r,enemy.r),3));
    for(let i = 0; i < rand(3,7); i++) {
        addGameObject(createParticleDebris(enemy.x+rand(-enemy.r,enemy.r), enemy.y+rand(-enemy.r,enemy.r)));
    }
    countKill(GAMEOBJECT_TYPE_ENEMY);
}

function createEnemyImage(enemy) {
    enemy.i = createSpriteBuffer(60,60);
    setCurrentContext(enemy.i.ctx);
    saveContext();
    translateContext(enemy.i.w/2, enemy.i.h/2);
    rotateContext(-90);
    enemy.c.forEach(points => {
        beginPath();
        fillStyle('#07a');
        strokeStyle(COLOR_WHITE);
        moveTo(points[0], points[1]);
        let length = points.length;
        let close = true;
        if(length%2 == 1) {
            close = points[length-1] == 1;
            length--;
        }
        for(let i = 2; i<length-1; i+=2) {
            lineTo(points[i], points[i+1]);
        }
        for(let i = length-2; i>=0; i-=2) {
            lineTo(-points[i], points[i+1]);
        }
        if(close) {
            lineTo(points[0], points[1]);
        }
        setFillModeDelete();
        fill();
        setFillModeFill();
        stroke();
    });
    restoreContext();

"use strict";

// Some general notes and recommendations:
//  * This code uses modern ECMAScript features, such as ** instead of
//    Math.pow(). You may have to modify the code to make it work on older
//    browsers.
//  * If you're not using all the functionality (e.g. not all oscillator types,
//    or certain effects), you can reduce the size of the player routine even
//    further by deleting the code.


let CPlayer = function() {

    //--------------------------------------------------------------------------
    // Private methods
    //--------------------------------------------------------------------------

    // Oscillators
    let osc_sin = function (value) {
        return Math.sin(value * 6.283184);
    };

    let osc_saw = function (value) {
        return 2 * (value % 1) - 1;
    };

    let osc_square = function (value) {
        return (value % 1) < 0.5 ? 1 : -1;
    };

    let osc_tri = function (value) {
        let v2 = (value % 1) * 4;
        if(v2 < 2) return v2 - 1;
        return 3 - v2;
    };

    let getnotefreq = function (n) {
        // 174.61.. / 44100 = 0.003959503758 (F3)
        return 0.003959503758 * (2 ** ((n - 128) / 12));
    };

    let createNote = function (instr, n, rowLen) {
        let osc1 = mOscillators[instr.i[0]],
            o1vol = instr.i[1],
            o1xenv = instr.i[3]/32,
            osc2 = mOscillators[instr.i[4]],
            o2vol = instr.i[5],
            o2xenv = instr.i[8]/32,
            noiseVol = instr.i[9],
            attack = instr.i[10] * instr.i[10] * 4,
            sustain = instr.i[11] * instr.i[11] * 4,
            release = instr.i[12] * instr.i[12] * 4,
            releaseInv = 1 / release,
            expDecay = -instr.i[13]/16,
            arp = instr.i[14],
            arpInterval = rowLen * (2 **(2 - instr.i[15]));

        let noteBuf = new Int32Array(attack + sustain + release);

        // Re-trig oscillators
        let c1 = 0, c2 = 0;

        // Local variables.
        let j, j2, e, t, rsample, o1t, o2t;

        // Generate one note (attack + sustain + release)
        for (j = 0, j2 = 0; j < attack + sustain + release; j++, j2++) {
            if (j2 >= 0) {
                // Switch arpeggio note.
                arp = (arp >> 8) | ((arp & 255) << 4);
                j2 -= arpInterval;

                // Calculate note frequencies for the oscillators
                o1t = getnotefreq(n + (arp & 15) + instr.i[2] - 128);
                o2t = getnotefreq(n + (arp & 15) + instr.i[6] - 128) * (1 + 0.0008 * instr.i[7]);
            }

            // Envelope
            e = 1;
            if (j < attack) {
                e = j / attack;
            } else if (j >= attack + sustain) {
                e = (j - attack - sustain) * releaseInv;
                e = (1 - e) * (3 ** (expDecay * e));
            }

            // Oscillator 1
            c1 += o1t * e ** o1xenv;
            rsample = osc1(c1) * o1vol;

            // Oscillator 2
            c2 += o2t * e ** o2xenv;
            rsample += osc2(c2) * o2vol;

            // Noise oscillator
            if (noiseVol) {
                rsample += (2 * Math.random() - 1) * noiseVol;
            }

            // Add to (mono) channel buffer
            noteBuf[j] = (80 * rsample * e) | 0;
        }

        return noteBuf;
    };


    //--------------------------------------------------------------------------
    // Private members
    //--------------------------------------------------------------------------

    // Array of oscillator functions
    let mOscillators = [
        osc_sin,
        osc_square,
        osc_saw,
        osc_tri
    ];

    // Private variables set up by init()
    let mSong, mLastRow, mCurrentCol, mNumWords, mMixBuf;


    //--------------------------------------------------------------------------
    // Initialization
    //--------------------------------------------------------------------------

    this.init = function (song) {
        // Define the song
        mSong = song;

        // Init iteration state variables
        mLastRow = song.endPattern;
        mCurrentCol = 0;

        // Prepare song info
        mNumWords =  song.rowLen * song.patternLen * (mLastRow + 1) * 2;

        // Create work buffer (initially cleared)
        mMixBuf = new Int32Array(mNumWords);
    };


    //--------------------------------------------------------------------------
    // Public methods
    //--------------------------------------------------------------------------

    // Generate audio data for a single track
    this.generate = function () {
        // Local variables
        let i, j, b, p, row, col, n, cp,
            k, t, lfor, e, x, rsample, rowStartSample, f, da;

        // Put performance critical items in local variables
        let chnBuf = new Int32Array(mNumWords),
            instr = mSong.songData[mCurrentCol],
            rowLen = mSong.rowLen,
            patternLen = mSong.patternLen;

        // Clear effect state
        let low = 0, band = 0, high;
        let lsample, filterActive = false;

        // Clear note cache.
        let noteCache = [];

         // Patterns
         for (p = 0; p <= mLastRow; ++p) {
            cp = instr.p[p];

            // Pattern rows
            for (row = 0; row < patternLen; ++row) {
                // Execute effect command.
                let cmdNo = cp ? instr.c[cp - 1].f[row] : 0;
                if (cmdNo) {
                    instr.i[cmdNo - 1] = instr.c[cp - 1].f[row + patternLen] || 0;

                    // Clear the note cache since the instrument has changed.
                    if (cmdNo < 17) {
                        noteCache = [];
                    }
                }

                // Put performance critical instrument properties in local variables
                let oscLFO = mOscillators[instr.i[16]],
                    lfoAmt = instr.i[17] / 512,
                    lfoFreq = (2 ** (instr.i[18] - 9)) / rowLen,
                    fxLFO = instr.i[19],
                    fxFilter = instr.i[20],
                    fxFreq = instr.i[21] * 43.23529 * 3.141592 / 44100,
                    q = 1 - instr.i[22] / 255,
                    dist = instr.i[23] * 1e-5,
                    drive = instr.i[24] / 32,
                    panAmt = instr.i[25] / 512,
                    panFreq = 6.283184 * (2 ** (instr.i[26] - 9)) / rowLen,
                    dlyAmt = instr.i[27] / 255,
                    dly = instr.i[28] * rowLen & ~1;  // Must be an even number

                // Calculate start sample number for this row in the pattern
                rowStartSample = (p * patternLen + row) * rowLen;

                // Generate notes for this pattern row
                for (col = 0; col < 4; ++col) {
                    n = cp ? instr.c[cp - 1].n[row + col * patternLen] : 0;
                    if (n) {
                        if (!noteCache[n]) {
                            noteCache[n] = createNote(instr, n, rowLen);
                        }

                        // Copy note from the note cache
                        let noteBuf = noteCache[n];
                        for (j = 0, i = rowStartSample * 2; j < noteBuf.length; j++, i += 2) {
                          chnBuf[i] += noteBuf[j];
                        }
                    }
                }

                // Perform effects for this pattern row
                for (j = 0; j < rowLen; j++) {
                    // Dry mono-sample
                    k = (rowStartSample + j) * 2;
                    rsample = chnBuf[k];

                    // We only do effects if we have some sound input
                    if (rsample || filterActive) {
                        // State variable filter
                        f = fxFreq;
                        if (fxLFO) {
                            f *= oscLFO(lfoFreq * k) * lfoAmt + 0.5;
                        }
                        f = 1.5 * Math.sin(f);
                        low += f * band;
                        high = q * (rsample - band) - low;
                        band += f * high;
                        rsample = fxFilter == 3 ? band : fxFilter == 1 ? high : low;

                        // Distortion
                        if (dist) {
                            rsample *= dist;
                            rsample = rsample < 1 ? rsample > -1 ? osc_sin(rsample*.25) : -1 : 1;
                            rsample /= dist;
                        }

                        // Drive
                        rsample *= drive;

                        // Is the filter active (i.e. still audiable)?
                        filterActive = rsample * rsample > 1e-5;

                        // Panning
                        t = Math.sin(panFreq * k) * panAmt + 0.5;
                        lsample = rsample * (1 - t);
                        rsample *= t;
                    } else {
                        lsample = 0;
                    }

                    // Delay is always done, since it does not need sound input
                    if (k >= dly) {
                        // Left channel = left + right[-p] * t
                        lsample += chnBuf[k-dly+1] * dlyAmt;

                        // Right channel = right + left[-p] * t
                        rsample += chnBuf[k-dly] * dlyAmt;
                    }

                    // Store in stereo channel buffer (needed for the delay effect)
                    chnBuf[k] = lsample | 0;
                    chnBuf[k+1] = rsample | 0;

                    // ...and add to stereo mix buffer
                    mMixBuf[k] += lsample | 0;
                    mMixBuf[k+1] += rsample | 0;
                }
            }
        }

        // Next iteration. Return progress (1.0 == done!).
        mCurrentCol++;
        return mCurrentCol / mSong.numChannels;
    };

    // Create a AudioBuffer from the generated audio data
    this.createAudioBuffer = function(context) {
        let buffer = context.createBuffer(2, mNumWords / 2, 44100);
        for (let i = 0; i < 2; i ++) {
            let data = buffer.getChannelData(i);
            for (let j = i; j < mNumWords; j += 2) {
                data[j >> 1] = mMixBuf[j] / 65536;
            }
        }
        return buffer;
    };
    
    // Create a WAVE formatted Uint8Array from the generated audio data
    this.createWave = function() {
        // Create WAVE header
        let headerLen = 44;
        let l1 = headerLen + mNumWords * 2 - 8;
        let l2 = l1 - 36;
        let wave = new Uint8Array(headerLen + mNumWords * 2);
        wave.set(
            [82,73,70,70,
             l1 & 255,(l1 >> 8) & 255,(l1 >> 16) & 255,(l1 >> 24) & 255,
             87,65,86,69,102,109,116,32,16,0,0,0,1,0,2,0,
             68,172,0,0,16,177,2,0,4,0,16,0,100,97,116,97,
             l2 & 255,(l2 >> 8) & 255,(l2 >> 16) & 255,(l2 >> 24) & 255]
        );

        // Append actual wave data
        for (let i = 0, idx = headerLen; i < mNumWords; ++i) {
            // Note: We clamp here
            let y = mMixBuf[i];
            y = y < -32767 ? -32767 : (y > 32767 ? 32767 : y);
            wave[idx++] = y & 255;
            wave[idx++] = (y >> 8) & 255;
        }

        // Return the WAVE formatted typed array
        return wave;
    };

    // Get n samples of wave data at time t [s]. Wave data in range [-2,2].
    this.getData = function(t, n) {
        let i = 2 * Math.floor(t * 44100);
        let d = new Array(n);
        for (let j = 0; j < 2*n; j += 1) {
            let k = i + j;
            d[j] = t > 0 && k < mMixBuf.length ? mMixBuf[k] / 32768 : 0;
        }
        return d;
    };
};

	<script>const audios = [];

function loadMusic(song, audioname, loop) {
    let musicplayer = new CPlayer();
    musicplayer.init(song);
    while(musicplayer.generate() < 1) {}
    let wave = musicplayer.createWave();
    audios[audioname] = document.createElement("audio");
    audios[audioname].src = URL.createObjectURL(new Blob([wave], {type: "audio/wav"}));
    audios[audioname].loop = loop;
}
function playAudio(audioname, restart = true) {
    let audio = audios[audioname];
    if(audio) {
        if(restart || audio.paused) {
            audio.currentTime = 0;
            audio.play();
        }
    }
}
function stopAudio(audioname) {
    let audio = audios[audioname];
    if(audio) {
        audio.pause();
        audio.currentTime = 0;
    }
}
function isPlaying(audioname) {
    let audio = audios[audioname];
    if(audio) {
        return !audio.paused;
    }
    return false;
}</script>

function createTriskaideka(x,y,size = 1) {
    let tris = {x:x, y:y, s:size, ttl:Infinity};
    tris._r = () => renderTriskaideka(tris);
    tris._u = (delta) => {tris.s = size + sin(gameTime) * 0.05 + 0.05;}

            for(let i = 2; i < letter.length -1; i+=2) {

            lineTo(letter[0] * size, letter[1] * size);
            fill();
            stroke();

	<script>function createButton(x,y,w,h,text,active,click) {
    let btn = {
        x,y,w,h,t:text,c:click,
        ot:GAMEOBJECT_TYPE_BUTTON,
        a:active,
        l:{} // navigationlinks (directions)
    };
    btn._r = ()=>renderButton(btn);
    return btn;
}

function createText(x,y,text, size = 30) {
    let textObject = {
        x,y,t:text, s:size
    };
    textObject._r = ()=>renderText(textObject);
    return textObject;
}

const DIRECTION_DOWN = 1;
const DIRECTION_UP = -1;

function linkButtons(buttonFrom, buttonTo, direction) {
    buttonFrom.l[direction] = buttonTo;
    buttonTo.l[-direction] = buttonFrom;
}

function renderButton(btn) {
    saveContext();
    translateContext(btn.x - btn.w/2, btn.y - btn.h/2);
    strokeStyle(COLOR_WHITE);
    if(btn.a) {
        ctx.lineWidth = 5;
        fillStyle('#ffa6');
        fillRect(0,0,btn.w, btn.h);
    } else {
        ctx.lineWidth = 1;
    }
    rect(0,0,btn.w, btn.h);
    fillStyle(COLOR_WHITE);
    let ts = btn.ts || 24;
    ctx.font = ts + 'px sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline  = "middle";
    ctx.fillText(btn.t, btn.w/2, btn.h/2);
    restoreContext();
}

function renderText(text) {
    saveContext();
    translateContext(text.x, text.y);
    fillStyle(COLOR_WHITE);
    ctx.font = text.s + 'px sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline  = "middle";
    ctx.fillText(text.t, 0, 0);
    restoreContext();
}</script>

	<script>const GROUND_HEIGHT = BASEHEIGHT - 50;

const GAMEOBJECT_TYPE_SNAKE = 1;
const GAMEOBJECT_TYPE_LASER = 2;
const GAMEOBJECT_TYPE_ENEMY = 3;
const GAMEOBJECT_TYPE_BUTTON = 4;
const GAMEOBJECT_TYPE_SQUID = 5;
const GAMEOBJECT_TYPE_TENTACLE = 6;
const GAMEOBJECT_TYPE_ENEMY_BULLET = 7;

const STATE_LOADING = 0;
const STATE_MENU = 1;
const STATE_ACTION = 2;

let gameObjects = [];
let gameState = STATE_MENU;


const GAMEDATA_XP = 0;
const GAMEDATA_SHIP_WEAPON = 1;
const shipWeaponMaxValue = 3;
const GAMEDATA_SHIP_FIRERATE = 2;
const shipFirerateMaxValue = 5; // shots per second
const gameData = [];
gameData[GAMEDATA_XP] = 0;
gameData[GAMEDATA_SHIP_WEAPON] = 1;
gameData[GAMEDATA_SHIP_FIRERATE] = 1;

const msgDiv = document.querySelector('.msg');
const sky = document.querySelector('#sky');
let currentLevel = 0;
let upgradePoints = 0;

const killCount = {
    e:0,
    sn:0,
    sq:0,
    sqr:0,
    p:0
}

function resetKillCount() {
    killCount.e = 0;
    killCount.sn = 0;
    killCount.sq = 0;
    killCount.sqr = 0;
    killCount.p = 0;
}

function countKill(what) {
    switch(what) {
        case GAMEOBJECT_TYPE_ENEMY:
            killCount.e++;
            killCount.p += 3;
            break;
        case GAMEOBJECT_TYPE_SNAKE:
            killCount.sn++;
            killCount.p += 7;
            break;
        case SQUID_TYPE_NORMAL:
            killCount.sq++;
            killCount.p += 13;
            break;
        case SQUID_TYPE_ROTATING:
            killCount.sqr++;
            killCount.p += 17;
            break;
        default:
    }
}

// mouse warning
let noMouseText = null;
document.addEventListener("click",()=>{
    if(noMouseText == null && gameState == STATE_MENU && currentLevel == 0) {
        noMouseText = addGameObject(createText(BASEWIDTH/2,410,"Please, use the keyboard or a gamepad, not the mouse or touch.",30));
    }
});

// horizontal wrap of the playarea
let leftMostEnemy = -BASEWIDTH;
let rightMostEnemy = BASEWIDTH;
const WRAP_DISTANCE = BASEWIDTH * 4;

function addGameObject(gameObject) {
    gameObjects.push(gameObject);
    return gameObject;
}

function getGameObjectsByType(type) {
    return gameObjects.filter(gameObject => gameObject.ot && gameObject.ot == type);
}

const waterCanvas = createSpriteBuffer(BASEWIDTH, BASEHEIGHT);


function render() {
    ctx.clearRect(0,0,BASEWIDTH, BASEHEIGHT);
    gameObjects
        .filter(gameObject=>gameObject._r)
        .forEach(gameObject => gameObject._r());
    if(gameState == STATE_ACTION) {
        player._r();
        renderGround();
        let [groundX,groundY] = getCameraView({x:0, y:GROUND_HEIGHT});
        if(groundY < BASEHEIGHT) {
            waterCanvas.ctx.clearRect(0,0,BASEWIDTH, BASEHEIGHT); 
            waterCanvas.ctx.save();
            waterCanvas.ctx.scale(1,-1)
            waterCanvas.ctx.drawImage(canvas, 0,0, BASEWIDTH, BASEHEIGHT, 0,BASEHEIGHT-groundY+3, BASEWIDTH,-BASEHEIGHT);
            waterCanvas.ctx.restore();
            ctx.globalAlpha = 0.5;
            ctx.drawImage(waterCanvas.c, 0, groundY, BASEWIDTH, BASEHEIGHT/3);
            ctx.globalAlpha = 1;
        }
        drawHUD();
    } else if(gameState == STATE_MENU) {
        // if there are special effects in menu...
    }
}

function renderGround() {
    saveContext();
    translateContext(camera.x-BASEWIDTH/2, GROUND_HEIGHT);
    ctx.clearRect(0,0,BASEWIDTH, BASEHEIGHT);
    fillStyle('#0056');
    fillRect(0,0,BASEWIDTH, BASEHEIGHT);
    let y = 0;
    [5,4,3,1].forEach(lineWidth => {
        beginPath();
        ctx.lineWidth = lineWidth;
        strokeStyle(COLOR_WHITE);
        moveTo(0, y);
        lineTo(BASEWIDTH, y);
        stroke();
        y += lineWidth * 2;
    });
    restoreContext();
}

function updateWrapPositions(gameObject) {
    leftMostEnemy = gameObject.x < leftMostEnemy ? gameObject.x : leftMostEnemy;
    rightMostEnemy = gameObject.x > rightMostEnemy ? gameObject.x : rightMostEnemy;
}

function update() {
    let delta = getDelta();
    getGamepadState();
    gameTime += delta;
    camera._u(delta);

    // background gradient position
    let maxBgTop = BASEHEIGHT * 9; // the world is 9 screens tall
    let camheight = camera.y - BASEHEIGHT / 2;
    let topPosition = (clamp(maxBgTop + camheight, 0, maxBgTop) / maxBgTop) * -900;
    bgGradientDiv.style.top = topPosition + "vh";
    if(gameState == STATE_MENU) {
        let buttons = getGameObjectsByType(GAMEOBJECT_TYPE_BUTTON);
        let activeButton = buttons.find(b=>b.a);
        let actionPressed = getGamepadButtonPressed(GAMEPAD_A) || keyActive(KEY_ACTION_FIRE);
        if(!menuActionWasReleased && !actionPressed) {
            menuActionWasReleased = true;
        }
        if(activeButton && menuActionWasReleased && actionPressed) {
            menuActionWasReleased = false;
            activeButton.c();
        }
        let downPressed = keyActive(KEY_ACTION_DOWN) || getGamepadButtonPressed(GAMEPAD_DOWN) || getGamepadStickValue(STICK_LEFT_VERTICAL) > 0.3;
        let upPressed = keyActive(KEY_ACTION_UP) || getGamepadButtonPressed(GAMEPAD_UP) || getGamepadStickValue(STICK_LEFT_VERTICAL) < -0.3;
        if(!menuDirectionWasReleased && !downPressed && !upPressed) {
            menuDirectionWasReleased = true;
        }
        if(activeButton && activeButton.l[DIRECTION_DOWN] && downPressed && menuDirectionWasReleased) {
            activeButton.l[DIRECTION_DOWN].a = true;
            activeButton.a =false;
            menuDirectionWasReleased = false;
        }
        if(activeButton && activeButton.l[DIRECTION_UP] && upPressed && menuDirectionWasReleased) {
            activeButton.l[DIRECTION_UP].a = true;
            activeButton.a =false;
            menuDirectionWasReleased = false;
        }
        
    } else if(gameState == STATE_ACTION) {
        player._u(delta);
        leftMostEnemy = -BASEWIDTH;
        rightMostEnemy = BASEWIDTH;

        // collisions
        let lasers = getGameObjectsByType(GAMEOBJECT_TYPE_LASER);
        let bullets = getGameObjectsByType(GAMEOBJECT_TYPE_ENEMY_BULLET);
        let snakes = getGameObjectsByType(GAMEOBJECT_TYPE_SNAKE);
        let enemies = getGameObjectsByType(GAMEOBJECT_TYPE_ENEMY);
        let squids = getGameObjectsByType(GAMEOBJECT_TYPE_SQUID);
        if(!player.won && snakes.length + enemies.length + squids.length == 0) {
            player.lf = -2;
            msgDiv.classList.remove('hidden');
            let text = levels[currentLevel].success;
            if(levels[currentLevel].count) {
                text +="\n\nScore Details: " + killCount.e + " scouts, " + killCount.sn + " jabberwockies, " + killCount.sq + " squids and " + killCount.sqr + " starfishs."
            }
            msgDiv.innerText = text;
            player.won = true;
        }
        if(player.alive) {
            enemies.forEach(enemy => {
                updateWrapPositions(enemy);
                let hit = pointDistance(enemy, player) <= enemy.r + player.cr;
                if(hit && player.ct <= 0) {
                    player.h -= 1;
                    enemy.hp -= 1;
                    player.ct = 0.5;
                    cameraShake(0.25);
                    addGameObject(createParticleExplosion((enemy.x + player.x)/2, (enemy.y + player.y)/2, COLOR_RGB_YELLOW));
                }
            });
            bullets.forEach(bullet => {
                let hit = pointDistance(bullet, player) <= bullet.r + player.cr;
                if(hit) {
                    player.h -= 1;
                    cameraShake(0.25);
                    addGameObject(createParticleExplosion((bullet.x + player.x)/2, (bullet.y + player.y)/2, COLOR_RGB_YELLOW));
                    bullet.ttl = 0;
                }
            });
            snakes.forEach(snake => {
                updateWrapPositions(snake);
                let hit = pointDistance(player, snake) <= snake.r + player.cr;
                let currentSegment = snake;
                while(currentSegment.c && !hit) {
                    currentSegment = currentSegment.c;
                    hit = pointDistance(player, currentSegment) <= currentSegment.r + player.cr;
                }
                if(hit && player.ct <= 0) {
                    player.h -= 1;
                    snake.hp -= 1;
                    player.ct = 0.5;
                    cameraShake(0.25);
                    addGameObject(createParticleExplosion((currentSegment.x + player.x)/2, (currentSegment.y + player.y)/2, COLOR_RGB_YELLOW));
                }
            });
            squids.forEach(squid => {
                updateWrapPositions(squids);
                let { hit, currentSegment } = squidCollision(player,  player.cr, squid);
                if(hit && player.ct <= 0) {
                    player.h -= 1;
                    squid.hp -= 1;
                    player.ct = 0.5;
                    cameraShake(0.25);
                    addGameObject(createParticleExplosion((currentSegment.x + player.x)/2, (currentSegment.y + player.y)/2, COLOR_RGB_YELLOW));
                }
            })
        }
        lasers.forEach(laser => {
            snakes.forEach(snake => {
                if(laser.ttl < 0) {
                    return;
                }
                let hit = pointDistance(laser, snake) <= snake.r;
                let currentSegment = snake;
                while(currentSegment.c && !hit) {
                    currentSegment = currentSegment.c;
                    hit = pointDistance(laser, currentSegment) <= currentSegment.r;
                }
                if(hit) {
                    laser.ttl = -1
                    snake.hp -= 1;
                    for(let i = 0; i < rand(3,7); i++) {
                        addGameObject(createParticleDebris(laser.x, laser.y));
                    }
                    playAudio(AUDIO_SFX_HIT);
                    if(snake.hp <= 0) {
                        if(respawns > 0 && !snake.tt) {
                            respawns--;
                            snake.y -= BASEHEIGHT/2;
                            snake.x += rand(0,1) >= 0.5 ? BASEWIDTH: -BASEWIDTH;
                            snake.hp = 10;
                        } else {
                            snake.ttl = -1;
                        }
                        explodeSnake(snake);
                        playAudio(AUDIO_SFX_EXPLOSION);
                    }
                }
            });
            enemies.forEach(enemy => {
                if(pointDistance(laser, enemy) <= enemy.r) {
                    laser.ttl = -1
                    enemy.hp -= 1;
                    for(let i = 0; i < rand(2,4); i++) {
                        addGameObject(createParticleDebris(laser.x, laser.y));
                    }
                    playAudio(AUDIO_SFX_HIT);
                    if(enemy.hp <= 0) {
                        if(respawns > 0) {
                            respawns--;
                            enemy.y -= BASEHEIGHT/2;
                            enemy.x += rand(0,1) >= 0.5 ? BASEWIDTH: -BASEWIDTH;
                            enemy.hp = 2;
                        } else {
                            enemy.ttl = -1;
                        }
                        explodeEnemy(enemy);
                        playAudio(AUDIO_SFX_EXPLOSION);
                    }
                }
            });
            squids.forEach(squid => {
                let { hit, currentSegment } = squidCollision(laser,  2, squid);
                if(hit) {
                    laser.ttl = -1
                    squid.hp -= 1;
                    for(let i = 0; i < rand(2,4); i++) {
                        addGameObject(createParticleDebris(laser.x, laser.y));
                    }
                    playAudio(AUDIO_SFX_HIT);
                }
            })
        });

        let actionPressed = getGamepadButtonPressed(GAMEPAD_A) || keyActive(KEY_ACTION_FIRE);
        if(!player.alive && player.lf >0 && actionPressed) {
            if(levels[currentLevel].adv) {
                currentLevel++;
            }
            loadGameMenu();
        } else if(player.won) {
            if(player.lf >0 && actionPressed) {
                currentLevel++;
                upgradePoints++;
                loadGameMenu();
            }
        }
    }

    gameObjects.forEach(gameObject => {
        if(gameObject._u) {
            gameObject._u(delta);
        }
    });
    gameObjects = gameObjects.filter(gameObject => gameObject.ttl === undefined || gameObject.ttl > 0);
}




let gameTime = 0;
function squidCollision(gameObject, collisionRadius, squid) {
    let currentSegment = squid;
    let hit = pointDistance(gameObject, squid) <= squid.s + collisionRadius;
    if (!hit) {
        for (let tentacle of squid.t) {
            hit = pointDistance(gameObject, tentacle) <= tentacle.r + collisionRadius;
            currentSegment = tentacle;
            while (currentSegment.c && !hit) {
                currentSegment = currentSegment.c;
                hit = pointDistance(gameObject, currentSegment) <= currentSegment.r + collisionRadius;
            }
            if (hit) {
                break;
            }
        }
    }
    return { hit, currentSegment };
}

function gameLoop() {
    update()
    render();
    requestAnimationFrame(gameLoop);
}

function clearObjects() {
    gameObjects = [];
}

let menuActionWasReleased = false;
let menuDirectionWasReleased = false;
function loadGameMenu() {
    msgDiv.classList.add('hidden');
    menuActionWasReleased = false;
    menuDirectionWasReleased = false;
    clearObjects();
    camera.x = BASEWIDTH/2;
    camera.y = BASEHEIGHT/2;
    camera.t = null;
    gameState = STATE_MENU;
    addGameObject(createTriskaideka(BASEWIDTH/2,70, 0.8));
    let level = levels[currentLevel];

    if(level.d) {
        addGameObject(createText(BASEWIDTH/2,370,level.d));
    }
    if(currentLevel == 0) {
        addGameObject(createText(BASEWIDTH/2,500,"Controls: Keyboard Arrows/WASD and SPACE or use a gamepad (button A)", 20));
        sky.className = "bg1";
    } else {
        sky.className = "bg"+randInt(1,3);
    }

    let upgradeDefaultActive = !level.hideUpdates && upgradePoints > 0;
    let btnStartMission = addGameObject(createButton(BASEWIDTH/2,450,300,40,level.m, !upgradeDefaultActive, loadGameAction));
    if(!level.hideUpdates || true) {
        let textUpgradePoints = addGameObject(createText(BASEWIDTH/2,530,"Available scrap for upgrades: 0", 30));
        textUpgradePoints._u = (delta) => textUpgradePoints.t = "Available scrap for upgrades: "+upgradePoints;
        let btnUpgradeLaser = addGameObject(createButton(BASEWIDTH/2,570,350,40,"ADD LASERS", upgradeDefaultActive, upgradeLaser));
        btnUpgradeLaser._u = (delta) => {btnUpgradeLaser.t = "UPGRADE LASER (" + (gameData[GAMEDATA_SHIP_WEAPON] == shipWeaponMaxValue ? "MAX" : gameData[GAMEDATA_SHIP_WEAPON]) + ")"}
        let btnUpgradeFireRate = addGameObject(createButton(BASEWIDTH/2,620,350,40,"ENHANCE FIRE RATE", false, upgradeFireRate));
        btnUpgradeFireRate._u = (delta) => {btnUpgradeFireRate.t = "ENHANCE FIRE RATE (" + (gameData[GAMEDATA_SHIP_FIRERATE] == shipFirerateMaxValue ? "MAX" : gameData[GAMEDATA_SHIP_FIRERATE]) + ")"}
        linkButtons(btnStartMission, btnUpgradeLaser, DIRECTION_DOWN);
        linkButtons(btnUpgradeLaser, btnUpgradeFireRate, DIRECTION_DOWN);

        if(!storySkipped) {
            let btnSkipStory = addGameObject(createButton(BASEWIDTH/2,730,550,30,"pause the story - release the whole TRISKAIDEKA fleet", false, skipStory));
            btnSkipStory.ts = 18;
            linkButtons(btnUpgradeFireRate, btnSkipStory, DIRECTION_DOWN);
        } else { 
            let btnReturnStory = addGameObject(createButton(BASEWIDTH/2,730,550,30,"return to the story - where you left", false, returnToStory));
            btnReturnStory.ts = 18;
            linkButtons(btnUpgradeFireRate, btnReturnStory, DIRECTION_DOWN);
        }
    }

    addGameObject(createText(BASEWIDTH/2,BASEHEIGHT-40,"A 13 kilobyte game by DerBenniBanni (Github / itch.io / X) for the 2024 js13kgames.com gamejam", 20));
    
    if(currentLevel > 0) {
        playAudio(AUDIO_SONG_AIRWOLFMENU);
        stopAudio(AUDIO_SONG_AIRWOLF);
    }

}
let storySkipped = false;
let savedGameData = [];
let savedLevel = 0;
function skipStory() {
    storySkipped = true;
    savedGameData = [];
    gameData.forEach((value) => savedGameData.push(value));
    savedLevel = currentLevel;
    currentLevel = levels.length - 1;
    gameData[GAMEDATA_SHIP_FIRERATE] = shipFirerateMaxValue;
    gameData[GAMEDATA_SHIP_WEAPON] = shipWeaponMaxValue;
    gameData[GAMEDATA_XP] = 0;
    loadGameMenu();
}
function returnToStory() {
    storySkipped = false;
    gameData.length = 0;
    savedGameData.forEach((value) => gameData.push(value));
    currentLevel = savedLevel;
    loadGameMenu();
}
function upgradeLaser() {
    if(upgradePoints > 0 && gameData[GAMEDATA_SHIP_WEAPON] < shipWeaponMaxValue) {
        gameData[GAMEDATA_SHIP_WEAPON] += 1;
        upgradePoints--;
    }
}

function upgradeFireRate() {
    if(upgradePoints > 0 && gameData[GAMEDATA_SHIP_FIRERATE] < shipFirerateMaxValue) {
        gameData[GAMEDATA_SHIP_FIRERATE] += 1;
        upgradePoints--;
    }
}

            let y = player.y - rand(0, BASEHEIGHT);

    }
    /*
    [ENEMY_WING_A, ENEMY_WING_B, ENEMY_WING_C, ENEMY_WING_D, ENEMY_WING_E].forEach((wing,i) => {
        let x = 100 + i*50;
        [ENEMY_HULL_A, ENEMY_HULL_B, ENEMY_HULL_C].forEach((hull,j) => {
            let y = 200 + j*150;
            [ENEMY_COCKPIT_A, ENEMY_COCKPIT_B, ENEMY_COCKPIT_C].forEach((cockpit, k) => {
                let y1 = y + k*50;
                //addGameObject(createEnemy(x,y1,[wing, hull, cockpit]));
                addGameObject(createEnemy(rand(-BASEWIDTH, BASEWIDTH*2), rand(-BASEHEIGHT*2,0),[wing, hull, cockpit]));
            });
        });
    });
    */

    
    playAudio(AUDIO_SONG_AIRWOLF);
    stopAudio(AUDIO_SONG_AIRWOLFMENU);
}</script>
