const ROCKET_LINES=[new Line(new Vector(0,-30),new Vector(15,30)),new Line(new Vector(15,30),new Vector(0,15)),new Line(new Vector(0,15),new Vector(-15,30)),new Line(new Vector(-15,30),new Vector(0,-30))];const ROCKET_MOVE_SPEED=0.3;const ROCKET_LEAN_ANGLE=Math.PI/6;const ROCKET_ACCELERATION=0.0005;const ROCKET_FRICTION=0.0015;var rocket_shield=0;var rocket_gun=0;var fire_gun=!1;var rocket_totem=!1;class Rocket extends Entity{constructor(){var position=new Vector(canvas_size/2,canvas_size-50);super(position,ROCKET_LINES,0);this.colour=new Colour(173,255,47);this.invincibility=3000;this.direction="left";this.x_speed=0;this.health=5}

if(rocket_shield<=0){zzfx(...[1.99,,212,.13,.04,.09,3,2.36,,,,,,,-95,,.44,.35,.01])}else{zzfx(...[1.58,,65.40639,.21,.07,.13,,1.95,-0.2,4,,,,2,,.4,.1,.82,.05,.02])}}else if(entity.constructor==Powerup){entity.shatter();zzfx(...[1.1,,246.9417,.03,.36,.92,,1.25,.2,-0.5,-290,.1,.1,,,,,.88,.07]);this.receive_powerup(entity.get_power_type())}}});if(Math.round(rocket_shield)%100==0&&rocket_shield>0){this.set_colour(this.get_colour().clone(-5,-5,-5))}else if(rocket_shield<=0){this.set_colour(new Colour(173,255,47))}

this.active=!1;game_state="game over";if(score>high_score){high_score=score}}}}
class Powerup extends Entity{constructor(x,power_type,colour){var tri_sides=3;var position=new Vector(x,-100);var center_angle=Math.PI*2/tri_sides;var radius=20;var lines=[];for(var i=0;i<tri_sides;++i){var angle=i*center_angle;var start=new Vector(Math.cos(angle)*radius,Math.sin(angle)*radius);var end=new Vector(Math.cos(angle+center_angle)*radius,Math.sin(angle+center_angle)*radius);lines.push(new Line(start,end))}

        <script>/**
 * @type { HTMLCanvasElement }
 */
const canvas  = document.querySelector("canvas");
const context = canvas.getContext("2d");

const canvas_size = Math.min(window.innerWidth, window.innerHeight) - 2;

canvas.width = canvas.height = canvas_size;

// not sure if i'll be needing this
class Sprite {
    /**
     * @param { string } path the path pointing to the sprite
     */
    constructor(path) {
        this.img     = new Image();
        this.img.src = path;
        this.width   = this.img.width;
        this.height  = this.img.height;
    }
}

/**
 * 
 * @param { CanvasRenderingContext2D } context 
 * @param { string } text 
 * @param { number } x 
 * @param { number } y 
 * @param { string } background_colour 
 * @param { string } text_colour 
 */
function fill_text_with_background(context, text, x, y, padding, background_colour, text_colour) {
    var text_metrics = context.measureText(text);
    var draw_x       = 0;
    var draw_y       = 0;
    switch (context.textAlign) {
        // going to assume English, unless i learn some more languages. human languages, not programmming languages
        case "start":
        case "left":
            draw_x = x;
            break;
        case "center":
            draw_x = x - text_metrics.width / 2;
            break;
        case "right":
        case "end":
            draw_x = x - text_metrics.width;
            break;
    }
    draw_x = draw_x - padding;
    draw_y = y - text_metrics.actualBoundingBoxAscent - padding;

    var draw_width  = text_metrics.width + 2 * padding;
    var draw_height = text_metrics.actualBoundingBoxAscent + text_metrics.actualBoundingBoxDescent + 2 * padding;

    context.save();
    context.fillStyle = background_colour;
    context.fillRect(draw_x, draw_y, draw_width, draw_height);
    context.fillStyle = text_colour;
    context.fillText(text, x, y);
    context.restore();
}

/**
 * 
 * @param { Entity[] } objects 
 * @param { Line_particle[] } particles
 * @param { CanvasRenderingContext2D } context 
 */
function draw(objects, particles, context) {
    context.clearRect(0, 0, canvas_size, canvas_size);
    context.lineWidth = 4;
    objects.forEach(obj => {
        if (!obj.active) return;
        context.strokeStyle = obj.colour.to_string();
        if (obj.constructor == Rocket) {
            // draw an arrow to guide the player and show them where their ship is going next
            var draw_arrow_direction;
            if (!space_bar) {
                // we need to draw the opposite direction
                if (obj.direction == "left") {
                    draw_arrow_direction = "right";
                } else {
                    draw_arrow_direction = "left";
                }
            } else {
                draw_arrow_direction = obj.direction;
            }

            context.fillStyle = "lime";
            context.save();
            context.translate(obj.position.x, obj.position.y);
            context.beginPath();
            switch (draw_arrow_direction) {
                case "left":
                    context.moveTo(-30, 15);
                    context.lineTo(-30, -15);
                    context.lineTo(-45, 0);
                    break;
                case "right":
                    context.moveTo(30, 15);
                    context.lineTo(30, -15);
                    context.lineTo(45, 0);
                    break;
            }
            context.closePath();
            context.fill();
            context.restore();

            if (Math.floor(obj.invincibility / 200) % 2) {
                return;
            }
        }
        context.beginPath();
        context.shadowColor = obj.colour.to_string();
        context.shadowBlur = 80;
        obj.get_lines().forEach(line => {
            context.moveTo(line.start.x, line.start.y);
            context.lineTo(line.end.x, line.end.y);
        });
        context.closePath();
        context.stroke();
    });

    particles.forEach(particle => {
        context.strokeStyle = particle.colour.to_string();
        context.beginPath();
        context.moveTo(particle.start.x, particle.start.y);
        context.lineTo(particle.end.x, particle.end.y);
        context.closePath();
        context.stroke();
    });

    context.save();

    switch (game_state) {
        case "menu":
            context.font      = "30px sans-serif";
            context.textAlign = "center";
            fill_text_with_background(context, "weaving rocket", canvas_size / 2, canvas_size / 2, 3, "black", "white");
            context.font = "15px sans-serif";
            fill_text_with_background(context, "use the SPACE BAR to weave in between the asteroids", canvas_size / 2, canvas_size / 2 + 40, "black", "white");
            if (frames % 60 < 30) {
                context.font = "15px sans-serif";
                fill_text_with_background(context, "press SPACE to start", canvas_size / 2, canvas_size / 2 + 80, "black", "white");
            }
            break;
        case "game over":
            context.font      = "30px sans-serif";
            context.textAlign = "center";
            fill_text_with_background(context, "GAME OVER", canvas_size / 2, canvas_size / 2, 3, "black", "white");
            if (frames % 60 < 30) {
                context.font = "15px sans-serif";
                fill_text_with_background(context, "press SPACE to restart", canvas_size / 2, canvas_size / 2 + 40, "black", "white");
            }
            break;
        case "playing":
            if (player == null) break;
            context.font         = "25px sans-serif";
            context.textAlign    = "left";
            context.textBaseline = "top";
            fill_text_with_background(context, `health: ${ player.health }`, 3, 3, 5, "black", "white");
            fill_text_with_background(context, `score: ${ score }`, 3, 41, 5, "black", "white");
            if (high_score) {
                fill_text_with_background(context, `best: ${ high_score }`, 3, 79, 5, "black", "white");
            }
    }

    context.restore();

    frames++;
}</script>
        <script>// entities and particles are in objects.js

/*
    for asteroid density, 0.05 is very few asteroids, 0.2 is a lot and almost impossible to dodge
*/
var asteroid_density = 0.05;
var powerup_chance = 0.0015;

function reset() {
    // clear everything
    entities   = [];
    game_state = "menu";
    player     = null;
    score      = 0;
}

function start() {
    // give the player a new rocket
    player = new Rocket();
    entities.push(player);

    game_state = "playing";
    frames     = 0;
}

/**
 * @param { number } lapse 
 */
function update(lapse) {
    // detect if the space bar is pressed
    if (space_bar & KEY_PRESSED) {
        if (game_state == "menu") {
            start();
            space_bar = KEY_SEEN;
        }
        if (game_state == "game over") {
            reset();
            space_bar = KEY_SEEN;
        }
    }

    // update everything as usual
    entities = entities.filter(e => e.active);
    entities.forEach(e => e.update(lapse, entities));

    particles = particles.filter(p => p.lifetime > 0);
    particles.forEach(p => p.update(lapse));

    if (Math.random() < asteroid_density) {
        entities.push(new Asteroid(Math.random() * canvas_size, Math.floor(Math.random() * 8 + 5), new Colour(255, 255, 255)));
    }

    if (Math.random() < powerup_chance) {
        entities.push(new Powerup(Math.random() * canvas_size, ["shield", "gun", "totem"][Math.floor(Math.random() * 3)], new Colour(255, 0, 0)));
    }

    if (fire_gun) {
        entities.push(new Bullet());
        fire_gun = !fire_gun;
    }

    if (game_state == "playing" && (frames % 60) == 0) {
        score++;
    }
}

var last_time = null;
function animate(time) {
    var lapse = last_time == null ? 0 : time - last_time;
    lapse     = Math.min(lapse, 33);
    last_time = time;
    update(lapse);
    draw(entities, particles, context);
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);</script>
