<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Unicorn Factory</title>
<style>
*{margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0818;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id=c></canvas>
<script>// Shared shorthands, canvas handle, raw input state and 2D drawing primitives.
// Comments are stripped by terser, so they cost nothing in the shipped zip.
const C = document.getElementById('c'), X = C.getContext('2d');
const M = Math, PI = M.PI, TAU = PI * 2;
const min = M.min, max = M.max, abs = M.abs, flr = M.floor, pow = M.pow, rnd = M.random;
const cos = M.cos, sin = M.sin;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + rnd() * (b - a);
const ease = t => t * t * (3 - 2 * t);
const hash = i => ((i * 9301 + 49297) % 233280) / 233280;

let W = 0, H = 0, DPR = 1, TIME = 0;

// Pointer: x/y track the cursor, dy/w accumulate scroll deltas consumed once per frame,
// tap fires on a press-release that never turned into a drag.
const IN = { x: -9, y: -9, dn: 0, tap: 0, tx: 0, ty: 0, drag: 0, dy: 0, w: 0 };
// Which control scheme the player is actually using, so a hint can name a key or
// a button. Set by the pointer type and cleared by any keypress: a media query
// would call a touchscreen laptop a phone for as long as its owner keeps typing.
let TCH = 0;
let _sy = 0;
const _p = e => { IN.x = e.clientX; IN.y = e.clientY };
C.addEventListener('pointerdown', e => {
  au(); _p(e); IN.dn = 1; IN.drag = 0; _sy = e.clientY; IN.dy = 0; TCH = e.pointerType == 'mouse' ? 0 : 1;
  try { C.setPointerCapture(e.pointerId) } catch (z) { }
});
C.addEventListener('pointermove', e => {
  if (IN.dn) { IN.dy += e.clientY - IN.y; if (abs(e.clientY - _sy) > 7) IN.drag = 1 }
  _p(e);
});
const _up = () => { if (IN.dn && !IN.drag) { IN.tap = 1; IN.tx = IN.x; IN.ty = IN.y } IN.dn = 0 };
// A tap is consumed by whoever reads it first, so the title, the shop and the
// board never all act on the same one.
const tapped = () => IN.tap ? (IN.tap = 0, 1) : 0;
C.addEventListener('pointerup', _up);
C.addEventListener('pointercancel', _up);
addEventListener('wheel', e => { IN.w += e.deltaY; e.preventDefault() }, { passive: false });
addEventListener('contextmenu', e => e.preventDefault());

const K = {};
addEventListener('keydown', e => { au(); TCH = 0; K[e.key] = 1; if (e.key == ' ' || e.key.slice(0, 5) == 'Arrow') e.preventDefault() });
addEventListener('keyup', e => K[e.key] = 0);
addEventListener('blur', () => { for (const k in K) K[k] = 0 });

// --- filled shapes -------------------------------------------------------
const dot = (x, y, r) => { X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill() };
const tri = (a, b, c, d, e, f) => { X.beginPath(); X.moveTo(a, b); X.lineTo(c, d); X.lineTo(e, f); X.closePath(); X.fill() };
const box = (x, y, w, h, r) => { X.beginPath(); X.roundRect(x, y, w, h, r) };
// Filled rounded rect with an optional outline: every panel, pill and button.
const plate = (x, y, w, h, r, fill, line, lw) => {
  X.fillStyle = fill; box(x, y, w, h, r); X.fill();
  if (line) { X.strokeStyle = line; X.lineWidth = lw || 1; X.stroke() }
};

// --- stroked shapes ------------------------------------------------------
// Open a stroked path. Every outline in the game picks a colour and a width and
// then starts drawing, so the three go together; the caller still strokes, since
// a few build several subpaths first.
const strk = (col, w) => { X.strokeStyle = col; X.lineWidth = w; X.beginPath() };
const seg = (x0, y0, x1, y1) => { X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1) };
// An X, on its own ellipse so it can be squashed: the mistake marker in the order
// list, the shop's close button and the bar across a muted speaker.
const cross = (x, y, rx, ry) => {
  seg(x - rx, y - ry, x + rx, y + ry);
  X.moveTo(x + rx, y - ry); X.lineTo(x - rx, y + ry);
};

// --- text ----------------------------------------------------------------
// fnt takes the context because the title lettering is built on one of its own.
const FF = 'px system-ui,Segoe UI,sans-serif';
const fnt = (q, sz, w) => q.font = (w ? w + ' ' : '') + sz + FF;
// mw is fillText's own maxWidth: the canvas condenses the glyphs to fit instead
// of spilling. Only the shop passes it, where a column can be narrow.
const txt = (s, x, y, sz, col, al, w, mw) => {
  fnt(X, sz, w);
  X.fillStyle = col; X.textAlign = al || 'left'; X.textBaseline = 'middle';
  X.fillText(s, x, y, mw);
};
const grad = (x0, y0, x1, y1, a, b) => {
  const g = X.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, a); g.addColorStop(1, b); return g;
};
const hsl = (h, s, l, a = 1) => 'hsl(' + h + ' ' + s + '% ' + l + '%/' + a + ')';
</script>
<script>// Rainbow palette, one entry per ring colour, bottom of the horn first.
const HUE = [354, 24, 52, 128, 190, 248, 305];
const SAT = [88, 92, 95, 68, 85, 72, 80];
const LIT = [58, 48, 65, 46, 56, 55, 64];
const NR = HUE.length;
const RC = (i, d, a) => hsl(HUE[i], SAT[i], LIT[i] + (d || 0), a);

// Geometry, in unicorn-heights above the hooves.
const HORN = 1.69;   // horn tip, i.e. the catch line
const LNA = .17;     // radians of body tilt at full running speed

// Sale flyaway, as fractions of FLYT.
const FLYT = 1.05, FLY_UP = .62, FLY_IN = .44;

const PAY = 5;       // dollars per unicorn
const ASPD = .7;     // apprentice speed, relative to the player
const AGAP = 2.2;    // seconds between an apprentice's guaranteed rings
const BRG = 130;     // unicorns sold to finish the rainbow bridge
const MILE = [10, 30, 60, 100];   // sales that earn a banner
const RUSHT = 7;     // seconds a rainbow rush lasts

// Upgrades: name, description, and the cost of each level. The number of costs
// is the max level. '@' in a description is replaced by the matching UV entry
// for the next level. Prices are fitted to a measured income curve so the wait
// for the next upgrade is about half a minute and settles around twenty seconds.
// The aim glint and auto-sell used to be bought here; both are now always on.
// Read in reading order: row one is control, row two is help hitting the ring,
// row three is throughput - which is also roughly cheapest to dearest.
// The whole tree costs $1102 against the ~$1150 a 130-sale run pays out, so the
// last level lands around sale 120 whatever the player's skill. See the README:
// that budget is fixed by BRG, not by these prices - income per sale barely moves,
// so cheaper upgrades buy a shorter run, never a richer one.
const U_SPD = 0, U_SAW = 1, U_CAL = 2, U_MAG = 3, U_WRD = 4, U_STK = 5, U_OVR = 6, U_RATE = 7, U_APP = 8;
const UP = [
  ['Fleet Hooves', 'gallop @% faster across the factory floor', [7, 18, 40]],
  ['Horn Saw', 'cut off just the last ring', [9]],
  ['Calibration', 'the colour you need falls @% of the time', [6, 17, 44, 110]],
  ['Colour Magnet', 'the ring you need drifts to your horn', [10, 24, 52]],
  ['Colour Ward', 'wrong rings sidestep the horn @', [14, 30, 66]],
  ['Perfect Streak', 'clean sales pay up to +$@ extra', [9, 21, 47]],
  ['Overdrive', 'rings fall @% faster, so money lands sooner', [12, 26, 56]],
  ['Overtime', 'the whole factory drops @% more rings', [15, 35, 78]],
  ['Apprentice', 'one more helper unicorn behind you (@ total)', [11, 22, 38, 62, 95, 128]]
];
const UV = [[0, 50, 108, 183], 0, [42, 55, 65, 75, 88], 0, ['', 'at the last moment', 'well ahead', 'half a screen ahead'], [0, 3, 6, 9], [0, 25, 55, 90], [0, 30, 65, 110], [0, 1, 2, 3, 4, 5, 6]];

const MAGR = [0, 1, 1.7, 2.6], MAGP = [0, .3, .5, .75];   // magnet radius (unicorn-heights), pull (field-widths/s)
const WRDH = [0, .12, .28, .5];                           // ward trigger height, fraction of the field
const OVR = [1, 1.25, 1.55, 1.9];                         // fall speed multiplier
const RATE = [1, 1.3, 1.65, 2.1];                         // spawn rate multiplier, players and helpers alike
const SPD = [.6, .9, 1.25, 1.7];                        // player top speed, in field-widths per second
</script>
<script>// Game state, economy and simulation. Rendering lives in 5_scene / 6_ui.
// js13kgames.com serves every entry from one origin, so localStorage is shared
// between all of them. Namespace the key, touch only this key, and never call
// localStorage.clear() - that would wipe other people's games.
const KEY = 'unicornfactory13k';
const G = { m: 0, sold: 0, junk: 0, mu: 0, st: 0, bst: 0, tm: 0, h: 0, u: UP.map(() => 0) };

let stack = [], bad = -1, done = 0, drop = [], utx = .5;
let spawnT = 0, shake = 0, badF = 0, urun = 0, ulean = 0;
let runT = 0, scrapT = 0, cutT = 0, autoT = 0, aimOn = 0, shopOn = 0, ugait = 0;
let fly = 0, flyX = 0, flyDir = 1, flyStack = [];
// scr: 0 title, 1 playing, 2 ending. banT/banS drive the centred banner.
let scr = 0, endT = 0, rushT = 45, rush = 0, banT = 0, banS = '';
// The ending opens with every unicorn flying off, staggered, the player last, so
// the cascade gets a clear sky. bye runs that exodus; endT only starts after it.
let bye = 0;
const exo = () => FLYT + APP.length * .12;
const ban = s => { banS = s; banT = 2.6 };
const APP = [];

// Which way a unicorn leaves the screen: over whichever edge it is already nearest.
const away = x => x > FX + FW / 2 ? -1 : 1;
// Hand a stack to the flyaway. It rides the rainbow trail out while the body walks
// back on from the far side, so the tower is copied before the caller clears it.
// t is where the animation starts: a hair past zero to run it now, zero to arm it
// for the ending, which ramps everyone's clock by hand to stagger the exodus.
const launch = t => { flyStack = stack; flyX = HX; flyDir = away(HX); fly = t };
const aLaunch = (a, t) => { a.fs = a.st; a.fx = a.x; a.fd = away(a.x); a.fl = t };

const upCost = i => UP[i][2][G.u[i]];
const upMax = i => G.u[i] >= UP[i][2].length;
const uv = i => { const a = UV[i]; return a ? a[upMax(i) ? G.u[i] : G.u[i] + 1] : 0 };
const upDesc = i => UP[i][1].replace('@', uv(i));
// How built-up the factory is: drives the music layers and the end-screen tally.
const upTot = () => G.u.reduce((a, b) => a + b, 0);
const upBuy = i => {
  if (upMax(i) || G.m < upCost(i)) return 0;
  G.m -= upCost(i); G.u[i]++; syncApp(); layout(); save(); return 1;
};

// --- tuning curves -------------------------------------------------------
const speed = () => min(1 + G.sold * .035, 2.4);
const gap = () => max(.42, 1.05 / speed()) / RATE[G.u[U_RATE]] / (rush > 0 ? 2 : 1);
const fallV = () => FH / (2.9 / speed()) * OVR[G.u[U_OVR]];
const need = () => stack.length;
const tol = c => rsz(c) * .95 + RS * .22;
const busy = () => fly || scrapT || cutT;

// A falling ring. py is last frame's y, used for line-crossing catch tests;
// tk marks it as claimed by an apprentice for this frame.
const mkDrop = (x, c) => drop.push({
  x: clamp(x, FX + MG, FX + FW - MG), y: FY - RS * 2, py: FY - RS * 2,
  v: fallV() * rr(.9, 1.12), c: c, w: rr(0, TAU), tk: 0
});

const spawn = () => mkDrop(rr(FX + MG, FX + FW - MG),
  bad < 0 && need() < NR && rnd() * 100 < UV[U_CAL][G.u[U_CAL]] ? need() : flr(rnd() * NR));

const grab = r => {
  stack.push({ c: r.c, p: 0 });
  if (r.c == need() - 1) {
    sGood(stack.length);
    if (stack.length >= NR) { done = 1; sDone() }
  } else {
    bad = stack.length - 1; badF = 1; shake = 1; sBad();
    flt(HX, TY + RS * 2, 'WRONG!', '#ff5d7a');
  }
};

const fling = () => {
  stack.forEach((r, i) => ringPT(r.c, HX + rr(-6, 6), slotY(i), 1, 1));
  puff(HX, slotY(2), 12);
  stack = []; bad = -1; done = 0;
};

// The one place money and the sale counter move, so the rush bonus, the
// milestone banners and the bridge all see every sale, the helpers' included.
const gain = n => {
  const p = n * (rush > 0 ? 2 : 1);
  G.m += p; G.sold++;
  if (MILE.indexOf(G.sold) >= 0) ban(G.sold + ' UNICORNS SOLD');
  if (G.sold == BRG) {
    scr = 2; endT = 0; banT = 0; bye = 0; mI = 0; RID = 0;
    // Reuse the sale flyaway: give everyone a trail to ride out on.
    APP.forEach(a => aLaunch(a, 0)); launch(0);
  }
  return p;
};

const payout = () => {
  G.st++; if (G.st > G.bst) G.bst = G.st;
  const b = G.u[U_STK] ? min(flr(G.st / 3), UV[U_STK][G.u[U_STK]]) : 0;
  return gain(PAY + b);
};

const sell = () => {
  if (!done || busy()) return 0;
  const b = payout(); sSell();
  burst(HX, slotY(3), 26);
  flt(HX, slotY(6) - RS * 2, '+$' + b, '#7ce38b');
  launch(1e-4);
  stack = []; bad = -1; done = 0;
  save(); return 1;
};

const scrap = () => {
  if (!stack.length || busy()) return 0;
  G.junk++; G.st = 0; sScrap(); shake = .7; scrapT = .55; fling(); save(); return 1;
};

const cut = () => {
  if (!G.u[U_SAW] || !stack.length || busy()) return 0;
  const r = stack.pop();
  ringPT(r.c, HX, slotY(stack.length), 1, 1);
  puff(HX, slotY(stack.length), 4);
  if (bad >= stack.length) bad = -1;
  done = 0; cutT = .5; sCut(); return 1;
};

// --- apprentices ---------------------------------------------------------
// One helper: x/px this and last frame's position, st its stack, t the pause before
// it sells, ln/rn/g the lean, run amount and gait phase, sp the countdown to its
// next guaranteed ring, tr the ring it is currently chasing, fl/fx/fd/fs its flyaway.
const syncApp = () => {
  while (APP.length < G.u[U_APP]) APP.push({ x: FX + FW * rr(.2, .8), px: 0, st: [], t: 0, ln: 0, rn: 0, g: rr(0, 9), sp: rr(.3, AGAP), tr: 0, fl: 0, fx: 0, fd: 1, fs: [] });
  APP.length = G.u[U_APP];
};

const asell = (a, i) => {
  const p = gain(PAY);
  const uy = aUy(i), sc = aSc(i);
  burst(a.x, uy - SOFF[3] * sc, 14);
  flt(a.x, uy - SOFF[6] * sc - RS, '+$' + p, '#8fe0a8');
  aLaunch(a, 1e-4);
  a.st = []; sApp(7); save();
};

const shove = (x, c, w, lo, hi) => {
  if (abs(x - c) >= w) return x;
  const l = c - w, r = c + w;
  if (l >= lo && r <= hi) return x < c ? l : r;
  return l >= lo ? l : r <= hi ? r : x;
};

const apprentices = dt => {
  const lane = US * .45, sep = US * .4;
  const lo = FX + MG * .7, hi = FX + FW - MG * .7;
  drop.forEach(r => r.tk = 0);
  APP.forEach((a, i) => {
    const ty = aTy(i), sc = aSc(i);
    a.st.forEach(r => { if (r.p < 1) r.p = min(1, r.p + dt * 5) });
    a.g += dt * (3 + a.rn * 8);
    a.sp -= dt;
    if (a.sp <= 0) {
      a.sp = AGAP * rr(.8, 1.2) / RATE[G.u[U_RATE]];
      if (!a.fl && a.st.length < NR) mkDrop(a.x + rr(-FW * .18, FW * .18), a.st.length);
    }
    if (a.fl) { a.fl += dt; if (a.fl < FLYT) return; a.fl = 0; a.fs = [] }

    let an = a.st.length;
    for (let j = drop.length; j--;) {
      const r = drop[j];
      if (r.c == an && r.py < ty && r.y >= ty && abs(r.x - a.x) < tol(r.c) * sc) {
        a.st.push({ c: r.c, p: 0 }); drop.splice(j, 1); sApp(a.st.length); an++; a.tr = 0; break;
      }
    }
    const pax = a.x, mv = FW * 1.3 * ASPD * dt;
    let tg = a.x;
    if (an >= NR) {
      a.t += dt;
      if (a.t > .35) { a.t = 0; asell(a, i); return }
    } else {
      const ok = r => r && r.c == an && r.y < ty && abs(r.x - HX) > lane && drop.indexOf(r) >= 0;
      if (!ok(a.tr)) {
        a.tr = 0;
        let bd = 1e9;
        for (let j = 0; j < drop.length; j++) {
          const r = drop[j], d = ty - r.y;
          if (!r.tk && r.c == an && d > 0 && abs(r.x - HX) > lane && d < bd) { bd = d; a.tr = r }
        }
      }
      if (a.tr) { a.tr.tk = 1; tg = a.tr.x }
    }
    if (abs(tg - HX) < lane) tg = HX + (tg < HX ? -lane : lane);
    a.x = clamp(a.x + clamp(tg - a.x, -mv, mv), lo, hi);
    a.px = pax;
  });
  for (let k = 0; k < 4; k++)
    for (let i = 0; i < APP.length; i++) {
      const a = APP[i];
      if (a.fl) continue;
      for (let j = i + 1; j < APP.length; j++) {
        const b = APP[j], d = b.x - a.x;
        if (b.fl || abs(d) >= sep) continue;
        const p = (sep - abs(d)) / 2 * (d < 0 ? -1 : 1);
        a.x -= p; b.x += p;
      }
    }
  APP.forEach(a => {
    if (a.fl) return;
    a.x = clamp(shove(a.x, HX, lane, lo, hi), lo, hi);
    const avx = (a.x - a.px) / dt;
    a.ln = lerp(a.ln, clamp(avx / (FW * .6), -1, 1), .25);
    a.rn = lerp(a.rn, min(abs(avx) / (FW * .18), 1), .3);
  });
};

// --- per-frame simulation ------------------------------------------------
const upGame = dt => {
  G.tm += dt;
  if (!G.h && stack.length) { G.h = 1; save() }
  else if (G.h == 1 && G.sold) { G.h = 2; save() }
  if (banT > 0) banT = max(0, banT - dt);
  if (rush > 0) rush = max(0, rush - dt);
  else if ((rushT -= dt) <= 0) { rushT = rr(55, 90); rush = RUSHT; ban('RAINBOW RUSH  x2'); sDone() }
  const t = clamp((IN.x - FX) / FW, 0, 1);
  const k = (K.ArrowRight || K.d || K.D ? 1 : 0) - (K.ArrowLeft || K.a || K.A ? 1 : 0);
  if (k) utx = clamp(utx + k * dt * SPD[G.u[U_SPD]], 0, 1);
  else if (IN.x > FX && IN.x < FX + FW && IN.y > FY && IN.y < H - BOT) utx = t;
  const px = HX, tg = FX + MG + utx * (FW - MG * 2), mv = FW * SPD[G.u[U_SPD]] * dt;
  HX = clamp(HX + clamp(tg - HX, -mv, mv), FX + MG, FX + FW - MG);
  const vx = (HX - px) / dt;
  // A mouse flick lasts a handful of frames, and while it crosses the screen the
  // unicorn is a blur under the cursor, so the gallop is only readable once it has
  // stopped. Latch the run on for a moment after every move: the stride then plays
  // out with the unicorn standing still, which is the only time it can be seen.
  const rt = min(abs(vx) / (FW * .18), 1);
  if (rt > .3) runT = .15;
  runT = max(0, runT - dt);
  ulean = lerp(ulean, clamp(vx / (FW * .6), -1, 1), rt > .3 ? .25 : .09);
  urun = lerp(urun, runT > 0 ? 1 : 0, runT > 0 ? .35 : .16);
  ugait += dt * (3 + urun * 8);
  if (rt > .45 && rnd() < dt * 22) burst(HX + rr(-US * .3, US * .3), UY - US * .03, 1, hsl(280, 60, 88, .8));

  if (fly) {
    fly += dt;
    const u = min(fly / (FLYT * FLY_UP), 1);
    if (u < 1 && rnd() < dt * 34) { const q = flyPos(flyX, flyDir, UY, 1, u); burst(q[0] + rr(-US * .35, US * .35), q[1] + rr(-US * .3, US * .3), 1) }
    if (fly >= FLYT) { fly = 0; flyStack = [] }
  }
  if (scrapT > 0) scrapT = max(0, scrapT - dt);
  if (cutT > 0) cutT = max(0, cutT - dt);
  // A finished rainbow sells itself after a beat. This used to be an upgrade;
  // making the player press SPACE on a stack that is unambiguously done was
  // busywork, and charging for the fix was worse.
  if (done && !fly) { autoT += dt; if (autoT > .4) { autoT = 0; sell() } } else autoT = 0;

  spawnT -= dt;
  if (spawnT <= 0) { spawnT = gap() * rr(.85, 1.2); spawn() }

  // Re-checked per ring: a catch can complete or ruin the rainbow, and every
  // later ring in the same frame must see that.
  const live = () => bad < 0 && !done && !busy();
  const mr = US * MAGR[G.u[U_MAG]], mp = FW * MAGP[G.u[U_MAG]] * dt;
  const wh = FH * WRDH[G.u[U_WRD]];
  aimOn = 0;
  for (let i = drop.length; i--;) {
    const r = drop[i];
    r.py = r.y; r.y += r.v * dt; r.w += dt * 2;
    if (live() && r.y < TY) {
      const dx = r.x - HX;
      if (r.c == need()) {
        if (G.u[U_MAG] && abs(dx) < mr) r.x -= clamp(dx, -mp, mp);
        if (abs(dx) < tol(r.c)) aimOn = 1;
      } else if (wh && TY - r.y < wh) {
        const gtl = tol(r.c) * 1.3;
        if (abs(dx) < gtl) {
          const rem = max((TY - r.y) / r.v, .06);
          const sp = min((gtl - abs(dx)) / rem * 1.25, FW * 1.8);
          r.x = clamp(r.x + (dx < 0 ? -sp : sp) * dt, FX + RS, FX + FW - RS);
        }
      }
    }
    if (live() && r.py < TY && r.y >= TY && abs(r.x - HX) < tol(r.c)) { grab(r); drop.splice(i, 1); continue }
    if (r.y > FY + FH + RS * 2) drop.splice(i, 1);
  }
  stack.forEach(r => { if (r.p < 1) r.p = min(1, r.p + dt * 5) });
  if (APP.length != G.u[U_APP]) syncApp();
  if (G.u[U_APP]) apprentices(dt);

  if (shake > 0) shake = max(0, shake - dt * 2.6);
  if (badF > 0) badF = max(0, badF - dt * 1.6);
};

// --- persistence ---------------------------------------------------------
// Every scalar in G is saved by name from one list, so adding a counter means
// adding it here and nowhere else. Upgrade levels ride along as a second slot.
const SK = ['m', 'sold', 'junk', 'mu', 'st', 'bst', 'tm', 'h'];
const save = () => {
  try { localStorage[KEY] = JSON.stringify([SK.map(k => G[k] | 0), G.u]) } catch (e) { }
};
const load = () => {
  try {
    const d = JSON.parse(localStorage[KEY]);
    SK.forEach((k, i) => G[k] = d[0][i] | 0);
    for (let i = 0; i < UP.length; i++) G.u[i] = min(d[1][i] | 0, UP[i][2].length);
    syncApp();
  } catch (e) { }
};

</script>
<script>const star = (x, y, r, rot, col, n) => {
  X.save(); X.translate(x, y); X.rotate(rot); X.beginPath();
  const p = n || 4;
  for (let i = 0; i < p * 2; i++) {
    const a = i * PI / p, d = i & 1 ? r * .28 : r;
    i ? X.lineTo(cos(a) * d, sin(a) * d) : X.moveTo(cos(a) * d, sin(a) * d);
  }
  X.closePath(); X.fillStyle = col; X.fill(); X.restore();
};

const cloud = (x, y, r) => {
  X.beginPath();
  X.arc(x - r * 1.15, y + r * .12, r * .56, 0, TAU);
  X.arc(x - r * .46, y - r * .38, r * .82, 0, TAU);
  X.arc(x + r * .42, y - r * .18, r * .66, 0, TAU);
  X.arc(x + r * 1.12, y + r * .14, r * .48, 0, TAU);
  X.ellipse(x, y + r * .34, r * 1.55, r * .48, 0, 0, TAU);
  X.fill();
};

// The numeral is a colour-blind aid: four of the seven hues collapse together for
// a deuteranope, and the 7.5% size taper between neighbours is far too small to
// tell them apart on its own.
const ring = (x, y, rx, ci, ruin, tilt) => {
  const ry = rx * .4, t = rx * .33;
  const hu = HUE[ci], s = ruin ? 10 : SAT[ci], l = ruin ? 34 : LIT[ci];
  X.save(); X.translate(x, y); if (tilt) X.rotate(tilt);
  X.beginPath();
  X.ellipse(0, 0, rx, ry, 0, 0, TAU);
  X.ellipse(0, 0, rx - t, ry - t * .58, 0, 0, TAU);
  const g = X.createLinearGradient(-rx, -ry, rx, ry);
  g.addColorStop(0, hsl(hu, s, l + 16)); g.addColorStop(.45, hsl(hu, s, l));
  g.addColorStop(1, hsl(hu, s, l - 22));
  X.fillStyle = g; X.fill('evenodd');
  strk(ruin ? '#ff4d6d' : hsl(hu, 70, 20, .55), max(1, rx * .07));
  X.ellipse(0, 0, rx, ry, 0, 0, TAU); X.stroke();
  strk(hsl(hu, 100, ruin ? 60 : 86, .75), max(1, t * .3));
  X.ellipse(0, -ry * .3, rx - t * .5, ry * .5, 0, PI * 1.12, PI * 1.88); X.stroke();
  txt(ci + 1, 0, 0, rx * .62, hsl(hu, 94, 92, .82), 'center', 'bold');
  X.restore();
};

const leg = (x, w, sw, col, hoof) => {
  const lf = max(0, sw) * .5;
  X.fillStyle = col;
  X.beginPath();
  const tp = sw * .34;
  X.moveTo(x - w / 2 + tp, -.36); X.lineTo(x + w / 2 + tp, -.36);
  X.lineTo(x + w / 2 + sw, -.02 - lf); X.lineTo(x - w / 2 + sw, -.02 - lf);
  X.closePath(); X.fill();
  X.fillStyle = hoof;
  box(x - w / 2 + sw - .006, -.062 - lf, w + .012, .062, .02); X.fill();
};

const uni = (x, y, s, t, glow, run, ln, gt) => {
  const lean = ln || 0, r = run || 0, cd = gt || 0;
  X.save(); X.translate(x, y); X.rotate(lean * LNA);
  X.translate(0, sin(t * 3) * s * .012 - abs(sin(cd)) * s * .09 * r); X.scale(s, s);
  const W1 = '#fffaff', W2 = '#e3d2f7', SH = '#f0e4ff', HO = '#6d4ea3', DK = '#3b2a58';
  const sw = sin(cd) * .17 * r, sw2 = sin(cd + PI) * .17 * r;

  const tl = -lean * .2;
  X.fillStyle = W2;
  X.beginPath(); X.moveTo(-.21, -.62);
  X.bezierCurveTo(-.42 + tl, -.62, -.44 + tl, -.3, -.3 + tl, -.16);
  X.lineTo(-.17, -.34); X.closePath(); X.fill();
  X.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    strk(RC(i, 4), .046);
    X.moveTo(-.2, -.6 + i * .012);
    X.bezierCurveTo(-.37 - i * .012 + tl, -.6 + sin(t * 2) * .02, -.39 + tl, -.32, -.28 - i * .011 + tl, -.17 - i * .022);
    X.stroke();
  }

  leg(-.155, .09, sw2, W2, HO);
  leg(.155, .09, sw, W2, HO);

  X.fillStyle = W1;
  X.beginPath(); X.ellipse(0, -.48, .235, .175, 0, 0, TAU); X.fill();
  X.fillStyle = SH;
  X.beginPath(); X.ellipse(0, -.44, .15, .105, 0, 0, TAU); X.fill();

  leg(-.10, .095, sw, W1, HO);
  leg(.10, .095, sw2, W1, HO);

  X.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const f = (i / 6 - .5) * 2, wv = sin(t * 2.2 + i * .7) * .014 - lean * .11;
    strk(RC(i, 2), .055);
    X.moveTo(f * .085, -.9);
    X.quadraticCurveTo(f * .26 + wv, -.76, f * .225 + wv, -.55 + abs(f) * .07);
    X.stroke();
  }

  X.fillStyle = W1;
  X.beginPath(); X.moveTo(-.105, -.53); X.lineTo(.105, -.53);
  X.lineTo(.088, -.755); X.lineTo(-.088, -.755); X.closePath(); X.fill();

  X.fillStyle = W1;
  X.beginPath(); X.ellipse(0, -.83, .168, .152, 0, 0, TAU); X.fill();
  X.fillStyle = '#ffe6f6';
  X.beginPath(); X.ellipse(0, -.762, .098, .068, 0, 0, TAU); X.fill();
  X.fillStyle = '#e0a6cd'; dot(-.034, -.754, .014); dot(.034, -.754, .014);
  X.fillStyle = '#ffc7e4';
  X.beginPath(); X.ellipse(-.115, -.808, .034, .022, 0, 0, TAU); X.fill();
  X.beginPath(); X.ellipse(.115, -.808, .034, .022, 0, 0, TAU); X.fill();

  const bl = (t % 4.6) < .12;
  X.fillStyle = DK;
  if (bl) { X.fillRect(-.104, -.868, .055, .016); X.fillRect(.049, -.868, .055, .016) }
  else {
    X.beginPath(); X.ellipse(-.076, -.866, .029, .04, 0, 0, TAU); X.fill();
    X.beginPath(); X.ellipse(.076, -.866, .029, .04, 0, 0, TAU); X.fill();
    X.fillStyle = '#fff'; dot(-.066, -.881, .013); dot(.086, -.881, .013);
  }

  const et = sin(t * 1.7) * .022 - lean * .05;
  X.fillStyle = W1;
  tri(-.15, -.92, -.185 + et, -1.02, -.075, -.945);
  tri(.15, -.92, .185 - et, -1.02, .075, -.945);
  X.fillStyle = '#f9d9f0';
  tri(-.142, -.928, -.172 + et, -1.0, -.095, -.945);
  tri(.142, -.928, .172 - et, -1.0, .095, -.945);

  const hg = X.createLinearGradient(-.05, -.9, .05, -HORN);
  hg.addColorStop(0, '#f3b52c'); hg.addColorStop(.5, '#ffe08a'); hg.addColorStop(1, '#fffdf0');
  X.fillStyle = hg;
  X.beginPath(); X.moveTo(-.058, -.9); X.lineTo(.058, -.9); X.lineTo(0, -HORN); X.closePath(); X.fill();
  for (let i = 1; i < 11; i++) {
    const f = i / 11, w = .056 * (1 - f);
    strk('#d9992a', .011);
    X.moveTo(-w, -.9 - f * .79); X.lineTo(w, -.9 - f * .79 - .03); X.stroke();
  }
  if (glow) {
    X.fillStyle = hsl(48, 100, 70, .1 + .08 * sin(t * 7));
    X.beginPath(); X.arc(0, -.9, .9, 0, TAU); X.fill();
  }
  X.restore();
};
</script>
<script>// Responsive layout plus everything drawn inside the play field:
// sky, cloud bank, ring stacks, the sale flyaway and the aim glint.

// Field rect.
let FS = 14, RFW = 60, TOP = 40, BOT = 60;
let FX = 0, FY = 0, FW = 0, FH = 0;
// Player unicorn: x, hoof line, body height, ring radius, catch line, edge margin.
let HX = 0, UY = 0, US = 60, RS = 12, TY = 0, MG = 20;
// Bottom action bar and top-bar buttons.
let BBY = 0, BBW = 0, BBH = 0, SHX = 0, SHW = 0;
// Upgrade panel.
let SPX = 0, SPY = 0, SPW = 0, SPH = 0, SRH = 0, SHH = 0, SCOL = 1, SROW = 1, sscr = 0, smax = 0;
// SOFF[i] = height of stack slot i above the hooves, at scale 1.
const SOFF = [], BBX = [], PT = [], FLT = [];

// Rings shrink as the rainbow climbs, so colour and size both identify a ring.
// Rotate the canvas about a point rather than the origin. Callers must restore.
const rotAt = (x, y, a) => { X.save(); X.translate(x, y); X.rotate(a); X.translate(-x, -y) };

const taper = i => 1 - i * .075;
const rsz = i => RS * taper(i);
const slotY = i => UY - SOFF[i];
const tipY = (uy, sc) => uy - US * HORN * sc;
// Apprentice i, receding into the distance behind the player.
const aSc = i => .6 - i * .042;
const aUy = i => UY - US * (.34 + i * .075);
const aTy = i => tipY(aUy(i), aSc(i));

const layout = () => {
  FS = clamp(min(W, H) / 30, 11, 22);
  RFW = clamp(min(W, H) * .13, 42, 92);
  TOP = FS * 2.7; BOT = FS * 3.9;
  FX = RFW; FY = TOP; FW = W - RFW; FH = H - TOP - BOT;
  US = clamp(min(FH * .25, FW * .3), 38, 180);
  RS = US * .17;
  UY = FY + FH; TY = tipY(UY, 1);
  let o = US * 1.05 + RS * .3;
  SOFF[0] = o;
  for (let i = 1; i < NR; i++) { o += (rsz(i - 1) + rsz(i)) * .27; SOFF[i] = o }
  MG = min(max(RS * 1.3, US * .44), FW * .3);
  HX = clamp(HX || FX + FW / 2, FX + MG, FX + FW - MG);

  const p = FS * .5, nb = G.u[U_SAW] ? 3 : 2;
  BBW = (W - p * (nb + 1)) / nb; BBH = BOT - p * 1.3; BBY = H - BOT + p * .65;
  for (let i = 0; i < nb; i++) BBX[i] = p + i * (BBW + p);
  BBX.length = nb;
  // The shop tab sits at the right end of the bar. Its right edge stops where the
  // speaker's tap zone starts, so the two padded hit areas never overlap.
  SHW = FS * (W < FS * 34 ? 4.2 : 4.8);
  SHX = W - FS * 2.7 - SHW;

  // The shop sizes itself to the window rather than always scrolling: as many
  // columns as the width affords, then rows squeezed until every upgrade is on
  // screen at once. smax stays 0 - and the scrollbar hidden - unless the window
  // is too small even for the squeezed rows.
  SHH = FS * 3.1;
  SCOL = clamp(flr(W * .94 / (FS * 15)), 1, 3);
  SROW = M.ceil(UP.length / SCOL);
  SPW = min(W * .94, SCOL * FS * 22);
  SRH = max(min(FS * 3.9, (min(H * .94, 900) - SHH - FS * .9) / SROW), FS * 2.8);
  SPH = min(SHH + SROW * SRH + FS * .9, H * .94);
  SPX = (W - SPW) / 2; SPY = (H - SPH) / 2;
  smax = max(0, SROW * SRH - (SPH - SHH - FS * .9));
};

// Every particle is made here. hu >= 0 draws it as a ring of that colour,
// otherwise as a star of colour c; m is how long it lives.
const pt = (x, y, vx, vy, r, m, c, hu, rt) => PT.push({ x, y, vx, vy, r, m, c, hu, rt, l: 0 });

// Sparks thrown out of a sale or a catch.
const burst = (x, y, n, c) => {
  for (let i = 0; i < n; i++) {
    const a = rr(0, TAU), v = rr(40, 240);
    pt(x, y, cos(a) * v, sin(a) * v - 80, rr(2, 7) * (FS / 15), rr(.4, 1), c || RC(flr(rnd() * NR), 8), -1, rr(0, TAU));
  }
};

// Dust kicked up when a stack is dropped or cut.
const puff = (x, y, n) => {
  for (let i = 0; i < n; i++) {
    const a = rr(0, TAU);
    pt(x + rr(-RS, RS), y, cos(a) * rr(30, 130), sin(a) * rr(30, 130) - 60, rr(3, 9) * (FS / 15), rr(.4, .9), hsl(275, 20, rr(55, 80), .8), -1, rr(0, TAU));
  }
};

// A ring flung off the horn, still drawn as a ring.
const ringPT = (c, x, y, sc, up) => {
  const a = rr(-2.45, -.7);
  pt(x, y, cos(a) * rr(120, 330), sin(a) * rr(230, 520) * up, rsz(c) * sc, rr(.85, 1.5), 0, c, rr(-.4, .4));
};
const flt = (x, y, s, c) => FLT.push({ x: x, y: y, s: s, c: c, l: 0 });

const upView = dt => {
  for (let i = PT.length; i--;) {
    const p = PT[i]; p.l += dt;
    if (p.l > p.m) { PT.splice(i, 1); continue }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 620 * dt; p.vx *= .99; p.rt += dt * 6;
  }
  for (let i = FLT.length; i--;) {
    const f = FLT[i]; f.l += dt; f.y -= dt * FS * 2.4;
    if (f.l > 1.2) FLT.splice(i, 1);
  }
};

const CLL = [[.05, 4, .05], [.08, 9, .08], [.115, 15, .11]];
// Heights of the cloud terraces behind the player, in unicorn-heights above the
// hoof line. They match aUy(): .34 + i * .075 for apprentices 0, 2, 4 and 5.
const TER = [.34, .47, .6, .73];

// Scalloped cloud edge filling everything below it.
// sd seeds the bumps, so no two banks share a silhouette.
// The bump COUNT follows the radius: a distant bank has smaller puffs and needs
// more of them, or the arcs stop overlapping and the edge breaks open. Radii and
// positions are jittered, but bounded so the worst-case spacing still overlaps.
// dip is how far the valleys between bumps fall below the nominal line - keep it
// near zero on the terraces, or an apprentice standing in a valley has nothing
// under its hooves.
// fl flattens the bumps into ellipses. Width has to stay large so neighbours
// overlap, but on the terraces a circular bump would then be tall enough to swallow
// the 13px gap between layers and merge them into one mass, so those are flattened.
const bank = (r0, dy, col, sd, dip, fl) => {
  const y = UY + dy, n = max(6, flr(W / r0) + 2), sp = (W + r0 * 2) / n;
  X.beginPath(); X.moveTo(-4, H + 4); X.lineTo(-4, y);
  for (let i = 0; i <= n; i++) {
    const br = r0 * (.75 + hash(i * 9 + sd) * .8), ry = br * fl;
    X.ellipse(-r0 + i * sp + (hash(i * 5 + sd + 7) - .5) * r0 * .4, y + ry * dip, br, ry, 0, PI, 0);
  }
  X.lineTo(W + 4, H + 4); X.closePath();
  X.fillStyle = col; X.fill();
};

// The rainbow bridge is the run's goal: one arc per ring colour, sweeping out
// of the left horizon as unicorns are sold, closed on the right when it is done.
const brW = () => min(W, H) * .017;
// Radius is capped by the height above the top bar, so the apex of the arc
// stays on screen: the finale rides along it and has to be visible.
const brB = () => min(W * .48, (UY - TOP) * .8);
const brR = () => brB() + (NR - 1) * brW();
const brP = () => min(G.sold / BRG, 1);
const bridge = () => {
  const p = brP(), bw = brW(), b0 = brB();
  if (p <= 0) return;
  X.lineCap = 'butt';
  for (let i = 0; i < NR; i++) {
    strk(RC(i, 8, p < 1 ? .4 : .62), bw);
    X.arc(W / 2, UY, b0 + (NR - 1 - i) * bw, PI, PI + p * PI); X.stroke();
  }
};

// Ending backdrop, after the Solitaire win cascade: little rainbows are launched
// across the sky, fall under gravity and bounce off the cloud line. Every frame
// stamps them into a canvas that is never cleared, so they smear the whole screen
// with arcs instead of moving over it.
let TC = 0, TX = 0, BOU = [], RID = 0;
const bounce = dt => {
  if (!TC || TC.width != (W * DPR | 0)) {
    TC = document.createElement('canvas');
    TC.width = W * DPR | 0; TC.height = H * DPR | 0;
    TX = TC.getContext('2d'); TX.setTransform(DPR, 0, 0, DPR, 0, 0);
    BOU = [];
  }
  if (endT < dt * 3) { TX.clearRect(0, 0, W, H); BOU = [] }
  if (BOU.length < 4 && rnd() < dt * 3) {
    const d = rnd() < .5 ? 1 : -1;
    BOU.push({ x: d > 0 ? FX - FS : W + FS, y: FY + rr(0, FH * .35),
      vx: d * rr(FW * .13, FW * .3), vy: rr(0, 160), r: rr(FS * 1.8, FS * 4.4) });
  }
  TX.lineCap = 'butt';
  for (let i = BOU.length; i--;) {
    const b = BOU[i];
    b.vy += 1250 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > UY) { b.y = UY; b.vy *= -.74 }
    for (let k = 0; k < NR; k++) {
      TX.strokeStyle = RC(k, 6, .3); TX.lineWidth = b.r * .1;
      TX.beginPath(); TX.arc(b.x, b.y, b.r - k * b.r * .1, PI, TAU); TX.stroke();
    }
    if (b.x < FX - FS * 6 || b.x > W + FS * 6) BOU.splice(i, 1);
  }
};

const drawBg = () => {
  // The sky lifts from deep night to dawn as the bridge closes, so progress is
  // felt without reading a number.
  const sk = brP(), sky = X.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, hsl(262 - sk * 42, 63, 11 + sk * 25));
  sky.addColorStop(.45, hsl(266 - sk * 18, 55, 22 + sk * 26));
  sky.addColorStop(1, hsl(287 + sk * 36, 42 + sk * 14, 30 + sk * 30));
  X.fillStyle = sky; X.fillRect(0, 0, W, H);

  const mr = min(W, H) * .07, mx = W * .84, my = H * .15;
  const mg = X.createRadialGradient(mx, my, mr * .7, mx, my, mr * 3.4);
  mg.addColorStop(0, '#ffe9b830'); mg.addColorStop(1, '#ffe9b800');
  X.fillStyle = mg; dot(mx, my, mr * 3.4);
  X.fillStyle = '#fdf0c8'; dot(mx, my, mr);
  X.fillStyle = '#ebdcae';
  dot(mx - mr * .3, my - mr * .25, mr * .2); dot(mx + mr * .34, my + mr * .12, mr * .13);

  for (let i = 0; i < 40; i++) {
    X.globalAlpha = (.25 + .65 * abs(sin(TIME * (.5 + hash(i) * 1.5) + i))) * .75 * (1 - sk * .85);
    star(hash(i * 3 + 1) * W, hash(i * 5 + 2) * H * .6, (1 + hash(i * 7) * 2) * (FS / 14), TIME * .25 + i, '#fff8d8');
  }
  X.globalAlpha = 1;

  for (let L = 0; L < 3; L++) {
    const cf = CLL[L];
    X.fillStyle = hsl(282, 65, 84, cf[2]);
    for (let i = 0; i < 5; i++) {
      const r = min(W, H) * cf[0] * (.7 + hash(i * 7 + L * 3) * .6), pe = W + r * 4;
      cloud(((hash(i * 5 + L) * pe + TIME * cf[1]) % pe) - r * 2, H * (.06 + hash(i * 11 + L * 2) * .55), r);
    }
  }

  bridge();

  // Apprentices stand higher the further back they are, so without something
  // under them they hang in open sky. One terrace per apprentice hoof line,
  // drawn far to near: each unicorn ends up above its own terrace's edge and in
  // front of it, and never overlaps a nearer one, which sits lower down.
  const r0 = W / 11;
  for (let i = TER.length; i--;)
    bank(r0 * (.62 - i * .12), -US * TER[i], hsl(274 + i * 4, 50 - i * 5, 62 - i * 7), 17 + i * 53, .1, .5);
  bank(r0, 0, '#b291e6', 3, .7, 1);
  bank(r0 * .95, r0 * .1, grad(0, UY, 0, H, '#7a58b8', '#3a2568'), 61, .7, 1);
  X.fillStyle = hsl(280, 55, 92, .18);
  for (let i = 0; i < 7; i++) {
    cloud(((hash(i * 17 + 5) * (W + 200) + TIME * 6) % (W + 200)) - 100,
      UY - r0 * (.55 + hash(i * 9) * .5), r0 * (.16 + hash(i * 3) * .13));
  }
};

// Rings threaded on a horn. ty is the tip they slide down from, ln the lean:
// the whole tower rotates with the body and each ring lags a little more than the one below.
// gt/rn are the gait phase and run amount: the tower rides the same body bob as
// the unicorn, each ring lagging a little more than the one below it so the stack
// whips instead of moving as one rigid piece.
const drawStack = (st, x, by, sc, ru, ln, ty, gt, rn) => {
  const l = ln || 0, cd = gt || 0, rr0 = rn || 0;
  rotAt(x, by, l * LNA);
  for (let i = 0; i < st.length; i++) {
    const r = st[i], bo = abs(sin(cd - i * .22)) * US * .09 * sc * rr0;
    const y = lerp(ty, by - SOFF[i] * sc, r.p * r.p) - bo;
    ring(x - l * RS * .55 * sc * pow((i + 1) / NR, 1.8), y, rsz(r.c) * sc, r.c, ru == i ? 1 : 0, sin(TIME * 2 + i) * .02 - l * .1);
  }
  X.restore();
};

const flyPos = (fx, dir, by, sc, u) => {
  const e = u * u * .8 + u * .2;
  return [fx + dir * FW * .3 * u, by - (by - (FY - US * 2.4 * sc)) * e];
};

// Sale flyaway: a rainbow trail arcing off-screen with the sold unicorn riding it.
const drawFly = (fx, dir, by, sc, ft, st, al) => {
  const u = min(ft / (FLYT * FLY_UP), 1), bw = US * .085 * sc;
  X.globalAlpha = al * .82 * (1 - clamp((ft - FLYT * FLY_UP) / (FLYT * (1 - FLY_UP)), 0, 1));
  X.lineCap = 'round'; X.lineJoin = 'round';
  for (let k = 0; k < NR; k++) {
    strk(RC(k, 4), bw);
    for (let i = 0; i <= 16; i++) {
      const q = flyPos(fx, dir, by, sc, u * i / 16);
      i ? X.lineTo(q[0] + (k - 3) * bw, q[1]) : X.moveTo(q[0] + (k - 3) * bw, q[1]);
    }
    X.stroke();
  }
  X.globalAlpha = al;
  if (u < 1) {
    const q = flyPos(fx, dir, by, sc, u);
    rotAt(q[0], q[1], dir * .35 * u);
    uni(q[0], q[1], US * sc, TIME, 1, 1, dir * .5, ugait);
    drawStack(st, q[0], q[1], sc, -1, dir * .5, tipY(q[1], sc), ugait, 1);
    X.restore();
  }
};

// Where to draw a unicorn that is mid-sale: the replacement runs in from the
// far side once the seller is clear. Returns [x, leanWhileEntering, visible].
const pose = (ft, dir, bx, sc) => {
  if (!ft) return [bx, 0, 1];
  // In the ending nobody comes back: e stays 0, so the body is never drawn again.
  const e = scr == 2 ? 0 : clamp((ft - FLYT * FLY_IN) / (FLYT * (1 - FLY_IN)), 0, 1);
  return [lerp(dir > 0 ? FX - US * sc : FX + FW + US * sc, bx, ease(e)), (dir > 0 ? 1 : -1) * (1 - e), e > 0];
};

const drawGlint = () => {
  const p = .55 + .45 * sin(TIME * 14), gy = max(FY, TY - FH * .3);
  X.fillStyle = grad(0, TY, 0, gy, hsl(50, 100, 80, .22 * p), '#fff3b000');
  X.fillRect(HX - RS * .16, gy, RS * .32, TY - gy);
  star(HX, TY, RS * (.34 + .12 * p), TIME * 2, '#fffbe0');
  star(HX, TY, RS * (.72 + .22 * p), -TIME * 1.3, hsl(50, 100, 78, .4 * p));
};

// One unicorn and its tower of rings. The player and every apprentice go through
// here, so the flyaway, the run-in and the gait stay identical for all of them.
// Returns whether the body was actually drawn: mid-sale it is still off-screen.
//
// The argument list is long because that is what sharing this path costs: the
// player keeps its state in globals and an apprentice keeps the same state in an
// object, so the only thing both can hand over is loose values. Reading order is
// where (x, uy, sc), what (st, ty), how it is moving (ln0, gt, rn), how it looks
// (ru = ruined ring index, glow, al, t) and finally the flyaway, which is the
// four fields aLaunch writes: clock, launch x, direction, the stack that rides out.
const drawUnit = (x, uy, sc, st, ty, ln0, gt, rn, ru, glow, al, t, ft, fx, fd, fs) => {
  X.globalAlpha = al;
  if (ft && ft < FLYT) drawFly(fx, fd, uy, sc, ft, fs, al);
  const q = pose(ft, fd, x, sc);
  if (q[2]) {
    const ln = ft ? q[1] : ln0, r = ft ? 1 : rn;
    uni(q[0], uy, US * sc, t, glow, r, ln, gt);
    drawStack(st, q[0], uy, sc, ru, ln, ty, gt, r);
  }
  X.globalAlpha = 1;
  return q[2];
};

const drawWorld = () => {
  X.save();
  if (shake > 0) X.translate(rr(-1, 1) * shake * FS * .55, rr(-1, 1) * shake * FS * .35);
  drawBg();
  if (scr == 2 && TC) X.drawImage(TC, 0, 0, W, H);
  drop.forEach(r => ring(r.x, r.y, rsz(r.c), r.c, 0, sin(r.w) * .09));

  for (let i = APP.length; i--;) {
    const a = APP[i];
    drawUnit(a.x, aUy(i), aSc(i), a.st, aTy(i), a.ln + sin(a.g) * .3 * a.rn, a.g, a.rn,
      -1, 0, .88 - i * .07, TIME + 1.7 + i * .9, a.fl, a.fx, a.fd, a.fs);
  }

  const shk = scrapT > 0 ? sin(scrapT * 54) * (scrapT / .55) * 1.9 : 0;
  if (drawUnit(HX, UY, 1, stack, TY, ulean + sin(ugait) * .3 * urun + shk, ugait, urun,
    bad, done, 1, TIME, fly, flyX, flyDir, flyStack) && aimOn) drawGlint();

  // A procession of seven riders coasts down the finished bridge: [start, duration,
  // size] each, with a random gap after the one before, so no two are abreast for
  // long. endT only starts once the exodus is over, so the first sets off to an
  // empty sky. Each one fades out at the far foot - the old single rider clamped its
  // progress at 1 and so sat parked there for the rest of the ending.
  if (scr == 2 && bye >= exo()) {
    if (!RID) { RID = []; for (let i = 0, d = 0; i < 7; i++, d += rr(.25, .8)) RID.push([d, rr(2.2, 4.4), rr(.22, .55)]) }
    // Size the riders off the bridge, not off US: on a tall phone the arc is less
    // than half its desktop radius, and full-size riders piled up at the apex.
    const rb = brR(), rs = min(US, rb * .27);
    RID.forEach((r, i) => {
      const u = (endT - r[0]) / r[1];
      if (u <= 0 || u >= 1) return;
      const aa = PI + u * PI, ex = W / 2 + cos(aa) * rb, ey = UY + sin(aa) * rb;
      X.globalAlpha = min(u * 7, (1 - u) * 7, 1);
      rotAt(ex, ey, aa - PI * 1.5);
      uni(ex, ey, rs * r[2], TIME + i, 0, 1, 0, ugait + i);
      X.restore();
      X.globalAlpha = 1;
      if (rnd() < .35) burst(ex, ey, 1);
    });
  }

  PT.forEach(p => {
    const a = 1 - p.l / p.m; X.globalAlpha = a;
    if (p.hu >= 0) ring(p.x, p.y, p.r, p.hu, 0, p.rt); else star(p.x, p.y, p.r * a, p.rt, p.c);
  });
  X.globalAlpha = 1;
  X.restore();

  if (badF > 0) {
    const g = X.createRadialGradient(W / 2, H / 2, min(W, H) * .28, W / 2, H / 2, max(W, H) * .62);
    g.addColorStop(0, '#ff003c00'); g.addColorStop(1, hsl(345, 100, 48, badF * .42));
    X.fillStyle = g; X.fillRect(0, 0, W, H);
  }
};

<script>// Chrome drawn on top of the field: order sidebar, top bar, action buttons and
// upgrade panel, then the three full-screen overlays - hint, title and ending.

const drawRef = () => {
  X.fillStyle = '#1a1030'; X.fillRect(0, 0, RFW, H - BOT);
  X.fillStyle = '#33224f'; X.fillRect(RFW - 2, 0, 2, H - BOT);
  const ch = FH / NR, r0 = min(RFW * .33, ch * .38), cx = RFW / 2;
  for (let i = 0; i < NR; i++) {
    const y = FY + FH - (i + .5) * ch, has = i < stack.length, nx = i == stack.length && bad < 0;
    X.globalAlpha = has ? .32 : nx ? 1 : .5;
    ring(cx, y, r0 * taper(i), i, 0);
    X.globalAlpha = 1;
    if (nx) {
      // The same attract pulse as the on-screen hints: this halo is a 'do this next'.
      strk(blink(), max(1.5, r0 * .12));
      X.ellipse(cx, y, r0 * 1.34, r0 * .64, 0, 0, TAU); X.stroke();

    if (has) {

const spk = (x, y, r, on) => {

  X.beginPath();

  X.lineTo(x + r * .3, y + r); X.lineTo(x - r * .35, y + r * .4); X.lineTo(x - r, y + r * .4);
  X.closePath(); X.fill();
  strk(c, max(1, r * .2));
  if (on) X.arc(x + r * .45, y, r * .5, -.9, .9);

// Small pill in the top bar.
const tab = (x, w, lab, fs, fill, line, col) => {

const btn = (x, lab, sub, on, hot, c1, c2) => {
  plate(x, BBY, BBW, BBH, 9,
    on ? (hot ? hsl(348, 82, 52 + 9 * sin(TIME * 8)) : grad(x, BBY, x + BBW, BBY + BBH, c1, c2)) : '#241a3c',
    on && '#ffffff40');
  txt(lab, x + BBW / 2, BBY + BBH * .37, FS * (BBW < FS * 9 ? .9 : 1.05), on ? '#fff' : '#5c4a82', 'center', 'bold');
  txt(sub, x + BBW / 2, BBY + BBH * .73, FS * .62, on ? '#ffffffc4' : '#493a6b', 'center');
};

const canBuy = () => { for (let i = 0; i < UP.length; i++) if (!upMax(i) && G.m >= upCost(i)) return 1; return 0 };

const drawUI = () => {
  X.fillStyle = '#150d26';
  X.fillRect(FX, 0, W - FX, TOP); X.fillRect(0, H - BOT, W, BOT);

  txt('$' + G.m, FX + FS * .8, TOP / 2, FS * (W < FS * 32 ? 1.25 : 1.5), '#7ce38b', 'left', 'bold');
  let hx = FX + FS * 1.5 + X.measureText('$' + G.m).width;
  if (G.u[U_STK] && G.st > 0) {
    txt('x' + G.st, hx, TOP / 2 + FS * .1, FS * .86, '#ffcf5c', 'left', 'bold');
    hx += X.measureText('x' + G.st).width + FS * .8;
  }
  // The target disappears once it is met, so it never reads "145 / 130".
  if (W > FS * 32) txt('SOLD ' + G.sold + (G.sold < BRG ? ' / ' + BRG : ''),
    hx, TOP / 2 + FS * .12, FS * .76, '#9b86c9', 'left');

  const cb = canBuy();
  tab(SHX, SHW, 'SHOP', .82, cb ? hsl(268, 62, 52 + 7 * sin(TIME * 5)) : '#2b1c48', cb ? '#d8bcff' : '#5a4488', cb ? '#fff' : '#a08ecb');
  spk(W - FS * 1.4, TOP / 2, FS * .5, !G.mu);

  const n = BBX.length;
  if (n > 2) btn(BBX[0], 'CUT', 'drop last ring', stack.length > 0, bad >= 0, '#e0913a', '#b0621f');
  btn(BBX[n - 2], 'SCRAP', stack.length ? 'start over' : 'nothing to scrap', stack.length > 0, bad >= 0 && n < 3, '#8a5fd6', '#5b3fa8');
  btn(BBX[n - 1], 'SELL  $' + PAY, done ? 'rainbow complete!' : 'finish the rainbow', done, 0, '#39c47c', '#1f9e8e');

  if (rush > 0) { X.fillStyle = hsl(TIME * 260 % 360, 100, 62, .06); X.fillRect(FX, TOP, W - FX, FH) }
  if (banT > 0) txt(banS, FX + (W - FX) / 2, TOP + FH * .2, FS * 1.6,
    hsl(TIME * 220 % 360, 92, 74, min(banT / .45, 1)), 'center', 'bold');
  hint();

  FLT.forEach(f => { X.globalAlpha = 1 - f.l / 1.2; txt(f.s, f.x, f.y, FS * 1.3, f.c, 'center', 'bold') });
  X.globalAlpha = 1;
};

const drawShop = () => {
  X.fillStyle = '#0b0618cc'; X.fillRect(0, 0, W, H);
  plate(SPX, SPY, SPW, SPH, 14, '#1d1234', '#4b3577', 2);

  const top = SPY + SHH, vh = SPH - SHH - FS * .9, pad = FS * .5, cw = SPW / SCOL;
  sscr = clamp(sscr, 0, smax);
  X.save(); X.beginPath(); X.rect(SPX, top, SPW, vh); X.clip();
  for (let i = 0; i < UP.length; i++) {
    const y = top + flr(i / SCOL) * SRH - sscr, x = SPX + (i % SCOL) * cw;
    if (y > top + vh || y + SRH < top) continue;

      mx ? '#231a3a' : ok ? '#2c1c4e' : '#1e1533', ok && '#7ce38b88');
    const tx = x + pad * 1.6, cy = y + SRH / 2, rx = x + cw - pad * 1.6;
    // Levels are pips on the second line, hard right; the name and the
    // description are handed whatever width is left over as fillText's maxWidth,
    // so a narrow column condenses its text instead of spilling into the
    // neighbouring card.
    const n = UP[i][2].length, pw = FS * .62;
    txt(UP[i][0], tx, cy - FS * .68, FS * .94, mx ? '#9d8bc6' : '#fff', 'left', 'bold', rx - tx - FS * 3.4);
    txt(mx ? 'MAX' : '$' + c, rx, cy - FS * .68, FS * 1, mx || ok ? '#7ce38b' : '#6d5c93', 'right', 'bold');
    txt(upDesc(i), tx, cy + FS * .62, FS * .66, '#a794cf', 'left', 0, max(FS, rx - tx - n * pw));
    for (let k = 0; k < n; k++) {
      X.fillStyle = k < G.u[i] ? '#ffcf5c' : '#4a3a70';
      dot(rx - (n - 1 - k) * pw, cy + FS * .62, pw * .3);
    }
  }
  X.restore();

  plate(SPX, SPY, SPW, SHH, 14, '#1d1234');
  txt('UPGRADES', SPX + FS, SPY + SHH / 2, FS * 1.12, '#ff9fd6', 'left', 'bold');
  txt('$' + G.m, SPX + SPW - FS * 3, SPY + SHH / 2, FS * 1.12, '#7ce38b', 'right', 'bold');
  X.lineCap = 'round';
  strk('#b79ee0', max(2, FS * .16));
  const q = FS * .42;
  cross(SPX + SPW - FS * 1.4, SPY + SHH / 2, q, q); X.stroke();
  if (smax > 0) {
    X.fillStyle = '#5a4488';
    const bh = vh * vh / (SROW * SRH);
    X.fillRect(SPX + SPW - 5, top + (sscr / smax) * (vh - bh), 3, bh);
  }
};

// --- overlays: hints, title, ending ---------------------------------------
// Shared attract pulse for every 'do this next' line on screen.
const pul = () => abs(sin(TIME * 3));
const blink = () => hsl(50, 100, 76, .45 + .55 * pul());
// Each hint waits for the action it teaches and never comes back: G.h is saved.
// Two of the three name a control, which is a key on a desktop and a button on a
// phone, so they are built from TCH rather than stored.
const hint = () => {
  if (G.h > 2 || shopOn) return;
  const s = G.h
    ? G.h > 1
      ? canBuy() && (TCH ? 'tap SHOP' : 'press B') + ' to spend your money'
      : bad >= 0 && (TCH ? 'tap SCRAP' : 'press X') + ' to start over'
    : 'catch the RED ring on your horn';
  if (!s) return;
  // The line sits just above the button bar, which is exactly where the pale cloud
  // bank and the unicorn are, and pale yellow on pale lilac was unreadable. Set the
  // font first so measureText matches what txt is about to draw, then lay a dark
  // pill under it - guessing a width from the character count would not survive
  // switching between the key and the button wording.
  const sz = FS * .88, hx = FX + (W - FX) / 2, hy = BBY - FS * 1.45;
  fnt(X, sz, 'bold');
  const hw = X.measureText(s).width + sz * 1.5, hh = sz * 1.9;
  plate(hx - hw / 2, hy - hh / 2, hw, hh, hh / 2, '#0b0618d4', '#ffffff20');
  txt(s, hx, hy, sz, blink(), 'center', 'bold');
};

// Full-screen title: name up top, unicorn in the middle, PLAY at the bottom and
// the credits in the corners. The unicorn is sized so its horn clears the tagline.
// Clicking anywhere starts, so the button is an affordance rather than a gate.
// PLAY button rect, shared by the title drawing and the click test so the two can
// never drift apart. Height is generous enough to be a comfortable touch target.
const playBtn = () => {
  const bw = min(W * .52, 230);
  return [(W - bw) / 2, H * .79, bw, FS * 3.4];
};

// Both title words are drawn, not stored: seven letters each, so each word runs
// straight through the seven rainbow hues, one per letter. Every letter is four
// nested outlines with a bloom behind it - neon tubing, which is the look of the
// artwork the title was designed from.
//
// The nesting comes from stroking the glyph at shrinking widths and punching every
// other pass straight back out. That needs a canvas of its own: 'destination-out' on
// the real one would take the sky with it. The glows go on last with
// 'destination-over' so they slide underneath instead of being punched too.
// rev runs the rainbow the other way, so the two words mirror each other instead of
// repeating the same left-to-right ramp twice.
const neon = (q, s, cx, cy, sz, rev) => {
  const hu = i => rev ? NR - 1 - i : i;
  fnt(q, sz, 'bold');
  q.textAlign = 'center'; q.textBaseline = 'middle'; q.lineJoin = 'round';
  // Letters are placed one at a time, so the word has to be measured by hand:
  // each glyph's own width plus a fixed gap, centred on the whole run.
  const L = [...s], gp = sz * .07, ws = L.map(c => q.measureText(c).width);
  const tw = ws.reduce((a, w) => a + w + gp, -gp);
  const px = i => { let x = cx - tw / 2; for (let k = 0; k < i; k++) x += ws[k] + gp; return x + ws[i] / 2 };
  L.forEach((c, i) => {
    q.strokeStyle = RC(hu(i), 24);
    for (let k = 4; k--;) {
      const lw = sz * (.028 + k * .05);
      q.globalCompositeOperation = 'source-over'; q.lineWidth = lw; q.strokeText(c, px(i), cy);
      q.globalCompositeOperation = 'destination-out'; q.lineWidth = lw - sz * .015; q.strokeText(c, px(i), cy);
    }
  });
  q.globalCompositeOperation = 'destination-over';
  q.shadowBlur = sz * .5;
  L.forEach((c, i) => { q.shadowColor = RC(hu(i), 14); q.fillStyle = RC(hu(i), 4, .3); q.fillText(c, px(i), cy) });
  q.shadowBlur = 0; q.globalCompositeOperation = 'source-over';
};
// Rebuilt only when the size changes; the title screen redraws every frame for the
// pulsing PLAY button and the walking unicorn.
let TT = 0, TTS = 0, TTW = 0;

const drawTitle = () => {
  X.fillStyle = '#0b0618c8'; X.fillRect(0, 0, W, H);
  const ts = min(W * .143, H * .108);
  if (TTS != ts || TTW != W) {
    TTS = ts; TTW = W;
    TT = document.createElement('canvas');
    TT.width = W; TT.height = ts * 3.1;
    const q = TT.getContext('2d');
    neon(q, 'UNICORN', W / 2, ts * .9, ts);
    neon(q, 'FACTORY', W / 2, ts * 2.15, ts, 1);
  }
  // Blurred additive pass first, crisp tubing on top: that is what makes it read as
  // lit rather than merely outlined.
  const y0 = H * .13 - ts * .9;
  X.save();
  X.globalCompositeOperation = 'lighter'; X.filter = 'blur(' + ts * .1 + 'px)';
  X.drawImage(TT, 0, y0);
  X.restore();
  X.drawImage(TT, 0, y0);

  txt('stack the rings, build the rainbow', W / 2, y0 + ts * 2.85, FS * .9, '#a794cf', 'center');

  uni(W / 2, H * .73, min(W * .3, H * .195), TIME, 0, 1, sin(TIME * 2.2) * .6, TIME * 9);

  const [bx, by, bw, bh] = playBtn();
  const hot = IN.x > bx && IN.x < bx + bw && IN.y > by && IN.y < by + bh;
  plate(bx, by, bw, bh, 10, hot ? '#4bd68f' : grad(bx, by, bx + bw, by + bh, '#39c47c', '#1f9e8e'),
    hsl(0, 0, 100, .25 + .3 * pul()), 2);
  txt('PLAY', W / 2, by + bh / 2, FS * 1.5, '#fff', 'center', 'bold');

  txt('Made for JS13KGames', FS, H - FS * 1.1, FS * .78, '#7c6aa8', 'left');
  txt('By Infernet89', W - FS, H - FS * 1.1, FS * .78, '#7c6aa8', 'right');
};

const drawEnd = () => {
  const a = clamp((endT - 3.4) / .8, 0, 1);
  if (a <= 0) return;
  X.globalAlpha = a;
  const w = min(W * .88, 410), h = min(H * .82, 350), x = (W - w) / 2, y = (H - h) / 2, p = FS * 1.5;
  X.fillStyle = '#0b0618d8'; X.fillRect(0, 0, W, H);
  plate(x, y, w, h, 16, '#1d1234', '#7a58b8', 2);
  txt('THE BRIDGE IS DONE', W / 2, y + h * .13, FS * 1.2, '#ff9fd6', 'center', 'bold');
  [['unicorns sold', G.sold], ['scrapped', G.junk], ['best streak', G.bst],
   ['upgrades', upTot()],
   ['time', flr(G.tm / 60) + 'm ' + (flr(G.tm) % 60) + 's']].forEach((r, i) => {
    const ry = y + h * (.32 + i * .115);
    txt(r[0], x + p, ry, FS * .84, '#a794cf', 'left');
    txt('' + r[1], x + w - p, ry, FS * .96, '#fff', 'right', 'bold');
  });
  txt((TCH ? 'tap' : 'click') + ' to keep playing', W / 2, y + h * .93, FS * .88, blink(), 'center', 'bold');
  X.globalAlpha = 1;
};

<script>let AC = 0;
const au = () => {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)() } catch (e) { AC = 0 } }
  if (AC && AC.state == 'suspended') AC.resume();
};
const tone = (f, d, ty, v, f2, dl) => {
  if (!AC || G.mu) return;
  const t = AC.currentTime + (dl || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = ty; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(v, t + .012);
  g.gain.exponentialRampToValueAtTime(1e-4, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .03);
};
const arp = (ns, sp, ty, v, d) => ns.forEach((f, i) => tone(f, d, ty, v, 0, i * sp));
const SC = [523, 587, 659, 784, 880, 988, 1175];
const sGood = n => { tone(SC[n - 1], .17, 'triangle', .09); tone(SC[n - 1] * 2, .1, 'sine', .04, 0, .01) };
const sBad = () => { tone(180, .3, 'sawtooth', .07, 70); tone(92, .34, 'square', .05, 45) };
const sDone = () => arp([784, 988, 1175, 1568], .07, 'triangle', .08, .5);
const sSell = () => { arp([1047, 1319, 1568, 2093], .055, 'sine', .09, .35); tone(660, .12, 'square', .04, 1320) };
const sScrap = () => { tone(420, .28, 'sawtooth', .06, 90); tone(210, .3, 'triangle', .045, 60, .04) };
const sCut = () => { tone(880, .07, 'square', .035, 520); tone(300, .12, 'triangle', .035, 180, .05) };
const sApp = n => tone(SC[n - 1] * 1.5, .07, 'sine', .028);
const sBuy = () => arp([659, 880, 1319], .05, 'triangle', .07, .3);

// One slow arpeggio, with layers that switch on as the factory grows: the
// place literally sounds richer the more you have built.
let mT = 0, mI = 0;
const MEL = [0, 2, 4, 2, 5, 4, 2, 1];
// The ending gets its own line: a descending cascade with two echoes trailing each
// note, falling in step with the rainbows bouncing down the screen behind it. It
// also drops the layer gates - the finale sounds full however little was built.
const MEG = [6, 5, 4, 3, 2, 1, 0, 3];
const music = dt => {
  if (!AC || G.mu || (mT -= dt) > 0) return;
  const w = scr > 1;
  mT = w ? .26 : .36;
  const n = (w ? MEG : MEL)[mI++ & 7];
  if (w) {
    tone(SC[n] / 4, .3, 'sine', .05);
    tone(SC[n] * 2, .22, 'sine', .03);
    tone(SC[n] * 2, .2, 'triangle', .014, 0, .09);
    tone(SC[n], .16, 'triangle', .01, 0, .18);
    return;
  }
  const ly = upTot();
  tone(SC[n] / 4, .34, 'sine', .05);
  if (ly > 3) tone(SC[n] / 2, .3, 'triangle', .02, 0, .18);
  if (ly > 9) tone(SC[(n + 2) % 7], .16, 'sine', .015, 0, .09);
  if (ly > 16) tone(SC[(n + 4) % 7] * 2, .1, 'triangle', .009, 0, .27);
};
</script>
<script>const resize = () => {
  DPR = min(devicePixelRatio || 1, 2);
  // An iframe can report 0 before it has been laid out, and a zero-size field
  // makes layout() produce negative radii, which throws. Never go below this.
  W = max(innerWidth, 240); H = max(innerHeight, 180);
  C.width = W * DPR | 0; C.height = H * DPR | 0;
  X.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
};

const click = (x, y) => {
  if (shopOn) {
    if (x < SPX || x > SPX + SPW || y < SPY || y > SPY + SPH) { shopOn = 0; return }
    if (y < SPY + SHH) { if (x > SPX + SPW - FS * 2.4) shopOn = 0; return }
    const r = flr((y - SPY - SHH + sscr) / SRH);
    const i = r * SCOL + clamp(flr((x - SPX) / (SPW / SCOL)), 0, SCOL - 1);
    if (r >= 0 && i < UP.length) { if (upBuy(i)) sBuy(); else sBad() }
    return;
  }
  if (y < TOP) {
    if (x > W - FS * 2.3) { G.mu = G.mu ? 0 : 1; save(); if (!G.mu) sGood(4) }
    else if (x > SHX - FS * .4 && x < SHX + SHW + FS * .4) { shopOn = 1; sscr = 0; sCut() }
    return;
  }
  if (y > BBY - FS * .5) {
    const n = BBX.length;
    let i = n - 1;
    while (i > 0 && x < BBX[i] - FS * .25) i--;
    if (n > 2 && i == 0) { if (!cut()) sBad() }
    else if (i == n - 2) { if (!scrap()) sBad() }
    else if (!sell()) sBad();
  }
};

// Edge-triggered keys: [aliases, action, worksWhileShopOpen]. Adding a shortcut
// is one row. kPre holds last frame's state per row.
const KB = [
  [[' '], sell],
  [['x', 'X', 'Backspace'], scrap],
  [['c', 'C'], cut],
  [['b', 'B', 'Escape'], () => { shopOn = shopOn ? 0 : 1; sscr = 0 }, 1]
];
const kPre = [];
let last = 0;
// Update then draw, once each. The three screens differ only in what they step
// and what goes on top: the world, the sidebar and the top bar are common to two
// of them, so they are written once at the bottom rather than per branch.
const frame = t => {
  requestAnimationFrame(frame);
  const dt = min((t - last) / 1e3, .1); last = t;
  TIME += dt;
  X.clearRect(0, 0, W, H);

  if (!scr) {
    // Only the PLAY button starts the run; a tap anywhere else is ignored.
    const [bx, by, bw, bh] = playBtn();
    if (tapped() && IN.tx > bx && IN.tx < bx + bw && IN.ty > by && IN.ty < by + bh) { scr = 1; au(); sBuy() }
    drawBg(); drawTitle(); return;
  }

  music(dt);
  if (scr > 1) {
    ugait += dt * 11; upView(dt);
    if (bye < exo()) {
      bye += dt;
      APP.forEach((a, i) => a.fl = max(0, bye - i * .12));
      fly = max(0, bye - APP.length * .12);
    } else { endT += dt; bounce(dt) }
    if (endT > 4.2 && tapped()) { scr = 1; TC = 0; save() }
  } else {
    KB.forEach((e, i) => {
      const on = e[0].some(k => K[k]) ? 1 : 0;
      if (on && !kPre[i] && (e[2] || !shopOn)) e[1]();
      kPre[i] = on;
    });
    if (tapped()) click(IN.tx, IN.ty);
    if (G.h == 2 && shopOn) { G.h = 3; save() }
    if (shopOn) {
      if (IN.dn && IN.drag) sscr -= IN.dy;
      if (IN.w) sscr += IN.w * .5;
    } else { upGame(dt); upView(dt) }
    IN.dy = 0; IN.w = 0;
  }

  drawWorld(); drawRef(); drawUI();
  if (scr > 1) drawEnd(); else if (shopOn) drawShop();
};

addEventListener('resize', resize);
// layout() runs twice on purpose. resize() needs a field before load() can place
// the saved apprentices in it, and load() can restore the horn saw, which adds a
// third button to the bar - so the bar has to be measured again afterwards.
resize();
load();
layout();
requestAnimationFrame(t => { last = t; frame(t) });

// Konami code: up up down down left right left right B A pays $99999.
// Deliberately shipped - the user asked for it to stay in the released build.
const KON = 'arrowup,arrowup,arrowdown,arrowdown,arrowleft,arrowright,arrowleft,arrowright,b,a,';
let kseq = '';
addEventListener('keydown', e => {
  kseq = (kseq + e.key.toLowerCase() + ',').slice(-KON.length);
  if (kseq == KON) { kseq = ''; G.m += 99999; save(); sBuy(); ban('KONAMI  +$99999') }
});
</script>
