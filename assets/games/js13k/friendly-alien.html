    <script>function collision() {
  let collision_pair = active_collision();
  let direction;
  for (let i = 0; i < collision_pair.length; i++) {
    let f1 = G.asteroids[collision_pair[i][0]];
    let f2 = G.asteroids[collision_pair[i][1]];

    if (f1.type == 'player' || f2.type == 'player') {
      if (resolveCollision(f1,f2) != undefined) {
        S.playing.resetLevel = true;
        return;
      }
    }
      resolveCollision(f1, f2);
  }
}



function resolveCollision(f1, f2) {

  let rV = kontra.vector(f2.dx - f1.dx, f2.dy - f1.dy);
  let impulse = getNormalVector(f1, f2);
  if (impulse.x == 0 && impulse.y == 0) return;

  // resolve intersecting/jittering objects
  // when 2 objs overlap, only resolve if direction is correct
  if (f1.dx > 0 && !(f2.dx > 0) && impulse.x == -1) {
    return;
  }
  if (f1.dy > 0 && !(f2.dy > 0) && impulse.y == -1) {
    return;
  }

  let j = -1.98 * (rV.x * impulse.x + rV.y * impulse.y) * 5; //mass 10 for each

  f1.dx -= (1 / 10) * impulse.x * j;
  f1.dy -= (1 / 10) * impulse.y * j;
  f2.dx += (1 / 10) * impulse.x * j;
  f2.dy += (1 / 10) * impulse.y * j;

  return impulse;

}

function active_collision() {
  let frags = [];
  let active = [];
  let collision_check = [];

  for (let i = 0; i < G.asteroids.length; i++) {
    let b = G.asteroids[i].x;
    let e = b + OBJ_SIZE;
    frags.push({ item: i, b: b, e: e })
  }
  frags.sort(function (f1, f2) {
    return f1.b - f2.b;
  })

  for (let i = 0; i < frags.length; i++) {
    for (let j = 0; j < active.length; j++) {
      if (active[j].e + 3 < frags[i].b) {
        // remove item
        for (let k = j; k < active.length - 1; k++) {
          active[k] = active[k + 1];
        }
        j--;
        active.pop();
      } else {
        collision_check.push([frags[i].item, active[j].item]);
      }
    }
    active.push(frags[i]);
  }
  return collision_check;
}

function getNormalVector(f1, f2) {
  let n = kontra.vector(f1.x + f1.width / 2 - f2.x - f2.width / 2, f1.y + f1.height / 2 - f2.y - f2.height / 2);
  let v = kontra.vector(f2.x - f1.x, f2.y - f1.y);
  let normalVector = kontra.vector(0, 0);

  let overlapX = f1.width / 2 + f2.width / 2 - Math.abs(n.x);
  let overlapY = f1.height / 2 + f2.height / 2 - Math.abs(n.y);

  if (overlapX >= 0 && overlapY >= 0) { // add 5px to overlap check
    if (overlapX > overlapY) {
      if (v.y < 0) {
        normalVector.x = 0;
        normalVector.y = -1;
      } else {
        normalVector.x = 0;
        normalVector.y = 1;
      }
    } else {
      if (v.x < 0) {
        normalVector.x = -1;
        normalVector.y = 0;
      } else {
        normalVector.x = 1;
        normalVector.y = 0;
      }
    }
  }
  return normalVector;
}</script>

function spawnAsteroid(values) {
  let fragment = kontra.sprite({
    type: 'asteroid',
    x: GAME_X + values[0],
    y: GAME_Y + values[1],
    color: '#808000',
    height: OBJ_SIZE,
    width: OBJ_SIZE,
    image: asteroid,
    dx: values[2],
    dy: values[3],
    maxSpeed: 10,

    update: function () {
      if (this.x < GAME_X) this.dx = Math.abs(this.dx);
      if (this.x > BOUND_X) this.dx = -Math.abs(this.dx);
      if (this.y > BOUND_Y) this.dy = -Math.abs(this.dy);
      if (this.y < GAME_Y) this.dy = Math.abs(this.dy);

      // limit speed
      if (this.dx > this.maxSpeed) this.dx = this.maxSpeed;
      else if (this.dx < -this.maxSpeed) this.dx = -this.maxSpeed;
      if (this.dy > this.maxSpeed) this.dy = this.maxSpeed;
      else if (this.dy < -this.maxSpeed) this.dy = -this.maxSpeed;

      this.advance();

      if (this.grabbed) {
        player.x = this.x;
        player.y = this.y;
      }
    },
  })
  return fragment;
}

function spawnRandomAsteroids(n) {
  for (let i = 0; i < n; i++) {
    G.asteroids.push(spawnAsteroid(
                            [Math.floor(Math.random() * BOUND_X + 1),
                            Math.floor(Math.random() * BOUND_Y + 1),
                            Math.random() * 3 - 1.5,
                            Math.random() * 3 - 1.5
      ]));
  }
}

alien.onload = function() {
  player = kontra.sprite({
    type: 'player',
    x: 100,
    y: 0,
    width: 40,
    height: 40,
    dx: 0,
    dy: 0,
    image: alien,
    color: 'red',
    maxSpeed: 5,
    colliding: [0, 0, 0, 0],
    barrier: [1, 0, 0, 0],
    // animations: playerSprite.animations,
  
    handleInput: function () {
      // movement
      this.barrier = [0,0,0,0];
      if (Key.isDown(Key.UP)) {
        this.ddy = -0.1;
        if (this.dy > 0) this.ddy = -0.15;
      }
      else if (Key.isDown(Key.DOWN)) {
        this.ddy = 0.1;
        if (this.dy < 0) this.ddy = 0.15;
      }
      else this.ddy = 0;
  
      if (Key.isDown(Key.LEFT)) {
        this.ddx = -0.1;
        if (this.dx > 0) this.ddx = -0.15;
      } 
      else if (Key.isDown(Key.RIGHT)) {
        this.ddx = 0.1;
        if (this.dx < 0) this.ddx = 0.15;
      } else this.ddx = 0;
  
    },
  
    update: function () {
      // handle bound
      if (this.x < GAME_X) this.dx = Math.abs(this.dx) * 0.95;
      if (this.x > BOUND_X) this.dx = -Math.abs(this.dx) * 0.95;
      if (this.y > BOUND_Y) this.dy = -Math.abs(this.dy) * 0.95;
      if (this.y < GAME_Y) this.dy = Math.abs(this.dy) * 0.95;
  
      // limit ship's speed
      if (this.dx > this.maxSpeed) this.dx = this.maxSpeed;
      if (this.dx < -this.maxSpeed) this.dx = -this.maxSpeed;
      if (this.dy > this.maxSpeed) this.dy = this.maxSpeed;
      if (this.dy < -this.maxSpeed) this.dy = -this.maxSpeed;

      this.advance();
    },
  
  });
}</script>
    <script>S.menu = {
  update: function () {

    // initialize G.asteroids + player
    if (G.asteroids.length == 0) {
      spawnRandomAsteroids(7);
    }
    collision();
    for (let i = 0; i < G.asteroids.length; i++) {
      G.asteroids[i].update();
    };

    if (Key.released(Key.SPACE)) {
      G.state = 'playing';
      S.playing.level++;
      S.playing.resetLevel = true;
    }

  },
  render: function () {
    // render G.asteroids
    for (let i = 0; i < G.asteroids.length; i++) {
      G.asteroids[i].render();
    }
    // render scene
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = 'blue';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.closePath();
    ctx.restore();
    // render text holder
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#020811';
    ctx.fillRect(CANVAS_W/4, CANVAS_H/4, CANVAS_W/2, CANVAS_H/2);
    // render text
    ctx.fillStyle = 'white';
    ctx.font = 'small-caps 30px verdana';
    ctx.fillText("FRIENDLY ALIEN", CANVAS_W/4 + 75, CANVAS_H/2-50, 300);
    ctx.font = 'small-caps 15px verdana';
    ctx.fillText("PRESS SPACE TO PLAY", CANVAS_W/4 + 120, CANVAS_H/2, 300);
    ctx.font = 'small-caps 15px verdana';
    ctx.fillText("arrow to move", CANVAS_W/3+ 80, CANVAS_H/2 + 50, 200);
    ctx.restore();

  }
}</script>

    this.t += dt;
    
    station.winLogic();
    collision();

    // i start from 1 because player in 0
    for (let i = 1; i < G.asteroids.length; i++) {
      G.asteroids[i].update();
    }
    if (this.gameOver) {
      player.dx = player.dy = 0;
      G.asteroids = [];
    } else {
      player.update();
    }
    station.update();

  },

  loadLevel: function (level) {
    G.asteroids = [];
    G.asteroids.push(player);
    for (let i = 0; i < level.f.length; i++) {
      G.asteroids.push(spawnAsteroid(level.f[i]));
    }
    player.x = level.p[0];
    player.y = level.p[1];
    player.dx = level.p[2];
    player.dy = level.p[3];
  },

  render: function () {
    // render background, scene, etc
    if (G.state != 'playing') {
      return;
    }
    if (this.t < 1) {
      // level at opening
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#020811';
      ctx.fillRect(325, 175, 160, 50);
      ctx.fillStyle = 'white';
      ctx.font = 'small-caps 30px verdana';
      ctx.fillText("LEVEL " + (this.level + 1), 350, 210, 200);
      ctx.restore();
    }
    grid.render();
    // render player, in game objects
    for (let i = 0; i < G.asteroids.length; i++) {
      G.asteroids[i].render();
    }

    player.render();
    station.render();
  }


}</script>

  fps: 60,
  clearCanvas: false,
  update: function (dt) {

    if (G.state == 'playing') {
      S.playing.update(dt);
    } else if (G.state == 'menu') {
      S.menu.update();
    } else if (G.state == 'level_won') {
      S.level_won.update(dt);
    } else if (G.state == 'gameover') {
      S.gameover.update();
    }

    // input update
    Key.update();
  },
  render: function () {

    background.render();

    if (G.state == 'playing') {
      S.playing.render();
    } else if (G.state == 'menu') {
      S.menu.render();
    } else if (G.state == 'level_won') {
      S.level_won.render();
    } else if (G.state == 'gameover') {
      S.gameover.render();
    }
  }
})
