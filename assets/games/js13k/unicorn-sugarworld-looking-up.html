<style>

<canvas id="c"></canvas>
<div id="ui"><div id="top"><div id="sp"></div></div>
<div id="bot"><div id="tip"></div><div id="flow"></div><div id="rail"></div><div id="hand"></div><div id="day"><div id="dayf"></div></div></div></div>
<div id="hud">UNTIL DARK <b id="lt"></b></div>

<button id="mn">&#9776;</button>

<div id="lg"></div>
<div id="end"><h1 id="eh"></h1><p id="ep"></p><small id="ex">tap to begin again</small></div>
<script>
"use strict";
const TAU=Math.PI*2,cv=document.getElementById("c"),x=cv.getContext("2d"),
 $=i=>document.getElementById(i),SP=$("sp"),RAIL=$("rail"),HAND=$("hand"),FLOW=$("flow"),
 TIP=$("tip"),LT=$("lt"),END=$("end"),LG=$("lg");
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(s){s>>>=0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
/* ================================================================
   V3 GAME LAYER — mood and flow, the only two things she can touch.

   Anansi is the board. Athena is the cast. She originates nothing;
   every card is a modification of a state he is already in.

   TWO VARIABLES, both his, both visible:
     MOOD  — an RGB point. Named at the nearest anchor, and the light
             coming down the canyon is tinted with it.
     TOPIC — what he is currently talking about. Cards either hold it
             or lose it.

   A topic pays out when you play a holding card and the mood shift
   lands him inside that topic's tolerance. Base topics pay a keyword.
   Extraction topics — made by auditing two keywords together — pay a
   band of sky, lit in the colour of the mood he was in when he broke.
   All seven extractions want a different mood, so the only route to a
   full rainbow is through all seven of him.
   ================================================================ */

/* nine anchors. the seven saturated ones are the seven bands. */
const MOOD=[
 ["calm",135,150,140],["guarded",80,85,95],
 ["annoyed",230,70,75],["raw",235,135,60],["delighted",240,200,80],
 ["fond",110,205,130],["hollow",70,185,185],["wistful",80,125,230],
 ["anxious",175,85,210]];
const NAME=i=>MOOD[i][0], MV=i=>[MOOD[i][1],MOOD[i][2],MOOD[i][3]];

/* topics. m = mood he must be in. a = where the talk drifts.
   d = keywords he lets go of when he breaks. */
const T={
 ants:{w:"ants",m:0,a:["tombs","price"],
  s:"The ants are only hungry, and hunger and I are old colleagues. It is what they dig <em>toward</em> that I mind. Under that ridge are the [tombs] you stopped visiting."},
 price:{w:"price",m:5,a:["keeper","ants","shaped"],
  s:"Your name. I will spend mine first, as you are new to this: I am Anansi, [Keeper] of Stories. Either way it becomes mine."},
 keeper:{w:"Keeper",m:4,a:["nyame","four","price"],
  s:"[Nyame]. The sky god. He held every story there was and would not let one go. So I bought them, and the asking price was [four] impossible things."},
 nyame:{w:"Nyame",m:4,a:["four","keeper","afraid"],
  s:"A god who thought no creature alive could pay him. He was very nearly right."},
 four:{w:"four",m:4,a:["nyame","keeper"],
  s:"Impossible in the way a thing is impossible right up until somebody does it. Afterward it is only clever."},
 tombs:{w:"tombs",m:8,a:["lullaby","ants","afraid"],
  s:"Look at the doors when you get down there. Nobody bars a door from the <em>outside</em> to keep the dead comfortable. Nobody carves seven [lullaby] flutes into a monument."},
 lullaby:{w:"lullaby",m:8,a:["tombs","afraid","grim"],
  s:"Sung every year without fail, until a comfortable century came, and then another, and now not one of you remembers the tune.<s>a pause</s>I am not in the habit of being [afraid]. I am making an exception."},
 afraid:{w:"afraid",m:7,a:["grim","tombs","lullaby"],
  s:"<s>quietly</s>Say that again more quietly."},
 shaped:{w:"shaped",m:5,a:["horn","price"],
  s:"One wing. A unicorn who cannot go up. Luck, was it?<s>he leans</s>Look at the thing on your head and tell me your kind grew a [horn] for ornament."},
 horn:{w:"horn",m:6,a:["shaped","grim"],
  s:"No. Some things must be found in the room where they happen or they do not take. I am not cruel. I am accurate."},
 grim:{w:"Grim",m:1,a:["colour","shadows","lullaby","horn"],
  s:"It is a condition, not a name.<s>he waits</s>Look around you, little horn. This canyon had [colour] in it once, before they were put under it."},
 colour:{w:"colour",m:6,a:["grim","shadows"],
  s:"I do not remember.<s>a long stillness</s>That is what they do. The taking is not the cruel part."},
 shadows:{w:"shadows",m:1,a:["grim","colour"],
  s:"Nothing, wearing a shape. They come from above, where you never look. You and your cousins are the same animal that way, pointed in opposite directions."}};

/* the seven. p = the two keywords audited together. m = the mood he
   has to be in before it comes out. b = which arc it lights. */
const X=[
 {p:["afraid","tombs"],m:8,w:"what is under the tombs",
  q:"What is under the tombs?",a:"Unicorns. Grim ones. Ours, buried by ours.",
  s:"<s>a long stillness</s>Unicorns.<s>he comes down the thread</s>Not a beast. Nothing you can hate cleanly and go home from. <em>Unicorns.</em> [Grim] ones. Your own, buried by your own, sung to sleep by your own until you stopped."},
 {p:["colour","grim"],m:6,w:"what a Grim does",
  q:"What does a Grim do?",a:"It takes colour. What it drains gets up and serves it.",
  s:"A unicorn <em>gives</em> colour. You have built an age of pageantry on it without once asking what the opposite looks like.<s>he answers himself</s>A Grim takes. It walks a field and the green goes out behind it and does not come back. And what is left standing in a drained thing does not lie down. It gets up, and it serves. [Shadows] with no face to read, so do not try."},
 {p:["tombs","lullaby"],m:7,w:"what keeps them down",
  q:"What keeps them down?",a:"Seven flutes and a lullaby. Nobody sings it any more.",
  s:"Seven flutes and a tune. That is all. Not stone, not the doors. A thing that takes colour cannot bear to be sung to; it lies down and dreams instead.<s>quietly</s>So they sang. Every year. And then a comfortable century came, and the singing was left to the ones who could not fly, and then to nobody."},
 {p:["grim","lullaby"],m:3,w:"who the Grim were",
  q:"Who were the Grim?",a:"The ones who could not fly. My cousins in the sky are the ones who left.",
  s:"Yours.<s>he lets it sit</s>When the first of them woke and began to take, your kind did three things, and your Assembly remembers one. The strong-winged went <em>up</em>, and kept going, and built your palace where nothing flightless could follow. The ones who could not fly stayed on the ground, because that is where they were, and what the Grim did not take of them learned the tune and carved the flutes and sang the thing to sleep.<s>a pause</s>And the taken ones got up, and served, and are under there still. Your cousins in the sky are the ones who left. You have never once been told that, and now you know why."},
 {p:["grim","shaped"],m:2,w:"what she is to become",
  q:"What am I to become?",a:"He would not finish the sentence. I can.",
  s:"<s>he is very close now</s>You are quick, and I did not want to be the one to say it.<s>a pause</s>Whoever hunts monsters should take some care that he does not become one in the hunting. And if you spend long enough looking down a hole\u2014<s>he stops</s>\u2026you can finish that part yourself. You are standing in one."}];
const NB=X.length;

/* he deflects in whatever mood he is actually in */
const DEF=[["Mm.","Go on, then.","Is that your question?"],
 ["No.","Ask me something else.","<s>he says nothing</s>"],
 ["<em>Enough</em> of that.","You are pushing.","Do not."],
 ["…","<s>he is not steady</s>Not that. Not now.","Ask again later."],
 ["<em>Ha!</em> Perhaps.","Oh, very good. Nearly.","You are close and you know it."],
 ["Hm. I like you, which is not the same as answering.","Nearly, little horn.","Almost."],
 ["<s>a long stillness</s>","Hm.","I have nothing for that."],
 ["<s>quietly</s>Not yet.","Ask that again when the light is different.","Mm."],
 ["Not while it is that near.","<s>he glances up</s>No.","Later. Not that."]];

const DRY=["There is nothing left in that one.","We have been over it.","That well is dry, little horn."];

const AU=(()=>{
let C=null,M=null,on=true,dry=null,pulse=0,dens=0,bedG=null,bedF=null,cache={};
const SCALE=[0,3,5,7,10,12,15,17,19,22];
const BELL=[1,0,1,0,1,1,0,1,0,1,0,1];
function ks(freq,dec,sr,bright){
 const n=Math.round(sr/freq),len=sr*3.2|0,b=new Float32Array(len),d=new Float32Array(n);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 let lp=0,p=0;
 for(let i=0;i<len;i++){
  const v=d[p];
  lp+=(v-lp)*bright;
  d[p]=(lp*.5+d[(p+1)%n]*.5)*dec;p=(p+1)%n;
  b[i]=v*.55*Math.exp(-i/sr*.55)}
 const f=sr*.25|0;for(let i=0;i<f;i++)b[len-1-i]*=i/f;
 return b}
function boot(){if(C)return;
 C=new (window.AudioContext||window.webkitAudioContext)();
 M=C.createGain();M.gain.value=.55;
 const cmp=C.createDynamicsCompressor();cmp.threshold.value=-18;cmp.ratio.value=3;
 M.connect(cmp);cmp.connect(C.destination);
 dry=C.createGain();dry.connect(M);
 const dl=C.createDelay(3);dl.delayTime.value=.52;
 const fb=C.createGain();fb.gain.value=.42;
 const lp=C.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2100;
 const wet=C.createGain();wet.gain.value=.42;
 dry.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(M);
 const sr=C.sampleRate,nb=C.createBuffer(1,sr*3,sr),nd=nb.getChannelData(0);
 let l=0;for(let i=0;i<nd.length;i++){l+=((Math.random()*2-1)-l)*.06;nd[i]=l*3}
 const src=C.createBufferSource();src.buffer=nb;src.loop=true;
 bedF=C.createBiquadFilter();bedF.type="bandpass";bedF.frequency.value=150;bedF.Q.value=1.1;
 bedG=C.createGain();bedG.gain.value=.14;
 src.connect(bedF);bedF.connect(bedG);bedG.connect(M);src.start();
 weave()}
function one(midi,g,pan,dec,when){
 if(!C||!on)return;
 const f=55*Math.pow(2,(midi-33)/12),k=midi.toFixed(2)+"|"+dec.toFixed(3);
 let b=cache[k];
 if(!b){const a=ks(f,dec,C.sampleRate,.42);b=C.createBuffer(1,a.length,C.sampleRate);
  b.copyToChannel(a,0);cache[k]=b}
 const s=C.createBufferSource();s.buffer=b;
 const gn=C.createGain();gn.gain.value=g;s.connect(gn);
 if(C.createStereoPanner){const p=C.createStereoPanner();p.pan.value=pan;
  gn.connect(p);p.connect(dry)}else gn.connect(dry);
 s.start(C.currentTime+(when||0))}
function pluck(midi,g,pan,dec,when){
 one(midi,g,pan,dec,when);
 one(midi+.11,g*.62,pan*-.7,dec*.998,(when||0)+.012)}
function weave(){
 if(!C)return;
 const d=dens,p=pulse++%12,step=lerp(.42,.30,d);
 const jit=lerp(.30,.02,d)*(Math.random()-.5)*step*2;
 const play=BELL[p]?.30+.68*d:.10+.34*d;
 if(Math.random()<play){
  const deg=SCALE[(p*5+(pulse>>3))%SCALE.length],oct=p%3?0:-12,
   g=lerp(.10,.20,d)*(BELL[p]?1:.62);
  pluck(45+deg+oct,g,BELL[p]?-.42:.44,lerp(.980,.9945,d),Math.max(0,jit))}
 if(Math.random()<.14+d*.42)
  pluck(69+SCALE[(p*7)%SCALE.length],.045+.055*d,-.25,.976,step*.5+jit);
 if(!p&&d>.28)pluck(26,.14+.30*d,0,.997,0);
 if(p===6&&d>.62)pluck(28,.10+.18*d,.15,.996,0);
 setTimeout(weave,step*1000)}
return{
 boot(){boot();if(C)C.resume()},
 dens(v){dens=clamp(v,0,1);
  if(bedG){bedG.gain.setTargetAtTime(.12+.30*v,C.currentTime,1.2);
   bedF.frequency.setTargetAtTime(150-60*v,C.currentTime,1.2)}},
 speak(){pluck(40+SCALE[Math.random()*6|0],.09,.25,.985,0)},
 /* a thread comes off him: one bright string, high and clean */
 take(){pluck(76+SCALE[Math.random()*5|0],.075,.35,.968,0)},
 /* a band lights: the harp answers itself, climbing */
 band(i){[0,.13,.27].forEach((w,j)=>pluck(52+i*2+SCALE[j+1],.20-j*.03,j%2?.3:-.3,.992,w))},
 drop(){pluck(26,.40,0,.997,0);pluck(26+SCALE[1],.24,-.3,.996,.10);pulse=0;
  if(bedG)bedG.gain.setTargetAtTime(bedG.gain.value+.1,C.currentTime,.4)},
 toggle(){on=!on;if(C)on?C.resume():C.suspend();return on}}
})();


function mouthPath(){
 if(wall)return wall;
 const r=rng(1337),p=new Path2D(),N=90;
 for(let i=0;i<=N;i++){

/* ================================================================
   ENGINE

   One card per turn. A card does two things and never more: it shifts
   his mood along one channel, and it either holds the subject or loses
   it. Everything the player wants is downstream of those two.

   MIRROR  hold the subject, move him a little
   LABEL   hold the subject, move him a lot
   OPEN    move him a lot, and he takes the subject somewhere adjacent
   AUDIT   name two things he has said and put him on what they make,

   the right mood is the card he breaks on.
   ================================================================ */
/* ================================================================

   come out, then ask. Mood is a ring of nine named states; every card

  body=I.s+drift(info(cur))}
 else body=DEF[mi][turn%3];
 HAND.innerHTML="";RAIL.innerHTML="";FLOW.innerHTML="";
 exchange(hers,body,()=>{
  busy=false;
  if(got){mark();coach(5)}
  else if(tut===3)coach(4);
  if(light<=0)return finish();
  if(gated())return;
  render()})}
const pick=a=>a&&a.length?a[Math.random()*a.length|0]:null;

/* ================================================================
   THE BOARD: what he is, what the question needs, what she is holding
   ================================================================ */
function render(){
 if(over)return;
 const f=focus(),I=info(f),plan=f!==cur,d=Math.abs(ringD(mi,I.m));
 LT.textContent=light;$("dayf").style.width=(light/PERDAY*100)+"%";
 FLOW.innerHTML="<span id=tw><i>he is</i>"+NAME(mi)+"</span>"+
  "<span id=need><u>"+(plan?I.w+"<br>needs "+NAME(I.m):"talking about<br>"+I.w)+"</u>"+
  (plan?"<b style='font-size:1.1em;color:#f1eaff'>"+(d>1?d-1+(d>2?" steps":" step"):"now")+"</b>":"")+
  "</span><span id=ring>"+RING.map(m=>"<i style='background:"+cs(MV(m))+"'"+(m===mi?" class=h":plan&&m===I.m?" class=n":"")+"></i>").join("")+"</span>";

 RAIL.innerHTML="";
 for(const[id,w]of chips){
  const b=document.createElement("button");
  const usable=[...chips.keys()].some(o=>o!==id&&
   (()=>{const i=xOf(pairKey([id,o]));return i>=0&&!spent.has("X"+i)})());
  b.className="c"+(sel.includes(id)?" s":"")+(usable?"":" d")+
   (sel.length===1&&!sel.includes(id)&&xOf(pairKey([sel[0],id]))>=0&&
    !spent.has("X"+xOf(pairKey([sel[0],id])))?" p":"");
  b.innerHTML="<i style='background:"+cs(MV(T[id].m))+"'></i>"+w;
  b.onclick=()=>{if(busy)return;
   sel=sel.includes(id)?sel.filter(s=>s!==id):sel.length<2?[...sel,id]:[id];render()};
  RAIL.appendChild(b)}

 HAND.innerHTML="";
 hand.forEach((k,n)=>{
  const b=document.createElement("button"),v=V[k.v],st=ringD(mi,v[1]);
  const nm=st?RING[(posOf(mi)+(st>0?1:-1)+9)%9]:mi,after=Math.abs(ringD(nm,I.m));
  b.className="cd";
  b.innerHTML="<em>"+v[0]+"</em><b style='color:"+cs(MV(v[1]))+"'>\u2192 "+NAME(v[1])+"</b><i>"+
   (!st?"holds":!plan?"one step":after<d?"closer":after>d?"farther":"sideways")+"</i>";
  b.onclick=()=>play(n);
  HAND.appendChild(b)});
 if(sel.length===2&&xOf(pairKey(sel))>=0&&!spent.has("X"+xOf(pairKey(sel)))){
  const b=document.createElement("button");b.className="cd s";
  b.innerHTML="<em>ask</em><b>\u26a1</b><i>"+(d>1?"wrong weather":"he will break")+"</i>";
  b.onclick=ask;HAND.appendChild(b)}
 if(tut===1&&!coach.t2){coach.t2=1;setTimeout(()=>coach(2),3200)}
 $("fold").textContent=armed?"mean it":lit.some(Boolean)?"take what you have and go":"accept his terms"}

function mark(){
 const m=$("mn");m.classList.remove("fl");void m.offsetWidth;m.classList.add("fl")}
function showLedger(){if(!ledgerShown){ledgerShown=1;setTimeout(openLedger,900)}}
function ledgerRows(){
 return X.map((o,b)=>"<div class='q"+(lit[b]?" a":"")+"'><i style='background:"+
  (lit[b]?cs(lit[b]):"#3a3260")+"'></i><span>"+o.q+(lit[b]?"<br><a>"+o.a+"</a>":"")+"</span><u>"+(lit[b]?"taken":"needs "+NAME(o.m))+"</u></div>").join("")}
function openLedger(){
 LG.innerHTML="<h2>what I came down here to learn</h2>"+ledgerRows()+"<small>tap to close</small>";
 LG.classList.add("on")}
LG.onclick=()=>LG.classList.remove("on");

const CLOSE=[
 "Good. Ordinary after all \u2014 I did wonder. Go down, little courier, and try not to think too hard about what you are walking into.",
 "You got something off me. One thing. That is one more than anyone who came down before you managed, and I find I am going to remember you for it.",
 "You have had more out of me in a day than Nyame managed in a lifetime, and I enjoyed almost none of it. Go carefully down there.",
 "<em>Look at you.</em> I have said things aloud to you that I have not said since before your mountains stood up. I do not like it at all, and I would very much like you to come back.",
 "<em>Look up.</em><s>she does not</s>That is your rainbow now, little horn, and there is not one colour in it that was not mine first. I did not feel it going. Nobody ever does.<s>a pause</s>So now you know how it is done. Try to remember, when you are down there and it comes easily, that you did not like me for doing it."];

   three cards, all Jesse's to write. */

 "She falls a long way, and the dream that comes up to meet her is not hers. She does not know whose eyes she is looking through.",
 "She knows enough to be afraid of what she is about to see. She does not know it will be from the inside.",
 "She knows exactly whose eyes she is about to look through. That is the one thing he could not have told her."];

 over=true;busy=true;sel=[];
 HAND.innerHTML="";RAIL.innerHTML="";FLOW.innerHTML="";TIP.className="";

 const n=lit.reduce((a,b)=>a+(b?1:0),0),tier=n?n<2?1:n<4?2:n<5?3:4:0;
 tDescent=Math.min(1,tDescent+.12);
 cut=say(CLOSE[tier]+"<s>he settles</s>"+DEAL,()=>setTimeout(()=>{
