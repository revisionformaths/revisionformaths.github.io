<!doctypehtml><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Clawstruck</title><style>body,html{margin:0;padding:0;height:100%;font-family:'Courier New',Courier,monospace;font-weight:700;color:#2d1b27}body{background-color:#31293e;justify-content:center;align-items:center;display:flex}.game-container{display:flex;justify-content:space-between;height:450px;width:550px;border:8px solid #5f575e;background-color:#160d13;padding:20px}.left-container{width:300px;background-color:none;margin-right:20px;margin-top:auto;margin-bottom:auto;display:grid;grid-template-columns:repeat(6,50px);grid-template-rows:repeat(8,50px);position:relative;overflow:hidden}.grid-square{width:50px;height:50px;box-sizing:border-box;position:relative}.grid-square.warning-tile::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background-color:rgba(255,0,0,.5);animation:flash-warning .4s infinite alternate}@keyframes flash-warning{from{opacity:.7}to{opacity:.2}}.light-tile{background-image:url(data:image/webp;base64,UklGRsAAAABXRUJQVlA4ILQAAABQBwCdASoyADIAPpFAmUelpCKhMAgAsBIJaQDQIEAP4BFgX5m7SXU/zwQA9eRH3pXXkNrsuX8Fx0yM78tP2JozmSYAAP2fFzK9ybP4tuWCn+2SKYv/YhPxT7a5xpsuEMfhp4v+RcfE9QoS6PVJgedWGfrUlE9cDS8JNdGjNmiwaXfN8qMJmsbHRHFDngNsvZps4d2Zgb9iLWXP7gdrAEqeKPU19A3HH4oFqqhOPmJ5dsEAAAA=);background-size:cover;display:flex;justify-content:center;align-items:center;image-rendering:pixelated}.dark-tile{background-image:url(data:image/webp;base64,UklGRqgAAABXRUJQVlA4IJwAAABQBgCdASoyADIAPpFEmUelpKKhMBgIALASCWkA0UxAACCfuvkQK4igt2HmtIwkuDNENBmnXIpxKieFAAD+4scN3L933v+6pirLgrTqn529pzviYDmqa/vsUO/RYblS3fWo2GZVRp5LSLmoxHc+OrWIHnTWH2Iz3I+gqV4Fn3Np0ywyE5ZV/dHA85fophnO7kNKftcnzA+xGwkAAAA=);background-size:cover;display:flex;justify-content:center;align-items:center;image-rendering:pixelated}.stickman-character{width:30px;height:30px;image-rendering:pixelated}.right-container{display:flex;flex-direction:column;align-items:center;width:230px ansition:all .1s ease-in-out}.restart-button:hover{background-image:url(data:image/webp;base64,UklGRr4AAABXRUJQVlA4WAoAAAAQAAAAbQAAJwAAQUxQSCoAAAABDzD/ERFCTdtGUKUCK382ZdDtvunGiP5PAFIVLrkUXkpdH+QaL6EkXAJWUDggbgAAADAGAJ0BKm4AKAA+fTCSR6SjIaE4SACQD4lpANG8Myq8JJfVDm4MZd75TbjbtiNlMlYj825zMujukAAA/vymW/dGj7oDCIrxVMNuXu7jGPRA2cfbPx/BR/hD5PSBwAHPwi2cfbAMxeAHVKekRAAA)}.restart-button:active{background-image:url(data:image/webp;base64,UklGRs4AAABXRUJQVlA4WAoAAAAQAAAAbQAAJwAAQUxQSCwAAAABDzD/ERFCcdu2kYEM5v23yQb+5er5jOj/BEBRYpKHZJMU50/wmE1CiBi1LFZQOCB8AAAAEAYAnQEqbgAoAD59MJJHpKMhoThIAJAPiWkAz6hAA9wBoVXhJL6oc3BjLvfKSJLw+u2CkdB/1rcAAP7s9PbN68kh6lCrEsUI3A9bAUjYS9s/H8FHwhK63Ep9RL3wAFI/LCXvcm4WjPZ3/akWCV+9vbrasl5vH/rN1nKgAA==);transform:translateY(4px)}</style><div class=game-container><div class=left-container></div><div class=right-container><div class=top-right-container><div class=cat-container><img alt="cat Character"id=cat-character src=assets/cat.webp></div><div class=cat-text-container>i'll destroy you with my paw</div></div><div class=bottom-right-container><div class=heart-container></div><div class=time-score-container></div></div></div></div><script>document.addEventListener('DOMContentLoaded', () => {
            const leftContainer = document.querySelector('.left-container');
            const heartContainer = document.querySelector('.heart-container');
            const timeScoreContainer = document.querySelector('.time-score-container');
            const catTextContainer = document.querySelector('.cat-text-container');
            const bottomRightContainer = document.querySelector('.bottom-right-container');

            let playerLives = 3;
            const maxLives = 3;
            let startTime = Date.now();
            let timerInterval;
            let pawAttackInterval;
            let dialogueInterval;
            let difficultyLevel = 0;
            let currentAttackInterval = 800;
            let isGameOver = false;

            let recentSpawns = {};
            const SPAWN_COOLDOWN = 1000;

            const catDialogues = [
                "Heh. Too slow.",
                "Gonna getcha!",
                "Nowhere to run!",
                "Just a little tap...",
                "My claws are sharp!"
            ];

            const gridRows = 8;
            const gridCols = 6;
            const totalSquares = gridRows * gridCols;
            const allSquares = [];

            for (let i = 0; i < totalSquares; i++) {
                const square = document.createElement('div');
                
                square.classList.add('grid-square');

                const row = Math.floor(i / gridCols);
                const col = i % gridCols;

                square.classList.add((row + col) % 2 === 0 ? 'light-tile' : 'dark-tile');
                
                leftContainer.appendChild(square);
                allSquares.push(square);
            }

            let stickmanRow = 2;
            let stickmanCol = 3;

            const stickman = document.createElement('img');
            stickman.src="data:image/webp;base64,UklGRogAAABXRUJQVlA4WAoAAAAQAAAAHQAAHQAAQUxQSDAAAAABDzD/ERFCVW3b0H3P9EcdsUiikj81xHgJpgYR/Z8AqL+c5IO3oZChuRQ1u6YtDQBWUDggMgAAAPACAJ0BKh4AHgA+kTqZR6WjIqEoDVCwEglnAAA/Q5kAAP73M224nSStn/ca+J/9+AAA";
            stickman.alt = 'Stickman Character';
            stickman.classList.add('stickman-character');

            function drawStickman() {
                const targetIndex = stickmanRow * gridCols + stickmanCol;
                const targetSquare = allSquares[targetIndex];
                targetSquare.appendChild(stickman);
            }

            function drawHearts(){
                heartContainer.innerHTML = '';
                for(let i = 0; i < maxLives; i++) {
                    const heart = document.createElement('img');
                    heart.classList.add('heart-img');

                    if (i < playerLives) {
                        heart.src="data:image/webp;base64,UklGRjIBAABXRUJQVlA4WAoAAAAQAAAAKwAAKwAAQUxQSCsAAAABDzD/ERECMSNJGoPxt1yD+s4dQUT/JyB7uU5OmYD+dJBF0M2RTXR1WTwMAFZQOCDgAAAAcAkAnQEqLAAsAD51LpBHpKKhoTjMAJAOiWgBBgGIaK5TaMB4gHSA0P/0AN3A9kD/VYIt/RuoBbfo+j8jn8mjBTI/VZOndVFhkcuV3kNZP1lJRS4AAP61XjDwxUPzeIg4w8yfeR6+Uvn/Zb58/9s/s7/29c/edfEn3wC/iTPxVMtEkt/05f4ZgmeKY0dxjw6wlo7neHAcNDZ74/hWrg4QvR5FWUCw/osAmdnwj0WALJND+J0ncQyXnXrnKqglYWwg2Og5JBlG2HPTl3Yrza+nDZ8WmBAhywJUbHg7hhv0AAA=";
                    } else {
                        heart.src="data:image/webp;base64,UklGRtgAAABXRUJQVlA4WAoAAAAQAAAAKwAAKwAAQUxQSCsAAAABDzD/ERECMSNJGoPxt1yD+s4dQUT/JyB7uU5OmYD+dJBF0M2RTXR1WTwMAFZQOCCGAAAA8AcAnQEqLAAsAD5xKpBHpKKhoTxoAJAOCWcAzkBBH9AP0A/QDvUfgBc/pG8uIZRnce1ZNoCdEUKWgHKU48IeOGxzaOOze4QAAPutlI3Q/YSud/i8StniH8XfhpP7jyiy0+UEnIl0NZp/zP4fUYCOPkdN9F4YBOfo9cP/VOoYzP2Iv86OAAA=";
                    }

                    heartContainer.appendChild(heart);
                }
            }

            function updateTimer() {
                const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                const seconds = (elapsedTime % 60).toString().padStart(2, '0');
                timeScoreContainer.textContent = `Time Survived: ${minutes}:${seconds}`;

                const newDifficultyLevel = Math.floor(elapsedTime / 20);
                if (newDifficultyLevel > difficultyLevel) {
                    difficultyLevel = newDifficultyLevel;
                    console.log(`Difficulty increased to level ${difficultyLevel}`);
                    clearInterval(pawAttackInterval);
                    currentAttackInterval = Math.max(300, 1000 - difficultyLevel * 125);
                    pawAttackInterval = setInterval(createPawAttack, currentAttackInterval);
                }
            }

            function changeCatDialogue() {
                const randomIndex = Math.floor(Math.random() * catDialogues.length);
                catTextContainer.textContent = catDialogues[randomIndex];
            }

            function handleKeyPress(event) {
                if (playerLives <= 0) return;
                switch(event.key) {
                    case 'w':
                    case 'ArrowUp':
                        stickmanRow = Math.max(0, stickmanRow - 1);
                        break;
                    case 's':
                    case 'ArrowDown':
                        stickmanRow = Math.min(gridRows - 1, stickmanRow + 1);
                        break;
                    case 'a':
                    case 'ArrowLeft':
                        stickmanCol = Math.max(0, stickmanCol - 1);
                        break;
                    case 'd':
                    case 'ArrowRight':
                        stickmanCol = Math.min(gridCols - 1, stickmanCol + 1);
                        break;
                    default:
                        return; 
                }

                drawStickman();
            }

            function createPawAttack() {
                if (playerLives <= 0) return;
                const directions = ['right', 'left', 'top', 'bottom'];
                const attackDirection = directions[Math.floor(Math.random() * directions.length)];

                let attackRow, attackCol, attackLength;
                const attackedSquares = [];

                const maxAttempts = 10;
                let attempts = 0;

                switch(attackDirection) {
                    case 'right': case 'left':
                        do {
                            attackRow = Math.floor(Math.random() * gridRows);
                            const key = `row-${attackRow}`;
                            const lastSpawn = recentSpawns[key];
                            if (!lastSpawn || Date.now() - lastSpawn > SPAWN_COOLDOWN) {
                                recentSpawns[key] = Date.now();
                                break;
                            }
                            attempts++;
                        } while (attempts < maxAttempts);
                        
                        attackLength = Math.floor(Math.random() * (gridCols - 2)) + 3;
                        break;
                    case 'top': case 'bottom':
                        do {
                            attackCol = Math.floor(Math.random() * gridCols);
                            const key = `col-${attackCol}`;
                            const lastSpawn = recentSpawns[key];
                            if (!lastSpawn || Date.now() - lastSpawn > SPAWN_COOLDOWN) {
                                recentSpawns[key] = Date.now();
                                break;
                            }
                            attempts++;
                        } while (attempts < maxAttempts);

                        attackLength = Math.floor(Math.random() * (gridRows - 2)) + 3;
                        break;
                }

                for (let i = 0; i < attackLength; i++) {
                    let squareIndex;
                     switch(attackDirection) {
                        case 'right': squareIndex = attackRow * gridCols + (gridCols - 1 - i); break;
                        case 'left':  squareIndex = attackRow * gridCols + i; break;
                        case 'top':   squareIndex = i * gridCols + attackCol; break;
                        case 'bottom':squareIndex = (gridRows - 1 - i) * gridCols + attackCol; break;
                    }
                    if (allSquares[squareIndex]) {
                        allSquares[squareIndex].classList.add('warning-tile');
                        attackedSquares.push({row: Math.floor(squareIndex / gridCols), col: squareIndex % gridCols});
                    }
                }

                setTimeout(() => {
                    attackedSquares.forEach(sq => {
                        const idx = sq.row * gridCols + sq.col;
                        if (allSquares[idx]) {
                           allSquares[idx].classList.remove('warning-tile');
                        }
                    });

                    if (isGameOver) return;

                    const pawContainer = document.createElement('div');
                    pawContainer.className = 'paw-container';
                    const pawImage = document.createElement('img');
                    pawImage.className = 'paw-image';
                    pawImage.src="data:image/webp;base64,UklGRlIBAABXRUJQVlA4WAoAAAAQAAAAJwAAJwAAQUxQSE8AAAABDzD/ERGCTSNJjuZ9+BAOylNbaA/lIFz4dieYcxAi+j8BaDZOQOImO2AMBReSg5FklE8usRZUWMUpUS5xucQqkHFJEskBSZwBcG4ADnQGAFZQOCDcAAAA8AUAnQEqKAAoAD6JOJVHpSOiITHKAKARCWcAzvDwC2gs197hIw8y7Zz7N8cZBXLboH6mfhLg9wAA/v0CTm7P58Gvjv35tcv6vytfnMYLWwZ0O0hKD0sF+jGp+MQnzPn3nKantAiZUgmxTzANKjX7MjfsdGdFHRC9PWb5hRB9As36G7/hZm9L9zFyHNcnnqFePHOa7O2FVeUrX9sXwg9p84qsjDc4WNu4qR5S8/gInIF/A/xPwx2IAWn7WW+FV+sw/+QXPifTs+03mEFZCd48PfwAv++oZPHxR0ogAA==";
                    const pawArm = document.createElement('div');
                    pawArm.className = 'paw-arm';
                    
                    leftContainer.appendChild(pawContainer);
                    
                    switch(attackDirection) {
                        case 'right':
                            pawContainer.style.flexDirection = 'row-reverse';
                            pawContainer.appendChild(pawArm);
                            pawContainer.appendChild(pawImage);
                            pawContainer.style.top = `${attackRow * 50}px`;
                            pawContainer.style.right = '0px';
                            pawImage.style.transform = 'rotate(360deg)';
                            break;
                        case 'left':
                             pawContainer.appendChild(pawArm);
                             pawContainer.appendChild(pawImage);
                             pawContainer.style.top = `${attackRow * 50}px`;
                             pawContainer.style.left = '0px';
                             pawImage.style.transform = 'rotate(180deg)';
                            break;
                        case 'bottom':
                            pawContainer.style.flexDirection = 'column-reverse';
                            pawContainer.appendChild(pawArm);
                            pawContainer.appendChild(pawImage);
                            pawContainer.style.left = `${attackCol * 50}px`;
                            pawContainer.style.bottom = '0px';
                            pawContainer.style.width = '50px';
                            pawContainer.style.alignItems = 'center';
                            pawArm.style.width = '25px';
                            pawArm.style.height = '0';
                            pawImage.style.transform = 'rotate(90deg)';
                            break;
                        case 'top':
                             pawContainer.style.flexDirection = 'column';
                             pawContainer.appendChild(pawArm);
                             pawContainer.appendChild(pawImage);
                             pawContainer.style.left = `${attackCol * 50}px`;
                             pawContainer.style.top = '0px';
                             pawContainer.style.width = '50px';
                             pawContainer.style.alignItems = 'center';
                             pawArm.style.width = '25px';
                             pawArm.style.height = '0';
                             pawImage.style.transform = 'rotate(270deg)';
                            break;
                    }

                    setTimeout(() => {
                        if (attackDirection === 'top' || attackDirection === 'bottom') {
                            pawArm.style.height = `${(attackLength - 1) * 50}px`;
                        } else {
                            pawArm.style.width = `${(attackLength - 1) * 50}px`;
                        }

                        setTimeout(() => {
                            let collisionCheckInterval;

                            collisionCheckInterval = setInterval(() => {
                                if (isGameOver) {
                                    clearInterval(collisionCheckInterval);
                                    return;
                                }

                                const hit = attackedSquares.some(sq => sq.row === stickmanRow && sq.col === stickmanCol);

                                if (hit && !isGameOver) {
                                    playerLives--;
                                    drawHearts();
                                    if (playerLives <= 0) {
                                        endGame();
                                    }
                                    clearInterval(collisionCheckInterval); 
                                }
                            }, 50); 

                            const randomStayDuration = Math.random() * 3000;

                            setTimeout(() => {
                                clearInterval(collisionCheckInterval);
                                
                                if (attackDirection === 'top' || attackDirection === 'bottom') {
                                    pawArm.style.height = '0';
                                } else {
                                    pawArm.style.width = '0';
                                }
                                setTimeout(() => pawContainer.remove(), 200);
                            }, randomStayDuration);

                        }, 120);      

                    }, 100); 

                }, 1200);
            }

            function endGame() {
                if (isGameOver) return;
                isGameOver = true;
                const finalTimeText = timeScoreContainer.textContent;

                clearInterval(pawAttackInterval);
                clearInterval(timerInterval);
                clearInterval(dialogueInterval);
                document.removeEventListener('keydown', handleKeyPress);
                catTextContainer.textContent = "GAME OVER!";

                heartContainer.style.display = 'none';

                const restartButton = document.createElement('button');
                restartButton.textContent = 'RESTART';
                restartButton.className = 'restart-button';
                restartButton.onclick = () => {
                    location.reload();
                };

                timeScoreContainer.innerHTML = ''; 
                
                const finalTimeElement = document.createElement('div');
                finalTimeElement.textContent = finalTimeText; 

                timeScoreContainer.style.display = 'flex'; 
                timeScoreContainer.style.alignItems = 'center';
                timeScoreContainer.appendChild(finalTimeElement);
                timeScoreContainer.appendChild(restartButton); 
                timeScoreContainer.style.flexDirection = 'column';
                timeScoreContainer.style.gap = '10px';
            }

            function startGame(){
                isGameOver = false; 
                recentSpawns = {};
                difficultyLevel = 0;
                currentAttackInterval = 800;
                playerLives = 3;
                startTime = Date.now();
                
                timeScoreContainer.innerHTML = '';
