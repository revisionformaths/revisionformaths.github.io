    <script>"use strict";

$.input = {
    KEY: {
        UP: 0,
        DOWN: 1,
        LEFT: 2,
        RIGHT: 3,
        JUMP: 4,
        ACTION: 5,
        SWITCH: 6,
        RESET: 7
    },
    map: [
        ['w', 'ArrowUp'],
        ['s', 'ArrowDown'],
        ['a', 'ArrowLeft'],
        ['d', 'ArrowRight'],
        [' '],
        ['e', 'Control'],
        ['q', 'Shift'],
        ['r']
    ],
    state: [
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0},
        {pressed: false, justChanged: false, heldTime: 0}
    ],
    keyBuffer: [],

    anyKeyPressed: false,

    init: function() {
        this._clearBuffer();
        window.addEventListener('keyup', (event) => {
            if (event.repeat) return;

            this.anyKeyPresed = false;

            for (let i = 0; i < this.map.length; i++) {
                if (this.map[i].includes(event.key)) {
                    this.keyBuffer[i] = -1;
                }
            }
        });
        window.addEventListener('keydown', (event) => {
            if (event.repeat) return;

            this.anyKeyPresed = true;

            for (let i = 0; i < this.map.length; i++) {
                if (this.map[i].includes(event.key)) {
                    this.keyBuffer[i] = 1;
                }
            }
        });

        return Promise.resolve();
    },

    _clearBuffer: function() {
        this.keyBuffer = this.map.map(() => 0);
    },

    clearState: function() {
        this._clearBuffer();
        for (let i = 0; i < this.state; i++) {
            this.state[i].pressed = false;
            this.state[i].justChanged = false;
            this.state[i].heldTime = 0;
        }
    },

    update: function(dt) {
        for (let i = 0; i < this.state.length; i++) {
            const bufferValue = this.keyBuffer[i];
            if (bufferValue) {
                this.state[i].justChanged = true;
                if (bufferValue < 0) {
                    this.state[i].pressed = false;
                    this.state[i].heldTime = 0;
                } else if (this.keyBuffer[i] > 0) {
                    this.state[i].pressed = true;
                }
            } else {
                this.state[i].justChanged = false;
                if (this.state[i].pressed) {
                    this.state[i].heldTime += dt;
                }
            }
        }

        this._clearBuffer();
    },

    pressed: function(key) {
        return this.state[key].pressed;
    },
    justPressed: function(key) {
        return this.state[key].pressed && this.state[key].justChanged;
    },
    released: function(key) {
        return !this.state[key].pressed;
    },
    justReleased: function(key) {
        return !this.state[key].pressed && this.state[key].justChanged;
    },
    held: function(key) {
        return this.state[key].pressed && !this.state[key].justChanged;
    }
}</script>
    <script>"use strict";

function Hitbox(entityId, x1, y1, x2, y2, solid, active, oneway = false) {
    this.entityId = entityId;
    
    this.x1 = x1;
    this.y1 = y1;
    this.x2 = x2;
    this.y2 = y2;
    
    this.solid = solid;
    this.active = active;
    this.oneway = oneway;
}

$.physics = {
    hitboxes: [null],

    SIDE: {
        LEFT:   1,
        RIGHT:  2,
        UP:     3,
        DOWN:   4
    },

    init: function() {
        return Promise.resolve();
    },

    checkCollisions: function(hitboxIndex) {
        const collider = this.hitboxes[hitboxIndex];
        const entities = [];
        const solidCollisions = [];

        for (let i = 1; i < this.hitboxes.length; i++) {
            if (i === hitboxIndex) {
                continue;
            }

            const collidee = this.hitboxes[i];

            if (collider.entityId && collider.entityId === this.hitboxes[i].entityId) {
                continue;
            }

            if (!collidee ||
                !collidee.active ||
                collider.x2 <= collidee.x1 ||
                collider.x1 >= collidee.x2 ||
                collider.y2 <= collidee.y1 ||
                collider.y1 >= collidee.y2) {
                    continue;
                }

            if (collidee.entityId) {
                if (!entities.includes(collidee.entityId)) {
                    entities.push(collidee.entityId);
                }
            }

            if (!collidee.solid) {
                continue;
            }

            const corrections = [
                collidee.x1 - collider.x2, // x
                collidee.x2 - collider.x1, // x
                collidee.y1 - collider.y2, // y
                collidee.y2 - collider.y1  // y
            ];

            let correction = corrections[0];
            let index = 0;
            for (let j = 1; j < corrections.length; j++) {
                if (Math.abs(corrections[j]) < Math.abs(correction)) {
                    correction = corrections[j];
                    index = j;
                }
            }

            const collisionInfo = {
                collidee,
                x: 0,
                y: 0,
                l: corrections[0],
                r: corrections[1],
                u: corrections[2],
                d: corrections[3]
            };

            if (index < 2) {
                collisionInfo.x = correction;
            } else {
                collisionInfo.y = correction;
            }

            if (!collidee.oneway || collisionInfo.y < 0) {
                solidCollisions.push(collisionInfo);
            }
        }

        return {
            entities,
            solidCollisions
        };
    },

    registerHitbox(x1, y1, x2, y2, solid, entityId = null, active = true) {
        for (let i = 1; i < this.hitboxes.length; i++) {
            if (!this.hitboxes[i]) {
                this.hitboxes[i] = new Hitbox(entityId, x1, y1, x2, y2, solid, active);
                return i;
            }
        }

        this.hitboxes.push(new Hitbox(entityId, x1, y1, x2, y2, solid, active));

        return this.hitboxes.length - 1;
    },

    freeHitbox: function(hitboxIndex) {
        this.hitboxes[hitboxIndex] = null;
    },

    resetHitboxes: function() {
        this.hitboxes = [null];
    },

    setHitboxPos: function(hitboxIndex, x, y) {
        const hitbox = this.hitboxes[hitboxIndex];
        const width = hitbox.x2 - hitbox.x1;
        const height = hitbox.y2 - hitbox.y1;

        hitbox.x1 = x;
        hitbox.y1 = y;
        hitbox.x2 = hitbox.x1 + width;
        hitbox.y2 = hitbox.y1 + height;
    },

    moveHitbox: function(hitboxIndex, dx, dy) {
        const hitbox = this.hitboxes[hitboxIndex];
        hitbox.x1 += dx;
        hitbox.y1 += dy;
        hitbox.x2 += dx;
        hitbox.y2 += dy;
    },

    getHitboxInfo: function(hitboxIndex) {
        return {...this.hitboxes[hitboxIndex]};
    },

    toggleHitboxActive: function(hitboxIndex, active) {
        if (active === true || active === false) {
            this.hitboxes[hitboxIndex].active = active;
            return;
        }

        this.hitboxes[hitboxIndex].active = !this.hitboxes[hitboxIndex].active;
    },
}</script>

function SpriteAnimation(frames, frameWidth, frameHeight, frameRate, loop = false) {
    this.frameWidth = frameWidth * $.gfx.SPRITE_SHEET_UNIT;
    this.frameHeight = frameHeight * $.gfx.SPRITE_SHEET_UNIT;
    this.frameRate = frameRate;
    this.loop = loop;

    this.frames = frames.map(frame => {
        return [
            (frame[0] * this.frameWidth) + (($.gfx.SPRITE_SHEET_PADDING * 2) * frame[0]) + $.gfx.SPRITE_SHEET_PADDING,
            (frame[1] * this.frameHeight) + (($.gfx.SPRITE_SHEET_PADDING * 2) * frame[1]) + $.gfx.SPRITE_SHEET_PADDING,
        ];
    });
}

function Sprite(entityId, x, y, w, h, draw = true) {
    this.entityId = entityId;

    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    
    this.currentAnimation = null;

    this.frame = 0;
    this.frameTime = 0;
    this.play = false;
    this.draw = draw;
    this.done = false;
    this.loop = false;
    this.onDone = null;
}

                        this.dy = 1;
                        this.state = this.STATE.ON_GROUND;
                        this.attachedTo = null;
                    } else {
                        this.dy += 500 * dt;
                    }

                    return collisionData;
                }
            },
            function (dt) {
                switch (this.state) {
                    case this.STATE.ON_GROUND:
                        this.handleMovement(dt);
                        break;
                    case this.STATE.CARRIED: {
                        const info = $.physics.getHitboxInfo(this.attachedTo.hitbox);
                        $.entities.setEntityPos(this, info.x1, info.y1);
                    }
                        break;
                    case this.STATE.THROWN: {
                        const { entities, solidCollisions } = this.handleMovement(dt);

                        for (let i = 0; i < entities.length; i++) {
                            let entity = entities[i];

                            if (this.attachedTo && entity === this.attachedTo.index) {
                                continue;
                            }

                            switch ($.logic.getEntityType(entity)) {
                                case $.logic.ENTITY.NIC:
                                case $.logic.ENTITY.MAF:
                                    $.logic.sendEntityMessage(entity, this.type, { index: this.index })
                            }
                        }
                        
                        for (let i = 0; i < solidCollisions.length; i++) {
                            if (!!solidCollisions[i].y && this.dy < 0)
                                this.dy = 0;
                            if (!!solidCollisions[i].x) {
                                this.dx = 0;
                            }

                            if (this.dx === 0 && this.dy === 0)
                                break;
                        }

                        if (solidCollisions.find(c => !!c.y) && this.dy < 0) {
                            this.dy = 0;
                        }
                    }
                        break;
                    case this.STATE.KICKED: {
                        this.handleMovement(dt);
                    }
                        break;
                }
            },
            function (sender, data = null) {
                if (sender !== $.logic.ENTITY.NIC && sender !== $.logic.ENTITY.MAF) return;

                if (data.throw) {
                    this.state = this.STATE.THROWN;
                    this.dx = data.dx;
                    this.dy = data.dy;
                } else if (data.carry) {
                    this.attachedTo = data;
                    this.state = this.STATE.CARRIED;
                } else if (data.kick) {
                    this.state = this.STATE.KICKED;
                    this.dx = data.dx;
                    this.dy = data.dy;
                }
            },
            (tablet) => $.gfx.playAnimation(tablet.sprites[0], $.gfx.ANIMATION.TABLET)
        ).index;
    },
    newLadder: function (x, y, h, color = 0, on = null) {
        const sprites = [];
        for (let i = 0; i < h; i++) {
            sprites.push([x, y + (i * $.logic.TILE_SIZE), $.logic.TILE_SIZE, $.logic.TILE_SIZE, color ? on : true])
        }

        return this._newEntity(
            $.logic.ENTITY.LADDER,
            {
                on: on,
                color: color || 0,

                hitboxes: [[x, y, x + $.logic.TILE_SIZE, y + (h * $.logic.TILE_SIZE), false, color ? on : true]],
                sprites: sprites
            },
            null,
            function (sender, data = null) {
                if (data.switch_color !== this.color) {
                    return;
                }

                this.on = !this.on;

                $.physics.toggleHitboxActive(this.hitboxes[0], this.on);
                this.sprites.forEach(s => $.gfx.toggleDrawSprite(s, this.on));
            },
            (ladder) => ladder.sprites.forEach(sprite => $.gfx.playAnimation(
                sprite,
                $.gfx.ANIMATION.LADDER[color || 0]
            ))
        ).index;
    },
    newBlock: function (x, y, w, h, type, isDoor, color = null, on = null) {
        const sprites = [];
        for (let wi = 0; wi < w; wi++) {
            for (let hi = 0; hi < h; hi++) {
                sprites.push([x + (wi * $.logic.TILE_SIZE), y + (hi * $.logic.TILE_SIZE), $.logic.TILE_SIZE, $.logic.TILE_SIZE, on]);
            }
        }

        return this._newEntity(
            type,
            {
                on: on,
                color: color,
                sprites: sprites,
                hitboxes: [[x, y, x + (w * 32), y + (h * 32), true, on]],
                animations: isDoor ? [$.gfx.ANIMATION.DOOR[color]] : [$.gfx.ANIMATION.BRIDGE[color]]
            },
            null,
            function (sender, data = null) {
                if (data.switch_color !== this.color) {
                    return;
                }

                this.on = !this.on;

                $.physics.toggleHitboxActive(this.hitboxes[0], this.on);
                this.sprites.forEach(s => $.gfx.toggleDrawSprite(s, this.on));
            },
            (block) => {
                block.sprites.forEach(s => $.gfx.playAnimation(s, block.animations[0]));
            }
        ).index;
    },
    newPressurePlate: function (x, y, type, color) {
        return this._newEntity(
            type,
            {
                on: false,
                color: color,
                hitboxes: [[x, y + 16, x + 32, y + 32, false, true]],
                sprites: [[x, y, 32, 32, true]],
                animations: [$.gfx.ANIMATION.PRESSURE_PLATE[0][color], $.gfx.ANIMATION.PRESSURE_PLATE[1][color]]

            },
            function (dt) {
                const { entities } = $.physics.checkCollisions(this.tabletIndex ? this.hitboxes[1] : this.hitboxes[0]);

                if (entities.length) {
                    if (this.on) {
                        return;
                    }

                    this.on = true;

                    $.gfx.playAnimation(this.sprites[0], this.animations[1]);
                    $.sfx.chunk.play();
                    $.logic.sendEntityMessage(-1, this.index, { switch_color: this.color });
                } else {
                    if (!this.on) {
                        return;
                    }

                    this.on = false;

                    $.gfx.playAnimation(this.sprites[0], this.animations[0]);
                    $.sfx.chunk.play();
                    $.logic.sendEntityMessage(-1, this.index, { switch_color: this.color });
                }
            },
            null,
            (plate) => {
                $.gfx.playAnimation(plate.sprites[0], plate.animations[0]);
            }
        ).index;
    },
    newSwitch: function (x, y, type, color) {
        return this._newEntity(
            type,
            {
                state: 0,
                color: color,
                hitboxes: [[x, y, x + 32, y + 32, false, true]],
                sprites: [[x, y, 32, 32, true]],
                animations: [$.gfx.ANIMATION.SWITCH[0][color], $.gfx.ANIMATION.SWITCH[1][color]]
            },
            null,
            function (sender, data = null) {
                if (sender !== $.logic.ENTITY.NIC && sender !== $.logic.ENTITY.MAF) return;

                this.state = this.state === 0 ? 1 : 0;

                $.gfx.playAnimation(this.sprites[0], this.animations[this.state]);
                $.sfx.chunk.play();
                $.logic.sendEntityMessage(-1, this.index, { switch_color: this.color });
            },
            (switchEntity) => {
                $.gfx.playAnimation(switchEntity.sprites[0], switchEntity.animations[0]);
            }
        ).index;
    },
    newFlag: function (x, y) {
        return this._newEntity(
            $.logic.ENTITY.FLAG,
            {
                sprites: [
                    [x, y, 32, 32, true],
                    [x, y + 32, 32, 32, true]
                ],
                hitboxes: [
                    [
                        x,
                        y - 32,
                        x + 32,
                        y + 64,
                        false,
                        true
                    ]
                ],
            },
            function (dt) {
                const { entities } = $.physics.checkCollisions(this.hitboxes[0]);

                if (entities.length < 3) return;

                if (entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.NIC) &&
                    entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.MAF) &&
                    entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.TABLET)) {
                    $.logic.loadMap();
                }
            },
            null,
            (flag) => {
                $.gfx.playAnimation(flag.sprites[0], $.gfx.ANIMATION.FLAG_FLAP);
                $.gfx.playAnimation(flag.sprites[1], $.gfx.ANIMATION.FLAG_POLE);
            }
        ).index
    },
    newEnemy: function (x, y, type) {
        return this._newEntity(
            type,
            {

                oldDx: 0,
                dy: 0,
                sprites: [
                    [x, y, 32, 32, true],
                    [x, y + 32, 32, 32, true]
                ],
                hitboxes: [
                    [
                        x + 8,
                        y + 4,
                        x + 32 - 8,
                        y + 64,
                        false,
                        true
                    ]
                ],
                lastHit: null,
            },
            function (dt) {
                $.entities.moveEntity(this, this.dx * dt, this.dy * dt);

                const { entities, solidCollisions } = $.physics.checkCollisions(this.hitboxes[0]);

                const { hitWall } = $.entities.handleSolidCollisions(this, solidCollisions);

                const nic = entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.NIC);
                if (nic && !$.logic.sendEntityMessage(nic, this.type)) {
                    $.sfx.hurt.play();
                    $.promptLevelRestart();
                    return;
                }

                const maf = entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.MAF);
                if (maf && !$.logic.sendEntityMessage(maf, this.type)) {
                    $.sfx.hurt.play();
                    $.promptLevelRestart();
                    return;
                }

                const stop = entities.find(x => $.logic.getEntityType(x) === $.logic.ENTITY.ENEMY_STOP);

                const hit = nic || maf || stop;

                if (this.dx) {
                    this.oldDx = this.dx;
                }

                if ((nic || maf) && stop) {
                    this.dx = 0;
                    return;
                }

                this.dx = this.dx || this.oldDx;

                if (hit && hit !== this.lastHit) {
                    this.lastHit = hit;
                    this.dx = -this.dx;
                    $.gfx.playAnimation(this.sprites[0], this.dx < 0 ? $.gfx.ANIMATION.ENEMY_TOP_LEFT : $.gfx.ANIMATION.ENEMY_TOP_RIGHT);
                    $.gfx.playAnimation(this.sprites[1], this.dx < 0 ? $.gfx.ANIMATION.ENEMY_BOTTOM_LEFT : $.gfx.ANIMATION.ENEMY_BOTTOM_RIGHT);
                }
            },
            null,
            (enemy) => {
                $.gfx.playAnimation(enemy.sprites[0], enemy.dx < 0 ? $.gfx.ANIMATION.ENEMY_TOP_LEFT : $.gfx.ANIMATION.ENEMY_TOP_RIGHT);
                $.gfx.playAnimation(enemy.sprites[1], enemy.dx < 0 ? $.gfx.ANIMATION.ENEMY_BOTTOM_LEFT : $.gfx.ANIMATION.ENEMY_BOTTOM_RIGHT);
            }
        ).index;
    },
    newEnemyStop: function (x, y) {
        return this._newEntity(
            $.logic.ENTITY.ENEMY_STOP,
            {
                hitboxes: [
                    [
                        x,
                        y,
                        x + 32,
                        y + 32,
                        false,
                        true
                    ]
                ],
            }
        ).index
    },
};

    <script>"use strict";

$.lastFrameTimestamp = 0;
$.run = false;
$.levelRestart = false;

$.init = function() {
    $.gfx.init(800, 600)
    .then(() => $.input.init())
    .then(() => $.physics.init(100))
    .then(() => $.logic.init())
    .then(() => $.loop());
};

$.loop = function() {
    const dt = $.dt(Date.now());

    $.input.update(dt);

    if ($.run) {
        if ($.levelRestart) {
            $.levelRestart = false;
            $.logic.loadMap(-1);
            $.showText();
        }

        $.logic.update(dt);
        $.gfx.update(dt);
    } else if ($.input.anyKeyPressed) {
        $.run = true;
    }

    window.requestAnimFrame($.loop);
};

$.promptLevelRestart = function() {
    $.run = false;
    $.levelRestart = true;
    $.showText('restart-prompt', true);
};

$.showText = function(toDisplay, clear = false) {
    if (clear) {
        $.gfx.clear();
    }

    document.getElementById('start-prompt').style.display = toDisplay === 'start-prompt' ? 'block' : 'none';
    document.getElementById('restart-prompt').style.display = toDisplay === 'restart-prompt' ? 'block' : 'none'

    if (toDisplay === 'end-game-text') {
        document.getElementById('end-game-text-1').style.display = 'block';
        document.getElementById('end-game-text-2').style.display = 'block';
    } else {
        document.getElementById('end-game-text-1').style.display = 'none';
        document.getElementById('end-game-text-2').style.display = 'none';
    }
};


$.dt = function(timestamp) {
    const delta = timestamp - $.lastFrameTimestamp;
    $.lastFrameTimestamp = timestamp;
    
    if (delta === timestamp || delta > 500) {
        return 0;
    }

    return delta / 1000;
};

window.addEventListener('load', $.init, false);
window.addEventListener('click', () => {
    if (!$.run) {
        $.run = true;
    }
});
