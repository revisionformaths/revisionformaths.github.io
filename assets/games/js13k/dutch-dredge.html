<!DOCTYPE html>
<html>
<head>
	<title>Dutch Dredge</title>
	
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<!-- Added id P so we can reference it globally in JavaScript -->
	<style id="P"></style>
</head>
<body>
<h2>Dutch Dredge</h2>
Your job is to get rid of all the water.
<p id="R">Stuck? Click here to reset the level</p>

<!-- Added id W so we can reference it globally in JavaScript -->
<div id="W">
</div>


<!-- Globally used utils -->
<script>// P is the id of the <style> tag (elements with an ID are globally accesable)
// we're using it as a dummy when we can't find a requested cell
P.b=P.f=0;

/**
 * @param {string} className
 * @returns {Element}
 */
function createDiv(className) {

	var div = document.createElement('div');
	div.className = className;

	return div;
}

/**
 * @param {int} x
 * @param {int} y
 * @returns {Element}
 */
function getCell(x,y){

	return _cells.filter(function(cellEl){
		return cellEl.x == x && cellEl.y == y
	})[0] || P
}

/**
 * @param {Element} cellEl
 */
function hideCell(cellEl) {

	hoverCell(cellEl);

	// h is the hitField element corresponding with this cell
	cellEl.h.classList.add('no');

	// s stands for 'shown' so we can check whether or not this cell is in the level
	cellEl.s = cellEl.style.opacity = 0;
}

/**
 * @param {Element} cellEl
 */
function showCell(cellEl, delay) {

	cellEl.f = 0;
	cellEl.classList.remove(CSS_CLASS + CSS_CLASS);

	// h is the hitField element corresponding with this cell
	cellEl.h.classList.remove('no');

	setTimeout(function(){

		// s stands for 'shown' so we can check whether or not this cell is in the level
		cellEl.s = cellEl.style.opacity = 1;
		idleCell(cellEl);
		new Audio('hover.mp3').play();
	}, delay);


	return cellEl
}

/**
 * @param {Element} cellEl
 */
function hoverCell(cellEl) {

	cellEl.classList.add(CSS_CLASS);
}

/**
 * @param {Element} cellEl
 */
function idleCell(cellEl) {
	cellEl.opacity = 1;
	cellEl.classList.remove(CSS_CLASS);
}

/**
 * @param {Element} cellEl
 */
function flipCell(cellEl) {

	// f stands for flipped.
	var method = (cellEl.f = !cellEl.f) ? 'add' : 'remove';
	cellEl.classList[method](CSS_CLASS + CSS_CLASS);
}

/**
 * @param {Boolean} isResetAndCell
 */
function newLevel(isResetAndCell) {

	R.classList.remove('v');

	// isResetAndCell is used twice so we don't have to waste 4 chars declaring a local 'var '
	if(!isResetAndCell) {

		// start is a 36 character strings which hide, show and flip the cells for the start of a level
		_isPlaying = _start = levels.shift() || randomLevel();

		_cells.forEach(hideCell);
	}

	_counter = 0;

	for (_y = 0; _y < _start.length; _y++) {

		if ((_x = _start[_y]) != ' ') {

			isResetAndCell = showCell(_cells[_y], 300 + _y*20);

			if(+_x) {
				flipCell(isResetAndCell);
			}
		}
	}
}

/**
 *
 */
function checkSolution() {


	for(var i = 0; i < _cells.length; i++) {


		if(_start[i] != ' ' && _cells[i].f != '0') {

			if(_counter++ > 7) {

				R.classList.add('v');
			}

			return
		}
	}

	celebrate();
}

function celebrate() {

	_x = _isPlaying = 0;
	R.classList.remove('v');

	for(_x; _x < _cells.length; _x++) {


		_y = _cells[_x];

		if(_y.s) {

			liftCell(_y, _x * 20);
		}
	}

	// 1200 is the total delay of all the timeouts from liftCell. _x *20 is the biggest delay from the loop.
	// it's ugly, I know... Nobody said it was going to be pretty
	setTimeout(newLevel, 1200 + _x * 20);

	function liftCell(cellEl, delay) {

		setTimeout(function() {

			// wait until we have lowered the last clicked tiles
			idleCell(cellEl);

			setTimeout(function() {

				// lift all the cells with a little delay
				hoverCell(cellEl);
				new Audio('hover.mp3').play();

				setTimeout(function() {

					// lower and fade out all the cells
					idleCell(cellEl);
					cellEl.style.opacity = 0;

				}, 300);
			}, delay + 300);
		}, 300);
	}
}

function randomLevel() {


	for(_x='',_y=0;_y<36;_y++){
		_x+=Math.round(Math.random());
	}

	return _x;
}</script>

<!-- gridCreator adds all the cells to the DOM -->
<script>var // this is the generic transform for the _cells, values A,B and C are dynamically replaced later
	TRANSFORM = 'rotateX(-25deg) rotateY(-45deg) translate3d(Apx,Bpx,0) rotateX(Cdeg)',
	CSS_CLASS = 'cssClass',
	appendChild = 'appendChild',
	_hoverSound = new Audio('hover.mp3'),
	_clickSound = new Audio('click.mp3'),
	_isPlaying = 1,
	_counter,
	_start,
	_cells = [],
	_i=0,
	_j;


// 6 is a magic number representing the max number of cells on each sides
for(_i; _i < 6; _i++) {

	for(_j = 0; _j < 6; _j++) {

		createCell(_i,_j);
	}
}


function createCell(x,y) {

	var sides = [
			'surface top','surface bottom',
			'surface right',
			'surface front','surface back',

			'water top', 'water bottom',
			'water left', 'water right',
			'water front', 'water back'
		],
		className = CSS_CLASS + x + y,

	// W is a reference to the wrapper div in the HTML file
		hitfieldEl = W[appendChild](createDiv('cube ' + className)),
		animationEl = W[appendChild](createDiv('y'+ y + ' cube no ' + className));

	animationEl.h = hitfieldEl;
	hitfieldEl.x = animationEl.x = x;
	hitfieldEl.y = animationEl.y = y;



	// P is the id of the <style> tag (elements with an ID are globally accessible)
	P.innerHTML+=

		// hitfield
		'.' + className +'{transform:'+composeTransform(hitfieldEl,1)+'}'+

			// normal
		'.' + className + '.no{transform:'+composeTransform(hitfieldEl)+'}'+

			// flipped
		'.' + className + '.'+CSS_CLASS+CSS_CLASS+'.no{transform:'+composeTransform(hitfieldEl,0,1)+'}'+

			// flipped hover
		'.' + className + '.'+CSS_CLASS+CSS_CLASS+'.'+CSS_CLASS+'.no{transform:'+composeTransform(hitfieldEl,1,1)+'}'+

			// normal hover
		'.' + className + '.' + CSS_CLASS+'.no{transform:'+composeTransform(hitfieldEl,1)+'}';


	sides.forEach(function(side){

		animationEl[appendChild](createDiv(side))
	});


	hitfieldEl.innerHTML = animationEl.innerHTML;

	hitfieldEl.addEventListener('mouseover',onMouseOver);
	hitfieldEl.addEventListener('mouseout', onMouseOut);
	hitfieldEl.addEventListener('click', onClick);
	hitfieldEl.addEventListener('touchend', onClick);

	_cells.push(animationEl);
}

function onClick(e) {

	e.preventDefault();

	cellsAction(getCell(this.x,this.y), flipCell);

	if(_isPlaying) {
		_clickSound.play();
	}
	checkSolution();
}

function onMouseOver() {

	if(_isPlaying) {
		_hoverSound.play();
	}
	cellsAction(getCell(this.x,this.y), hoverCell);
}

function onMouseOut() {

	cellsAction(getCell(this.x,this.y), idleCell);
}

function cellsAction(cell, method) {

	if(cell.s && _isPlaying) {

		method(getCell(cell.x,cell.y));
		method(getCell(cell.x-1,cell.y));
		method(getCell(cell.x+1,cell.y));
		method(getCell(cell.x,cell.y-1));
		method(getCell(cell.x,cell.y+1));
	}
}


function composeTransform(cell, isHover, isFlipped) {

	var B = cell.y * 39;

	if(isHover) {

		B -= 10;
	}

	// these numbers are all magic numbers to make the cells fit our grid system
	return TRANSFORM.replace('A', cell.x * 59.5 - cell.y * 59)

		// multiplying with a boolean makes it go '* 1' for true or '* 0' for false
		.replace('B', B)
		.replace('C', !!isFlipped * 180);
}</script>

<!-- Level handling -->
<script>var levels = [

	'      '+
	' 1111 '+
	' 1111 '+
	' 1111 '+
	' 1111 '+
	'      '
	,

	'      '+
	' 0111 '+
	' 1111 '+
	' 0100 '+
	'      '+
	'      '
	,

	'      '+
	' 0001 '+
	' 0010 '+
	' 0100 '+
	' 1000 '+
	'      '
	,

	'      '+
	' 1100 '+
	' 1110 '+
	' 0111 '+
	' 0011 '+
	'      '
	,

	'010010'+
	'111111'+
	'010010'+
	'010010'+
	'111111'+
	'010010'
	,

	'111111'+
	'110010'+
	'110001'+
	'100011'+
	'010011'+
	'111111',

	'100001'+
	'011110'+
	'010010'+
	'010010'+
	'011110'+
	'100001'
	,

	'101110'+
	'011001'+
	'011101'+
	'010111'+
	'111111'+
	'010010'

];

// because 'click' event has a MouseEvent parameter 'newLevel' will think it has the 'isReset' Boolean
R.addEventListener('click', newLevel);

newLevel();</script>
