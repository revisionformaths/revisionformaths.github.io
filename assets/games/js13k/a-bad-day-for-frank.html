    var offsetX = $.util.randomIntInRange(1,199);
    var offsetY = $.util.randomIntInRange(1,124);
    while (offsetY === parseInt($.map_y + $.player.y/20) && offsetX === parseInt($.map_x + $.player.x/20)) {
        offsetX = $.util.randomIntInRange(1,199);
        offsetY = $.util.randomIntInRange(1,124);
    }

    if ($.map.getData(offsetX, offsetY) != $.gray) {

       $.map.setData(offsetX, offsetY, $.util.pickRandomFromObject($.colors));
   }

    $.entities = [];

window.addEventListener('keyup',   function(ev) { return onkey(ev, ev.keyCode, false); }, false);

function onkey(ev, key, down) {
    var KEY = { SPACE: 32, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, X: 88 };

  switch(key) {
    case KEY.LEFT:  controls.left  = down; return false;
    case KEY.RIGHT: controls.right = down;  return false;
    case KEY.UP: controls.up  = down; return false;
    case KEY.DOWN: controls.down  = down; return false;
    case KEY.SPACE: controls.space = down; return false;
    case KEY.X: controls.x = down; return false;
  }

        <script>"use strict";

$.util = {};

window.requestAnimFrame = (function(){
    return window.requestAnimationFrame ||
    window.webkitRequestAnimationFrame || 
    window.mozRequestAnimationFrame    || 
    window.oRequestAnimationFrame      || 
    window.msRequestAnimationFrame     || 
    function( callback ){
        window.setTimeout(callback, 1000 / 60);
    };
})();


$.util.randomInRange= function (min, max) {
    return Math.random() * ( max - min ) + min;
};

$.util.randomIntInRange= function (min, max) {
    return Math.floor( Math.random() * ( max - min ) + min);
};

$.util.pickRandomFromObject = function (obj) {
    var keys = Object.keys(obj)
    return obj[keys[ keys.length * Math.random() << 0]];
};

$.util.rndSeed = function(s) {
    return function() {
        s = Math.sin(s) * 10000; return s - Math.floor(s);
    };
};


$.util.bound = function(x, min, max) {
    return Math.max(min, Math.min(max, x));
};
</script>

$.RandomObj = function (x, y) {
    this.x = x; // $.util.randomInRange(0, $.width);

    this.dimension = 40;

        <script>"use strict";

$.Player = function(x1, y1) {
    this.x = x1;
    this.y = y1;
    this.color = 'rgba(3, 3, 3, 1)';
    this.diameter = 10;
    this.dimension = 10;
    this.targetDimension = 6;
    this.growthSpeed = 1;
    this.left = false;
    this.right = false;
    this.jump = false;
    this.direction = 0;
    this.accel = 2;
};


$.Player.prototype.render = function () {
    $.Draw.rect(this.x-4, this.y-4, this.dimension, this.dimension, this.color);

};

$.Player.prototype.localGlitch = function () {

    var offsetX = $.util.randomIntInRange(-5,5);
    var offsetY = $.util.randomIntInRange(-5,5);
    while (offsetY === 0 && offsetX === 0) {
        offsetY = $.util.randomIntInRange(-5,5);
        offsetX = $.util.randomIntInRange(-5,5);
    }
    if ($.map.getData($.map_x + parseInt(this.x/20) + offsetX, $.map_y + parseInt(this.y/20) + offsetY) != $.gray) {
        $.map.setData($.map_x + parseInt(this.x/20) + offsetX, $.map_y + parseInt(this.y/20) + offsetY, $.util.pickRandomFromObject($.colors));
    }   
};

$.Player.prototype.update = function () {
    var newX = this.x;
    var newY = this.y; 

    if (controls.left) {
      // collision
        newX -= this.accel;
    }
    else if (controls.right) {
        newX += this.accel;
    }
    else if (controls.up) {
        newY -= this.accel;
    }
    else if (controls.down) {
        newY += this.accel;
    }
    else if (controls.x && $.quest_state > 0) {
        this.localGlitch();
    }

    if ($.map.isSolid($.map.getDataFromPixel(newX-5, newY-5)) || $.map.isSolid($.map.getDataFromPixel(newX+5, newY+5)) ||
        $.map.isSolid($.map.getDataFromPixel(newX-5, newY+5)) || $.map.isSolid($.map.getDataFromPixel(newX+5, newY-5))
        ){
        
    }
    else {
        this.x = newX;
        this.y = newY;
    }
        if ($.hermit_chat === 0 && ($.red === $.map.getDataFromPixel(newX-5, newY-5) || $.red === $.map.getDataFromPixel(newX+5, newY+5) ||
            $.red === $.map.getDataFromPixel(newX-5, newY+5) || $.red === $.map.getDataFromPixel(newX+5, newY-5))) {
            //death
            document.getElementById('death').innerHTML = "Frank was brutally absorbed by the red sludge.<br />A few days later, the glitching stopped and normal living resumed - except for Frank, who was dead.";
            $.stop = true;

        }
    if (this.x < 0) {
        this.x += 40*20;
        $.map_x -= 40;
    }
    else if (this.x > 40*20) {
        this.x -= 40*20;
        $.map_x += 40;
    }

    if (this.y < 0) {
        this.y += 25*20;
        $.map_y -= 25;

    }
    else if (this.y > 25*20) {
        this.y -= 25*20;
        $.map_y += 25;
    }

};

</script>

$.Npcs = function() {
    this.list = [];
    this.npcs = 0;
    this.color = 'rgba(3, 3, 3, 1)';
    this.dimension = 10;
};

$.Npcs.prototype.addNpc = function (name, x, y) {
    this.list.push({name:name, x:x,y:y});
    this.npcs++;

};
$.Npcs.prototype.render = function () {
    

    for (var i=0; i<this.npcs; i++) {
        if (this.list[i].x > $.map_x && this.list[i].x < $.map_x+40 &&
            this.list[i].y > $.map_y && this.list[i].y < $.map_y+25) {
            $.Draw.rect((this.list[i].x-$.map_x)*20+5, (this.list[i].y-$.map_y)*20+5, this.dimension, this.dimension, this.color);
        }
    }
};

$.Npcs.prototype.overlap = function () {
    

    for (var i=0; i<this.npcs; i++) {
        if (this.list[i].x > $.map_x && this.list[i].x < $.map_x+40 &&
            this.list[i].y > $.map_y && this.list[i].y < $.map_y+25) {
            if (Math.abs($.player.x-15 - (this.list[i].x-$.map_x)*20+5) < 10 &&
                Math.abs($.player.y-15 - (this.list[i].y-$.map_y)*20+5) < 10) {
                return this.list[i].name;
            }
        }
    }
    return "noone";
};


$.Npcs.prototype.update = function () {
    for (var i=0; i<this.npcs; i++) {
        $.map.setData(this.list[i].x, this.list[i].y, $.colors["yellow"]);
    }

};

    return this.getData($.map_x + parseInt(x/$.TILE_SIZE),$.map_y + parseInt(y/$.TILE_SIZE));
}

            $.Draw.rectFill((i-x)*$.TILE_SIZE, (j-y)*$.TILE_SIZE, $.TILE_SIZE, $.TILE_SIZE, this.getData(i, j));
 
        }
    }

};

$.Map.prototype.isSolidAt = function (x,y) {
    return this.isSolid(this.getData(parseInt(x/20),parseInt(y/20)));
}

$.Map.prototype.isSolid = function (col) {
    return (col === $.colors["nightblue"] ||
           col === $.colors["darkbrown"] ||
           col === $.colors["purple"] ||
           col == $.gray ||
           col === $.colors["darkgreen"]);
};

$.Map.prototype.tile2pixel = function (x,y) {
    return [(x%40)*TILE_SIZE, (y%25)*TILE_SIZE];
};

$.Map.prototype.clamp = function (x,y) {
    return [parseInt(x/TILE_SIZE)*TILE_SIZE, parseInt(y/TILE_SIZE)*TILE_SIZE];
};

};

            this.list[i].fade -= 0.5;

        <script>"use strict";


$.Quests = function() {
    this.list = [];
    this.quests = 0;
};


$.Quests.prototype.addQuest = function (id, text, x, y) {
    this.list.push({id:id, text:text, x:x,y:y,complete:false,fade:100});
    this.quests++;

};
$.Quests.prototype.render = function () {
    var buffer = "<ul>";
    for (var i=0; i<this.quests; i++) {
        if( this.list[i].fade > 0) {
            buffer += "<li style='color: " + $.colors["pink"] + "; opacity:" + this.list[i].fade/100 + ";'>" + this.list[i].text + "</li>";
        }
    }
    buffer += "</ul>";
    document.getElementById('quests').innerHTML = buffer;
    
};

$.Quests.prototype.getAll = function () {
    return this.list;
};


$.Quests.prototype.complete = function (id) {
    for (var i=0; i<this.quests; i++) {
        if(this.list[i].id == id) {
            this.list[i].complete = true;
        }
    }
};

$.Quests.prototype.update = function (id) {
    for (var i=0; i<this.quests; i++) {
        if (this.list[i].complete && this.list[i].fade > 0) {
            this.list[i].fade -= 0.5;
        }
    }
};
