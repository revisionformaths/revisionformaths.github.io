    <script>onresize = function () {
    var mw = innerWidth,
        mh = innerHeight,

        ar = mw / mh, // available ratio
        br = 1.2, // base ratio
        w,
        h,
        s = document.querySelector('#in').style;

    if (ar <= br) {
        w = mw;
        h = w / br;
    } else {
        h = mh;
        w = h * br;
    }

    s.width = w + 'px';
    s.height = h + 'px';
}

    <script>
let dot = (v1, v2) => {
    return v1[0] * v2[0] + v1[1] * v2[1]
}

let scale = (t , v) => {
    return [v[0] * t, v[1] * t]
}

let normalization = (v) => {
    let t = Math.sqrt(dot(v, v))
    return scale(t, v)
}

let distance = (v1, v2) =>{
    let v = minus(v1, v2)
    return Math.sqrt(dot(v,v))
}

let minus = (v1, v2) => {
    return [v2[0] - v1[0], v2[1] - v1[1]]
}

let plus = (v1, v2) => {
    return [v1[0] + v2[0], v1[1] + v2[1]]
}

let randomRange = (n1, n2)=>{
    if(n1 > n2) throw new Error(`n1-${n1} must bigger than n2-${n2}`)

    let dis = n2 - n1
    return n1 + Math.floor(Math.random()*dis)
}</script>
    <script>
class ContactPlane {
    constructor(e1Index, e2Index) {
        this.nc = [0, 0]
        this.gc = 0
        this.dis = 0

        this.f = [0, 0]

        this.rV = [0, 0]
        this.inD = [0, 0]

        this.isContact = false
        this.isBound = false
        this.element1Index = e1Index
        this.element2Index = e2Index
    }
}


class Rectangle {
    constructor(ltx, lty, w, h, vx, vy, density) {
        this.mass = w * h * density
        this.invm = 1 / this.mass

        this.pos = [
            ltx + w * 0.5,
            lty + h * 0.5
        ]

        this.lt = [ltx, lty]

        this.rd = [
            ltx + w,
            lty + h
        ]

        this.len = { w, h }

        this.f = [0, 0]

        this.v = [vx, vy]
    }
}

class Contact {
    constructor(group1Index, group2Index, kn, pkn) {
        this.kn = kn
        this.pkn = pkn
        this.group1Index = group1Index
        this.group2Index = group2Index
        this.contactPlanes = {

        }
    }
}   

class Group {
    constructor(name, density, damp, isRigid) {
        this.isRigid = isRigid
        this.damp = damp
        this.density = density
        this.name = name
        this.elements = []
        this.bc = [0, 0]
        this.snapshots = []
    }
}

    <script>class Hero extends Rectangle {
    constructor(ltx, lty, w, h, vx, vy, density, hp, atk) {
        super(ltx, lty, w, h, vx, vy, density)

        this.face = 1
        this.canJump = false
        this.isSuper = false
        this.canBack = false
        this.hp = hp
        this.maxHp = hp
        this.atk = atk
    }
}

class Enemy extends Rectangle {
    constructor(ltx, lty, w, h, vx, vy, density, skin, hp, atk, id) {
        super(ltx, lty, w, h, vx, vy, density)
        this.id = id
        this.face = 1
        this.canMove = true
        this.skin = skin
        this.hp = hp
        this.maxHp = hp
        this.atk = atk
    }
}

class Boss extends Rectangle {
    constructor(ltx, lty, w, h, vx, vy, density, hp, atk) {
        super(ltx, lty, w, h, vx, vy, density)
        this.hp = hp
        this.maxHp = hp
        this.atk = atk


        this.skill = {
            canDestory: false,
            canSummon: false
        }
    }
}

class Ground extends Rectangle {
    constructor(ltx, lty, w, h, vx, vy, density) {
        super(ltx, lty, w, h, vx, vy, density)

        this.stones = []
        let num = stoneConfig.den * w * h
        let space = stoneConfig.space
        for (let i = 0; i < num; i++) {
            let x = Math.random() * (w - 20)
            let y = Math.random() * (h - 40)

            let type = Math.floor(Math.random() * 5)

            switch (type) {
                case 0:
                case 1:
                    this.stones.push(
                        [x, y]
                    )
                    break;
                case 2:
                    this.stones.push(
                        [x, y], [x + space, y], [x, y + space], [x + space, y + space]
                    )
                    break;
                case 3:
                    this.stones.push(
                        [x, y], [x + space, y]
                    )
                    break;
                case 4:
                    this.stones.push(
                        [x, y], [x + space, y], [x + space * 2, y]
                    )
            }
        }
    }
}

    constructor(ltx, lty, w, h, vx, vy, density, face) {
        super(ltx, lty, w, h, vx, vy, density)
        this.face = face

    }

}

    shootAudio.stop()

        switch (type) {
            case 0:
                sky.push(
                    [x, y],
                    [x + space, y + space],
                    [x - space, y + space],
                    [x, y + 2 * space]
                )
                break;
            case 1:
                sky.push(
                    [x, y]
                )
                break;
            case 2:
                sky.push(
                    [x, y], [x - space, y + space], [x, y + space], [x + space, y + space], [x, y + 2 * space]
                )
        }
    }

    verlet()

let disMax = 0.5
let disMin = -0.5

let verlet = () => {
    for (let key in groups) {
        let group = groups[key]

        if (group.isRigid) {
            for(let i in group.elements){

                let e = group.elements[i]
                
                let dis = scale(dt, e.v)

                if (e.lt[0] + dis[0] > bound.lX && e.rd[0] + dis[0] < bound.uX) {
                    e.pos[0] += dis[0]
                    e.lt[0] += dis[0]
                    e.rd[0] += dis[0]
                }

                if (e.lt[1] + dis[1] > bound.lY && e.rd[1] + dis[1] < bound.uY) {
                    e.pos[1] += dis[1]
                    e.lt[1] += dis[1]
                    e.rd[1] += dis[1]
                }
            }
        }   
        else {
            for (let i in group.elements) {
                let e = group.elements[i]

                e.v = scale(group.damp, e.v)

                let dmpInfluence = 1 - group.damp

                e.v[0] += (e.f[0] * e.invm) * dmpInfluence * dt
                e.v[1] += (e.f[1] * e.invm + gravity * e.mass) * dmpInfluence * dt

                let dis = scale(dt, e.v)

                if (dis[0] > disMax) {
                    dis[0] = disMax
                } else if (dis[0] < disMin) {
                    dis[0] = disMin
                }

                if (dis[1] > disMax) {
                    dis[1] = disMax
                } else if (dis[1] < disMin) {
                    dis[1] = disMin
                }

                if (e.lt[0] + dis[0] > bound.lX && e.rd[0] + dis[0] < bound.uX) {
                    e.pos[0] += dis[0]
                    e.lt[0] += dis[0]
                    e.rd[0] += dis[0]
                }

                    e.pos[1] += dis[1]
                    e.lt[1] += dis[1]
                    e.rd[1] += dis[1]
                }

            }
        }
    }
}

    if (contactPlane.isBound) {

        contactPlane.rV = minus(e2.v, e1.v)
        contactPlane.inD = plus(contactPlane.inD, scale(dt, contactPlane.rV))

        contactPlane.f = plus(contactPlane.f, scale(contact.pkn, contactPlane.inD))
    }

}

let receiveForce = () => {
    for (let key in difGupContacts) {
        let contact = difGupContacts[key]

        let group1 = groups[contact.group1Index]
        let group2 = groups[contact.group2Index]
        for (let i in contact.contactPlanes) {
            let contactPlane = contact.contactPlanes[i]
            if (!contactPlane.isContact) continue

            let e1 = group1.elements[contactPlane.element1Index]
            let e2 = group2.elements[contactPlane.element2Index]

            e1.f = minus(contactPlane.f, e1.f)
            e2.f = plus(contactPlane.f, e2.f)

        }
    }

    for (let key in sameGupContacts) {
        let contact = sameGupContacts[key]

        let group = groups[contact.group1Index]
        for (let i in contact.contactPlanes) {
            let contactPlane = contact.contactPlanes[i]
            if (!contactPlane.isContact && !contactPlane.isBound) continue

            let e1 = group.elements[contactPlane.element1Index]
            let e2 = group.elements[contactPlane.element2Index]

            e1.f = minus(contactPlane.f, e1.f)
            e2.f = plus(contactPlane.f, e2.f)
        }
    }

}

let resetForce = () => {
    for (let key in groups) {
        let group = groups[key]

        for (let i in group.elements) {
            group.elements[i].f = [0, 0]
        }
    }
}

let renderSkin = (e, skin, sw, sh) => {

    let priority = skin.priority
    if (e.face === 1) {
        for (let i in priority) {
            let part = skin[priority[i]]

            for (let key in part) {
                let draw = part[key]

                ctx.fillStyle = draw.color
                draw.points.forEach((p) => {
                    if (Array.isArray(p[0])) {
                        for (let j = p[0][0]; j <= p[1][0]; j++) {
                            for (let k = p[0][1]; k <= p[1][1]; k++) {
                                ctx.fillRect(
                                    e.lt[0] + j * sw - vx,
                                    e.lt[1] + k * sh,
                                    sw + 1,
                                    sh + 1
                                )
                            }

                        ctx.fillRect(
                            e.lt[0] + p[0] * sw - vx,
                            e.lt[1] + p[1] * sh,
                            sw + 1,
                            sh + 1
                        )
                    }
                })
            }
        }
    }
    else {
        for (let i in priority) {
            let part = skin[priority[i]]

            for (let key in part) {
                let draw = part[key]

                ctx.fillStyle = draw.color

                let len = e.len.w / sw
                draw.points.forEach((p) => {
                    if (Array.isArray(p[0])) {
                        for (let j = len - p[1][0]; j <= len - p[0][0]; j++) {
                            for (let k = p[0][1]; k <= p[1][1]; k++) {
                                ctx.fillRect(
                                    e.lt[0] + j * sw - vx,
                                    e.lt[1] + k * sh,
                                    sw,
                                    sh
                                )
                            }
                        }
                    } else {
                        ctx.fillRect(
                            e.lt[0] + (len - p[0]) * sw - vx,
                            e.lt[1] + p[1] * sh,
                            sw,
                            sh
                        )
                    }
                })
            }
        }
    }

}
