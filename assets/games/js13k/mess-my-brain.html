var sonantx;
(function() {
"use strict";
sonantx = {};

var WAVE_SPS = 44100;                    // Samples per second
var WAVE_CHAN = 2;                       // Channels
var MAX_TIME = 33; // maximum time, in millis, that the generator can use consecutively

var audioCtx = null;

// Oscillators
function osc_sin(value)
{
    return Math.sin(value * 6.283184);
}

function osc_square(value)
{
    if(osc_sin(value) < 0) return -1;
    return 1;
}

function osc_saw(value)
{
    return (value % 1) - 0.5;
}

function osc_tri(value)
{
    var v2 = (value % 1) * 4;
    if(v2 < 2) return v2 - 1;
    return 3 - v2;
}

// Array of oscillator functions
var oscillators =
[
    osc_sin,
    osc_square,
    osc_saw,
    osc_tri
];

function getnotefreq(n)
{
    return 0.00390625 * Math.pow(1.059463094, n - 128);
}

function genBuffer(waveSize, callBack) {
    setTimeout(function() {
        // Create the channel work buffer
        var buf = new Uint8Array(waveSize * WAVE_CHAN * 2);
        var b = buf.length - 2;
        var iterate = function() {
            var begin = new Date();
            var count = 0;
            while(b >= 0)
            {
                buf[b] = 0;
                buf[b + 1] = 128;
                b -= 2;
                count += 1;
                if (count % 1000 === 0 && (new Date() - begin) > MAX_TIME) {
                    setTimeout(iterate, 0);
                    return;
                }
            }
            setTimeout(function() {callBack(buf);}, 0);
        };
        setTimeout(iterate, 0);
    }, 0);
}

function applyDelay(chnBuf, waveSamples, instr, rowLen, callBack) {
    var p1 = (instr.fx_delay_time * rowLen) >> 1;
    var t1 = instr.fx_delay_amt / 255;

    var n1 = 0;
    var iterate = function() {
        var beginning = new Date();
        var count = 0;
        while(n1 < waveSamples - p1)
        {
            var b1 = 4 * n1;
            var l = 4 * (n1 + p1);

            // Left channel = left + right[-p1] * t1
            var x1 = chnBuf[l] + (chnBuf[l+1] << 8) +
                (chnBuf[b1+2] + (chnBuf[b1+3] << 8) - 32768) * t1;
            chnBuf[l] = x1 & 255;
            chnBuf[l+1] = (x1 >> 8) & 255;

            // Right channel = right + left[-p1] * t1

                (chnBuf[b1] + (chnBuf[b1+1] << 8) - 32768) * t1;
            chnBuf[l+2] = x1 & 255;
            chnBuf[l+3] = (x1 >> 8) & 255;
            ++n1;
            count += 1;
            if (count % 1000 === 0 && (new Date() - beginning) > MAX_TIME) {
                setTimeout(iterate, 0);
                return;
            }

        setTimeout(callBack, 0);
    };

                               68,172,0,0,16,177,2,0,4,0,16,0,100,97,116,97,
                               l2 & 255,(l2 >> 8) & 255,(l2 >> 16) & 255,(l2 >> 24) & 255);
    b = 0;
    while(b < waveBytes)
    {

        // larger partial strings
        x = "";
        for (k = 0; k < 256 && b < waveBytes; ++k, b += 2)
        {

            y = 4 * (mixBuf[b] + (mixBuf[b+1] << 8) - 32768);

    var waveSize = this.waveSize;

    var buffer = audioCtx.createBuffer(WAVE_CHAN, this.waveSize, WAVE_SPS); // Create Mono Source Buffer from Raw Binary

    var rchan = buffer.getChannelData(1);
    var b = 0;
    var iterate = function() {
        var beginning = new Date();
        var count = 0;
        while (b < waveSize) {
            var y = 4 * (mixBuf[b * 4] + (mixBuf[(b * 4) + 1] << 8) - 32768);
            y = y < -32768 ? -32768 : (y > 32767 ? 32767 : y);
            lchan[b] = y / 32768;
            y = 4 * (mixBuf[(b * 4) + 2] + (mixBuf[(b * 4) + 3] << 8) - 32768);

            b += 1;
            count += 1;

                return;

sonantx.SoundGenerator = function(instr, rowLen) {
    this.instr = instr;
    this.rowLen = rowLen || 5605;

    this.osc_lfo = oscillators[instr.lfo_waveform];
    this.osc1 = oscillators[instr.osc1_waveform];
    this.osc2 = oscillators[instr.osc2_waveform];
    this.attack = instr.env_attack;
    this.sustain = instr.env_sustain;
    this.release = instr.env_release;
    this.panFreq = Math.pow(2, instr.fx_pan_freq - 8) / this.rowLen;
    this.lfoFreq = Math.pow(2, instr.lfo_freq - 8) / this.rowLen;

sonantx.SoundGenerator.prototype.genSound = function(n, chnBuf, currentpos) {
    var marker = new Date();
    var c1 = 0;
    var c2 = 0;

    // Precalculate frequencues
    var o1t = getnotefreq(n + (this.instr.osc1_oct - 8) * 12 + this.instr.osc1_det) * (1 + 0.0008 * this.instr.osc1_detune);
    var o2t = getnotefreq(n + (this.instr.osc2_oct - 8) * 12 + this.instr.osc2_det) * (1 + 0.0008 * this.instr.osc2_detune);

    // State variable init
    var q = this.instr.fx_resonance / 255;
    var low = 0;
    var band = 0;
    for (var j = this.attack + this.sustain + this.release - 1; j >= 0; --j)
    {
        var k = j + currentpos;

        // LFO
        var lfor = this.osc_lfo(k * this.lfoFreq) * this.instr.lfo_amt / 512 + 0.5;

        // Envelope
        var e = 1;
        if(j < this.attack)
            e = j / this.attack;
        else if(j >= this.attack + this.sustain)
            e -= (j - this.attack - this.sustain) / this.release;

        // Oscillator 1
        var t = o1t;
        if(this.instr.lfo_osc1_freq) t += lfor;
        if(this.instr.osc1_xenv) t *= e * e;
        c1 += t;
        var rsample = this.osc1(c1) * this.instr.osc1_vol;

        // Oscillator 2
        t = o2t;
        if(this.instr.osc2_xenv) t *= e * e;
        c2 += t;
        rsample += this.osc2(c2) * this.instr.osc2_vol;

        // Noise oscillator
        if(this.instr.noise_fader) rsample += (2*Math.random()-1) * this.instr.noise_fader * e;

        rsample *= e / 255;

        // State variable filter
        var f = this.instr.fx_freq;
        if(this.instr.lfo_fx_freq) f *= lfor;
        f = 1.5 * Math.sin(f * 3.141592 / WAVE_SPS);
        low += f * band;
        var high = q * (rsample - band) - low;
        band += f * high;
        switch(this.instr.fx_filter)
        {
            case 1: // Hipass
                rsample = high;
                break;
            case 2: // Lopass
                rsample = low;
                break;
            case 3: // Bandpass
                rsample = band;
                break;
            case 4: // Notch
                rsample = low + high;
                break;
            default:
        }

        // Panning & master volume
        t = osc_sin(k * this.panFreq) * this.instr.fx_pan_amt / 512 + 0.5;
        rsample *= 39 * this.instr.env_master;

        // Add to 16-bit channel buffer
        k = k * 4;
        if (k + 3 < chnBuf.length) {
            var x = chnBuf[k] + (chnBuf[k+1] << 8) + rsample * (1 - t);
            chnBuf[k] = x & 255;
            chnBuf[k+1] = (x >> 8) & 255;
            x = chnBuf[k+2] + (chnBuf[k+3] << 8) + rsample * t;
            chnBuf[k+2] = x & 255;
            chnBuf[k+3] = (x >> 8) & 255;
        }
    }
};

    var bufferSize = (this.attack + this.sustain + this.release - 1) + (32 * this.rowLen);
    var self = this;
    genBuffer(bufferSize, function(buffer) {
        self.genSound(n, buffer, 0);
        applyDelay(buffer, bufferSize, self.instr, self.rowLen, function() {
            callBack(new sonantx.AudioGenerator(buffer));
        });
    });
};
sonantx.SoundGenerator.prototype.createAudio = function(n, callBack) {
    this.getAudioGenerator(n, function(ag) {
        callBack(ag.getAudio());

sonantx.SoundGenerator.prototype.createAudioBuffer = function(n, callBack) {
    this.getAudioGenerator(n, function(ag) {
        ag.getAudioBuffer(callBack);
    });

    // Wave data configuration
    this.waveSize = WAVE_SPS * song.songLen; // Total song size (in samples)

    var self = this;
    genBuffer(this.waveSize, function(chnBuf) {
        // Preload/precalc some properties/expressions (for improved performance)
        var waveSamples = self.waveSize,
            waveBytes = self.waveSize * WAVE_CHAN * 2,
            rowLen = self.song.rowLen,
            endPattern = self.song.endPattern,
            soundGen = new sonantx.SoundGenerator(instr, rowLen);

        var currentpos = 0;
        var p = 0;
        var row = 0;
        var recordSounds = function() {
            var beginning = new Date();
            while (true) {
                if (row === 32) {
                    row = 0;
                    p += 1;
                    continue;
                }
                if (p === endPattern - 1) {
                    setTimeout(delay, 0);
                    return;
                }
                var cp = instr.p[p];
                if (cp) {
                    var n = instr.c[cp - 1].n[row];
                    if (n) {
                        soundGen.genSound(n, chnBuf, currentpos);
                    }
                }
                currentpos += rowLen;
                row += 1;
                if (new Date() - beginning > MAX_TIME) {
                    setTimeout(recordSounds, 0);
                    return;
                }
            }
        };

        var delay = function() {
            applyDelay(chnBuf, waveSamples, instr, rowLen, finalize);
        };

        var b2 = 0;
        var finalize = function() {
            var beginning = new Date();
            var count = 0;
            // Add to mix buffer
            while(b2 < waveBytes)
            {
                var x2 = mixBuf[b2] + (mixBuf[b2+1] << 8) + chnBuf[b2] + (chnBuf[b2+1] << 8) - 32768;

                mixBuf[b2+1] = (x2 >> 8) & 255;
                b2 += 2;
                count += 1;
                if (count % 1000 === 0 && (new Date() - beginning) > MAX_TIME) {
                    setTimeout(finalize, 0);
                    return;
                }
            }
            setTimeout(callBack, 0);
        };
        setTimeout(recordSounds, 0);

    genBuffer(this.waveSize, function(mixBuf) {
        var t = 0;
        var recu = function() {
            if (t < self.song.songData.length) {
                t += 1;
                self.generateTrack(self.song.songData[t - 1], mixBuf, recu);
            } else {
                callBack(new sonantx.AudioGenerator(mixBuf));
            }
        };
        recu();
    });
};
sonantx.MusicGenerator.prototype.createAudio = function(callBack) {
    this.getAudioGenerator(function(ag) {
        callBack(ag.getAudio());
    });
};
sonantx.MusicGenerator.prototype.createAudioBuffer = function(callBack) {
    this.getAudioGenerator(function(ag) {
        ag.getAudioBuffer(callBack);
    });
};

<script>var canvas = document.getElementById("gameCanvas");
canvas.width = window.innerWidth;

var ctx = canvas.getContext("2d");

var borderLeft = canvas.width /2 - 450;
var borderRight = canvas.width /2 +450;
var color1 = " #efeff2 ";
var color2 = " #000d11";

var score = 0;

pos = [canvas.width/2 -50,canvas.height-75]
var posTvs = [];
var width = 900;
for (var i = 0;i <7;i++){
  posTvs[i] = returnPosArray();
}

function startLogic() {
  drawInerval = setInterval(draw,10);
}

function drawPlayer(pos ) {
  //main square
  ctx.beginPath();
  ctx.rect(pos[0], pos[1], 50,75);
  ctx.fillStyle = color1;
  ctx.fill();
  ctx.closePath();

  //left eye
  ctx.beginPath();
  ctx.arc(pos[0] +12, pos[1] +15, 10, 0, Math.PI*2, false);
  ctx.fillStyle = color2;
  ctx.fill();
  ctx.closePath();

  //right eye
  ctx.beginPath();
  ctx.arc(pos[0] +37, pos[1] +15, 10, 0, Math.PI*2, false);
  ctx.fillStyle = color2;
  ctx.fill();
  ctx.closePath();

  // mouth
  ctx.beginPath();
  ctx.arc(pos[0] +23, pos[1] +53, 20, 3, Math.PI*2, false);
  ctx.fillStyle = color2;
  ctx.fill();
  ctx.closePath();


}




document.addEventListener("keydown", keyDownHandler, false);
document.addEventListener("keyup", keyUpHandler, false);


var rightPressed = false;
var leftPressed = false;
function keyDownHandler(e) {
    if(e.keyCode == 39 || e.keyCode == 68) {
        rightPressed = true;
    }
    else if(e.keyCode == 37 || e.keyCode == 65) {
        leftPressed = true;
    }
}

function keyUpHandler(e) {
    if(e.keyCode == 39 || e.keyCode == 68) {
        rightPressed = false;
    }
    else if(e.keyCode == 37 || e.keyCode == 65) {
        leftPressed = false;
    }
}

class GlitchCubb {

  static cubb(posx,posy){
    var colors = ['#5E5E5E' , '#D4D4D4' ,'#F7F7F7' ,'#4A4A4A'];
    ctx.beginPath();
    ctx.rect(posx, posy, 10,10);
    ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];;
    ctx.fill();
    ctx.closePath();
  }
}
var aMuritOData = false;
function draw() {
  ctx.clearRect(pos[0],pos[1],51,76)


  if (rightPressed && pos[0]< borderRight - 50 ){
    pos[0] +=6;
  }else if(leftPressed && pos[0] > borderLeft){
    pos[0] -=6;
  }



  for (var i = 0 ; i <7 ; i++){
    ctx.clearRect(posTvs[i][0] , posTvs[i][1] , 100 , 100);

    if(posTvs[i][0]< borderLeft  || posTvs[i][0] >borderRight-100){

      posTvs[i][2] = -posTvs[i][2];

    }
    if (posTvs[i][1] > canvas.height){
      score++;
      posTvs[i] = returnPosArray();
    }

    posTvs[i][0] +=posTvs[i][2];
    posTvs[i][1] +=posTvs[i][3];
    drawTv(posTvs[i], i);

    var isDead = checkIfDead(posTvs[i]);

    if(isDead && aMuritOData == false){

      aMuritOData = true;
      clearInterval(drawInerval);
      clearInterval(logicInterval);

      setInterval(bigBum, 10);
      restartPanel();

    }
  }
  drawPlayer(pos);


}



function drawTv(posTv , index) {

  ctx.clearRect(posTv[0],posTv[1],90,90)
  for (var i = 0 ; i < 9;i++){
    for (var j = 0 ; j <9; j++){
      var isTrue = false;
      if (i == 0 || i == 1 || j ==0 || j ==1 || i == 7 || i == 8 || j==7 || j==8){
        var rand = Math.random();

        if(rand > 0.9) {
          isTrue = true;

        }
      }else{
        isTrue = true;
      }
      if(isTrue){

        GlitchCubb.cubb(posTv[0]+i *10, posTv[1] +j *10);
      }

    }
  }
}

function returnPosArray (){
  var posX =  Math.round(Math.random() * (borderRight-100 - borderLeft) + borderLeft);
  var difficulty = 0;
  if (difficulty <3.0){
      difficulty = score *0.1;
  }
     var posY  = Math.round(Math.random() *(-2500) -50);
  var dirX;
  var dirY  = Math.round(Math.random() *7+3  + difficulty);
  if (Math.random() >0.5){
    dirX = Math.round(Math.random() *5 + difficulty);
  }else {
    dirX = Math.round(Math.random() * -5  - difficulty);
  }
  return [ posX, posY,dirX,dirY ];
}

function checkIfDead(posTv) {
    var rect1X  = posTv[0] + 55;
    var rect1Y  = posTv[1] + 55;
    var rect2X  = pos[0] + 25
    var rect2Y = pos[1] + 37;

    if (rect1X < rect2X + 50 && rect1X + 50 > rect2X && rect1Y < rect2Y + 75 && 50 + rect1Y > rect2Y) {

       return true;
    }
    return false;
}

function bigBum (){
  ctx.clearRect(0 , 0 ,canvas.width, canvas.height);
  for (var i = 0 ; i < Math.floor(canvas.width/10);i++){
    for (var j = 0 ; j <Math.floor(canvas.height/10); j++){
      GlitchCubb.cubb(+i *10, j *10);
    }
  }
}

function restartPanel (){
  var pointXCenter = canvas.width /2;
  var point = [pointXCenter - canvas.width/4 , 300];

  ctx.font = '100px Impact, Charcoal, sans-serif';
  function drawRestartPanel(){

    ctx.fillStyle = color2;
    ctx.fillText('SCORE: ' + score , 100 ,100);
    ctx.fillText('PRESS R TO RESTART ' , 100 ,200);
  }
  setInterval(drawRestartPanel,10);
  document.addEventListener("keydown", rHandler, false);
  function rHandler(e) {
    if (e.keyCode == 82) {
      location.reload();
    }
  }
}
</script>

<script>class Person{
  constructor(){
    this.name = this.name();
    this.age = this.age();
    this.wife = this.wife();
    this.traits = this.traits();
    this.nr = this.nr();
  }
  name(){
    var firstNames = ['Elijah' ,'James' ,'William' ,'Oliver' ,'Connor' ,'Matthew','Daniel' ,'Luke' ,'Brayden' ,'Jayce' ,'Henry' ,'Carter' ,'Dylan' ,'Gabriel' ,'Joshua' ,'Nicholas' ,'IsaacOwen',
      'Jackson' ,'Aiden', 'Liam', 'Lucas', 'Noah', 'Mason', 'Jayden', 'Ethan', 'Jacob', 'Jack', 'Caden', 'Logan', 'Benjamin', 'Michael', 'Caleb', 'Ryan', 'Alexander'];

    var lastNames = ['Sauter' , 'Dyson' , 'Burkhead' , 'Wess' , 'Flinchbaugh' , 'Eisenmann' , 'Winrow' , 'Rybicki' , 'Crenshaw' , 'Ledwell' , 'Sonnenberg' ,'Valliere' , 'Jeans' , 'Pridemore' , 'Lundgren' , 'Schoemaker' ];
    var name = firstNames[Math.floor(Math.random()*firstNames.length)] + ' ' + lastNames[Math.floor(Math.random()*lastNames.length)];
    return name;
  }
  age(){
    return Math.floor(Math.random()*(75-18+1)+19);
  }
  wife(){
    var firstNames= ['Lorraine' , 'Sharie' , 'Kathrine' , 'Carla' , 'Laureen' , 'Clemencia']
    var lastNames = ['Sauter' , 'Dyson' , 'Burkhead' , 'Wess' , 'Flinchbaugh' , 'Eisenmann' , 'Winrow' , 'Rybicki' , 'Crenshaw' , 'Ledwell' , 'Sonnenberg' ,'Valliere' , 'Jeans' , 'Pridemore' , 'Lundgren' , 'Schoemaker' ];

    var rand = Math.random();
    if (rand < 0.8){
      return 'none';
    }else {
      return name;
    }

  traits(){
    var traitsList1 = [ 'Reliable' , 'Emotional' , ' Amoral'  ,'Focused'];
    var traitsList2 = ['Crude' , ' Greedy' , 'Odd' , 'Weak' , ];
    var traits = traitsList1[Math.floor(Math.random()*traitsList1.length)] + ', ' +  traitsList2[Math.floor(Math.random()*traitsList2.length)];
    return traits;
  }
  nr(){
    var nr = 0;
    for (var i = 0 ; i < 3 ; i++){
      var nr1 = Math.floor(Math.random() *10);
      nr = nr*10 +nr1;
    }
    return nr;
  }
  static experimentNr(){
    var nr = 0;
    for (var i = 0 ; i < 3 ; i++){
      var nr1 = Math.floor(Math.random() *10);
      nr = nr*10 +nr1;
    }
    return nr;
  }

}
var person = new Person();

  ctx.beginPath();
  ctx.moveTo(pointLeftUp[0],pointLeftUp[1]);
  ctx.lineWidth = 20;

  ctx.lineTo(pointRightDown[0 ], pointRightDown[1]);
  ctx.lineTo(pointRightUp[0 ], pointRightUp[1]+200);
  ctx.lineTo(pointRightUp[0 ] -200, pointRightUp[1]+200);
  ctx.lineTo(pointRightUp[0 ] -200, pointRightUp[1]);
  ctx.moveTo(pointRightUp[0] -210,pointRightUp[1]-4);
  ctx.lineTo(pointRightUp[0 ] +4 , pointRightUp[1]+200);
  ctx.moveTo(pointLeftUp[0] -10,pointLeftUp[1]);
  ctx.lineTo(pointRightUp[0] -200 , pointRightUp[1]);

  ctx.strokeStyle = color1;

  ctx.closePath();

}
