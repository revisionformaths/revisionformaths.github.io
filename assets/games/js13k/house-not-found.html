function walkSoundPlay() {
  when = ac.currentTime;

  walkSequence.play( when );

}

        ctx.fillRect(canvas.width / 2 - 62, 62 + (i - 1) * 25, 125, 25);

function update() {
  if (showDialog) {
    if (keyUp) {
      elevatorSoundPlay()
      keyUp = false;
      level--;
      if (level < 1) {
        level = 5;
      }
    }
    if (keyDown) {
      elevatorSoundPlay()
      keyDown = false;
      level++;
      if (level > 5) {
        level = 1;
      }
    }
    if (keyEnter || keyZ) {
      selectSoundPlay()
      keyEnter = keyZ = false;
      showDialog = false;
    }
    if (keyEscape) {
      keyEscape = false;
      level = levelBefore;
      showDialog = false;
    }
  } else if (asked) {
    if (keyUp || keyDown) {
      elevatorSoundPlay()
      keyUp = false;
      keyDown = false;
      response = !response;
    }
    if (keyEnter || keyZ) {
      selectSoundPlay()
      if (response) {
        player.x = 100;
        if (level == 2) {
          room202 = true;
          dog = true;
          asked = false;
          question = "";
        } else if (level == 4 && door == 2) {
          money = false;
          password = true;
          asked = false;
          question = "";
        } else if (level == 4 && door == 1) {
          screwdriver = true;
          password = false;
          asked = false;
          question = "";
        } else if (level == 4 && door == 5) {
          key = false;
          asked = false;
          room405 = true;
          question = "";
        } else if (level == 5 && door == 1) {
          room501 = true;
          asked = false;
          question = "";
        }
      } else {
        asked = false;
        question = "";
      }
    }
  } else {
    if (dialog == "ELEVATOR" && keyUp) {
      elevatorSoundPlay()
      showDialog = true;
      levelBefore = level;
      keyUp = false;
    } else if (dialog.split(" ")[0] == "Open" && keyUp) {
      knockSoundPlay()
      gameLogic();
      keyUp = false;
    } else if (dialog.split(" ")[0] == "Take" && keyUp) {
      elevatorSoundPlay()
      closet[6][14] = "A";
      money = true;
      keyUp = false;
    } else if (dialog == "Leave" && (room202 || room501) && keyUp) {
      elevatorSoundPlay()
      room202 = false;
      room501 = false;
      keyUp = false;
    } else if (dialog[0] == "E" && (room405) && keyUp) {
      elevatorSoundPlay()
      playFinalSound()
      room405 = false;
      room404 = true;
      keyUp = false;
    } else if (dialog[0] == "U" && room501 && keyUp) {
      elevatorSoundPlay()
      player.x = 100
      keys = true;
      airductSprite = airductSpriteOpen
      screwdriver = false;
      keyUp = false;
    } else {
      if (keyRight) {
        if (player.x + player.spriteIndexSize*8 > canvas.width) player.x = canvas.width - player.spriteIndexSize * 8
        player.x += player.speed;
        player.animation++
        if (player.animation > 16) {
          walkSoundPlay()
          player.frame++
          if (player.frame == 4) player.frame = 0
          player.animation = 0
        }
      }
      if (keyLeft) {
        if (player.x<0) player.x = 0
        player.x -= player.speed;
        player.animation++
        if (player.animation > 16) {
          walkSoundPlay()
          player.frame++
          if (player.frame == 4) player.frame = 0
          player.animation = 0
        }
      }

      if (dog) {
        dogAnimation++
        if (dogAnimation > 32) {
          dogFrame++
          dogAnimation = 0
          if (dogFrame == 2) {
            dogFrame = 0
          }
        }
      }

      if (timer == -1) {
        checkPlayerCollision();
      }

      if (room404) {
        keyLeft = false
        keyRight = false
      }

      if (changeDirection != player.face) {
        if (player.face == "left") player.sprite = [playerSpriteR, playerSpriteWalkR, playerSpriteR, playerSpriteWalk2R]
        else player.sprite = [playerSprite, playerSpriteWalk, playerSprite, playerSpriteWalk2]
        player.face = changeDirection
      }
    }

function keyDownHandler(event) {
  switch (event.keyCode) {
    case KEYS.right:
      keyRight = true;
      changeDirection = 'right'
      break;
    case KEYS.left:
      if (player.x > 0) {
        keyLeft = true;
        changeDirection = 'left'
      }
      break;
    case KEYS.up:
      keyUp = true;
      break;
    case KEYS.down:
      keyDown = true;
      break;
    case KEYS.z:
      keyZ = true;
      break;
    case KEYS.enter:
      keyEnter = true;
      break;
    case KEYS.escape:
      keyEscape = true;
      break;
  }
}
function keyUpHandler(event) {
  switch (event.keyCode) {
    case KEYS.right:
      keyRight = false;
      player.frame = 0;
      player.animation = 0;
      break;
    case KEYS.left:
      keyLeft = false;
      player.frame = 0;
      player.animation = 0;
      break;
    case KEYS.up:
      keyUp = false;
      break;
    case KEYS.down:
      keyDown = false;
      break;
    case KEYS.enter:
      keyEnter = false;
      break;
    case KEYS.z:
      keyZ = false;
      break;
    case KEYS.escape:
      keyEscape = false;
      break;
  }
}

function drawSprite(sprite, x, y, w, h) {
  sprite.forEach((r, rI) => {
    r.forEach((c, cI) => {
      ctx.fillStyle = colors[c];
      ctx.fillRect(x + cI * w, y + rI * h, w, h);
    });
  });
}

function drawText(t, x, y, s, c) {
  ctx.font = `${s}px Georgia`;
  ctx.fillStyle = c;
  ctx.fillText(t, x, y);
}
