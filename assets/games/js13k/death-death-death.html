    <script>// to the top, to constants
let EPS = 0.01;
let PI2 = Math.PI / 2;
let PI = Math.PI;
let {
  sin, cos, tan, sqrt, min, max, abs, sign, random, pow, round
} = Math;

function step(edge, x) {
  if (x < edge) {
    return 0;
  } else {
    return 1;
  }
}

const clamp = (num, min, max) => Math.min(Math.max(num, min), max);

// Conceptually, an "infinitesimaly small" real number.
let EPSILON = 0.001;

// Dot product of two 3D vectors.
function DotProduct(v1, v2) {
  return v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2];
}

// Length of a 3D vector.
function Length(vec) {
  return sqrt(DotProduct(vec, vec));
}

// Multiplies a scalar and a vector.
function MultiplySV(k, vec) {
  return [k*vec[0], k*vec[1], k*vec[2]];
}

// Multiplies a matrix and a vector.
function MultiplyMV(mat, vec) {
  let result = [0, 0, 0];

  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      result[i] += vec[j]*mat[i][j];
    }
  }

  return result;
}

// Computes v1 + v2.
function Add(v1, v2) {
  return [v1[0] + v2[0], v1[1] + v2[1], v1[2] + v2[2]];
}

// Computes v1 - v2.
function Subtract(v1, v2) {
  return [v1[0] - v2[0], v1[1] - v2[1], v1[2] - v2[2]];
}

// Clamps a color to the canonical color range.
function Clamp(vec) {
  return [min(255, max(0, vec[0])),
      min(255, max(0, vec[1])),
      min(255, max(0, vec[2]))];
}

// Computes the reflection of v1 respect to v2.
function ReflectRay(v1, v2) {
  return Subtract(MultiplySV(2*DotProduct(v1, v2), v2), v1);
}

function InvertDirection(dir) {
  return [
    1 / dir[0],
    1 / dir[1],
    1 / dir[2]
  ];
}

function isCollision(a, b) {
  // using 6 splitting planes to rule out intersections.
  return b.max[0] < a.min[0] || b.min[0] > a.max[0] ||
         b.max[1] < a.min[1] || b.min[1] > a.max[1] ||
         b.max[2] < a.min[2] || b.min[2] > a.max[2] ? false : true;
}

    <script>let Box = function(min, max, color, specular, reflective, collider = true, onCollide = null) {
  this.min = min;
  this.max = max;

  this.bounds = [min, max];

  this.color = color; // ambient
  this.specular = specular;
  this.reflective = reflective;
  this.collider = collider;
  this.onCollide = onCollide;

  // если я соберусь обновлять bounds, min, max коробки, то надо обновить следующие свойства:
  // move() сделать надо тогда
  this.update();
}

Box.prototype.update = function() {
  this.bounds = [this.min, this.max];

  this.center = MultiplySV(0.5, Add(this.max, this.min));
  this.normalSize = MultiplySV(0.5, Subtract(this.max, this.min));
  this.mapSize = Subtract(this.max, this.min);
};

// только для игрока? запомниать первоначальные bounds коробки?
Box.prototype.movePlayer = function(pos) {
  this.min = Add(pos, [-0.3, 0, -0.3]);
  this.min[1] = -0.9;
  this.max = Add(pos, [0.3, 0.7, 0.3]);
  this.update();
};

Box.prototype.moveProj = function(pos) {
  this.min = Add(pos, [0, 0, 0]);
  this.max = Add(pos, [0.1, 0.1, 0.3]);
  this.update();
};

// A Light.
let Light = function(ltype, intensity, position) {
  this.ltype = ltype;
  this.intensity = intensity;
  this.position = position;
}

Light.AMBIENT = 0;
Light.POINT = 1;
Light.DIRECTIONAL = 2;

  boxes.push(box);

// Converts 2D canvas coordinates to 3D viewport coordinates.
function CanvasToViewport(p2d) {
  return [p2d[0] * viewport_size / canvas.width,
      p2d[1] * viewport_size / canvas.height,
      projection_plane_z];
}

function IntersectRayBox(origin, direction, box) {
  let tmin, tmax, tymin, tymax, tzmin, tzmax;
  let bounds = box.bounds;

  let rayInvDir = InvertDirection(direction);
  let sign = [
    +(rayInvDir[0] < 0),
    +(rayInvDir[1] < 0),
    +(rayInvDir[2] < 0)
  ];

  tmin = (bounds[sign[0]][0] - origin[0]) * rayInvDir[0];
  tmax = (bounds[1 - sign[0]][0] - origin[0]) * rayInvDir[0];
  tymin = (bounds[sign[1]][1] - origin[1]) * rayInvDir[1];
  tymax = (bounds[1 - sign[1]][1] - origin[1]) * rayInvDir[1];

  if ((tmin > tymax) || (tymin > tmax)) {
    return;
  }

  if (tymin > tmin) {
    tmin = tymin;
  }

  if (tymax < tmax) {
    tmax = tymax;
  }

  tzmin = (bounds[sign[2]][2] - origin[2]) * rayInvDir[2];
  tzmax = (bounds[1 - sign[2]][2] - origin[2]) * rayInvDir[2];

  if ((tmin > tzmax) || (tzmin > tmax)) {
    return;
  }

  if (tzmin > tmin) {
    tmin = tzmin;
  }

  if (tzmax < tmax) {
    tmax = tzmax;
  }

  if (tmin > tmax) {
    return Infinity;
  }

  if (tmin < 0) {
    return tmax;
  }

  return tmin;
}

function ComputeLighting(point, normal, view, specular, isWall) {
  let intensity = 0;
  let length_n = Length(normal);  // Should be 1.0, but just in case...
  let length_v = Length(view);

  for (let i = 0; i < lights.length; i++) {
    let light = lights[i];

    if (light.ltype == Light.AMBIENT) {
      intensity += light.intensity;
    } else {
      let vec_l, t_max;

      if (light.ltype == Light.POINT) {
        vec_l = Subtract(light.position, point);
        t_max = 1.0;
      } else {  // Light.DIRECTIONAL
        vec_l = light.position;
        t_max = Infinity;
      }

      // Shadow check.
      if (!isWall) {
        let blocker = ClosestIntersection(point, vec_l, EPSILON, t_max);
        if (blocker) {
          continue;
        }
      }

      // Diffuse reflection.
      let n_dot_l = DotProduct(normal, vec_l);
      if (n_dot_l > 0) {
        intensity += light.intensity * n_dot_l / (length_n * Length(vec_l));
      }

      // Specular reflection.
      if (specular != -1) {
        let vec_r = ReflectRay(vec_l, normal);
        let r_dot_v = DotProduct(vec_r, view);
        if (r_dot_v > 0) {
          intensity += light.intensity * pow(r_dot_v / (Length(vec_r) * length_v), specular);
        }
      }
    }
  }

  return intensity;
}


// Find the closest intersection between a ray and the spheres in the scene.
function ClosestIntersection(origin, direction, min_t, max_t) {
  let closest_t = Infinity;
  let closest_object = null;

  for (let i = 0; i < boxes.length; i++) {
    let ts = IntersectRayBox(origin, direction, boxes[i]);

    if (ts < closest_t && min_t < ts && ts < max_t) {
      closest_t = ts;
      closest_object = boxes[i];
    }
  }


  if (closest_object) {
    return [closest_object, closest_t];
  }

  return null;
}

function NormalBox(point, box) {
  let pc = Subtract(point, box.center);

  let normal = [
    sign(pc[0]) * step(abs(abs(pc[0]) - box.normalSize[0]), EPS),
    sign(pc[1]) * step(abs(abs(pc[1]) - box.normalSize[1]), EPS),
    sign(pc[2]) * step(abs(abs(pc[2]) - box.normalSize[2]), EPS)
  ];

  return MultiplySV(1.0 / Length(normal), normal);
}

function GetColorFromMap(box, point, normal) {
  let { data, width, height } = box.map; // ImageData

  let size = box.mapSize;

  // uv
  let u = (box.max[0] - point[0]) / size[0];

  // другая сторона куба
  if (normal[0] !== 0) {
    u = (box.max[2] - point[2]) / size[2];
  }

  let v = (box.max[1] - point[1]) / size[1];

  // низ куба
  if (normal[1] !== 0) {
    v = (box.max[2] - point[2]) / size[2];
  }

  // xy in texture space
  let x = round((u) * width);
  let y = round((v) * height);

  let i = (y * (width * 4)) + (x * 4);

  let color = [
    data[i],
    data[i + 1],
    data[i + 2]
  ];

  return color;
}

// Traces a ray against the set of spheres in the scene.
function TraceRay(origin, direction, min_t, max_t, depth) {
  let intersection = ClosestIntersection(origin, direction, min_t, max_t);

  if (!intersection) {
    return getBackgroundColor();
  }

  let closest_object = intersection[0];
  let closest_t = intersection[1];

  let point = Add(origin, MultiplySV(closest_t, direction));

  let normal = NormalBox(point, closest_object);
  let isWall = walls.includes(closest_object);

  let view = MultiplySV(-1, direction);
  let lighting = ComputeLighting(point, normal, view, closest_object.specular, isWall);
  let local_color;

  if (closest_object.map) {
    let color = GetColorFromMap(closest_object, point, normal);
    color = Add(color, closest_object.color);
    local_color = MultiplySV(lighting, color);
  } else {
    local_color = MultiplySV(lighting, closest_object.color);
  }

  if (closest_object.reflective <= 0 || depth <= 0) {
    return local_color;
  }

  let reflected_ray = ReflectRay(view, normal);
  // EPS = 0.01
  // EPSILON? 0.001
  let reflected_color = TraceRay(point, reflected_ray, EPS, maxRenderDistance, depth - 1);

  let outColor = Add(
    MultiplySV(
      1 - closest_object.reflective,
      local_color
    ),
    MultiplySV(
      closest_object.reflective,
      reflected_color
    )
  );

  let fogCoef = closest_t / max_t;

  let fog = [
    fogColor[0] * fogCoef,
    fogColor[1] * fogCoef,
    fogColor[2] * fogCoef
  ];

  return Add(fog, outColor);
}

let keys = {};

window.onkeydown = (e) => {
  keys[e.code] = true;
};

window.onkeyup = (e) => {
  delete keys[e.code];
};

function updateKeyboard() {
  for (const c in keys) {
    if (c) {
      if (c == 'KeyW') {
        movePlayer([0, 0, 1]);
      }

      if (c == 'KeyS') {
        movePlayer([0, 0, -1]);
      }

      if (c == 'KeyA') {
        movePlayer([-1, 0, 0]);
      }

      if (c == 'KeyD') {
        movePlayer([1, 0, 0]);
      }
    }
  }
}

function movePlayer(direction) {
  let movement =
    MultiplySV(
      moveSpeed,
      MultiplyMV(
        camera_rotation,
        direction
      )
    );

  // no flying
  movement[1] = 0;

  // collision check
  boxes.forEach(box => {
    if (!box.collider) {
      return;
    }

    let a = playerBox;
    let b = box;

    // x collision
    if (isCollision(a, b)) {
      if (box.onCollide) {
        box.onCollide();

        if (!box.collider) {
          return;
        }
      }

      if (b.max[0] > a.min[0] + movement[0] && b.min[0] < a.max[0] + movement[0]) {
        movement[0] = 0;
      }

      // z collision
      if (b.max[2] > a.min[2] + movement[2] && b.min[2] < a.max[2] + movement[2]) {
        movement[2] = 0;
      }
    }
  });

  camera_position = Add(camera_position, movement);

  // покачивание камеры при хотьбе
  camera_position[1] += cos(Date.now() / 100) / 100;

  // возвращаем в ноль постепенно, если зашли слишком далеко
  if (abs(camera_position[1]) > 0.1) {
    camera_position[1] *= 0.0001;
  }

  playerBox.movePlayer(camera_position);

  playerLight1.position = Add(camera_position, [0, 0, 1]);
  // playerLight2.position = Add(camera_position, [0, 0, -1]);

  zzfxP(stepSound);
}

  x: 0,

function updateMouse(e) {
  if (document.pointerLockElement === canvas && !isGameEnded) {
    let newX = e.movementX * mouseSpeed;
    let newY = e.movementY * mouseSpeed;

    let yCut = PI2 - .01; // engines may not like yRot == pi/2

    let oldX = mouseRot.x;
    let oldY = mouseRot.y;

    mouseRot.x = oldX + newX;
    mouseRot.y = clamp(oldY + newY, -yCut, yCut);

    let x = mouseRot.x;
    let y = mouseRot.y;

    // // Вращение по оси X — ок отдельноо

        [cos(x), 0, sin(x)],
        [0, 1, 0],

}

    <script>let projectiles = [];
let projSpeed = 0.5;

function newProjectile(pos, dir, author) {
  let p = {
    pos: Add(pos, [0,0,0]), // clone camera pos
    dir: dir,
    box: new Box([0, 0, 0], [0.1, 0.1, 0.1], [255, 63, 49], 500, 0), // #ff3f31
    author
  };

  projectiles.push(p);
  boxes.push(p.box);
}

function updateProjectiles() {
  projectiles.forEach(updateProj);
}

function updateProj(p) {
  let movement =
    MultiplySV(
      projSpeed,
      p.dir
    );

  p.pos = Add(p.pos, movement);
  p.pos[1] = -0.1;
  p.box.moveProj(p.pos);

  let targets = [playerBox, ...npcs, ...walls];

  targets.some((target, index) => {
    if (index === 0) {
      // player
      if (isCollision(target, p.box) && p.author !== 'player') { // нет самострелу
//////////////////////////////////show red screen something/////////
        playerHealth -= npcProjDamage;

        removeProj(p, true);

        if (!isGameEnded) {
          zzfxP(playerHitSound);
        }

        if (playerHealth <= 0) {
          if (!isGameEnded) {
            zzfxP(playerDeathSound);

            bgMusicNode.stop();
          }

          death();
        }
      }
    } else {
      // wall
      if (!target.box && isCollision(target, p.box) && target.isWall) {
        removeProj(p, true);

        return;
      }

      // npc
      if (target.box && isCollision(target.box, p.box) && p.author !== target) { // нет самострелу
        target.health -= playerDamage;

        if (!isGameEnded) {
          zzfxP(npcHitSound);
        }

        if (target.health <= 0) {
          removeNPC(target, true);

          if (!isGameEnded) {
            zzfxP(npcDeathSound);
          }

          if (p.author === 'player') {
            playerHealth += playerHeal;
            score++;
          }
        }

        removeProj(p, true);
      }
    }
  });

  removeProj(p);
}

function removeProj(p, force = false) {
  if (force || p.pos[0] > 30 || p.pos[0] < -30 || p.pos[2] > 30 || p.pos[2] < -30) {
    projectiles = projectiles.filter(pr => pr !== p);
    boxes = boxes.filter(pr => pr !== p.box);
  }
}

    <script>let npcs = [];
let npcSpeed = 0.11;
let npcProjSpeed = 0.1;
let npcProjDamage = 0.05;
let npcFireRate = 0.0035;
let npcSpawnChance = 0.006;
let npcDespawnTime = 60000;

// texture generation
let _npcCanvas = document.createElement('canvas');
// хром не грузит иначе в память всю текстуру
_npcCanvas.width = 35;
_npcCanvas.height = 100;
let _npcContext = _npcCanvas.getContext('2d');
let _npcTextureBuffer = _npcContext.createImageData(_npcCanvas.width, _npcCanvas.height);



function getPos() {
  let side = 10;
  let x = side * random();
  let z = side * random();
  x *= random() > 0.5 ? 1 : -1;
  z *= random() > 0.5 ? 1 : -1;

  return [x, 0, z];
}

const emojies = [
  '🧍🏻',
  '🧍🏼',
  '🧍🏽',
  '🕴🏻',
  '🕺🏻'
];

function getNPCTexture(text) {
  _npcContext.clearRect(0, 0, _npcCanvas.width, _npcCanvas.height);

  _npcContext.font = '120px sans-serif';
  _npcContext.fillStyle = '#ff0000';
  _npcContext.fillText(text, -42, 102);

  return _npcContext.getImageData(0, 0, _npcCanvas.width, _npcCanvas.height);
}

function newNPC() {
  let color = [0, 0, 0];

  let n = {
    pos: getPos(),
    dir: 0,
    box: new Box([0, -0.9, 0], [1, 1, 1], color, 500, 0, true, onNPCAndPlayerCollide),
    start: Date.now(),
    health: 1
  };

  n.box.map = getNPCTexture(emojies[Math.floor(random() * emojies.length)]);

  npcs.push(n);
  boxes.push(n.box);
}

// не нужно?
function onNPCAndPlayerCollide() {
}

function updateNPCs() {
  if (random() < npcSpawnChance) {
    newNPC();
  }

  npcs.forEach(updateNPC);
}

function updateNPC(npc) {
  // collision check
  walls.forEach(wall => {
    if (isCollision(wall, npc.box)) {
      npc.dir += PI / 4 * random();
    }
  });

  let movement = [
    cos(npc.dir) * npcSpeed,
    0,
    sin(npc.dir) * npcSpeed
  ];

  npc.pos = Add(npc.pos, movement);
  npc.box.movePlayer(npc.pos);

  if (random() < npcFireRate) {
    fireNPC(npc);
  }

  removeNPC(npc);
}

function removeNPC(n, force = false) {
  if (Date.now() - n.start > npcDespawnTime || force) {
    npcs = npcs.filter(npc => npc !== n);
    boxes = boxes.filter(npc => npc !== n.box);

    return;
  }
}

function fireNPC(npc) {
  let diff = MultiplySV(
    npcProjSpeed,
    Subtract(
      camera_position,
      npc.pos
    )
  );

  newProjectile(npc.pos, diff, npc);
}

    <script>function render() {

    for (let y = -canvas.height/2; y < canvas.height/2; y++) {
      if (random() < 0.5) {
        continue;
      }

      let direction = CanvasToViewport([x, y])
      direction = MultiplyMV(camera_rotation, direction);
      let color = TraceRay(camera_position, direction, minRenderDistance, maxRenderDistance, recursion_depth);
      PutPixel(x, y, Clamp(color));
    }
  }

  UpdateCanvas();

  renderUI();
}

function loop() {
  requestAnimationFrame(loop);

  if (!isGameEnded) {
    updateKeyboard();
  }

  updateProjectiles();
  updateNPCs();

  // а зачем много
  if (Date.now() % 2 === 0) {
    render();
  }
}
