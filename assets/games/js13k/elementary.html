<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Elementary</title>
    <style>html, body {
    margin: 0;
    padding: 0;
}

body {
    background: #ddd;
    font-size: 16px;
    font-family: Courier New, Courier, monospace;
    perspective: 500px;
    -webkit-perspective: 500px;
}

h2 {
    font-size: 28px;
	margin: 6px 12px;
}

#score {
	float:right;
}

#sprite {
    display:none;
}

#container {
    text-shadow: 0 1px #fff;
    width: 320px;
    margin: 0 auto;
    transform-origin: 50% 0;
    -webkit-transform-origin: 50% 0;
}

#board {
    width: 320px;
	height: 320px;
    background-size: 32px;
}

#board .em {
	display: block;
    position: absolute;
    width: 32px;
    height: 32px;
    opacity: 1;
    z-index: 1;
    transition: opacity .3s, transform .3s ease-in;
	-webkit-transition: opacity .3s, -webkit-transform .3s ease-in;
}

#board .hide {
    opacity: 0;
    z-index: 0;
}

#timer {
	margin: 8px 0;
    background: #00c;
}

#timer div {
    background: #c00;
    height: 8px;
    transform: scale(0, 1);
    -webkit-transform: scale(0, 1);
    transform-origin: 0 0;
    -webkit-transform-origin: 0 0;
}

#timer.run div {
    transform: scale(1, 1);
    -webkit-transform: scale(1, 1);
    transition: transform 60s linear;
    -webkit-transition: -webkit-transform 60s linear;
}

#menu,
#scores {
    cursor: default;
	position: absolute;
	background: rgba(0,0,0,.9);
	color: #fff;
	width: 300px;
	height: 300px;
	left: -160px;
	padding: 10px;
	margin: 38px 0 0 50%;
	text-align: center;
	transform-origin: 50% 0;
    -webkit-transform-origin: 50% 0;
	transition: transform .5s, opacity .5s;
	-webkit-transition: -webkit-transform .5s, opacity .5s;
	transform: rotateX(-114deg);
	-webkit-transform: rotateX(-114deg);
    opacity: 0;
    z-index: 2;
}

#menu.show,
#scores.show {
	transform: rotateX(0deg);
	-webkit-transform: rotateX(0deg);
    opacity: 1;
}

#scores table {
	width: 100%;
	margin: 16px 0;
}

#scores th {
    width: 60%;
    font-weight: normal;
    text-align: right;
}

#scores td {
    width: 40%;
    text-align: left;
}

#menu ul {
	margin: 32px 0;
	padding: 0;
	list-style: none;
}

#menu li {
	font-size: 24px;
    line-height: 48px;
}

* {
	-webkit-tap-highlight-color:rgba(0,0,0,0);
	-webkit-user-select:none;
	-khtml-user-select:none;
	-moz-user-select:none;
	-ms-user-select:none;
	user-select:none
}

@media (min-width: 480px) and (min-height: 540px) {
	body {
	    background: #ddd;
	    font-size: 24px;
	}    
	h2 {
	    font-size: 42px;
	    margin: 8px 16px;
	}
	#container {
        width: 480px;
	}
	#board {
	    width: 480px;
	    height: 480px;
        background-size: 48px;
	}
    #board .em {
        width: 48px;
        height: 48px;
    }
	#timer {
	    margin: 12px 0;
	}
	#timer div {
	    height: 12px;
	}
	#menu,
	#scores {
	    width: 450px;
        height: 450px;
	    left: -240px;
	    padding: 15px;
	    margin: 56px 0 0 50%;
	}
	#scores table {
        margin: 24px 0;
	}
	#menu ul {
	    margin: 48px 0;
	}
	#menu li {
	    font-size: 36px;
		line-height: 72px;
	}
}

@media (min-width: 640px) and (min-height: 720px) {
    body {
        background: #ddd;
        font-size: 32px;
    }    
	h2 {
	    font-size: 54px;
	    margin: 12px 24px;
	}
	#container {
        width: 640px;
    }
    #board {
        width: 640px;
        height: 640px;
        background-size: 64px;
    }
    #board .em {
        width: 64px;
        height: 64px;
    }
    #timer {
        margin: 16px 0;
    }
    #timer div {
        height: 16px;
    }
    #menu,
    #scores {
        width: 600px;
        height: 600px;
        left: -320px;
        padding: 20px;
        margin: 72px 0 0 50%;
    }
    #scores table {
        margin: 32px 0;
    }
    #menu ul {
        margin: 64px 0;
    }
    #menu li {
        font-size: 48px;
	    line-height: 96px;
    }
}</style>
</head>
<body>

<div id="menu" class="show">
    <ul>
        <li data-item="2">Two elements</li>
        <li data-item="3">Three elements</li>

        <li data-item="scores">Highscores</li>

</div>

</div>

<div id="container">

<script>function Game(width, height, colors) {
	this.score = 0;
	this.bonus = 0;
	this.time = 60;
	this.width = width;
	this.height = height;
	this.colors = colors;
	this.board = [];
	this.start = new Date().getTime();
	for (var i=0; i<width * height; i++) {
		this.board[i] = {
			i: i,
			c: Math.round(Math.random() * (this.colors-1)),
			h: false
		};
	}
}

Game.prototype.ball = function(x, y, data) {
	if (
		x >= 0 && x < this.width &&
		y >= 0 && y < this.height
	) {
		var i = y * this.width + x;
		if (data) {
			this.board[i] = data;
		} else {
			return this.board[i];
		}
	}
	return null;
};

Game.prototype.remove = function(x, y, c, s) {
	var ball = this.ball(x, y);
	if (ball && !ball.h && ball.c == c) {
		ball.h = true;
		this.score += ++s;
		this.remove(x-1, y, c, s);
		this.remove(x+1, y, c, s);
		this.remove(x, y-1, c, s);
		this.remove(x, y+1, c, s);
		return s;
	}
	return s;
};

Game.prototype.down = function() {
	for (var x=0; x<this.width; x++) {
		var y = 0,
			ball = this.ball(x, y);
		for (var i=1; i<this.height; i++) {
			if (ball.h) {
				var next = this.ball(x, i);
				if (!next.h) {
					this.ball(x, y, next);
					this.ball(x, i, ball);
					ball = this.ball(x, ++y);
				}
			} else {
				ball = this.ball(x, ++y);
			}
		}
	}
};

Game.prototype.left = function() {
	var x=0,
		ball = this.ball(x, 0);
	for (var i=1; i<this.width; i++) {
		var next = this.ball(i, 0);
		if (ball.h) {
			if (!next.h) {
				for (var y=0; y<this.height; y++) {
					next = this.ball(i, y);
					this.ball(i, y, this.ball(x, y));
					this.ball(x, y, next);
				}
				ball = this.ball(++x, 0);
			}
		} else {
			ball = this.ball(++x, 0);
		}
	}
};

Game.prototype.select = function(x, y) {
	var ball = this.ball(x, y),
		s = 0;
	if (ball && !ball.h) {
		ball.h = true;
		s = this.remove(x-1, y, ball.c, s);
		s = this.remove(x+1, y, ball.c, s);
		s = this.remove(x, y-1, ball.c, s);
		s = this.remove(x, y+1, ball.c, s);
		if (s > 0) {
			this.score += ++s;
			this.down();
			this.left();
		} else {
			ball.h = false;
		}
	}
	return s;
};

Game.prototype._check = function(x, y, c) {
	var ball = this.ball(x, y);
	if (ball && !ball.h) {
		return ball.c === c ||
			this._check(x+1, y, ball.c) ||
			this._check(x, y+1, ball.c);
	}
	return false;
};

Game.prototype.check = function() {
	var ball = this.ball(0, 0),
		result = false;
	if (ball && !ball.h) {
		result =
			this._check(1, 0, ball.c) ||
			this._check(0, 1, ball.c);
	}
	if (!result) {
		var time = Math.round((new Date().getTime() - this.start) / 1000);
		this.time = time < this.time ? this.time - time : 0;
		if (ball.h) this.bonus = 100;
	}
	return result;
};

Game.prototype.total = function() {
	return this.score + this.time + this.bonus;
};</script>
<script>var APP = (function() {

	var container = document.getElementById('container'),
		menu = document.getElementById('menu'),
		scores = document.getElementById('scores'),
		values = scores.getElementsByTagName('td'),
		canvas = document.getElementById('sprite'),
		board = document.getElementById('board'),
		score = document.getElementById('score'),
		sound = document.getElementById('sound'),
		timer = document.getElementById('timer'),
		mute = document.getElementById('mute'),
		pool = document.getElementsByTagName('img'),
		width = 10,
		height = 10,
		game = null,
		ctx = canvas.getContext('2d'),
		colors = [],
		options = JSON.parse(localStorage.getItem('options')) || {
			'score2': 0,
			'score3': 0,
			'score4': 0,
			'sound': true
		};
	
	function render() {
		for (var y=0; y<height; y++) {
			for (var x=0; x<width; x++) {
				var ball = game.ball(x, y),
					em = pool.item(ball.i);
				if (!ball.h) {
					em.src = colors[ball.c];
					em.className = 'em';
					em.style.transform =
					em.style.webkitTransform = 'translate(' + (x * em.width) + 'px,' + ((height - y - 1) * em.height) + 'px)';
					em.setAttribute('data-game', JSON.stringify({x:x, y:y}));
				} else {
					em.className = 'em hide';
				}
			}
		}
		if (!game.check()) {
			setView();
			score.innerHTML = game.total();
			timer.className = '';
			scores.className = 'show';
		} else {
			score.innerHTML = game.score;
			timer.className = 'run';
		}
	}
	
	function color(r, g, b, a) {
		var grd=ctx.createRadialGradient(50,50,10,45,45,100);
		grd.addColorStop(0,'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
		r = Math.round(r/2);
		g = Math.round(g/2);
		b = Math.round(b/2);
		grd.addColorStop(1,'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
		ctx.save();
		ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
		ctx.arc(64,64,60,0,2*Math.PI);
		ctx.fillStyle = grd;
		ctx.fill();
		ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(64,64,56,0,2*Math.PI);
		ctx.strokeStyle = 'rgba(0,0,0,.5)';
		ctx.stroke();
		ctx.restore();
		return canvas.toDataURL();
	}
	
	function back() {
		var grd=ctx.createRadialGradient(50,50,10,45,45,100);
		grd.addColorStop(0,'#eee');
		grd.addColorStop(1,'#ccc');
		ctx.save();
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.fillStyle = grd;
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.restore();
		return canvas.toDataURL();
	}
		
	function saveOptions() {
		localStorage.setItem('options', JSON.stringify(options));
	}
	
	function setView() {
		mute.innerHTML = options.sound ? 'On' : 'Off';
		if (game) {
			var name = 'score' + game.colors,
				total = game.total();
			values.item(0).innerHTML = game.score;
			values.item(1).innerHTML = game.time;
			values.item(2).innerHTML = game.bonus;
			values.item(3).innerHTML = total;
			if (total > options[name]) {
				options[name] = total;
				saveOptions();
			}
		}
		values.item(4).innerHTML = options.score2;
		values.item(5).innerHTML = options.score3;
		values.item(6).innerHTML = options.score4;
	}
	
	colors.push(color(255,0,0,.9));
	colors.push(color(0,0,255,.9));
	colors.push(color(0,192,0,.9));
	colors.push(color(0,255,255,.9));
	board.style.backgroundImage = 'url(' + back() + ')';
	if (sound.readyState) {
		sound.currentTime = .1;
	}
	
	for (var y=0; y<height; y++) {
		for (var x=0; x<width; x++) {
			var em = new Image();
			board.appendChild(em);
			em.className = 'em hide';
			em.style.transform =
			em.style.webkitTransform = 'translate(' + (x * em.width) + 'px,' + ((height - y - 1) * em.height) + 'px)';
			em.ondragstart = function() { return false; };
		}
	}
	
	board.addEventListener('click', function(e) {
		var data = JSON.parse(e.target.getAttribute('data-game'));
		if (data && game.select(data.x, data.y)) {
			render();
			if (options.sound && sound.readyState) {
				sound.currentTime = 0;
				sound.play();
			}
		}
	}, false);
	
	scores.addEventListener('click', function(e) {
		if (this.className == 'show') {
			this.className = '';
			menu.className = 'show';
		}
	}, false);

	menu.addEventListener('click', function(e) {
		var item = e.target.getAttribute('data-item');
		if (this.className == 'show' && item) {
			switch (item) {
				case 'scores':
					this.className = '';
					scores.className = 'show';
					break;
				case 'sound':
					options.sound = !options.sound;
					saveOptions();
					setView();
					break;
				default:
					this.className = '';
					game = new Game(width, height, parseInt(item));
					render();
			}
		}
	}, false);
	
	window.onresize = render;
	
	setView();
	
})();</script>
