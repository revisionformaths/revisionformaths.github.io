<html>
    <head>

    <script>class Player {
    constructor (
        x=0,y=0,height=85,width=40,speed=8
    ) {
        this.x = x
        this.y = y
        this.width = Number(width)
        this.height = Number(height)
        this.screenResized = false
        this.charAlpha = 1; //alpha opacity for player
        this.fillColor = `rgb(225, 237, 232,${this.charAlpha})`
        this.speed = speed
        this.rCollision = [false]
        this.lCollision = [false]
        this.uCollision = [false]
        this.dCollision = [false]
        this.gravityAvailabe = true
        this.jumpHeight = 30
        this.jumpSpeed = 14
        this.inAir = true
        this.jumpPressed = false
        this.charAnimCycle = 0;
        this.deathAnimCycle = 0;
        this.startX = x
        this.startY = y
        this.characterDraw()
        this.isAlive = true
    }
    start() {
        this.addGravity()
        this.borderCollision()
        this.characterDraw()
        this.attachControls()
        this.deathCounter()
    }
    newPos(val,speed=1){
        //1,2,3,4 as URDL
        if(this.isAlive){
            if(val==1 && !this.collisionU){
                this.y -=speed
            }
            if(val==2 && !this.collisionR){
                this.x +=speed
            }
            if(val==3 && !this.collisionD){
                this.y +=speed
            }
            if(val==4 && !this.collisionL){
                this.x -=speed
            }
        }
    }

    borderCollision() {
        if (this.collisionD){
            this.inAir = false
        }
        else {
            this.inAir = true
        }
        if((this.y+this.height) >=newGameArea.height){
            this.isDead()
        }
        if((this.x) <=5){
            this.lCollision[objid+1] = true
        }
        else {
            this.lCollision[objid+1] = false
        }
        if((this.x+this.width) >newGameArea.width-5){
            this.rCollision[objid+1] = true
        }
        else {
            this.rCollision[objid+1] = false
        }
    }
    get collisionL(){
        var len = this.lCollision.length
        var collision = false
        for(var i=0;i<len;i++){
            if(this.lCollision[i]){
                collision = this.lCollision[i]
                break
            }
        }
        return collision
    }
    get collisionR(){
        var len = this.rCollision.length
        var collision = false
        for(var i=0;i<len;i++){
            if(this.rCollision[i]){
                collision = this.rCollision[i]
                break
            }
        }
        return collision
    }
    get collisionU(){
        var len = this.uCollision.length
        var collision = false
        for(var i=0;i<len;i++){
            if(this.uCollision[i]){
                collision = this.uCollision[i]
                break
            }
        }
        return collision
    }
    get collisionD(){
        var len = this.dCollision.length
        var collision = false
        for(var i=0;i<len;i++){
            if(this.dCollision[i]){
                collision = this.dCollision[i]
                break
            }
        }
        return collision
    }
    addGravity() {
        //playerControl.DOWN = this.gravityAvailabe
        if(this.gravityAvailabe){
            this.newPos(3,this.speed*1.75)
        }
    }
    onRight = function(){
        if(playerControl.RIGHT){
            this.newPos(2,this.speed)
        }
    }
    onLeft = function(){
        if(playerControl.LEFT){
            this.newPos(4,this.speed)
        }
    }
    onUp = function(){
        if(!this.gravityAvailabe){
            if(playerControl.UP){
                this.newPos(1,this.speed)
            }
        }
    }
    onDown = function(){
        if(!this.gravityAvailabe){
            if(playerControl.DOWN){
                this.newPos(3,this.speed)
            }
        }
    }
    onJump= async function(){
        if(playerControl.JUMP && this.gravityAvailabe){
            var move = 1;
            if(!this.inAir && !this.jumpPressed && this.collisionD) {
                this.inAir = true
                this.jumpPressed = true
                while(move<this.jumpHeight) {
                    this.newPos(1,this.jumpSpeed)
                    move +=1;
                    await sleep(1)
                }
            }
        }
    }
    attachControls(){
        if(this.isAlive){
            this.onJump()
            this.onRight()
            this.onLeft()
            this.onUp()
            this.onDown()
        }
    }
    isDead(){
        if (this.isAlive){
            deaths++
            this.isAlive = false
            playString()
        }
    }
    deathCounter(){
        ctx.beginPath()
        ctx.lineWidth = "4";
        ctx.strokeStyle = "rgb(225, 237, 232,0.5)";
        ctx.fillStyle = "rgb(225, 237, 232,0.5)"
        ctx.font = 'bold 18px Monospace'
        ctx.fillText('x', 50, 65)
        ctx.fillText('x', 70, 65)
        ctx.font = 'bold 25px "Comic Sans MS", cursive, sans-serif'
        ctx.fillText('x', 100, 70)
        ctx.textAlign = "left"
        ctx.fillText(`${deaths}`, 110, 70)
        ctx.strokeRect(40, 50, 40, 25)
        ctx.stroke()
    }
    characterDraw() {
        var eyePos = this.x
        var eyeSize = [5,2]
        var eyeCycle = 200;
        if(this.charAnimCycle >eyeCycle && this.charAnimCycle <eyeCycle+10){
            eyeSize = [1,0]
            
        }
        else if(this.charAnimCycle > eyeCycle+50){
            this.charAnimCycle = 0
        }
        if(playerControl.LEFT && this.isAlive){
            eyePos = this.x-4
        }
        if(playerControl.RIGHT && this.isAlive){
            eyePos = this.x+4
        }
        if(!this.isAlive){
            this.deathAnimCycle +=1;
            eyeSize = [1,0]
            if(this.deathAnimCycle>0 &&this.deathAnimCycle<50){
                ctx.beginPath()
                ctx.font = 'bold 18px Monospace'
                this.fillColor = `rgb(225, 237, 232,${this.charAlpha})`
                ctx.fillStyle = this.fillColor
                ctx.fillText('x', eyePos+10, this.y+15)
                ctx.fillText('x', eyePos+30, this.y+15)
                this.charAlpha -= 0.01;
                ctx.stroke()
            }
            else if(this.deathAnimCycle >50){
                /*this.x = this.startX
                this.y = this.startY*/
                level.start()
                this.deathAnimCycle = 0
                this.isAlive = true
                this.charAlpha = 1
                this.fillColor = `rgb(225, 237, 232,${this.charAlpha})`
            }
        }
        this.charAnimCycle += 1;
        ctx.lineWidth = 4
        ctx.strokeStyle = this.fillColor
        //head
        ctx.strokeRect(this.x, this.y, 40, 25)
        ctx.fillStyle = this.fillColor;
        //body
        ctx.fillRect(this.x, this.y+25, 40, 35);
        //legs
        ctx.fillRect(this.x+5, this.y+60, 10, 20);
        ctx.fillRect(this.x+25, this.y+60, 10, 20);
        //eye
        ctx.beginPath()
        ctx.ellipse(eyePos+10, this.y+10, eyeSize[0], eyeSize[1], Math.PI / 2, 0, 2 * Math.PI);
        ctx.fill()
        ctx.stroke()
        ctx.beginPath()
        ctx.ellipse(eyePos+30, this.y+10,eyeSize[0], eyeSize[1], Math.PI / 2, 0, 2 * Math.PI);
        ctx.fill()
        ctx.stroke()

    }
}</script>
    <script>class ObjectMaterial {
    constructor (
        x=0,y=0,width=50,height=50,name,material=0,id=0,movingX=false,movingY=false,startX=null,startY=null,endX=null,endY=null,mSpeed=0,reverse=false,fillColor="rgb(225, 237, 232)"
    ){
        this.id = id
        this.x = x
        this.name = name
        this.y = y
        this.isMovingX = movingX
        this.isMovingY = movingY
        this.startX = startX
        this.startY = startY
        this.endX = endX
        this.endY = endY
        this.mSpeed = mSpeed
        this.reverse = reverse
        this.width = width
        this.height = height
        this.material = material
        this.fillColor = fillColor
        this.collision = [false,false,false,false] //URDL
        this.playerKeyHistory = [false,false,false,false] //LURD
        this.objectAnimeCycle = [startX - 1,startY - 1]
        this.objectAnimeCycleStart = [false,false]
        this.key = Math.floor(Math.random() * 10)
        this.flagTouched = false
        this.flagYpos = this.y
        this.enteredKey = [] //for key entered in winning point
        this.winningPointText = "Waiting"
        this.requestNextLevel = false
        this.requestNextLevelFailed = false
    }
    objectInit(){
        this.objectDraw()
            switch(this.material){
                case -1:
                    this.nearObjectEffectDeath()
                    break
                case 0:
                    this.checkCollision()
                    break
                case 1:
                    this.nearObjectEffectKey()
                    break
                case 2:
                    this.nearObjectEffectFinishPoint()
                    break
            }
    }
    nonPlatformObjectInit(){
        
    }
    nearObjectEffectKey(){
        if(this.actualCollision()){
            ctx.beginPath()
            ctx.font = 'bold 15px "Comic Sans MS", cursive, sans-serif'
            this.fillColor = `#42f5a1`
            ctx.fillStyle = this.fillColor
            if(!playerControl.ENTER){
                ctx.textAlign = "center"
                ctx.fillText('Press Enter!', this.x, this.y-50)
                ctx.fill()
            }
            else {
                if(!this.flagTouched){
                    playString("flag")
                    level.nextLevelKey.push(this.key)
                    this.flagTouched = true
                }
                ctx.fillText(this.key, this.x, this.y-50)
                ctx.fill()
            }
        }
    }
    nearObjectEffectFinishPoint(){
        ctx.beginPath()
        if(this.actualCollision(30) && !this.requestNextLevel){
            document.addEventListener("keydown",this.winningPointKeyInput, false);
            document.Object = this
            ctx.beginPath()
            ctx.font = 'bold 15px "Comic Sans MS", cursive, sans-serif'
            //this.fillColor = `#42f5a1`
            ctx.fillStyle = this.fillColor
            ctx.beginPath();
            ctx.lineWidth = 3
            ctx.moveTo(this.x+20, this.y+45);
            ctx.lineTo(this.x+80, this.y+45);
            ctx.fillText('***', this.x+50, this.y+25)
            ctx.fillText(this.enteredKeyVal, this.x+50, this.y+40)
            ctx.stroke();
            ctx.fillText('Enter the codes', this.x+this.width/2, this.y-50)
            if(playerControl.ENTER){
                if (this.enteredKey.length !=0 && level.nextLevelKey.length!=0 && !this.requestNextLevel){
                    this.requestNextLevel = true
                    this.winningPointText = "Fetching"
                    if(JSON.stringify(this.enteredKey)==JSON.stringify(level.nextLevelKey) && this.enteredKey.length == level.totalFlags){
                        setTimeout(()=>{
                            this.winningPointText = "Loading"
                            setTimeout(()=>{
                                level = LevelGenerator(level.nextLevel)
                            },1000)
                        },1000)
                    }
                    else{
                        setTimeout(()=>{
                            this.requestNextLevelFailed = true
                            setTimeout(()=>{
                                level = LevelGenerator(level.name)
                            },1000)
                        },1000)
                    }
                }
            }
            ctx.fill()
            ctx.stroke()
        }
        else {
            document.removeEventListener("keydown",this.winningPointKeyInput, false);
            ctx.fillStyle = "rgb(225, 237, 232)"
            ctx.font = 'bold 12px "Lucida Console", Monaco, monospace'
            if(!this.requestNextLevelFailed){
                ++this.objectAnimeCycle[0]
                ctx.fillText(`${level.name}`, this.x+50, this.y+30)
                if(this.objectAnimeCycle[0]>50 && this.objectAnimeCycle[0]<100){
                    ctx.fillText(`${this.winningPointText}..`, this.x+50, this.y+45)
                }
                else if(this.objectAnimeCycle[0]>=100 && this.objectAnimeCycle[0]<150) {
                    ctx.fillText(`${this.winningPointText}...`, this.x+50, this.y+45)
                }
                else {
                    ctx.fillText(`${this.winningPointText}....`, this.x+50, this.y+45)
                }
                if (this.objectAnimeCycle[0]>150){
                    this.objectAnimeCycle[0]=0
                }
            }
            else{
                ctx.fillText(`Not Found!`, this.x+50, this.y+30)
            }
            ctx.fill()
            ctx.stroke()
        }
    }
    winningPointKeyInput(event){
        const key = event.key
        const keyPas = parseInt(key)
        const object = event.currentTarget.Object
        if (Number.isInteger(keyPas) && object.enteredKey.length <4){
            object.enteredKey.push(keyPas)
            playString("keyPress")
        }
        else if(key == "Backspace"){
            object.enteredKey.pop()
        }
    }
    get enteredKeyVal() {
        var str = ""
        for(var i=0;i<this.enteredKey.length;i++){
            if(i==this.enteredKey.length-1){
                str += this.enteredKey[i]
            }
            else {
                str += this.enteredKey[i]+" "
            }
        }
        return str
    }
    nearObjectEffectDeath(){
        if(this.actualCollision()){
            player.isDead()
        }
    }
    keyFlagPoint(){
        //ObjectMaterial(50,550,50,90,"star",objid++,1)
        if(this.flagTouched){
            if(this.objectAnimeCycle[0]<this.height-40){
                this.flagYpos += 1
                this.objectAnimeCycle[0]++
            }
        }
        ctx.beginPath()
        ctx.moveTo(this.x, this.y); 
        ctx.lineTo(this.x, this.y+this.height);
        ctx.ellipse(this.x, this.y+5, 2, 2, Math.PI / 2, 0, 2 * Math.PI);
        ctx.ellipse(this.x, this.y+this.height, 2, 5, Math.PI / 2, 0, 2 * Math.PI);
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#ddd";
        ctx.fillStyle = "#ddd"
        ctx.stroke();
        //flag triangle
        ctx.beginPath();
        ctx.moveTo(this.x, this.flagYpos+10);
        ctx.lineTo(this.x, this.flagYpos+40);
        ctx.lineTo(this.x+this.width, this.flagYpos+25);
        ctx.fill();
    }
    checkMoving(){
        if(this.isMovingX){
            if(!this.objectAnimeCycleStart[0]^this.reverse){
                this.x +=this.mSpeed
            }
            else {
                this.x -=this.mSpeed
            }
            if(!this.objectAnimeCycleStart[0]){
                this.objectAnimeCycle[0] +=this.mSpeed
            }
            else {
                this.objectAnimeCycle[0]-=this.mSpeed
            }
            if(this.objectAnimeCycle[0] <this.startX){
                this.objectAnimeCycleStart[0] = false
            }
            else if(this.objectAnimeCycle[0]>=this.endX){
                this.objectAnimeCycleStart[0] = true
            }
            
        }
        if(this.isMovingY){
            if(!this.objectAnimeCycleStart[1]^this.reverse){
                this.y +=this.mSpeed
            }
            else {
                this.y -=this.mSpeed
            }
            if(!this.objectAnimeCycleStart[1]){
                this.objectAnimeCycle[1] +=this.mSpeed
            }
            else {
                this.objectAnimeCycle[1]-=this.mSpeed
            }
            if(this.objectAnimeCycle[1] <this.startY){
                this.objectAnimeCycleStart[1] = false
            }
            else if(this.objectAnimeCycle[1]>=this.endY){
                this.objectAnimeCycleStart[1] = true
            }
            
        }
    }
    drawPlatform(){
        this.checkMoving()
        ctx.beginPath()
        ctx.fillStyle = this.fillColor;
        ctx.fillRect(this.x, this.y, this.width, this.height)
        ctx.fill()
        ctx.stroke();
        ctx.beginPath()
        ctx.lineWidth = 5
        ctx.strokeStyle = "#f24d1b";
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y+this.height);
        ctx.moveTo(this.x+this.width, this.y);
        ctx.lineTo(this.x+this.width, this.y+this.height);
        ctx.stroke();

    }
    winningPoint(){
        ctx.beginPath()
        ctx.lineJoin = "round";
        ctx.strokeStyle = this.fillColor
        ctx.fillStyle = "#ddd"
        ctx.lineWidth = 8
        ctx.strokeRect(this.x, this.y, this.width, this.height)
        ctx.stroke()
        ctx.textAlign = 'center';
        ctx.beginPath()
        ctx.fillRect(this.x, this.y+(this.height/2)+20, this.width, this.height/4)
        ctx.beginPath()
        ctx.fillStyle = "rgb(59, 59, 59)"
        ctx.ellipse(this.x+this.width/2, this.y+this.height-12, 10, 10, Math.PI / 2, 0, 2 * Math.PI);
        ctx.fill()
        ctx.stroke()
    }
    objectDraw(){
        switch(this.material){
            case -1:
                this.drawPlatform()
                break
            case 0:
                this.drawPlatform()
                break
            case 1:
                this.keyFlagPoint()
                break
            case 2:
                this.winningPoint()
                break
        }
    }
    get isColliding(){
        var c = false
        for(var i=0;i<4;i++){
            if(this.collision[i]){
                c = true
                break
            }
        }
        return c
    }
    storeKeyHistory(){
        //LURD
        if(!this.playerKeyHistory[0]){
            if(this.isMovingX){
                this.playerKeyHistory[0] = playerControl.LEFT || (!this.objectAnimeCycleStart[0]^this.reverse)
            }
            else {
                this.playerKeyHistory[0] = playerControl.LEFT
            }
        }
        if(!this.playerKeyHistory[1]){
            if(this.isMovingY){
                this.playerKeyHistory[1] = (playerControl.UP || playerControl.JUMP) || (!this.objectAnimeCycleStart[1]^this.reverse)
            }
            else {
                this.playerKeyHistory[1] = playerControl.UP || playerControl.JUMP
            }
        }
        if(!this.playerKeyHistory[2]){
            if(this.isMoving){
                this.playerKeyHistory[2] = playerControl.RIGHT || (this.objectAnimeCycleStart[0]^this.reverse)
            }
            else {
                this.playerKeyHistory[2] = playerControl.RIGHT
            }
        }
        if(!this.playerKeyHistory[3]){
            if(this.isMovingY){
                this.playerKeyHistory[3] = (playerControl.DOWN || player.gravityAvailabe) || (this.objectAnimeCycleStart[1]^this.reverse)
            }
            else {
                this.playerKeyHistory[3] = playerControl.DOWN || player.gravityAvailabe
            }
        }
    }
    objYbound(val=0){
        if(player.y+player.height>this.y-val && player.y<this.y+this.height+val){
            return true
        }
        else {
            return false
        }
    }
    objXbound(val=0){
        if(player.x+player.width>=this.x - val && player.x<=this.x+this.width + val){
            return true
        }
        else {
            return false
        }
    }
    actualCollision(x=0){
        return this.objXbound(x) && this.objYbound(x)
    }
    restoreKeyHist(val){
        var i = 4
        while(i>=0){
            if(i!=val){
                this.playerKeyHistory[i]=false
            }
            i--
        }
    }
    checkCollision(x=player.x,y=player.y){
        this.storeKeyHistory()
        if(!this.isColliding &&player.isAlive){
            //if not colliding check for collision
            if(x+player.width>=this.x && x<=this.x+this.width){
                if(y<=this.y+this.height && y>=this.y && this.playerKeyHistory[1]){
                    //D collision
                    this.collision[2] = true
                    //console.log("collision D ",this.name)
                }
                else if (y+player.height>=this.y &&y+player.height<=this.y+this.height && this.playerKeyHistory[3]){
                    //U collision
                    this.collision[0] = true
                    //console.log("collision U ",this.name)
                }
            }
            if(y+player.height>=this.y+30 && y<=this.y+this.height) {
                if (x+player.width>this.x && x+player.width<this.x+this.width){
                }
                if(this.playerKeyHistory[2] && x+player.width>this.x && x+player.width<this.x+this.width){
                    //L collision
                    //this.collision[3] = true
                    //killing the player if touched right or left
                    player.isDead()
                    //console.log("collision L ",this.name) 
                }
                else if(this.playerKeyHistory[0] && x<this.x+this.width && x>this.x){
                    //R collision
                    //killing the player if touched right or left
                    player.isDead()
                    //this.collision[1] = true
                    //console.log("collision R ",this.name)
                }
            }
        }
        else {
            if(((x+player.width<this.x && this.playerKeyHistory[0]) || !this.objYbound()) && player.rCollision[this.id]){
                //L collision
                this.collision[3] = false
                //console.log("decollision L ",this.name) 
            }
            if(((x>this.x+this.width && this.playerKeyHistory[2]) || !this.objYbound()) && player.lCollision[this.id]){
                //R collision
                this.collision[1] = false
                //console.log("decollision R ",this.name)
            }
            if (((y+player.height<=this.y && (this.playerKeyHistory[1])) || !this.objXbound()) && player.dCollision[this.id]){
                //U collision
                this.collision[0] = false
                //console.log("decollision U ",this.name,this.id)
            }
            if(((y>=this.y+this.height && this.playerKeyHistory[3]) || !this.objXbound()) && player.uCollision[this.id]){
                //D collision
                this.collision[2] = false
                //console.log("decollision D ",this.name)
            }
            player.lCollision[this.id] = this.collision[1]
            player.rCollision[this.id] = this.collision[3]
            player.dCollision[this.id] = this.collision[0]
            player.uCollision[this.id] = this.collision[2]
        }
        this.restoreKeyHist()
        if(!player.isAlive){
            for(var i=0;i<4;i++){
                this.collision[i] = false
            }
        }
        //making players leg on ground if inside
        if (player.dCollision[this.id] && player.isAlive){
            if (y+player.height>this.y){
                player.y = this.y - player.height + player.speed
            }
        }
    }
}</script>
    <script>/**
 * screensize width=1300,height=700
 * height and width of player = 85,40
 * flag w,h = 50,90
 * winning point w,h = 100,80
 */
/**
 * Reverse start value is start point and endx will be point start-(end-start)
 * platform = color:"rgb(225, 237, 232)"
 * deathMaterial = color:"#f24d1b"
 * {
                x:1000,
                y:150,
                width:50,
                height:50,
                material:-1,
                movingX:true,
                movingY:false,
                startX:1000,
                startY:100,
                endX:1800,
                endY:400,
                mSpeed:30,
                reverse:true,
                color:"#f24d1b"
            },
 */
var levels = {
    Level1:{
        nextLevel:"Level2",
        startX:100,
        startY:415,
        Objects:{
            floor:{
                x:0,
                y:500,
                width:1300,
                height:80,
                material:0,
                color:"rgb(225, 237, 232)"
            },
            flag:{
                x:50,
                y:410,
                width:50,
                height:90,
                material:1
            },
            winningSpot:{
                x:1100,
                y:420,
                width:100,
                height:80,
                material:2
            }
        }
    },
    Level2:{
        nextLevel:"Level3",
        startX:150,
        startY:555,
        Objects:{
            p1:{
                x:10,
                y:640,
                width:280,
                height:60,
                material:0,
                color:"rgb(225, 237, 232)"
            },
            p2:{
                x:450,
                y:540,

function LevelGenerator(level="Level1"){
    if(level != "GameOver"){
        var screenLoader = document.getElementById("screenLoader")
        if(gameStarted){
            screenLoader.style.animation = "fadeIn 1s ease-in"
            screenLoader.style.display = "block"
        }
        player = new Player()
        var object_id = 0
        var flags = 0
        var objectArr = []
        var startX = levels[level].startX
        var startY = levels[level].startY
        var Objects = levels[level].Objects
        for (object in Objects){
            var objectGen = new ObjectMaterial(Objects[object].x,Objects[object].y,Objects[object].width,Objects[object].height,object,Objects[object].material,object_id++,Objects[object].movingX,Objects[object].movingY,Objects[object].startX,Objects[object].startY,Objects[object].endX,Objects[object].endY,Objects[object].mSpeed,Objects[object].reverse,Objects[object].color)
            objectArr.push(objectGen)
            if(Objects[object].material == 1){
                flags++
            }
        }
        var level = new gameLevel(startX,startY,objectArr,player,levels[level].nextLevel,level,flags)
        if(gameStarted){
            screenLoader.style.animation = "fadeOut 1s ease-in"
            setTimeout(()=>{
                screenLoader.style.display = "none"
            },1000)
        }
        return level
    }
    else {
        document.getElementById("screenLoader").style.opacity = 1
        var screenLoader = document.getElementById("endScreen")
        endScreen.style.animation = "fadeIn 1s ease-in"
        endScreen.style.display = "flex"
        return null
    }
}
class gameLevel {
    constructor (
        startX,startY,objects,player,nextLevel,name,totalFlags
    ){
        this.startX = startX
        this.startY = startY
        this.objects = objects
        this.player = player
        this.nextLevelKey = []
        this.nextLevel = nextLevel
        this.name = name
        this.totalFlags = totalFlags
        this.start()
    }
    start(){
        this.player.x = this.startX
        this.player.y = this.startY
    }
    playLevel(){
        this.objects.forEach((object)=>{
            object.objectInit()
        })
    }

        if(key=="Enter"){
            playerControl.ENTER = true
        }
    }
    else {
        if(key=="Enter"){
            document.getElementById("screenLoader").style.animation = "fadeOut2 0.5s ease-in"
            document.getElementById("startScreen").style.animation = "fadeOut 0.5s ease-in"
            setTimeout(()=>{
                document.getElementById("screenLoader").style.display = "none"
                document.getElementById("startScreen").style.display = "none"
            },500)
            gameStarted = true
        }
    }
    
}
function playerControlKeyReleased(event){
    const key = event.key
    if(key == "ArrowRight" || key == "D" || key == "d"){
        playerControl.RIGHT = false
    }
    if(key == "ArrowLeft" || key == "A" || key == "a"){
        playerControl.LEFT = false
    }
    if(key == "ArrowUp" || key == "W" || key == "w"){
        if(!player.gravityAvailabe){
            playerControl.UP = false
        }
    }
    if(key == "ArrowDown" || key == "s" || key == "S"){
        playerControl.DOWN = false
    }
    if(key == " "){
        playerControl.JUMP = false
        player.jumpPressed = false
    }
    if(key=="Enter"){
        playerControl.ENTER = false
    }
}

class gameArea {
    constructor (
        width=1300,height=700,color="rgb(59, 59, 59)"
    ) {
        this.color = color
        this.width = width
        this.height = height
        this.start()
    }
    resizeGame() {
        var gameAreaBody = document.getElementById('gameArea');
        var widthToHeight = 16 / 9;
        var newWidth = window.innerWidth;
        var newHeight = window.innerHeight;
        var newWidthToHeight = newWidth / newHeight;
        
        if (newWidthToHeight > widthToHeight) {
            newWidth = newHeight * widthToHeight;
            gameAreaBody.style.height = newHeight + 'px';
            gameAreaBody.style.width = newWidth + 'px';
        } else {
            newHeight = newWidth / widthToHeight;
            gameAreaBody.style.width = newWidth + 'px';
            gameAreaBody.style.height = newHeight + 'px';
        }
        
        gameAreaBody.style.marginTop = (-newHeight / 2) + 'px';
        gameAreaBody.style.marginLeft = (-newWidth / 2) + 'px';
    }
    start() {
        this.canvas = gameCanvas
        this.resizeGame()
        this.canvas.style.backgroundColor = this.color
        this.canvas.width = this.width
        this.canvas.height = this.height
        this.context = this.canvas.getContext("2d")
        this.context.imageSmoothingEnabled = false
    }
    clear() {
        if(screenResized){
            screenResized = false
            this.resizeGame()
        }
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
}
function updateGameArea() {
    newGameArea.clear()
    if (level !=null){
        level.playLevel()
        player.start()
    }
    window.requestAnimationFrame(updateGameArea)
}

    var flagTouch = "[0,,0.0154,0.538,0.329,0.5342,,,,,,0.4599,0.6024,,,,,,1,,,,,0.52]"
    if (name =="death"){
        str = "[1,,0.0404,,0.2501,0.6364,,-0.4971,,,,,,,,,,,1,,,0.2928,,0.5]"
    }
    else if(name == "keyPress"){
        str = "[0,,0.0185,0.5339,0.1614,0.28,0.16,,,,,,,,,,,,1,,,,,0.52]"
    }
    else if(name=="flag"){
        str = flagTouch
    }
    var temp = str.split(",");
    var params = new Array();
    for(var i = 0; i < temp.length; i++) {
        params[i] = parseFloat(temp[i]);
    }
    playSound(params);
