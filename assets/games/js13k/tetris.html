.container {}

*
*/

  <script type="text/javascript">var Game = (function() {
  var Game = function() {};

  Game.prototype.init = function(container, control, menu, width, height, speed, views) {
    this.container = container;
    this.control = control;
    this.menu = menu;

    this.view = views.target;
    this.combo = new Combo();
    this.combo.bind(views.energy, views.score);
    this.container.bind(views.next);
    this.menu.bind(this, views.menu);

    this.container.init(this, width, height, speed);
    this.control.init(this);

    this.speed = speed;
    this.running = false;
  };

  Game.prototype.restart = function() {
    this.container.restart();
    this.combo.reset();
  };

  Game.prototype.start = function() {
    var game = this;
    this.running = true;
    this.frame = window.requestAnimationFrame(function() {
      game.step();
    });
  };
  Game.prototype.stop = function() {
    this.running = false;
  };
  Game.prototype.lose = function() {
    this.menu.show('end');
    this.stop();
  };
  Game.prototype.step = function() {
    var game = this;
    if (!this.running)
      return;
    this.container.update();
    // use closure, because bind is slower
    this.frame = window.requestAnimationFrame(function() {
      game.step();
    });
  };
  return Game;
})();
</script>
  <script type="text/javascript">var Container = (function() {
  var Container = function() {};

  Container.prototype.init = function(game, width, height, fallSpeed) {
    this.game = game;
    this.width = width ? width : this.width;
    this.height = height ? height : this.height;
    this.map = this.makeMap(width, height);
    this.fallSpeed = this.OriginalSpeed = fallSpeed ? fallSpeed : this.fallSpeed;
    this.noOfDropTetris = 0;
    this.drawContainer();
    // test
    this.nextTetris = new Tetris(this, 3, 3, Math.random());
    this.dropTetris(new Tetris(this, 3, 3, Math.random()));
    //
  };
  Container.prototype.restart = function() {
    var newMap = this.makeMap(this.width, this.height);
    this.map.forEach(function(y, yIndex) {
      y.forEach(function(x, xIndex) {
        newMap[yIndex][xIndex].view = x.view;
        newMap[yIndex][xIndex].view.classList.forEach(function(cls) {
          if (cls != "container__block") {
            newMap[yIndex][xIndex].view.classList.remove(cls);
          }
        })
      })
    })
    this.map = newMap;
    this.noOfDropTetris = 0;
    this.refreshView(false);
    this.clean();
    // test
    this.nextTetris = new Tetris(this, 3, 3, Math.random());
    this.dropTetris(new Tetris(this, 3, 3, Math.random()));
    //
  };

  Container.prototype.bind = function(nextBlocksView) {
    this.nextBlocksView = nextBlocksView;
  };

  Container.prototype.update = function() {
    this.clean();
    this.game.combo.decreaseEnergy(0.001);
    if (this.curTetris.update(this.fallSpeed)) {
      // true means hit
      // time to have next tetris
      if (!this.fillTetris(this.curTetris))
        return;
      this.dropTetris(new Tetris(this, 3, 3, Math.random()));
      this.removeCompletedRows();
      if (this.game.combo.increaseEnergy(0.2)) {
        // true means reach limit
        // time to explode
        this.collapse();
      }
    };
    this.curTetris.draw(this);
  };
  Container.prototype.clean = function() {
    this.map.forEach(function(row) {
      row.forEach(function(block) {
        var color = block.color;
        block.view.classList.remove('container__block--tetris--' + color);
      })
    })
  };
  Container.prototype.makeMap = function(width, height) {
    var map = [];
    var y = 0;
    while (y < height) {
      var x = 0;
      map[y] = [];
      while (x < width) {
        map[y][x] = {
          color: null,
          view: null,
          occupy: 0
        }; // 0: unoccupied
        ++x;
      }
      ++y;
    }
    return map;
  };
  Container.prototype.reverse = function() {
    var cur = this.curTetris;
    var hasTetris = false;
    this.map.forEach(function(y, i) {
      var blocks = y.reduce(function(memo, element, index, array) {
        return memo + element.occupy;
      }, 0);
      if (blocks > 0 && !hasTetris) {
        var tetrisHeight = cur.occupy[2].length == 0 ? 2 : 3;
        if (cur.position.y + tetrisHeight >= i) {
          hasTetris = true;
          return;
        }

        y.map(function(element) {
          // reverse
          element.occupy = (1 - element.occupy);
          return element;
        })
      }
    });
    this.refreshView(false);
  };

  Container.prototype.dropTetris = function(tetris) {
    this.curTetris = this.nextTetris;
    this.nextTetris = tetris;
    var container = this;
    container.release();
    [].forEach.call(container.nextBlocksView, function(e) {
      e.classList.remove('sidebar__element__next__block--fill');
    });
    tetris.occupy.forEach(function(row, index) {

        row.forEach(function(element) {
          var value = element + index * 3;
          container.nextBlocksView[value].classList.add('sidebar__element__next__block--fill');
        })
      })
      ++container.noOfDropTetris;
    container.fallSpeed = 30 - Math.sqrt(container.noOfDropTetris);
    container.OriginalSpeed = container.fallSpeed;

  };

  Container.prototype.fillTetris = function(tetris) {
    var areas = tetris.getArea();
    var container = this;
    var isContinue = true;
    areas.forEach(function(area) {
      if (area.y === 0) {
        container.hitCeil();
        isContinue = false;
      }
      container.map[area.y][area.x].occupy = 1;
      container.map[area.y][area.x].view.classList.add('container__block--occupy')
    });
    container.game.combo.increaseScore(2 * Math.floor(30 - container.OriginalSpeed));
    container.refreshView(true);
    return isContinue;
  };

  Container.prototype.hitCeil = function() {
    this.game.lose();
  };

  Container.prototype.removeCompletedRows = function() {
    var container = this;
    this.map.forEach(function(y, yIndex) {
      var blocks = y.reduce(function(memo, element, index, array) {
        return memo + element.occupy;
      }, 0);
      if (blocks === container.width) {
        y.map(function(element) {
          // reverse
          element.occupy = 0;
          return element;
        });
        container.downOneRow(yIndex);
        container.game.combo.increaseEnergy(2);
        container.game.combo.increaseScore(10);
      }
    });
    this.refreshView(true);
  };

  Container.prototype.downOneRow = function(rowNo) {
    var map = this.map;
    var yIndex = rowNo - 1;
    for (yIndex; yIndex > 0; --yIndex) {
      map[yIndex].forEach(function(element, xIndex) {
        map[yIndex + 1][xIndex].occupy = element.occupy;
      })
    }
  };

  Container.prototype.collapse = function() {
    var block;
    var container = this;
    var game = this.game;
    game.stop();
    block = this.map.reduce(function(outerMemo, ele, outerIndex) {
      ele.reduce(function(innerMemo, ele, innerIndex) {
        if (ele.occupy === 1)
          innerMemo.push({
            x: innerIndex,
            y: outerIndex,
            tetris: ele
          });
        return innerMemo;
      }, outerMemo);
      return outerMemo;
    }, [])
    block = block.reverse();
    var blockIndex = 0;
    var element = block[blockIndex];
    var x = element.x;
    var y = element.y;
    var tetris = element.tetris;
    var curTetris = tetris;
    var nextTetris = container.map[y][x];

    function drop() {
      tetris.occupy = 0;
      container.refreshView(false);
      if (y <= container.height && nextTetris.occupy === 0) {
        curTetris.occupy = 0;
        curTetris = nextTetris;
        nextTetris = (y < container.height) ? container.map[y][x] : null;
        ++y;
      } else {
        ++blockIndex;
        if (blockIndex === block.length) {
          container.refreshView(false);
          container.removeCompletedRows();
          game.start();
          return;
        }
        element = block[blockIndex];
        x = element.x;
        y = element.y;
        tetris = element.tetris;
        curTetris = tetris;
        nextTetris = container.map[y][x];

      }
      curTetris.occupy = 1;
      window.requestAnimationFrame(drop);
    }
    window.requestAnimationFrame(drop);

    this.game.combo.clear();
  };

  Container.prototype.refreshView = function(animated) {
    this.map.forEach(function(y) {
      y.forEach(function(block) {
        if (block.occupy === 0 && block.view.classList.contains('container__block--occupy')) {
          if (animated) {
            block.view.addEventListener("animationend", function(e) {
              block.view.classList.remove('container__block--occupy');
              block.view.classList.remove('container__block--occupying');
            }, false);
            block.view.classList.add('container__block--occupying');
          } else {
            block.view.classList.remove('container__block--occupy');
          }
        } else if (block.occupy != 0 && !block.view.classList.contains('container__block--occupy')) {
          block.view.classList.add('container__block--occupy');
        }
      })
    })
  };

  Container.prototype.rush = function() {
    if (!this.OriginalSpeed)
      this.OriginalSpeed = this.fallSpeed;
    this.fallSpeed = this.fallSpeed / 5;
  };

  Container.prototype.release = function() {
    this.fallSpeed = this.OriginalSpeed;
  };

  Container.prototype.drawContainer = function() {
    var view = this.game.view;

    function newDiv(classes) {
      var div = document.createElement('div');
      classes.forEach(function(c) {
        div.classList.add(c);
      });
      return div;
    }

    var divContainer = newDiv(['container']);
    this.map.forEach(function(row) {
      var divRow = newDiv(['container__row', 'clearfix']);
      row.forEach(function(column) {
        var divBlock = newDiv(['container__block']);
        divRow.appendChild(divBlock);

        column.view = divBlock;
      })
      divContainer.appendChild(divRow);
    })
    view.appendChild(divContainer);
  };
  return Container;
})();
</script>
  <script type="text/javascript">var Tetris = (function() {

  var TetrisShape = [
    [
      [0, 1],
      [1],
      [1]
    ],
    [
      [0, 1],
      [0],
      [0]
    ],
    [
      [0, ],
      [0, 1, 2],
      []
    ],
    [
      [2],
      [0, 1, 2],
      []
    ],
    [
      [0, 1, 2],
      [0],
      []
    ],
    [
      [0, 1, 2],
      [2],
      []
    ],
    [
      [0, 1],
      [1, 2],
      []
    ],
    [
      [0],
      [0],
      [0, 1]
    ],
    [
      [0, 1],
      [0],
      [0]
    ],
    [
      [1, 2],
      [0, 1],
      []
    ],
    [
      [1],
      [1],
      [1],
    ],
  ];

  var TetrisShape2 = [[
  [0,1,2]
  ]];

  var tetrisColor = [
    'red',
    'orange',
    'yellow',
    'green',
    'blue',
    'purple'
  ]
  var Tetris = function(container, width, height, type) {
    this.container = container;
    this.occupy = TetrisShape[Math.floor(type * TetrisShape.length)];
    this.width = width;
    this.height = height;
    this.counter = 0;
    this.color = null;
    var r = Math.floor(Math.random() * (this.container.width - this.width + 1))
    this.setInitPosition(r, 0);
    // this.setInitPosition(0, 0);
  };

  Tetris.prototype.setInitPosition = function(x, y) {
    this.position = {
      x: x,
      y: y
    }
  };

  Tetris.prototype.getArea = function() {
    var tetris = this;
    var totalArea = [];
    this.occupy.forEach(function(x, i) {
      x.forEach(function(block) {
        var area = {};
        area.x = tetris.position.x + block;
        area.y = tetris.position.y + i;
        totalArea.push(area);
      })
    });
    return totalArea;
  };

  Tetris.prototype.draw = function(container) {
    var view = container.game.view;
    var width = container.width;
    var height = container.height;
    var areas = this.getArea()
      // console.log('=== draw tetris ===')
    var blocks = view.querySelectorAll('.container__block');
    var color;
    if (!this.color)
      color = this.color = tetrisColor[Math.floor(Math.random() * tetrisColor.length)];
    else
      color = this.color;
    areas.forEach(function(area) {
      container.map[area.y][area.x].color = color;
      container.map[area.y][area.x].view.classList.add('container__block--tetris--' + color);
    })
  };


  Tetris.prototype.update = function(fallSpeed) {
    // console.log('=== update tetris ===');
    if (++this.counter >= fallSpeed) {
      this.counter = 0;
      return this.fall();
    }
  };

  Tetris.prototype.fall = function() {
    ++this.position.y;

    // get temp next position,
    // for determining if it will hit blocks
    if (this.isHitWall() || this.isHitBlocks()) {
      --this.position.y;
      return true;
    }
    return false;
  };

  Tetris.prototype.slide = function(direction) {
    this.position.x += direction;
    if (this.isHitWall() || this.isHitBlocks()) {
      this.position.x -= direction;
      return true;
    }
    return false;
  };


  Tetris.prototype.isHitBlocks = function() {
    var map = this.container.map;
    var areas;
    var isHit = false;

    areas = this.getArea();

    areas.forEach(function(area) {
      if (map[area.y][area.x].occupy === 1)
        isHit = true;
    })
    return isHit;


  };

  Tetris.prototype.isHitWall = function() {
    var areas = this.getArea();
    var container = this.container;
    var isHit = false;
    areas.forEach(function(area) {
      if (area.y >= container.height ||
        area.x >= container.width ||
        area.x < 0) {
        isHit = true;
        return;
      }
    })
    return isHit;
  };

  return Tetris;

})();
</script>
  <script type="text/javascript">var Control = (function() {
  var Control = function() {};

  Control.prototype.LEFT = 37;
  Control.prototype.RIGHT = 39;
  Control.prototype.DOWN = 40;
  Control.prototype.ESC = 27;
  Control.prototype.R = 82;
  Control.prototype.SPACE = 32;

  Control.prototype.init = function(game) {
    this.game = game;
    this.keyDownHandler(game);
  };

  Control.prototype.keyDownHandler = function(game) {
    var tetris = game.container.curTetris;
    var control = this;
    window.addEventListener('keydown', function(e) {
      if (!game.running)
        return;
      if (e.keyCode === control.LEFT) {
        game.container.curTetris.slide(-1);
      } else if (e.keyCode === control.RIGHT) {
        game.container.curTetris.slide(1);
      } else if (e.keyCode === control.DOWN) {
        game.container.rush();
      } else if (e.keyCode === control.R) {
        game.container.reverse();
      } else if (e.keyCode === control.SPACE) {
        game.container.reverse();
      } else if (e.keyCode === control.ESC) {
        game.stop();
        game.menu.show();
      }
    });
    window.addEventListener('keyup', function(e) {
      if (e.keyCode === control.DOWN) {
        game.container.release();
      }
    });
  };

  return Control;


})();
</script>
  <script type="text/javascript">var Combo = (function() {
	var energyLimit = 10;

	var Combo = function() {
		this.energy = 0;
		this.score = 0;
		this.deceaseSpeed = 30;
		this.decreaseIndex = 0;
	};

	Combo.prototype.reset = function() {
		this.score = 0;
		this.energy = 0;
		this.show();
	};

	Combo.prototype.increaseScore = function(no) {
		this.score += no;
		this.show();
	};

	Combo.prototype.increaseEnergy = function(no) {
		if (this.energy >= energyLimit)
			return true;
		this.energyBar.classList.remove('slow-transible');
		this.energy += no;
		this.show();
		return false;
	};
	Combo.prototype.decreaseEnergy = function(no) {
		if (++ this.decreaseIndex < 3 || this.energy <= 0)
			return;
		this.energyBar.classList.remove('slow-transible');
		this.decreaseIndex = 0;
		this.energy -= no;
		this.show();
	};

	Combo.prototype.clear = function() {
		this.energy = 0;
		this.energyBar.classList.add('slow-transible');
		this.show();
	};


	Combo.prototype.bind = function(energyBar, scorePanel) {
		this.energyBar = energyBar;
		this.scorePanel = scorePanel;
	};
	Combo.prototype.show = function() {
		this.energyBar.style.width = this.energy * 17 + 'px';
		this.scorePanel.textContent = this.score;
	};

	return Combo;
})();
</script>
