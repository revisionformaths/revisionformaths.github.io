<script>function resizeGame() {
    var gameArea = document.getElementById('gameArea');
    var widthToHeight = 1;
    var newWidth = window.innerWidth;
    var newHeight = window.innerHeight;
    var newWidthToHeight = newWidth / newHeight;
    
    if (newWidthToHeight > widthToHeight) {
        newWidth = newHeight * widthToHeight;
        gameArea.style.height = newHeight + 'px';
        gameArea.style.width = newWidth + 'px';
    } else {
        newHeight = newWidth / widthToHeight;
        gameArea.style.width = newWidth + 'px';
        gameArea.style.height = newHeight + 'px';
    }
    
    gameArea.style.marginTop = (-newHeight / 2) + 'px';
    gameArea.style.marginLeft = (-newWidth / 2) + 'px';
    
    var gameCanvas = document.getElementById('gameCanvas');
    gameCanvas.width = newWidth;
    gameCanvas.height = newHeight;
}



function gameXToCanvasX(x){
    return x/game.gameWidth*gameCanvas.width;
}

function gameYToCanvasY(y){
    return y/game.gameHeight*gameCanvas.height;
}

function canvasXToGameX(x){
    return x*gameCanvas.width/game.gameWidth;
}

function canvasYToGameY(y){
    return y*gameCanvas.height/game.gameHeight;
}</script>
<script>function bomb(x, y, velX, velY, destX, destY, shotSpeed){
    
    
    var slopeTop= destY - y;
    var slopeBottom = destX - x;
    var slope = slopeTop/slopeBottom;
    
    var deg = Math.atan(Math.abs(slopeTop/slopeBottom));    
    var dist = Math.sqrt((y-destY)*(y-destY) + (x-destX)*(x-destX));    

    var xRef = (destX-x)/Math.abs(destX-x);
    var yRef = -(destY-y)/Math.abs(destY-y);
    
    this.velX = velX;
    this.velY = velY;
    this.shotSpeed = shotSpeed;
    
    this.velX += Math.cos(deg)*xRef*this.shotSpeed;
    this.velY += Math.sin(deg)*yRef*this.shotSpeed;
    this.magnitude = dist;
    
    
    //this.velX = Math.cos(deg)*dist*xRef*2;
    //this.velY = Math.sin(deg)*dist*yRef*2;
        
    this.x = x;
    this.y = y;
    
    this.radius = .5;
    
    //Timers and Radii
    this.plantTimer = 1;
    this.plantBaseRadius = this.radius;
    
    this.explodeTimer = 1;
    this.explosionBaseRadius = .5;
    this.explosionMaxRadius = this.magnitude/2;
    
    //Start in the plant state
    this.states = {"Placed":0, "Detonated":1, "Dissipated":2};
    this.state = this.states.Placed;
    this.currentTimer = this.plantTimer;    
    
    this.draw = function(){
        //drawRectCentered(this.x, this.y, 10, 10);
        
        if(this.state == this.states.Placed)
        {
            draw.drawCircle(this.x, this.y, this.radius);            
        }        
        else if(this.state  == this.states.Detonated)
        {
            if(game.selectedWeapon == game.weapons.Bomb)
                draw.drawFilledCircle(this.x, this.y, this.radius, game.colors.Bomb);                                    
        }
    }
    
    this.explode = function(){        
        this.state = this.states.Detonated;
        this.currentTimer = this.explodeTimer;
        this.radius = this.explosionBaseRadius;
        
        var player = game.players[0];        
        
        var slopeTop= player.y - this.y;
        var slopeBottom = player.x - this.x;
        var slope = slopeTop/slopeBottom;
        
        var deg = Math.atan(Math.abs(slopeTop/slopeBottom));          
        var dist = Math.sqrt((this.y-player.y)*(this.y-player.y) + (player.x - this.x)*(player.x-this.x));    
        console.log(dist);
        
        var xRef = (player.x - this.x)/Math.abs(player.x - this.x);
        var yRef = -(player.y - this.y)/Math.abs(player.y - this.y);
        
        game.players[0].velX += Math.cos(deg)*xRef*this.magnitude*this.magnitude/2/dist/dist;
        game.players[0].velY += Math.sin(deg)*yRef*this.magnitude*this.magnitude/2/dist/dist;
        
        for(var b = 0; b < game.bots.length; b++){
            
            var bot = game.bots[b];
            
            var slopeTop= bot.y - this.y;
            var slopeBottom = bot.x - this.x;
            var slope = slopeTop/slopeBottom;

            var deg = Math.atan(Math.abs(slopeTop/slopeBottom));          
            var dist = Math.sqrt((this.y-bot.y)*(this.y-bot.y) + (bot.x - this.x)*(bot.x-this.x));    
            console.log(dist);

            var xRef = (bot.x - this.x)/Math.abs(bot.x - this.x);
            var yRef = -(bot.y - this.y)/Math.abs(bot.y - this.y);
            
            game.bots[b].velX += Math.cos(deg)*xRef*this.magnitude/dist;
            game.bots[b].velY += Math.sin(deg)*yRef*this.magnitude/dist;
            
        }
        
        for(var b = 0; b < game.generators.length; b++){
            
            var gen = game.generators[b];
            
            var slopeTop= gen.y - this.y;
            var slopeBottom = gen.x - this.x;
            var slope = slopeTop/slopeBottom;

            var deg = Math.atan(Math.abs(slopeTop/slopeBottom));          
            var dist = Math.sqrt((this.y-gen.y)*(this.y-gen.y) + (gen.x - this.x)*(gen.x-this.x));    
            console.log(dist);

            var xRef = (gen.x - this.x)/Math.abs(gen.x - this.x);
            var yRef = -(gen.y - this.y)/Math.abs(gen.y - this.y);
            
            game.generators[b].velX += Math.cos(deg)*xRef*this.magnitude/dist/2;
            game.generators[b].velY += Math.sin(deg)*yRef*this.magnitude/dist/2;
            
        }
        
        game.bombs.push(this);
    }
    
    this.disappear = function(){
        this.state = this.states.Dissipated;        
    }
    
    this.update = function(dt){                
        this.updateState(dt);
        
        if(this.state == this.states.Placed){
            //this.velY -= game.gravity*game.gravity/2*dt; //*dt;
        }
        else if(this.state == this.states.Detonated){
            this.velX = 0;
            this.velY = 0;
        }
        
        this.x += this.velX*dt;
        this.y -= this.velY*dt;            
        
    }
    
    this.updateState = function(dt){
        if(this.state == this.states.Placed){
            this.currentTimer -= dt;
            var expRad = (this.currentTimer/(this.plantTimer)*this.plantBaseRadius);            
            this.radius = expRad > this.PlantBaseRadius ? this.PlantBaseRadius : expRad;
            if(this.currentTimer <= 0){
                this.explode();
            }
        }
        else if(this.state == this.states.Detonated){
            this.currentTimer-=dt;
            //console.log((this.explosionMaxRadius-this.explosionBaseRadius)/2 + " " + this.radius);
            this.radius += ((this.explosionMaxRadius-this.explosionBaseRadius)*(dt)/this.explodeTimer);
            if(this.currentTimer <= 0){
                this.disappear();
            }
        }  
    }
}</script>

<script>function player(x, y){
    this.x = x;
    this.y = y;
    
    this.velX = 0;
    this.velY = 0;
    
    this.width = 1;
    this.height = 3;
    this.moveSpeed = 5;
    
    this.maxLife = 100;
    this.currentLife = 100;
    this.lifeRegen = 2;
    this.shotSpeed = 20;
    this.maxBombAmmo = 100;
    this.maxWellAmmo = 100;
    this.bombAmmo = 100;
    this.wellAmmo = 100;   
    this.bombRegenRate = 4;
    this.wellRegenRate = 4;
    
    this.right = function(){return this.x + this.width/2;};
    this.left = function(){return this.x - this.width/2};
    this.top = function(){return this.y - this.height/2};
    this.bottom = function(){return this.y + this.height/2};
    
    this.printSides = function(){        
        console.log("Player Right: " + this.right() + " Left: " + this.left() + " Top" + this.top() + " Bottom" + this.bottom());
    }
    
    this.draw = function(){
        if(this.currentLife > 0)
            draw.drawFilledRectCentered(this.x, this.y, this.width, this.height, game.colors.Ship);        
        else
            draw.drawText(game.gameWidth/2-8, game.gameHeight/2-6, "GAME OVER. PRESS R TO RESTART");
    }        
    
    this.shoot = function(player, x, y){        
        if(game.selectedWeapon == game.weapons.Bomb){    
            var testBomb = new bomb(player.x, player.y, player.velX, player.velY, x, y, this.shotSpeed);            
            if(player.bombAmmo >= testBomb.magnitude){
                game.liveBomb = testBomb;
                player.bombAmmo -= game.liveBomb.magnitude;
            }
        }
        else if(game.selectedWeapon == game.weapons.Well){
            var testWell = new well(player.x, player.y, player.velX, player.velY, x, y, this.shotSpeed);            
            if(player.wellAmmo >= testWell.magnitude){
                game.liveWell = testWell;
                player.wellAmmo -= game.liveWell.magnitude;
            }            
        }
    }
    
        
    this.update = function(dt){          
        //A
        if(game.keys[65]){
            this.velX += -this.moveSpeed*dt;
        }
        //D
        if(game.keys[68]){
            this.velX += this.moveSpeed*dt;
        }
                    
        if(game.keys[87]){
            this.velY += this.moveSpeed*dt;
        }
        
        if(game.keys[83]){
            this.velY += -this.moveSpeed*dt;
        }
        
        if(game.keys[69]){
            this.velY = 0;
            this.velX = 0;  
        }
        
        this.bombAmmo += this.bombRegenRate*dt;
        this.wellAmmo += this.wellRegenRate*dt;        
        if(this.currentLife > 0)
            this.currentLife += this.lifeRegen*dt;
        
        
        if(this.bombAmmo > this.maxBombAmmo)
            this.bombAmmo = this.maxBombAmmo;
        
        if(this.wellAmmo > this.maxWellAmmo)
            this.wellAmmo = this.maxWellAmmo;
        
        if(this.currentLife > this.maxLife)
            this.currentLife = this.maxLife;
        
        this.updateState(dt);
        
        var gravMult = 1;
        for(var w = 0; w < game.wells.length; w++)
        {
            var dist = Math.sqrt((game.wells[w].y-this.y)*(game.wells[w].y-this.y) + (this.x - game.wells[w].x)*(this.x-                                    game.wells[w].x));  
            console.log("dist " + dist);
            if(dist < game.wells[w].radius)
            {
                console.log("reverse grav");
                gravMult = -1;
            }
        }
        
        for(var w = 0; w < game.powerups.length; w++)
        {
            var dist = distance(game.powerups[w].x, game.powerups[w].y, this.x, this.y)
            if(dist < game.powerups[w].radius+1)
            {       
                if(game.powerups[w].type == game.powerupTypes.BombChargeRate){
                    this.bombRegenRate+=1;
                }
                if(game.powerups[w].type == game.powerupTypes.MaxBombAmmo){
                    this.maxBombAmmo+=5;
                }
                if(game.powerups[w].type == game.powerupTypes.WellChargeRate){
                    this.wellRegenRate+=1;
                }
                if(game.powerups[w].type == game.powerupTypes.MaxWellAmmo){
                    this.maxWellAmmo+=5;
                }
                console.log("hit powerup!");
                game.powerups.splice([w], 1);
                w--;
            }
        }        
        
        this.velY -= game.gravity*game.gravity*gravMult*dt;                        
        
        /*
        if(game.keys[87]){
            this.velY = 20;
        }
        */
        var oldX = this.x;
        var oldY = this.y;
        
        this.x += this.velX*dt;
        this.y -= this.velY*dt;   
        
        if(this.x-this.width/2 < 0){
            this.x = this.width/2;
            this.currentLife-= Math.abs(this.velX);
            this.velX = -this.velX/2;            
        }
        if(this.x+this.width/2 > game.gameWidth){
            this.x = game.gameWidth - this.width/2;
            this.currentLife-= Math.abs(this.velX);
            this.velX = -this.velX/2;            
        }
        if(this.y+this.height/2 > game.gameHeight - 20){            
            this.y = game.gameHeight - 20 - this.height/2;
            this.currentLife-= Math.abs(this.velY);
            this.velY = -this.velY/2;            
        }        
        if(this.y-this.height/2 < 0){            
            this.y = this.height/2;
            this.currentLife-= Math.abs(this.velY);
            this.velY = -this.velY/2;            
        }
    }
    
    this.updateState = function(dt){
        
    }
}</script> 
<script>function powerup(x, y, velX, velY, type){
    this.x = x;
    this.y = y;
    this.velX = velX;
    this.velY = velY;
    this.radius = 1;
    this.type = type;
    
    this.update = function(dt){
        this.x += this.velX*dt;
        this.y -= this.velY*dt;  
        
        if(this.x-this.radius < 0){
            this.x = this.radius;
            this.velX = -this.velX/2;
        }
        if(this.x+this.radius > game.gameWidth){
            this.x = game.gameWidth - this.radius;
            this.velX = -this.velX/2;
        }
        if(this.y+this.radius > game.gameHeight - 20){            
            this.y = game.gameHeight - 20 - this.radius;
            this.velY = -this.velY/2;
        }        
        if(this.y-this.radius < 0){            
            this.y = this.radius;
            this.velY = -this.velY/2;
        }
        
    }
    
    this.draw = function(){
        if(this.type == game.powerupTypes.BombChargeRate){
            draw.drawFilledCircle(this.x, this.y, this.radius, game.colors.Bomb);    
        }
        if(this.type == game.powerupTypes.MaxBombAmmo){
            draw.drawFilledCircle(this.x, this.y, this.radius, game.colors.Bomb);    
        }
        if(this.type == game.powerupTypes.WellChargeRate){
            draw.drawFilledCircle(this.x, this.y, this.radius, game.colors.Well);    
        }
        if(this.type == game.powerupTypes.MaxWellAmmo){
            draw.drawFilledCircle(this.x, this.y, this.radius, game.colors.Well);    
        }
    }
    
}</script> 
<script>function meter(x, y, type){
    this.x = x;
    this.y = y;
    this.type = type;  
    
    this.orientations = {"Horizontal":0, "Vertical":1};
    
    if(this.type == game.meterTypes.Bomb){
        this.width = 1;
        this.height = 10;
        this.maxLevel = game.players[0].maxBombAmmo;
        this.currentLevel = game.players[0].maxBombAmmo;
        this.orientation = this.orientations.Vertical;
    }
    if(this.type == game.meterTypes.Well){
        this.width = 1;
        this.height = 10;
        this.maxLevel = game.players[0].maxWellAmmo;
        this.currentLevel = game.players[0].maxWellAmmo;
        this.orientation = this.orientations.Vertical;
    }
    if(this.type == game.meterTypes.Life){
        this.width = 1;
        this.height = 10;
        this.maxLevel = game.players[0].maxLife;
        this.currentLevel = game.players[0].maxLife;
        this.orientation = this.orientations.Vertical;
    }
    else if(this.type == game.meterTypes.Level){
        this.width = 40;
        this.height = 2;
        this.maxLevel = game.levelTime;
        this.currentLevel = game.currentLevelTimer;
        this.orientation = this.orientations.Horizontal;
    }
    
    this.update = function(){
        if(this.type == game.meterTypes.Bomb){                        
            this.currentLevel = game.players[0].bombAmmo;
        }
        if(this.type == game.meterTypes.Well){                        
            this.currentLevel = game.players[0].wellAmmo;
        }  
        if(this.type == game.meterTypes.Life){              
            if(game.players[0].currentLife > 0)
                this.currentLevel = game.players[0].currentLife;
            else 
                this.currentLevel = 0;
        }  
        else if(this.type == game.meterTypes.Level){                        
            if(game.players[0].currentLife > 0)
                this.currentLevel = game.currentLevelTimer;
        }
    }
    
    this.draw = function(){
        if(this.type == game.meterTypes.Bomb)
            var color = game.colors.Bomb;
        else if(this.type == game.meterTypes.Well)
            var color = game.colors.Well;        
        else if(this.type == game.meterTypes.Life)
            var color = game.colors.Ship;
        else
            var color = "#000000";
        
        if(this.orientation == this.orientations.Vertical){
            
            draw.drawRectCentered(this.x, this.y, this.width, this.height, "#000000");
            draw.drawFilledRectCentered(this.x, this.y, this.width, this.height*(this.currentLevel/this.maxLevel), color); 
        }
        else if(this.orientation == this.orientations.Horizontal){
            draw.drawRectCentered(this.x, this.y, this.width, this.height, "#000000");
            draw.drawFilledRectCentered(this.x, this.y, this.width*(1-this.currentLevel/this.maxLevel), this.height, color);    
        }
        
       
    }
}
</script>  
<script>function bot(x, y, width, height, fireInterval, shotSpeed, shotDuration, type) {
    this.x = x;
    this.y = y;
    
    this.width = width;
    this.height = height;
    
    this.fireInterval = fireInterval;
    this.shotSpeed = shotSpeed;
    
    this.type = type;
    this.states = {"Alive":0, "Exploded":1, "Dissipated":2};
    this.state = this.states.Alive;
    
    this.shotTimer = 4;
    this.currentTimer = this.shotTimer;
    
    this.velX = Math.random()*8-4;
    this.velY = Math.random()*8-4;
    
    this.right = function(){return this.x + this.width/2;};
    this.left = function(){return this.x - this.width/2};
    this.top = function(){return this.y - this.height/2};
    this.bottom = function(){return this.y + this.height/2};
    
    this.printSides = function(){        
        console.log("Player Right: " + this.right() + " Left: " + this.left() + " Top" + this.top() + " Bottom" + this.bottom());
    }
    
    this.draw = function(){
        var color = this.type == game.weapons.Bomb ? game.colors.Bomb:game.colors.Well;
        draw.drawFilledRectCentered(this.x, this.y, this.width, this.height, color);        
    }       
    
    this.shoot = function(){        
        
        if(this.type == game.weapons.Bomb){
            game.bombs.push(new bomb(this.x, this.y, 0, 0, game.players[0].x, game.players[0].y, 20));
        }

<script>function playerFloorHit(player, floor)

<script>function gameObject(){
    
    //Game Dimensions in Game Units. I think of them as meters, but this is what you will do all of your position updating in.

    this.gameHeight = 100; 
    
    //http://www.colourlovers.com/palette/600798/(_t_r_a_v_e_l_e_r_)?widths=0

    //var SpaceAgeLoveSong = {"Background":"#1D0C20", };
    //var Interstellar = {"Background":"  }
    var FloatingInSpace = {"Background":"#5D6F72", "Ship":"#80CCD8", "Enemy":"#CEF5FB", "Bomb":"#343A3B", "Well":"#8AAAAF"}
    
    this.colors = FloatingInSpace;
    
    //Canvas Context for easy referencing
    this.Canvas = document.getElementById('gameCanvas');
    this.ctx = this.Canvas.getContext("2d"); 
    
    this.isMobile = function(){         
    if( navigator.userAgent.match(/Android/i)
         || navigator.userAgent.match(/webOS/i)
         || navigator.userAgent.match(/iPhone/i)
         || navigator.userAgent.match(/iPad/i)
         || navigator.userAgent.match(/iPod/i)
         || navigator.userAgent.match(/BlackBerry/i)
         || navigator.userAgent.match(/Windows Phone/i)
         ){
            return true;
            }
         else {
            return false;
          }
    }        
    
    //Physics Variables
    //this.gravity = 10;
    this.gravity = 0;
    
    //Game Settings
    this.level = 0;
    this.score = 0;
    
    //Set up game object arrays here
    this.clicks = [];
    this.keys = [];
    this.buttons = [];
    this.meters = [];
    this.inputs = [];
    
    this.liveBomb;
    this.liveWell;
    this.bombs = [];
    this.wells = [];
    this.powerups = [];
    
    this.bombMap = [];
    this.floors = [];
    this.players = [];
    this.bots = [];
    this.generators = [];
    
    //Timers
    this.botCooldownTimer = 1;
    this.levelTime = 20;
    this.currentLevelTimer = 0;        
    
    //Game Objects
    this.weapons = {"Bomb":0, "Well":1};
    this.builder = {"BombBot":0, "WellBot":1, "Gravity":2, "BombSpawner":3, "WellSpawner":4};
    this.selectedWeapon = this.weapons.Bomb;
    
    this.meterTypes = {"Level":0, "Bomb":1, "Well":2, "Life":3};    
    this.powerupTypes = {"WellChargeRate": 0, "MaxWellAmmo":1, "BombChargeRate":2, "MaxBombAmmo":3};
    
    this.init = function(){
        //Add a player
        //this.players.push(new player(this.gameWidth/2, this.gameHeight/2));
        this.players.push(new player(this.gameWidth/2, this.gameHeight/2));                             

        //Add a floor
        this.floors.push(new floor(150, 40, 10, 5));

        //Add Some Buttons
        this.buttons.push(new roundButton(this.gameWidth/2+10, this.gameHeight-10, 5, this.weapons.Bomb, "#000000"));
        this.buttons.push(new roundButton(this.gameWidth/2-10, this.gameHeight-10, 5, this.weapons.Well, "#990099"));

        //Add Meters 
        this.meters.push(new meter(this.gameWidth/2 + 17.5, this.gameHeight - 10, this.meterTypes.Bomb));
        this.meters.push(new meter(this.gameWidth/2 - 17.5, this.gameHeight - 10, this.meterTypes.Well));
        this.meters.push(new meter(this.gameWidth/2, this.gameHeight - 10, this.meterTypes.Life));        
        this.meters.push(new meter(this.gameWidth/2, this.gameHeight - 17.5, this.meterTypes.Level));
        

        //Time Stuff
        this.lastTime = Date.now();
        this.nowTime = this.lastTime;
    }
    
    this.levelUp = function(){
        this.level++;
        this.gravity = 0;
        this.currentLevelTimer = this.levelTime;
        this.bots = [];
        this.generators = [];
        this.powerups = [];
        this.players[0].moveSpeed += .5;
        if(this.level == 2){
            this.levelTime = 10;
            this.currentLevelTimer = this.levelTime;
            game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Bomb));   
        }
        if(this.level == 3){
            this.gravity = 2;   
        }
        if(this.level == 4){
            this.gravity = 2;
            game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Well));   
        }
        if(this.level > 4 && this.level < 8){
            var numBombBots = Math.floor(Math.random() * 3 +1);
            var numWellBots = Math.floor(Math.random() * 3 +1);
            var gravity = Math.floor(Math.random() * 3);
            this.gravity = gravity;
            for(var x = 0; x < numBombBots; x++){                
            game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Bomb));
            }
            for(var x = 0; x < numWellBots; x++){                
            game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Well));
            }
        }
        if(this.level == 8){
            game.levelTime = 30;
            this.currentLevelTimer = this.levelTime;
            game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Bomb));
        }
        
        if(this.level == 9){
            game.gravity = 3;
            game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Well));
        }
        
        if(this.level > 9){
            game.levelTime = 3*this.level;
            this.currentLevelTimer = this.levelTime;
            var points = 0;
            while (points < this.level){
                var draw = Math.floor(Math.random() * 5);
                if(draw == this.builder.BombBot){
                     game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Bomb));   
                    points += 1;
                }
                if(draw == this.builder.WellBot){
                     game.bots.push(new bot(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4, 2,2, .5, 10, 2,game.weapons.Well));   
                    points += 1;
                }
                if(draw == this.builder.Gravity){
                     this.gravity += 1  
                    points += 2;
                }
                if(draw == this.builder.WellSpawner){
                     game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Bomb));  
                    points += 5;
                }
                if(draw == this.builder.WellBot){
                     game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Well)); 
                    points += 5;
                }
            }
        }
            
    }
    /*
        game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Bomb));
        game.generators.push(new shipGenerator(game.gameWidth/2 + Math.random()*game.gameWidth/2-game.gameWidth/4,game.gameHeight/2 + Math.random()*game.gameHeight/2-game.gameHeight/4 , 3, 3, 5, this.weapons.Well));
        */
         
        
}</script>   
<script>window.requestAnimFrame = (function() {
            return window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback) {
                window.setTimeout(callback, 1000 / 60);
            };
        })();
    

function animLoop() {
    game.nowTime = Date.now();
    //var dt = (now - last)/16.66666666666666 * (.8);
    
    var dt = (game.nowTime-game.lastTime)/1000;
    update(dt);
    draw.drawScene();
    requestAnimFrame(animLoop);
    game.lastTime = game.nowTime;
    
}

function update(dt){    
    
    game.botCooldownTimer -= dt;
    game.currentLevelTimer -= dt;
    if(game.currentLevelTimer <= 0)
    {
        game.levelUp();
    }
    
    if(game.keys[82]){
        console.log("new!");
        game = new gameObject();
        game.init();
    }
    /*
    if(game.keys[32]){
        //game.bombs[32]
        if(!game.bombMap[32]){                        
            game.bombMap[32] = true;
            game.bombs.push(new bomb(game.mouseX, game.mouseY, 0, 0));   
        }
    }
    if(!game.keys[32]){
       if(game.bombMap[32]){
            game.bombMap[32] = false;
        }
    }
    */
    //G
    if(game.keys[71]){
        game.gravity++;
    }
    //H
    if(game.keys[72]){
        game.gravity--;
    }
    //J
    if(game.keys[74]){
        if(game.botCooldownTimer <= 0){            
            game.bots.push(new bot(6, 6, 2, 2, .5, 10));
            game.botCooldownTimer = 1;
        }
        game.keys[74] = false;
    }

    for(var p = 0; p < game.players.length; p++){
        game.players[p].update(dt);
    }
    
    for(var p = 0; p < game.powerups.length; p++){
        game.powerups[p].update(dt);
    }
    
    for(var b = 0; b < game.bots.length; b++){
        game.bots[b].update(dt);           
    }
    
    for(var s = 0; s < game.generators.length; s++){
        game.generators[s].update(dt);           
    }
    
    if(game.liveBomb)
        game.liveBomb.update(dt);
    
    if(game.liveWell)
        game.liveWell.update(dt);
    
    for(var b = 0; b < game.bombs.length; b++){
        game.bombs[b].update(dt);
    }
    
    for(var w = 0; w < game.wells.length; w++){
        game.wells[w].update(dt);
    }
    
    for(var m = 0; m < game.meters.length; m++){
        game.meters[m].update(dt);   
    }                
    
    clearSpentBombsAndWells();
}

function clearSpentBombsAndWells(){    
    for(var w = 0; w < game.wells.length; w++){
        if(game.wells[w].state == game.wells[w].states.Dissipated){
            game.wells.splice(w, 1);
            w-=1;
        }            
    }
    for(var w = 0; w < game.bots.length; w++){
        if(game.bots[w].state == game.bots[w].states.Dissipated){
            game.bots.splice(w, 1);
            w-=1;
        }            
    }
    
    for(var w = 0; w < game.generators.length; w++){
        if(game.generators[w].state == game.generators[w].states.Dissipated){
            game.generators.splice(w, 1);
            w-=1;
        }            
    }     
    
    
}

game = new gameObject();
game.init();
draw = new drawLevelCentricObject();

resizeGame();
animLoop();</script>
