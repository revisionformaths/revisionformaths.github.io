<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Rainbow Defense</title>

<style>        :root {
            --bg-1: #fff0fb;
            --bg-2: #dff7ff;
            --bg-3: #fdf4c8;
            --panel: rgba(255, 255, 255, 0.72);
            --text-color: #4a2d5d;
            --accent-color: #ff7ac6;
            --accent-2: #8b5cf6;
            --accent-3: #38bdf8;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            padding: 12px 20px;
            text-align: center;
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 184, 220, 0.9), rgba(173, 216, 255, 0.9), rgba(255, 240, 160, 0.9));
            box-shadow: 0 6px 18px rgba(180, 120, 255, 0.18);
            z-index: 10;
            border-bottom: 3px solid rgba(139, 92, 246, 0.5);
            backdrop-filter: blur(5px);
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
            letter-spacing: 0.04em;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 95vw;
            aspect-ratio: 800 / 360;
            margin: 12px auto 8px;
            box-shadow: 0 12px 30px rgba(191, 124, 255, 0.22);
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(174,230,255,0.4));
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.75) 0 1.5px, transparent 1.5px),
                              radial-gradient(circle at 70% 25%, rgba(255,192,203,0.7) 0 2px, transparent 2px),
                              radial-gradient(circle at 80% 70%, rgba(173,216,255,0.8) 0 2.5px, transparent 2.5px),
                              linear-gradient(180deg, #d9f7ff 0%, #f3d9ff 100%);
            background-size: 28px 28px, 32px 32px, 36px 36px, 100% 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-panel {
            width: 100%;
            max-width: 95vw;
            padding: 12px;
            background: var(--panel);
            border-top: 1px solid rgba(255,255,255,0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            font-weight: 800;
            font-size: 1rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,244,214,0.9));
            padding: 10px 12px;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55);
        }

        .stat-item {
            color: #5b3a6c;
        }

        .stat-item span {
            margin-left: 5px;
            color: #ec4899;
        }
        
        #money-display { color: #7c3aed; }
        #wave-display { color: #0ea5e9; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tower-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,230,244,0.9));
            border: 2px solid rgba(255, 157, 205, 0.9);
            border-radius: 12px;
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 6px 16px rgba(251, 113, 133, 0.16);
        }

        .tower-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(168, 85, 247, 0.18);
        }

        .tower-btn.selected {
            border-color: var(--accent-color);
            background: linear-gradient(135deg, rgba(255, 189, 229, 1), rgba(216, 180, 254, 1));
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.45);
        }

        .tower-icon {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }

        .tower-cost {
            font-size: 0.8rem;
            font-weight: 900;
            color: #7c3aed;
        }

        .tower-name {
            font-size: 0.65rem;
            color: #6d4a84;
            font-weight: 700;
        }

        #wave-btn {
            background: linear-gradient(135deg, #ff8ecf, #a78bfa 55%, #7dd3fc);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            font-size: 1rem;
            margin-left: auto;
            box-shadow: 0 6px 0 rgba(147, 84, 255, 0.6);
            transition: transform 0.1s ease;
        }

        #wave-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        #wave-btn:disabled {
            background: linear-gradient(135deg, #cbd5e1, #e2e8f0);
            box-shadow: none;
            cursor: not-allowed;
            transform: translateY(2px);
            color: #64748b;
        }

        #boss-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fa7ecb;
            font-size: 2.8rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,255,255,0.7), 0 4px 0 rgba(139,92,246,0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 20;
            white-space: nowrap;
        }

        /* Modal Styles */
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(64, 39, 82, 0.52);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(255,233,250,0.96), rgba(214,248,255,0.96));
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 18px 45px rgba(168, 85, 247, 0.22);
            max-width: 330px;
            border: 2px solid rgba(255,255,255,0.6);
        }

        .modal-title {
            font-size: 1.7rem;
            margin-bottom: 10px;
            color: #7c3aed;
            font-weight: 900;
        }

        .modal-btn {
            background: linear-gradient(135deg, #f472b6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 999px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 800;
            box-shadow: 0 6px 18px rgba(168,85,247,0.28);
        }

        .modal-btn:hover {
            filter: brightness(1.05);
        }

        @media (max-width: 600px) {
            .tower-btn { padding: 4px; min-width: 45px; }
            .tower-name { display: none; }
            h1 { font-size: 1rem; }
            .stats-bar { font-size: 0.9rem; }
            #wave-btn { padding: 8px 12px; font-size: 0.9rem; }
        }</style>
    
</head>
<body>

<header>
    <h1>✨ Unicorn Castle Defense: Rainbow Rush</h1>
</header>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="boss-warning">🌈 BOSS WAVE!</div>
    <div id="modal-overlay">
        <div class="modal-content">
            <div id="modal-title" class="modal-title">Castle Lost</div>
            <p id="modal-message">The rainbow magic faded...</p>
            <button id="modal-btn" class="modal-btn">Try Again</button>
        </div>
    </div>
</div>

<div id="ui-panel">
    <div class="stats-bar">
        <div class="stat-item">💖 Hearts: <span id="lives">5</span></div>
        <div class="stat-item">🌟 Magic: <span id="money-display">150</span></div>
        <div class="stat-item">🌈 Wave: <span id="wave-display">1</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <div class="controls" id="tower-controls"></div>
      
        <div class="tower-btn" id="upgrade-btn">
            <div class="tower-icon">🔨</div>
            <div class="tower-cost">+</div>
            <div class="tower-name">Boost</div>
        </div>
        
        <button id="wave-btn">Start!</button>
        <button id="save-btn" style="background:linear-gradient(135deg,#ff9ecb,#a78bfa); color:#fff; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(168,85,247,0.25);">💾 Save</button>
        <button id="load-btn" style="background:linear-gradient(135deg,#7dd3fc,#86efac); color:#fff; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(14,165,233,0.25);">📂 Load</button>
        <button id="bgm-btn" style="background:linear-gradient(135deg,#f472b6,#fbbf24); color:#fff; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(236,72,153,0.25);">🎵 BGM ON</button>
    </div>
</div>


<script>const CONFIG = {
    tileSize: 40,
    cols: 20,
    rows: 9,
    startMoney: 150,
    startLives: 5,
    baseEnemyHp: 49,
    moneyPerKill: 6,
    bossWaveInterval: 5,    
    upgradeCostShield: 1.1,
    maxTowerLevel: 6
};

const SAVE_VERSION = 1;
const MAX_SAVE_JSON_LENGTH = 1000000;

const TOWERS = {
    spray: {id: 'spray', name: 'Unicorn', icon: '🦄', cost: 60, range: 3.5, damage: 20, cooldown: 15, color: '#ff7ac6', desc: 'Bright magical beams.'},
    trap: {id: 'trap', name: 'Star Trap', icon: '✨', cost: 90, range: 2.2, damage: 4, slow: 0.4, cooldown: 8, color: '#fbbf24', desc: 'Slows rainbow invaders.'},
    zapper: {id: 'zapper', name: 'Rainbow Bolt', icon: '🌈', cost: 180, range: 4.5, damage: 270, cooldown: 60, color: '#8b5cf6', desc: 'Heavy boss damage.'},
    poison: {id: 'poison', name: 'Moon Mist', icon: '💫', cost: 420, range: 3.0, damage: 4, cooldown: 5, area: true, color: '#34d399', desc: 'Area magic damage.'}
};

const ENEMIES = [
    {name: 'Spark Bug', icon: '🐞', speed: 0.06, hpMod: 1.1, reward: 5},
    {name: 'Rain Moth', icon: '🦋', speed: 0.09, hpMod: 1.3, reward: 9},
    {name: 'Cloud Bat', icon: '🦇', speed: 0.04, hpMod: 3.4, reward: 14},
    {name: 'Dew Fly', icon: '🪶', speed: 0.11, hpMod: 0.6, reward: 7}
];

const state = {
    money: CONFIG.startMoney,
    lives: CONFIG.startLives,
    wave: 1,
    isPlaying: false,
    isWaveActive: false,
    selectedTower: null,
    mode: null,
    map: [],
    navMap: [],
    startPoint: {c: 0, r: 0},
    endPoints: [],
    towers: [],
    enemies: [],
    projectiles: [],
    particles: [],
    waveQueue: [],
    waveTimer: 0,
    shakeTimer: 0
};

function triggerShake(frames = 30) {
    state.shakeTimer = frames;
}


const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLives = document.getElementById('lives');
const uiMoney = document.getElementById('money-display');
const uiWave = document.getElementById('wave-display');
const waveBtn = document.getElementById('wave-btn');
const towerControls = document.getElementById('tower-controls');
const upgradeBtn = document.getElementById('upgrade-btn');
const saveBtn = document.getElementById('save-btn');
const loadBtn = document.getElementById('load-btn');
const bgmBtn = document.getElementById('bgm-btn');
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalMessage = document.getElementById('modal-message');
const modalBtn = document.getElementById('modal-btn');
const bossWarning = document.getElementById('boss-warning');
const towerButtons = [];

const audio = {ctx: null,master: null,fxBus: null,noiseBuffer: null,distCurve: null,bgmTimer: null,bgmStep: 0,unlocked: false,bgmEnabled: true};

function ensureAudio() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    if (!audio.ctx) {
        audio.ctx = new AudioCtx();
        audio.master = audio.ctx.createGain();
        audio.master.gain.value = 0.45;

        const delay = audio.ctx.createDelay();
        const feedback = audio.ctx.createGain();
        const filter = audio.ctx.createBiquadFilter();

        delay.delayTime.value = 0.28;
        feedback.gain.value = 0.45;
        filter.type = 'lowpass';
        filter.frequency.value = 1500;

        audio.fxBus = audio.ctx.createGain();
        audio.fxBus.gain.value = 0.25;

        audio.fxBus.connect(audio.master);
        audio.fxBus.connect(delay);
        delay.connect(filter);
        filter.connect(feedback);
        feedback.connect(delay);
        filter.connect(audio.master);

        audio.master.connect(audio.ctx.destination);

        const bufferSize = audio.ctx.sampleRate * 2;
        audio.noiseBuffer = audio.ctx.createBuffer(1, bufferSize, audio.ctx.sampleRate);
        const data = audio.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const k = 25, n = 44100, curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
            const x = (i * 2) / n - 1;
            curve[i] = ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
        }
        audio.distCurve = curve;
    }
    if (audio.ctx.state !== 'running') {
        audio.ctx.resume().catch(() => {
            audio.unlocked = false;
        });
    }
    return audio.ctx;
}

function unlockAudio() {
    const ctx = ensureAudio();
    if (!ctx || audio.unlocked) return;
    audio.unlocked = true;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    gain.gain.value = 0.0001;
    osc.connect(gain);
    gain.connect(audio.master || ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.03, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
    osc.stop(ctx.currentTime + 0.09);
}

function playHarp(freq, duration = 1.2, volume = 0.08, delay = 0) {
    if (!audio.ctx || !audio.master) return;
    const t = audio.ctx.currentTime + delay;
    
    const osc1 = audio.ctx.createOscillator();
    const gain1 = audio.ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(freq, t);

    const osc2 = audio.ctx.createOscillator();
    const gain2 = audio.ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, t);

    gain1.gain.setValueAtTime(0, t);
    gain1.gain.linearRampToValueAtTime(volume, t + 0.005);
    gain1.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    gain2.gain.setValueAtTime(0, t);
    gain2.gain.linearRampToValueAtTime(volume * 0.4, t + 0.003);
    gain2.gain.exponentialRampToValueAtTime(0.0001, t + (duration * 0.3));

    osc1.connect(gain1);
    osc2.connect(gain2);
    gain1.connect(audio.fxBus || audio.master);
    gain2.connect(audio.fxBus || audio.master);

    osc1.start(t);
    osc2.start(t);
    osc1.stop(t + duration);
    osc2.stop(t + duration);
}

let activeSoundCount = 0;

function playTone(freq = 440, duration = 0.12, volume = 0.08, type = 'sine', delay = 0, targetFreq = null, sendFx = true, attack = 0.015) {
    if (!audio.ctx || !audio.master) return;
    if (activeSoundCount > 16) return;
    const t = audio.ctx.currentTime + delay;
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();   
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    
    if (targetFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(10, targetFreq), t + duration);
    }
    
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    
    osc.connect(gain);
    gain.connect(sendFx && audio.fxBus ? audio.fxBus : audio.master);
    activeSoundCount++;
    osc.start(t);
    osc.stop(t + duration + 0.05);
    osc.onended = () => { activeSoundCount = Math.max(0, activeSoundCount - 1); };
}

function playBGM(freq, duration, volume, type = 'triangle', delay = 0) {
    if (!audio.ctx || !audio.master) return;
    const t = audio.ctx.currentTime + delay;
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    const attack = 0.08;
    const safeDuration = Math.max(duration, attack + 0.02);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(
        Math.max(0.0001, volume),
        t + attack
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        t + safeDuration
    );
    osc.connect(gain);
    gain.connect(audio.master);
    osc.start(t);
    osc.stop(t + safeDuration + 0.05);
}


function playNoise(duration = 0.1, volume = 0.05, cutoff = 1000, delay = 0) {
    if (!audio.ctx || !audio.noiseBuffer) return;
    const t = audio.ctx.currentTime + delay;
    const noise = audio.ctx.createBufferSource();
    noise.buffer = audio.noiseBuffer;
    const filter = audio.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(cutoff, t);

    const gain = audio.ctx.createGain();
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audio.fxBus || audio.master);
    noise.start(t);
    noise.stop(t + duration);
}

function playSfx(kind) {
    if (!audio.ctx) return;
    
    if (kind === 'build') {
        playNoise(0.15, 0.12, 400);
        playTone(180, 0.12, 0.08, 'sawtooth', 0, 90);
        playTone(880, 0.08, 0.03, 'triangle', 0.02);
    } else if (kind === 'upgrade') {
        playTone(523.25, 0.3, 0.06, 'sine');
        playTone(739.99, 0.35, 0.05, 'sine', 0.03);
        playTone(1046.50, 0.4, 0.04, 'triangle', 0.06);
        playTone(2093.00, 0.2, 0.02, 'sine', 0.1);
    } else if (kind === 'wave') {
        playTone(146.83, 0.45, 0.1, 'sawtooth', 0, 130.81);
        playTone(220.00, 0.45, 0.06, 'sawtooth', 0.02, 196.00);
        playNoise(0.3, 0.05, 800, 0.05);
    } else if (kind === 'spray') {
        const now = audio.ctx.currentTime;
        playTone(587.33, 0.15, 0.12, 'sawtooth', 0, 1174.66, true, 0.005);
        playTone(1174.66, 0.20, 0.10, 'sine', 0.01, 2349.32, true, 0.003);
        playTone(293.66, 0.16, 0.10, 'triangle', 0, 146.83, true, 0.005);
        playNoise(0.12, 0.04, 3500, 0);
    } else if (kind === 'trap') {
        playTone(440, 0.22, 0.05, 'sawtooth', 0, 80);
        playTone(311.13, 0.25, 0.02, 'square', 0.02, 60);
    } else if (kind === 'zapper') {
        const now = audio.ctx.currentTime;
        const rainbowFreqs = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02, 3135.96];
        rainbowFreqs.forEach((freq, index) => {
            const delay = index * 0.025;
            playTone(freq, 0.40, 0.12, 'sawtooth', delay, freq * 1.08, true, 0.002);
            playTone(freq * 1.5, 0.30, 0.09, 'sine', delay + 0.005, null, true, 0.001);
            playTone(freq * 2.0, 0.25, 0.07, 'triangle', delay + 0.01, null, true, 0.001);
        });
        playTone(261.63, 0.18, 0.08, 'sine', 0, 130.81, true, 0.005);
        playNoise(0.25, 0.04, 8000, 0);
    } else if (kind === 'lose') {
        playTone(110, 0.7, 0.12, 'sawtooth', 0, 45);
        playTone(155.56, 0.6, 0.08, 'square', 0.05, 50);
        playNoise(0.5, 0.08, 200, 0.1);
    } else {
        playTone(440, 0.08, 0.05, 'triangle');
    }
}

const BGM_NOTES = [0,130.81,146.83,164.81,174.61,196.00,220.00,233.08,261.63,293.66,329.63,349.23,392.00,440.00,466.16,523.25];

function startBGM() {
    const ctx = ensureAudio();
    if (!ctx || audio.bgmTimer || !audio.bgmEnabled) return;
    const melody = [9, 10, 11, 12, 11, 10, 9, 8,9, 11, 13, 15, 13, 12, 11, 12,13, 14, 13, 12, 11, 10, 9, 10,11, 12, 10, 9, 9, 0, 9, 0];

    const drone = [2, 2, 2, 2, 2, 2, 2, 1,2, 4, 6, 6, 6, 5, 4, 5,6, 7, 6, 5, 4, 2, 2, 3,4, 5, 3, 2, 2, 0, 2, 0];

    audio.bgmTimer = setInterval(() => {
        if (!state.isPlaying) return;
        const step = audio.bgmStep++ % melody.length;
        const mFreq = BGM_NOTES[melody[step]];
        const dFreq = BGM_NOTES[drone[step]];
        if (mFreq) {
            playBGM(mFreq, 0.75, 0.35, 'sine');
            playBGM(mFreq, 0.70, 0.15, 'triangle', 0.01);
            playBGM(mFreq * 2, 0.60, 0.08, 'sine', 0.03);
        }
        if (dFreq) {
            playBGM(dFreq, 0.8, 0.30, 'triangle');
            playBGM(dFreq / 2, 0.85, 0.20, 'sine');
        }
    }, 460);
}

function stopBGM() {
    if (audio.bgmTimer) {
        clearInterval(audio.bgmTimer);
        audio.bgmTimer = null;
    }
}

function toggleBGM() {
    audio.bgmEnabled = !audio.bgmEnabled;
    if (audio.bgmEnabled) {
        startBGM();
    } else {
        stopBGM();
    }
}

function updateBGMButton() {
    bgmBtn.textContent = audio.bgmEnabled ? '🎵 BGM ON' : '🔇 BGM OFF';
}

function init() {
    resizeCanvas();
    generateMap();
    setupUI();
    resetGame();
    startGameLoop();
}

function resizeCanvas() {
    canvas.width = CONFIG.cols * CONFIG.tileSize;
    canvas.height = CONFIG.rows * CONFIG.tileSize;
    if (state.map.length === CONFIG.rows) draw();
}

function startGameLoop() {
    if (animationFrameId !== null) return;
    animationFrameId = requestAnimationFrame(gameLoop);
}

function resetGame() {
    state.money = CONFIG.startMoney;
    state.lives = CONFIG.startLives;
    state.wave = 1;
    state.isWaveActive = false;
    state.selectedTower = null;
    state.mode = null;
    state.towers = [];
    state.enemies = [];
    state.projectiles = [];
    state.particles = [];
    state.waveQueue = [];
    state.isPlaying = true;
    updateUI();
    modalOverlay.style.display = 'none';
    waveBtn.disabled = false;
    waveBtn.textContent = 'Start Wave 1';
    bossWarning.style.opacity = 0;
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        state.particles.push({x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 1.0, color});
    }
}

function updateParticles() {
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.08;
        if (p.life <= 0) state.particles.splice(i, 1);
    }
}

let lastTime = 0;
let animationFrameId = null;
const FPS = 60;
const frameInterval = 1000 / FPS;

function gameLoop(currentTime) {
    animationFrameId = requestAnimationFrame(gameLoop);
    if (!currentTime) currentTime = performance.now();    
    const deltaTime = currentTime - lastTime;

    if (deltaTime >= frameInterval) {
        lastTime = currentTime - (deltaTime % frameInterval);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (state.isPlaying) {
            if (state.isWaveActive) {
                state.waveTimer--;
                if (state.waveTimer <= 0 && state.waveQueue.length > 0) {
                    const enemyData = state.waveQueue.shift();
                    state.enemies.push(new Enemy(enemyData.idx, state.wave, enemyData.isBoss));
                    state.waveTimer = enemyData.isBoss ? 200 : Math.max(30, 60 - state.wave * 2);
                } else if (state.waveQueue.length === 0 && state.enemies.length === 0) {
                    endWave();
                }
            }
            state.towers.forEach(t => t.update());
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const enemy = state.enemies[i];
                const status = enemy.update();
                if (status === 'finished') {
                    state.lives -= enemy.isBoss ? 5 : 1;
                    state.enemies.splice(i, 1);
                    updateUI();
                    createParticles(enemy.x, enemy.y, '#fc8181', 15);
                    if (state.lives <= 0) gameOver();
                } else if (enemy.hp <= 0) {
                    state.money+=enemy.reward;
                    if(enemy.isBoss)state.lives=Math.min(CONFIG.startLives,state.lives+1);
                    state.enemies.splice(i,1);
                    updateUI();
                    createParticles(enemy.x, enemy.y, '#68d391', 10);
                }
            }
            for (let i = state.projectiles.length - 1; i >= 0; i--) {
                const p = state.projectiles[i];
                if (p.type.id === 'spray' || p.type.id === 'trap') {
                    const speed = 7;
                    const dx = p.target.x - p.x;
                    const dy = p.target.y - p.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < speed) {
                        p.target.hp -= p.tower.getDamage();
                        if (p.type.id === 'trap' && !p.target.mutant) {
                            p.target.frozenTimer = 60;
                            p.target.frozenSpeedMultiplier = p.tower.getSlowMultiplier(p.target.isBoss);
                        }
                        state.projectiles.splice(i, 1);
                    } else {
                        p.x += (dx / dist) * speed;
                        p.y += (dy / dist) * speed;
                    }
                } else if (p.type.id === 'zapper') {
                    state.projectiles.splice(i, 1);
                }
            }
            updateParticles();
        }
        draw();
    }
}

function draw() {
    ctx.save();
    if (state.shakeTimer > 0) {
        const intensity = 7; 
        const dx = (Math.random() - 0.5) * intensity;
        const dy = (Math.random() - 0.5) * intensity;
        ctx.translate(dx, dy);
        state.shakeTimer--;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            ctx.fillStyle = state.map[r][c] === 1 ? '#bfe7ff' : '#f3d9ff';
            ctx.fillRect(c * CONFIG.tileSize, r * CONFIG.tileSize, CONFIG.tileSize, CONFIG.tileSize);
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.strokeRect(c * CONFIG.tileSize, r * CONFIG.tileSize, CONFIG.tileSize, CONFIG.tileSize);
        }
    }
    if (state.startPoint) {
        ctx.font = `${CONFIG.tileSize * 0.8}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🌳', state.startPoint.c * CONFIG.tileSize + CONFIG.tileSize / 2, state.startPoint.r * CONFIG.tileSize + CONFIG.tileSize / 2);
        for (let end of state.endPoints) {
            ctx.fillStyle = '#f9a8d4';
            ctx.fillRect(end.c * CONFIG.tileSize, end.r * CONFIG.tileSize, CONFIG.tileSize, CONFIG.tileSize);
            ctx.fillStyle = '#7c3aed';
            ctx.fillText('🏰', end.c * CONFIG.tileSize + CONFIG.tileSize / 2, end.r * CONFIG.tileSize + CONFIG.tileSize / 2);
        }
    }
    state.towers.forEach(t => t.draw(ctx));
    state.enemies.forEach(e => e.draw(ctx));
    state.projectiles.forEach(p => {
        if (p.type.id === 'spray') {
            ctx.fillStyle = '#63b3ed';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        } else if (p.type.id === 'trap') {
            ctx.fillStyle = '#ed8936';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        } else if (p.type.id === 'zapper') {
            ctx.strokeStyle = '#d6bcfa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.tx, p.ty);
            ctx.stroke();
        }
    });
    state.towers.filter(t => t.type.id === 'poison').forEach(t => {
        ctx.fillStyle = 'rgba(72, 187, 120, 0.15)';
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.getRange(), 0, Math.PI * 2);
        ctx.fill();
    });
    for (const p of state.particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1.0;
    }
    ctx.restore();
}

function startWave() {
    if (state.isWaveActive) return;
    ensureAudio();
    playSfx('wave');
    state.isWaveActive = true;
    waveBtn.disabled = true;
    waveBtn.textContent = 'Storm in progress...';
    state.waveQueue = [];
    const isBossWave = state.wave % CONFIG.bossWaveInterval === 0;
    if (isBossWave) showBossWarning();
    const count = Math.min(90, 12 + state.wave * 3 + (state.wave / 5 | 0) * 3);
    for (let i = 0; i < count; i++) {
        let typesAvailable = 1;
        if (state.wave >= 3) typesAvailable = 2;
        if (state.wave >= 6) typesAvailable = 3;
        if (state.wave >= 10) typesAvailable = 4;
        let typeIdx = Math.floor(Math.random() * typesAvailable);
        if (state.wave > 15 && typeIdx === 0 && Math.random() > 0.5) {
            typeIdx = Math.floor(Math.random() * (typesAvailable - 1)) + 1;
        }
        state.waveQueue.push({idx: typeIdx, isBoss: false});
    }
    if (isBossWave) {
        const bossData = {idx: state.wave === 5 ? 1 : Math.floor(Math.random() * 2) + 1, isBoss: true};
        if (state.wave === 5) {
            state.waveQueue.push(bossData);
        } else {
            const randomIndex = Math.floor(Math.random() * (state.waveQueue.length + 1));
            state.waveQueue.splice(randomIndex, 0, bossData);
        }
    }
    state.waveTimer = 28;
}

function showBossWarning() {
    triggerShake(20);
    bossWarning.style.opacity = 1;
    bossWarning.style.transform = 'translate(-50%, -50%) scale(1.2)';
    setTimeout(() => {
        bossWarning.style.opacity = 0;
        bossWarning.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 2000);
}

function endWave() {
    state.isWaveActive = false;
    state.wave++;
    updateUI();
    waveBtn.disabled = false;
    waveBtn.textContent = `Start Wave ${state.wave}`;
    if (state.wave % CONFIG.bossWaveInterval === 0) {
        waveBtn.style.background = 'linear-gradient(135deg, #fb7185, #f59e0b, #a78bfa)';
        waveBtn.textContent = `⚠️ Wave ${state.wave} Boss`;
    } else {
        waveBtn.style.background = '';
    }
}

function gameOver() {
    state.isPlaying = false;
    stopBGM();
    playSfx('lose');
    modalTitle.textContent = 'Magic Faded';
    modalMessage.innerHTML = `The castle was overrun by the storm...<br>Reached: Wave ${state.wave}`;
    modalBtn.onclick = () => init();
    modalOverlay.style.display = 'flex';
}

function setupUI() {
    towerControls.innerHTML = '';
    towerButtons.length = 0;
    const keys = Object.keys(TOWERS);
    keys.forEach(key => {
        const t = TOWERS[key];
        const btn = document.createElement('div');
        btn.className = 'tower-btn';
        btn.innerHTML = `<div class="tower-icon">${t.icon}</div><div class="tower-cost">🌟${t.cost}</div><div class="tower-name">${t.name}</div>`;
        btn.onclick = () => selectTower(key, btn);
        towerControls.appendChild(btn);
        towerButtons.push(btn);
    });
    waveBtn.onclick = () => {
        unlockAudio();
        startBGM();
        startWave();
    };
    upgradeBtn.onclick = () => {
        unlockAudio();
        selectUpgradeMode();
    };
    saveBtn.onclick = () => {
        unlockAudio();
        saveGame();
    };
    loadBtn.onclick = () => {
        unlockAudio();
        loadGame();
    };
    bgmBtn.onclick = () => {
        toggleBGM();
        updateBGMButton();
    };
    updateBGMButton();
}

function selectTower(key, btnElement) {
    if (state.selectedTower === key && state.mode === 'build') {
        state.selectedTower = null;
        state.mode = null;
    } else {
        state.selectedTower = key;
        state.mode = 'build';
    }
    towerButtons.forEach(btn => btn.classList.remove('selected'));
    if (state.mode === 'build') btnElement.classList.add('selected');
    upgradeBtn.classList.remove('selected');
}

function updateTowerButtons() {
    const keys = Object.keys(TOWERS);
    towerButtons.forEach((btn, idx) => {
        const key = keys[idx];
        btn.classList.toggle('selected', state.mode === 'build' && state.selectedTower === key);
    });
    upgradeBtn.classList.toggle('selected', state.mode === 'upgrade');
}

function updateUI() {
    uiMoney.textContent = Math.floor(state.money);
    uiLives.textContent = state.lives;
    uiWave.textContent = state.wave;
    const keys = Object.keys(TOWERS);
    towerButtons.forEach((btn, idx) => {
        const cost = TOWERS[keys[idx]].cost;
        const enabled = state.money >= cost;
        btn.style.opacity = enabled ? '1' : '0.4';
        btn.style.filter = enabled ? 'none' : 'grayscale(100%)';
    });
}

function selectUpgradeMode() {
    state.selectedTower = null;
    state.mode = state.mode === 'upgrade' ? null : 'upgrade';
    towerButtons.forEach(b => b.classList.remove('selected'));
    upgradeBtn.classList.toggle('selected', state.mode === 'upgrade');
}

function handleInput(e) {
    if (!state.isPlaying) return;
    if (e.type === 'touchstart') e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    const c = Math.floor(x / CONFIG.tileSize);
    const r = Math.floor(y / CONFIG.tileSize);
    if (c < 0 || c >= CONFIG.cols || r < 0 || r >= CONFIG.rows) return;
    if (state.mode === 'upgrade') {
        const tower = state.towers.find(t => t.c === c && t.r === r);
        if (!tower || tower.level >= CONFIG.maxTowerLevel) return;
        const cost = Math.floor(tower.type.cost * CONFIG.upgradeCostShield);
        if (state.money < cost) return;
        state.money -= cost;
        tower.upgrade ? tower.upgrade() : tower.level++;
        playSfx('upgrade');
        createParticles(tower.x, tower.y, '#faf089', 15);
        updateUI();
        return;
    }
    if (state.mode !== 'build' || !state.selectedTower) return;
    if (state.map[r][c] === 1) return;
    if (state.towers.some(t => t.c === c && t.r === r)) return;
    const towerInfo = TOWERS[state.selectedTower];
    if (state.money < towerInfo.cost) return;
    state.money -= towerInfo.cost;
    state.towers.push(new Tower(c, r, state.selectedTower));
    playSfx('build');
    createParticles(c * CONFIG.tileSize + CONFIG.tileSize / 2, r * CONFIG.tileSize + CONFIG.tileSize / 2, '#feb2b2', 8);
    updateUI();
}

document.addEventListener('keydown', e => {
    unlockAudio();
    if (!state.isPlaying) return;
    if (e.key === 'ArrowLeft') {
        selectNextTower(-1);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        selectNextTower(1);
        e.preventDefault();
    } else if (e.key === '1') {
        selectTower('spray', towerButtons[0]);
        e.preventDefault();
    } else if (e.key === '2') {
        selectTower('trap', towerButtons[1]);
        e.preventDefault();
    } else if (e.key === '3') {
        selectTower('zapper', towerButtons[2]);
        e.preventDefault();
    } else if (e.key === '4') {
        selectTower('poison', towerButtons[3]);
        e.preventDefault();
    } else if (e.key === '5') {
        selectUpgradeMode();
        e.preventDefault();
    }
});

window.addEventListener('pointerdown', () => {
    unlockAudio();
    startBGM();
});

document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audio.ctx) ensureAudio();
});

function selectNextTower(direction) {
    const towerKeys = Object.keys(TOWERS);
    let currentIndex = towerKeys.indexOf(state.selectedTower);
    currentIndex = currentIndex === -1 ? 0 : (currentIndex + direction + towerKeys.length) % towerKeys.length;
    state.selectedTower = towerKeys[currentIndex];
    updateTowerButtons();
}

async function saveGame() {
    ensureAudio();
    playSfx('build');
    if (state.enemies.length > 0 && !confirm('Saving while a wave is active will reset enemy positions until the next wave begins.\nProceed?')) return;
    const saveData = {
        version: SAVE_VERSION,
        wave: state.wave,
        money: state.money,
        lives: state.lives,
        map: state.map,
        startPoint: state.startPoint,
        endPoints: state.endPoints,
        towers: state.towers.map(t => ({c: t.c, r: t.r, type: t.type.id, level: t.level}))
    };
    const jsonString = JSON.stringify(saveData);
    
    // Try to use clipboard API if available
    if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
            await navigator.clipboard.writeText(jsonString);
            alert('✅ Saved to clipboard!\n\nPaste it into a notes app or text file to keep your rainbow progress safe.');
            return;
        } catch (err) {
            console.warn('Clipboard access failed, falling back to prompt:', err);
        }
    }
    
    // Fallback: show JSON in prompt for manual copy
    prompt('📋 Copy this data (Ctrl+C or Cmd+C):', jsonString);
}

function validateSaveData(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
        throw new Error('Save data must be an object.');
    }
    if (data.version !== undefined && data.version !== SAVE_VERSION) {
        throw new Error(`Unsupported save version: ${data.version}`);
    }
    if (!Number.isInteger(data.wave) || data.wave < 1) {
        throw new Error('Wave must be a positive integer.');
    }
    if (!Number.isFinite(data.money) || data.money < 0 || !Number.isFinite(data.lives) || data.lives < 0) {
        throw new Error('Money and lives must be finite non-negative numbers.');
    }
    if (!Array.isArray(data.map) || data.map.length !== CONFIG.rows || data.map.some(row =>
        !Array.isArray(row) || row.length !== CONFIG.cols || row.some(cell => cell !== 0 && cell !== 1))) {
        throw new Error(`Map must be exactly ${CONFIG.rows}x${CONFIG.cols}.`);
    }

    const isOnBoard = point => point && Number.isInteger(point.c) && Number.isInteger(point.r) &&
        point.c >= 0 && point.c < CONFIG.cols && point.r >= 0 && point.r < CONFIG.rows;
    if (!isOnBoard(data.startPoint) || data.map[data.startPoint.r][data.startPoint.c] !== 1) {
        throw new Error('Start point must be on the path and inside the map.');
    }
    if (!Array.isArray(data.endPoints) || data.endPoints.length === 0 || data.endPoints.length > CONFIG.cols) {
        throw new Error('End points are invalid.');
    }
    for (const endPoint of data.endPoints) {
        if (!isOnBoard(endPoint) || data.map[endPoint.r][endPoint.c] !== 1) {
            throw new Error('Every end point must be on the path and inside the map.');
        }
    }

    const reachable = new Set([`${data.startPoint.r},${data.startPoint.c}`]);
    const queue = [data.startPoint];
    const directions = [{r: 1, c: 0}, {r: -1, c: 0}, {r: 0, c: 1}, {r: 0, c: -1}];
    while (queue.length > 0) {
        const point = queue.shift();
        for (const direction of directions) {
            const r = point.r + direction.r;
            const c = point.c + direction.c;
            const key = `${r},${c}`;
            if (r >= 0 && r < CONFIG.rows && c >= 0 && c < CONFIG.cols &&
                data.map[r][c] === 1 && !reachable.has(key)) {
                reachable.add(key);
                queue.push({r, c});
            }
        }
    }
    if (data.endPoints.some(endPoint => !reachable.has(`${endPoint.r},${endPoint.c}`))) {
        throw new Error('Every end point must be reachable from the start point.');
    }

    if (!Array.isArray(data.towers) || data.towers.length > CONFIG.rows * CONFIG.cols) {
        throw new Error('Too many towers in save data.');
    }
    const occupied = new Set();
    for (const tower of data.towers) {
        if (!tower || typeof tower !== 'object' || !isOnBoard(tower) ||
            typeof tower.type !== 'string' || !Object.hasOwn(TOWERS, tower.type)) {
            throw new Error('Tower data contains an invalid position or type.');
        }
        if (data.map[tower.r][tower.c] === 1) {
            throw new Error('Towers cannot be placed on the path.');
        }
        const key = `${tower.r},${tower.c}`;
        if (occupied.has(key)) {
            throw new Error('Multiple towers cannot occupy the same tile.');
        }
        occupied.add(key);
        if (tower.level !== undefined && (!Number.isInteger(tower.level) ||
            tower.level < 1 || tower.level > CONFIG.maxTowerLevel)) {
            throw new Error('Tower level is invalid.');
        }
    }
}

function loadGame() {
    ensureAudio();
    playSfx('upgrade');
    const json = prompt('Paste your saved JSON data here:');
    if (!json) return;
    try {
        if (json.length > MAX_SAVE_JSON_LENGTH) {
            throw new Error('Save data is too large.');
        }
        const data = JSON.parse(json);
        validateSaveData(data);
        state.wave = data.wave;
        state.money = data.money;
        state.lives = data.lives;
        state.map = data.map;
        state.startPoint = data.startPoint;
        state.endPoints = data.endPoints || [{c: CONFIG.cols - 1, r: Math.floor(CONFIG.rows / 2)}];
        if (typeof rebuildNavMap === 'function') {
            rebuildNavMap();
        } else {
            console.error('rebuildNavMap function is missing!');
            alert('Error: rebuildNavMap was not found. Check the map generation code.');
            return;
        }
        state.towers = data.towers.map(tData => {
            const tower = new Tower(tData.c, tData.r, tData.type);
            if (Number.isInteger(tData.level)) {
                tower.level = Math.min(CONFIG.maxTowerLevel, Math.max(1, tData.level));
            }
            return tower;
        });
        state.enemies = [];
        state.projectiles = [];
        state.particles = [];
        state.waveQueue = [];
        state.selectedTower = null;
        state.mode = null;
        state.isPlaying = true;
        state.isWaveActive = false;
        modalOverlay.style.display = 'none';
        waveBtn.disabled = false;
        waveBtn.textContent = `Start Wave ${state.wave}`;
        if (state.wave % CONFIG.bossWaveInterval === 0) {
            waveBtn.style.background = 'linear-gradient(135deg, #fb7185, #f59e0b, #a78bfa)';
            waveBtn.textContent = `⚠️ Wave ${state.wave} Boss`;
        } else {
            waveBtn.style.background = '';
        }
        draw();
        updateUI();
        alert(`📂 Loaded! You can continue from Wave ${state.wave}.`);
    } catch (err) {
        console.error(err);
        alert('❌ Load failed: the data is corrupted or the game code has an error.\n' + err.message);
    }
}

class Enemy {
constructor(typeIdx, wave, isBoss = false) {
        const type = ENEMIES[typeIdx];
        this.type = type;
        this.isBoss = isBoss;
        this.mutant=!isBoss&&wave>10&&Math.random()<.05;
        this.col = state.startPoint.c;
        this.row = state.startPoint.r;
        this.prevC = this.col;
        this.prevR = this.row;
        this.targetC = this.col;
        this.targetR = this.row;
        this.x = this.col * CONFIG.tileSize + CONFIG.tileSize / 2;
        this.y = this.row * CONFIG.tileSize + CONFIG.tileSize / 2;        
        let hpMultiplier=wave>20?30.13*1.04**(wave-20):(1.08**(wave-1)+wave*.9)*(wave>10?1+(wave-10)*.035:1);
        if (isBoss) {
            const bossHpMultiplier = wave === 5 ? 9.3 : 6.5;
            const bossSpeedMultiplier = wave === 5 ? 0.5 : 0.55;
            hpMultiplier *= bossHpMultiplier;
            this.speed =
                type.speed *
                CONFIG.tileSize *
                bossSpeedMultiplier;
            this.radius = CONFIG.tileSize * 0.6;
            this.reward = type.reward * 7;
        } else {
            this.speed = type.speed * CONFIG.tileSize;
            this.radius = CONFIG.tileSize * 0.35;
            this.reward = type.reward;
        }
        let speedBonus = wave <= 10 ? wave * 0.015 : 0.15 + (wave - 10) * 0.025;
        const speedBoost = 1 + Math.min(0.8, speedBonus);
        this.speed *= speedBoost;
        this.maxHp = Math.floor(CONFIG.baseEnemyHp * type.hpMod * hpMultiplier);
        this.hp = this.maxHp;
        this.baseSpeed = this.speed;
        this.frozenTimer = 0;
        this.frozenSpeedMultiplier = 1;
        this.wrongPathTimer = 0;
    }

    update() {
        if (this.wrongPathTimer > 0) this.wrongPathTimer--;
        if (this.frozenTimer > 0) {
            this.frozenTimer--;
            this.speed = this.baseSpeed * this.frozenSpeedMultiplier;
        } else {
            this.speed = this.baseSpeed;
            this.frozenSpeedMultiplier = 1;
        }
        const tx = this.targetC * CONFIG.tileSize + CONFIG.tileSize / 2;
        const ty = this.targetR * CONFIG.tileSize + CONFIG.tileSize / 2;
        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < this.speed) {
            this.prevC = this.col;
            this.prevR = this.row;
            this.x = tx;
            this.y = ty;
            this.col = this.targetC;
            this.row = this.targetR;
            const isGoal = state.endPoints.some(p => p.c === this.col && p.r === this.row);
            if (isGoal) return 'finished';
            const nextOptions = state.navMap[this.row][this.col];
            if (!nextOptions || nextOptions.length === 0) {
                this.targetC = this.col;
                this.targetR = this.row;
                return 'active';
            }
            const minDist = Math.min(...nextOptions.map(n => n.dist));
            const bestCandidates = nextOptions.filter(next => next.dist === minDist && !(next.c === this.prevC && next.r === this.prevR && nextOptions.length > 1));
            let candidates = bestCandidates.length > 0 ? bestCandidates : nextOptions.filter(next => next.dist === minDist);
            
            // 一定確率で最短ルート以外を選ぶ
            let next = candidates[0];
            if (Math.random() < Math.max(0, 0.4 - (state.wave - 1) * 0.02)) {
                const wrongCandidates = nextOptions.filter(opt => opt.dist > minDist && !(opt.c === this.prevC && opt.r === this.prevR));
                if (wrongCandidates.length > 0) {
                    next = wrongCandidates[Math.floor(Math.random() * wrongCandidates.length)];
                    this.wrongPathTimer = 45;
                } else if (candidates.length > 1) {
                    // 最短ルート以外がない場合は最短ルート内で別の選択肢を選ぶ
                    next = candidates[Math.floor(Math.random() * candidates.length)];
                }
            }
            this.targetC = next.c;
            this.targetR = next.r;
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
        return 'active';
    }

    draw(ctx) {
        const scale = this.isBoss ? 1.8 : 1.0;
        ctx.font = `${CONFIG.tileSize * 0.7 * scale}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (this.isBoss || this.mutant) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'red';
        }
        ctx.fillText(this.type.icon, this.x, this.y);
        ctx.shadowBlur = 0;
        const hpPercent = this.hp / this.maxHp;
        const barWidth = this.isBoss ? 40 : 20;
        const barY = this.y - (this.isBoss ? 25 : 15);
        ctx.fillStyle = '#1a202c';
        ctx.fillRect(this.x - barWidth / 2, barY, barWidth, 4);
        ctx.fillStyle = hpPercent < 0.3 ? '#fc8181' : (hpPercent < 0.6 ? '#f6ad55' : '#68d391');
        ctx.fillRect(this.x - barWidth / 2, barY, barWidth * hpPercent, 4);
        if (this.wrongPathTimer > 0) {
            ctx.fillStyle = '#2d3748';
            ctx.font = `bold ${CONFIG.tileSize * 0.55}px Arial`;
            ctx.fillText('?', this.x + barWidth / 2 + 8, barY - 2);
        }
        if (this.frozenTimer > 0) {
            ctx.fillStyle = 'rgba(99, 179, 237, 0.4)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

class Tower {
    constructor(c, r, typeKey) {
        this.c = c;
        this.r = r;
        this.x = c * CONFIG.tileSize + CONFIG.tileSize / 2;
        this.y = r * CONFIG.tileSize + CONFIG.tileSize / 2;
        this.type = TOWERS[typeKey];
        this.level = 1;
        this.cooldown = 0;
        this.angle = 0;
    }

    upgrade() {
        if (this.level < CONFIG.maxTowerLevel) {
            this.level++;
            return true;
        }
        return false;
    }

    getDamage() {
        return this.type.damage * (1 + (this.level - 1) * 0.5);
    }

    getRange() {
        return this.type.range * CONFIG.tileSize * (1 + (this.level - 1) * 0.1);
    }

    getSlowMultiplier(isBoss) {
        const baseMultiplier = isBoss ? 0.7 : this.type.slow;
        return Math.max(0.2, baseMultiplier - (this.level - 1) * 0.05);
    }

    update() {
        if (this.cooldown > 0) this.cooldown--;
        const range = this.getRange();
        let target=null,minDist=1/0;
        for(const enemy of state.enemies){
            let dist=Math.hypot(enemy.x-this.x,enemy.y-this.y);
            let score=dist-(this.type.id==='zapper'&&enemy.isBoss)*1e6;
            if(dist<=range&&score<minDist){
                minDist=score;
                target=enemy;
            }
        }
        if (!target) return;
        this.angle = Math.atan2(target.y - this.y, target.x - this.x);
        if (this.cooldown <= 0) {
            this.fire(target);
            this.cooldown = this.type.cooldown;
        }
    }

    fire(target) {
        if (this.type.id === 'spray' || this.type.id === 'zapper') {
            state.projectiles.push({x: this.x, y: this.y, tx: target.x, ty: target.y, target, tower: this, type: this.type});
            playSfx(this.type.id);
            if (this.type.id === 'zapper') {
                target.hp -= this.getDamage();
                createParticles(target.x, target.y, '#f6e05e', 5);
            }
        } else if (this.type.id === 'trap') {
            state.projectiles.push({x: this.x, y: this.y, target, tower: this, type: this.type});
            playSfx(this.type.id);
        } else if (this.type.id === 'poison') {
            for (const enemy of state.enemies) {
                const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                if (dist <= this.getRange()) {
                    enemy.hp -= this.getDamage();
                    if (Math.random() < 0.2) createParticles(enemy.x, enemy.y, '#68d391', 1);
                }
            }
        }
    }

    draw(ctx) {
        ctx.fillStyle = '#2d3748';
        ctx.fillRect(this.c * CONFIG.tileSize + 2, this.r * CONFIG.tileSize + 2, CONFIG.tileSize - 4, CONFIG.tileSize - 4);
        ctx.strokeStyle = this.type.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(this.c * CONFIG.tileSize + 4, this.r * CONFIG.tileSize + 4, CONFIG.tileSize - 8, CONFIG.tileSize - 8);
        ctx.font = `${CONFIG.tileSize * 0.6}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type.icon, this.x, this.y);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 12px Arial';
        ctx.fillText('Lv' + this.level, this.x, this.y + 15);
        if (this.type.id !== 'poison') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.type.color;
            ctx.fillRect(0, -3, 16, 6);
            ctx.restore();
        }
        if (this.cooldown > 0) {
            const percent = this.cooldown / this.type.cooldown;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.arc(this.x, this.y, CONFIG.tileSize / 2 - 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * percent);
            ctx.fill();
        }
    }
}

function generateMap() {
    state.map = Array(CONFIG.rows).fill().map(() => Array(CONFIG.cols).fill(0));
    const centerR = 5;
    state.startPoint = {c: 0, r: centerR};
    state.endPoints = [{c: CONFIG.cols - 1, r: centerR}];
    const minR = 1;
    const maxR = 7;
    let stack = [];
    state.map[centerR][1] = 1;
    stack.push({r: centerR, c: 1});
    const dirs = [{r:-2,c:0}, {r:2,c:0}, {r:0,c:-2}, {r:0,c:2}];
    while (stack.length > 0) {
        let curr = stack[stack.length - 1];
        const shuffledDirs = [...dirs].sort(() => Math.random() - 0.5);
        const neighbors = [];
        for (let d of shuffledDirs) {
            let nr = curr.r + d.r;
            let nc = curr.c + d.c;
            if (nr >= minR && nr <= maxR && nc >= 1 && nc <= CONFIG.cols - 2 && state.map[nr][nc] === 0) {
                neighbors.push({r: nr, c: nc, dr: d.r, dc: d.c});
            }
        }
        if (neighbors.length > 0) {
            let next = neighbors[0];
            state.map[next.r][next.c] = 1;
            state.map[curr.r + next.dr/2][curr.c + next.dc/2] = 1;
            stack.push({r: next.r, c: next.c});
        } else {
            stack.pop();
        }
    }
    state.map[centerR][0] = 1;
    state.map[centerR][CONFIG.cols - 1] = 1;
    for (let c = CONFIG.cols - 2; c >= 1; c--) {
        if (state.map[centerR][c] === 1) break;
        state.map[centerR][c] = 1;
    }
    rebuildNavMap();
}

function rebuildNavMap() {
    const distGrid = Array(CONFIG.rows).fill().map(() => Array(CONFIG.cols).fill(Infinity));
    state.navMap = Array(CONFIG.rows).fill().map(() => Array(CONFIG.cols).fill().map(() => []));
    const goal = state.endPoints[0];
    let queue = [{r: goal.r, c: goal.c, d: 0}];
    distGrid[goal.r][goal.c] = 0;
    const dirs = [{r:1,c:0}, {r:-1,c:0}, {r:0,c:1}, {r:0,c:-1}];
    while (queue.length > 0) {
        let curr = queue.shift();
        for (let dir of dirs) {
            let nr = curr.r + dir.r;
            let nc = curr.c + dir.c;
            if (nr >= 0 && nr < CONFIG.rows && nc >= 0 && nc < CONFIG.cols && state.map[nr][nc] === 1 && distGrid[nr][nc] === Infinity) {
                distGrid[nr][nc] = curr.d + 1;
                queue.push({r: nr, c: nc, d: curr.d + 1});
            }
        }
    }
    for (let r = 0; r < CONFIG.rows; r++) {
        for (let c = 0; c < CONFIG.cols; c++) {
            if (state.map[r][c] === 1) {
                let neighbors = [];
                for (let dir of dirs) {
                    let nr = r + dir.r;
                    let nc = c + dir.c;
                    if (nr >= 0 && nr < CONFIG.rows && nc >= 0 && nc < CONFIG.cols && state.map[nr][nc] === 1) {
                        neighbors.push({r: nr, c: nc, dist: distGrid[nr][nc]});
                    }
                }
                neighbors.sort((a, b) => a.dist - b.dist);
                state.navMap[r][c] = neighbors;
            }
        }
    }
}

canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', handleInput, {passive: false});
window.onload = init;
window.onresize = resizeCanvas;
</script>
