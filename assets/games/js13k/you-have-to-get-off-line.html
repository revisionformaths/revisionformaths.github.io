<html>

        <style>html, body {
    background: #161616;
    height: 100%;
    margin: 0;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
}

#container {
    position: absolute;
}

#container > *, label {
    -moz-user-select: none;
    -moz-user-select: -moz-none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

#bcanvas, #canvas, #load, #home, #screen {
    display: block;
    height: 100%;
    left: 0;
    position: absolute;
    top: 0;
    -webkit-transform: translate3d(0, 0, 0);
    transform: translate3d(0, 0, 0);
    width: 100%;
}

#bcanvas {
    background: #101010;
}

#load, #home {
    background: rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
    color: #fff;
    cursor: default;
    font: 300 64px/96px 'Segoe UI', 'Helvetica Neue', sans-serif;
    height: 1080px;
    padding: 0 100px;
    transform-origin: 0 0;
    width: 1920px;
}

#load + #home {
    display: none;
}

#load > *, #home > * {
    margin: 40px 0;
}

h1 {
    font: 300 96px/1 'Segoe UI', 'Helvetica Neue', sans-serif;
    margin-top: 80px;
}

h1, p {
    text-shadow: 0 0 20px #101010;
}

#screen {
    background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAACCAQAAAAziH6sAAAADklEQVR4AWNmMGb+zwAAAusBObK7SDsAAAAASUVORK5CYII=);
    pointer-events: none;
    z-index: 10;
}

#start {
    -webkit-animation: blink 0.7s steps(2, start) infinite;
    animation: blink 0.7s steps(2, start) infinite;
    background: #E1FF5F;
    border-radius: 2px;
    color: #202020;
    cursor: pointer;
    display: inline-block;
    font-size: 48px;
    font-weight: bold;
    outline: 4px none;
    outline-offset: 4px;
    padding: 40px 120px;
}

#start:hover {
    background: #fff;
}

@-webkit-keyframes blink {
    to {
        outline: 4px solid #E1FF5F;
    }
}

@keyframes blink {
    to {
        outline: 4px solid #E1FF5F;
    }
}

#menu {
    position: absolute;
    right: 0;
    top: 0;
    transform: translate3d(0,0,0);
    width: 550px;
}

.xopt {
    -moz-appearance: none;
    -webkit-appearance: none;
    display: none;
}

.opt, .opt::after, .opt::before {
    box-sizing: border-box;
}

.opt {
    display: inline-block;
    height: 48px;
    margin: 0 10px;
    outline: 0;
    position: relative;
    width: 80px;
}

.opt::after, .opt::before {
    border-radius: 100px;
    content: '';
    display: inline-block;
    position: absolute;
    transition: all 0.2s;
}

.opt::after {
    background: #fff;
    border: 2px solid #607d8b;
    height: 40px;
    left: 4px;
    top: 4px;
    width: 40px;
}

.opt::before {
    background: #b0bec5;
    height: 48px;
    width: 80px;
}

.xopt:checked+label>.opt::after {
    left: 36px;
}

.xopt:checked+label>.opt::before {
    background: #c6ff00;
}

label {
    color: #eeff41;
}

body.mobile #menu > * {
    display: none;
}
</style>

    // Wave data configuration
    var WAVE_SPS = 44100;                    // Samples per second
    var WAVE_CHAN = 2;                       // Channels
    var WAVE_SIZE = WAVE_SPS * song.songLen; // Total song size (in samples)

    // Initialize buffers etc. (constructor)

        // compact, and quite fast).

        // 32767 x 32767, so we create a square bitmap buffer (with some
        // trailing bytes that we don't care too much about)

        {

            mixBuf[b + 1] = 128;

    function osc_sin(value)
    {
        return Math.sin(value * 6.283184);
    }

    function osc_square(value)
    {
        if(osc_sin(value) < 0) return -1;
        return 1;
    }

    function osc_saw(value)
    {
        return (value % 1) - 0.5;
    }

    function osc_tri(value)
    {
        var v2 = (value % 1) * 4;
        if(v2 < 2) return v2 - 1;
        return 3 - v2;
    }

    function getnotefreq(n)
    {
        return 0.00390625 * Math.pow(1.059463094, n - 128);
    }

    // Public members
    //--------------------------------------------------------------------------

    // Number of lines per second (song speed)

    // Generate audio data for a single track

    {

        [
            osc_sin,
            osc_square,
            osc_saw,
            osc_tri

            c1, c2, q, low, band, high, t, lfor, e, x,
            rsample, f, da, o1t, o2t;

            osc1 = oscillators[instr.osc1_waveform],

            sustain = instr.env_sustain,
            release = instr.env_release,

            lfoFreq = Math.pow(2, instr.lfo_freq - 8) / rowLen;

            chnBuf[b+1] = 128;
        }

        currentpos = 0;
        for(p = 0; p < song.endPattern - 1; ++p) // Patterns
        {
            cp = instr.p[p];
            for(row = 0;row < 32; ++row) // Rows
            {
                if(cp)
                {
                    n = instr.c[cp - 1].n[row];
                    if(n)
                    {
                        c1 = c2 = 0;

                        // Precalculate frequencues
                        o1t = getnotefreq(n + (instr.osc1_oct - 8) * 12 + instr.osc1_det) * (1 + 0.0008 * instr.osc1_detune);
                        o2t = getnotefreq(n + (instr.osc2_oct - 8) * 12 + instr.osc2_det) * (1 + 0.0008 * instr.osc2_detune);

                        // State variable init
                        q = instr.fx_resonance / 255;
                        low = band = 0;
                        for (j = attack + sustain + release - 1; j >= 0; --j)
                        {
                            k = j + currentpos;

                            // LFO
                            lfor = osc_lfo(k * lfoFreq) * instr.lfo_amt / 512 + 0.5;

                            // Envelope
                            e = 1;
                            if(j < attack)
                                e = j / attack;
                            else if(j >= attack + sustain)
                                e -= (j - attack - sustain) / release;

                            // Oscillator 1
                            t = o1t;
                            if(instr.lfo_osc1_freq) t += lfor;
                            if(instr.osc1_xenv) t *= e * e;
                            c1 += t;
                            rsample = osc1(c1) * instr.osc1_vol;

                            // Oscillator 2
                            t = o2t;
                            if(instr.osc2_xenv) t *= e * e;
                            c2 += t;
                            rsample += osc2(c2) * instr.osc2_vol;

                            // Noise oscillator
                            if(instr.noise_fader) rsample += (2*Math.random()-1) * instr.noise_fader * e;

                            rsample *= e / 255;

                            // State variable filter
                            f = instr.fx_freq;
                            if(instr.lfo_fx_freq) f *= lfor;
                            f = 1.5 * Math.sin(f * 3.141592 / WAVE_SPS);
                            low += f * band;
                            high = q * (rsample - band) - low;
                            band += f * high;
                            switch(instr.fx_filter)
                            {
                                case 1: // Hipass
                                    rsample = high;
                                    break;
                                case 2: // Lopass
                                    rsample = low;
                                    break;
                                case 3: // Bandpass
                                    rsample = band;
                                    break;
                                case 4: // Notch
                                    rsample = low + high;
                                default:
                            }

                            // Panning & master volume
                            t = osc_sin(k * panFreq) * instr.fx_pan_amt / 512 + 0.5;
                            rsample *= 39 * instr.env_master;

                            // Add to 16-bit channel buffer
                            k <<= 2;
                            x = chnBuf[k] + (chnBuf[k+1] << 8) + rsample * (1 - t);
                            chnBuf[k] = x & 255;
                            chnBuf[k+1] = (x >> 8) & 255;
                            x = chnBuf[k+2] + (chnBuf[k+3] << 8) + rsample * t;
                            chnBuf[k+2] = x & 255;
                            chnBuf[k+3] = (x >> 8) & 255;
                        }
                    }
                }
                currentpos += rowLen;
            }
        }

        // Delay
        p = (instr.fx_delay_time * rowLen) >> 1;
        t = instr.fx_delay_amt / 255;

        for(n = 0; n < waveSamples - p; ++n)
        {
            b = 4 * n;
            k = 4 * (n + p);

            // Left channel = left + right[-p] * t
            x = chnBuf[k] + (chnBuf[k+1] << 8) +
                (chnBuf[b+2] + (chnBuf[b+3] << 8) - 32768) * t;
            chnBuf[k] = x & 255;
            chnBuf[k+1] = (x >> 8) & 255;

            // Right channel = right + left[-p] * t
            x = chnBuf[k+2] + (chnBuf[k+3] << 8) +
                (chnBuf[b] + (chnBuf[b+1] << 8) - 32768) * t;
            chnBuf[k+2] = x & 255;
            chnBuf[k+3] = (x >> 8) & 255;
        }

        // Add to mix buffer
        for(b = 0; b < waveBytes; b += 2)
        {
            x = mixBuf[b] + (mixBuf[b+1] << 8) + chnBuf[b] + (chnBuf[b+1] << 8) - 32768;
            mixBuf[b] = x & 255;
            mixBuf[b+1] = (x >> 8) & 255;
        }
    };

    // Create an HTML audio element from the generated audio data
    this.createAudio = function()
    {
        // Local variables

        var mixBuf = mixBufWork,
            waveBytes = WAVE_SIZE * WAVE_CHAN * 2;

        // Convert to a WAVE file (in a binary string)

        l2 = l1 - 36;
        wave = String.fromCharCode(82,73,70,70,
                                   l1 & 255,(l1 >> 8) & 255,(l1 >> 16) & 255,(l1 >> 24) & 255,

                                   68,172,0,0,16,177,2,0,4,0,16,0,100,97,116,97,
                                   l2 & 255,(l2 >> 8) & 255,(l2 >> 16) & 255,(l2 >> 24) & 255);

        {
            // This is a GC & speed trick: don't add one char at a time - batch up
            // larger partial strings
            x = "";
            for (k = 0; k < 256 && b < waveBytes; ++k, b += 2)
            {
                // Note: We amplify and clamp here
                y = 4 * (mixBuf[b] + (mixBuf[b+1] << 8) - 32768);
                y = y < -32768 ? -32768 : (y > 32767 ? 32767 : y);
                x += String.fromCharCode(y & 255, (y >> 8) & 255);
            }
            wave += x;
        }

        // Convert the string buffer to a base64 data uri
        s = "data:audio/wav;base64," + btoa(wave);
        wave = null;

        // Return the music as an audio element
        return new Audio(s);
    };

    // Get n samples of wave data at time t [s]. Wave data in range [0,1].
    this.getData = function(t, n)
    {
        for (var i = Math.floor(t * WAVE_SPS), j = 0, d = [], b = mixBufWork; j < 2*n; j += 2)
        {
            var k = 4 * (i + j) + 1;
            d.push(t > 0 && k < b.length ? (b[k] + b[k-1]/256) / 256 : 0.5);
        }
        return d;
    };
};

        <script>"use strict";
/// <reference path="you_have_to.d.ts" />
var stageFloor = 440;
var stageSize = 880;
var stagePadding = 0.5 * (cwidth - stageSize);
var stageEnd = stagePadding + stageSize;
var colSize = 40;
var colCount = stageSize / colSize;
var Stage = /** @class */ (function () {
    function Stage(lvl) {
        this.columns = lvl.cols;
        this.lasers = lvl.lasers.map(function (a) {
            return new (a.v ? LaserV : Laser)(a.act, a.v ? stagePadding + a.pos : stageFloor - a.pos);
        });
        this.staticImage = makeSprite(cwidth, cheight, this.renderOnce.bind(this));
        if (lvl.render)
            lvl.render(this.staticImage.getContext('2d'));
        renderBackground(bcontext, lvl.title, lvl.ez);
        if (lvl.renderBackground)
            lvl.renderBackground(bcontext);
    }
    Stage.prototype.getFloor = function (x, x2) {
        var a = stageFloor - this.columns[Math.floor((x - stagePadding) / colSize)];
        var b = stageFloor - this.columns[Math.floor((x2 - stagePadding) / colSize)];
        return a < b ? [a, b] : [b, a];
    };
    Stage.prototype.getWall = function (x, y) {
        var n = Math.floor((x - stagePadding) / colSize);
        if (y > stageFloor - this.columns[n]) {
            return stagePadding + n * colSize;
        }
        return x;
    };
    Stage.prototype.reset = function () {
        for (var n = 0; n < this.lasers.length; ++n) {
            this.lasers[n].reset();
        }
    };
    Stage.prototype.kills = function (p) {
        for (var n = 0; n < this.lasers.length; ++n) {
            if (this.lasers[n].kills(p))
                return true;
        }
        return false;
    };
    Stage.prototype.update = function (t) {
        for (var n = 0; n < this.lasers.length; ++n) {
            this.lasers[n].update(t);
        }
    };
    Stage.prototype.render = function (c, t) {
        c.drawImage(this.staticImage, 0, 0);
        for (var n = 0; n < this.lasers.length; ++n) {
            this.lasers[n].render(c, t);
        }
    };
    Stage.prototype.renderOnce = function (c) {
        for (var n = 0; n < colCount; ++n) {
            var left = stagePadding + n * colSize;
            if (this.columns[n] == HOLE) {
                c.fillStyle = '#fff';
                if (n != 0 && this.columns[n - 1] != HOLE) {
                    // c.fillRect(left - 2, stageFloor + 4, 2, 96)
                    c.fillRect(left - 2, stageFloor + 4, 2, 36);
                    c.fillRect(left - 2, stageFloor + 55, 2, 20);
                    c.fillRect(left - 2, stageFloor + 90, 2, 10);
                }
                if (n != colCount - 1 && this.columns[n + 1] != HOLE) {
                    // c.fillRect(left + colSize, stageFloor + 4, 2, 96)
                    c.fillRect(left + colSize, stageFloor + 4, 2, 36);
                    c.fillRect(left + colSize, stageFloor + 55, 2, 20);
                    c.fillRect(left + colSize, stageFloor + 90, 2, 10);
                }
            }
            else {
                var top_1 = stageFloor - this.columns[n];
                c.fillStyle = '#fff';
                c.fillRect(left, stageFloor, colSize, 4);
                c.fillStyle = '#f1f1f1';
                c.fillRect(left, top_1, colSize, this.columns[n]);
            }
        }
    };
    return Stage;
}());
</script>
        <script>"use strict";
/// <reference path="you_have_to.d.ts" />
var player = new Player;
var nowPlaying = 17; // Title screen
var stage = new Stage(LEVELS[nowPlaying]);
var parallax = 0.09;
var parallay = 0.04;
function update(t) {
    var nextLevel = player.update(t, stage);
    if (nextLevel) {
        if (nowPlaying != LEVELS.length - 1)
            ++nowPlaying;
        stage = new Stage(LEVELS[nowPlaying]);
        player.restart();
        aa.play('end');
        return;
    }
    stage.update(t);
    if (stage.kills(player)) {
        player.kill();
        aa.play('hit');
    }
}
function render(t) {
    context.clearRect(0, 0, cwidth, cheight);
    context.save();
    var x = lerp(player.prevPos.x, player.pos.x, t);
    var y = lerp(player.prevPos.y, player.pos.y, t);
    context.translate((0.5 * cwidth - x) * parallax, (0.5 * cheight - y) * parallay);
    stage.render(context, t);
    player.render(context, t);
    context.restore();
    if (player.nDeaths) {
        setFontSize(context, 20);
        paintTextBlob(context, 'Deaths: ' + player.nDeaths, 500);
    }
}
// Music
var music = null;
function initMusic() {
    var synth = new sonant;
    for (var i = 0; i < 8; ++i) {
        synth.generate(i);
    }
    music = synth.createAudio();
    music.loop = true;
    music.volume = 0.7;
}
if (!isMobile) {
    try {
        initMusic();
    }
    catch (err) {
    }
}
// Title screen
var loadingScreen = document.getElementById('load');
var startScreen = document.getElementById('home');
var startButton = document.getElementById('start');
function initMenu() {
    if (isMobile)
        document.body.className = 'mobile';
    var musicToggle = document.getElementById('m');
    var soundToggle = document.getElementById('s');
    musicToggle.checked = !(soundToggle.checked = true);
    musicToggle.addEventListener('change', function (event) {
        if (!music)
            return;
        if (musicToggle.checked) {
            music.currentTime = 0;
            music.play();
        }
        else
            music.pause();
    });
    soundToggle.addEventListener('change', function (event) {
        if (aa.on = soundToggle.checked) {
            aa.play('bip');
        }
    });
    container.removeChild(loadingScreen);
    // if (music) music.play()
}
function start() {
    container.removeChild(startScreen);
    nowPlaying = 0;
    stage = new Stage(LEVELS[nowPlaying]);
    if ((isMobile || cscale > 1) && document.body.requestFullscreen) {
        document.body.requestFullscreen();
    }
    startMainloop(update, render);
    aa.play('bip');
}
startButton.addEventListener('mousedown', start);
startButton.addEventListener('touchstart', start);
handleResize();
initMenu();
</script>
