});

<script>function generateRooftops({GAME_W:W,GAME_H:H,minGap,maxGap,rooftopY}){

function rnd(min,max){return min+Math.random()*(max-min);}

let rooftops=[];
let minw=250;
let maxw=600;

function drawRoundedRect(C,x,y,width,height,radius){
C.beginPath();C.moveTo(x+radius,y);
C.lineTo(x+width-radius,y);C.quadraticCurveTo(x+width,y,x+width,y+radius);C.lineTo(x+width,y+height);C.lineTo(x,y+height);C.lineTo(x,y+radius);C.quadraticCurveTo(x,y,x+radius,y);
C.closePath();
}

function generateInitialRooftops(){
rooftops=[];
let x=0;
while(x<W*2){
  let width=rnd(minw,maxw);
  let gap=rnd(minGap,maxGap);
  rooftops.push({x,width,y:rooftopY});
  x+=width+gap;
}
}

function update({scrollSpeed,delta}){
for(let r of rooftops)r.x-=scrollSpeed*delta;
if(rooftops.length&&rooftops[0].x+rooftops[0].width<0)rooftops.shift();
while(rooftops.length&&rooftops[rooftops.length-1].x<W){
  let last=rooftops[rooftops.length-1];
  let width=rnd(minw,maxw);
  let gap=rnd(minGap,maxGap);
  rooftops.push({x:last.x+last.width+gap,width,y:rooftopY});
}
}

function draw(C){
let radius=5;
for(let r of rooftops){
  let gradient=C.createLinearGradient(0,H,0,r.y);
  gradient.addColorStop(0.00,"hsl(0, 0%, 30%)");
  gradient.addColorStop(0.98,"hsl(0, 0%, 10%)");
  gradient.addColorStop(0.98,"hsl(0, 0%, 70%)");
  gradient.addColorStop(1.00,"hsl(0, 0%, 30%)");
  C.fillStyle=gradient;
  drawRoundedRect(C,r.x,r.y,r.width,H-r.y,radius);
  C.fill();
}
}

generateInitialRooftops();

return {rooftops,update,draw};

}

</script>
<script>function generateSnow({GAME_W:W,GAME_H:H}){

function rnd(min,max){return min+Math.random()*(max-min);}

let color="#FFFFFF";
let count=150;
let speedmin=0.2;
let speedmax=1;
let sizemin=2;
let sizemax=4;
let particles=[];

function init(){
for(let i=0;i<count;i++){
  particles.push({
    x:rnd(0,W),
    y:rnd(0,H),
    size:rnd(sizemin,sizemax),
    speed:rnd(speedmin,speedmax)
  });
}
}

function draw(C,{scrollSpeed:S,delta:D}){
C.fillStyle=color;
for(let p of particles){
  p.y+=p.speed*D;
  p.x-=S*D;
  C.beginPath();
  C.arc(p.x,p.y,p.size,0,Math.PI*2);
  C.fill();
  if(p.y>H){
    p.y=-p.size;
    p.x=rnd(0,W);
  }else if(p.x<-p.size){
    p.x=W+p.size;
    p.y=rnd(0,H);
  }
}
}

init();
return {draw};

}
</script>

let x=0;
while(x<W*2){
  let width=rnd(minw,maxw);let gap=rnd(mingap,maxgap);let height=rnd(minh,maxh);
  B.push({x,width,height,color:bcolor});
  x+=width+gap;
}
}

function draw(ctx,{scrollSpeed,delta}){
for(let r of B){
  r.x-=scrollSpeed*0.5*delta;
  ctx.fillStyle=r.color;
  ctx.fillRect(r.x,H-r.height,r.width,r.height);
  drawWindows(ctx,r.x,H-r.height,r.width,r.height);
}
if(B.length&&B[0].x+B[0].width<0){B.shift();}
while(B.length&&B[B.length-1].x<W){
  let last=B[B.length-1];
  let width=rnd(minw,maxw);let gap=rnd(mingap,maxgap);let height=rnd(minh,maxh);
  B.push({x:last.x+last.width+gap,width,height,color:bcolor});
}
}

function drawWindows(ctx,x,y,width,height){
ctx.fillStyle=wcolor;
for(let i=wingap;i+winw<=width-wingap;i+=winw+wingap){
  for(let j=wingap;j+winh<=height-wingap;j+=winh+wingap){
    ctx.fillRect(x+i,y+j,winw,winh);
  }
}
}

buildings();

return {draw};
}
</script>
