    <script>function inside_rect(ir/*inside rect*/,or/*outside rect*/) {
    function inside(x,y) {
        return x > or.left && x < or.left+or.width
        && y>or.top&&y<or.top+or.height;
    }
    var _in = inside(/*A: x,y*/ ir.left,ir.top)
      ||   inside(/*B: x,y*/ ir.left+ir.width,ir.top)
      ||   inside(/*C: x,y*/ ir.left,ir.top+ir.height)
      ||   inside(/*D: x,y*/ ir.left+ir.width,ir.top+ir.height);
    var x_within = ir.left>or.left && ir.left+ir.width<or.left+or.width;
    var y_within = ir.top>or.top && ir.top+ir.height<or.top+or.height;
    var y_surrounds=(ir.top<or.top&&ir.top+ir.height>or.top)||(ir.top<or.top+or.height&&ir.top+ir.height>or.top+or.height);
    var x_surrounds=(ir.left<or.left&&ir.left+ir.width>or.left)||(ir.left<or.left+or.width&&ir.left+ir.width>or.left+or.width);
    return _in || (
            x_within && y_surrounds
        ) || (
            y_within && x_surrounds
    );
}
function rects_collide(r1,r2) {
    return inside_rect(r1,r2)||inside_rect(r2,r1);
}
</script>

    <script>function tower_decode(tower_char) {
  var tc = tower_char;
  var bit_str = tc.charCodeAt(0).toString(2).padStart(8, "0");
  return bit_str;
}
function removeOrphanBullets() {
  var rmidx = -1;
  G.bullets.forEach((bullet, i) => {
    if (!bullet.tower.isConnected) {
      rmidx = i;
    }
  });

  while (rmidx > -1) {
    var b = G.bullets[rmidx];
    G.bullets.splice(rmidx, 1);
    document.body.removeChild(b);
    rmidx = -1;
    G.bullets.forEach((bullet, i) => {
      if (!bullet.tower.isConnected) {
        rmidx = i;
      }
    });
  }
}

function create_bullet(tow, chg_x = 1, chg_y = 0) {
  var b = dcr("div");
  b.tower = tow;
  G.bullets.push(b);
  // bullet defaults
  b.idx = G.bullets.length - 1;
  b.style.position = "absolute";
  b.style.zIndex = "0";
  b.damage = 3;

  if (tow.getAttribute("quantum") !== null) {
    // higher damage for quantum towers
    // bullet rotation (ai aim assist)
    b.classList.add("b-q");
    b.damage = G.qDamage;
  }

  if (tow.getAttribute("phaser") !== null) {
    // laser beam straight line for phaser towers
    b.classList.add("b-p");
    b.damage = G.pDamage;
    b.slow = 0.00001; // percent pixel move per game loop iteration
  }

  if (tow.getAttribute("thermal") !== null) {
    // aoe attack but lower damage for thermal towers
    b.classList.add("b-t");
    b.damage = G.tDamage;
  }

  if (tow.getAttribute("blaster") !== null) {
    b.damage = G.bDamage;
    b.classList.add("b-b");
  }

  var rect = tow.getBoundingClientRect();
  var x = rect.x + rect.width / 2.0;
  var y = rect.y + rect.height / 2.0;
  b.style.left = x + "px"; //tow.parentNode.offsetLeft + 28 + "px";
  b.style.top = y + "px"; //tow.parentNode.offsetTop + 36 + "px";
  b.ox = x;
  b.oy = y;
  b.x = x;
  b.y = y;
  var tag = tow.parentNode.parentNode.parentNode.parentNode.parentNode.tagName; //td //tr //tbody //table //l-g or r-g
  b.lefttower = tag.toUpperCase() == "L-G";
  dba(b);
  var mid_x = document.body.getBoundingClientRect().width / 2.0;
  b.style.zIndex = "100000";
  setInterval(() => {
    var reset = false;
    if (rect.y > b.y) {
      b.style.transform = b.lefttower ? "rotate(-45deg)" : "rotate(45deg)";
    } else if (rect.y < b.y - 50) {
      b.style.transform = b.lefttower ? "rotate(45deg)" : "rotate(-45deg)";
    }
    if (!b.lefttower && b.x < mid_x - 63) {
      b.x = b.ox;
      b.y = b.oy;
      reset = true;
    }
    if (!b.lefttower && b.x >= mid_x - 63) {
      b.x -= chg_x;
      b.y += chg_y;
    }
    if (b.lefttower && b.x > mid_x + 63) {
      b.x = b.ox;
      b.y = b.oy;
      reset = true;
    }
    if (b.lefttower && b.x <= mid_x + 63) {
      b.x += chg_x;
      b.y += chg_y;
    }
    if (b.reset) {
      b.reset = false;
      b.x = b.ox;
      b.y = b.oy;
      b.style.left = b.x + "px";
      b.style.top = b.y + "px";
    }

    if ((reset || b.reset) && window?.ene?.recentHits.includes(b.idx)) {
      b.reset = false;
      b.x = b.ox;
      b.y = b.oy;
      for (var i = 0; i < window?.ene?.recentHits.length; i++) {
        if (window?.ene?.recentHits[i] == b.idx) {
          window.ene.recentHits[i] = -1;
        }
      }
    }

    b.style.left = b.x + "px";
    b.style.top = b.y + "px";
  }, 10);
}
function create_tower(attrs, tss /*tower set string*/) {

let notifications = [];
setNotification = (text, subtext, timeout, color) => {
  if (showingNotification) {
    if (text !== notifications?.[0]?.text) {
      notifications.push({ text, subtext, timeout, color });
    }
    return;
  }
  try {
    showingNotification = true;
    var n = dcr("a");
    n.id = "not";
    n.innerHTML = `<div>${text}</div><div sub>${subtext}</div>`;
    n.style.color = color;
    dba(n);
    setTimeout(() => {
      n.remove();
      showingNotification = false;
      if (notifications.length > 0) {
        setNotification(
          notifications[0].text,
          notifications[0].subtext,
          notifications[0].timeout,
          notifications[0].color
        );
        notifications.shift();
      }
    }, timeout);
  } catch (_) {}
};

class GameScene extends HTMLElement {
  buildTable(query, side, ctx) {
    setNotification(
      `Attack ${G.wave + 1}`,
      "Build towers to defend this planet from invasion",
      6000,
      "rgba(238, 153, 18, 1)"
    );
    const gc = ctx.shadowRoot.querySelector(query);
    var tbl = document.createElement("table");

    var tbd = document.createElement("tbody");
    tbl.appendChild(tbd);
    var cw = gc.clientWidth;
    var ch = gc.clientHeight;
    var lead = 0;
    while (cw % 100 != 0) {
      cw -= 1;
      lead += 1;
    }
    var leadY = 0;
    while (ch % 100 != 0) {
      ch -= 1;
      leadY += 1;
    }
    if (side === "left") {
      tbl.style.left = lead + "px";
    } else {
      tbl.style.right = lead + "px";
    }
    tbl.style.top = leadY / 2 + "px";
    tbl.style.bottom = leadY / 2 + "px";
    for (var i = 0; i < ch / 100; i++) {
      var tr = dcr("tr", document);
      for (var j = 0; j < cw / 100; j++) {
        var td = dcr("td", document);
        td.setAttribute(
          "cost",
          side === "left" ? (j + 1) * 100 : (cw / 100 - j) * 100
        );
        tr.appendChild(td);
      }
      tbd.appendChild(tr);
    }
    gc.appendChild(tbl);
    return ctx.buildTable;
  }

  closeMenu() {
    const previousMenu = this.shadowRoot.querySelector("div[menu]");
    const previousMenuParent = previousMenu?.parentElement;
    if (previousMenu && previousMenuParent) {
      previousMenuParent.removeChild(previousMenu);
    }
  }

  buildMenu() {
    this.shadowRoot.querySelectorAll("td").forEach((td) => {
      td.addEventListener("click", (e) => {
        this.closeMenu();
        const el = e.srcElement;
        const menu = dcr("div");
        menu.setAttribute("menu", true);
        let towers = G.towers.split("");
        let isUpgrading = false;
        const s = td.querySelector("span");
        let nextLevel =
          s?.getAttribute("one") === ""
            ? "two"
            : s?.getAttribute("two") === ""
            ? "three"
            : s?.getAttribute("three") === ""
            ? "four"
            : null;
        if (!nextLevel) {
          nextLevel = "one";
        }

        if (Boolean(td.towers)) {
          towers = towers.filter((l) => td.towers.includes(l));
          isUpgrading = true;
        }

        if (nextLevel === "four") {
          towers = [];
        }

        towers.forEach((t) => {
          const mi = dcr("div");
          var dt = tower_decode(t);
          var typidx =
            parseInt(dt[5] + "" + dt[6] + "" + dt[7], 2) % G.tower_types.length;
          var type = G.tower_types[typidx];
          mi.setAttribute(type, "");
          mi.setAttribute("legend", "");
          const tpCost = Number(td.getAttribute("cost"));
          const cost =
            type === "blaster"
              ? tpCost
              : type === "thermal"
              ? tpCost * 1.5
              : type === "phaser"
              ? tpCost * 2
              : tpCost * 2.5;
          mi.innerHTML = `<span ${nextLevel}></span> ${cost}`;
          mi.setAttribute("menu-item", true);
          mi.addEventListener("click", (e) => {
            e.stopPropagation();
            if (cost > this.money) {
              setNotification(
                `Insufficient Funds`,
                "Defeating waves will earn you money",
                4000,
                "red"
              );
              this.closeMenu();
              return;
            }
            const amt = this.money - cost;
            this.setMoney(amt);
            if (td.towers == null) td.towers = "";
            if (td.towers.includes(t)) {
              //upgrade
              for (var i = 0; i < td.childNodes.length; i++) {
                var cn = td.childNodes[i]; //child node
                if (cn.towerId === t) {
                  cn.childNodes[0].removeAttribute("one");
                  cn.childNodes[0].removeAttribute("two");
                  if (cn.level === undefined) cn.level = 1;
                  cn.level += 1;
                  var levels = ["zero", "one", "two", "three"];
                  cn.childNodes[0].setAttribute(levels[cn.level], "");
                  var chg = [
                    -999,
                    { x: 1, y: 1 },
                    { x: 1, y: -1 },
                    { x: 2, y: 0 },
                  ][((parseInt(cn.level) + 1) % 3) + 1];
                  create_bullet(cn, chg.x, chg.y);
                  break;
                }
              }
              for (var i = 0; i < G.bullets.length; i++) {
                var bu = G.bullets[i]; //bullet upgrade
                bu.damage += 1.3;
              }
              this.closeMenu();
              return;
            } else td.towers += t;

            var div = create_tower(tower_decode(t), td.towers); //dcr("div");
            div.towerId = t;
            div.classList.add("tower");
            td.appendChild(div);
            td.style.position = "relative";
            this.closeMenu();
          });
          menu.appendChild(mi);
        });

        if (isUpgrading) {
          const cost = Number(td.getAttribute("cost"));
          const mi = dcr("div");
          mi.setAttribute("blaster", "");
          mi.setAttribute("legend", "");
          mi.style.color = "red";
          mi.innerHTML = `<span sell></span> sell ${cost}`;
          mi.setAttribute("menu-item", true);
          mi.addEventListener("click", (e) => {
            e.stopPropagation();
            const amt = this.money + cost;
            this.setMoney(amt);
            td.towers = "";
            td.children[0].remove();
            removeOrphanBullets();
            this.closeMenu();
          });
          menu.appendChild(mi);
        }
        el.appendChild(menu);
      });
    });
  }

  setMoney(amt) {
    this.money = amt;
    const moneyEl = this.shadowRoot.querySelector("div[money]");
    if (amt < 1000) {
      moneyEl.style.color = "red";
    } else if (amt < 3000) {
      moneyEl.style.color = "yellow";
    } else {
      moneyEl.style.color = "green";
    }
    moneyEl.innerText = `$${amt.toFixed(2)}`;
  }

  connectedCallback() {
    if (!this.shadowRoot) {
      this.attachShadow({ mode: "open" });
      this.shadowRoot.appendChild(t2.content.cloneNode(true));
      this.setMoney(this.clientWidth * (this.clientWidth > 1200 ? 8 : 4));

      setTimeout(() => {
        this.buildTable("l-g", "left", this)("r-g", "right", this);
        this.buildMenu();
        setTimeout(() => {
          var top = dcr("div");
          top.id = "sst";
          var mid = dcr("div");
          mid.id = "ssm";
          var bot = dcr("div");
          bot.id = "ssb";
          /*var */ window.ene = dcr("div");
          ene.velocity = 1; // 1px per game loop iteration
          ene.velocityTrack = 1.0;
          ene.health = 100;
          ene.id = "ene";
          ene.width = 30;
          ene.height = 30;
          mid.style.backgroundColor = "white"; //"green";
          top.appendChild(mid);
          mid.appendChild(bot);
          ene.appendChild(top);
          var brect = document.body.getBoundingClientRect();
          ene.style.left = brect.width / 2.0 - 15 + "px";
          ene.style.top = "40px";
          ene.y = 40;
          ene.x = brect.width / 2.0 - 15;
          ene.recentHits = [];
          dba(ene);
          let wave = 3;
          let sPassed = 0;
          // game loop
          var gmLpId = setInterval(() => {
            if (G.gameOver) return;
            this.shadowRoot.querySelector(
              "[main-title]"
            ).innerText = `Space Defense Engineer (level ${Math.floor(
              wave / 3
            )}/${G.waves?.[0].length / 3})`;
            if (ene.y > document.body.getBoundingClientRect().height) {
              sPassed += 1;
              const pHP = this.shadowRoot.querySelector("t-a");
              pHP.style.width = `${100 - sPassed * 5}%`;
              if (sPassed >= 20) {
                gameOver(false);
              }
            }
            if (
              ene.y > document.body.getBoundingClientRect().height ||
              ene.health <= 0
            ) {
              G.ei += 1;
              ene.y = 40;
              ene.recentHits = [];
              ene.health = 100 + (wave / 3) * 15;
              console.log(ene.health);

              if (wave < G.waves[0].length) {
                wave++;
                if (wave % 3 === 0) {
                  setNotification(
                    `Level ${wave / 3}`,
                    `Contract Paid + $${
                      this.clientWidth * (this.clientWidth > 1200 ? 2 : 1.5)
                    }`,
                    3000,
                    "rgba(238, 153, 18, 1)"
                  );
                  this.setMoney(
                    this.money +
                      this.clientWidth * (this.clientWidth > 1200 ? 2 : 1.5)
                  );
                }
              } else {
                gameOver(true);
              }
            }
            function gameOver(win) {
              clearInterval(gmLpId);
              G.gameOver = true;
              setNotification(
                win ? "Success!" : "Fired!",
                win
                  ? "You have fulfilled your contract by successfully defending this planet."
                  : "You have failed to defend this planet.",
                250000,
                win ? "green" : "red"
              );
              return;
            }

            //draw henchmen ships
            function drawHenchmenShips() {
              function createHench() {
                var h = dcr("div");
                h.classList.add("hen");
                var img = dcr("img");
                img.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAMAAADXqc3KAAAAbFBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8+T+BWAAAAI3RSTlMA4wVx+ep+FfLRzMWeYk5JHwmvDNe2pZZ2UkE5NSoa3NqwDeTXEe4AAAC1SURBVCjPpdA3FoMwFAVRlMkmOAccZv97NGoAf1zZah5n7kGFkn/OsNsN33qjQDXrrjOKgkyvwPPoX3e87K3jnCRnXCvgRBGn4CTggNkotTEcBORcFKgLuQBFiBBQAlJ0vEqTCrDoOBorwBHiBJyAjGucK5l4kD1V3Iq9/uhHQxk/SsxxKXV+w41BO255vYCOZssYarYN3dyDxRsAMB4bJjCkvn1asF3rU8wEZdXPv/dVmfx03pw8DKK4zI4qAAAAAElFTkSuQmCC";
                img.classList.add("hei");
                h.appendChild(img);
                h.width = 12;
                h.height = 12;
                dba(h);
                h.deg = 0; //0-360
                return h;
              }
              function renderHench(h, i, active) {
                if (ene.y <= 50) h.dead = null;
                if (active && h.dead == null) h.style.visibility = "visible";
                else {
                  h.style.visibility = "hidden";
                  h.dead = true;
                }
                var offsets = [
                  [-15, 0],
                  [-15, -15],
                  [0, -15],
                  [15, -15],
                  [15, 0],
                  [15, 15],
                  [0, 15],
                  [-15, 15],
                ];
                var xs = offsets[i][0] >= 0 ? 1 : -1; //x-sign
                var ys = offsets[i][1] >= 0 ? 1 : -1; //y-sign
                var cxo = xs * (ene.width / 2.0) + xs * (h.width / 2.0); //characters x offsets
                var cyo = ys * (ene.height / 2.0) + ys * (h.height / 2.0); //characters y offsets
                var x = ene.x + cxo + xs * offsets[i][0];
                var y = ene.y + cyo + ys * offsets[i][1];
                h.x = x;
                h.y = y;
                h.style.left = x + "px";
                h.style.top = y + "px";
              }
              var orbHenchCnt = 3;
              var stcHenchCnt = 3;
              if (window.stcHench == null) window.stcHench = [];
              if (window.orbHench == null) window.orbHench = [];
              while (stcHench.length < 4) {
                stcHench.push(createHench());
              }
              while (orbHench.length < 4) {
                orbHench.push(createHench());
              }
              for (var i = 0; i < 8; i++) {
                var h = i < 4 ? stcHench[i] : orbHench[i % 4];
                var active =
                  i < 4 ? stcHenchCnt >= i + 1 : orbHenchCnt >= (i % 4) + 1;
                renderHench(h, i, active);
              }
            }
            drawHenchmenShips();

            if (ene.health < 50) ene.style.color = "red";
            else ene.style.color = "green";

            if (ene.health > 80) {
              mid.style.backgroundColor = "green";
            } else if (ene.health > 50) {
              mid.style.backgroundColor = "yellow";
            } else {
              mid.style.backgroundColor = "red";
            }
            mid.style.width = ene.health / 4;

            ene.y += Math.min(Math.floor(ene.velocityTrack), 1); //1;
            ene.velocityTrack += ene.velocityTrack;
            ene.velocityTrack = Math.min(ene.velocityTrack, 1);
            ene.style.top = ene.y + "px";
            var removeidx = -1;
            for (var i = 0; i < G.bullets.length; i++) {
              var b = G.bullets[i];
              var brect = b.getBoundingClientRect(); //bullet rect
              var srect = ene.getBoundingClientRect(); //ship rect
              for (var j = 0; j < 8 /*orbHench.length*/; j++) {
                var h = j < 4 ? stcHench[j] : orbHench[j % 4];
                if (h.dead) continue;
                if (
                  rects_collide(
                    {
                      left: h.x,
                      top: h.y + h.height,
                      width: h.width,
                      height: h.height,
                    },
                    brect
                  )
                ) {
                  removeidx = i;
                  h.dead = true;
                  break;
                }
              }
              if (removeidx > -1) {
                b.reset = true;
                b.x = b.ox;
                b.y = b.oy;
                b.style.left = b.x + "px";
                b.style.top = b.y + "px";
                break;
              }
              if (rects_collide(brect, srect)) {
                if (ene.recentHits.includes(i)) continue;
                if (b.phase) {
                  ene.y -= 8;
                }
                ene.health -= b.damage; //20;
                removeidx = i;
                //hit
                if (b.slow != null) {
                  ene.velocityTrack = b.slow;
                }
                break;
              }
            }
            if (removeidx > -1 && !ene.recentHits.includes(removeidx)) {
              ene.recentHits.push(removeidx);
            }
            if (ene.health < 0) ene.health = 0;
          }, 14);
        }, 6000);
      }, 1000);
    }
  }
}

customElements.define("sd-game-scene", GameScene);

    <script>changeScene = (scene) => {
  cs = G.allScenes.find((s) => s === scene);
  if (cs) {
    G.cs = cs;
    const os = document.querySelector("[in-progress]");
    if (os) {
      document.body.removeChild(os);
    }

    switch (cs) {
      case GAME_SCENE:
        renderWebComponent("sd-game-scene");
        break;
      case LOADING_SCENE:
      default:
        renderWebComponent("sd-loading-scene");
        break;
    }
  }
};

renderWebComponent = (tagname) => {
  let el = dcr(tagname,document);
  el.setAttribute("in-progress", true);
  el.style.cssText = "opacity: 0; display: block; transition: opacity .3s";
  dba(el,document);
  setTimeout(() => {
    el.style.opacity = "1";
  }, 200);
};

changeScene(LOADING_SCENE);
addEventListener("scene-change", (e) => {
  changeScene(e.detail);
});

Promise.all(
  ["sd-game-scene"].map((component) =>
    customElements.whenDefined(component)
  )
).then((p) => {
  setTimeout(() => {
    changeScene(GAME_SCENE);
  }, 1000);
});

addEventListener("show-game", (e) => changeScene(GAME_SCENE));
addEventListener("show-controls", (e) => alert("coming soon"));
