  window.currentPopUp = null

  var PopUp = function(content) {
    this.dom           = document.createElement('div')
    this.dom.className = 'pop-up'
    this.content       = content
  }

  Utils.addObserverMethodsToClass(PopUp)

  PopUp.notify = function(msg, options) {
    options = options || {}

    var popUp = new PopUp(msg)

    popUp.render()

    if(!options.sticky) {
      setTimeout(function() {
        if(window.currentPopUp === popUp) {
          popUp.close()
        }
      }, 2000)
    }
  }

  PopUp.prototype.setContent = function(content) {
    this.content = content
  }

  PopUp.prototype.render = function(options) {
    options = options || {}

    if (typeof this.content === 'string') {
      this.content = document.createTextNode(this.content)
    }

    this.dom.appendChild(this.content)

    if(window.currentPopUp) {
      window.currentPopUp.close()
    }

    this.setPosition(options)

    document.body.appendChild(this.dom)
    window.currentPopUp = this

    fixPosition.call(this)
  }

  PopUp.prototype.setPosition = function(options) {
    options = options || {}

    if(options.left) {
      this.dom.style.left = options.left + 'px'
    }

    if(options.top) {
      this.dom.style.top = options.top + 'px'
    }
  }

  PopUp.prototype.close = function() {
    document.body.removeChild(this.dom)
    window.currentPopUp = null
  }

  // private

  var fixPosition = function() {
    var canvas   = document.querySelector('table')
      , selected = document.querySelector('.selected, .with-range')
      , width    = this.dom.offsetWidth
      , height   = this.dom.offsetHeight
      , minX     = canvas.offsetLeft
      , maxX     = minX + canvas.offsetWidth - width
      , minY     = canvas.offsetTop
      , maxY     = minY + canvas.offsetHeight - height
      , options  = {}

    if(selected && (selected.offsetLeft > maxX) && (selected.offsetLeft < (maxX + width))) {
      maxX = selected.offsetLeft - width - 10
    }

    if(maxX < minX) {
      maxX = minX
    }

    if(this.dom.offsetLeft < minX) {
      options.left = minX
    }

    if(this.dom.offsetLeft > maxX) {
      options.left = maxX
    }

    if(this.dom.offsetTop < minY) {
      options.top = minY
    }

    if(this.dom.offsetTop > maxY) {
      options.top = maxY
    }

    if(options.top || options.left) {
      this.setPosition(options)
    }
  }

  window.PopUp = PopUp
})()

      this.game.disableForcedSpawn()

    ul.appendChild(Utils.createDomNode('li', { value: "Earned money: " + this.game.player.stats.earnedMoney + '$' }))
    ul.appendChild(Utils.createDomNode('li', { value: "Killed monsters: " + this.game.player.stats.killedMonsters }))

    <script>(function() {
  var Grid = function(rows, cols, canvas) {
    this.rows      = rows
    this.cols      = cols
    this.canvas    = canvas
    this.container = document.createElement('table')
    this.path      = []
    this.cells     = []
  }

  Grid.prototype.render = function() {
    createDOM.call(this)

    this.path = createPath.call(this)

    this.path.forEach(function(cell) {
      cell.setType(GridCell.TYPES.PATH)
    })
  }

  // private

  var createDOM = function() {
    var self = this

    for(var i = 0; i < this.rows; i++) {
      var tr    = document.createElement('tr')
        , cells = []

      for(var j = 0; j < this.cols; j++) {
        var cell = new GridCell(self)

        cells.push(cell)
        tr.appendChild(cell.getElement())
      }

      this.container.appendChild(tr)
      this.cells.push(cells)
    }

    this.canvas.appendChild(this.container)
  }

  var createPath = function() {
    var indexes = getPathCellIndexes.call(this)
      , cells   = []
      , self    = this

    indexes.forEach(function(col, x) {
      col.forEach(function(y) {
        var cell = getCell.call(self, x, y)
        cells.push(cell)
      })
    })

    return cells
  }

  var getPathCellIndexes = function() {
    var indexes      = []
      , lastWayPoint = null

    for(var colIndex = 0; colIndex < this.cols; colIndex++) {
      var cells = []
        , start = (lastWayPoint !== null) ? lastWayPoint : (~~(Math.random() * this.rows))
        , end   = ~~(Math.random() * this.rows)

      if(colIndex % 2 === 0) {
        cells.push(start)
        lastWayPoint = start
      } else {
        if(start === end) {
          cells.push(start)
        } else {
          for(var i = start; i !== end; (start > end) ? i-- : i++) {
            cells.push(i)
          }
          cells.push(i)
        }

        lastWayPoint = end
      }

      indexes.push(cells)
    }

    return indexes
  }

  var getCell = function(x, y) {
    var rows = this.container.querySelectorAll('tr')
      , row  = rows[y]

    return row.querySelectorAll('td')[x].cell
  }

    this.updateTimerIntervalId = setInterval(function() {
      var now  = +new Date()
        , diff = Math.ceil(Math.abs(then - now) / 1000)

      if(diff > countDownFrom) {

      } else {
        setTimerContainerText.call(this, countDownFrom - diff)
      }
    }.bind(this), 100)
  }

  var getTimerContainer = function() {
    var container = document.getElementById('wave-duration')

    if(!container) {
      container = document.createElement('span')
      container.id = 'wave-duration'

    return container

  var setTimerContainerText = function(seconds) {

    if(seconds === 0) {

      this.fire('timer:disabled')
    } else {
      setTimerContainerClass.call(this, '')
      this.fire('timer:enabled')
