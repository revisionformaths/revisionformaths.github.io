/*
 * Note class

 * new Note ('A4 q') === 440Hz, quarter note
 * new Note ('- e') === 0Hz (basically a rest), eigth note

 * new Note ('A4 0.0125') === 440Hz, 32nd note (or any arbitrary
 * divisor/multiple of 1 beat)

// create a new Note instance from a string
function Note( str ) {

  // duration, as a ratio of 1 beat (quarter note = 1, half note = 0.5, etc.)

    <script>function lineRect(x1, y1, x2, y2, rx, ry, rw, rh) {

  // check if the line has hit any of the rectangle's sides
  // uses the Line/Line function below
  let left =   lineLine(x1,y1,x2,y2, rx,ry,rx, ry+rh);
  let right =  lineLine(x1,y1,x2,y2, rx+rw,ry, rx+rw,ry+rh);
  let top =    lineLine(x1,y1,x2,y2, rx,ry, rx+rw,ry);
  let bottom = lineLine(x1,y1,x2,y2, rx,ry+rh, rx+rw,ry+rh);

  // if ANY of the above are true, the line
  // has hit the rectangle
  if (left || right || top || bottom) {
    return true;
  }
  return false;
}


// LINE/LINE
function lineLine(x1, y1, x2, y2, x3, y3, x4, y4) {

  // calculate the direction of the lines
  let uA = ((x4-x3)*(y1-y3) - (y4-y3)*(x1-x3)) / ((y4-y3)*(x2-x1) - (x4-x3)*(y2-y1));
  let uB = ((x2-x1)*(y1-y3) - (y2-y1)*(x1-x3)) / ((y4-y3)*(x2-x1) - (x4-x3)*(y2-y1));

  // if uA and uB are between 0-1, lines are colliding
  if (uA >= 0 && uA <= 1 && uB >= 0 && uB <= 1) {

  }
  return false;
}

    <script>function resetVariables() {
  infiniteMode = true;

  selected = false;
  nextDot = {};
  dotSelected = { x: 0, y: 0 };
  mouseX = mouseY = 0;
  mX = mY = 0;
  message = description = "";
  level = 0;
  dots = [];
  lines = [];
}
function draw() {
  if (!infiniteMode) {
    ctx.fillStyle = obstacle.color;
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
  }

  ctx.fillStyle = colors.background;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  dots.forEach((dot) => {
    ctx.fillStyle = dot.color;
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.radius, 0, 2 * Math.PI);
    ctx.fill();
  });
  lines.forEach((line) => {
    ctx.beginPath();
    ctx.moveTo(line.x1, line.y1);
    ctx.lineTo(line.x2, line.y2);
    ctx.strokeStyle = colors.line;
    ctx.stroke();
  });

  if (selected) {
    ctx.beginPath();
    ctx.moveTo(dotSelected.x, dotSelected.y);
    ctx.lineTo(mX, mY);
    ctx.strokeStyle = colors.line;
    ctx.stroke();
  }
  ctx.fillStyle = obstacle.color;
  ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
  
}

function update() {
  if (level1) {
    if (dots.every((dot) => dot.flag)) { selected = false }
  }
  else if (infiniteMode) {
    if (dots.every((dot) => dot.flag) && level > 0) nextLevel();

    if (!selected) {
      ctx.font = "20px Georgia";
      ctx.fillStyle = colors.selectedDot;
      ctx.fillText(
        message,
        canvas.width / 2 - ctx.measureText(message).width / 2,
        canvas.height / 2
      );
      description.forEach((desc,i) => {
        ctx.fillText(
          desc,
          canvas.width / 2 - ctx.measureText(desc).width / 2,
          canvas.height / 2 + 64 * (i+1)
        );
      })
    }
  }
}

function loop() {
  draw();
  update();
  requestAnimationFrame(loop);
}

function getDistance(obj1, obj2) {
  return Math.floor(
    Math.sqrt(Math.pow(obj1.x - obj2.x, 2) + Math.pow(obj1.y - obj2.y, 2))
  );
}

function getNextDot(dot) {
  let distances = [];
  for (let i = 0; i < dots.length; i++) {
    let distance = getDistance(dot, dots[i]);
    if (distance != 0) distances.push([distance, i]);
  }
  distances.sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < distances.length; i++) {
    if (!dots[distances[i][1]].flag) {
      nextDot = dots[distances[i][1]];
      return nextDot;
    }
  }
}

window.onmousedown = (event) => {
  if (message == "Game Over") {
    isMenu = true;
  }
  if (!selected) {
    level++;
    newGame();
  }
  dots.forEach((dot) => {
    if (
      event.clientX > dot.x - 10 &&
      event.clientX < dot.x + 10 &&
      event.clientY > dot.y - 10 &&
      event.clientY < dot.y + 10
    ) {
      if (selected && !dot.flag) {
        let line = {
          x1: dotSelected.x,
          y1: dotSelected.y,
          x2: dot.x,
          y2: dot.y,
        };
        dotSelected.flag = true;
        dot.flag = true;
        selectNewDot(dot, event);
        lines.push(line);
      } else if (!dot.flag) {
        selectNewDot(dot, event);
      }
    }
  });
};

function selectNewDot(dot, event) {
  if (dot.x == nextDot.x && dot.y == nextDot.y) {
    dot.color = colors.selectedDot;
    //dotSelected.x = dot.x
    //dotSelected.y = dot.y
    dotSelected = dot;
    mX = event.clientX;
    mY = event.clientY;
    selected = true;
    getNextDot(dotSelected);
  } else {
    gameOver();
  }
}

window.onmousemove = (event) => {
  dots.forEach((dot) => {
    if (
      event.clientX > dot.x - 10 &&
      event.clientX < dot.x + 10 &&
      event.clientY > dot.y - 10 &&
      event.clientY < dot.y + 10
    ){
      if (!dot.flag) dot.radius =  15
    } else {
      dot.radius =  10
    }
  })
  if (selected) {
    mX = event.clientX;
    mY = event.clientY;
  }
};
