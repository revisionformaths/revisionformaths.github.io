    <script>let FishSpeed = 0.05,
  FishWidth = 187,

  FishScale = 1.5;

// fish colors
const COLORS = {
  grey: {

  red: {

  green: {
    body: "#409920ff",
    side: "#116b04ff",

  gold: {
    body: "#dad712",
    side: "#aca90fff",

};

class Fish extends EventTarget {
  constructor(t) {
    super();

    this.t = t;
    this.s = t === "gold" ? FishSpeed * 3 : FishSpeed;

    const p = getOutsidePosition();
    this.cX = p.x;
    this.cY = p.y;
    this.turn();

    this.cR = this.dR;
    this.cR = Math.PI / 4;

    this.gO = false;
    this.tO = setTimeout(() => {
      this.gO = true;
      this.turn();
      this.addEventListener("reached", () => {
        this.destroy();
      });
    }, 10000);
  }

  evaluate() {
    switch (this.t) {
      case "grey":
        GAME.points += 1;
        break;
      case "green":
        GAME.end += 2000;
        break;
      case "red":
        GAME.end -= 2000;
        break;
      case "gold":
        GAME.points += 10;
        GAME.end += 10000;
        break;
    }
  }

  isHit({ x, y }) {
    const C = Math.cos(this.cR);
    const S = Math.sin(this.cR);

    const X = this.cX - x;
    const Y = this.cY - y;

    const rX = this.cX - C * X - S * Y;
    const rY = this.cY + S * X - C * Y;

    const oX = (FishWidth * FishScale) / 2;
    const oY = (FishHeight * FishScale) / 2;

    return inBox(
      this.cX - oX,
      rX,
      this.cX + oX,
      this.cY - oY,
      rY,
      this.cY + oY
    );
  }

  turn() {
    const p = this.gO ? getOutsidePosition() : getInsidePosition();
    this.dX = p.x;
    this.dY = p.y;
    this.dR = getRadius(this, this.cR);
  }

  move(_shift) {
    const shift = _shift * this.s * SCALE_SQRT;
    const cdR = Math.cos(this.dR);
    const sdR = Math.sin(this.dR);

    this.cX += clampCD(shift * cdR, this.cX, this.dX);
    this.cY += clampCD(shift * sdR, this.cY, this.dY);
    this.cR += clampMM(this.dR - this.cR, -0.03, 0.03);

    const mX = this.cX - this.dX;
    const mY = this.cY - this.dY;

    if (inBox(-5, mX, 5, -5, mY, 5)) {
      const e = new CustomEvent("reached");
      this.dispatchEvent(e);
      this.turn();
    }

class Paw extends EventTarget {
  constructor() {
    super();
    this.reset();

    this.m = false;
  }

  reset() {
    this.rX = this.cX = this.dX = WIDTH / 2;
    this.rY = this.cY = this.dY = HEIGHT;
    this.mR = 0;
    this.pR = 0;
    this.cR = 0;
    this.s = PawSpeed * 5;
  }

  reach({ x, y }) {
    if (this.m) {
      return;
    }

    this.dX = x;
    this.dY = y;
    this.mR = getRadius(this);
    this.pR = clampMM(
      getRadius({ cX: this.rX, cY: this.rY, dX: x, dY: y }) + Math.PI / 2,
      -Math.PI / 4,
      Math.PI / 4
    );
    this.m = true;
  }

  move(_shift) {
    if (!this.m) return;

    const shift = _shift * this.s;

    const cmR = Math.cos(this.mR);
    const smR = Math.sin(this.mR);

    this.cX += clampCD(shift * cmR, this.cX, this.dX);
    this.cY += clampCD(shift * smR, this.cY, this.dY);
    this.cR += clampMM(this.pR - this.cR, -0.03, 0.03);

    const mX = this.cX - this.dX;
    const mY = this.cY - this.dY;

    if (!inBox(0, this.cX, WIDTH, 0, this.cY, HEIGHT)) {
      this.reset();
      return;
    }
    if (inBox(-5, mX, 5, -5, mY, 5)) {
      if (inBox(-5, this.cX - this.rX, 5, -5, this.cY - this.rY, 5)) {

        this.dispatchEvent(e);
        this.dX = this.rX;
        this.dY = this.rY;
        this.mR += Math.PI;
        this.s = PawSpeed;

    }

    <script>const cnv = document.getElementById("c");
const ctx = cnv.getContext("2d");

let WIDTH = 0,
  HEIGHT = 0,
  SCALE = 1,
  SCALE_SQRT = 1;

// game state
const GAME = {
  points: 0,
  end: 0,
  waves: [],
  fishes: [],
  paw: null,
  play: false,
  played: false,
  intervals: [],
};

const resizeObserver = new ResizeObserver(() => {
  cnv.width = WIDTH = window.innerWidth;
  cnv.height = HEIGHT = window.innerHeight;

  size = Math.min(WIDTH, HEIGHT);
  SCALE = Math.min(size / 720, 1);
  SCALE_SQRT = Math.sqrt(SCALE);
  FishScale = 1.5 * SCALE_SQRT;
  PawScale = 1.25 * SCALE_SQRT;

  GAME.paw.reset();
});

// reset game state
const reset = () => {
  FishSpeed = 0.2;

  GAME.fishes = [];
  GAME.waves = [];
  GAME.points = 0;

  const s = performance.now();
  GAME.end = s + 30 * 1000;

  GAME.intervals.forEach((i) => {
    clearInterval(i);
  });
  GAME.intervals = [];

  GAME.fishes.push(new Fish("grey"));
  GAME.intervals.push(
    setInterval(() => {
      GAME.fishes.push(new Fish("grey"));
    }, 1000)
  );
  GAME.intervals.push(
    setInterval(() => {
      GAME.fishes.push(new Fish(Math.random() > 0.5 ? "green" : "red"));
    }, 2000)
  );
  GAME.intervals.push(
    setInterval(() => {
      GAME.fishes.push(new Fish("gold"));
    }, 15000)
  );

  GAME.intervals.push(
    setInterval(() => {
      if (GAME.play) {
        FishSpeed += 0.005;
      }
    }, 10000)
  );
};

document.addEventListener("DOMContentLoaded", () => {
  cnv.width = WIDTH = window.innerWidth;
  cnv.height = HEIGHT = window.innerHeight;
  resizeObserver.observe(document.body);

  GAME.paw = new Paw();

  GAME.jingleToggle = new JingleToggle(true, { x: 60, y: 60 });
  GAME.jingleController = new AudioController(jingle);

  GAME.musicToggle = new MusicToggle(false, { x: 60, y: 140 });
  GAME.musicController = new AudioController(song, { loop: true });

  GAME.paw.addEventListener("reached", (e) => {
    const { x, y } = e.detail;

    GAME.waves.push(new Wave({ x, y }));
    [...GAME.fishes].forEach((f) => {
      if (f.isHit({ x, y })) {
        if (GAME.play) {
          f.evaluate();
        }
        f.destroy();
      }
    });

    if (!GAME.play && GAME.jingleToggle.isHit({ x, y })) {
      GAME.jingleToggle.toggle();
    }
    if (!GAME.play && GAME.musicToggle.isHit({ x, y })) {
      GAME.musicToggle.toggle();
    }

    if (GAME.jingleToggle.on) {
      GAME.jingleController.play();
    }
  });

  reset();
  startAnimation();
});

cnv.addEventListener("click", (e) => {
  const { x, y } = e;

  GAME.paw.reach({ x, y });
});

cnv.addEventListener("dblclick", (e) => {
  if (!GAME.play) {
    GAME.play = true;
    GAME.played = true;

    reset();
  }
});

let lT = 0;
const animate = (t) => {
  if (!lT) {
    lT = t;
    startAnimation();
  }
  const shift = t - lT;
  lT = t;

  ctx.clearRect(0, 0, cnv.width, cnv.height);

  drawWaves(shift);
  drawFishes(shift);
  if (!GAME.play) {
    drawToggles();
  }
  drawPaw(shift);
  drawText();
  if (!GAME.play) {
    drawState();
  }

  startAnimation();
};

const startAnimation = () => {
  window.requestAnimationFrame(animate);
};

const drawWaves = (shift) => {
  GAME.waves.forEach((w) => {
    w.move(shift);
    w.draw();
  });
};

const drawFishes = (shift) => {
  GAME.fishes.forEach((f) => {
    f.move(shift);
    f.draw();
  });
};

const drawToggles = () => {
  GAME.jingleToggle.draw();
  GAME.musicToggle.draw();
};

const drawPaw = (shift) => {
  GAME.paw.move(shift);
  GAME.paw.draw();
};

const drawText = () => {
  const now = performance.now();
  let seconds = Math.floor((GAME.end - now) / 1000);

  if (seconds <= 0) {
    GAME.play = false;
    seconds = 0;
  }

  ctx.font = `${Math.floor(64 * SCALE)}px sans-serif`;
  const text = GAME.played
    ? `${seconds}s : ${GAME.points}p`
    : `30s : ${GAME.points}p`;

  const metrics = ctx.measureText(text);
  const marginTB = 40 * SCALE;
  const marginLP = 60 * SCALE;
  const radius = 30 * SCALE;
  const border = 5;

  const rectInWidth = metrics.width + 2 * marginLP;
  const rectInHeight = metrics.actualBoundingBoxAscent + 2 * marginTB;

  ctx.lineWidth = border;
  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#222222aa";
  ctx.beginPath();
  ctx.roundRect((WIDTH - rectInWidth) / 2, -border, rectInWidth, rectInHeight, [
    0,
    0,
    radius,
    radius,
  ]);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = `${Math.floor(64 * SCALE)}px sans-serif`;
  ctx.fillText(
    text,
    (WIDTH - metrics.width) / 2,
    metrics.actualBoundingBoxAscent + marginTB - border
  );
};

const drawState = () => {
  ctx.font = `${Math.floor(120 * SCALE)}px sans-serif`;
  const logoText = "FISHING";
  const logoMetrics = ctx.measureText(logoText);

  ctx.font = `${Math.floor(32 * SCALE)}px sans-serif`;
  const insText = "Double click to start game!";
  const insMetrics = ctx.measureText(insText);

  const marginTB = 40 * SCALE;
  const marginLP = 60 * SCALE;
  const radius = 30 * SCALE;
  const border = 5;

  const width = Math.max(logoMetrics.width, insMetrics.width);
  const height =
    logoMetrics.actualBoundingBoxAscent +
    insMetrics.actualBoundingBoxAscent +
    marginTB;

  const rectWidth = width + 2 * marginLP;
  const rectHeight = height + 2 * marginTB;

  ctx.lineWidth = border;
  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#222222aa";
  ctx.beginPath();
  ctx.roundRect(
    (WIDTH - rectWidth) / 2,
    (HEIGHT - rectHeight) / 2,
    rectWidth,
    rectHeight,
    [radius]
  );
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = `${Math.floor(120 * SCALE)}px sans-serif`;
  ctx.fillText(
    logoText,
    (WIDTH - logoMetrics.width) / 2,
    (HEIGHT - rectHeight) / 2 + logoMetrics.actualBoundingBoxAscent + marginTB
  );
  ctx.font = `${Math.floor(32 * SCALE)}px sans-serif`;
  ctx.fillText(
    insText,
    (WIDTH - insMetrics.width) / 2,
    (HEIGHT - rectHeight) / 2 +
      logoMetrics.actualBoundingBoxAscent +
      2 * marginTB +
      insMetrics.actualBoundingBoxAscent
  );
};
</script>
    <script>class Toggle {
  constructor(on, { x, y }) {
    this.on = on;
    this.x = x;
    this.y = y;
    this.size = 64;
  }

  isHit({ x, y }) {
    return inBox(
      this.x - this.size / 2,
      x,
      this.x + this.size / 2,
      this.y - this.size / 2,
      y,
      this.y + this.size / 2
    );
  }

  toggle() {
    this.on = !this.on;

    this.onToggle(this.on);
  }

  onToggle(on) {}

  draw() {
    ctx.lineWidth = 5;
    ctx.fillStyle = "#222222aa";
    ctx.beginPath();
    ctx.roundRect(
      this.x - this.size / 2,
      this.y - this.size / 2,
      this.size,
      this.size,
      [10]
    );
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    if (!this.on) {
      ctx.strokeStyle = "#fff";
      ctx.moveTo(this.x - this.size / 2 + 10, this.y + this.size / 2 - 10);
      ctx.lineTo(this.x + this.size / 2 - 10, this.y - this.size / 2 + 10);
      ctx.stroke();
    }
  }
}

class JingleToggle extends Toggle {
  constructor(on, pos) {
    super(on, pos);
  }

  draw() {
    super.draw();

    const scale = 2;
    const m = new DOMMatrix([
      1 * scale,
      0,
      0,
      1 * scale,
      this.x - 12 * scale,
      this.y - 12 * scale,
    ]);

    ctx.fillStyle = "#fff";
    const eP = new Path2D();
    eP.addPath(
      new Path2D(
        "M20.59,14.86V10.09A8.6,8.6,0,0,0,12,1.5h0a8.6,8.6,0,0,0-8.59,8.59v4.77L1.5,16.77v1.91h21V16.77Z"
      ),
      m
    );
    eP.addPath(
      new Path2D(
        "M14.69,18.68a2.55,2.55,0,0,1,.17,1,2.86,2.86,0,0,1-5.72,0,2.55,2.55,0,0,1,.17-1"
      ),
      m
    );
    ctx.stroke(eP);
  }
}

class MusicToggle extends Toggle {
  constructor(on, pos) {
    super(on, pos);
  }

  draw() {
    super.draw();

    const scale = 2;
    const m = new DOMMatrix([
      1 * scale,
      0,
      0,
      1 * scale,
      this.x - 12 * scale,
      this.y - 12 * scale,
    ]);

    ctx.strokeStyle = "#fff";
    const eP = new Path2D();
    eP.addPath(
      new Path2D(
        "M11.4,21c-1.68,1.7-4.08,2.06-5.32.8s-.9-3.63.8-5.32,4.07-2,5.32-.8S13.1,19.31,11.4,21Z"
      ),
      m
    );
    eP.addPath(new Path2D("M18.67,11v-1C18.67,5.31,13,6.26,13,.54L13,18"), m);
    ctx.stroke(eP);
  }

  onToggle(on) {
    if (on) {
      GAME.musicController.start();
    } else {
      GAME.musicController.stop();
    }
  }
}

    <script>// position inside canvas
const getInsidePosition = () => {
  const x = Math.random() * WIDTH;
  const y = Math.random() * HEIGHT;

  return { x, y };
};

// position outside canvas
const getOutsidePosition = () => {
  const xR = Math.random() * 200 + 100;
  const yR = Math.random() * 200 + 100;
  const x = Math.random() > 0.5 ? WIDTH + xR : -xR;
  const y = Math.random() > 0.5 ? HEIGHT + yR : -yR;

  return { x, y };
};

// angle from current to destination
const getRadius = ({ cX, cY, dX, dY }, cR = 0) => {
  let r = Math.atan((cY - dY) / (cX - dX));
  if (cX > dX) {
    r -= Math.PI;
  }

  // normalize angle to prevent big jumps
  while (cR - r > Math.PI) {
    r += 2 * Math.PI;
  }

  while (r - cR > Math.PI) {
    r -= 2 * Math.PI;
  }

  return r;
};

// clamp min max
const clampMM = (val, min, max) => {
  if (val < min) return min;
  if (val > max) return max;
  return val;
};

// clamp from current to destination
const clampCD = (val, c, d) => {
  const o = c - d;
  const [min, max] = o < 0 ? [o, -o] : [-o, o];

  return clampMM(val, min, max);
};

// check if point is inside box
const inBox = (lX, x, rX, tY, y, bY) => {
  return lX <= x && x <= rX && tY <= y && y <= bY;
};
</script>
    <script>let WaveSpeed = 0.5;

class Wave {
  constructor({ x, y }) {
    this.x = x;
    this.y = y;
    this.r = 0;
  }

  move(_shift) {
    this.r += _shift * WaveSpeed;

    if (this.r > WIDTH + HEIGHT) {
      this.destroy();
    }
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  }

  destroy() {
    const idx = GAME.waves.indexOf(this);
    GAME.waves.splice(idx, 1);
  }
}
</script>
