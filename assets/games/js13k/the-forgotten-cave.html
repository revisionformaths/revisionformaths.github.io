/**
 * @param {number} value

 * */
function clampLeft(value, min) {
  return value < min ? min : value;
}

/**
 * @param {number} value
 * @param {number} max
 * @return {number}
 * */
function clampRight(value, max) {
  return value > max ? max : value;
}

/**
 * @param {number} value
 * @param {number} min
 * @param {number} max
 * @return {number}
 * */
function clamp(value, min, max) {
  return value < min ? min : (value > max ? max : value);
}

/**
 * @param {number} value
 * @return {number}
 * */
function clamp01(value) {
  return clamp(value, 0, 1);
}

var DEG_TO_RAD = Math.PI / 180;

/**

<script>/**
 * @param {number} x
 * @param {number} y
 * */
function Point(x, y) {
  var self = this;

  self.x = x;
  self.y = y;

  /**
   * @param {number} amt
   * @return Point
   * */
  self.mul = function(amt) {
    return new Point(self.x * amt, self.y * amt);
  };

  /**
   * @param {Point} min
   * @param {Point} max
   * @return Point
   * */
  self.clamp = function(min, max) {
    return new Point(clamp(self.x, min.x, max.x), clamp(self.y, min.y, max.y));
  };

  /**
   * @param {Point} other
   * @return Point
   * */
  self.add = function(other) {
    return new Point(self.x + other.x, self.y + other.y);
  };

  /**
   * @param {Point} other
   * @return Point
   * */
  self.sub = function(other) {
    return new Point(self.x - other.x, self.y - other.y);
  };

  /**
   * @param {Point} other
   * @return Point
   * */
  self.flat = function(other) {
    return new Point(self.x * other.x, self.y * other.y);
  };

  /**
   * @return {number}
   * */
  self.angle = function() {
    return Math.atan2(self.y, self.x);
  };

  /**
   * @return Point
   * */
  self.clone = function() {
    return new Point(self.x, self.y);
  };
}

Point.zero = function() { return Point.from(0) };
Point.one  = function() { return Point.from(1) };
Point.left  = function() { return new Point(1, 0) };
Point.down  = function() { return new Point(0, 1) };

/**
 * @static
 * @param {number} x
 * @param {number} [y]
 * @return {Point}
 * */
Point.from = function (x, y) {
  return new Point(x, typeof y === "undefined" ? x : y);
};</script>
<script>/**
 * @callback InitFunction
 * @param {Entity} entity
 * @return {void}
 * */

/**
 * @callback UpdateFunction
 * @param {Entity} entity
 * @param {number} dt
 * @return {void}
 * */

/**
 * @callback RenderFunction
 * @param {Entity} entity
 * @param {CanvasRenderingContext2D} ctx
 * @param {number} layer
 * @return {void}
 * */

/**
 * @typedef {Object} EntityDef
 * @property {string | string[]} gfx
 * @property {Point} position
 * @property {InitFunction} onInit
 * @property {UpdateFunction} onUpdate
 * @property {RenderFunction} onRender
 * */

/**
 * @typedef {Object} EntityDefOptionals
 * @property {string | string[]} [gfx]
 * @property {Point} [position]
 * @property {InitFunction} [onInit]
 * @property {UpdateFunction} [onUpdate]
 * @property {RenderFunction} [onRender]
 * */

/**
 * @class Entity
 * @param {EntityDef} def
 * */
function Entity(def) {
  var self = this;

  self.id = Entity.id++;

  /** @private */
  self._def = def;

  self.position = def.position;
  self.rotation = 0;

  self.size = Point.from(window.LayersDef[def.gfx].size);
  self.halfSize = self.size.mul(.5);

  def.onInit && def.onInit(self);

  /**
   * @param {number} dt
   * @return {void}
   * */
  self.Update = function(dt) {
    def.onUpdate(self, dt);
  };

  /**
   * @param {CanvasRenderingContext2D[]} ctxs
   * @return {void}
   * */
  self.Render = function(ctxs) {
    var ctx;
    for(var layer = 0;layer < ctxs.length; layer++) {
      ctx = ctxs[layer];

      ctx.save();
      ctx.translate(self.position.x + self.halfSize.x, self.position.y + self.halfSize.y);
      ctx.rotate(self.rotation * DEG_TO_RAD);
      ctx.translate(-self.halfSize.x, -self.halfSize.y);

      def.onRender(self, ctx, layer);

      ctx.restore();
    }
  };
}

/**
 * @type {number}
 * */
Entity.id = 0;

/**
 * @static
 * @param {string} type
 * @param {EntityDefOptionals} [modifiers]
 * @param {number} [priority]
 * @return {Entity}
 * */
Entity.new = function(type, modifiers, priority) {
  (modifiers = modifiers || {}).__proto__ = Entity.types[type];
  return EntityManager.Add(new Entity(modifiers), priority);
};

/**
 * @static
 * @type {Object.<string, EntityDef>}
 * @const
 * */
Entity.types = {
  "human": {
    gfx: "human",
    position: Point.zero(),
    onInit: function(entity) {
      entity.speed = 150;
      entity.left = Point.left();
      entity.down = Point.down();
      entity.dir = Point.zero();

      entity.injured = 0;
      entity.treasures = 0;

      entity.noMovement = false;

      entity.getBB = function() {
        return {
          x: entity.position.x + 16,
          y: entity.position.y + 16,
          w: TILE_SIZE - 16 * 2,
          h: TILE_SIZE - 16 * 2
        };
      };
    },
    onUpdate: function(entity, dt) {
      if(entity.noMovement) return;

      var s = (entity.speed - entity.injured * 50) * dt, v, h;

      v = h = 0;

      var newPosV = Point.zero();
      var newPosH = Point.zero();
      var newPos = entity.position;

      if(Keyboard.Keys[Keyboard.Key.Up] >= Keyboard.State.Pressed) {
        newPosV = newPosV.sub(entity.down.mul(s));
        if(!v) {v = 1; entity.dir.y = 0}
        entity.dir.y -= 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Down] >= Keyboard.State.Pressed) {
        newPosV = newPosV.add(entity.down.mul(s));
        if(!v) {v = 1; entity.dir.y = 0}
        entity.dir.y += 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Left] >= Keyboard.State.Pressed) {
        newPosH = newPosH.sub(entity.left.mul(s));
        if(!h) {h = 1; entity.dir.x = 0}
        entity.dir.x -= 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Right] >= Keyboard.State.Pressed) {
        newPosH = newPosH.add(entity.left.mul(s));
        if (!h) {
          h = 1;
          entity.dir.x = 0
        }
        entity.dir.x += 1;
      }

      if(!Physics.CollidesWith(
          "map",
          newPosV.x + 16 + entity.position.x,
          newPosV.y + 16 + entity.position.y,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        newPos = newPos.add(newPosV);
      }

      if(!Physics.CollidesWith(
          "map",
          newPosH.x + 16 + entity.position.x,
          newPosH.y + 16 + entity.position.y,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        newPos = newPos.add(newPosH);
      }

      entity.position = newPos;

      if(v !== h) {
        if(!v) entity.dir.y = 0;
        if(!h) entity.dir.x = 0;
      }

      entity.rotation = entity.dir.angle() * RAD_TO_DEG + 90;
    },
    onRender: function(entity, ctx, layer) {
      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  crystal: {
    gfx: "crystal",
    position: Point.zero(),
    onInit: function(entity) {
      entity.offset = 0;
      entity.offsetHelperAngle = 0;
    },
    onUpdate: function(entity, dt) {
      // Update visuals
      entity.rotation += 50 * dt;

      entity.offsetHelperAngle += 100 * dt;
      entity.offset = Math.round(Math.abs(Math.sin(entity.offsetHelperAngle * DEG_TO_RAD) * 3));

      // Check for pickup

      var bb = PLAYER.getBB();

      if(!entity.triggered && Physics.Collide(
          bb.x, bb.y, bb.w, bb.h,
          entity.position.x + 16,
          entity.position.y + 16,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        EntityManager.Remove(entity);

        PLAYER.treasures++;
      }
    },
    onRender: function(entity, ctx, layer) {
      layer -= entity.offset;

      if(layer < 0) return;

      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  trap: {
    gfx: "trap",
    position: Point.zero(),
    onInit: function(entity) {
      entity.triggered = false
    },
    onUpdate: function(entity, dt) {
      var bb = PLAYER.getBB();

      if(!entity.triggered && Physics.Collide(
        bb.x, bb.y, bb.w, bb.h,
        entity.position.x + 16,
        entity.position.y + 16,
        TILE_SIZE - 16 * 2,
        TILE_SIZE - 16 * 2
      )) {
        entity.triggered = true;
        PLAYER.injured++;

        if(PLAYER.injured >= 3) {
          PLAYER.noMovement = true;

          id("gameOver").classList.add("show");
        }
      }
    },
    onRender: function(entity, ctx, layer) {
      !layer && ctx.drawImage(
        Layers[entity._def.gfx][entity.triggered ? 1 : 0],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  exit: {
    gfx: "exit",
    position: Point.zero(),
    onUpdate: function(entity) {
      var bb = PLAYER.getBB();

      if(Physics.Collide(
          bb.x, bb.y, bb.w, bb.h,
          entity.position.x + 16,
          entity.position.y + 16,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {

        PLAYER.noMovement = true;

        id("gameWon").classList.add("show");

        id("trap-" + PLAYER.injured).style.display = "block";

        id("treasure").innerText = "You got " + PLAYER.treasures + " treasures"

      }
    },
    onRender: function(entity, ctx, layer) {
      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  }
};</script>

<script>Keyboard = {};

Keyboard.State = {};
Keyboard.State.Up = 0;
Keyboard.State.Pressed = 1;
Keyboard.State.Down = 2;


Keyboard.Key = {};
Keyboard.Key.Up    = 87;
Keyboard.Key.Left  = 65;
Keyboard.Key.Down  = 83;
Keyboard.Key.Right = 68;
Keyboard.Key.R     = 82;
Keyboard.Key.F     = 70;

Keyboard.Keys = {};

Keyboard._keydown = function(evt) {
  var key = evt.which;

  if(!Keyboard.Keys[key] && Keyboard.Keys[key] !== Keyboard.State.Up) Keyboard.Keys[key] = Keyboard.State.Up;
  if(Keyboard.Keys[key] === Keyboard.State.Pressed) Keyboard.Keys[key] = Keyboard.State.Down;
  if(Keyboard.Keys[key] === Keyboard.State.Up) Keyboard.Keys[key] = Keyboard.State.Pressed;
};

Keyboard._keyup = function(evt) {
  var key = evt.which;
  Keyboard.Keys[key] = Keyboard.State.Up;
};

Keyboard.init = function() {
  document.body.addEventListener("keydown", Keyboard._keydown);
  document.body.addEventListener("keyup", Keyboard._keyup);
};</script>

<script>/**
 * @param {string} packedData
 * @return {string}
 */
function Decoder(packedData) {
  return packedData
    .replace(/\s*/g, "")
    .split(/(\w\d*)/g)
    .filter(Boolean)
    .map(function(pair) {
      return new Array((parseInt(pair.substr(1)) || 1) + 1).join(pair[0]);
    })
    .join("");
}</script>
<script>/**
 * @param {string} data
 * @param {number} rowSize
 * @param {number} scale
 * @return {string}
 */
function Magnifier(data, rowSize, scale) {
  var a = new Array(scale + 1);
  return data
    .split(new RegExp("(.{" + rowSize + "})", "g"))
    .map(function(row) {
      row = row
        .split("")
        .map(function(c) {
          return a.join(c);
        })
        .join("");
      return a.join(row);
    })
    .join("");
}</script>

<script>var Physics = new function() {
  var self = this;


  self._colliders = {};

  /**
   * @param {string} group
   * @param {number} x
   * @param {number} y
   * @param {number} w
   * @param {number} h
   * @return {boolean}
   */
  self.AddCollider = function(group, x, y, w, h) {
    if(!self._colliders[group]) self._colliders[group] = [];

    self._colliders[group].push({
      x: x,
      y: y,
      w: w,
      h: h
    })
  };

  /**
   * @param {string} group
   * @param {number} x
   * @param {number} y
   * @param {number} w
   * @param {number} h
   * @return {boolean}
   */
  self.CollidesWith = function(group, x, y, w, h) {
    if(!self._colliders[group]) return false;

    var colliders = self._colliders[group];

    for(var i = 0;i < colliders.length; i++) {
      var collider = colliders[i];
      if(self.Collide(
          collider.x,
          collider.y,
          collider.w,
          collider.h,
          x,
          y,
          w,
          h
      )) return true;
    }

    return false;
  };

  /**
   * @param {number} x1
   * @param {number} y1
   * @param {number} w1
   * @param {number} h1
   * @param {number} x2
   * @param {number} y2
   * @param {number} w2
   * @param {number} h2
   * @return {boolean}
   */
  self.Collide = function(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 &&
      x1 + w1 > x2 &&
      y1 < y2 + h2 &&
      y1 + h1 > y2;
  }
};</script>

<script>var EntityManager = new function() {
  var self = this;

  /**
   * @type {Object.<number, Entity[]>}
   * @private
   * */
  self._entities = [];

  /**
   * @type {CanvasRenderingContext2D[]}
   * */
  self._layersCtx = [];

  /**
   * @param {Entity} entity
   * @param {number} [priority=0]
   * @return {Entity}
   * */
  self.Add = function(entity, priority) {
    priority = priority || 0;
    (self._entities[priority] = self._entities[priority] || []).push(entity);
    return entity;
  };

  /**
   * @param {Entity} entity
   * @return {Entity}
   * */
  self.Remove = function(entity) {
    Object.keys(self._entities)
      .map(function(priority) {
        return self._entities[priority];
      })
      .forEach(function (entities) {
        var idx = entities.indexOf(entity);

        if(idx !== -1) {
          entities.splice(idx, 1);
        }
      });
  };

  /**
   * @callback LoopFunction
   * @property {Entity} entity
   * */

  /**
   * @param {LoopFunction} fn
   * @return {Entity}
   * */
  self._loop = function(fn) {
    Object.keys(self._entities).forEach(function(key) {
      for(var i = 0;i < self._entities[key].length; i++) {
        fn(self._entities[key][i]);
      }
    });
  };

  /**
   * @param {number} dt
   * @return {void}
   * */
  self.Update = function(dt) {
    self._loop(function(entity) {
      entity.Update(dt);
    });
  };

  /**
   * @return {void}
   * */
  self.Render = function() {
    for(var i = 0; i < self._layersCtx.length; i++)
      self._layersCtx[i].clearRect(0, 0, Map.realWidth, Map.realHeight);

    self._loop(function(entity) {
      entity.Render(self._layersCtx);
    });
  };

  /**
   * @param {VoidCallback} cb
   * @return {void}
   * */
  self.Init = function(cb) {

    var layersHolder = id("map");

    for(var i = 0, canvas, ctx;i < LayersCount; i++) {
      self._layersCtx.push(
        (ctx = (canvas = get("canvas")).getContext("2d"))
      );

      canvas.style.transform = "translateZ(" + ( i * DISTANCE_BETWEEN_LAYERS ) + "px)";
      canvas.width = Map.realWidth;
      canvas.height = Map.realHeight;

      canvas.webkitImageSmoothingEnabled = false;
      canvas.mozImageSmoothingEnabled = false;
      canvas.imageSmoothingEnabled = false;

      layersHolder.appendChild(canvas);
    }

    cb();
  }
};

  "exit",
  {
    position: tileToWorldSpace(new Point(1, 19))
  }
);</script>
<script>/**
 * @callback InitFunction
 * @param {Entity} entity
 * @return {void}
 * */

/**
 * @callback UpdateFunction
 * @param {Entity} entity
 * @param {number} dt
 * @return {void}
 * */

/**
 * @callback RenderFunction
 * @param {Entity} entity
 * @param {CanvasRenderingContext2D} ctx
 * @param {number} layer
 * @return {void}
 * */

/**
 * @typedef {Object} EntityDef
 * @property {string | string[]} gfx
 * @property {Point} position
 * @property {InitFunction} onInit
 * @property {UpdateFunction} onUpdate
 * @property {RenderFunction} onRender
 * */

/**
 * @typedef {Object} EntityDefOptionals
 * @property {string | string[]} [gfx]
 * @property {Point} [position]
 * @property {InitFunction} [onInit]
 * @property {UpdateFunction} [onUpdate]
 * @property {RenderFunction} [onRender]
 * */

/**
 * @class Entity
 * @param {EntityDef} def
 * */
function Entity(def) {
  var self = this;

  self.id = Entity.id++;

  /** @private */
  self._def = def;

  self.position = def.position;
  self.rotation = 0;

  self.size = Point.from(window.LayersDef[def.gfx].size);
  self.halfSize = self.size.mul(.5);

  def.onInit && def.onInit(self);

  /**
   * @param {number} dt
   * @return {void}
   * */
  self.Update = function(dt) {
    def.onUpdate(self, dt);
  };

  /**
   * @param {CanvasRenderingContext2D[]} ctxs
   * @return {void}
   * */
  self.Render = function(ctxs) {
    var ctx;
    for(var layer = 0;layer < ctxs.length; layer++) {
      ctx = ctxs[layer];

      ctx.save();
      ctx.translate(self.position.x + self.halfSize.x, self.position.y + self.halfSize.y);
      ctx.rotate(self.rotation * DEG_TO_RAD);
      ctx.translate(-self.halfSize.x, -self.halfSize.y);

      def.onRender(self, ctx, layer);

      ctx.restore();
    }
  };
}

/**
 * @type {number}
 * */
Entity.id = 0;

/**
 * @static
 * @param {string} type
 * @param {EntityDefOptionals} [modifiers]
 * @param {number} [priority]
 * @return {Entity}
 * */
Entity.new = function(type, modifiers, priority) {
  (modifiers = modifiers || {}).__proto__ = Entity.types[type];
  return EntityManager.Add(new Entity(modifiers), priority);
};

/**
 * @static
 * @type {Object.<string, EntityDef>}
 * @const
 * */
Entity.types = {
  "human": {
    gfx: "human",
    position: Point.zero(),
    onInit: function(entity) {
      entity.speed = 150;
      entity.left = Point.left();
      entity.down = Point.down();
      entity.dir = Point.zero();

      entity.injured = 0;
      entity.treasures = 0;

      entity.noMovement = false;

      entity.getBB = function() {
        return {
          x: entity.position.x + 16,
          y: entity.position.y + 16,
          w: TILE_SIZE - 16 * 2,
          h: TILE_SIZE - 16 * 2
        };
      };
    },
    onUpdate: function(entity, dt) {
      if(entity.noMovement) return;

      var s = (entity.speed - entity.injured * 50) * dt, v, h;

      v = h = 0;

      var newPosV = Point.zero();
      var newPosH = Point.zero();
      var newPos = entity.position;

      if(Keyboard.Keys[Keyboard.Key.Up] >= Keyboard.State.Pressed) {
        newPosV = newPosV.sub(entity.down.mul(s));
        if(!v) {v = 1; entity.dir.y = 0}
        entity.dir.y -= 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Down] >= Keyboard.State.Pressed) {
        newPosV = newPosV.add(entity.down.mul(s));
        if(!v) {v = 1; entity.dir.y = 0}
        entity.dir.y += 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Left] >= Keyboard.State.Pressed) {
        newPosH = newPosH.sub(entity.left.mul(s));
        if(!h) {h = 1; entity.dir.x = 0}
        entity.dir.x -= 1;
      }
      if(Keyboard.Keys[Keyboard.Key.Right] >= Keyboard.State.Pressed) {
        newPosH = newPosH.add(entity.left.mul(s));
        if (!h) {
          h = 1;
          entity.dir.x = 0
        }
        entity.dir.x += 1;
      }

      if(!Physics.CollidesWith(
          "map",
          newPosV.x + 16 + entity.position.x,
          newPosV.y + 16 + entity.position.y,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        newPos = newPos.add(newPosV);
      }

      if(!Physics.CollidesWith(
          "map",
          newPosH.x + 16 + entity.position.x,
          newPosH.y + 16 + entity.position.y,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        newPos = newPos.add(newPosH);
      }

      entity.position = newPos;

      if(v !== h) {
        if(!v) entity.dir.y = 0;
        if(!h) entity.dir.x = 0;
      }

      entity.rotation = entity.dir.angle() * RAD_TO_DEG + 90;
    },
    onRender: function(entity, ctx, layer) {
      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  crystal: {
    gfx: "crystal",
    position: Point.zero(),
    onInit: function(entity) {
      entity.offset = 0;
      entity.offsetHelperAngle = 0;
    },
    onUpdate: function(entity, dt) {
      // Update visuals
      entity.rotation += 50 * dt;

      entity.offsetHelperAngle += 100 * dt;
      entity.offset = Math.round(Math.abs(Math.sin(entity.offsetHelperAngle * DEG_TO_RAD) * 3));

      // Check for pickup

      var bb = PLAYER.getBB();

      if(!entity.triggered && Physics.Collide(
          bb.x, bb.y, bb.w, bb.h,
          entity.position.x + 16,
          entity.position.y + 16,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {
        EntityManager.Remove(entity);

        PLAYER.treasures++;
      }
    },
    onRender: function(entity, ctx, layer) {
      layer -= entity.offset;

      if(layer < 0) return;

      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  trap: {
    gfx: "trap",
    position: Point.zero(),
    onInit: function(entity) {
      entity.triggered = false
    },
    onUpdate: function(entity, dt) {
      var bb = PLAYER.getBB();

      if(!entity.triggered && Physics.Collide(
        bb.x, bb.y, bb.w, bb.h,
        entity.position.x + 16,
        entity.position.y + 16,
        TILE_SIZE - 16 * 2,
        TILE_SIZE - 16 * 2
      )) {
        entity.triggered = true;
        PLAYER.injured++;

        if(PLAYER.injured >= 3) {
          PLAYER.noMovement = true;

          id("gameOver").classList.add("show");
        }
      }
    },
    onRender: function(entity, ctx, layer) {
      !layer && ctx.drawImage(
        Layers[entity._def.gfx][entity.triggered ? 1 : 0],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  },
  exit: {
    gfx: "exit",
    position: Point.zero(),
    onUpdate: function(entity) {
      var bb = PLAYER.getBB();

      if(Physics.Collide(
          bb.x, bb.y, bb.w, bb.h,
          entity.position.x + 16,
          entity.position.y + 16,
          TILE_SIZE - 16 * 2,
          TILE_SIZE - 16 * 2
        )) {

        PLAYER.noMovement = true;

        id("gameWon").classList.add("show");

        id("trap-" + PLAYER.injured).style.display = "block";

        id("treasure").innerText = "You got " + PLAYER.treasures + " treasures"

      }
    },
    onRender: function(entity, ctx, layer) {
      Layers[entity._def.gfx][layer] && ctx.drawImage(
        Layers[entity._def.gfx][layer],
        0, // TODO: modify this offset to support animations
        0,
        entity.size.x,
        entity.size.y,
        0,
        0,
        entity.size.x,
        entity.size.y
      );
    }
  }
};</script>
<script>var Core = new function() {

  var self = this;

  self.canvases = {
    entities: {canvas: null, ctx: null},
    ui: {canvas: null, ctx: null}
  };

  self.container = null;

  self.init = function() {
    self.initCanvases();

    window.GFX_unpackGFX(function() {

      Keyboard.init();
      Mouse.init();

      LayersCreator.init(function() {
        Map.init();

        EntityManager.Init(function() {
          self.loop();
        });
      });
    });
  };

  self.initCanvases = function() {
    self.container = id("game");

    Object.keys(self.canvases).forEach(function(canvasId) {
      var canvas = get("canvas");

      canvas.id = canvasId;
      canvas.webkitImageSmoothingEnabled = false;
      canvas.mozImageSmoothingEnabled = false;
      canvas.imageSmoothingEnabled = false;

      self.container.appendChild(canvas);

      self.canvases[canvasId].ctx = (self.canvases[canvasId].canvas = canvas).getContext("2d");
    });

    var resizeFn = function() {
      Object.keys(self.canvases).forEach(function(canvas) {
        self.canvases[canvas].canvas.width = GAME_WIDTH;
        self.canvases[canvas].canvas.height = GAME_HEIGHT;
      });

      self.container.style.width = GAME_WIDTH + "px";
      self.container.style.height = GAME_HEIGHT + "px";
    };

    resizeFn();
    window.addEventListener("resize", resizeFn);
  };

  self.lsts = null;
  self.loop = function() {
    window.requestAnimFrame(self.loop);

    var ts = Date.now();
    if(!self.lsts) self.lsts = ts;
    var dt = (ts - self.lsts) / 1000;
    self.lsts = ts;

    self.update(dt);
    self.render(dt);

  };
  self.update = function(dt) {
    EntityManager.Update(dt);
    Camera.update();
    Map.update(dt);
  };
  self.render = function() {
    Object.keys(self.canvases).forEach(function(canvasId) {
      self.canvases[canvasId].ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    });

    EntityManager.Render();
  };

};

window.addEventListener("load", function() {
  Core.init();
});

window.requestAnimFrame = (function(){
  return  window.requestAnimationFrame       ||
    window.webkitRequestAnimationFrame ||
    window.mozRequestAnimationFrame    ||
    function( callback ){
      window.setTimeout(callback, 1000 / 60);
    };
})();</script>
