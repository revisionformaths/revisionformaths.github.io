	<script>'use strict';

function GetRoomData(index) {
	let result;
	switch (index) {
		case 0:
			result = GetRoomData0();
			break;
	}
	if (result) {
		//add global commands
		result.commands = result.commands.concat(getGameCommands());
	}
	return result;
}

			+ 'made of stainless steel. There is a\r\n'
			+ 'single [door]. [Bones] lie in a\r\n'

		, {

			id: 1000, label: 'list-commands', verb: 'list', noun: 'commands'

		, {
			id: 1001, label: 'save-game', verb: 'save', noun: 'game'

		}

			id: 1002, label: 'load-game', verb: 'load', noun: 'game'
			, msg: 'Game loaded'
		}
		, {
			id: 1003, label: 'reset-game', verb: 'reset', noun: 'game'
			, msg: 'Game reset'
		}
	];
	return gameCommands;
}

	<script>'use strict';

let gpTitle;
let gpMessage;

function startGame() {
	gpTitle = new component('30px', 'Ariel', 'green', 24, 30, 'text');

	gpMessage = new component('24px', 'Consolas', 'red', 24, 40, 'array');
	myGameArea.start();
}

const myGameArea = {
	canvas: document.getElementById('myCanvas'),
	stringBuffer: '', // holds text before Enter key is hit
	screenBuffer: '', // holds text of "screen"
	buffPosition: 0, // position in the buffer where the "cursor" is
	lineBuffer: new Array(), // holds the lines commited after Enter key
	arrowKeys: [],
	gameFps: 30,
	acceptInput: true,  // default to allow entry on message
	roomIndex: 0,
	roomMessageIndex: 0,
	roomData: {},
	gameSave: {},
	currentRoomSave: {},
	currentDialog: {},
	onlineStatus: false,
	start: function () {
		this.speedX = 0;
		this.speedY = 0;
		this.canvas.width = window.innerWidth;
		this.canvas.height = window.innerHeight;
		this.stringBuffer = '';
		this.getRoomData();
		this.getNextMessage();
		this.gameSave = this.getDefaultGameData();
		this.currentRoomSave = this.getDefaultRoomData(0);

		this.context = this.canvas.getContext('2d', { alpha: false }); // turn off transparency
		this.interval = setInterval(this.updateGameArea, 1000 / this.gameFps);
	},
	clear: function () {
		this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
	},
	getNextMessage: function () {
		if (myGameArea.roomMessageIndex >= 0 && myGameArea.roomMessageIndex < myGameArea.roomData.messages.length) {
			//index within the bounds of messages array
			let currentMessage = myGameArea.roomData.messages[myGameArea.roomMessageIndex];

			// increment index
			if (myGameArea.roomMessageIndex < myGameArea.roomData.messages.length
				&& currentMessage.msg !== undefined) {

				if (currentMessage.msg.supressCmd) {
					myGameArea.acceptInput = !supressCmd;
				}
				if (currentMessage.next !== undefined) {
					myGameArea.roomMessageIndex = this.findMessageByLabel(currentMessage.next, myGameArea.roomMessageIndex);
				}
			}
			myGameArea.screenBuffer = currentMessage.msg;
			this.currentDialog = currentMessage;
		} else {
			myGameArea.screenBuffer = 'unknown message';
		}
	},
	findMessageByLabel: function (labelToFind, currentLine) {
		// if no label or currentLine is less than zero, don't do it
		if (labelToFind.length > 0 && currentLine >= 0) {
			for (let i = currentLine; i < myGameArea.roomData.messages.length; i++) {
				const line = myGameArea.roomData.messages[i];
				if (line.label !== undefined && line.label === labelToFind) {
					return i;
				}
			}
		}
		return currentLine;
	},
	getRoomData: function () {
		if (this.roomIndex === 0) {
			this.roomData = GetRoomData(this.roomIndex);
		}
	},
	getDefaultGameData: function () {
		const gameData = {
			playerName: 'Player1'
			, currentRoomIndex: 0
			, lockedRooms: [0]
			, inventory: [
				{ name: 'pen', value: 1 }
				, { name: 'matchbook', value: 18 }
				, { name: 'gum', value: 5 }
			]
		};
		return gameData;
	},
	getDefaultRoomData: function (index) {
		switch (index) {
			case 0:
				return this.getDefaultRoom0Data();
				break;
		}
	},
	getDefaultRoom0Data: function () {
		const roomData = [
			{ name: 'rm0-unchained', value: 0 }
			, { name: 'rm0-shim', value: 0 }
			, { name: 'rm0-padlockOpen', value: 0 }
			, { name: 'rm0-roomComplete', value: 0 }
			, { name: 'rm0-wireConnected', value: 0 }
		];

		return roomData;
	},
	updateGameArea: function () {
		myGameArea.clear();

		if (myGameArea.currentDialog && myGameArea.currentDialog.next) {
			// theres more text to show
			gpMessage.text = Convert2dArrayToString(
				Draw(40, 20, myGameArea.screenBuffer, myGameArea.stringBuffer, true));
		} else {
			// end of text, not continuation
			gpMessage.text = Convert2dArrayToString(
				Draw(40, 20, myGameArea.screenBuffer, myGameArea.stringBuffer));
		}
		gpMessage.update();

		if (myGameArea.onlineStatus === true) {
			gpTitle.text = 'Escape!			ONLINE Mode'
		} else {
			gpTitle.text = 'Escape!			Super Cool OFFLINE Mode'
		}
		
		gpTitle.update();
	}
}

function component(width, height, color, x, y, type) {
	this.type = type;
	this.width = width;
	this.height = height;
	this.x = x;
	this.y = y;

	this.update = function () {
		const ctx = myGameArea.context;
		if (this.type == 'text') {
			if (this.text !== undefined) {
				ctx.font = this.width + ' ' + this.height;
				ctx.fillStyle = color;
				ctx.fillText(this.text, this.x, this.y);
			}
		} else if (this.type === 'array') {
			if (this.text !== undefined) {
				//console.log(this.text);
				let lines = this.text.split('\r\n');
				const spacing = 20;

				//could make different colors
				ctx.font = this.width + ' ' + this.height;
				ctx.fillStyle = color;

				for (let i = 0; i < lines.length; i++) {
					let lineSpace = (spacing * (i + 1)) + this.y;
					ctx.fillText(lines[i], this.x, lineSpace);
					//console.log('linespacing: ' + lineSpace);
				}
			}
		} else {
			ctx.fillStyle = color;
			ctx.fillRect(this.x, this.y, this.width, this.height);
		}
	}

	this.newPos = function () {
		this.x += this.speedX;
		this.y += this.speedY;
	}
}

// if there is text in the command box,
// verify if it is a command or dialog answer
// process accordingly
function parseCommandText(command) {
	let result = { verb: '', noun: '' };//default to dialog text

	// seperate by spaces, assume last item is noun
	const lineArray = command.split(' ');
	if (lineArray.length > 1 && lineArray[lineArray.length - 1] !== undefined) {
		// only use last word
		result.noun = lineArray[lineArray.length - 1];

		// if Look or Use is in the command string, then command, else, dialog
		result.verb = lineArray[0].toLowerCase();
	} else {
		return;
	}

	return result;
}

			saveGame();

			loadGame();
		}

			result = command.msg;
		}

		if (command.checkVariable && command.checkValue) {
			// if valid, use msgSuccess
			let checkSetting = myGameArea.currentRoomSave.filter(setting => setting.name === command.checkVariable);
			if (checkSetting && checkSetting.length === 1) {
				if (checkSetting[0].value === command.checkValue) {
					//inside if

					if (command.msgSuccess) {
						result = command.msgSuccess;
					}
					if (command.next) {
						// should jumpt to next dialog
						myGameArea.roomMessageIndex = myGameArea.findMessageByLabel(command.next, myGameArea.roomMessageIndex);
					}
					// check is successful, then do setVariable if available
					if (command.setVariable && command.setValue) {
						//if valid, commit variable to settings
						let updateSetting = myGameArea.currentRoomSave.filter(setting => setting.name === command.setVariable);
						if (updateSetting && updateSetting.length === 1) {
							// if it is already set, then we have already performed this action
							if (updateSetting[0].value !== command.setValue) {
								updateSetting[0].value = command.setValue;
							} else {
								// potentially duplicate, need to check if dupes is okay
								// use door isn't a good one to show this message
								// result = 'You have already performed this\r\n'
								// 	+ 'action.';
							}
						}
					} // if (command.setVariable && command.setValue) {		
				} else {
				}
			}
		} else {
			if (command.setVariable && command.setValue) {
				//if valid, commit variable to settings
				let updateSetting = myGameArea.currentRoomSave.filter(setting => setting.name === command.setVariable);
				if (updateSetting && updateSetting.length === 1) {
					// if it is already set, then we have already performed this action
					if (updateSetting[0].value !== command.setValue) {
						updateSetting[0].value = command.setValue;
					} else {
						// potentially duplicate, need to check if dupes is okay
						// use door isn't a good one to show this message
						// result = 'You have already performed this\r\n'
						// 	+ 'action.';
					}
				}
			} // if (command.setVariable && command.setValue) {

		}
	} // if (command) {
	return result;
}

function saveGame() {
	if (typeof (Storage) !== "undefined") {
		let saveData = {
			roomIndex: myGameArea.roomIndex
			, roomMessageIndex: myGameArea.roomMessageIndex
			, roomData: myGameArea.roomData
			, gameSave: myGameArea.gameSave
			, currentRoomSave: myGameArea.currentRoomSave
			, currentDialog: myGameArea.currentDialog
		}
		localStorage.setItem('escapegame.saveData', JSON.stringify(saveData));
	}
}

function loadGame() {
	if (typeof (Storage) !== "undefined") {
		let saveDataString = localStorage.getItem('escapegame.saveData');
		let saveData = JSON.parse(saveDataString);

		myGameArea.roomIndex = saveData.roomIndex;
		myGameArea.roomMessageIndex = saveData.roomMessageIndex;
		myGameArea.roomData = saveData.roomData;
		myGameArea.gameSave = saveData.gameSave;
		myGameArea.currentRoomSave = saveData.currentRoomSave;
		myGameArea.currentDialog = saveData.currentDialog;
	}
}

}

	<script>'use strict';

const c_crlf = '\r\n'; // carriage return line feed
const c_bdr = '#'; // border
const c_n = '\0'; // Null char

function ConvertStringTo2dArray(convertString) {
	// Assume lines are seperated by '\r\n'
	let result = [];
	if (convertString.length > 0) {
		const lines = convertString.split(c_crlf);

		for (var i = 0; i < lines.length; i++) {
			// Array.split removes some whitespace like null
			// Array.from maintains non-printable chars
			result[i] = Array.from(lines[i]);
		}
	}

	return result;
}

function Convert2dArrayToString(multiArray) {
	let result = '';
	//lines, columns
	for (let lines = 0; lines < multiArray.length; lines++) {
		//get columns
		for (let char = 0; char < multiArray[lines].length; char++) {
			if (multiArray[lines][char] !== undefined) {
				result = result + multiArray[lines][char];
			}
		}
		result = result + c_crlf;
	}

	return result;
}

function DrawBorder(charWidth, charHeight, showMore) {
	const top = c_bdr.repeat(charWidth);

	let result = top + c_crlf;

	// fill height with filler lines
	// total lines is a header and bottom (2) + input area (4) + content
	for (let i = 0; i < charHeight - (2 + 4); i++) {
		result = result + c_bdr + c_n.repeat(charWidth - 2) + c_bdr + c_crlf;
	}
	// draw lower text border
	if (showMore) {
		let middle = (charWidth / 2) - 3;
		//console.log('middle: ' + middle);
		// ...#### MORE ####...
		result = result + c_bdr.repeat(middle) + ' MORE ' + c_bdr.repeat(middle);
	} else {
		result = result + c_bdr.repeat(charWidth);
	}

	//draw input area
	for (let i = 0; i < 4; i++) {
		result = result + c_bdr + c_n.repeat(charWidth - 2) + c_bdr + c_crlf;
	}
	result = result + c_bdr.repeat(charWidth);

	return result;
}

function DrawMessageText(charWidth, charHeight, message) {
	// embed margins for the text, 1 char
	const topPad = c_n.repeat(charWidth) + c_crlf;
	let formattedMessage = topPad + c_crlf;

	//convert message to lines in case embedded line breaks
	const lines = message.split(c_crlf);

	for (let i = 0; i < lines.length; i++) {
		let lineText = lines[i];

		// only process if text is more than blank
		if (lineText.length > 0) {
			if (lineText.length + 4 > charWidth) { // message + margin in front and back
				//need to wrap line below
				//console.log('ERR: Need to wrap text to next line!');
				formattedMessage = formattedMessage + c_n.repeat(2) +
					lineText.substring(0, charWidth - 4) + c_n.repeat(charWidth - 2) + c_crlf
				//TODO: properly wrap text instead of trimming
			} else {
				// message can fit within line and padding
				formattedMessage = formattedMessage + c_n.repeat(2) +
					lineText + c_n.repeat(charWidth - lineText.length - 2) + c_crlf;
			}
		} else {
			// if blank line, still insert line
			formattedMessage = formattedMessage + c_n.repeat(charWidth) + c_crlf
		}
	}

	return formattedMessage + topPad;
}

function DrawInputText(charWidth, charHeight, inputString) {
	// from the bottom, go up one and output text there
	// 1 char border, 1 char space, start of first char
	let result = c_crlf.repeat(charHeight - 3) + c_n.repeat(2) + inputString;//prolly should trim to width - 4 (margin on each side)
	return result;
}

function Draw(charWidth, charHeight, message, input, showMore) {
	// define the array to draw the screen
	let screen = new Array(charHeight);
	for (var i = 0; i < screen.length; i++) {
		screen[i] = new Array(charWidth);
	}

	//convert each line of chars into char array
	const screen_layers = new Array(3);
	screen_layers[0] = ConvertStringTo2dArray(DrawBorder(charWidth, charHeight, showMore));
	screen_layers[1] = ConvertStringTo2dArray(DrawMessageText(charWidth, charHeight,
		message));
	screen_layers[2] = ConvertStringTo2dArray(DrawInputText(charWidth, charHeight,
		input));

	for (var x = 0; x < charHeight; x++) {
		//loop through all lines
		for (var y = 0; y < charWidth; y++) {
			//loop through all chars

			//find first one with not null char
			for (var layers = screen_layers.length - 1; layers >= 0; layers--) {
				//console.log('layers: ' + layers + ' x: ' + x + ' y: ' + y);
				// skip line if undefined, rely on bottom layer to pick up the slack
				if ((screen_layers[layers][x] !== undefined) && (screen_layers[layers][x][y] !== undefined) && (screen_layers[layers][x][y] !== c_n)) {
					screen[x][y] = screen_layers[layers][x][y];
					break;
				}
			}

			if (screen[x][y] === c_n || screen[x][y] === undefined) {
				//nothing found, default to blank
				screen[x][y] = ' ';
			}
		}
	}
	//console.log(screen);
	return screen;
}</script>
	<script>/*
    event hooks for window object
*/
window.addEventListener('resize', function (e) {
	myGameArea.canvas.width = window.innerWidth;
	myGameArea.canvas.height = window.innerHeight;
	updateGameArea();
});
// respond to keyboard events
window.addEventListener('keydown', function (e) {
	myGameArea.arrowKeys = (myGameArea.arrowKeys || []);
	if (e.keyCode >= 37 && e.keyCode <= 40) { //arrow keys
		// 37-left, 38-up, 39-right, 40-down
		// offset keyCode so index starts at zero and there won't be empty items in array
		myGameArea.arrowKeys[e.keyCode - 37] = true;
	} else if (e.keyCode === 8 && myGameArea.acceptInput) { // backspace
		myGameArea.stringBuffer = myGameArea.stringBuffer.substr(0, myGameArea.stringBuffer.length - 1);
	}
});
window.addEventListener('keyup', function (e) {
	if (e.keyCode >= 37 && e.keyCode <= 40) {
		// offset keyCode so index starts at zero and there won't be empty items in array
		myGameArea.arrowKeys[e.keyCode - 37] = false;
	}
});
window.addEventListener('keypress', function (e) {
	myGameArea.stringBuffer = (myGameArea.stringBuffer || '');
	if (e.keyCode === 13 && myGameArea.stringBuffer !== '') {
		// enter key
		let answer = myGameArea.stringBuffer;
		myGameArea.stringBuffer = '';
		let commandResult = parseCommandText(answer);
		if (commandResult !== undefined) {
			//Do Interaction
			showCommandMessage(commandResult);
		} else {
			//showNextDialogMessage(answer);
			myGameArea.getNextMessage();
		}
	} else if (e.keyCode === 13) {
		// nothing typed
		myGameArea.getNextMessage();
	} else if (myGameArea.acceptInput) {
		let newChar = String.fromCharCode(e.charCode);

		if (myGameArea.buffPosition === myGameArea.stringBuffer.length) {
			myGameArea.buffPosition = myGameArea.buffPosition + 1
		}
		myGameArea.stringBuffer = myGameArea.stringBuffer + newChar;
		//console.log('keypress: ' + myGameArea.stringBuffer);
	}
});
