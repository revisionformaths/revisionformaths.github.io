    <script> 	(function() {
	var lastTime = 0;
	var vendors = ['ms', 'moz', 'webkit', 'o'];
	for(var x = 0; x < vendors.length && !window.requestAnimationFrame; ++x) {
	window.requestAnimationFrame = window[vendors[x]+'RequestAnimationFrame'];
	window.cancelAnimationFrame = window[vendors[x]+'CancelAnimationFrame']
	|| window[vendors[x]+'CancelRequestAnimationFrame'];
	}
	if (!window.requestAnimationFrame)
	window.requestAnimationFrame = function(callback, element) {
	var currTime = new Date().getTime();
	var timeToCall = Math.max(0, 16 - (currTime - lastTime));
	var id = window.setTimeout(function() { callback(currTime + timeToCall); },
	timeToCall);
	lastTime = currTime + timeToCall;
	return id;
	};
	if (!window.cancelAnimationFrame)
	window.cancelAnimationFrame = function(id) {
	clearTimeout(id);
	};
	}());
</script>
    <script>

function makeBackdrop()
{
	var c=document.getElementById('backdrop');
	var main=document.getElementById('main');
	c.width = main.offsetWidth; c.height = main.offsetHeight;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#222255"
	ctx.fillRect(0,0,c.width,c.height);	
	var pipeHeight=c.height*.2;
	
	c.step=function(count) {
	  ctx.fillStyle="#222255"
	  ctx.globalAlpha=.05;
	  ctx.fillRect(0,0,c.width,c.height);	
	  var xstep=c.width*.6/50.0;
	  var ystep=pipeHeight/50.0;
	  
	
	  ctx.beginPath();	  	  
	  var p=(count%100);
	  if (p>50) p=100-p;
	  
	  ctx.moveTo(p*xstep,0);
	  ctx.lineTo(c.width*.55,p*ystep);	  
	  ctx.moveTo(c.width*.45,p*ystep);
	  ctx.lineTo(c.width-p*xstep,0);
      ctx.strokeStyle='rgb(200,200,'+200+p+')';
	  ctx.globalAlpha=.7;
	  ctx.lineWidth=3;
	  ctx.stroke();
	  
	  ctx.beginPath();
	  ctx.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*3+2,0,2*Math.PI);	  
	  ctx.stroke();
	  
	}
    	
	return c;
}

var Backdrop=makeBackdrop();</script>
    <script>

function makeAir()
{
	var fc=document.getElementById('air');
	fc.width = 100; fc.height = 100;
	var f_ctx = fc.getContext('2d');
	
	f_ctx.fillStyle="#444466"
	f_ctx.fillRect(0,0,100,100);
	
	
	fc.step=function(count) {

	  if ((count%10)==0){
	    f_ctx.globalAlpha=.1;
	    f_ctx.fillStyle="#444466"
	    f_ctx.fillRect(0,0,100,100);	
	  }
	  f_ctx.strokeStyle='rgb(128,128,'+Math.round(Math.random()*127+128)+')';
	  f_ctx.globalAlpha=1;
	  f_ctx.lineWidth=1;	  
	  var x=Math.random()*100;
	  var y=Math.random()*100;
	  f_ctx.beginPath();	
	  f_ctx.arc(x,y,Math.random()*40,Math.random()*2*Math.PI,Math.random()*2*Math.PI);	  
	  f_ctx.stroke();
	  f_ctx.beginPath();	
	  f_ctx.arc(x,y,Math.random()*40,Math.random()*2*Math.PI,Math.random()*2*Math.PI);	  
	  f_ctx.stroke();
	  f_ctx.beginPath();	
	  f_ctx.arc(x,y,Math.random()*40,Math.random()*2*Math.PI,Math.random()*2*Math.PI);	  
	  f_ctx.stroke();
	}
	fc.xflow=0;
	fc.yflow=-.8;
	fc.response_transform=[-1,0,0,0];
	fc.response_addlayer=[-1,-1,-1,-1];
	
	return fc;
}

function makeFire()
{
	var fc=document.getElementById('fire');
	fc.width = 100; fc.height = 100;
	var f_ctx = fc.getContext('2d');
	
	f_ctx.fillStyle="#FFCC55"
	f_ctx.fillRect(0,0,100,100);
	
	
	fc.step=function() {
	  f_ctx.beginPath();
	  f_ctx.moveTo(f_pos,0);
	  f_ctx.strokeStyle='rgb(255,'+Math.round(Math.random()*192+64).toString()+','+Math.round(Math.random()*64).toString()+')';
	  f_ctx.globalAlpha=Math.random()*.5+.1;
	  f_ctx.lineWidth=Math.random()*5+5;
	  
	  var r=Math.random()*50;
	  var f_pos = Math.random()*100;
      f_ctx.moveTo(f_pos,0);
	  f_ctx.quadraticCurveTo(f_pos+r,50,f_pos,100);
	  f_ctx.quadraticCurveTo(f_pos-r,50,f_pos,0);
	  f_ctx.moveTo(100-f_pos,0);
	  f_ctx.quadraticCurveTo(100-f_pos+r,50,100-f_pos,100);
	  f_ctx.quadraticCurveTo(100-f_pos-r,50,100-f_pos,0);
	  f_ctx.stroke();
	}
	fc.xflow=0;
	fc.yflow=-2.5;
	fc.response_transform=[1,1,1,7];
	fc.response_addlayer=[1,-1,5,-1];
	
	return fc;
}

function makeEarth()
{
	var fc=document.getElementById('earth');
	fc.width = 100; fc.height = 100;
	var f_ctx = fc.getContext('2d');
	
	f_ctx.fillStyle="#FFCC55"
	f_ctx.fillRect(0,0,100,100);
	
	
	fc.step=function() {
	  f_ctx.beginPath();
	  var p=Math.random()*100;
	  f_ctx.globalAlpha=Math.random()*.5+.1;
	  f_ctx.strokeStyle='rgb(128,'+Math.round(Math.random()*50+50).toString()+',0)';
	  f_ctx.lineWidth=Math.random()*15+2;
	  f_ctx.moveTo(0,p);
	  f_ctx.lineTo(100,p);
	  f_ctx.stroke();
	}
	
	fc.xflow=0;
	fc.yflow=-.5;	
	fc.response_transform=[3,7,6,3];
	fc.response_addlayer=[-1,-1,-1,3];
	return fc;
}


function makeWater()
{
	var c=document.getElementById('water');
	c.width = 100; c.height = 100;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#0000DD"
	ctx.fillRect(0,0,500,500);	
	
	c.step=function() {
	  var r=Math.random()*10+5;
	  var x=Math.random()*(100-r);
	  var y=Math.random()*(100-r);
	  ctx.fillStyle='rgb(0,0,'+Math.round(Math.random()*192+64).toString()+')';
	  ctx.globalAlpha=Math.random()*.5+.1;
	  
	  ctx.beginPath();
	  ctx.arc(x,y,r,0,2*Math.PI);
	  ctx.fill();	  
	  
	  if ((x-r)<0) {
	    ctx.beginPath();
	    ctx.arc(x+100,y,r,0,2*Math.PI);
	    ctx.fill();	  
	  }
	  
	  if ((y-r)<0) {
	    ctx.beginPath();
	    ctx.arc(x,y+100,r,0,2*Math.PI);
	    ctx.fill();	  
	  }
	  	  
	  
	}
	c.xflow=1;
	c.yflow=-.7;	
	c.response_transform=[4,-1,2,3];
	c.response_addlayer=[-1,-1,-1,2];
	return c;
}


function makeMist()
{
	var c=document.getElementById('mist');
	c.width = 100; c.height = 100;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#DDDDFF"
	ctx.fillRect(0,0,500,500);	
	
	c.step=function() {
	  var r=Math.random()*10+5;
	  var x=Math.random()*(100-r);
	  var y=Math.random()*(100-r);
	  ctx.fillStyle='rgb(192,192,'+Math.round(Math.random()*192+64).toString()+')';
	  ctx.globalAlpha=Math.random()*.5+.1;
	  
	  ctx.beginPath();
	  ctx.arc(x,y,r,0,2*Math.PI);
	  ctx.fill();	  
	  
	  if ((x-r)<0) {
	    ctx.beginPath();
	    ctx.arc(x+100,y,r,0,2*Math.PI);
	    ctx.fill();	  
	  }
	  
	  if ((y-r)<0) {
	    ctx.beginPath();
	    ctx.arc(x,y+100,r,0,2*Math.PI);
	    ctx.fill();	  
	  }
	  	  
	  
	}
	c.xflow=-4.2;
	c.yflow=-2;	
	c.response_transform=[-1,5,2,6];
	c.response_addlayer=[-1,5,-1,-1];
	return c;
}


function makeSand()
{
	var c=document.getElementById('sand');
	c.width = 100; c.height = 100;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#BBAA66"
	ctx.fillRect(0,0,100,100);	
	
	c.step=function() {
	  var r=Math.random()*2+1;
	  var x=Math.random()*(100-r);
	  var y=Math.random()*(100-r);
	  var c=Math.random();
	  if (c<.33)
	     ctx.fillStyle="#FFDD88";
	  else if (c<.66)
	     ctx.fillStyle="#BBAA66";
	  else
    	  ctx.fillStyle="#887755";
		
	  ctx.globalAlpha=Math.random()*.8+.1;
	  
	  ctx.beginPath();
	  ctx.arc(x,y,r,0,2*Math.PI);
	  ctx.fill();	  
	}
	c.xflow=0;
	c.yflow=-.75;
	
	c.response_transform=[5,6,2,6];
	c.response_addlayer=[-1,-1,-1,3];
	
	return c;
}



function makeIce()
{
	var c=document.getElementById('ice');
	c.width = 100; c.height = 100;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#AAAAFF"
	ctx.fillRect(0,0,500,500);
	
	
	c.step=function() {
	  
	  var xpos=Math.random()*100+50;
	  var ypos=Math.random()*100+50;
	  var size=Math.random()*25+12;
	  var width=Math.random()*150-75;	  
	  if (Math.random()>.5)
	    ctx.fillStyle='rgb(200,200,'+Math.round(Math.random()*55+200).toString()+')';
	  else
	    ctx.fillStyle='rgb(64,64,'+Math.round(Math.random()*55+200).toString()+')';
	  	  
	  ctx.globalAlpha=.3+Math.random()*.4;
	  ctx.beginPath();
	  ctx.moveTo(xpos,ypos-size);
	  ctx.lineTo(xpos+width,ypos);
	  ctx.lineTo(xpos,ypos+size);
	  ctx.lineTo(xpos,ypos-size);	  
	  ctx.fill();
	  
	  ctx.beginPath();
	  ctx.moveTo(xpos-100,ypos-size);
	  ctx.lineTo(xpos+width-100,ypos);
	  ctx.lineTo(xpos-100,ypos+size);
	  ctx.lineTo(xpos-100,ypos-size);
	  ctx.fill();
	  
	  ctx.beginPath();
	  ctx.moveTo(xpos,ypos-size-100);
	  ctx.lineTo(xpos+width,ypos-100);
	  ctx.lineTo(xpos,ypos+size-100);
	  ctx.lineTo(xpos,ypos-size-100);
	  ctx.fill();
	  
	  
	  ctx.beginPath();
	  ctx.moveTo(xpos-100,ypos-size-100);
	  ctx.lineTo(xpos+width-100,ypos-100);
	  ctx.lineTo(xpos-100,ypos+size-100);
	  ctx.lineTo(xpos-100,ypos-size-100);
	  ctx.fill();
	   
	}
    c.xflow=0;
	c.yflow=-.5;
		
	c.response_transform=[4,2,4,4];
	c.response_addlayer=[-1,-1,2,3];
	
	return c;
}

function makeLava()
{
	var c=document.getElementById('lava');
	c.width = 100; c.height = 100;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#330000"
	ctx.fillRect(0,0,500,500);
	var x=0,y=0;
	
	c.step=function(count) {
	  
	  if ((count%10)==0) {
	    ctx.fillStyle="#330000"
	    ctx.globalAlpha=.1;
	    ctx.fillRect(0,0,500,500);
		x=Math.random()*100;
		y=Math.random()*100;
	  }
	  
	  ctx.beginPath();
	  ctx.moveTo(x,y);
	  x+=Math.random()*5-2;
	  y+=Math.random()*10+10;
	  ctx.lineTo(x,y);
	  x+=Math.random()*30-15;
	  y+=Math.random()*5-2;
	  ctx.lineTo(x,y);	  
	  ctx.strokeStyle='rgb(255,0,0)';
	  ctx.globalAlpha=1;
	  ctx.lineWidth=1+Math.random()*3;
	  ctx.stroke();
	  if (x>100) x=0;
	  if (x<0) x=100;
	  if (y>100) y=0;
	  	  
	  
	}
    c.xflow=0;
	c.yflow=-.5;
		
	c.response_transform=[3,1,3,6];
	c.response_addlayer=[-1,-1,5,5];
	
	return c;
}

var Elements=[makeAir(),makeFire(),makeWater(),makeEarth(),makeIce(),makeMist(),makeSand(),makeLava()];
var ElDrawCount=0;
  

function drawAll()
{
  for (var i=0;i<Elements.length;i+=1) {
     Elements[i].step(ElDrawCount);
	 Elements[i].pattern=null;	 
  }
  Backdrop.step(ElDrawCount);
  ElDrawCount+=1;
  setTimeout(drawAll,100);
}

drawAll();</script>
    <script>var addElement=-1;
var addTime=0;

var Level=0;
var helpTime=-1;
var fullHelpTime=4000;
var fullMixTime=300;
var helptext=document.getElementById('helptext');
var leveltext=document.getElementById('level');
var ElGenerateList=[0,1,2,3,4,5,6,7];
var levelController;

function pingpong(start,end,time,timestamp)
{
  var pos=timestamp%(time*2);
  if (pos>time) pos=2*time-pos;
  return start+(pos/time)*(end-start);
}

function slide(start,end,time,timestamp)
{
  var pos=timestamp%time;
  return start+(pos/time)*(end-start);
}

function rainDownElement(elementIndex)
{
  if (addElement<0) {
     addElement=elementIndex;  
	 addtime=0;
  }
}

var yDieP=20;
var layerDepthP=10;
var layerSpeedP=10;
var Layers=[];
var layerStart=0;
var layerStartOrigin=0;
	
function drawMain()
{
	var c=document.getElementById('main');
	c.width = c.offsetWidth; c.height = c.offsetHeight;
	var ctx = c.getContext('2d');
	
	ctx.fillStyle="#005"
	var lastTime=0;
	var fullAddTime=300;
    layerStartOrigin=c.height*.8;
	layerStart=layerStartOrigin;
	    
	function step(timestamp) {
	  
      var yDie=c.height*yDieP/100.0;
	  var layerDepth=c.height*layerDepthP/100.0;
	  var layerSpeed=c.height*layerSpeedP/100.0;
      	  
	  var frameTime=(lastTime==0)?0:(timestamp-lastTime);
      lastTime=timestamp;	  
	  
	  var posAccRatio=layerStart/layerStartOrigin;
	  if (posAccRatio>.5) //extra fast
	     layerSpeed*=1+(posAccRatio-.5)*5;
	  
	  layerStart-=layerSpeed*frameTime/1000;
	  if (layerStart+layerDepth<0) {
	    layerStart+=layerDepth;
		Layers.splice(0,1);
	  }
	  
	  if (layerStart<0) {
	    gameOver();
	  }
	  
	  
	  //load patterns
	  for (var i=0;i<Elements.length;i+=1)
	    if (!Elements[i].pattern)
		   Elements[i].pattern=ctx.createPattern(Elements[i],'repeat');

	  //clear old contents
	  ctx.fillStyle="#005"
	  ctx.globalAlpha=frameTime/100;	  
	  ctx.drawImage(Backdrop,0,0);
	  
	  //draw the current action
	  if (addElement>=0) {
	     var ratio=(addTime+0.001)/fullAddTime;
		 var yPos=ratio*(yDie+layerStart+layerDepth*2);
		 var width=ratio*c.width*1.4;
		 var left=c.width/2-width/2;
		 var right=c.width/2+width/2;
		 var center=c.width/2;
		 
		 ctx.globalAlpha=1;
	   
		 
		 ctx.fillStyle=Elements[addElement].pattern;
		 ctx.moveTo(left,yPos);
		 ctx.quadraticCurveTo(center,0,right,yPos);
		 ctx.lineTo(right,yPos);
		 ctx.quadraticCurveTo(center,(yDie+layerStart+yPos)/2,left,yPos);		 
		 ctx.fill();
         addTime+=frameTime;
         if (ratio>1) { 
		    //change layer
			var newEl=Elements[Layers[0].El].response_transform[addElement];
			var addEl=Elements[Layers[0].El].response_addlayer[addElement];
			Layers[0].mixTime=fullMixTime;
			Layers[0].mixStart=Layers[0].El;
			Layers[0].mixEnd=newEl;
			Layers[0].El=newEl;
			
			if (addEl>=0) {
			  var lay={
			    El: addEl,
			    mixTime:fullMixTime,
                mixStart:-1,
                mixEnd:addEl			  			  
			  };
			  layerStart-=layerDepth;
			  Layers.unshift(lay);
            }			
			
		    addElement=-1;	
			addTime=0; }
	  }
	  
	  ctx.globalAlpha=1;
	  
	  
	  var yStart=yDie+layerStart;	   
	  var killtop=false;
	  for (var i=0;i<Layers.length;i+=1) {
	    ctx.save();
	    ctx.beginPath();
		var lay=Layers[i];
		var xoff=0;
		var yoff=0;
		if (lay.El>=0) {
		  xoff=(yStart+i*layerDepth)*Elements[lay.El].xflow;
		  yoff=(yStart+i*layerDepth)*Elements[lay.El].yflow;
		}
		ctx.translate(-xoff,-yoff)
	    ctx.moveTo(xoff,yoff+yStart+i*layerDepth);
		ctx.quadraticCurveTo(xoff+c.width/2,yoff+(yDie+yStart+i*layerDepth)/2,xoff+c.width,yoff+yStart+i*layerDepth);
		ctx.lineTo(xoff+c.width,yoff+yStart+i*layerDepth+layerDepth);
		ctx.lineTo(xoff,yoff+yStart+i*layerDepth+layerDepth);
		if (lay.mixTime>0) {
		  var ratio=lay.mixTime/fullMixTime;
		  ctx.globalAlpha=1;
		  if (lay.mixEnd<0) //disappearing
		    ctx.globalAlpha=ratio;
		  //draw the top layer
		  if (lay.mixStart>=0) {
		    ctx.fillStyle=Elements[lay.mixStart].pattern;
		    ctx.fill();
		  }
		  if (lay.mixEnd>=0) {
		    ctx.globalAlpha=1-ratio;
		    ctx.fillStyle=Elements[lay.mixEnd].pattern;
		    ctx.fill();
		  }
		  lay.mixTime-=frameTime;
          if ((lay.mixTime<0)&&(lay.mixEnd<0)) 
		    killtop=true;
		} else {
		  ctx.globalAlpha=1;
		  ctx.fillStyle=Elements[lay.El].pattern;
		  ctx.fill();
		}
		ctx.restore();	  
	  }
	  if (killtop)
	    { //need to destory this layer
		  layerStart+=layerDepth;
		  Layers.splice(0,1);
		  levelUp();			
	    }		  		  		  
	  
	  
	  while (Layers.length<10) {
	    var l={
		  El: ElGenerateList[Math.floor(Math.random()*ElGenerateList.length)],
		  mixTime: 0
		};
		Layers.push(l);
	  }
		
	  if (helpTime>0) {
	     helpTime-=frameTime;
		 if (helpTime<0)
		   helptext.classList.remove("showhelp");
	  }
	  
	  window.requestAnimationFrame(step);
	}	
	step(-1);
	
}


function setHelp(text)
{
   helptext.innerHTML=text;
   if (!helptext.classList.contains("showhelp"))
     helptext.classList.add("showhelp");
   helpTime=fullHelpTime;
}

function levelUp()
{
  
  Level+=1;
  levelController();
  for (var i=0;i<Elements.length;i+=1) {
     if (i<=MaxElAvail)
       Elements[i].classList.add("control");
	 else
	   Elements[i].classList.remove("control");
  }
  
  leveltext.innerHTML=Level;
  
}

function tutorial()
{
 switch (Level) {
  case 1: layerSpeedP=5; ElGenerateList=[5]; MaxElAvail=0; setHelp("Press the air button to blow away the layers of dust"); break;  
  case 2: ElGenerateList=[6];  break;  
  case 5: setHelp("Get rid of the rising layers before they get to the top."); ElGenerateList=[5,6];  break;  
  case 10: layerSpeedP=2; setHelp("Air kicks up sand to make dust - then blow away the dust."); break;
  case 11: ElGenerateList=[2,2,2,5,6]; break;
  case 15: layerSpeedP=5; ElGenerateList=[2,4,6,5]; break;
  case 16: layerSpeedP=2; MaxElAvail=1; setHelp("You get to use fire too - it works on water and ice too..."); break;
  case 25: ElGenerateList=[2,3,3,3,4,5,6,7]; break;
  case 30: MaxElAvail=2;  setHelp("New Element: Water. Can wash away earth but can cause problems"); break;
  case 40: ElGenerateList=[1,1,1,2,3,4,5,6,7]; break;
  case 45: MaxElAvail=3; setHelp("Now you have Earth. Discover its properties."); break;
  case 46: ElGenerateList=[1,2,3,4,5,6,7]; break;
  
  }
}

function maingame()
{
 switch (Level) {
  case 1: layerSpeedP=5; ElGenerateList=[2,4,5,5,5,6,6,6]; MaxElAvail=3; setHelp("Get rid of the layers before they crush you."); break;  
  case 2: layerSpeedP=2; ElGenerateList=[2,4,6,5];  break;  
  case 10: layerSpeedP=3; break;
  case 15: layerSpeedP=4; break;
  case 25: layerSpeedP=2; ElGenerateList=[2,4,6,5,3,3,7,7]; break;
  case 35: layerSpeedP=3; break;
  case 40: layerSpeedP=4; break;
  case 45: layerSpeedP=2; ElGenerateList=[1,2,3,4,5,6,7]; break;
  case 60: layerSpeedP=3; break;
  case 80: layerSpeedP=4; break;
  case 100: layerSpeedP=5; break;
  
  }
}



drawMain();

function playGame(controller)
{
  levelController=controller
  if (!document.body.classList.contains("inplay")) {
    document.body.classList.add("inplay");
  }
  Level=0;
  Layers=[];
  layerStart=layerStartOrigin
  levelUp();
  
}

function gameOver()
{
   if  (document.body.classList.contains("inplay")) {
      document.body.classList.remove("inplay");
	  document.body.classList.add("gameover");
      document.getElementById("finallevel").innerHTML=Level;
   }
}

function reset()
{
      document.body.classList.remove("gameover");
}</script>
