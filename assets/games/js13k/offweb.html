    <script>// Math -----------------------------------------

clamp = (val, min = 0, max = 1)=> {
     if (val < min) return min;
     if (val > max) return max;
     return val;
};
normalize = (val, start, end)=> {
   var length = end - start;
   var n = val - start;
   n = n / length;
   return n;
};
modulate = (val, start, end, originStart = 0, originEnd = 1)=> {
  val = normalize(val, originStart, originEnd);
  var length = end - start;
  var m = val * length + start;
  return m;
};
times = (n, cb)=> {
   Array(n).fill().forEach((_, i)=>cb(i));
};
range = (n)=> {
   return Array(n).fill().map((_, i)=>i);
};
mapN = (n, cb)=> {
   return range(n).map(cb)
};
easeIn = (t)=>  t * t * t
easeOut = (t)=> {
  var f = t - 1.0
  return f * f * f + 1.0
}
easeInOut = (t)=> {
  return t < 0.5
    ? 4.0 * t * t * t

_updateTlE = (ms)=> {
  var t = ms - tlEStartAt;

  while(trigger = tlETriggers.pop()) {
    if (trigger[0] < t) {

  tlETriggers = remainT;
  if (!remainT.length) TICKER.remove(_updateTlE);

    <script>class Ticker {
  constructor() {
    this.start = this.start.bind(this);
    this.loop = this.loop.bind(this);
    this.ticks = [];
    this.last_ms = 0;
    this.last_real_ms = 0;
    this.playing = false;
  }

  add(tick) {
    this.ticks.push(tick);
  }

  remove(tick) {
    this.ticks.remove(tick);
  }

  loop(ms) {
    if (!this.playing) return;

    ms = ms || 0;
    var dt = ms - this.last_real_ms;
    this.last_real_ms = ms;
    this.last_ms += dt;

    this.ticks.forEach((tick)=> {
      tick(this.last_ms, dt);
    });

    requestAnimationFrame(this.loop);
  }

  start() {
    this.playing = true;
    this.loop();
  }

  stop() {
    this.playing = false;
  }
}
</script>

    <script>CAMERA_OFF_X = 0;
CAMERA_OFF_Y = 0;

class Entity {
  constructor(o = {}) {
    this._animate = this._animate.bind(this);
    this.p = { x: 0, y: 0, z:0, r: 0, s: 1, o: 1, v: 1 };
    this.cacheStates();
    this.cacheAnimations();
    this.setStateI(o.s);
  }

    beginRender(ctx) {
    ctx.resetTransform();
    ctx.globalAlpha = (this.p.v) ? this.p.o : 0; // TODO
    ctx.translate(unitsToPx(this.p.x+1)+CAMERA_OFF_X, unitsToPx(this.p.y+H/W)+V_OFFSET+CAMERA_OFF_Y);
    ctx.scale(this.p.s, this.p.s);
  }

  endRender(ctx) {
    ctx.globalAlpha = 1;
    ctx.resetTransform();
  }

  states() { return {}; }
  animations() { return {}; }

  cacheStates() {
    this._states = this.states();
  }

  cacheAnimations() {
    var as = this.animations();
    this._animations = {};
    var ks = keys(as);
    var vs = values(as);
    ks.forEach((k, i)=> {
      var from = k.split('→')[0];
      var to = k.split('→')[1];
      var fromCache = this._animations[from];
      if (!fromCache) fromCache = this._animations[from] = {};
      fromCache[to] = vs[i];
    });
  }

  getState(s) {
    return this._states[s];
  }

  getAnimation(f, t) {
    var a = null;
    if (this._animations[f]) a = this._animations[f][t];
    return a;
  }

  setStateI(state) {
    var s = this.getState(state);
    extend(this.p, s);
    this._state = state;
  }

  setState(state) {
    if (state === this._state) return;
    this.setStateI(this._state);
    this._a = null;
    TICKER.remove(this._animate);
    var s = this.getState(state);
    var a = this.getAnimation(this._state, state);
    if (!a) return this.setStateI(state);
    this._state = state;
    this.animateTo(s, a);
  }

  animateTo(s, a) {
    this._a = { p: 0, d: a._d, from: this.p, to: s, e: a._e };
    TICKER.add(this._animate);
  }

  _animate(dt, ms) {
    this._a.p += 10;
    var p = this._a.p/this._a.d;
    if (p > 1) {
      TICKER.remove(this._animate);
      this._a = null;
      return;
    }
    p = clamp(p);
    var tks = keys(this._a.to);
    var tvs = values(this._a.to);
    tvs.forEach((tv, i)=> {
      var tk = tks[i];
      var fv = this._a.from[tk];
      this.p[tk] = modulate(
        (this._a.e==='out') ? easeOut(p) : easeIn(p)
        , fv, tv
      );
    });
  }
}

    <script>class Pool {
  constructor(Class, count) {
    this.entities = Array(count).fill().map(()=> new Class);
    this._count = count;
    this.reset();
  }

  reset() {
    this.p = Array(this._count).fill().map(()=> {
      return { x: 0, y: 0, r: 0, s: 0 };
    });
  }

  render(ctx, dt, ms) {
    this.entities.forEach((e, i)=> {
      var p = this.p[i];
      Object.assign(e.p, p);
      if (p && p.state) {
        e.setState(p.state);
      }
      if (p) e.render(ctx, dt, ms);
    });
  }
}

function RungeKuttaIntegrator(s) {

		if (!p.fixed) {
			originalPos = this.originalPoss[i];

		k2Force = this.k2Forces[i];
		k3Force = this.k3Forces[i];

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  var words = text.split(' ');
  var line = '';
  words.forEach((w, n)=> {
    var testLine = line + w + ' ';
    var metrics = ctx.measureText(testLine);
    var testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    }
    else line = testLine;
  });
  ctx.fillText(line, x, y);
}

var base64Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
var base64Map = base64Chars.split('');
var reverseBase64Map = {};
base64Map.forEach(function(val, key) { reverseBase64Map[val] = key} );

class GlitchPass extends Entity {
  render(ctx, dt, ms) {

        } catch (e) {}
      }

  }

  detectJpegHeaderSize(data) {
    this.jpgHeaderLength = 417;
    for (var i = 0, l = data.length; i < l; i++) {
      if (data[i] == 0xFF && data[i+1] == 0xDA) {
        this.jpgHeaderLength = i + 2; return;
      }
    }
  }

  // base64 is 2^6, byte is 2^8, every 4 base64 values create three bytes
  base64ToByteArray(str) {
    var result = [], digitNum, cur, prev;
    for (var i = 23, l = str.length; i < l; i++) {
      cur = reverseBase64Map[str.charAt(i)];
      digitNum = (i-23) % 4;
      switch(digitNum){
        //case 0: first digit - do nothing, not enough info to work with
        case 1: //second digit
          result.push(prev << 2 | cur >> 4);
          break;
        case 2: //third digit
          result.push((prev & 0x0f) << 4 | cur >> 2);
          break;
        case 3: //fourth digit
          result.push((prev & 3) << 6 | cur);
          break;
      }
      prev = cur;
    }
    return result;
  }

  byteArrayToBase64(arr) {
   var result = ['data:image/jpeg;base64,'], byteNum, cur, prev;
    for (var i = 0, l = arr.length; i < l; i++) {
      cur = arr[i];
      byteNum = i % 3;
      switch (byteNum) {
        case 0: //first byte
          result.push(base64Map[cur >> 2]);
          break;
        case 1: //second byte
          result.push(base64Map[(prev & 3) << 4 | (cur >> 4)]);
          break;
        case 2: //third byte
          result.push(base64Map[(prev & 0x0f) << 2 | (cur >> 6)]);
          result.push(base64Map[cur & 0x3f]);
          break;
      }
      prev = cur;
    }
    if (byteNum == 0) {
      result.push(base64Map[(prev & 3) << 4]);
      result.push('==');
    } else if (byteNum == 1) {
      result.push(base64Map[(prev & 0x0f) << 2]);
      result.push('=');
    }
    return result.join('');
  }

  glitchJpegBytes(strArr, seed, amount, iterationCount) {
    const headerLength = this.jpgHeaderLength;
  	const maxIndex = strArr.length - headerLength - 4;

  	const amountPercent = amount / 100;
  	const seedPercent   = seed / 100;

  	for ( var iterationIndex = 0; iterationIndex < iterationCount; iterationIndex++ ) {
  		const minPixelIndex = ( maxIndex / iterationCount * iterationIndex ) | 0;
  		const maxPixelIndex = ( maxIndex / iterationCount * ( iterationIndex + 1 ) ) | 0;

  		const delta = maxPixelIndex - minPixelIndex;
  		let pixelIndex = ( minPixelIndex + delta * seedPercent ) | 0;

  		if ( pixelIndex > maxIndex ) {
  			pixelIndex = maxIndex;
  		}

  		const indexInByteArray = ~~( headerLength + pixelIndex );

  		strArr[indexInByteArray] = ~~( amountPercent * 256 );
  	}
  }

    this.img = new Image();
    this.img.src = this.byteArrayToBase64(glitchCopy);
  }}

    <script>var vA = new Vector(), vB = new Vector(), vC = new Vector();

HOOKS = [];

t = GAME_DURATION;

// Hooks -------------------------------------

badHooksAt = [];

currentCombo = [];
lastComboHookId = null;
function createHook(o) {
  lastHookId++;
  return extend({

  },

  //   return range(4).map((i)=> {

  polygon: (startAt)=> {

    var a = nToA(rand());

      });

  weird: (startAt)=> {

      });

  },
  weirdStar: (startAt)=> {

  triangle: (startAt)=> {

        r: 0.4,

  star: (startAt)=> {

};
function resetHooks() {
  HOOKS = [];
  lastHookId = 0;
  lastBatchId = 0;
  lastComboHookId = 0;
  badHooks = range(round(HOOKS_AMOUNT/BAD_HOOKS_FRQ)).map((i)=>round(i*BAD_HOOKS_FRQ+rand()*BAD_HOOKS_FRQ/3));
  badHooks.shift();

};
function addHooksBatch() {

    keys(createHooksBatch)[round(rand()*(keys(createHooksBatch).length-2))]
  ](t+500);
  // var batch = createHooksBatch.special(t+500);
  HOOKS = HOOKS.concat(batch);
}
function addSpecialHooksBatch() {
  lastBatchId++;
  var batch = createHooksBatch.special(t+500);
  HOOKS = HOOKS.concat(batch);
}
function getVisibleHooks() {
  return HOOKS.filter((h)=> h.currentR < ARENA_RADIUS + 0.1);
}

// Cables -------------------------------------------
activeCableI = 0;
function resetCables(ctx) {
  activeCableI = 0;
  CABLES = Array(100).fill().map((___, i)=> {
    return {
      p0: {x:0, y:2},
      p1: {x:0, y:2},
      active: false,
      id0: null,
      id1: null,
      state: 'normal'
    };
  });
  // CABLES[0].active = true;
  E.cables.entities.forEach(e=>e.reset())
  E.cables.p = CABLES;
  E.cables.render(ctx, 0, 0);
};

// Update ----------------------------------------------
function updateLogic(ms) {
  t = ms - startT;
  const timeDone = t > GAME_DURATION+COUNTDOWN_DURATION;

  // countdown ----------------------------------------
  COUNTDOWN = modulate(t, 4, 1, 0, COUNTDOWN_DURATION);

  // game over ----------------------------------------
  // if (timeDone) {
  //   extend(LOG, {t:'TIME UP', startAt: t});
  // }
  if (t > GAME_DURATION+COUNTDOWN_DURATION+2000) {
    return G.setState('gameover');
  }

  // batch done  ------------------------------------
  if(getVisibleHooks().length === 0) {
    const lastBatch = HOOKS.filter((h)=> h.batchId === lastBatchId && !h.bad && !h.special);
    const lastBatchMissed = lastBatch.filter((h)=> !h.connected)
    if (!lastBatchMissed.length && t > COUNTDOWN_DURATION + 1000) {
      // extend(LOG, {t:'PERFECT', startAt: t});
      extend(LOG, {t:'P', startAt: t});
      if (last(statePerfects) !== lastBatchId) {
        statePerfects.push(lastBatchId);
      }
    }
    CABLES.filter((c)=>c.batchId === lastBatchId).forEach((c)=> {
      c.state = 'out';
    });
    if (t > COUNTDOWN_DURATION && t < GAME_DURATION+COUNTDOWN_DURATION) {
      if (nextBatchIsSpecial) {
        addSpecialHooksBatch();
        nextBatchIsSpecial = false;
      } else {
        addHooksBatch();
      }
    }
  }

  // special Hook -------------------------------------
  if (specialHookAt < t) {
    HOOKS.push(createHook({
      special: true,
      startAt: t,
      eased: false,
      d: SPECIAL_HOOK_DURATION
    }));
    specialHookAt = Infinity;
  }

  // drag active cable --------------------------------
  var CABLE = CABLES[activeCableI];
  if (CABLE.active) {
    if (T[0]) {
      E.cables.p[activeCableI].p1 = T[0];
    } else {
      E.cables.p[activeCableI].p1 = E.cables.p[activeCableI].p0;
    }
  }
  // update hook positions ----------------------------
  HOOKS.forEach((h)=> {
    var tt = modulate(t, 0, 1, h.startAt, h.startAt + h.d)
    var r = null;
    if (!h.connected) {
      if (tt < 0){
        h.active = false;
      } else {
        if (h.eased) {
          if (tt <= 1) {
            extend(h, {active: true, state: 'visible'});
            r = h.currentR = h.r*easeOut(clamp(tt));
          } else if (tt > HOOKS_PAUSE) {
            tt -= HOOKS_PAUSE;
            r = h.currentR = h.r+easeOut(clamp(tt));
          }
        } else {
            extend(h, {active: true, state: 'visible'});
            r = h.currentR = 2*easeOut(clamp(tt));
        }
      }
    } else if (h.connected && h.comboAt) {
      var delay = 100;
      tt = modulate(t, 0, 1, h.comboAt + delay, h.comboAt + h.d + delay);
      r = h.currentR = h.hitR+(2)*easeOut(clamp(tt));
    }
    if (r !== null) {
      h.x = r*sin(h.a);
      h.y = r*cos(h.a);
    }
  });
  // update cable anchors ----------------------------
  CABLES.forEach((c)=> {
    if (c.id0) {
      var {x, y} = HOOKS.find((h)=> h.id === c.id0);
      extend(c, {p0: {x, y}});
    }
    if (c.id1) {
      var {x, y} = HOOKS.find((h)=> h.id === c.id1);
      extend(c, {p1: {x, y}});
    }
  });
  // handle intersections ----------------------------
  var knockedOut = (lastBadTapAt+KNOCKOUT_DURATION >= t);
  var sinceLastIntersect = t - lastIntersect;
  if (!knockedOut && !timeDone) {
    if (T[0]) {
      var dC = vA.set(T[0]).distanceTo(vB.set(0, 0, 0));
      if (dC > 0.25 && dC < ARENA_RADIUS) {
        // find and order hooks by distance to touch
        var dH = HOOKS.map((h, i)=> {
          // index and distance
          return {
            i, d: (h.active && h.state === 'visible' && !h.connected) ? vA.set(h.x, h.y, 0).distanceSquaredTo(vB.set(T[0])) : Infinity,
          };
        }).sort((a, b)=> a.d - b.d );
      }
    }
    if (dH&&dH[0]) {
      var d = dH[0].d;
      var closestH = HOOKS[dH[0].i];
      if (d < 0.05 && closestH.state !== 'used' && closestH.state !== 'hidden') {
        if (!closestH.bad) {
          var p = {x: closestH.x, y: closestH.y, z: 0};
          extend(closestH, {
            connected: t,
            state: 'used',
            hitR: closestH.currentR,
          });
          stateConnected++;
          currentCombo.push(closestH);
          // extend(LOG, {t:'COMBO '+currentCombo.length, startAt: t});
          if (sinceLastIntersect < COMBO_DELTA) {
            extend(CABLE, {
              p1: p,
              id1: closestH.id,
              batchId: lastBatchId
            });
            activeCableI++;
          }
          CABLE = CABLES[activeCableI];
          extend(CABLE, {
            active: true,
            p0: p,
            p1: p,
            id0: closestH.id
          });
          E.cables.entities[activeCableI].reset(p);
          lastIntersect = t;
          if (closestH.special) {
            nextBatchIsSpecial = true;
            // E.mask.setState('normal');
            // E.mask.setState('special');
          }
        } else {
          extend(closestH, {
            connected: t,
            state: 'hidden',
            hitR: closestH.currentR,
            currentR: 3
          });
          // extend(LOG, {t:'!!!', startAt: t});
          knockedOut = true;
          lastBadTapAt = t;
          stateBads++;
          lastIntersect = -10000;
          CABLE.active = false;
        }
      }
    }
  }
  sinceLastIntersect = t - lastIntersect;
  if (sinceLastIntersect > COMBO_DELTA) {
    onComboDone(t, knockedOut);
  }
  if (!T[0]) {
    onComboDone(t, knockedOut);
    lastIntersect = -10000;
    CABLE.active = false;
  }

  // pointer ----------------------------------
  if (T[0]) {
    POINTER.state = 'visible';
    extend(POINTER, T[0]);
  } else {
    POINTER.state = 'hidden';
  }
};
function onComboDone(t, knockedOut) {
  if (!currentCombo.length || lastComboHookId === last(currentCombo).id) return;
  if (currentCombo.length>1 && !knockedOut)
    extend(LOG, {t:'COMBO', n: currentCombo.length, startAt: t});
  CABLES[activeCableI].active = false;
  lastComboHookId = last(currentCombo).id;
  currentCombo.forEach((h)=> h.comboAt = t);
  stateCombos.push(currentCombo.length-1);
  currentCombo = [];
};

// Points -----------------------------------
function getPoints() {
  var points = stateConnected + stateCombos.reduce((a, c)=> a+(c*c), 0);
  points -= stateBads*POINTS_BAD;
  points += statePerfects.length*POINTS_PERF;
  return clamp(points, 0, Infinity);
}

    ]);
  },

  loop: (ctx, ms, dt)=> {
    updateLogic(ms);
    PHYS.tick();

    const cameraFx = easeIn(clamp(modulate(t, 1, 0, lastBadTapAt, lastBadTapAt+1000)));
    CAMERA_OFF_X = cameraFx*15*(1+cos(floor(ms/3)*0.2))*sin(floor(ms/3)*0.842);
    CAMERA_OFF_Y = cameraFx*15*(1+sin(floor(ms/3)*0.2))*cos(floor(ms/3)*0.123);

    E.bg.render(ctx, dt, ms);

    setAllE([
      [E.radial,           { fx: (floor((cameraFx*8))%2 == 1) ? 1 : 0 }],
      [E.alert,            { v: (LOG.startAt+500>t), t: LOG.t, n: LOG.n }],
      [E.bigE,             { v: E.radial.p.fx }],
      [E.countDownCounter, { s: 1, v: (COUNTDOWN > 1), n: COUNTDOWN }],
      [E.timer,            { p: clamp((GAME_DURATION+COUNTDOWN_DURATION-t)/GAME_DURATION) }]
    ]);

    E.cables.p = CABLES.filter((c)=>c.active);
    E.cables.render(ctx, dt, ms);
    E.hooks.p = HOOKS.filter((h)=>h.active);
    E.hooks.render(ctx, dt, ms);
    E.radial.render(ctx, dt, ms);
    // E.squares.render(ctx, dt, ms);

    G.points = getPoints();
    E.pointsCounter.setNumber(getPoints());

    E.countDownCounter.render(ctx);
    E.timer.render(ctx, dt, ms);
  }
};

    });

    HOOKS.forEach((h)=> {
      if (h.bad) h.active = false;
      // if (h.special) h.active = false;
      if (!h.connected) h.active = false;
      const targetR = 0.1 + 0.6*(h.id/HOOKS.length);
      const r = h.currentR -= (h.currentR-targetR)*dt/500;
      extend(h, {
        x: r*1*sin(h.a),
        y: r*cos(h.a),
        s: 0.6
      });
    });
    CABLES.forEach((c)=> {
      if (c.id0) {
        var {x, y} = HOOKS.find((h)=> h.id === c.id0);
        extend(c, {p0: {x, y}});
      }
      if (c.id1) {
        var {x, y} = HOOKS.find((h)=> h.id === c.id1);
        extend(c, {p1: {x, y}});
      }
    });

    PHYS.tick();
