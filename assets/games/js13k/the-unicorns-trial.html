function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (!isBgmPlaying && audioCtx.state === 'running') {
    startBGM();
  }
}

function startBGM() {
  if (isBgmPlaying || !audioCtx) return;
  isBgmPlaying = true;

  bgmGainNode = audioCtx.createGain();
  bgmGainNode.gain.value = 0.08;
  bgmGainNode.connect(audioCtx.destination);

  const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
  const bassNotes = [130.81, 146.83, 164.81, 174.61];
  const noteDuration = 0.15;
  let step = 0;

  function scheduleBgmStep() {
    if (!isBgmPlaying) return;
    const now = audioCtx.currentTime;

    if (step % 2 === 0) {
      const melodyOsc = audioCtx.createOscillator();
      const melodyGain = audioCtx.createGain();
      melodyOsc.type = 'square';
      const noteIndex = (step * 3 + Math.floor(step / 8)) % notes.length;
      melodyOsc.frequency.setValueAtTime(notes[noteIndex], now);
      melodyGain.gain.setValueAtTime(0.08, now);
      melodyGain.gain.exponentialRampToValueAtTime(0.001, now + noteDuration);
      melodyOsc.connect(melodyGain);
      melodyGain.connect(bgmGainNode);
      melodyOsc.start(now);
      melodyOsc.stop(now + noteDuration);
    }

    if (step % 4 === 0) {
      const bassOsc = audioCtx.createOscillator();
      const bassGain = audioCtx.createGain();
      bassOsc.type = 'sawtooth';
      const bassIndex = Math.floor(step / 4) % bassNotes.length;
      bassOsc.frequency.setValueAtTime(bassNotes[bassIndex], now);
      bassGain.gain.setValueAtTime(0.15, now);
      bassGain.gain.exponentialRampToValueAtTime(0.01, now + (noteDuration * 2));
      bassOsc.connect(bassGain);
      bassGain.connect(bgmGainNode);
      bassOsc.start(now);
      bassOsc.stop(now + (noteDuration * 2));
    }

    step++;
    setTimeout(scheduleBgmStep, noteDuration * 1000);
  }

  scheduleBgmStep();
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'shoot') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'laser') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'repair') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'explosion') {
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(600, now);
    filter.frequency.exponentialRampToValueAtTime(40, now + 0.3);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.3);
  }
}

function drawPixelSprite(sprite, mapX, mapY, colorOverride = null, angle = 0, paletteOverride = null, scale = P) {
  ctx.save();
  ctx.translate(Math.floor(mapX), Math.floor(mapY));
  if (angle !== 0) ctx.rotate(angle);

  const startX = -sprite.pivotX * scale;
  const startY = -sprite.pivotY * scale;
  const activePalette = paletteOverride || sprite.palette;

  for (let r = 0; r < sprite.height; r++) {
    for (let c = 0; c < sprite.width; c++) {
      const key = sprite.pixels[r][c];
      if (key !== 0) {
        let color = activePalette[key];
        if (key === 'C') color = colorOverride || activePalette['C'];

        ctx.fillStyle = color;
        ctx.fillRect(startX + c * scale, startY + r * scale, scale, scale);
      }
    }
  }
  ctx.restore();
}

function generateCloudSprite() {
  const w = 12 + Math.floor(Math.random() * 12);
  const h = 6 + Math.floor(Math.random() * 6);
  const pixels = Array.from({ length: h }, () => Array(w).fill(0));

  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const dx = (c - w / 2) / (w / 2);
      const dy = (r - h / 2) / (h / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.85 + Math.random() * 0.25) {
        pixels[r][c] = 1;
      }
    }
  }
  return { width: w, height: h, pixels };
}

function drawBackground() {
  let skyColor1 = '#0f172a';
  let skyColor2 = '#1e293b';

  if (score > 2500) {
    skyColor1 = '#020617'; skyColor2 = '#090d16';
  } else if (score > 1000) {
    skyColor1 = '#090d16'; skyColor2 = '#1e1b4b';
  }

  const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
  bgGrad.addColorStop(0, skyColor1);
  bgGrad.addColorStop(1, skyColor2);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, width, height);

  if (score > 1500) {
    ctx.fillStyle = '#ffffff';
    stars.forEach(s => {
      s.y += s.speed * 0.05;
      if (s.y > 1) s.y = 0;
      ctx.fillRect(Math.floor(s.x * width), Math.floor(s.y * height), s.size, s.size);
    });
  }

  const rainbowWidth = Math.min(width * 0.45, 280);
  const rx = Math.floor((width - rainbowWidth) / 2);

  const grad = ctx.createLinearGradient(rx, 0, rx + rainbowWidth, 0);
  grad.addColorStop(0.0, 'rgba(239, 68, 68, 0.45)');
  grad.addColorStop(0.2, 'rgba(249, 115, 22, 0.45)');
  grad.addColorStop(0.4, 'rgba(234, 179, 8, 0.45)');
  grad.addColorStop(0.6, 'rgba(34, 197, 94, 0.45)');
  grad.addColorStop(0.8, 'rgba(59, 130, 246, 0.45)');
  grad.addColorStop(1.0, 'rgba(168, 85, 247, 0.45)');

  ctx.fillStyle = grad;
  ctx.fillRect(rx, 0, rainbowWidth, height);

  if (!gameOver) {
    if (Math.random() < 0.003) spawnRainbowBreak();

    for (let i = rainbowBreaks.length - 1; i >= 0; i--) {
      const rb = rainbowBreaks[i];
      rb.y += 1.5;

      ctx.fillStyle = skyColor1;
      ctx.fillRect(rx, Math.floor(rb.y), rainbowWidth, rb.height);

      if (
        unicorn.x >= rx && unicorn.x <= rx + rainbowWidth &&
        unicorn.y >= rb.y && unicorn.y <= rb.y + rb.height
      ) {
        playSound('repair');
        unicorn.dashCooldown = Math.max(0, unicorn.dashCooldown - 10);
        score += 10;

        for (let k = 0; k < 6; k++) {
          particles.push({
            x: unicorn.x + (Math.random() - 0.5) * 40,
            y: unicorn.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
            size: 2,
            color: ['#ef4444', '#f59e0b', '#38bdf8', '#c084fc'][Math.floor(Math.random() * 4)],
            life: 20
          });
        }

        rb.height -= 4;
        if (rb.height <= 0) {
          rainbowBreaks.splice(i, 1);
          lives++; // 虹の隙間を埋め切ったのでハート（ライフ）+1
          continue;
        }
      }

      if (rb.y > height + 100) rainbowBreaks.splice(i, 1);
    }
  }

  return { left: rx, right: rx + rainbowWidth };
}

function updateAndDrawClouds() {
  ctx.fillStyle = score > 2000 ? '#334155' : '#64748b';
  for (let i = 0; i < clouds.length; i++) {
    const cloud = clouds[i];
    cloud.y += cloud.speed;

    if (cloud.y > height + 60) {
      clouds[i] = spawnCloud(-60);
      continue;
    }

    const cx = Math.floor(cloud.x);
    const cy = Math.floor(cloud.y);
    const sp = cloud.sprite;

    for (let r = 0; r < sp.height; r++) {
      for (let c = 0; c < sp.width; c++) {
        if (sp.pixels[r][c] === 1) {
          ctx.fillRect(cx + c * P, cy + r * P, P, P);
        }
      }
    }
  }
}

function updateAndDrawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), P * p.size, P * p.size);
  }
}

// ボスの出現条件チェック
function checkBossSpawn() {
  if (!boss && score >= nextBossScore && !gameOver) {
    const hpVal = bossBaseHp;
    boss = {
      x: Math.random() * (width - 100) + 50,
      y: height + 60,
      type: 'boss',
      color: '#64748b', // 灰色
      hp: hpVal,
      maxHp: hpVal,
      canDodge: true,
      dodgeCooldown: 0,
      speed: 2.8,
      turnRate: 0.04,
      angle: -Math.PI / 2,
      shootTimer: 0,
      shootInterval: 30,
      fuel: Infinity, // 燃料切れがない
      isCrashing: false,
      isBoss: true
    };
    planes.push(boss);
    nextBossScore += 1500;
    bossBaseHp++; // 次回登場するボスのHPを+1
  }
}

function spawnPlane() {
  const availableTypes = PLANE_TYPES.filter(t => score >= t.minAlt);
  const totalWeight = availableTypes.reduce((sum, t) => sum + t.weight, 0);
  let rnd = Math.random() * totalWeight;

  let selected = availableTypes[0];
  for (const t of availableTypes) {
    if (rnd < t.weight) {
      selected = t;
      break;
    }
    rnd -= t.weight;
  }

  planes.push({
    x: Math.random() * (width - 100) + 50,
    y: height + 60,
    type: selected.type,
    color: selected.color,
    hp: selected.hp,
    maxHp: selected.hp,
    canDodge: selected.canDodge,
    dodgeCooldown: 0,
    speed: selected.speed,
    turnRate: selected.turnRate,
    angle: -Math.PI / 2,
    shootTimer: 0,
    shootInterval: selected.type === 'green' ? 25 : (selected.type === 'blue' || selected.type === 'purple' ? 70 : 45),
    fuel: 260 + Math.floor(Math.random() * 100),
    isCrashing: false,
    isBoss: false
  });
}

function updateAndDrawPlanes() {
  checkBossSpawn();

  if (!gameOver) {
    const maxPlanes = Math.min(12, 3 + Math.floor(score / 500));
    const spawnRate = Math.max(15, 60 - Math.floor(score / 200));
    if (frameCount % spawnRate === 0 && planes.length < maxPlanes) spawnPlane();
  }

  for (let i = planes.length - 1; i >= 0; i--) {
    const p = planes[i];

    if (!gameOver && !p.isBoss) {
      p.fuel--;
      if (p.fuel <= 0 && !p.isCrashing) p.isCrashing = true;
    }

    if (p.isCrashing) {
      p.y += 3.5;
      p.angle += 0.1;
      if (frameCount % 3 === 0) {
        particles.push({
          x: p.x + (Math.random() - 0.5) * 10,
          y: p.y,
          vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
          size: 1.5, color: '#475569', life: 15
        });
      }
      if (p.y > height + 60) {
        if (p.isBoss) boss = null;
        planes.splice(i, 1);
        continue;
      }
    } else if (!gameOver) {
      const targetAngle = Math.atan2(unicorn.y - p.y, unicorn.x - p.x);
      let diff = targetAngle - p.angle;

      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;

      if (Math.abs(diff) < p.turnRate) {
        p.angle = targetAngle;
      } else {
        p.angle += Math.sign(diff) * p.turnRate;
      }

      p.x += Math.cos(p.angle) * p.speed;
      p.y += Math.sin(p.angle) * p.speed;

      if (p.canDodge && unicorn.isDashing && p.dodgeCooldown <= 0) {
        if (Math.hypot(p.x - unicorn.x, p.y - unicorn.y) < 150) {
          if (Math.random() < 0.2) { // 20%の確率で回避成功
            p.x += (p.x > unicorn.x ? 60 : -60);
          }
          // 回避の成否にかかわらずクールダウンを設定し、連打による連続判定を防止
          p.dodgeCooldown = 60;
        }
      }
      if (p.dodgeCooldown > 0) p.dodgeCooldown--;
      p.shootTimer++;
      if (p.shootTimer % p.shootInterval === 0) {
        const noseX = p.x + Math.cos(p.angle) * (p.isBoss ? 22 : 15);
        const noseY = p.y + Math.sin(p.angle) * (p.isBoss ? 22 : 15);
        const shootAngle = p.angle;

        if (p.isBoss) {
          // ボスは灰色の弾（#94a3b8）を発射
          [-0.25, 0, 0.25].forEach(offset => {
            bullets.push({
              x: noseX, y: noseY,
              vx: Math.cos(shootAngle + offset) * 5, vy: Math.sin(shootAngle + offset) * 5,
              type: 'normal', color: '#94a3b8'
            });
          });
          playSound('shoot');
        } else if (p.type === 'green') {
          [-0.25, 0, 0.25].forEach(offset => {
            bullets.push({
              x: noseX, y: noseY,
              vx: Math.cos(shootAngle + offset) * 5, vy: Math.sin(shootAngle + offset) * 5,
              type: 'normal', color: '#22c55e'
            });
          });
          playSound('shoot');
        } else if (p.type === 'blue') {
          bullets.push({
            x: noseX, y: noseY,
            vx: Math.cos(shootAngle) * 8, vy: Math.sin(shootAngle) * 8,
            type: 'laser', color: '#3b82f6'
          });
          playSound('laser');
        } else if (p.type === 'purple') {
          [-0.3, 0, 0.3].forEach(offset => {
            bullets.push({
              x: noseX, y: noseY,
              vx: Math.cos(shootAngle + offset) * 3.5, vy: Math.sin(shootAngle + offset) * 3.5,
              type: 'homing', color: '#a855f7', life: 180
            });
          });
          playSound('shoot');
        } else {
          bullets.push({
            x: noseX, y: noseY,
            vx: Math.cos(shootAngle) * 5, vy: Math.sin(shootAngle) * 5,
            type: 'normal', color: '#f8fafc'
          });
          playSound('shoot');
        }
      }

      if (!p.isBoss && (p.y < -80 || p.y > height + 80 || p.x < -80 || p.x > width + 80)) {
        planes.splice(i, 1);
        continue;
      }
    }

    const hitRadius = p.isBoss ? 50 : 35;
    if (!gameOver && unicorn.isDashing && Math.hypot(p.x - unicorn.x, p.y - unicorn.y) < hitRadius) {
      p.hp--;
      if (p.hp <= 0) {
        unicorn.chainCount++;
        unicorn.dashCooldown = 0;
        unicorn.dashTimer = 20;

        for (let k = 0; k < (p.isBoss ? 35 : 15); k++) {
          particles.push({
            x: p.x, y: p.y,
            vx: (Math.random() - 0.5) * (8 + unicorn.chainCount),
            vy: (Math.random() - 0.5) * (8 + unicorn.chainCount),
            size: 2 + Math.min(unicorn.chainCount, 3),
            color: p.color,
            life: 30
          });
        }
        playSound('explosion');
        triggerShake(p.isBoss ? 15 : 4 + unicorn.chainCount * 2, 12);

        lives += p.isBoss ? 3 : p.maxHp;
        if (p.isBoss) boss = null;

        planes.splice(i, 1);
        continue;
      } else {
        unicorn.isDashing = false;
        triggerShake(3, 8);
      }
    }

    // ボスの場合はスケールを1.5倍（P * 1.5）にして描画
    const spriteScale = p.isBoss ? P * 1.5 : P;
    drawPixelSprite(SPRITE_PLANE, p.x, p.y, p.color, p.angle + Math.PI / 2, null, spriteScale);
  }
}

function updateAndDrawBullets() {
  const targetX = unicorn.x;
  const targetY = unicorn.y - 15;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    if (!gameOver) {
      if (b.type === 'homing') {
        b.life--;
        if (b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }
        const angle = Math.atan2(targetY - b.y, targetX - b.x);
        b.vx += Math.cos(angle) * 0.12;
        b.vy += Math.sin(angle) * 0.12;
        const speed = Math.hypot(b.vx, b.vy);
        if (speed > 4.5) {
          b.vx = (b.vx / speed) * 4.5;
          b.vy = (b.vy / speed) * 4.5;
        }
      }

      b.x += b.vx;
      b.y += b.vy;

      if (b.x < -10 || b.x > width + 10 || b.y < -10 || b.y > height + 10) {
        bullets.splice(i, 1);
        continue;
      }
    }

    ctx.fillStyle = b.color;
    const bSize = b.type === 'laser' ? 3 * P : 2 * P;
    ctx.fillRect(Math.floor(b.x - bSize / 2), Math.floor(b.y - bSize / 2), bSize, bSize);

    if (!gameOver && !unicorn.isDashing && unicorn.invincibleTimer <= 0) {
      if (Math.hypot(b.x - targetX, b.y - targetY) < 14) {
        lives--;
        bullets.splice(i, 1);
        playSound('explosion');
        triggerShake(8, 15);

        if (lives <= 0) {
          lives = 0;
          gameOver = true;
        } else {
          unicorn.invincibleTimer = 60;
        }
      }
    }
  }
}

function updateAndDrawUnicorn(rainbowBounds) {
  const isOnRainbow = (unicorn.x >= rainbowBounds.left && unicorn.x <= rainbowBounds.right);
  const followSpeed = isOnRainbow ? 0.18 : 0.08;

  if (!gameOver) {
    if (unicorn.isDashing) {
      unicorn.dashTimer--;
      unicorn.y -= 14;
      if (unicorn.dashTimer <= 0) {
        unicorn.isDashing = false;
        unicorn.chainCount = 0;
      }
    } else {
      unicorn.x += (mouse.x - unicorn.x) * followSpeed;
      unicorn.y += (mouse.y - unicorn.y) * followSpeed;
    }

    if (unicorn.dashCooldown > 0) unicorn.dashCooldown--;
    if (unicorn.invincibleTimer > 0) unicorn.invincibleTimer--;
  }

  if (unicorn.invincibleTimer > 0 && Math.floor(unicorn.invincibleTimer / 4) % 2 === 0) {
    return;
  }

  const animSpeed = unicorn.isDashing ? 6 : 12;
  const frameIdx = Math.floor(frameCount / animSpeed) % SPRITES_RUN.length;
  const currentSprite = SPRITES_RUN[frameIdx];

  drawPixelSprite(currentSprite, unicorn.x, unicorn.y, null, 0, PALETTE_UNICORN);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fillRect(0, 0, width, height);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 36px monospace';
  ctx.fillText("The Unicorn's Trial", width / 2, height / 2 - 30);

  ctx.fillStyle = '#facc15';
  ctx.font = '18px monospace';
  ctx.fillText('CLICK / TAP TO START', width / 2, height / 2 + 30);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '12px monospace';
  ctx.fillText('CONTROLS: MOVE MOUSE / [X] KEY OR 2-FINGER TAP TO DASH', width / 2, height / 2 + 70);
  ctx.textAlign = 'left';
}

function drawUI() {
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 16px monospace';

  ctx.fillText(`ALTITUDE: ${score}m`, 20, 35);

  let heartStr = '';
  for (let i = 0; i < lives; i++) heartStr += '♥ ';
  ctx.fillStyle = '#f43f5e';
  ctx.fillText(`LIVES: ${heartStr}`, 20, 60);

  ctx.fillStyle = unicorn.dashCooldown <= 0 ? '#facc15' : '#64748b';
  ctx.font = '12px monospace';
  ctx.fillText(unicorn.dashCooldown <= 0 ? '[X] / 2-FINGER TAP DASH READY' : 'DASH CHARGING...', 20, 85);

  if (boss && !gameOver) {
    const barW = 200;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
    ctx.fillRect(width / 2 - barW / 2, 20, barW, 10);
    ctx.fillStyle = '#64748b';
    ctx.fillRect(width / 2 - barW / 2, 20, (boss.hp / boss.maxHp) * barW, 10);
  }

  if (unicorn.chainCount > 1) {
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${unicorn.chainCount} CHAIN DASH!`, width / 2, 50);
    ctx.textAlign = 'left';
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', width / 2, height / 2 - 20);

    ctx.fillStyle = '#f8fafc';
    ctx.font = '16px monospace';
    ctx.fillText(`ALTITUDE: ${score}m`, width / 2, height / 2 + 20);
    ctx.fillText('CLICK / TAP TO RETRY', width / 2, height / 2 + 60);
    ctx.textAlign = 'left';
  }
}

function gameLoop() {
  ctx.save();

  if (shakeTimer > 0) {
    const rx = (Math.random() - 0.5) * shakeIntensity;
    const ry = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(rx, ry);
    shakeTimer--;
  }

  const rainbowBounds = drawBackground();
  updateAndDrawClouds();

  if (isTitle) {
    drawTitle();
  } else {
    if (!gameOver) {
      frameCount++;
      score = Math.floor(frameCount / 3);
    }

    updateAndDrawUnicorn(rainbowBounds);
    updateAndDrawPlanes();
    updateAndDrawBullets();
    updateAndDrawParticles();

    drawUI();
  }

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

resize();
gameLoop();</script>
