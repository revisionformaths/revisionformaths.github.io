			kak.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAAgAgMAAABiEsBiAAAADFBMVEVlLWc7dAhDhwT///9JbNtQAAAAAXRSTlMAQObYZgAAAAlwSFlzAAALEwAACxMBAJqcGAAAAH5JREFUCNdFjrENhEAMBDc9+iBwCdCHHYCujY8vvS5IPjgkCiCjCjog+BI+e6+RHgej1WhlGxhX+CQrf4qFmZiHmVkmPP58moMdQFfppdJII7/txcrtm3UFoiYFSa0uGDfdvdRrdb7tZgq2BfhodkpWmrxGk7dis5M/XMHe+QP+jSoBD83ToQAAAABJRU5ErkJggg==";

			var fe = new Image(24,14);
			fe.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADQAAAAgBAMAAACvEUZVAAAAGFBMVEVhcABXIwF0KgH/OQhVaVX/YAj/Zgj/rQBm48koAAAAAXRSTlMAQObYZgAAAAlwSFlzAAALEwAACxMBAJqcGAAAAJZJREFUKM+NkIENxCAIRVnBFboCK3SFv0JXYP0DhIvctViTJrw+84wS2QJAuda5VZAv6yBgfqHMSDj7b3KrtMHK09kMZP9ZIZQnbRa2/l4xX5hF38UBjfIbmvazF+gVkgQo0KpseDHfictZ/yqLsXGFvfLOD3TKHuc8I1GhUyQDY4w76JSOh3430CiDI7FAr0iJJhZ4VB9TkJpVS9uBFwAAAABJRU5ErkJggg==";

			var punkteTimer = 50;

			var punkte = 0;

			
		var version = '0.0.1';
		var space = false;
		var laufTimer = 10;
		var ch_bild = 0;
		var laufAnimation = [0,1,0,2];
		var spiellaeuft = false;	
		var geschwindigkeit = 1;

		
		function init() {
			main_canvas = document.getElementById('main_canvas');
			main_ctx = main_canvas.getContext('2d');

				document.addEventListener("keydown" ,key_down,false);
				document.addEventListener("keyup" ,key_up,false);

				main_ctx.font="18px Verdana";
				main_ctx.fillText("Press space to begin",55,100);
			
		}
		init();	

		//Chicken
		var ch_y = 0;
		var ch_lebt = true;
		var ch_brennt = false;
		var y_speed = 0;
		//Wasser
		var wa_x = 0;
		//Sand
		var s_x = 0;
		//Wolken
		var w_x = 0;
		//Boot
		var b_x = 0;
		var b1_x = 0;
		var b2_x = 0;		
		//Kaktus
		var kak_x = 320;
		//Feuer
		var feu_bild = 0;
		var fe_x = 450;


		function restart(){
			//Chicken
			ch_y = 0;
			ch_lebt = true;
			ch_brennt = false;
			y_speed = 0;
			//Wasser
			wa_x = 0;
			//Sand
			s_x = 0;
			//Wolken
			w_x = 0;
			//Boot
			b_x = 0;
			b1_x = 0;
			b2_x = 0;		
			//Kaktus
			kak_x = 320;
			

			fe_x = 450;

			geschwindigkeit = 1;

			punkteTimer = 50;

			punkte = 0;
		}

		function zeichnen(){
			var bild = laufAnimation[ch_bild];
			main_ctx.drawImage(w,0+w_x,0,320,105);
			main_ctx.drawImage(w,320+w_x,0,320,105);
			main_ctx.drawImage(wa, 0+wa_x,105,320,103);
			main_ctx.drawImage(wa, 320+wa_x,105,320,103);
			main_ctx.drawImage(s,0+s_x,208,320,33);
			main_ctx.drawImage(s,320+s_x,208,320,33);
			main_ctx.drawImage(bo,160+b1_x,130,22,15);
			main_ctx.drawImage(bo,50+b_x,130,42,35);
			main_ctx.drawImage(bo,370+b2_x,150,32,25);
			main_ctx.drawImage(kak,kak_x,198 ,25,35);
			if(!ch_brennt){
				
				if (ch_y >= 2){
					main_ctx.drawImage(ch,48,0,16,28,50,205-ch_y,16,28);
				}else{
					main_ctx.drawImage(ch,0+16*bild,0,16,28,50,205-ch_y,16,28);
				}
			}
			else{
				main_ctx.drawImage(ch,64,0,16,28,50,205-ch_y,16,28);
			}
			main_ctx.drawImage(fe,0+26*feu_bild,0,26,32,fe_x,203,26,32);
			main_ctx.font="18px Verdana";
			main_ctx.fillText("Points: "+punkte,10,50);
			if(!ch_lebt){
			main_ctx.font="18px Verdana";
			main_ctx.fillText("Press c to begin again",55,100);
			}

			laufTimer--;
			if (laufTimer <= 0){
				ch_bild++;
				feu_bild++;
					if (feu_bild >= 2){
						feu_bild = 0;
					}
				laufTimer = 20;
				
				if (ch_bild >3) {
					ch_bild = 0;
				}	

			}

			
			if (ch_y > 0){
				ch_y+=y_speed;
				y_speed-= 0.1;

			}

			if (ch_y < 0){
				ch_y = 0;
				y_speed = 0;
			}

			geschwindigkeit += 0.00025;

			if(geschwindigkeit >= 5 )
				geschwindigkeit = 5;

			if (ch_lebt){
				wa_x -= 0.3*geschwindigkeit;
				s_x -= 1.4*geschwindigkeit;
				w_x -= 0.3*geschwindigkeit;
				b_x -= 0.2*geschwindigkeit;
				b1_x -= 0.2*geschwindigkeit;			
				b2_x -= 0.3*geschwindigkeit;
				kak_x -= 1.4*geschwindigkeit;	
				fe_x -= 1.4*geschwindigkeit;

				punkteTimer-=geschwindigkeit;
				if (punkteTimer <= 0){
					punkteTimer = 50;
					punkte++;
					console.log(punkte);
				}

			}					
			
			if (wa_x <= -320){
				wa_x += 320;
			}

			if (s_x <= -320){
				s_x +=  320;
			}

			if (w_x <= -320){
				w_x += 320;
			}

			if (b_x <= -92){
				b_x += 320+Math.random()*320;
			}

			if (b1_x <= -204){
				b1_x += 320+Math.random()*320;
			}

			if (b2_x <= -412){
				b2_x += 412+Math.random()*320;
			}

			if (kak_x <= -30){
				kak_x += 320 + Math.random()*640;        
			} 

			if (ch_lebt && kak_x <= 50+15 && kak_x >= 50-24 && ch_y <= 32){
				console.log("Autsch ☻");
				ch_lebt = false;
				y_speed = 3.5;
				ch_y++;
			}

			if (fe_x <= -16){
				fe_x += 340 + Math.random()*10000;
			}

			if (ch_lebt && fe_x <= 50+14 && fe_x >= 50-28 && ch_y <= 30){
				console.log("Autsch ☻");
				ch_lebt = false;
				ch_brennt = true;
				y_speed = 3.5;
				ch_y++;
			}

		}

		

		
		function key_down(e){
				
			var key_id = e.keyCode || e.which;
								
				if (key_id == 32 && !space && ch_lebt ){
					space = true;
					e.preventDefault();
					if (ch_y <= 20){
						y_speed = 3.5;
						ch_y = 1;
						document.getElementById("audio_bok").play();

					}


					if (spiellaeuft == false){	
						window.setInterval(zeichnen,10);
						spiellaeuft = true;
					}
				}

				if(key_id == 67 && !ch_lebt){
					restart();
				}
			
			}

		


		function key_up(e){
				var key_id = e.keyCode || e.which;
								
				if (key_id == 32){
					space = false;
					e.preventDefault();
				}


			}


		
		</script>
