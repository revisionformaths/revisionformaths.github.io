</script><script>(()=>{const P=PB,B=P.B={};
B.new=(id,sid,level,seed)=>{P.W.keys={};P.scene='battle';B.encId=id;B.boss=id<0;B.final=B.boss&&sid===1&&level>P.cap;P.data.party.forEach(c=>{c.cd=[0,0,0,0];c.shield=0});B.active=0;B.entry=180;B.enemy=P.make(sid,level,0,0,seed);B.enemy.discord=B.enemy.discordMax=B.boss?30:20;if(B.boss){B.enemy.hp=B.enemy.hpMax+=B.final?26:12;B.enemy.pwr+=B.final?4:2}B.mode='menu';B.turn=0;B.hornReady=1;B.log=[`${B.final?'PRISM WARDEN':B.boss?'GUARDIAN '+P.spec[sid][0]:'WILD '+P.spec[sid][0]} APPEARS!`];B.pending=null;B.progress=[];B.bonus=0;B.win=B.captured=0;B.harmX=0;B.harmDir=1;B.evoT=0;B.seq=[];B.fx=0};

</script><script>(()=>{const P=PB;let raw='';try{raw=localStorage.getItem(P.saveKey)||''}catch(e){}P.saved=!!raw;try{P.mute=+localStorage.getItem('pbmute')||0}catch(e){}P.toggleMute=()=>{P.mute^=1;try{localStorage.setItem('pbmute',P.mute)}catch(e){}};P.data=P.load();P.menuGame=0;P.menu=P.saved?0:1;P.confirm=0;P.scene='menu';P.goMenu=g=>{P.menuGame=!!g;P.menu=g?0:P.saved?0:1;P.confirm=0;P.W.keys={};P.scene='menu'};P.newGame=()=>{P.reset();P.saved=1;P.guideMenu=0;P.data=P.initial();P.W.start();P.save(P.data)};P.continue=()=>{P.menuGame=0;P.W.start()};let last=performance.now(),save=0;function loop(t){let dt=Math.min(50,t-last);last=t;if(P.scene==='world'){P.W.tick(dt);if((save+=dt)>1800){save=0;P.save(P.data);P.saved=1}}else if(P.scene==='battle')P.B.tick(dt);P.R.draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);P.canvas.focus()})();</script></body></html>
