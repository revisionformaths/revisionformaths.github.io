#level {

.meat {

display: none;
position: absolute;

margin-left: -6em;

font-size: 25%;
font-weight: bold;
color: red;
transform: rotate(30deg);
}

from {
	opacity: 0;
	transform: scale(1.5) rotate(3deg);
}
50% {
	transform: scale(0.8) rotate(3deg);
}
75% {
	transform: scale(1.05) rotate(3deg);
}
87% {
	transform: scale(0.95) rotate(3deg);
}
94% {
	transform: scale(1.025) rotate(3deg);
}

	transform: scale(0.975) rotate(3deg);

</style><script>let Perlin={};
Perlin.g=[
[0.70,-0.70,0],
[0.70,0,-0.70],
[0,0.70,-0.70],
[-0.70,0.70,0],
[-0.70,0,0.70],
[0,-0.70,0.70],
];
Perlin.eg=[
[0.81,-0.40,-0.40],
[0.40,0.40,-0.81],
[-0.40,0.81,-0.40],
[-0.81,0.40,0.40],
[-0.40,-0.40,0.81],
[0.40,-0.81,0.40],
];
Perlin.g=Perlin.g.concat(Perlin.eg);
Perlin.generateGradient=function() {
let index=Math.floor(Perlin.g.length*Math.random());
return Perlin.g[index];
}
Perlin.calculate=function(cell,meshSize) {
let onMesh=function(cell) {
let [x,y,z]=cell.coords;
if((Math.abs(x)%meshSize===0)&&(Math.abs(y)%meshSize===0)&&(Math.abs(z)%meshSize===0)) {
return true;
} else {
return false;
}
}
let diff=function(point1,point2) {
return point2.map((x,i)=>x-point1[i]);
}
let norm=function(vec) {
return Math.sqrt(vec.reduce((sum,x)=>sum+x*x,0));
}
let normalize=function(vec) {
let n=norm(vec);
return (n > 0)?vec.map((x)=>x/n):vec;
}
let dotproduct=function(vec1,vec2) {
return vec1.map((x,i)=>x*vec2[i]).reduce((sum,x)=>sum+x,0);
}
let corners=[];
for(let c of cell.onDisk(meshSize)) {
if(onMesh(c)) {
corners.push(c);
}
if(corners.length>=3) {
break;
}
};
let delta=corners.map((corner)=>normalize(diff(corner.coords,cell.coords)));
let elevations=corners.map((corner,i)=>dotproduct(corner.gradient,delta[i]));
elevations=elevations.map((elevation)=>6*Math.pow(elevation,5)-15*Math.pow(elevation,4)+10*Math.pow(elevation,3));
let w=corners.map((corner)=>meshSize-cell.distanceCells(corner));
return elevations.reduce((sum,x,i)=>sum+x*w[i],0)/meshSize;
}
</script><script>let Cell=function(args) {
let coords=[];
let neighbors={};
let type='water';
let gradient=Perlin.generateGradient();
let elevation=0;
let visited=false;
if(args) {
coords=args.coords;
Object.assign(neighbors,args.neighbors);
type=args.type||'water';
}
let offsetDirectionFunction=function(offset) {
return function(direction) {
let index=Cell.DIRECTIONS.findIndex((e)=>e===direction);
if(index!==-1) {
return Cell.DIRECTIONS[(index+offset)%6];
} else {
throw new Error(`reverseDirection: '${direction}' is not a valid direction.`)
}
};
}
let reverseDirection=offsetDirectionFunction(3);
let nextDirection=offsetDirectionFunction(1);
let previousDirection=offsetDirectionFunction(5);
let distance=function(cell) {
let s=this.pxlc();
let d=cell.pxlc();
let dx=s[0]-d[0];
let dy=s[1]-d[1];
return Math.sqrt(
dx*dx+dy*dy
);
};
let distanceCells=function(cell) {
return Math.max(
Math.abs(cell.coords[0]-this.coords[0]),
Math.abs(cell.coords[1]-this.coords[1]),
Math.abs(cell.coords[2]-this.coords[2])
);
};
let onCircle=function(radius) {
let circleCells=[];
let cell=this;
if(radius===0) {
return [cell];
}
for(let i=0; i < radius; i++) {
cell=cell.neighbors.southwest;
}
for(let direction of Cell.DIRECTIONS) {
for(let i=0; i < radius; i++) {
circleCells.push(cell);
cell=cell.neighbors[direction];
}
}
return circleCells;
};
let onDisk=function(radius) {
let cell=this;
let diskCells=[];
for(let i=0; i<=radius; i++) {
this.onCircle(i).forEach((c)=>diskCells.push(c));
}
return diskCells;
};
let neighborCoords=function(direction) {
if(direction==='east') {
return [coords[0]+1,coords[1]-1,coords[2]];
} else if(direction==='northeast') {
return [coords[0]+1,coords[1],coords[2]-1];
} else if(direction==='northwest') {
return [coords[0],coords[1]+1,coords[2]-1];
} else if(direction==='west') {
return [coords[0]-1,coords[1]+1,coords[2]];
} else if(direction==='southwest') {
return [coords[0]-1,coords[1],coords[2]+1];
} else if(direction==='southeast') {
return [coords[0],coords[1]-1,coords[2]+1];
}
};
let cnghb=function() {
for(let direction of Cell.DIRECTIONS) {
if(neighbors[direction]===undefined) {
neighbors[direction]=Cell({
coords: neighborCoords(direction)
});
}
}
for(let direction of Cell.DIRECTIONS) {
let reverse=reverseDirection(direction);
neighbors[direction].neighbors[reverse]=this;
let next=nextDirection(direction);
neighbors[direction].neighbors[previousDirection(reverse)]=neighbors[next];
let previous=previousDirection(direction);
neighbors[direction].neighbors[nextDirection(reverse)]=neighbors[previous];
}
};
let pxlc=function() {
let x=this.coords[0]+this.coords[2]/2;
let y=Math.sqrt(3)*this.coords[2]/2;
return [x,y];
};
let reveal=function(meshSize) {
this.elevation=Perlin.calculate(this,meshSize);
}
return {
coords,
neighbors,
type,
gradient,
elevation,
visited,
reverseDirection,
nextDirection,
previousDirection,
distance,
distanceCells,
onCircle,
onDisk,
cnghb,
pxlc,
reveal
};
};
Cell.DIRECTIONS=['east','northeast','northwest','west','southwest','southeast'];
</script><script>let Atlas=function(args) {
let size=1;
let meshSize=2;
let islandThreshold=0.8;
let continentRadius=100;
let center=Cell({
coords: [0,0,0]
});
let cursor=center;
let path=[];
if(args) {
size=args.size||size;
meshSize=args.meshSize||meshSize;
islandThreshold=args.islandThreshold||islandThreshold;
continentRadius=args.continentRadius||continentRadius;
}
let reveal=function() {
this.onDisk(this.size).forEach((cell)=>{
cell.reveal(this.meshSize);
let distance=cell.distanceCells(new Cell({
coords: [0,0,0]
}));
let sigma=(Math.exp(1-this.islandThreshold)-1)/this.continentRadius;
let threshold=Math.log(sigma*distance+1)+this.islandThreshold;
if(cell.elevation > threshold) {
cell.type='island';
}
if(distance===this.continentRadius) {
cell.type='continent';
}
});
};
let generateAtlas=function() {
for(let i=0; i < this.size+this.meshSize; i++) {
this.onCircle(i).forEach((cell)=>cell.cnghb());
}
reveal.call(this)
};
let onCircle=function(radius) {
return this.center.onCircle(radius);
};
let onDisk=function(radius) {
return this.center.onDisk(radius);
};
let onMesh=function() {
let meshCells=[];
this.onDisk(this.size).forEach((cell)=>{
let [x,y,z]=cell.coords;
if((Math.abs(x)%this.meshSize===0)&&(Math.abs(y)%this.meshSize===0)&&(Math.abs(z)%this.meshSize===0)) {
meshCells.push(cell);
}
});
return meshCells;
};
let onIsland=function(cell) {
let island=[{
cell,
visited: false
}];
let index=0;
do {
island[index].visited=true;
for(let direction of Cell.DIRECTIONS) {
let neighbor=island[index].cell.neighbors[direction];
if(neighbor.type==='island') {
let notStored=undefined===island.find(({cell})=>{
let cc=cell.coords;
let nc=neighbor.coords;
if(cc[0] === nc[0]&&cc[1] === nc[1]&&cc[2] === nc[2]) {
return true;
} else {
return false;
}
});
if(notStored) {
island.push({
cell: neighbor,
visited: false
});
}
}
}
index=island.findIndex(({visited})=>!visited);
} while(index!==-1);
return island.map(({cell})=>cell);
};
let findCell=function([tx,ty,tz]) {
let cell=this.center;
let [sx,sy,sz]=cell.coords;
while((tx-sx!==0)||(ty-sy!==0)||(tz-sz!==0)) {
let dx=tx-sx;
let dy=ty-sy;
let dz=tz-sz;
if(dx > 0&&dy < 0) {
cell=cell.neighbors['east'];
} else if(dx > 0&&dz < 0) {
cell=cell.neighbors['northeast'];
} else if(dy > 0&&dz < 0) {
cell=cell.neighbors['northwest'];
} else if(dx < 0&&dy > 0) {
cell=cell.neighbors['west'];
} else if(dx < 0&&dz > 0) {
cell=cell.neighbors['southwest'];
} else if(dy < 0&&dz > 0) {
cell=cell.neighbors['southeast'];
}
[sx,sy,sz]=cell.coords;
}
return cell;
};
let findCursorCell=function([x,y]) {
let X=x-y*Math.sqrt(3)/3;
let Z=2*y/Math.sqrt(3);
let Y=- X-Z;
let RX=Math.round(X);
let RY=Math.round(Y);
let RZ=Math.round(Z);
let DX=Math.abs(X-RX);
let DY=Math.abs(Y-RY);
let DZ=Math.abs(Z-RZ);
if(DX > DY&&DX > DZ) {
RX=- RY-RZ;
} else if(DY > DZ) {
RY=- RX-RZ;
} else {
RZ=- RX-RY;
}
RX += this.center.coords[0];
RY += this.center.coords[1];
RZ += this.center.coords[2];
return findCell.call(this,[RX,RY,RZ]);
};
let findPath=function(coords) {
let frontier=[{
cell: this.center,
priority: 0
}];
let cameFrom={
[this.center.coords.join(':')]: null
};
let path=[];
while(frontier.length!==0) {
let current=frontier.shift().cell;
if(current.distance(Cell({coords}))===0) {
let cell=current;
while(cell!==null) {
path.push(cell);
cell=cameFrom[cell.coords.join(':')];
}
path.reverse();
return path;
}
for(let direction of Cell.DIRECTIONS) {
let next=current.neighbors[direction];
if(next&&Array.isArray(next.coords)&&cameFrom[next.coords.join(':')]===undefined) {
let priority=next.distance(Cell({coords}));
frontier.push({
cell: next,
priority
});
cameFrom[next.coords.join(':')]=current;
}
}
frontier.sort((a,b)=>a.priority-b.priority);
}
return [];
};
let move=function(direction) {
this.onCircle(this.size+this.meshSize).forEach((cell)=>{
let index=Cell.DIRECTIONS.indexOf(direction);
let dir1=Cell.DIRECTIONS[(index+2)%6];
let dir2=Cell.DIRECTIONS[(index+4)%6];
if(cell.neighbors[dir1]!==undefined&&cell.neighbors[dir2]!==undefined) {
cell.cnghb();
}
});
this.center=this.center.neighbors[direction];
reveal.call(this);
};
return {
size,
meshSize,
islandThreshold,
continentRadius,
center,
cursor,
path,
generateAtlas,
onCircle,
onDisk,
onMesh,
onIsland,
findCell,
findCursorCell,
findPath,
move
};
}

let reset=function() {
this.context.fillStyle=Canvas.COLORS.background;
this.context.fillRect(0,0,this.width,this.height);
};
let convertCoords=function([sx,sy]) {
let [cx,cy]=this.atlas.center.pxlc();
return [
this.center.x+(sx-cx)*this.unit,
this.center.y+(sy-cy)*this.unit
]
}
let drawCircle=function(color,size=1) {
return function(cell) {
let [x,y]=convertCoords.call(this,cell.pxlc());
this.context.save();
this.context.fillStyle=color;
this.context.beginPath();
this.context.moveTo(x,y);
this.context.arc(x,y,size*canvas.unit/2,0,2*Math.PI);
this.context.fill();
this.context.closePath();
this.context.restore();
};
};
let drawWater=drawCircle(Canvas.COLORS.water);
let drawVendredi=drawCircle(Canvas.COLORS.vendredi,0.75);
let drawCursor=drawCircle(Canvas.COLORS.cursor,0.5);
let drawPathStep=drawCircle(Canvas.COLORS.path,0.5);
let drawEarth=function(cell,color) {
for(let direction of Cell.DIRECTIONS) {
let index=Cell.DIRECTIONS.findIndex((d)=>d===direction);
let n=cell.neighbors[direction];
let [x,y]=convertCoords.call(this,cell.pxlc());
this.context.save();
this.context.fillStyle=color;
if(n&&n.type===cell.type) {
let [nx,ny]=convertCoords.call(this,n.pxlc());
let pre=((6-index)%6)*2;
let angle1=(pre+3)*Math.PI/6;
let angle2=(pre-3)*Math.PI/6;
this.context.beginPath();
this.context.moveTo(x,y);
this.context.arc(x,y,canvas.unit/2,angle1,angle2);
this.context.arc(nx,ny,canvas.unit/2,angle2,angle1);
this.context.arc(x,y,canvas.unit/2,angle1,angle2);
this.context.fill();
this.context.closePath();
} else {
drawCircle.call(this,this.context.fillStyle).call(this,cell);
}
}
};

});
}

this.context.fillStyle='white';
this.context.globalAlpha='0.5';
this.context.font='bold 16px sans-serif';
this.context.textAlign='center';
this.context.textBaseline='middle';
let size=0.67;
let [x,y]=convertCoords.call(this,cell.pxlc());
let ny=y-size*Math.sqrt(2)*this.unit;
this.context.beginPath();
this.context.moveTo(x,y);
this.context.lineTo(x-size*this.unit*Math.sqrt(2)/2,y-size*this.unit*Math.sqrt(2)/2);
this.context.arc(x,ny,size*this.unit,3*Math.PI/4,Math.PI/4);
this.context.lineTo(x,y);
this.context.fill();
this.context.closePath();
this.context.fillStyle='black';
this.context.fillText(`${n}`,x,ny);
this.context.restore();
}

this.atlas.onDisk(this.atlas.size).forEach((cell)=>{

if(target) {
let tcoords=target.pxlc();

this.context.strokeStyle='black';
this.context.beginPath();
let sx=canvas.center.x+(scoords[0]-ccoords[0])*canvas.unit;
let sy=canvas.center.y+(scoords[1]-ccoords[1])*canvas.unit;
this.context.moveTo(sx,sy);
let tx=canvas.center.x+(tcoords[0]-ccoords[0])*canvas.unit;
let ty=canvas.center.y+(tcoords[1]-ccoords[1])*canvas.unit;

this.context.closePath();
this.context.restore();
}
}
});
}
let drawAnimations=function() {
let animationTime=1;
let animationMove=3*this.unit;
if(!this.animations) this.animations=[];
this.animations=this.animations.filter((animation)=>performance.now()-animation.start < animationTime*1000);
this.animations.forEach((animation)=>{

this.context.fillText(animation.number,nx,ny);

this.context.beginPath();
this.context.arc(x,y,0.67*this.unit,0,2*Math.PI);
this.context.fill();
this.context.closePath();
}

let height=icon.naturalHeight;

width=this.unit;

width=this.unit*width/height;
height=this.unit;
}

}
let draw=function() {
this.reset();
this.atlas.onDisk(this.atlas.size-1).forEach((cell)=>{
