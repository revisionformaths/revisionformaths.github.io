<style>

    }

    }
    #info, #pauseScreen {

    }

<script>function v2d(x,y) {
    this.x = x
    this.y = y
    this.tmp = 1;//for buff & swap
}
    
    v2d.prototype.setPoint = function(x,y) {
        this.x = x
        this.y = y
    }
    
    v2d.prototype.clone = function() {
        return new v2d(this.x,this.y)
    }
    
    v2d.prototype.invert = function() {
        this.x = -this.x
        this.y = -this.y
        return this
    }
    
    v2d.prototype.maxLength = function(max) {
        this.tmp = this.norm();
        if(this.tmp > max) {
            this.scale(max/this.tmp)
        }
        return this
    }
    
    v2d.prototype.setVector = function(v) {
        this.x = v.x
        this.y = v.y
        return this
    }
    
    v2d.prototype.cmp = function(v) {
        return this.norm() > v.norm()
    }
    
    v2d.prototype.X = function(o){
        this.x=this.x*o.x;
        this.y=this.y*o.y;
    }
    v2d.prototype.normalize = function() {
        this.tmp = this.x;
        this.x  = this.x / Math.hypot(this.x,this.y)
        this.y = this.y / Math.hypot(this.tmp,this.y)
        return this;
    }
    v2d.prototype.add = function(o){
        this.x=this.x+o.x;
        this.y=this.y+o.y;
        return this;
    }
    v2d.prototype.sub = function(o){
        this.x=this.x-o.x;
        this.y=this.y-o.y;
        return this;        
    }
    v2d.prototype.scale = function(n){
        this.x=this.x*n;this.y=this.y*n;
        return this
    }

    v2d.prototype.toString = function() {
        return `${this.x.toFixed(2)}|${this.y.toFixed(2)}`
    }
    v2d.prototype.x = function() {
        return this.x
    }
    v2d.prototype.y = function() {
        return this.y
    }
    v2d.prototype.stance = function(o) {
        return Math.sqrt(
            (this.y-o.y)*(this.y-o.y)+  
            (this.x-o.x)*(this.x-o.x)
        )
    }
    v2d.prototype.norm = function() {
        return Math.hypot(this.x,this.y)
    }</script>

var SPEED = 0
var accInput = new v2d(0,0)
SUB_LENGTH= 32
SUB_HEIHGT = 16
LEVEL_WIDTH = 0
SCREEN_WIDTH = 20;
SCREEN_HEIGHT = 20
var bubbles = []
var i,j;
var level= {};
for(i = 0; i < 10; i ++) {
    bubbles.push({pos : new v2d(0,0), size : 10*i % 70})
}

var acc = new v2d(0,0)
function step(delta) {

    accInput = acc.setVector(m).sub(sub)
    if(accInput.norm() < 50) {
        speed.scale(0.9)
        if(speed.norm() < 1) {
            speed.setPoint(0,0)
        }
    } else {
        acc.setVector(accInput).normalize()
        speed.add(acc.scale(0.3))
    }
    speed.maxLength(SPEED==0?2:7)
    
    
    
    //bubbles
    liveBubble(acc.x > 0)

    ctx.fillStyle = "#111200"
    ctx.fillRect(0,0,10000,100000)
    drawLevel()
    
    
    if(COLIDE) colide()

    drawBubble()
    
    drawUI()
    
}


function drawUI() {

    ctx.beginPath()
    ctx.strokeStyle = "#fff"
    ctx.arc(sub.x,sub.y, 50, 0, Math.PI*2)
    ctx.closePath()
    ctx.stroke()
    ui.innerHTML = `+speed : ${SPEED==0?'Slow':'Fast'}<br>`
}


function drawBubble() {
    ctx.strokeStyle = "#ffffff"
    for(var i = 0;i < bubbles.length; i ++) {
        if(bubbles[i].size > 0)  {
            ctx.beginPath()
            ctx.arc(bubbles[i].pos.x, bubbles[i].pos.y, bubbles[i].size/10, 0, Math.PI*2)
            ctx.closePath()
            ctx.stroke()
        }
    }
}
function liveBubble(rev) {
    for(var i = 0; i < bubbles.length; i ++) {
        if(bubbles[i].size < 0) {
            bubbles[i].size = 70
            bubbles[i].pos = sub.clone().add(new v2d(Math.random()*5+(rev ? -32 : 32), Math.random()*5))
        } else{
            bubbles[i].pos.add(new v2d(Math.cos(time+bubbles[i].pos.y), -1.5))
            bubbles[i].size-- 
        }
    }
}

    ctx["imageSmoothingEnabled"] = false;

    
    if(rev === true) {

        ctx.translate(-sub.x, -sub.y)
    }
    ctx.drawImage(sprite, 0, 0, 32, 16, p.x-32, p.y-16, 64, 32)
    if(rev === true) {
        ctx.restore()
    }
}

var tile = 0

//<3
var isC = true
var futureSub = new v2d(0,0)
var nextColumn = new v2d(0,0)
var nextLine = new v2d(0,0)
var corners = {ne : new v2d(0,0)}
var closePos = new v2d(0,0)
function colide() {
    isC = false
    if(speed.stance <= 0) return;
    corners.ne.setPoint(sub.x+SUB_LENGTH, sub.y-SUB_HEIHGT)
    
    if(speed.x>0) { //right
        C = Math.ceil((corners.ne.x) / 32) * 32 
    } else { //left
        C = Math.floor((corners.ne.x) / 32) * 32 
    }
    
    if(speed.y>0) { //down
        L = Math.ceil((corners.ne.y) / 32) * 32
    } else { //top
        L = Math.floor((corners.ne.y) / 32) * 32
    }
    
    // a: director coefficient
    a = speed.y / speed.x //y = a * x
    
    //interesection with column
    
    
    ctx.beginPath()
    ctx.moveTo(C, 0)
    ctx.lineTo(C, 1300 )
    ctx.strokeStyle = "#ff0000"
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(0, L)
    ctx.lineTo(1300, L )
    ctx.strokeStyle = "#ff0000"
    ctx.stroke()

    
    ctx.beginPath()
    ctx.moveTo(corners.ne.x, corners.ne.y)
    ctx.lineTo(sub.x+SUB_LENGTH +speed.x*1000, sub.y-SUB_HEIHGT + speed.y*1000 )
    ctx.strokeStyle = "#FFFFFF"
    ctx.stroke()
    
    // Find intersection with column C
    nextColumn.setPoint(C,  a * (C - sub.x - SUB_LENGTH) + sub.y - SUB_HEIHGT)
    nextLine.setPoint((L-sub.y+SUB_HEIHGT) / (a) + sub.x+SUB_LENGTH, L)
    
    ctx.fillStyle = "#00FF00"

    if(nextColumn.stance(corners.ne) < nextLine.stance(corners.ne))  {
        closePos.setVector(nextColumn)
    } else {
        closePos.setVector(nextLine)
    }
    d = new v2d(speed.x>0?0:-1, speed.y>0?0:-1)
    closePos.add(d)
    var tile = level.tiles[Math.floor((closePos.x)/32) + Math.floor((closePos.y)/32)*LEVEL_WIDTH]
    if(tile !== 0) { //colide
        ctx.strokeStyle = "#CD3378"
                           
    } else {
        ctx.strokeStyle = "#00FF00"
    }
    ctx.beginPath()
    ctx.rect(Math.floor((closePos.x)/32) * 32, Math.floor((closePos.y)/32)*32, 32,32)
    ctx.stroke()

    
    ctx.beginPath()
    ctx.arc(closePos.x,closePos.y, 2, 0, 7)
    ctx.fill()
    var stanceTo = new v2d(closePos.x, closePos.y)
    stanceTo.sub(corners.ne)
    if(tile === 0 ||stanceTo.norm() > speed.norm()) {
        sub.add(speed)
    } else {
        
    }
}

        for(j = 0;j < LEVEL_WIDTH || j < SCREEN_WIDTH; j ++) {
        tile = level.tiles[i*LEVEL_WIDTH+j]
            if(tile!=0) {
                ctx.drawImage(sprite, 48, 16, 16, 16, 32*j, 32*i, 32, 32)
            }
        }
    }
    
}

	info.innerHTML = ips > 50 ? ips.toFixed(3) : '<span style="color:red">'+ips.toFixed(3)+'</span>'




	/* game loop */


        step(delta)
        

	/* end game loop */



	frameHandler = requestAnimationFrame(loop)
	time = performance.now()
}

gameState = GAME_STATE_LEVEL


window.onkeypress =function(e) {
	if(e.keyCode === 32) {
		if(gameState===GAME_STATE_RUN) {
			//pause
			cancelAnimationFrame(frameHandler)
			gameState = GAME_STATE_PAUSE
			pauseScreen.style.display = 'block'
		} else {
			//run
			loop()
			gameState = GAME_STATE_RUN
			pauseScreen.style.display = 'none'
		}
	} else if(e.keyCode === 97) {
        SPEED = 0
    } else if(e.keyCode === 122) {
        SPEED = 1
    }
}

window.onmousemove = function(e) {
    m.x = e.pageX
    m.y = e.pageY
