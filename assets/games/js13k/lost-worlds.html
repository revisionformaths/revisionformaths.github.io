<script>var ctx = canvas.getContext('2d');
var offset = { x: 0, y: 0 };
var renderBounds = { x1: 0, y1: 0, x2: 0, y2: 0, size: 0 };

var cachedTiles;
var cachedCrosshair;

var heart = new Image();
heart.src="data:image/gif;base64,R0lGODlhEgAOAMIEAKQAALEAAL8AAM8AAP///////////////yH5BAEKAAQALAAAAAASAA4AAAM+SDo8qiLIt9oQMErw7BWgtnFeCEojAJQmqr6WKQavSjCyWHOL7NYUQutnCwpPKZ6RgKK9lhQiNOhUTh9FYwIAOw==";


function resizeRenderCanvas() {
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;
}


function canvasCache(width, height, func) {
	var canvas = document.createElement('canvas');
	canvas.width = width;
	canvas.height = height;

	func(canvas.getContext('2d'), canvas);

	return canvas;
}


function initRender() {
	canvas.style.cursor = 'none';

	cachedTiles = canvasCache(universe.mapWidth, universe.mapHeight, drawTiles);

	cachedCrosshair = canvasCache(30, 30, function(ctx, canv) {
		var grad = ctx.createRadialGradient(15, 15, 0, 15, 15, 15);
		grad.addColorStop(0.0, 'rgba(255,0,0,0)');
		grad.addColorStop(0.5, 'rgba(240,8,8,1)');
		grad.addColorStop(1.0, 'rgba(120,4,4,1)');

		ctx.lineWidth = 3;
		ctx.strokeStyle = grad;
		ctx.beginPath();
		ctx.arc(15, 15, 10, 0, 2 * Math_PI);
		ctx.moveTo(0, 15);
		ctx.lineTo(30, 15);
		ctx.moveTo(15, 0);
		ctx.lineTo(15, 30);
		ctx.stroke();
	});
}


function render() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);

	// Major performance boost + makes levels look correct
	ctx['imageSmoothingEnabled'] = false;
	ctx['msImageSmoothingEnabled'] = false;

	// Reset env
	ctx.font = '12px monospace';
	ctx.globalAlpha = 1.0;
	ctx.shadowColor = Color_White;

	// Fill background
	ctx.fillStyle = universe.colors[1];
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	// Rotation and scaling
	ctx.translate(canvas.width/2, canvas.height/2);
	ctx.rotate(universeRot * Math_PI / 180);
	ctx.scale(universeScale, universeScale);
	ctx.translate(0 - canvas.width/2, 0 - canvas.height/2);

	// Center world around the player
	offset.x = Math_round(
		0 - player.x + (canvas.width / 2)
	);
	offset.y = Math_round(
		0 - player.y + (canvas.height / 2)
	);
	ctx.translate(offset.x, offset.y);

	// Only entities fully within these bounds should be rendered
	var maxExtent = Math_max(canvas.width, canvas.height) * 1.4;
	renderBounds.x1 = Math_round(player.x - (maxExtent / 2));
	renderBounds.y1 = Math_round(player.y - (maxExtent / 2));
	renderBounds.x2 = Math_round(player.x + (maxExtent / 2));
	renderBounds.y2 = Math_round(player.y + (maxExtent / 2));
	renderBounds.x1 = Math_max(renderBounds.x1, 0);
	renderBounds.y1 = Math_max(renderBounds.y1, 0);
	renderBounds.x2 = Math_min(renderBounds.x2, universe.mapWidth * universe.tileSize);
	renderBounds.y2 = Math_min(renderBounds.y2, universe.mapHeight * universe.tileSize);

	drawBG();
	drawEntities();
	drawHUD();

	if (blackOverlay > 0.01) {
		ctx.fillStyle = Color_Black;
		ctx.globalAlpha = blackOverlay;
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.globalAlpha = 1.0;
	}

	if (player.lives == 0) {
		drawFinishedScore();
	} else {
		drawScore();
	}

	if (hasTouchEvents) {
		drawVirtualJoysticks();
	}
}


function drawBG()
{
	var width = renderBounds.x2 - renderBounds.x1;
	var height = renderBounds.y2 - renderBounds.y1;

	ctx.drawImage(
		cachedTiles,
		renderBounds.x1/universe.tileSize, renderBounds.y1/universe.tileSize,
		width/universe.tileSize, height/universe.tileSize,
		renderBounds.x1, renderBounds.y1,
		width, height
	);
}


function drawEntities()
{
	var i;

	player.render(ctx);

	for (i = 0; i < gravSource.length; ++i) {
		if (pointInBounds(gravSource[i], renderBounds)) {
			gravSource[i].render(ctx);
		}
	}

	for (i = 0; i < enemies.length; ++i) {
		if (enemies[i].alive) enemies[i].render(ctx);
	}

	for (i = 0; i < collectables.length; ++i) {
		if (collectables[i].alive) collectables[i].render(ctx);
	}

	ctx.fillStyle = Color_Black;
	for (i = 0; i < bullets.length; ++i) {
		bullets[i].render(ctx);
	}
}


function drawHUD()
{
	ctx.globalAlpha = 1;
	ctx.fillStyle = Color_White;
	for (var i = 0; i < overlayWords.length; ++i) {
		overlayWords[i].render(overlayWords[i], ctx);
	}

	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.drawImage(cachedCrosshair, mouse.x - 15, mouse.y - 15);
}


function drawScore()
{
	for (i = 0; i < player.lives; ++i) {
		ctx.drawImage(heart, 20 + (22 * i), 20);
	}

	ctx.fillStyle = Color_White;
	ctx.font = '12px monospace';

	ctx.drawImage(elec, 20, 50);
	ctx.fillText('\u00D7 ' + player.collected, 50, 61);

	ctx.drawImage(bug,  0, 0, 18, 22,  20, 80, 18, 22);
	ctx.fillText('\u00D7 ' + player.kills, 50, 92);

	ctx.fillText(Math_floor(player.score) + ' pts', 20, 130);
}


function drawFinishedScore()
{
	var ctr = function(txt, y) {
		var metrics = ctx.measureText(txt);
		ctx.fillText(txt, (canvas.width - metrics.width) / 2, y);
	};

	ctx.fillStyle = Color_Black;

	ctx.font = '40px serif';
	ctr('GAME OVER', 75);

	ctx.font = '20px sans';
	ctr('Collected ' + player.collected + ' circuit board' + (player.collected == 1 ? '' : 's'), 150);
	ctr('Killed ' + player.kills + ' bug' + (player.kills == 1 ? '' : 's'), 180);
	ctr('Survived ' + totalGameTime.toFixed(1) + ' seconds', 210);
	ctr('CLICK ANYWHERE TO START OVER', canvas.height - 100);

	ctx.font = '26px sans';
	ctr((player.collected * SCORE_COLLECT + player.kills * SCORE_KILL) + ' points', 260);
}


function drawVirtualJoysticks() {
	ctx.fillStyle = Color_White;

	ctx.beginPath();
	ctx.arc(100, canvas.height - 100, 50, 0, Math_PI * 2);
	ctx.arc(180, canvas.height - 100, 25, 0, Math_PI * 2);
	ctx.arc(canvas.width - 100, canvas.height - 100, 50, 0, Math_PI * 2);
	ctx.fill();

	ctx.fillStyle = Color_Black;
	ctx.font = '12px monospace';
	ctx.fillText('C', 176, canvas.height - 95);
	ctx.font = '28px monospace';
	ctx.fillText('F', 90, canvas.height - 90);
	ctx.fillText('M', canvas.width - 110, canvas.height - 90);
}


function drawTiles(ctx, canvas)
{
	ctx.fillStyle = universe.colors[0];
	for (var y = 0; y < universe.mapHeight; ++y) {
		for (var x = 0; x < universe.mapWidth; ++x) {
			if (!getTile(x, y)) {
				ctx.fillRect(x, y, 1, 1);
			}
		}
	}
}

<script>var MENU_WIDTH = 700;
var MENU_HEIGHT = 400;


function menu()
{
	var raf = requestAnimationFrame(render);

	var buttons = [];
	buttons.push({
		x: 225, y: 300,
		w: 250, h: 50,
		b: '#333',
		t: 'START',
		f: startGame
	});

	if (canvas.webkitRequestFullscreen
		|| canvas.mozRequestFullScreen
		|| canvas.msRequestFullscreen
		|| canvas.requestFullscreen
	) {
		buttons.push({
			x: 50, y: 300,
			w: 250, h: 50,
			b: '#555',
			t: 'FULLSCREEN',
			f: enterFullscreen
		});
		buttons[0].x = 400;
	}
	

	var menuGrad = ctx.createRadialGradient(MENU_WIDTH/2, MENU_HEIGHT/2, 0, MENU_WIDTH/2, MENU_HEIGHT/2, MENU_WIDTH);
	menuGrad.addColorStop(0, '#DAE9C9');
	menuGrad.addColorStop(1, '#7FB83A');


	function render() {
		var metrics;
		
		ctx.setTransform(1, 0, 0, 1, 0, 0);

		ctx.fillStyle = '#404E4C';
		ctx.fillRect(0, 0, canvas.width, canvas.height);

		ctx.translate((canvas.width - MENU_WIDTH) / 2, (canvas.height - MENU_HEIGHT) / 2);

		ctx.fillStyle = menuGrad;
		ctx.shadowColor = '#333';
		ctx.shadowBlur = 10;
		ctx.fillRect(0, -120, MENU_WIDTH, 100);
		ctx.fillRect(0, 0, MENU_WIDTH, MENU_HEIGHT);
		ctx.shadowBlur = 0;

		ctx.font = '52px serif';
		metrics = ctx.measureText('LOST WORLDS');
		ctx.fillStyle = Color_White;
		ctx.fillText('LOST WORLDS', (MENU_WIDTH - metrics.width) / 2 + 1, -49);
		ctx.fillStyle = Color_Black;
		ctx.fillText('LOST WORLDS', (MENU_WIDTH - metrics.width) / 2, -50);

		ctx.font = '16px sans';
		if (hasTouchEvents) {
			ctx.fillText('Move right virtual-joystick to aim + move player', 50, 45);
			ctx.fillText('Hold left virtual-joystick to fire. Tap small one to change weapon', 50, 70);
		} else {
			ctx.fillText('W = forwards   S = backwards   LMB = shoot   C = change weapon', 50, 45);
			ctx.fillText('Your player moves forwards towards the mouse', 50, 70);
		}

		ctx.font = '24px sans';
		for (var i = 0; i < buttons.length; ++i) {
			var btn = buttons[i];
			ctx.fillStyle = btn.b;
			ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
			ctx.fillStyle = Color_White;
			metrics = ctx.measureText(btn.t);
			ctx.fillText(btn.t, btn.x + (btn.w - metrics.width) / 2, btn.y + btn.h / 2 + 10);
		}

		player.rot = Math_atan2(
			(mouse.y - canvas.height/2-25), (mouse.x - canvas.width/2)
		) + Math_PI;

		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.translate(canvas.width/2, canvas.height/2 - 20);

		ctx.beginPath();
		ctx.arc(0, 0, 90, 0, 2 * Math_PI);
		ctx.fill();

		player.render(ctx);

		ctx.font = '16px monospace';
		ctx.fillStyle = Color_Black;
		ctx.rotate(player.rot - Math_PI/2);

		if (!hasTouchEvents) {
			ctx.fillText('W', -5, -30);
			ctx.fillText('S', -5, 32);
		}

		ctx.beginPath();
		ctx.moveTo(0, -55);
		ctx.lineTo(0, -80);
		ctx.lineTo(-5, -75);
		ctx.moveTo(5, -75);
		ctx.lineTo(0, -80);
		ctx.stroke();

		if (hasTouchEvents) {
			ctx.setTransform(1, 0, 0, 1, 0, 0);
			ctx.fillStyle = Color_White;
			drawVirtualJoysticks();
		}

		raf = requestAnimationFrame(render);
	}


	canvas.onclick = function(e) {
		var clickX = e.clientX - (canvas.width - MENU_WIDTH) / 2;
		var clickY = e.clientY - (canvas.height - MENU_HEIGHT) / 2;

		for (var i = 0; i < buttons.length; ++i) {
			var btn = buttons[i];
			if (clickX >= btn.x && clickY >= btn.y && clickX <= (btn.x + btn.w) && clickY <= (btn.y + btn.h)) {
				btn.f(btn);
				return;
			}
		}
	};


	function enterFullscreen(btn) {
		canvas.webkitRequestFullscreen && canvas.webkitRequestFullscreen();
		canvas.mozRequestFullScreen && canvas.mozRequestFullScreen();
		canvas.msRequestFullscreen && canvas.msRequestFullscreen();
		canvas.requestFullscreen && canvas.requestFullscreen();
		btn.t = 'WINDOW';
		btn.f = cancelFullscreen;
	}


	function cancelFullscreen(btn) {
		document.webkitExitFullscreen && document.webkitExitFullscreen();
		document.mozCancelFullScreen && document.mozCancelFullScreen();
		document.msExitFullscreen && document.msExitFullscreen();
		document.exitFullscreen && document.exitFullscreen();
		btn.t = 'FULLSCREEN';
		btn.f = enterFullscreen;
	}


	function startGame() {
		cancelAnimationFrame(raf);
		loadInitMap();
	}
}
</script>
<script>var accel = { x: 0, y: 0 };
var totalGameTime = 0;

function physics(delta)
{
	if (player.lives > 0) {
		totalGameTime += delta;
	}

	universeRot += universeRotDir * delta;
	if (universe.spinLimit > 0.2 && Math_abs(universeRot) >= universe.spinLimit) {
		universeRotDir = 0 - universeRotDir;
	}

	if (blackOverlay > 0.01) {
		blackOverlay -= 0.5 * delta;
	}

	for (var i = 0; i < overlayWords.length; ++i) {
		if (overlayWords[i].update) {
			overlayWords[i].update(overlayWords[i], delta);
		}
	}
	for (var i = 0; i < enemies.length; ++i) {
		if (enemies[i].alive) enemies[i].update(delta);
	}
	for (var i = 0; i < bullets.length; ++i) {
		bullets[i].update(delta);
	}

	BlackHole.updateParticles(delta);

	checkBulletsHitEnemies();

	bullets = bullets.filter(function(b){
		return b.alive;
	});

	var force = { x: 0.0, y: 0.0 }
	movePlayer_TopView(force, delta);
	applyGravityPull(force, delta);
	
	player.x += force.x;
	player.y += force.y;

	checkCollide(player, HALF_PLAYER_SIZE);

	for (var i = 0; i < enemies.length; ++i) {
		if (!enemies[i].alive) continue;
		var distSq = Math_pow(player.x - enemies[i].x, 2) + Math_pow(player.y - enemies[i].y, 2);
		if (distSq < enemies[i].hitDistSq) {
			player.takeDamage(enemies[i]);
		}
	}

	for (var i = 0; i < collectables.length; ++i) {
		if (!collectables[i].alive) continue;
		var distSq = Math_pow(player.x - collectables[i].x, 2) + Math_pow(player.y - collectables[i].y, 2);
		if (distSq < collectables[i].hitDistSq) {
			collectables[i].touchPlayer();
		}
	}

	player.update(delta);

	if (keys.fire) {
		player.fire(delta);
	}

	var desiredScore = (player.collected * SCORE_COLLECT + player.kills * SCORE_KILL);
	if (player.score < desiredScore) {
		player.score += 20 * delta;
	}
}


function movePlayer_TopView(force, delta)
{
	// Point player towards the mouse
	if (mouse.x && mouse.y) {
		player.rot = Math_atan2(
			(mouse.y - canvas.height/2), (mouse.x - canvas.width/2)
		) + Math_PI;
		
		player.rot -= (universeRot * Math_PI / 180);
	}

	// Forwards and backwards
	if (keys.y != 0) {
		accel.y += (keys.y * universe.unitAccel * delta);
		if (accel.y > universe.unitMax) accel.y = universe.unitMax;
		if (accel.y < 0 - universe.unitMax) accel.y = 0 - universe.unitMax;
	} else {
		accel.y /= universe.unitDeccel;
	}
	force.x += Math_cos(player.rot) * accel.y * delta;
	force.y += Math_sin(player.rot) * accel.y * delta;

	player.vel = -accel.y;
}


function applyGravityPull(force, delta)
{
	var maxDist = universe.tileSize * 14;

	for (var i = 0; i < gravSource.length; ++i) {
		var src = gravSource[i];
		var dist = Math_sqrt(Math_pow(player.x - src.x, 2) + Math_pow(player.y - src.y, 2));

		if (dist > maxDist) {
			continue;
		}

		if (dist < 30) {
			enteredBlackHole(gravSource[i]);
			continue;
		}

		var strength = 1.0 / (dist * dist) * 1000.0;
		force.x -= ((player.x - src.x) / 1.0 * strength);
		force.y -= ((player.y - src.y) / 1.0 * strength);
	}
}


function checkBulletsHitEnemies() {
	var ei, el, bi, bl;

	// This is a dirty dirty double-linear search. YUK.
	for (ei = 0, el = enemies.length; ei < el; ++ei) {
		for (bi = 0, bl = bullets.length; bi < bl; ++bi) {
			var distSq = Math_pow(bullets[bi].x - enemies[ei].x, 2) + Math_pow(bullets[bi].y - enemies[ei].y, 2);
			if (distSq < enemies[ei].hitDistSq) {
				enemies[ei].takeDamage(bullets[bi]);
			}
		}
	}
}


function checkCollide(entity, halfSize, hit) {
	collideDir(entity, halfSize, -1.0, 0.0, hit);
	collideDir(entity, halfSize, +1.0, 0.0, hit);
	collideDir(entity, halfSize, 0.0, -1.0, hit);
	collideDir(entity, halfSize, 0.0, +1.0, hit);
	repairBrokenPosition(entity);
}

function collideDir(entity, halfSize, xSign, ySign, hit) {
	var tileX = Math_floor((entity.x + halfSize * xSign) / universe.tileSize);
	var tileY = Math_floor((entity.y + halfSize * ySign) / universe.tileSize);

	var tile = getTile(tileX, tileY);

	if (tile > 0) {
		if (xSign != 0) {
			var tileXpx = tileX * universe.tileSize;
			if (xSign < 0) tileXpx += universe.tileSize;
			entity.x =  tileXpx - (halfSize * xSign);
			hit && hit.call(entity, 'x', xSign);
		}

		if (ySign != 0) {
			var tileYpx = tileY * universe.tileSize;
			if (ySign < 0) tileYpx += universe.tileSize;
			entity.y =  tileYpx - (halfSize * ySign);
			hit && hit.call(entity, 'y', ySign);
		}
	}
}

function repairBrokenPosition(entity) {
	var tileX = Math_floor(entity.x / universe.tileSize);
	var tileY = Math_floor(entity.y / universe.tileSize);
	var tile = getTile(tileX, tileY);
	if (tile == 0) return;

	var valid = findValidTiles(tileX, tileY, 3);
	if (valid.length) {
		valid.sort(function(a,b) {
			return (b[2] - a[2]);
		});
		valid = valid.pop();
		entity.x = valid[0] * universe.tileSize;
		entity.y = valid[1] * universe.tileSize;
	}
}

function findValidTiles(x, y, radius) {
	var tx, sx = x - radius; mx = x + radius;
	var ty, sy = y - radius; my = y + radius;

	var valid = [];
	for (ty = sy; ty <= my; ++ty) {
		for (tx = sx; tx <= mx; ++tx) {
			var tile = getTile(tx, ty);
			if (tile == 0) {
				var manHatDist = Math_abs(x - tx) + Math_abs(y - ty);
				valid.push([tx, ty, manHatDist]);
			}
		}
	}

	return valid;
}


function checkCollideTiny(entity, hit) {
	var tileX = Math_floor(entity.x / universe.tileSize);
	var tileY = Math_floor(entity.y / universe.tileSize);

	var tile = getTile(tileX, tileY);

	if (tile > 0) {
		hit.apply(entity);
	}
}

<script>var keys = { y: 0, fire: 0 };
var mouse = { x: 0, y: 0 };
var touchId = { fire: null, aim: null };


if (!hasTouchEvents) {
	// DESKTOP EVENTS
	
	window.onmousemove = function(e) {
		mouse.x = e.clientX;
		mouse.y = e.clientY;
	};

	window.onmousedown = function(e) {
		keys.fire = 1;
	};

	window.onmouseup = function(e) {
		keys.fire = 0;
	};

	window.onkeydown = function(e) {
		switch (e.key) {
			case 'w': keys.y = -1; break;
			case 's': keys.y = 1; break;
			case 'c': player.changeWeapon(); break;
		}
	};

	window.onkeyup = function(e) {
		switch (e.key) {
			case 'w':
			case 's': keys.y = 0; break;
		}
	};


} else {
	// MOBILE EVENTS
	setupTouchEvents();
}


function determineTouchType(t) {
	if (t.clientY > (canvas.height - 150) && t.clientY < (canvas.height - 50)) {
		if (t.clientX > 50 && t.clientX < 150) {
			return 'fire';
		} else if (t.clientX > 160 && t.clientX < 210) {
			return 'weapon';
		} else if (t.clientX > (canvas.width - 150) && t.clientX < (canvas.width - 50)) {
			return 'aim';
		}
	}
}


function setupTouchEvents() {
	window.ontouchstart = function(e) {
		var type = determineTouchType(e.changedTouches[0]);
		if (!type) return;

		if (type == 'weapon') {
			player.changeWeapon();
			return;
		}

		touchId[type] = e.changedTouches[0].identifier;

		if (type == 'fire') {
			keys.fire = 1;
		}
	};

	window.ontouchend = function(e) {
		for (type in touchId) {
			if (touchId[type] == e.changedTouches[0].identifier) {
				touchId[type] = null;
			}
		}

		if (touchId['fire'] === null) {
			keys.fire = 0;
		}

		if (touchId['aim'] === null) {
			keys.y = 0;
		}
	};

	window.ontouchmove = function(e) {
		e.preventDefault();

		for (i = 0; i < e.changedTouches.length; ++i) {
			var t = e.changedTouches.item(i);

			if (touchId['aim'] === t.identifier) {
				// Aim - virtual joystick
				var x = canvas.width - t.clientX - 100;
				var y = canvas.height - t.clientY - 100;

				mouse.x = (canvas.width / 2) - (x * 2);
				mouse.y = (canvas.height / 2) - (y * 2);

				var distSq = (x * x) + (y * y);
				if (distSq > (25 * 25)) {
					keys.y = -1;
				} else {
					keys.y = 0;
				}
			}
		}
	};
}

<script>var mapBuffer, mapTiles;


function getTile(x, y) {
	return mapTiles[universe.mapWidth * y + x];
}


function setTile(x, y, val) {
	mapTiles[universe.mapWidth * y + x] = val;
}


function cleanupExistingMap()
{
	gravSource.length = 0;
	enemies.length = 0;
	collectables.length = 0;
	bullets.length = 0;
	overlayWords.length = 0;
}


function generateNewMap() {
	universe.mapWidth = 100;
	universe.mapHeight = 100;

	mapBuffer = new ArrayBuffer(universe.mapWidth * universe.mapHeight);
	mapTiles = new Uint8Array(mapBuffer);

	var pois = [];
	var i, x, y, r, px, py;

	// Set whole map to "walls"
	for (i = 0; i < mapTiles.length; ++i) {
		mapTiles[i] = 1;
	}

	// Generate an even number of POIs (point of interest)
	for (i = 0; i < 8; ++i) {
		var x = getRandomInt(10, universe.mapWidth - 20);
		var y = getRandomInt(10, universe.mapHeight - 20);
		var r = getRandomInt(5, 10);

		generateCircle(x, y, r, 0);

		// Need to know distance from the spawn point
		r = Math_pow(px - x, 2) + Math_pow(py - y, 2);

		// Don't spawn everthing right in the middle
		x += getRandomInt(-3, 3);
		y += getRandomInt(-3, 3);

		if (i == 0) {
			px = x;
			py = y;

		} else if (gravSource.length < 2 && r >= 15*15) {
			// Create gravity source - only if far enough from the player
			generateCircle(x, y, 15, 0);
			gravSource.push(new BlackHole(x, y));

		} else if (collectables.length < 1 && r >= 20*20) {
			collectables.push(new Collectable(x, y));

			x += getRandomInt(-3, 3);
			y += getRandomInt(-3, 3);
			enemies.push(new Enemy(x, y, getRandomInt(0, 1)));

		} else {
			enemies.push(new Enemy(x, y, getRandomInt(0, 1)));
		}

		pois.push({ x: x, y: y });
	}

	// Draw lines between pairs of POIs
	for (i = 0; i < pois.length; i += 2) {
		generateLine(pois[i].x, pois[i].y, pois[i+1].x, pois[i+1].y, 0);
	}

	// Find 'orphan' POIs - unaccessable by the player
	var orphans = [];
	var coord = { x: px, y: py };
	for (i = 1; i < pois.length; ++i) {
		var path = astarSearch(coord, pois[i]);
		if (path.length == 0) {
			orphans.push(pois[i]);
		}
	}

	// Draw a line from the player to each orphan in succession
	// Player --> Orph1 --> Orph2 --> Orph3 --> etc
	for (i = 0; i < orphans.length; ++i) {
		generateLine(coord.x, coord.y, orphans[i].x, orphans[i].y, 0);
		coord = orphans[i];
	}

	// Ensure enough enemies
	while (enemies.length < universe.numEnemies) {
		var x = getRandomInt(0, universe.mapWidth);
		var y = getRandomInt(0, universe.mapHeight);
		var t = getTile(x, y);
		if (t == 0) {
			enemies.push(new Enemy(x, y, getRandomInt(0, 1)));
		}
	}

	// Spawn a weapon near the player. They'll feel so lucky!
	if (getRandomInt(1, 100) >= (100 - universe.weaponSpawnChance)) {
		var x, y, t;
		do {
			x = getRandomInt(px - 10, px + 10);
			y = getRandomInt(py - 10, py + 10);
			t = getTile(x, y);
		} while (t != 0);

		if (getRandomInt(1, 10) > 5) {
			collectables.push(new Gun(x, y, getRandomInt(0, 1)));
		} else {
			collectables.push(new Heart(x, y));
		}

		universe.weaponSpawnChance = 2;
	}

	player.spawn(px, py);
	postMapLoad();
}


function generateHeavenMap() {
	universe.mapWidth = 50;
	universe.mapHeight = 50;

	mapBuffer = new ArrayBuffer(universe.mapWidth * universe.mapHeight);
	mapTiles = new Uint8Array(mapBuffer);

	// Set whole map to "walls"
	for (i = 0; i < mapTiles.length; ++i) {
		mapTiles[i] = 1;
	}

	// Create some clouds
	generateCircle(15, 25, 8, 0);
	generateCircle(25, 25, 4, 0);
	generateCircle(35, 25, 8, 0);

	for (var i = 0; i < 4; ++i) {
		generateCircle(getRandomInt(5, 45), getRandomInt(5, 45), 3, 0);
	}
	
	player.spawn(25, 25);

	postMapLoad();
}


/**
 * Brute force circle drawing
 */
function generateCircle(originX, originY, radius, val)
{
	var x, y;
	var radiusSquared = radius * radius;

	for (y = -radius; y <= radius; ++y) {
		for (x = -radius; x <= radius; ++x) {
			if ((x * x + y * y) <= radiusSquared) {
				setTile(originX + x, originY + y, val);
			}
		}
	}
}


function generateRect3x3(x, y, val)
{
	--x; --y; i = 9;
	while (i-- != 0) {
		setTile(x, y, val);
		x++;
		if (i % 3 == 0) { x -= 3; ++y; }
	}
}


/**
 * Bresenham's line algorithm
 */
function generateLine(x0, y0, x1, y1, val) {
	var dx = Math_abs(x1 - x0);
	var dy = Math_abs(y1 - y0);
	var sx = (x0 < x1) ? 1 : -1;
	var sy = (y0 < y1) ? 1 : -1;
	var err = dx - dy;

	while (true) {
		var t = getRandomInt(2, 25);
		if (t >= 4) {
			generateRect3x3(x0, y0, val);
		} else {
			generateCircle(x0, y0, t + 2, val);
		}

		if ((x0 == x1) && (y0 == y1)) {
			break;
		}

		var e2 = 2 * err;
		if (e2 > -dy){
			err -= dy;
			x0 += sx;
		}
		if (e2 < dx) {
			err += dx;
			y0  += sy;
		}
	}
}

<script>/**
* See also original blog post
* http://www.briangrinstead.com/blog/astar-search-algorithm-in-javascript
**/


// This array-of-arrays holds internal metadata
// for each cell in the grid. Unlike the rest of the
// game, it's X-first instead of Y-first. I may change
// this later. Or I may not.
var grid;


function astarCreateGrid(width, height)
{
    grid = new Array(width);
    for (var x = 0; x < width; ++x) {
        grid[x] = new Array(height);
        for (var y = 0; y < height; ++y) {
            grid[x][y] = { x: x, y: y };
        }
    }
}


function astarIsWall(node)
{
    return (getTile(node.x, node.y) != 0);
}


function astarSearch(start, end)
{
    start = grid[start.x][start.y];
    end = grid[end.x][end.y];

    // Reset the grid
    for(var x = 0; x < grid.length; x++) {
        for(var y = 0; y < grid[x].length; y++) {
            grid[x][y].f = 0;
            grid[x][y].g = 0;
            grid[x][y].h = 0;
            grid[x][y].visited = false;
            grid[x][y].closed = false;
            grid[x][y].parent = null;
        }
    }

    var openList = [];
    openList.push(start);

    while(openList.length > 0) {
        // Grab the lowest f(x) to process next
        var lowInd = 0;
        for (var i = 0; i < openList.length; i++) {
            if (openList[i].f < openList[lowInd].f) {
                lowInd = i;
            }
        }
        var currentNode = openList[lowInd];

        // End case -- result has been found, return the traced path
        if (currentNode == end) {
            var curr = currentNode;
            var ret = [];
            while (curr.parent) {
                ret.push(curr);
                curr = curr.parent;
            }
            return ret.reverse();
        }

        // Normal case -- move currentNode from open to closed, process each of its neighbors
        openList.splice(lowInd, 1);
        currentNode.closed = true;

        var neighbors = astarNeighbors(grid, currentNode);
        for (var i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];

            if (neighbor.closed || astarIsWall(neighbor)) {
                // not a valid node to process, skip to next neighbor
                continue;
            }

            // g score is the shortest distance from start to current node, we need to check if
            //   the path we have arrived at this neighbor is the shortest one we have seen yet
            var gScore = currentNode.g + 1; // 1 is the distance from a node to it's neighbor
            var gScoreIsBest = false;

            if (!neighbor.visited) {
                // This the the first time we have arrived at this node, it must be the best
                // Also, we need to take the h (heuristic) score since we haven't done so yet
                gScoreIsBest = true;
                neighbor.h = astarHeuristic(neighbor, end);
                neighbor.visited = true;
                openList.push(neighbor);

            } else if (gScore < neighbor.g) {
                // We have already seen the node, but last time it had a worse g (distance from start)
                gScoreIsBest = true;
            }

            if (gScoreIsBest) {
                // Found an optimal (so far) path to this node.  Store info on how we got here and
                //  just how good it really is...
                neighbor.parent = currentNode;
                neighbor.g = gScore;
                neighbor.f = neighbor.g + neighbor.h;
            }
        }
    }

    // No result was found -- empty array signifies failure to find path
    return [];
}


function astarHeuristic(node0, node1) {
    var d1 = Math_abs(node1.x - node0.x);
    var d2 = Math_abs(node1.y - node0.y);
    return d1 + d2;
}


function astarNeighbors(grid, node) {
    var ret = [];
    var x = node.x;
    var y = node.y;

    if(grid[x-1] && grid[x-1][y]) {
        ret.push(grid[x-1][y]);
    }
    if(grid[x+1] && grid[x+1][y]) {
        ret.push(grid[x+1][y]);
    }
    if(grid[x][y-1] && grid[x][y-1]) {
        ret.push(grid[x][y-1]);
    }
    if(grid[x][y+1] && grid[x][y+1]) {
        ret.push(grid[x][y+1]);
    }

    return ret;
}

<script>function getRandom(min, max) {
    return Math_random() * (max - min) + min;
}


// This method doesn't have even distribution. That's okay.
function getRandomInt(min, max) {
    return Math_round(getRandom(min, max));
}


function getRandomColor(min, max) {
    return '#'
        + getRandomInt(min, max).toString(16)
        + getRandomInt(min, max).toString(16)
        + getRandomInt(min, max).toString(16);
}


function getRotVel(rot, vel) {
	return {
		x: Math_cos(rot) * vel,
		y: Math_sin(rot) * vel
	};
}


function addRotVel(origin, rot, vel) {
	return {
		x: origin.x + Math_cos(rot) * vel,
		y: origin.y + Math_sin(rot) * vel
	};
}


function pointInBounds(point, bounds) {
    return (
        point.x >= bounds.x1 && point.x <= bounds.x2
        &&
        point.y >= bounds.y1 && point.y <= bounds.y2
    );
}


function getTileFromCoords(coords)
{
    return {
        x: Math_floor(coords.x / universe.tileSize),
        y: Math_floor(coords.y / universe.tileSize)
    };
}

function getCoordsFromTile(tile)
{
    return {
        x: tile.x * universe.tileSize,
        y: tile.y * universe.tileSize
    };
}

<script>var ENEMY_BEHAVE_VERT = 0;
var ENEMY_BEHAVE_HORIZ = 1;
var ENEMY_BEHAVE_CHASE = 2;

var bug = new Image();
bug.src="data:image/gif;base64,R0lGODlhJAAWAMIEAAkZBmEDAwk2DQJHB////////////////yH5BAEKAAQALAAAAAAkABYAAAOdSEPc3uvFp+QT2GosoJwBJwTMMJVMyJEVZBKjGoTmqQwxNne2Kf4ZCvBHgQ05t9YRuaj9AMOaTwQFNnGYGkDKuXZNW2c2MpZyO42yedoyh9cO9/p1k88n9rv+7tpLS1Jvflp6fWCDeXCAg3GIi4lYjYFmQXdvSI+TU2iSWD9wZ589nqI1cUd/iyVdfXGrWS6xskV1eCd0Rbi0urwLCQA7";


function Enemy(x, y, behaviour) {
    this.x = x * universe.tileSize;
    this.y = y * universe.tileSize;
    this.rot = 0;
    this.alive = true;
    this.hitDistSq = 25 * 25;
    this.health = 3;
    this.damage = 6;
    this.behaviour = behaviour;
    this.animTime = 0;

    if (enemy_behave_setup[behaviour]) {
        enemy_behave_setup[behaviour](this);
    }
};


Enemy.prototype.render = function(ctx) {
    if (this.alive == false) {
        return;
    }

    var frame = Math_floor(this.animTime / 0.25);

    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.drawImage(
        bug,
        frame * 18, 0, 18, 22,
        -9, -11, 18, 22
    );
    ctx.rotate(-this.rot);
    ctx.translate(-this.x, -this.y);
};


Enemy.prototype.update = function(delta) {
    enemy_behave_update[this.behaviour](this, delta);

    this.animTime += delta;
    if (this.animTime > 0.5) this.animTime -= 0.5;
};


enemy_behave_setup = [
    function(e) {
        e.dirY = universe.enemySpeed;
        e.rot = Math_PI;
    },
    function(e) {
        e.dirX = universe.enemySpeed;
        e.rot = Math_PI / 2;
    }
];

enemy_behave_update = [
    function(e, delta) {
        e.y += e.dirY * delta;
        checkCollide(e, 10, function(axis, sign) {
            e.dirY = -e.dirY;
            e.rot += Math_PI;
        });
        clasePlayerIfClose(e);
    },
    function(e, delta) {
        e.x += e.dirX * delta;
        checkCollide(e, 10, function(axis, sign) {
            e.dirX = -e.dirX;
            e.rot += Math_PI;
        });
        clasePlayerIfClose(e);
    },
    function(e, delta) {
        e.pathAge += delta;
        if (e.pathAge > 1) {
            e.path = astarSearch(getTileFromCoords(player), getTileFromCoords(e));
            e.pathAge = 0;
        }

        if (e.path.length == 0) {
            return;
        }

        var coords = getCoordsFromTile(e.path[0]);

        var dirX = (coords.x - e.x);
        var dirY = (coords.y - e.y);

        e.rot = Math_atan2(dirY, dirX) + Math_PI/2;

        dirX = (dirX == 0 ? 0 : (dirX > 0 ? universe.enemySpeed : -universe.enemySpeed));
        e.x += dirX * delta;

        dirY = (dirY == 0 ? 0 : (dirY > 0 ? universe.enemySpeed : -universe.enemySpeed));
        e.y += dirY * delta;

        checkCollide(e, 10);
    }
];


function clasePlayerIfClose(enemy)
{
    var theshSq = universe.enemyChaseDist * universe.enemyChaseDist;

    var distSq = Math_pow(player.x - enemy.x, 2) + Math_pow(player.y - enemy.y, 2);
    if (distSq < theshSq) {
        enemy.behaviour = ENEMY_BEHAVE_CHASE;
        enemy.pathAge = 2;
    }
}


Enemy.prototype.takeDamage = function(bullet) {
    this.health -= bullet.strength;

    if (this.health < 0 && this.alive) {
        this.alive = false;
        player.kills += 1;
        playSound('7', 0.5);
        overlayWords.push(new WordLift(this.x, this.y, '+' + SCORE_KILL, '#08621E'));
    }
};

        this.y = y * universe.tileSize;
        this.rot = 0;
        this.vel = 0;
        invincWait = 3;
    };

    this.setWeapon = function(i) {
        weapon = i;
    };

    this.render = function(ctx) {
        ctx.translate(player.x, player.y);
        ctx.rotate(player.rot + walkWobbleRot);

        ctx.drawImage(
            img,
            weapon * 52, 0, 52, 31,
            -HALF_PLAYER_SIZE - 22, -HALF_PLAYER_SIZE, 52, 31
        );

        ctx.rotate(-player.rot - walkWobbleRot);
        ctx.translate(-player.x, -player.y);
    };

    this.update = function(delta) {
        if (fireWait > 0) fireWait -= delta;
        if (invincWait > 0) invincWait -= delta;

        if (keys.y != 0) {
            walkWobbleRot += walkWobbleDir;
            if (Math_abs(walkWobbleRot) > 0.05) {
                walkWobbleDir = -walkWobbleDir;
            }
        }

        if (health < 10) {
            health += 0.1 * delta;
        }
    };

    this.changeWeapon = function() {
        var index = player.availWeapons.indexOf(weapon);
        index++;
        if (index == player.availWeapons.length) {
            index = 0;
        }
        weapon = player.availWeapons[index];
    };

    this.fire = function(delta) {
        if (fireWait > 0) return;

        var aheadPx = 40;
        var sidePx = 8;     // weapon is off-centre

        var x = this.x - (Math_cos(this.rot) * aheadPx) - (Math_cos(this.rot - Math_PI / 2) * sidePx);
        var y = this.y - (Math_sin(this.rot) * aheadPx) - (Math_sin(this.rot - Math_PI / 2) * sidePx);

        if (weapon == 0) {
            // Shotgun gets 4x extra bullets
            for (var i = -2; i <= 2; ++i) {
                bullets.push(
                    new Bullet(x, y, this.rot + Math_PI + (i * 0.1), weapons[weapon].vel + player.vel)
                );
            }
            playSound('a', 1.0);
        } else {
            bullets.push(
                new Bullet(x, y, this.rot + Math_PI, weapons[weapon].vel + player.vel)
            );
            playSound('c', weapon == 2 ? 0.8 : 2.0);
        }

        fireWait = weapons[weapon].delay;
    };


    this.takeDamage = function(enemy) {
        if (invincWait > 0) return;

        health -= enemy.damage;
        if (health <= 0) {
            player.lives--;
            health = 10;

            if (player.lives == 0) {
                cleanupExistingMap();
                heavenUniverse();
            }

            playSound('4', 1.0);
            overlayWords.push(new WordGrowCenter('DEAD', '#620A08'));
        } else {
            overlayWords.push(new WordLift(this.x, this.y, 'OUCH', '#620A08'));
        }

        invincWait = 1;
    };
}

<script>var black_hole_particles = [];


function BlackHole(x, y) {
    this.x = x * universe.tileSize;
    this.y = y * universe.tileSize;

    this.dist = 0;
    this.strength = 0;

    this.render = function(ctx) {
        ctx.translate(this.x, this.y);

        var part, pos;
        ctx.strokeStyle = Color_White;
        ctx.fillStyle = Color_White;
        for (var i = 0; i < black_hole_particles.length; ++i) {
            part = black_hole_particles[i];

            pos = getRotVel(part.rot, part.dist + 37);

            ctx.globalAlpha = 1.0 - (part.dist / 100);

            if (part.dist < 25) {
                ctx.fillRect(pos.x, pos.y, 1, 1);
            } else {
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);

                pos = getRotVel(part.rot + 0.05, part.dist + 35);
                ctx.lineTo(pos.x, pos.y);

                ctx.stroke();
            }
        }

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = Color_Black;
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, 2 * Math_PI);
        ctx.fill();
        ctx.stroke();

        ctx.translate(-this.x, -this.y);
    };
}


BlackHole.setupParticles = function() {
    for (var i = 0; i < 250; ++i) {
        black_hole_particles.push({
            rot: getRandom(0, Math_PI * 2),
            dist: getRandom(0, 98)
        });
    }
};


BlackHole.updateParticles = function(delta) {
    for (var i = 0; i < black_hole_particles.length; ++i) {
        var p = black_hole_particles[i];

        p.rot += (1.0 / p.dist * 70) * delta;    // spin
        p.dist -= 20.0 * delta;   // fall inwards

        if (p.dist <= 0) {
            p.rot = getRandom(0, Math_PI * 2),
            p.dist = 100;
        }
    }
};
</script>
<script>function Bullet(x, y, rot, vel) {
    this.x = x;
    this.y = y;
    this.rot = rot;
    this.vel = vel;
    this.dir = getRotVel(rot, vel);
    this.alive = true;
    this.strength = 1.0;
}


Bullet.prototype.render = function(ctx) {
    ctx.globalAlpha = this.strength;
    ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
};


Bullet.prototype.update = function(delta) {
    this.x += this.dir.x * delta;
    this.y += this.dir.y * delta;

    if (this.x < 0 || this.y < 0 || this.x > universe.mapWidth * universe.tileSize || this.y > universe.mapHeight * universe.tileSize) {
        this.alive = false;
    }

    checkCollideTiny(this, function() {
        this.rot += getRandom(0, Math_PI * 2);
        this.dir = getRotVel(this.rot, this.vel);
        this.strength -= 0.1;
    });

    this.strength -= 0.01;
    if (this.strength < 0.01) {
        this.alive = false;
    }
};
</script>

<script>function WordLift(x, y, text, color) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.alive = true;
    this.age = 0;
}

WordLift.prototype.update = function(word, delta) {
    word.y -= 100 * delta;
    word.age += delta;
    if (word.age > 1) word.alive = false;
};

WordLift.prototype.render = function(word, ctx) {
    if (!word.alive) return;
    ctx.fillStyle = this.color;
    ctx.fillText(word.text, word.x, word.y);
};


function WordStatic(x, y, text) {
    this.x = x;
    this.y = y;
    this.text = text;
}

WordStatic.prototype.render = function(word, ctx) {
    ctx.fillStyle = Color_White;
    ctx.fillText(word.text, word.x, word.y);
};



function WordGrowCenter(text, color) {
    this.text = text;
    this.color = color;
    this.alive = true;
    this.age = 0;
}

WordGrowCenter.prototype.update = function(word, delta) {
    word.age += delta;
    if (word.age > 1) word.alive = false;
};

WordGrowCenter.prototype.render = function(word, ctx) {
    if (!word.alive) return;

    var fontSize = (word.age * word.age * 250) + 12;
    var opacity = 1.0 - word.age;

    ctx.font = fontSize + 'px monospace';
    ctx.globalAlpha = opacity;
    ctx.fillStyle = word.color;

    var metrics = ctx.measureText(word.text);
    ctx.fillText(word.text, (canvas.width - metrics.width) / 2 - offset.x, (canvas.height - fontSize) / 2 - offset.y);

    ctx.font = '12px monospace';
    ctx.globalAlpha = 1.0;
};
</script>

<script>window.onresize = resizeRenderCanvas;


var lastTs = 0;
var running = false;
function tick(timestamp) {
	var delta = timestamp - lastTs;
	lastTs = timestamp;

	// If the GC causes too much time delay, just throw the excess
	// time away because the physics engine goes spaz on big deltas
	if (delta > (2 * 16.66)) {
		delta = (2 * 16.66);
	}

	if (blackHoleAnim < 0) {
		physics(delta / 1000);
	} else {
		blackHoleAnimation(delta / 1000);
	}

	render();

	requestAnimationFrame(tick);
}


resizeRenderCanvas();
astarCreateGrid(100, 100);
BlackHole.setupParticles();
player = new Player();
menu();


function postMapLoad() {
	initUniverse();
	initRender();

	if (!running) {
		lastTs = performance.now();
		requestAnimationFrame(tick);
	}

	running = true;
}
</script>
