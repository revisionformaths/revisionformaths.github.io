<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orange Ember</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05060f; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; border-radius: 8px;
    box-shadow: 0 0 80px rgba(255, 120, 30, .25), 0 0 24px rgba(60, 80, 200, .20);
    touch-action: none; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
'use strict';

/* =========================================================
   ORANGE EMBER
   A fire burns in the cold woods. A unicorn keeps it alive.
   ========================================================= */

const W = 960, H = 540;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------------- math helpers ---------------- */
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const pick  = arr => arr[randi(0, arr.length - 1)];
const TAU = Math.PI * 2;

/* =========================================================
   SOUND  — clean, quiet, all synthesized
   ========================================================= */
const Sound = (() => {
  let actx = null, master = null, started = false, muted = false;
  let noiseBuf = null;
  let droneGain = null, droneStop = null;

  function init() {
    if (actx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.10;
      master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  function resume() {
    init();
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    started = true;
  }
  function ready() { return actx && started && !muted; }
  function now()   { return actx.currentTime; }

  function env(g, peak, attack, decay, t0) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }

  function blip(o) {
    if (!ready()) return;
    const { freq = 440, freqEnd, dur = 0.12, gain = 0.2,
            type = 'sine', attack = 0.006, delay = 0 } = o || {};
    const t0 = now() + delay;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd && freqEnd > 0) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    env(g, gain, attack, dur, t0);
    osc.connect(g); g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + attack + 0.06);
  }

  function noise(o) {
    if (!ready()) return;
    const { dur = 0.15, gain = 0.1, freq = 400, q = 1, type = 'bandpass' } = o || {};
    if (!noiseBuf) {
      const len = Math.floor(actx.sampleRate * 0.5);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = now();
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = actx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = actx.createGain();
    env(g, gain, 0.006, dur, t0);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.08);
  }

  return {
    resume,
    isMuted: () => muted,
    toggleMute() {
      muted = !muted;
      if (master) {
        const t = now();
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.10, t + 0.15);
      }
      return muted;
    },

    step()  { blip({ freq: 130, freqEnd: 80, dur: 0.05, gain: 0.05, type: 'sine' }); },
    jump()  { blip({ freq: 320, freqEnd: 560, dur: 0.11, gain: 0.10, type: 'sine' }); },
    land()  { blip({ freq: 150, freqEnd: 90, dur: 0.07, gain: 0.09, type: 'sine' }); },
    snap()  {
      noise({ dur: 0.08, gain: 0.10, freq: 1800, q: 1.2 });
      blip({ freq: 780, freqEnd: 420, dur: 0.09, gain: 0.09, type: 'triangle' });
    },
    flare() {
      noise({ dur: 0.55, gain: 0.11, freq: 500, q: 0.7, type: 'lowpass' });
      blip({ freq: 180, freqEnd: 90, dur: 0.5, gain: 0.14, type: 'sine' });
      blip({ freq: 640, freqEnd: 1200, dur: 0.35, gain: 0.07, type: 'sine' });
    },
    fireout() {
      blip({ freq: 200, freqEnd: 50, dur: 1.2, gain: 0.20, type: 'sine' });
      noise({ dur: 0.8, gain: 0.06, freq: 200, q: 0.5, type: 'lowpass' });
    },
    dawn() {
      blip({ freq: 392, dur: 1.4, gain: 0.10, type: 'sine' });
      blip({ freq: 523, dur: 1.6, gain: 0.09, type: 'sine', delay: 0.15 });
      blip({ freq: 659, dur: 1.8, gain: 0.08, type: 'sine', delay: 0.30 });
      blip({ freq: 784, dur: 2.0, gain: 0.06, type: 'sine', delay: 0.50 });
    },
    uiTap() { blip({ freq: 480, freqEnd: 440, dur: 0.045, gain: 0.08, type: 'sine' }); },

    startDrone() {
      if (!ready() || droneGain) return;
      const t0 = now();
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.030, t0 + 2.0);
      g.connect(master);

      const o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 62;
      const g1 = actx.createGain(); g1.gain.value = 0.9;
      o1.connect(g1); g1.connect(g);

      const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 93;
      const g2 = actx.createGain(); g2.gain.value = 0.35;
      o2.connect(g2); g2.connect(g);

      const lfo = actx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.18;
      const lg = actx.createGain(); lg.gain.value = 1.4;
      lfo.connect(lg); lg.connect(o1.frequency);

      o1.start(); o2.start(); lfo.start();
      droneGain = g;
      droneStop = () => {
        try { o1.stop(); o2.stop(); lfo.stop(); } catch (e) {}
      };
    },
    setDroneLevel(v) {
      if (!droneGain || !actx) return;
      const t = now();
      droneGain.gain.cancelScheduledValues(t);
      droneGain.gain.setValueAtTime(Math.max(droneGain.gain.value, 0.0001), t);
      droneGain.gain.linearRampToValueAtTime(0.004 + 0.036 * clamp(v, 0, 1), t + 0.4);
    },
    stopDrone() {
      if (!droneGain || !actx) return;
      const t = now();
      droneGain.gain.cancelScheduledValues(t);
      droneGain.gain.setValueAtTime(Math.max(droneGain.gain.value, 0.0001), t);
      droneGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      const stopFn = droneStop;
      setTimeout(() => { if (stopFn) stopFn(); }, 1400);
      droneGain = null; droneStop = null;
    }
  };
})();

/* =========================================================
   KEYBOARD
   ========================================================= */
const keys = Object.create(null);
const pressed = Object.create(null);
let advanceRequest = false;

const KEYMAP = {
  ArrowLeft: 'left',  KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump',    KeyW: 'jump',   Space: 'jump',
  KeyE: 'pick',       Enter: 'pick',
  KeyR: 'restart',    KeyM: 'mute'
};

window.addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  Sound.resume();
  if (e.repeat) return;
  if (a === 'mute') { Sound.toggleMute(); return; }
  if (a === 'jump' || a === 'restart' || a === 'pick') advanceRequest = true;
  if (!keys[a]) pressed[a] = true;
  keys[a] = true;
});
window.addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  keys[a] = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* =========================================================
   TOUCH / SWIPE
   ========================================================= */
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

let swipeMoveDir = 0;
let swipeStart = null;

const SWIPE_MIN_DIST = 55;
const SWIPE_MAX_TIME = 550;
const TAP_MAX_DIST   = 22;
const TAP_MAX_TIME   = 320;

function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top)  * (H / rect.height)
  };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.resume();
  if (state === 'intro' || state === 'lost' || state === 'won') {
    advanceRequest = true;
    return;
  }
  if (state === 'playing' && e.pointerType === 'touch') {
    const p = canvasPoint(e);
    swipeStart = { x: p.x, y: p.y, t: performance.now() };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  }
});

canvas.addEventListener('pointerup', e => {
  if (state !== 'playing' || e.pointerType !== 'touch') { swipeStart = null; return; }
  if (!swipeStart) return;
  e.preventDefault();

  const p = canvasPoint(e);
  const dx = p.x - swipeStart.x;
  const dy = p.y - swipeStart.y;
  const dt = performance.now() - swipeStart.t;
  const dist = Math.hypot(dx, dy);

  if (dt <= SWIPE_MAX_TIME && dist >= SWIPE_MIN_DIST) {
    if (Math.abs(dx) > Math.abs(dy) * 1.2) {
      swipeMoveDir = dx > 0 ? 1 : -1;
    } else if (dy < 0) {
      pressed.jump = true;
    } else {
      swipeMoveDir = 0;
    }
  } else if (dist <= TAP_MAX_DIST && dt <= TAP_MAX_TIME) {
    pressed.pick = true;
  }
  swipeStart = null;
});

canvas.addEventListener('pointercancel', () => { swipeStart = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   CONSTANTS
   ========================================================= */
const GROUND_Y = 430;

const DAWN_TIME  = 30;              // seconds until morning
const FIRE_MAX   = 100;
const FIRE_BURN  = 100 / 35;         // full fire lasts ~50 seconds

const MOVE_SPEED = 300;
const CARRY_MULT = 1.2;
const GRAVITY    = 1900;
const JUMP_V     = 720;
const DOUBLE_V   = 630;

const PICK_RANGE = 92;
const DROP_RANGE = 95;

const BRANCH_FUEL = { twig: 18, branch: 36, bough: 60 };
const BRANCH_LEN  = { twig: 34, branch: 58, bough: 84 };
const BRANCH_W    = { twig: 4,  branch: 6,  bough: 8  };

const FIRE_X = 0;

/* =========================================================
   GAME STATE
   ========================================================= */
let state = 'intro';

let t = 0;
let elapsed = 0;
let dawnProgress = 0;

let camera = { x: 0 };

let player = null;
let trees = [];
let leaves = [];
let particles = [];
let flyingBranches = [];
let fireParticles = [];
let stars = [];

let fire = {
  fuel: FIRE_MAX,
  flare: 0
};

let shake = 0;
let stepTimer = 0;

let introStep = 0;
let introT = 0;
let introFade = 0;
let introOutro = 0;

let endTimer = 0;

let best = Number(localStorage.getItem('orangeEmberBest') || 0);
let lastFed = 0;

/* =========================================================
   WORLD BUILD
   ========================================================= */
function buildWorld() {
  trees = [];
  leaves = [];
  stars = [];

  /* stars */
  for (let i = 0; i < 140; i++) {
    stars.push({
      x: rand(0, W),
      y: rand(0, GROUND_Y - 40),
      r: rand(0.4, 1.6),
      a: rand(0.25, 0.9),
      ph: rand(0, TAU)
    });
  }

  /* leaves on the ground */
  const leafCols = ['#b85a1a', '#c8762a', '#a84a10', '#d08838', '#8a3a08', '#e09848'];
  for (let i = 0; i < 900; i++) {
    leaves.push({
      x: rand(-600, 3200),
      y: GROUND_Y + rand(2, 118),
      r: rand(2.5, 6.5),
      rot: rand(0, TAU),
      color: pick(leafCols),
      a: rand(0.35, 0.95)
    });
  }

  /* trees */
  let x = 260;
  while (x < 2500) {
    const r = Math.random();
    let type;
    if (r < 0.55) type = 'sapling';
    else if (r < 0.87) type = 'mature';
    else type = 'old';

    trees.push(makeTree(x, type));

    if (type === 'sapling')       x += 120 + Math.random() * 90;
    else if (type === 'mature')   x += 200 + Math.random() * 130;
    else                          x += 320 + Math.random() * 160;
  }
}

function makeTree(x, type) {
  const maxBranches = type === 'sapling' ? 2 : type === 'mature' ? 3 : 2;
  const trunkH = type === 'sapling' ? 70 : type === 'mature' ? 140 : 200;
  const slots = [];

  for (let i = 0; i < maxBranches; i++) {
    const frac = (i + 1) / (maxBranches + 1);
    slots.push({
      y: -trunkH * frac,
      angle: (i % 2 === 0 ? -1 : 1) * (0.45 + Math.random() * 0.4),
      len: (type === 'sapling' ? 34 : type === 'mature' ? 58 : 82) * (0.8 + Math.random() * 0.4),
      seed: Math.random() * 100
    });
  }

  return {
    x, type, trunkH, slots,
    branches: maxBranches,
    maxBranches,
    seed: Math.random() * 1000,
    sway: Math.random() * TAU,
    shakeAmt: 0
  };
}

/* =========================================================
   RESET / START
   ========================================================= */
function startGame() {
  buildWorld();

  state = 'playing';
  t = 0;
  elapsed = 0;
  dawnProgress = 0;
  shake = 0;
  stepTimer = 0;
  lastFed = 0;

  fire = { fuel: FIRE_MAX, flare: 0 };

  particles = [];
  flyingBranches = [];
  fireParticles = [];

  player = {
    x: 120, y: GROUND_Y - 50, w: 44, h: 50,
    vx: 0, vy: 0,
    onGround: true,
    facing: 1,
    jumps: 0,
    coyote: 0,
    buffer: 0,
    carrying: null,
    pickTimer: 0,
    pickTarget: null,
    headDip: 0,
    runPhase: 0
  };

  camera.x = player.x - W * 0.5;

  swipeMoveDir = 0;
  swipeStart = null;
  introOutro = 0;
  endTimer = 0;

  Sound.startDrone();
  Sound.setDroneLevel(1);
}

/* =========================================================
   UPDATE — PLAYER
   ========================================================= */
function updatePlayer(dt) {
  /* pick animation freeze */
  if (player.pickTimer > 0) {
    const prev = player.pickTimer;
    player.pickTimer -= dt;
    player.vx = 0;
    player.headDip = Math.min(1, player.headDip + dt * 6);

    if (prev > 0.16 && player.pickTimer <= 0.16 && player.pickTarget) {
      const tree = player.pickTarget;
      if (tree && tree.branches > 0) {
        tree.branches--;
        tree.shakeAmt = 1;
        const btype = tree.type === 'sapling' ? 'twig'
                    : tree.type === 'mature' ? 'branch' : 'bough';
        player.carrying = { type: btype, sway: 0 };

        Sound.snap();

        /* burst of leaves off the tree */
        const sx = tree.x;
        const sy = GROUND_Y + tree.slots[tree.branches]?.y || GROUND_Y - 100;
        addParticles(sx, sy - 20, 18, {
          angle: 0, spread: Math.PI,
          speedMin: 40, speedMax: 200,
          lifeMin: 0.5, lifeMax: 1.3,
          sizeMin: 2, sizeMax: 5,
          colors: ['#ff8c1a', '#e05a10', '#ffb347', '#c8762a'],
          grav: 320
        });
        shake = Math.max(shake, 4);
      }
      player.pickTarget = null;
    }

    if (player.pickTimer <= 0) {
      player.pickTimer = 0;
      player.pickTarget = null;
    }
    player.headDip = Math.max(0, player.headDip - dt * 5);
    return;
  }

  player.headDip = Math.max(0, player.headDip - dt * 5);

  const left  = !!keys.left  || swipeMoveDir < 0;
  const right = !!keys.right || swipeMoveDir > 0;

  const speedMult = player.carrying ? CARRY_MULT : 1;
  const targetVX = ((right ? 1 : 0) - (left ? 1 : 0)) * MOVE_SPEED * speedMult;
  const accel = player.onGround ? 15 : 9;
  player.vx += (targetVX - player.vx) * Math.min(1, accel * dt);

  if (Math.abs(player.vx) > 10) player.facing = player.vx > 0 ? 1 : -1;

  /* jump */
  if (pressed.jump) player.buffer = 0.14;
  player.buffer -= dt;
  player.coyote -= dt;
  if (player.onGround) player.coyote = 0.12;

  const maxJumps = player.carrying ? 1 : 2;

  if (player.buffer > 0) {
    if (player.onGround || player.coyote > 0) {
      player.vy = -JUMP_V;
      player.onGround = false;
      player.coyote = 0;
      player.buffer = 0;
      player.jumps = 1;
      Sound.jump();
      addParticles(player.x, player.y + player.h, 8, {
        angle: -Math.PI / 2, spread: 1.0,
        speedMin: 30, speedMax: 110,
        lifeMin: 0.2, lifeMax: 0.5,
        sizeMin: 1, sizeMax: 2.5,
        colors: ['#8899cc', '#aabbdd'],
        grav: 260
      });
    } else if (player.jumps < maxJumps) {
      player.vy = -DOUBLE_V;
      player.jumps = 2;
      player.buffer = 0;
      Sound.jump();
      addParticles(player.x, player.y + player.h, 12, {
        angle: Math.PI / 2, spread: Math.PI,
        speedMin: 50, speedMax: 160,
        lifeMin: 0.25, lifeMax: 0.6,
        sizeMin: 1.5, sizeMax: 3,
        colors: ['#ccd8ff', '#ffffff'],
        grav: 200
      });
    }
  }

  /* pick */
  if (pressed.pick && !player.carrying) {
    const tree = nearestTree();
    if (tree && Math.abs(tree.x - player.x) < PICK_RANGE && tree.branches > 0) {
      player.pickTimer = 0.42;
      player.pickTarget = tree;
      player.facing = tree.x > player.x ? 1 : -1;
    }
  }

  /* physics */
  player.x += player.vx * dt;
  player.vy += GRAVITY * dt;
  player.vy = Math.min(player.vy, 1400);
  player.y += player.vy * dt;

  const wasAir = !player.onGround;

  if (player.y + player.h >= GROUND_Y) {
    player.y = GROUND_Y - player.h;
    player.vy = 0;
    if (wasAir) {
      Sound.land();
      addParticles(player.x, GROUND_Y, 10, {
        angle: -Math.PI / 2, spread: Math.PI,
        speedMin: 40, speedMax: 130,
        lifeMin: 0.2, lifeMax: 0.5,
        sizeMin: 1, sizeMax: 2.5,
        colors: ['#8899cc', '#aabbdd'],
        grav: 300
      });
    }
    player.onGround = true;
    player.jumps = 0;
  } else {
    player.onGround = false;
  }

  /* running leaf kick-up */
  if (player.onGround && Math.abs(player.vx) > 60) {
    player.runPhase += dt * Math.abs(player.vx) * 0.05;
    stepTimer -= dt;
    if (stepTimer <= 0) {
      stepTimer = 0.22;
      Sound.step();
      for (let i = 0; i < 2; i++) {
        addParticles(player.x + rand(-10, 10), GROUND_Y - 2, 1, {
          angle: -Math.PI / 2 + rand(-0.6, 0.6), spread: 0.4,
          speedMin: 30, speedMax: 90,
          lifeMin: 0.4, lifeMax: 0.9,
          sizeMin: 1.5, sizeMax: 3,
          colors: ['#ff8c1a', '#c8762a', '#e05a10'],
          grav: 380
        });
      }
    }
  }

  /* carry sway */
  if (player.carrying) {
    player.carrying.sway = Math.sin(t * 9) * 0.06 + player.vx * 0.0004;
  }

  /* drop into fire */
  if (player.carrying && Math.abs(player.x - FIRE_X) < DROP_RANGE) {
    flyingBranches.push({
      x: player.x,
      y: player.y + 8,
      tx: FIRE_X + rand(-10, 10),
      ty: GROUND_Y - 40,
      t: 0,
      dur: 0.45,
      type: player.carrying.type
    });
    player.carrying = null;
  }
}

function nearestTree() {
  let best = null, bd = Infinity;
  for (const tr of trees) {
    const d = Math.abs(tr.x - player.x);
    if (d < bd && tr.branches > 0) { bd = d; best = tr; }
  }
  return best;
}

/* =========================================================
   UPDATE — FIRE
   ========================================================= */
function updateFire(dt) {
  fire.fuel -= FIRE_BURN * dt;
  fire.flare = Math.max(0, fire.flare - dt * 1.3);

  if (fire.fuel <= 0 && state === 'playing') {
    fire.fuel = 0;
    lose();
    return;
  }
  if (fire.fuel > FIRE_MAX) fire.fuel = FIRE_MAX;

  Sound.setDroneLevel(fire.fuel / FIRE_MAX);

  /* rising embers */
  const fuel01 = fire.fuel / FIRE_MAX;
  const rate = 6 + 40 * fuel01 + fire.flare * 60;
  if (Math.random() < dt * rate) {
    particles.push({
      x: FIRE_X + rand(-18, 18),
      y: GROUND_Y - rand(20, 20 + 200 * fuel01),
      vx: rand(-20, 20),
      vy: rand(-110, -40),
      life: rand(0.6, 1.6),
      maxLife: 1.6,
      size: rand(0.9, 2.4),
      color: pick(['#ffb347', '#ff8c1a', '#ffd166', '#ff6b1a', '#ffe0a0']),
      grav: 70
    });
  }

  /* flare sparks */
  if (fire.flare > 0.5 && Math.random() < dt * 90) {
    const a = rand(-1.9, -1.2);
    const sp = rand(180, 420);
    particles.push({
      x: FIRE_X + rand(-20, 20),
      y: GROUND_Y - 40,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.5, 1.2),
      maxLife: 1.2,
      size: rand(1.5, 3.5),
      color: pick(['#ffd166', '#ffb347', '#fff2c0']),
      grav: 320
    });
  }
}

/* =========================================================
   UPDATE — MISC
   ========================================================= */
function addParticles(x, y, n, cfg) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 500) break;
    const a = cfg.angle !== undefined
      ? cfg.angle + rand(-cfg.spread, cfg.spread)
      : rand(0, TAU);
    const sp = rand(cfg.speedMin, cfg.speedMax);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(cfg.lifeMin, cfg.lifeMax),
      maxLife: cfg.lifeMax,
      size: rand(cfg.sizeMin, cfg.sizeMax),
      color: cfg.colors[randi(0, cfg.colors.length - 1)],
      grav: cfg.grav || 0
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 0.9 * dt);
  }
  particles = particles.filter(p => p.life > 0);
}

function updateFlying(dt) {
  for (const fb of flyingBranches) {
    fb.t += dt;
    if (fb.t >= fb.dur) {
      /* landed in the fire */
      fire.fuel = Math.min(FIRE_MAX, fire.fuel + BRANCH_FUEL[fb.type]);
      fire.flare = 1;
      Sound.flare();
      shake = Math.max(shake, 9);
      lastFed++;

      /* burst of sparks */
      addParticles(FIRE_X, GROUND_Y - 50, 40 + Math.round(BRANCH_FUEL[fb.type] * 0.8), {
        angle: -Math.PI / 2, spread: 1.0,
        speedMin: 100, speedMax: 420,
        lifeMin: 0.5, lifeMax: 1.6,
        sizeMin: 1.5, sizeMax: 4,
        colors: ['#ffd166', '#ffb347', '#ff8c1a', '#fff2c0', '#ff6b1a'],
        grav: 380
      });
    }
  }
  flyingBranches = flyingBranches.filter(fb => fb.t < fb.dur);
}

function updateTrees(dt) {
  for (const tr of trees) {
    if (tr.shakeAmt > 0) tr.shakeAmt = Math.max(0, tr.shakeAmt - dt * 2.5);
  }
}

/* =========================================================
   TRANSITIONS
   ========================================================= */
function lose() {
  state = 'lost';
  endTimer = 0;
  shake = 20;
  Sound.fireout();
  Sound.stopDrone();

  best = Math.max(best, Math.floor(elapsed));
  try { localStorage.setItem('orangeEmberBest', String(Math.floor(best))); } catch (e) {}
}

function win() {
  state = 'won';
  endTimer = 0;
  Sound.dawn();
  Sound.stopDrone();

  best = Math.max(best, Math.floor(elapsed));
  try { localStorage.setItem('orangeEmberBest', String(Math.floor(best))); } catch (e) {}
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  t += dt;

  if (state === 'intro') {
    introT += dt;
    introFade = Math.min(1, introFade + dt * 3);
    if (introOutro > 0) {
      introOutro -= dt * 1.5;
      if (introOutro <= 0) startGame();
      return;
    }
    if (advanceRequest) {
      Sound.uiTap();
      if (introStep >= INTRO_BEATS - 1) introOutro = 1;
      else { introStep++; introFade = 0; }
    }
    return;
  }

  if (state === 'playing') {
    elapsed += dt;
    updatePlayer(dt);
    updateFire(dt);
    updateFlying(dt);
    updateParticles(dt);
    updateTrees(dt);

    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    /* camera */
    const targetCam = player.x - W * 0.42;
    camera.x = lerp(camera.x, targetCam, 1 - Math.exp(-7 * dt));

    /* dawn progress */
    if (elapsed >= DAWN_TIME) {
      dawnProgress = Math.min(1, dawnProgress + dt * 0.35);
      if (dawnProgress >= 1) win();
    }

    return;
  }

  if (state === 'lost' || state === 'won') {
    endTimer += dt;
    updateParticles(dt);
    updateFlying(dt);
    updateTrees(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    if (state === 'won') dawnProgress = Math.min(1, dawnProgress + dt * 0.35);

    if (endTimer > 0.8 && advanceRequest) startGame();
    return;
  }
}

/* =========================================================
   RENDER — SKY & BACKDROP
   ========================================================= */
function skyColours() {
  const d = dawnProgress;
  return {
    top: [Math.round(lerp(5, 42, d)),   Math.round(lerp(6, 26, d)),   Math.round(lerp(20, 58, d))],
    mid: [Math.round(lerp(10, 106, d)), Math.round(lerp(10, 58, d)),  Math.round(lerp(32, 90, d))],
    bot: [Math.round(lerp(20, 216, d)), Math.round(lerp(20, 138, d)), Math.round(lerp(48, 74, d))]
  };
}

function drawSky() {
  const c = skyColours();
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 30);
  g.addColorStop(0, `rgb(${c.top[0]},${c.top[1]},${c.top[2]})`);
  g.addColorStop(0.55, `rgb(${c.mid[0]},${c.mid[1]},${c.mid[2]})`);
  g.addColorStop(1, `rgb(${c.bot[0]},${c.bot[1]},${c.bot[2]})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 30);

  /* stars — fade as dawn comes */
  const starAlpha = 1 - dawnProgress;
  if (starAlpha > 0.01) {
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * 1.4 + s.ph);
      ctx.globalAlpha = s.a * tw * starAlpha;
      ctx.fillStyle = '#e6ecff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* moon */
  const moonProg = clamp(elapsed / DAWN_TIME, 0, 1);
  const moonX = W * 0.15 + moonProg * W * 0.7;
  const moonY = 120 - Math.sin(moonProg * Math.PI) * 60;
  ctx.globalAlpha = 0.85 * starAlpha;
  ctx.fillStyle = '#f2f0e0';
  ctx.beginPath();
  ctx.arc(moonX, moonY, 22, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 0.35 * starAlpha;
  ctx.fillStyle = '#c0c8e0';
  ctx.beginPath();
  ctx.arc(moonX + 6, moonY - 4, 16, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;

  /* dawn glow on the horizon */
  if (dawnProgress > 0.05) {
    const hg = ctx.createLinearGradient(0, GROUND_Y - 160, 0, GROUND_Y + 20);
    hg.addColorStop(0, `rgba(255,180,110,0)`);
    hg.addColorStop(1, `rgba(255,180,110,${0.42 * dawnProgress})`);
    ctx.fillStyle = hg;
    ctx.fillRect(0, GROUND_Y - 160, W, 180);
  }
}

/* ---------------- distant trees ---------------- */
function drawDistantTrees() {
  const layers = [
    { depth: 0.15, col: 'rgba(8,10,26,0.85)',  h: 110, step: 90 },
    { depth: 0.30, col: 'rgba(11,13,32,0.92)', h: 150, step: 120 },
    { depth: 0.50, col: 'rgba(6,7,20,0.98)',   h: 200, step: 165 }
  ];

  for (const layer of layers) {
    const off = (-camera.x * layer.depth) % layer.step;
    ctx.fillStyle = layer.col;
    for (let i = -1; i < W / layer.step + 2; i++) {
      const bx = i * layer.step + off;
      const h = layer.h * (0.7 + 0.6 * Math.abs(Math.sin((i + layer.depth * 100) * 1.7)));
      ctx.beginPath();
      ctx.moveTo(bx - layer.step * 0.6, GROUND_Y + 5);
      for (let k = 0; k <= 5; k++) {
        const px = bx - layer.step * 0.5 + (k / 5) * layer.step;
        const py = GROUND_Y - h * Math.sin((k / 5) * Math.PI * 0.9) - h * 0.15;
        ctx.lineTo(px, py);
      }
      ctx.lineTo(bx + layer.step * 0.6, GROUND_Y + 5);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* =========================================================
   RENDER — GROUND
   ========================================================= */
function drawGround() {
  /* base */
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, '#141828');
  g.addColorStop(0.4, '#0c0f1e');
  g.addColorStop(1, '#05070f');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  /* ground top edge */
  ctx.strokeStyle = 'rgba(60,70,110,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 0.5);
  ctx.lineTo(W, GROUND_Y + 0.5);
  ctx.stroke();

  /* leaves */
  for (const leaf of leaves) {
    const sx = leaf.x - camera.x;
    if (sx < -20 || sx > W + 20) continue;
    ctx.save();
    ctx.translate(sx, leaf.y);
    ctx.rotate(leaf.rot);
    ctx.globalAlpha = leaf.a;
    ctx.fillStyle = leaf.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, leaf.r, leaf.r * 0.5, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   RENDER — TREES
   ========================================================= */
function drawTrees() {
  for (const tr of trees) {
    const sx = tr.x - camera.x;
    if (sx < -200 || sx > W + 200) continue;

    const sway = Math.sin(t * 1.1 + tr.sway) * 1.6 + tr.shakeAmt * Math.sin(t * 45) * 5;
    const groundY = GROUND_Y;

    /* trunk */
    const trunkW = tr.type === 'sapling' ? 6 : tr.type === 'mature' ? 10 : 15;
    ctx.fillStyle = '#05060e';
    ctx.beginPath();
    ctx.moveTo(sx - trunkW * 0.5, groundY);
    ctx.lineTo(sx - trunkW * 0.3 + sway * 0.4, groundY - tr.trunkH);
    ctx.lineTo(sx + trunkW * 0.3 + sway * 0.4, groundY - tr.trunkH);
    ctx.lineTo(sx + trunkW * 0.5, groundY);
    ctx.closePath();
    ctx.fill();

    // branches + leaf clusters 
    for (let i = 0; i < tr.branches; i++) {
      const slot = tr.slots[i];
      const bx = sx + sway * 0.4;
      const by = groundY + slot.y;

      const angle = slot.angle + Math.sin(t * 0.9 + slot.seed) * 0.05;
      const endX = bx + Math.sin(angle) * slot.len;
      const endY = by - Math.cos(angle) * slot.len * 0.85;

      /* branch line */
      ctx.strokeStyle = '#05060e';
      ctx.lineWidth = tr.type === 'old' ? 5 : 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(
        bx + Math.sin(angle) * slot.len * 0.5,
        by - Math.cos(angle) * slot.len * 0.5 + 4,
        endX, endY
      );
      ctx.stroke();

      /* leaf cluster */
      drawLeafCluster(endX, endY, tr.type === 'sapling' ? 15 : tr.type === 'mature' ? 22 : 28, slot.seed);
    }
  }
}

function drawLeafCluster(cx, cy, r, seed) {
  const cols = ['#ff8c1a', '#e05a10', '#ffa347', '#c8762a', '#ffb84d', '#d9661c'];
  const n = 6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + seed;
    const d = r * 0.45;
    const px = cx + Math.cos(a) * d;
    const py = cy + Math.sin(a) * d * 0.65;
    ctx.fillStyle = cols[(Math.floor(seed) + i) % cols.length];
    ctx.globalAlpha = 0.88;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.62, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* soft outer glow */
  const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.5);
  gg.addColorStop(0, 'rgba(255,140,50,0.18)');
  gg.addColorStop(1, 'rgba(255,140,50,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.5, 0, TAU);
  ctx.fill();
}

/* =========================================================
   RENDER — FIRE
   ========================================================= */
function flamePath(cx, baseY, w, h, time, phase) {
  const steps = 14;
  const wobbleAmp = w * 0.4;

  ctx.beginPath();
  ctx.moveTo(cx - w, baseY);

  for (let i = 1; i <= steps; i++) {
    const tt = i / steps;
    const taper = Math.pow(1 - tt, 0.62);
    const wob = Math.sin(tt * 5 + time * 6.5 + phase) * wobbleAmp * tt;
    ctx.lineTo(cx + w * taper + wob, baseY - h * tt);
  }
  for (let i = steps - 1; i >= 0; i--) {
    const tt = i / steps;
    const taper = Math.pow(1 - tt, 0.62);
    const wob = Math.sin(tt * 5 + time * 6.5 + phase + 1.9) * wobbleAmp * tt;
    ctx.lineTo(cx - w * taper + wob, baseY - h * tt);
  }
  ctx.closePath();
}

function drawFire(sx, sy, fuel01, flare, time) {
  const baseH = 40 + 220 * fuel01;
  const baseW = 16 + 48 * fuel01;
  const h = baseH * (1 + flare * 0.7);
  const w = baseW * (1 + flare * 0.45);

  /* ground glow */
  const glowR = 100 + 280 * fuel01 + flare * 200;
  const gg = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
  gg.addColorStop(0, `rgba(255,170,70,${0.30 + flare * 0.25})`);
  gg.addColorStop(0.45, `rgba(255,110,30,${0.12 + flare * 0.12})`);
  gg.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(sx, sy, glowR, 0, TAU);
  ctx.fill();

  /* flame layers, outer → inner */
  const layers = [
    { c: 'rgba(210,60,10,0.72)', wm: 1.00, hm: 1.00, ph: 0.0 },
    { c: 'rgba(255,120,25,0.85)', wm: 0.76, hm: 0.90, ph: 1.3 },
    { c: 'rgba(255,190,60,0.92)', wm: 0.52, hm: 0.74, ph: 2.6 },
    { c: 'rgba(255,242,190,1)',   wm: 0.26, hm: 0.52, ph: 3.9 }
  ];

  for (const l of layers) {
    flamePath(sx, sy, w * l.wm, h * l.hm, time, l.ph);
    ctx.fillStyle = l.c;
    ctx.fill();
  }

  /* small flicker at the base */
  ctx.fillStyle = 'rgba(255,220,140,0.55)';
  ctx.beginPath();
  ctx.ellipse(sx, sy - 4, w * 0.55, 6, 0, 0, TAU);
  ctx.fill();

  /* ember bed */
  ctx.fillStyle = '#3a0d04';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 2, w * 1.1, 6, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,120,30,0.55)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 1, w * 0.9, 3.5, 0, 0, TAU);
  ctx.fill();
}

/* =========================================================
   RENDER — UNICORN
   ========================================================= */
const RAINBOW = ['#ff4d6d', '#ffa64d', '#ffe14d', '#5cff8f', '#4dc9ff', '#b46dff'];

function drawUnicorn(cx, cy, facing, time, vx, vy, grounded, warm, carrying, headDip, pickTimer) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(facing * 0.74, 0.74);

  const moving = Math.abs(vx) > 25 && grounded;
  const runT = time * 12;
  const legSwing = moving ? Math.sin(runT) * 6 : 0;
  const tailWave = Math.sin(time * 5.5) * 5;
  const airborne = !grounded;

  /* body colour blend — cold → warm */
  const bodyA = `rgb(${Math.round(lerp(220, 255, warm))},${Math.round(lerp(228, 226, warm))},${Math.round(lerp(255, 198, warm))})`;
  const bodyB = `rgb(${Math.round(lerp(178, 240, warm))},${Math.round(lerp(188, 208, warm))},${Math.round(lerp(228, 168, warm))})`;

  /* tail */
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = warm > 0.5 ? RAINBOW[i] : ['#8fa5e0','#96a8dc','#a0b0dc','#a8b6dc','#b0bcdc','#b8c2dc'][i];
    ctx.beginPath();
    const spread = i * 1.9;
    ctx.moveTo(-15, -26 + i * 0.7);
    ctx.quadraticCurveTo(
      -27, -30 + tailWave + spread * 0.4,
      -34 + (airborne ? -3 : 0), -14 + tailWave * 1.4 + spread
    );
    ctx.stroke();
  }

  /* far legs */
  ctx.strokeStyle = bodyA;
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  ctx.moveTo(-9, -20);
  ctx.lineTo(-12 + legSwing * 0.6, airborne ? -6 : -1);
  ctx.moveTo(-4, -20);
  ctx.lineTo(-6 - legSwing * 0.6, airborne ? -5 : -1);
  ctx.stroke();

  /* body */
  const bodyGrad = ctx.createLinearGradient(0, -36, 0, -10);
  bodyGrad.addColorStop(0, bodyA);
  bodyGrad.addColorStop(1, bodyB);
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, -24, 17, 12, -0.06, 0, TAU);
  ctx.fill();

  /* neck */
  ctx.beginPath();
  ctx.moveTo(7, -31);
  ctx.quadraticCurveTo(15, -40, 18, -46);
  ctx.lineTo(26, -42);
  ctx.quadraticCurveTo(21, -32, 14, -22);
  ctx.closePath();
  ctx.fill();

  /* near legs */
  ctx.strokeStyle = bodyA;
  ctx.lineWidth = 4.2;
  ctx.beginPath();
  ctx.moveTo(7, -20);
  ctx.lineTo(9 - legSwing * 0.6, airborne ? -6 : -1);
  ctx.moveTo(12, -20);
  ctx.lineTo(15 + legSwing * 0.6, airborne ? -5 : -1);
  ctx.stroke();

  /* mane */
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = warm > 0.5 ? RAINBOW[i] : ['#8fa5e0','#96a8dc','#a0b0dc','#a8b6dc','#b0bcdc','#b8c2dc'][i];
    ctx.beginPath();
    ctx.moveTo(14 + i * 0.5, -34 - i * 1.1);
    ctx.quadraticCurveTo(
      6 - i * 1.7 - tailWave * 0.3,
      -41 - i * 1.3,
      2 - i * 2.3,
      -30 - i * 1.5
    );
    ctx.stroke();
  }

  /* head — dips down when picking */
  const dipY = headDip * 12;
  const dipX = headDip * 6;

  ctx.fillStyle = bodyA;
  ctx.beginPath();
  ctx.ellipse(22 + dipX, -46 + dipY, 9.5, 6.8, -0.55 + headDip * 0.5, 0, TAU);
  ctx.fill();

  /* ear */
  ctx.beginPath();
  ctx.moveTo(15 + dipX, -51 + dipY);
  ctx.lineTo(18 + dipX, -60 + dipY);
  ctx.lineTo(21 + dipX, -50 + dipY);
  ctx.closePath();
  ctx.fill();

  /* horn */
  ctx.save();
  ctx.shadowColor = 'rgba(255,220,110,0.9)';
  ctx.shadowBlur = 14 + warm * 8;
  const hornGrad = ctx.createLinearGradient(24 + dipX, -52 + dipY, 32 + dipX, -70 + dipY);
  hornGrad.addColorStop(0, '#ffcf4d');
  hornGrad.addColorStop(1, '#fff6c9');
  ctx.fillStyle = hornGrad;
  ctx.beginPath();
  ctx.moveTo(24.5 + dipX, -51 + dipY);
  ctx.lineTo(29 + dipX, -53 + dipY);
  ctx.lineTo(33 + dipX, -68 + dipY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* eye */
  ctx.fillStyle = '#1a1030';
  ctx.beginPath();
  ctx.arc(25 + dipX, -47.5 + dipY, 1.9, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(25.6 + dipX, -48.2 + dipY, 0.7, 0, TAU);
  ctx.fill();

  /* carrying branch in mouth */
  if (carrying) {
    const bl = BRANCH_LEN[carrying.type];
    const bw = BRANCH_W[carrying.type];
    const swayAng = carrying.sway || 0;
    const mouthX = 30 + dipX;
    const mouthY = -42 + dipY;

    ctx.save();
    ctx.translate(mouthX, mouthY);
    ctx.rotate(-0.28 + swayAng);

    /* branch shaft */
    ctx.strokeStyle = '#6b3a10';
    ctx.lineWidth = bw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(bl * 0.5, -bl * 0.14, bl, -bl * 0.2);
    ctx.stroke();

    /* highlight on shaft */
    ctx.strokeStyle = 'rgba(200,120,50,0.5)';
    ctx.lineWidth = bw * 0.4;
    ctx.beginPath();
    ctx.moveTo(bl * 0.1, -1);
    ctx.quadraticCurveTo(bl * 0.5, -bl * 0.14 - 1, bl * 0.9, -bl * 0.2);
    ctx.stroke();

    /* small leaf clusters at the tip */
    const tipX = bl;
    const tipY = -bl * 0.2;
    const cols = ['#ff8c1a', '#e05a10', '#ffb347'];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = cols[i % cols.length];
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(tipX + Math.cos(i * 2.1) * 5, tipY + Math.sin(i * 2.1) * 4, 3.5, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* soft orange glow on the branch — it is the only warm thing on her */
    ctx.shadowColor = 'rgba(255,140,40,0.7)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,150,50,0.35)';
    ctx.beginPath();
    ctx.arc(bl * 0.5, -bl * 0.15, 5, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  /* hoof spark */
  if (moving) {
    ctx.globalAlpha = 0.4 + 0.35 * Math.sin(runT * 2);
    ctx.fillStyle = '#c8d4ff';
    ctx.beginPath();
    ctx.arc(-12 + legSwing * 0.6, -2, 2, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* =========================================================
   RENDER — PARTICLES & FLYING BRANCHES
   ========================================================= */
function drawParticles() {
  for (const p of particles) {
    const sx = p.x - camera.x;
    const sy = p.y;
    if (sx < -40 || sx > W + 40) continue;
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sx, sy, p.size * (0.4 + a * 0.7), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFlyingBranches() {
  for (const fb of flyingBranches) {
    const k = fb.t / fb.dur;
    const ease = 1 - Math.pow(1 - k, 2);
    const x = lerp(fb.x, fb.tx, ease);
    const arcH = 90 * Math.sin(ease * Math.PI);
    const y = lerp(fb.y, fb.ty, ease) - arcH;

    const sx = x - camera.x;
    const rot = ease * Math.PI * 1.4;

    const bl = BRANCH_LEN[fb.type];
    const bw = BRANCH_W[fb.type];

    ctx.save();
    ctx.translate(sx, y);
    ctx.rotate(rot);

    ctx.strokeStyle = '#6b3a10';
    ctx.lineWidth = bw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-bl * 0.5, 0);
    ctx.lineTo(bl * 0.5, 0);
    ctx.stroke();

    ctx.fillStyle = '#ff8c1a';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(bl * 0.4, 0, 3.5, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
  }
}

/* =========================================================
   RENDER — FIRE LIGHT OVERLAY
   ========================================================= */
function drawFireLight() {
  const sx = FIRE_X - camera.x;
  const sy = GROUND_Y - 30;

  if (sx < -400 || sx > W + 400) return;

  const fuel01 = fire.fuel / FIRE_MAX;
  const radius = 180 + 420 * fuel01 + fire.flare * 250;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
  g.addColorStop(0,    `rgba(255,180,80,${0.22 + fire.flare * 0.20})`);
  g.addColorStop(0.35, `rgba(255,120,40,${0.10 + fire.flare * 0.10})`);
  g.addColorStop(0.7,  `rgba(255,90,20,${0.04})`);
  g.addColorStop(1,    'rgba(255,80,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* =========================================================
   RENDER — EDGE GLOW (fire off-screen indicator)
   ========================================================= */
function drawEdgeGlow() {
  const sx = FIRE_X - camera.x;
  if (sx > -30) return;   // fire is on screen

  const fuel01 = fire.fuel / FIRE_MAX;
  const glowH = 120 + 340 * fuel01;
  const glowW = 70 + 130 * fuel01;

  const g = ctx.createLinearGradient(0, 0, glowW, 0);
  g.addColorStop(0, `rgba(255,140,50,${0.28 * fuel01 + 0.08})`);
  g.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y - glowH, glowW, glowH + 100);

  /* small flame silhouette */
  const flick = 0.85 + 0.15 * Math.sin(t * 11);
  ctx.globalAlpha = 0.55 + 0.35 * fuel01;
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.ellipse(16, GROUND_Y - 14, 7 * flick, 13 * flick * (0.6 + 0.4 * fuel01), 0, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* =========================================================
   RENDER — HUD
   ========================================================= */
function drawHUD() {
  ctx.save();

  /* dawn progress — small arc at top */
  const prog = clamp(elapsed / DAWN_TIME, 0, 1);
  const cx = W - 60, cy = 56, r = 26;

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI * 1.5);
  ctx.stroke();

  const arcCol = dawnProgress > 0
    ? `hsl(${30 + dawnProgress * 20}, 95%, ${55 + dawnProgress * 20}%)`
    : 'rgba(255,180,90,0.85)';
  ctx.strokeStyle = arcCol;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * prog);
  ctx.stroke();

  /* small moon/sun icon */
  ctx.fillStyle = dawnProgress > 0.6 ? '#ffd166' : 'rgba(230,236,255,0.85)';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, TAU);
  ctx.fill();

  ctx.font = '700 11px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(255,220,180,0.65)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('DAWN', cx, cy + r + 8);

  /* carrying indicator */
  if (player && player.carrying) {
    ctx.textAlign = 'center';
    ctx.font = '700 14px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(255,180,90,0.9)';
    ctx.fillText('CARRYING ' + player.carrying.type.toUpperCase(), W / 2, H - 40);
  }

  /* feed prompt near tree */
  if (player && !player.carrying && player.pickTimer <= 0 && state === 'playing') {
    const tree = nearestTree();
    if (tree && Math.abs(tree.x - player.x) < PICK_RANGE && tree.branches > 0) {
      const sx = tree.x - camera.x;
      const sy = GROUND_Y - tree.trunkH - 40;
      const pulse = 0.7 + 0.3 * Math.sin(t * 6);
      ctx.globalAlpha = pulse;
      ctx.font = '700 16px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#ffe9b0';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,150,50,0.9)';
      ctx.shadowBlur = 14;
      ctx.fillText(isTouch ? 'tap' : 'E', sx, sy);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  /* mute indicator */
  ctx.textAlign = 'right';
  ctx.font = '600 11px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText(Sound.isMuted() ? 'MUTED [M]' : '[M] sound', W - 28, 100);

  /* touch hints */
  if (isTouch && state === 'playing') {
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 3);
    ctx.font = '700 12px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('swipe  \u2190 \u2192   move      swipe  \u2191   jump      tap   pick', W / 2, H - 14);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* =========================================================
   RENDER — MAIN SCENE
   ========================================================= */
function drawScene() {
  drawSky();
  drawDistantTrees();
  drawGround();
  drawTrees();

  /* fire (behind player if off to the left) */
  drawFire(FIRE_X - camera.x, GROUND_Y, fire.fuel / FIRE_MAX, fire.flare, t);

  /* flying branches */
  drawFlyingBranches();

  /* player */
  if (player) {
    const fireDist = Math.abs(player.x - FIRE_X);
    const warm = clamp(1 - fireDist / 500, 0, 1);

    const sx = player.x - camera.x;
    const sy = player.y + player.h;

    /* warm aura when carrying */
    if (player.carrying) {
      ctx.save();
      ctx.globalAlpha = 0.20 + 0.10 * Math.sin(t * 5);
      const ag = ctx.createRadialGradient(sx, sy - 32, 0, sx, sy - 32, 60);
      ag.addColorStop(0, 'rgba(255,160,60,0.55)');
      ag.addColorStop(1, 'rgba(255,160,60,0)');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(sx, sy - 32, 60, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    drawUnicorn(sx, sy, player.facing, t, player.vx, player.vy,
                player.onGround, warm, player.carrying,
                player.headDip, player.pickTimer);
  }

  drawParticles();
  drawFireLight();
  drawEdgeGlow();

  /* cold blue overlay outside the fire's reach */
  const fireScreenX = FIRE_X - camera.x;
  const fuel01 = fire.fuel / FIRE_MAX;
  const darknessR = 260 + 400 * fuel01 + fire.flare * 200;
  const cold = ctx.createRadialGradient(fireScreenX, GROUND_Y - 30, 0, fireScreenX, GROUND_Y - 30, darknessR);
  cold.addColorStop(0, 'rgba(6,10,26,0)');
  cold.addColorStop(0.75, 'rgba(6,10,26,0.12)');
  cold.addColorStop(1, 'rgba(6,10,26,0.42)');
  ctx.fillStyle = cold;
  ctx.fillRect(0, 0, W, H);
}

/* =========================================================
   INTRO
   ========================================================= */
const INTRO = [
  null,
  "A fire burns in the cold woods.\nIt is the last warm thing.",
  "She carries branches in her mouth.\nThe fire does the rest.",
  "Keep it burning.\nUntil morning."
];
const INTRO_BEATS = INTRO.length;

function drawIntroFireAndUnicorn() {
  const fx = W * 0.5;
  const fy = 470;

  /* ground */
  const g = ctx.createLinearGradient(0, fy - 4, 0, H);
  g.addColorStop(0, '#141828');
  g.addColorStop(1, '#05070f');
  ctx.fillStyle = g;
  ctx.fillRect(0, fy - 4, W, H - fy + 4);

  /* few leaves */
  for (let i = 0; i < 70; i++) {
    const x = (i * 137.5) % W;
    const y = fy + ((i * 53.3) % (H - fy));
    ctx.globalAlpha = 0.4 + ((i * 17) % 50) / 100;
    ctx.fillStyle = ['#b85a1a','#c8762a','#a84a10','#d08838'][i % 4];
    ctx.beginPath();
    ctx.ellipse(x, y, 4, 2, i, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* fire */
  drawFire(fx, fy, 0.7, 0, introT);

  /* unicorn beside fire */
  ctx.save();
  ctx.translate(0, 0);
  drawUnicorn(fx + 110, fy, -1, introT, 0, 0, true, 1, null, 0, 0);
  ctx.restore();

  /* warm glow */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(fx, fy - 40, 0, fx, fy - 40, 340);
  gg.addColorStop(0, 'rgba(255,170,70,0.22)');
  gg.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawIntro() {
  /* sky */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05060f');
  g.addColorStop(0.5, '#0a0a1e');
  g.addColorStop(1, '#141828');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* stars */
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const tw = 0.5 + 0.5 * Math.sin(introT * 1.4 + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#e6ecff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawIntroFireAndUnicorn();

  const beat = introStep;
  const fade = clamp(introFade, 0, 1);
  const rise = (1 - fade) * 12;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (beat === 0) {
    ctx.fillStyle = `rgba(3,4,10,${0.55 * fade})`;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2, 180 - rise);
    const pulse = 1 + Math.sin(introT * 2.0) * 0.014;
    ctx.scale(pulse, pulse);
    ctx.font = '900 84px ui-sans-serif, system-ui, sans-serif';
    const tg = ctx.createLinearGradient(-320, 0, 320, 0);
    tg.addColorStop(0,    '#c23a08');
    tg.addColorStop(0.35, '#ff8c1a');
    tg.addColorStop(0.7,  '#ffb347');
    tg.addColorStop(1,    '#ffd166');
    ctx.fillStyle = tg;
    ctx.shadowColor = 'rgba(255,110,30,0.85)';
    ctx.shadowBlur = 48;
    ctx.fillText('ORANGE EMBER', 0, 0);
    ctx.restore();

    ctx.globalAlpha = fade;
    ctx.font = '600 18px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,200,170,0.85)';
    ctx.fillText('keep the fire alive until dawn', W / 2, 248 - rise);

    const a = 0.45 + 0.45 * Math.sin(introT * 4);
    ctx.globalAlpha = a * fade;
    ctx.font = '800 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = '#ffe9b0';
    ctx.shadowColor = '#ffb347';
    ctx.shadowBlur = 20;
    ctx.fillText(isTouch ? 'TAP TO BEGIN' : 'PRESS SPACE TO BEGIN', W / 2, 520);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

  } else {
    const bandG = ctx.createLinearGradient(0, 100, 0, 400);
    bandG.addColorStop(0, 'rgba(3,4,10,0)');
    bandG.addColorStop(0.25, 'rgba(3,4,10,0.78)');
    bandG.addColorStop(0.75, 'rgba(3,4,10,0.78)');
    bandG.addColorStop(1, 'rgba(3,4,10,0)');
    ctx.fillStyle = bandG;
    ctx.fillRect(0, 100, W, 300);

    const lines = INTRO[beat].split('\n');
    ctx.globalAlpha = fade;
    ctx.font = '500 26px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = '#f3e6d8';
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 12;
    const baseY = 220 - (lines.length - 1) * 20 - rise;
    lines.forEach((line, i) => ctx.fillText(line, W / 2, baseY + i * 40));
    ctx.shadowBlur = 0;

    if (beat === INTRO_BEATS - 1) {
      ctx.font = '600 14px ui-monospace, Menlo, monospace';
      ctx.fillStyle = 'rgba(255,220,180,0.72)';

      if (isTouch) {
        ctx.fillText('swipe  \u2190 \u2192      run', W / 2, 320);
        ctx.fillText('swipe  \u2191      jump  (only once while carrying)', W / 2, 344);
        ctx.fillText('tap      pick a branch', W / 2, 368);
      } else {
        ctx.fillText('A / D   or   \u2190 \u2192      run', W / 2, 320);
        ctx.fillText('SPACE      jump  (only once while carrying)', W / 2, 344);
        ctx.fillText('E      pick a branch', W / 2, 368);
      }

      const a = 0.5 + 0.5 * Math.sin(introT * 5);
      ctx.globalAlpha = a * fade;
      ctx.font = '800 22px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#ffe9b0';
      ctx.shadowColor = '#ffb347';
      ctx.shadowBlur = 18;
      ctx.fillText(isTouch ? 'TAP TO BEGIN' : 'PRESS SPACE TO BEGIN', W / 2, 448);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;

    } else {
      const a = 0.32 + 0.32 * Math.sin(introT * 4);
      ctx.globalAlpha = a * fade;
      ctx.font = '600 14px ui-monospace, Menlo, monospace';
      ctx.fillStyle = '#ffcf9a';
      ctx.fillText(isTouch ? 'tap to continue' : 'space to continue', W / 2, 470);
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();

  if (introOutro > 0) {
    ctx.fillStyle = `rgba(0,0,0,${clamp(1 - introOutro, 0, 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   END SCREENS
   ========================================================= */
function drawEndScreen() {
  const k = clamp(endTimer / 0.9, 0, 1);
  ctx.save();

  if (state === 'lost') {
    ctx.fillStyle = `rgba(0,2,8,${0.72 * k})`;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = k;

    ctx.font = '900 58px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = '#7a8db8';
    ctx.shadowColor = 'rgba(40,60,120,0.9)';
    ctx.shadowBlur = 30;
    ctx.fillText('THE FIRE WENT OUT', W / 2, 200);
    ctx.shadowBlur = 0;

    ctx.font = '700 18px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(200,215,240,0.75)';
    ctx.fillText('you kept it alive for', W / 2, 268);

    ctx.font = '900 46px ui-monospace, Menlo, monospace';
    ctx.fillStyle = '#e6ecff';
    ctx.fillText(Math.floor(elapsed) + 's', W / 2, 312);

    ctx.font = '700 14px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(200,215,240,0.6)';
    ctx.fillText('branches fed  ' + lastFed, W / 2, 356);

    if (endTimer > 0.8) {
      const a = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.globalAlpha = a * k;
      ctx.font = '800 22px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#ffe9b0';
      ctx.fillText(isTouch ? 'TAP TO TRY AGAIN' : 'PRESS SPACE TO TRY AGAIN', W / 2, 460);
    }
  }

  if (state === 'won') {
    /* warm wash */
    const wash = ctx.createLinearGradient(0, 0, 0, H);
    wash.addColorStop(0, `rgba(255,200,110,${0.28 * k})`);
    wash.addColorStop(1, `rgba(255,140,60,${0.20 * k})`);
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = k;

    ctx.font = '900 74px ui-sans-serif, system-ui, sans-serif';
    const tg = ctx.createLinearGradient(-260, 0, 260, 0);
    tg.addColorStop(0,    '#ffd166');
    tg.addColorStop(0.5,  '#ffb347');
    tg.addColorStop(1,    '#ff8c1a');
    ctx.fillStyle = tg;
    ctx.shadowColor = 'rgba(255,180,80,0.9)';
    ctx.shadowBlur = 46;
    ctx.fillText('DAWN', W / 2, 210);
    ctx.shadowBlur = 0;

    ctx.font = '600 20px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = 'rgb(60,30,10)';
    ctx.fillText('the fire lasted the night', W / 2, 280);

    ctx.font = '700 16px ui-monospace, Menlo, monospace';
    ctx.fillStyle = 'rgba(60,30,10,0.7)';
    ctx.fillText('branches fed  ' + lastFed, W / 2, 328);

    if (endTimer > 0.8) {
      const a = 0.5 + 0.5 * Math.sin(t * 5);
      ctx.globalAlpha = a * k;
      ctx.font = '800 22px ui-sans-serif, system-ui, sans-serif';
      ctx.fillStyle = '#5a2a08';
      ctx.fillText(isTouch ? 'TAP TO RUN AGAIN' : 'PRESS SPACE TO RUN AGAIN', W / 2, 440);
    }
  }

  ctx.restore();
}

/* =========================================================
   RENDER — ROOT
   ========================================================= */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (state === 'intro') {
    drawIntro();
    return;
  }

  const sh = shake;
  const ox = sh > 0 ? rand(-sh, sh) : 0;
  const oy = sh > 0 ? rand(-sh, sh) : 0;

  ctx.save();
  ctx.translate(ox, oy);
  drawScene();
  ctx.restore();

  drawHUD();

  if (state === 'lost' || state === 'won') drawEndScreen();
}

/* =========================================================
   LOOP
   ========================================================= */
let last = performance.now();

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();

  for (const k in pressed) delete pressed[k];
  advanceRequest = false;

  requestAnimationFrame(frame);
}

/* =========================================================
   BOOT
   ========================================================= */
(function boot() {
  /* stars for the intro scene */
  for (let i = 0; i < 140; i++) {
    stars.push({
      x: rand(0, W),
      y: rand(0, GROUND_Y - 40),
      r: rand(0.4, 1.6),
      a: rand(0.25, 0.9),
      ph: rand(0, TAU)
    });
  }

  /* dummy player for intro safety */
  player = {
    x: 0, y: 0, w: 44, h: 50,
    vx: 0, vy: 0, onGround: true, facing: 1,
    jumps: 0, coyote: 0, buffer: 0,
    carrying: null, pickTimer: 0, pickTarget: null,
    headDip: 0, runPhase: 0
  };

  requestAnimationFrame(frame);
})();

})();
</script>
