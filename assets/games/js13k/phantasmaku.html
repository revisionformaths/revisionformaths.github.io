  <title>Phantasmaku</title>
  <style>*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0f0036;overflow:hidden}
body{display:grid;place-items:center;color:#fff;font-family:monospace}
.game-shell{position:relative;width:min(100vw,75vh);aspect-ratio:3/4}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;background:#000;box-shadow:0 0 30px #000}
.volume-control{position:absolute;z-index:2;left:50%;bottom:13%;transform:translateX(-50%);display:grid;gap:8px;width:min(82%,360px);padding:10px 12px;border:1px solid #ffffff66;border-radius:7px;background:#090914dd;font-size:clamp(10px,2.2vw,14px);text-transform:uppercase}
.volume-control[hidden]{display:none}
.volume-control label{display:grid;grid-template-columns:auto minmax(100px,160px) 38px;align-items:center;gap:9px}
.volume-control input{width:100%;accent-color:#70f4d6}
.volume-control output{color:#70f4d6;text-align:right}

    <canvas id="game" width="480" height="640" aria-label="Phantasmaku"></canvas>
    <div id="volumeControl" class="volume-control">

    </div>

(function (global) {
  const defaults = {
    wave: 'sine', note: 60, gain: .25, outputVolume: 1,
    attack: .01, decay: .2, sustain: .6, release: .25, length: .35,
    noteLengthMode: 'midi', glide: 0, glideMode: 'off', vibratoRate: 0, vibratoDepth: 0,
    pitchSweep: 0, pitchTime: .08, filter: 'lowpass', cutoff: 12000, q: 0,
    noise: 0, drive: 0, delayMix: 0, delayTime: .25, feedback: .25,
    reverbMix: 0, reverbTime: 1, reverbDecay: 2
  };
  const impulseCache = new WeakMap();
  const distortionCache = new Map();
  const noiseCache = new WeakMap();

  function normalize(preset = {}) {
    return { ...defaults, ...preset };
  }

  function frequency(note) {
    return 440 * 2 ** ((note - 69) / 12);
  }

  function distortionCurve(amount) {
    if (distortionCache.has(amount)) return distortionCache.get(amount);
    const curve = new Float32Array(256);
    const strength = 1 + amount * 50;
    const scale = Math.tanh(strength);
    for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh(strength * (i * 2 / (curve.length - 1) - 1)) / scale;
    distortionCache.set(amount, curve);
    return curve;
  }

  function noiseBuffer(audio) {
    if (noiseCache.has(audio)) return noiseCache.get(audio);
    const buffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const samples = buffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    noiseCache.set(audio, buffer);
    return buffer;
  }

  function impulse(audio, duration, decay) {
    let cache = impulseCache.get(audio);
    if (!cache) impulseCache.set(audio, cache = new Map());
    const key = `${duration},${decay}`;
    if (cache.has(key)) return cache.get(key);
    const buffer = audio.createBuffer(2, Math.max(1, audio.sampleRate * duration), audio.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) ** decay;
    }
    cache.set(key, buffer);
    return buffer;
  }

  class Instrument {
    constructor(audio, preset, destination, sourceTracker) {
      this.audio = audio;
      this.preset = normalize(preset);
      this.sourceTracker = sourceTracker;
      this.input = audio.createGain();
      this.filter = audio.createBiquadFilter();
      this.filter.type = this.preset.filter;
      this.filter.frequency.value = this.preset.cutoff;
      this.filter.Q.value = this.preset.q;
      this.input.connect(this.filter);
      this.output = this.filter;
      if (this.preset.drive > 0) {
        const drive = audio.createWaveShaper();
        drive.curve = distortionCurve(this.preset.drive);
        drive.oversample = '2x';
        this.output.connect(drive);
        this.output = drive;
      }
      this.mix = audio.createGain();
      this.postOutput = audio.createGain();
      this.postOutput.gain.value = this.preset.outputVolume;
      this.output.connect(this.mix);
      this.mix.connect(this.postOutput).connect(destination);
      if (this.preset.delayMix > 0) {
        const wet = audio.createGain();
        const delay = audio.createDelay(2);
        const feedback = audio.createGain();
        wet.gain.value = this.preset.delayMix;
        delay.delayTime.value = this.preset.delayTime;
        feedback.gain.value = this.preset.feedback;
        this.output.connect(wet).connect(delay).connect(this.mix);
        delay.connect(feedback).connect(delay);
      }
      if (this.preset.reverbMix > 0) {
        const wet = audio.createGain();
        const convolver = audio.createConvolver();
        wet.gain.value = this.preset.reverbMix;
        convolver.buffer = impulse(audio, this.preset.reverbTime, this.preset.reverbDecay);
        this.output.connect(wet).connect(convolver).connect(this.mix);
      }
      if (this.preset.vibratoRate > 0 && this.preset.vibratoDepth > 0) {
        this.lfo = audio.createOscillator();
        this.lfoDepth = audio.createGain();
        this.lfo.frequency.value = this.preset.vibratoRate;
        this.lfoDepth.gain.value = this.preset.vibratoDepth;
        this.lfo.connect(this.lfoDepth);
        this.lfo.start();
        sourceTracker(this.lfo);
      }
    }

    schedule(note, start, duration, previous, velocity = 1) {
      const preset = this.preset;
      const audio = this.audio;
      const releaseStart = start + Math.max(.005, duration);
      const stopTime = releaseStart + preset.release + .08;
      const envelope = audio.createGain();
      const compensatedGain = preset.gain * velocity / (1 + preset.drive * .6);
      const attackEnd = start + preset.attack;
      const decayEnd = attackEnd + preset.decay;
      envelope.gain.setValueAtTime(0, start);
      if (releaseStart <= attackEnd) {
        envelope.gain.linearRampToValueAtTime(compensatedGain * (releaseStart - start) / preset.attack, releaseStart);
      } else {
        envelope.gain.linearRampToValueAtTime(compensatedGain, attackEnd);
        if (releaseStart <= decayEnd) {
          const progress = (releaseStart - attackEnd) / preset.decay;
          envelope.gain.linearRampToValueAtTime(compensatedGain * (1 - progress * (1 - preset.sustain)), releaseStart);
        } else {
          envelope.gain.linearRampToValueAtTime(compensatedGain * preset.sustain, decayEnd);
          envelope.gain.setValueAtTime(compensatedGain * preset.sustain, releaseStart);
        }
      }
      envelope.gain.linearRampToValueAtTime(0, releaseStart + preset.release);
      envelope.connect(this.input);

      const oscillator = audio.createOscillator();
      const oscillatorGain = audio.createGain();
      const target = frequency(note);
      const laterNote = previous && start > previous.start + .002;
      const glide = preset.glideMode !== 'off' && preset.glide > 0 && laterNote && (preset.glideMode === 'always' || previous.end >= start - .002);
      oscillator.type = preset.wave;
      oscillator.frequency.setValueAtTime(glide ? frequency(previous.note) : target * 2 ** (preset.pitchSweep / 12), start);
      const sweepEnd = start + Math.max(.005, preset.pitchTime);
      oscillator.frequency.exponentialRampToValueAtTime(target, glide ? Math.max(sweepEnd, start + preset.glide) : sweepEnd);
      if (this.lfoDepth) this.lfoDepth.connect(oscillator.detune);
      oscillatorGain.gain.value = 1 - preset.noise;
      oscillator.connect(oscillatorGain).connect(envelope);
      oscillator.start(start);
      oscillator.stop(stopTime);
      this.sourceTracker(oscillator);

      if (preset.noise > 0) {
        const noise = audio.createBufferSource();
        const noiseGain = audio.createGain();
        noise.buffer = noiseBuffer(audio);
        noise.loop = true;
        noiseGain.gain.value = preset.noise;
        noise.connect(noiseGain).connect(envelope);
        noise.start(start);
        noise.stop(stopTime);
        this.sourceTracker(noise);
      }
      return { note, start, end: start + duration, stop: stopTime };
    }

    finish(time = this.audio.currentTime) {
      if (this.lfo) this.lfo.stop(time);
    }
  }

  let audio;
  let musicMaster;
  let soundMaster;
  let song;
  let running = false;
  let nextLoopAt = 0;
  let musicVolume = savedVolume('rainbow-music-volume', savedVolume('rainbow-volume', .65));
  let soundVolume = savedVolume('rainbow-sound-volume', .75);
  const musicSources = new Set();
  const soundSources = new Set();
  const lastSound = new WeakMap();
  const soundInstruments = new WeakMap();

  function savedVolume(key, fallback) {

      return value == null || !Number.isFinite(Number(value)) ? fallback : Math.max(0, Math.min(1, Number(value)));

  function context() {
    audio ||= new AudioContext();
    if (!musicMaster) {
      musicMaster = audio.createGain();
      soundMaster = audio.createGain();
      musicMaster.gain.value = musicVolume;
      soundMaster.gain.value = soundVolume;
      musicMaster.connect(audio.destination);
      soundMaster.connect(audio.destination);
    }

  }

  function tracker(sources) {
    return source => {
      sources.add(source);
      source.addEventListener('ended', () => sources.delete(source), { once: true });
    };
  }

  const trackMusicSource = tracker(musicSources);
  const trackSoundSource = tracker(soundSources);

  function tickToSeconds(tick) {
    let seconds = 0;
    let lastTick = 0;
    let bpm = song.tempo[0]?.[1] || 120;
    for (const [tempoTick, nextBpm] of song.tempo) {
      if (tempoTick > tick) break;
      seconds += (tempoTick - lastTick) * 60 / (bpm * song.ppq);
      lastTick = tempoTick;
      bpm = nextBpm;
    }
    return seconds + (tick - lastTick) * 60 / (bpm * song.ppq);
  }

  function scheduleLoop(startTime) {
    const tracks = song.tracks.filter(track => track.notes.length);
    const loopGain = audio.createGain();
    loopGain.gain.value = .82 / Math.sqrt(Math.max(1, tracks.length));
    loopGain.connect(musicMaster);

  function unlock() {
    const current = context();
    return current.state === 'suspended' ? current.resume() : Promise.resolve();
  }

  function startMusic(newSong = song) {

    if (!song) return;
    stopMusic();
    const current = context();
    if (current.state === 'suspended') current.resume();
    running = true;
    nextLoopAt = current.currentTime + .06;
    scheduleLoop(nextLoopAt);
    nextLoopAt += song.durationSeconds;
  }

  function update() {
    if (!running || !song) return;
    const now = context().currentTime;
    if (nextLoopAt < now) nextLoopAt = now + .06;
    while (nextLoopAt - now < 1) {
      scheduleLoop(nextLoopAt);
      nextLoopAt += song.durationSeconds;
    }
  }

  function stopMusic() {
    running = false;
    for (const source of musicSources) { try { source.stop(); } catch { /* Already stopped. */ } }
    musicSources.clear();
  }

  function playSound(preset, cooldown = 0) {
    if (soundVolume <= 0) return;
    const current = context();
    if (current.state === 'suspended') current.resume();
    const start = current.currentTime + .005;
    if (start - (lastSound.get(preset) ?? -Infinity) < cooldown) return;
    lastSound.set(preset, start);
    const patch = normalize(preset);
    let instrument = soundInstruments.get(preset);
    if (!instrument) {
      instrument = new Instrument(current, patch, soundMaster, trackSoundSource);
      soundInstruments.set(preset, instrument);
    }
    instrument.schedule(patch.note, start, patch.length, undefined);
  }

  function setVolume(kind, value) {
    value = Math.max(0, Math.min(1, Number(value)));
    if (kind === 'music') musicVolume = value;
    else soundVolume = value;
    try { localStorage.setItem(`rainbow-${kind}-volume`, value); } catch { /* Local storage may be unavailable. */ }

    if (gain) gain.gain.setTargetAtTime(value, audio.currentTime, .015);

    unlock, startMusic, stopMusic, update, playSound,
    setMusicVolume: value => setVolume('music', value),
    setSoundVolume: value => setVolume('sound', value),
    getMusicVolume: () => musicVolume,
    getSoundVolume: () => soundVolume
  };
})(window);

let boss;
let clearedBoss;
let upgradeNext;
let upgradeLabel;
let gameOver;

let lastTime = 0;

soundVolumeSlider.value = GameAudio.getSoundVolume();

  soundVolumeValue.textContent = `${Math.round(soundVolumeSlider.value * 100)}%`;

}

function reset() {
  player = {
    x: W / 2, y: H - 76, r: 5, pickupR: 25, speed: 250,
    damage: 5, shotSpeed: 1020, fireRate: .0575, cooldown: 0, invulnerable: 0
  };
  playerShots = [];
  enemies = [];
  enemyShots = [];
  scoreItems = [];
  score = 0;
  nextScoreLife = 1000;
  lives = 3;
  spawnTimer = .5;
  endlessFormation = null;
  stageClock = 0;
  stageIndex = 0;
  stageNumber = 0;
  stageClearing = false;
  choosingUpgrade = false;
  upgradeOptions = [];
  upgradeChoice = 0;
  weaponLevels = [1, 0, 0, 0, 0, 0, 0];
  weaponCooldowns = weaponLevels.map(() => 0);
  abilityLevels = abilityDefinitions.map(() => 0);
  haloPhase = haloCooldown = bombs = lifeCredit = screenFlash = 0;
  bursts = [];
  enemyId = 0;
  boss = null;
  clearedBoss = -1;
  upgradeNext = 0;
  upgradeLabel = '';
  gameOver = false;
}

function circleHit(a, b, firstRadius = a.r) {
  const x = a.x - b.x;
  const y = a.y - b.y;
  const radius = firstRadius + b.r;
  return x * x + y * y < radius * radius;
}

function shotHit(enemy, shot) {
  const x = shot.x - shot.oldX;
  const y = shot.y - shot.oldY;
  const lengthSquared = x * x + y * y || 1;
  const amount = Math.max(0, Math.min(1,
    ((enemy.x - shot.oldX) * x + (enemy.y - shot.oldY) * y) / lengthSquared
  ));
  const closestX = shot.oldX + x * amount;
  const closestY = shot.oldY + y * amount;
  const dx = enemy.x - closestX;
  const dy = enemy.y - closestY;
  const radius = enemy.r + shot.r;
  return dx * dx + dy * dy < radius * radius;
}

function abilityMultiplier(index, baseBonus = .1) {
  const level = abilityLevels[index];
  return level ? 1 + baseBonus * 1.25 ** (level - 1) : 1;
}

function focused() {
  return keys.ShiftLeft || keys.ShiftRight;
}

function addScore(points) {
  score += points;
  while (score >= nextScoreLife) {
    lives++;
    nextScoreLife += 1000;
  }
}

function addPlayerShot(angle, speed, damage, extra = {}) {
  speed *= abilityMultiplier(2);
  playerShots.push({
    x: player.x, y: player.y - 25, oldX: player.x, oldY: player.y - 25,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: 4, damage: damage * abilityMultiplier(0), life: 2.5, ...extra
  });
}

function fireWeapons(dt) {
  const rate = abilityMultiplier(1);
  for (let i = 0; i < weaponCooldowns.length; i++) weaponCooldowns[i] = Math.max(0, weaponCooldowns[i] - dt);
  if (!keys.KeyZ) return;

  let level = weaponLevels[0];
  if (weaponCooldowns[0] <= 0) {
    addPlayerShot(-Math.PI / 2, player.shotSpeed, 5 * 1.25 ** (level - 1));
    weaponCooldowns[0] = player.fireRate / rate;
  }
  level = weaponLevels[1];
  if (level && weaponCooldowns[1] <= 0) {
    const count = level + 3;
    const step = (.065 + level * .012) * (focused() ? .5 : 1);
    for (let i = 0; i < count; i++) addPlayerShot(-Math.PI / 2 + (i - (count - 1) / 2) * step, 900, 4, { kind: 'prism' });
    weaponCooldowns[1] = .6133 / rate;
  }
  level = weaponLevels[2];
  if (level && weaponCooldowns[2] <= 0) {
    addPlayerShot(-Math.PI / 2, 720, 15 * 1.25 ** (level - 1), {
      kind: 'lance', r: 7 + level * 2, width: 10 + level * 4, pierce: true, hit: []
    });
    weaponCooldowns[2] = .575 / rate;
  }
  level = weaponLevels[3];
  if (level && weaponCooldowns[3] <= 0) {
    addPlayerShot(-Math.PI / 2, 480, 5.6 * 1.25 ** (level - 1), { kind: 'star', r: 6, turn: 5 });
    weaponCooldowns[3] = .3 / rate;
  }
  level = weaponLevels[4];
  if (level && weaponCooldowns[4] <= 0) {
    const count = level + 7;
    for (let i = 0; i < count; i++) {
      const angle = focused() ? -Math.PI + i * Math.PI / (count - 1) : i * Math.PI * 2 / count;
      addPlayerShot(angle, 430, 4.8, { kind: 'sparkle', r: 3 });
    }
    weaponCooldowns[4] = (1.375 - level * .125) / rate;
  }
  level = weaponLevels[6];
  if (level && weaponCooldowns[6] <= 0) {
    addPlayerShot(-Math.PI / 2, 520, 10 * 1.25 ** (level - 1), {
      kind: 'cloud', r: 8, explosion: 38 * 1.25 ** (level - 1)
    });
    weaponCooldowns[6] = .4 / rate;
  }
}

function updateHomingShot(shot, dt) {
  let target;
  let closest = Infinity;
  if (boss && !boss.entering) {
    closest = (boss.x - shot.x) ** 2 + (boss.y - shot.y) ** 2;
    target = boss;
  }
  for (const enemy of enemies) {
    if (enemy.entering) continue;
    const distance = (enemy.x - shot.x) ** 2 + (enemy.y - shot.y) ** 2;
    if (distance < closest) { closest = distance; target = enemy; }
  }
  if (!target) return;
  let angle = Math.atan2(shot.vy, shot.vx);
  const desired = Math.atan2(target.y - shot.y, target.x - shot.x);
  let difference = (desired - angle + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  angle += Math.max(-shot.turn * dt, Math.min(shot.turn * dt, difference));
  const speed = Math.hypot(shot.vx, shot.vy);
  shot.vx = Math.cos(angle) * speed;
  shot.vy = Math.sin(angle) * speed;
}

function damageEnemy(index, damage) {
  const enemy = enemies[index];
  if (!enemy || enemy.entering) return;
  enemy.hp -= damage;
  enemy.flash = .1;
  if (enemy.hp < 1) destroyEnemy(index);
}

function damageBoss(damage) {
  if (!boss || boss.entering) return;
  boss.hp -= damage;
  boss.flash = .1;
  if (boss.hp <= 0) defeatBoss();
}

function detonateCloud(shot) {
  bursts.push({ x: shot.x, y: shot.y, r: shot.explosion, life: .25 });
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (!enemy.entering && Math.hypot(enemy.x - shot.x, enemy.y - shot.y) < shot.explosion + enemy.r) damageEnemy(i, shot.damage);
  }
  if (boss && !boss.entering && Math.hypot(boss.x - shot.x, boss.y - shot.y) < shot.explosion + boss.r) damageBoss(shot.damage);
}

function haloPosition(index, count) {
  const angle = haloPhase + index * Math.PI * 2 / count;
  return { x: player.x + Math.cos(angle) * 45, y: player.y + Math.sin(angle) * 45, r: 6 };
}

function updateHalo(dt) {
  const level = weaponLevels[5];
  if (!level) return;
  const rate = abilityMultiplier(1);
  haloPhase += dt * 2 * rate;
  haloCooldown -= dt;
  if (haloCooldown > 0) return;
  const count = level + 3;
  for (let i = enemies.length - 1; i >= 0; i--) {
    for (let star = 0; star < count; star++) {
      if (circleHit(enemies[i], haloPosition(star, count))) {
        damageEnemy(i, 2 * abilityMultiplier(0));
        break;
      }
    }
  }
  if (boss && !boss.entering) {
    for (let star = 0; star < count; star++) {
      if (circleHit(boss, haloPosition(star, count))) {
        damageBoss(2 * abilityMultiplier(0));
        break;
      }
    }
  }
  haloCooldown += .3 / rate;
}

function useBomb() {
  const level = abilityLevels[7];
  if (!level || !bombs || !pressed.KeyX) return;
  bombs--;
  enemyShots.length = 0;
  for (let i = enemies.length - 1; i >= 0; i--) damageEnemy(i, 40 * 1.25 ** (level - 1));
  damageBoss(40 * 1.25 ** (level - 1));
  screenFlash = .25;
}

function spawnEnemy(type, lane) {
  const randomSpawn = type === undefined;
  if (randomSpawn) {
    const roll = Math.random();
    type = roll < .5 ? 0 : roll < .7 ? 1 : roll < .9 ? 2 : 3;
  }
  const stats = enemyTypes[type];
  const enemy = {
    id: enemyId++, type, x: lane === undefined ? 34 + Math.random() * (W - 68) : 60 + lane * 60, y: -stats.r,
    r: stats.r, hp: stats.hp, drops: stats.drops,
    vx: (Math.random() < .5 ? -1 : 1) * (45 + Math.random() * 35),
    vy: 45 + Math.random() * 30,
    fire: .6 + Math.random() * stats.fire,
    phase: Math.random() * 7, angle: 0, shotAngle: Math.random() * 7,
    entering: true, flash: 0
  };
  if (randomSpawn && type === 0 && Math.random() < .28) {
    const fromLeft = Math.random() < .5;
    enemy.x = fromLeft ? -22 : W + 22;
    enemy.y = 55 + Math.random() * 100;
    enemy.vx = fromLeft ? 55 : -55;
    enemy.vy = 26;
  } else if (type === 2) {
    chooseTarget(enemy);
  }
  enemies.push(enemy);
}

function chooseTarget(enemy) {
  enemy.targetX = 45 + Math.random() * (W - 90);
  enemy.targetY = 55 + Math.random() * (H * .48 - 55);
  enemy.moving = true;
}

function spawnEndlessWave() {
  if (!endlessFormation) {
    const formation = endlessFormations[Math.floor(Math.random() * endlessFormations.length)];
    const roll = Math.random();
    endlessFormation = {
      formation,
      lane: Math.floor(Math.random() * (8 - formation.width)),
      type: roll < .48 ? 2 : roll < .9 ? 3 : roll < .96 ? 1 : 0,
      wave: 0
    };
  }

  const current = endlessFormation;
  for (const cell of current.formation.cells) {
    if ((cell >> 3) === current.wave) spawnEnemy(current.type, current.lane + (cell & 7));
  }
  current.wave++;
  const lastCell = current.formation.cells[current.formation.cells.length - 1];
  if (current.wave > (lastCell >> 3)) {
    endlessFormation = null;
    spawnTimer = .9;
  } else {
    spawnTimer = .5;
  }
}

function addEnemyShot(enemy, angle, speed = 150) {
  enemyShots.push({
    x: enemy.x, y: enemy.y, r: 4,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed
  });
}

function shootAtPlayer(enemy, offset = 0, speed = 150) {
  addEnemyShot(enemy, Math.atan2(player.y - enemy.y, player.x - enemy.x) + offset, speed);
}

function radialShot(enemy, count, angle, speed = 150) {
  for (let i = 0; i < count; i++) addEnemyShot(enemy, angle + i * Math.PI * 2 / count, speed);
}

function startBoss(type) {
  const stats = bossTypes[type];
  boss = {
    id: enemyId++, type, x: W / 2, y: -stats.h / 2, r: stats.r,
    hp: stats.hp, maxHp: stats.hp, entering: true, flash: 0,
    time: 0, phase: 0, fire: .7, aimFire: 1.4, shotAngle: 0
  };
  enemies.length = 0;
  enemyShots.length = 0;
  playerShots.length = 0;
  bursts.length = 0;
  player.x = W / 2;
  player.y = H - 76;
  player.invulnerable = 1;
  stageClearing = false;
  clearedBoss = -1;
}

function updateBoss(dt) {
  if (!boss) return;
  const current = boss;
  current.flash = Math.max(0, current.flash - dt);
  if (current.entering) {
    current.y = Math.min(132, current.y + 90 * dt);
    if (current.y >= 132) current.entering = false;
    return;
  }
  current.time += dt;
  const lion = current.type === 1;
  current.x = W / 2 + Math.sin(current.time * (lion ? .52 : .68)) * (lion ? 115 : 100);
  current.y = 132 + Math.sin(current.time * (lion ? .8 : 1.05)) * 10;
  const phase = Math.min(2, Math.floor((1 - current.hp / current.maxHp) * 3));
  if (phase !== current.phase) {
    current.phase = phase;
    current.fire = .7;
    current.aimFire = 1;
    enemyShots.length = 0;
    screenFlash = .18;
    return;
  }
  current.fire -= dt;
  current.aimFire -= dt;
  if (current.fire <= 0) {
    if (!lion && phase === 0) {
      radialShot({ x: current.x - 34, y: current.y - 8 }, 2, current.shotAngle, 130);
      radialShot({ x: current.x + 34, y: current.y - 8 }, 2, Math.PI - current.shotAngle, 130);
      current.shotAngle += .11;
      current.fire += .12;
    } else if (!lion && phase === 1) {
      radialShot(current, 5, current.shotAngle, 130 + Math.sin(current.time * 2) * 24);
      current.shotAngle += .055 + Math.sin(current.time * 2.3) * .045;
      current.fire += .11;
    } else if (!lion) {
      radialShot(current, 6, current.shotAngle, 145);
      current.shotAngle += (Math.floor(current.time / 2.5) % 2 ? 1 : -1) * .085;
      current.fire += .12;
    } else if (phase === 0) {
      radialShot(current, 8, current.shotAngle, 125 + Math.sin(current.time * 1.7) * 20);
      current.shotAngle += .04;
      current.fire += .17;
    } else if (phase === 1) {
      radialShot(current, 3, current.shotAngle, 135);
      radialShot(current, 3, -current.shotAngle + .3, 175);
      current.shotAngle += .08;
      current.fire += .13;
    } else {
      radialShot(current, 7, current.shotAngle, 150);
      current.shotAngle += (Math.floor(current.time / 2.5) % 2 ? 1 : -1) * .07;
      current.fire += .13;
    }
  }
  if (phase === 2 && current.aimFire <= 0) {
    for (let offset = -.14; offset <= .14; offset += .14) shootAtPlayer(current, offset, lion ? 205 : 185);
    current.aimFire += lion ? 1.25 : 1.5;
  }
}

function defeatBoss() {
  const defeated = boss;
  const stats = bossTypes[defeated.type];
  GameAudio.playSound(enemyDeathSound, .025);
  for (let i = 0; i < stats.drops; i++) {
    scoreItems.push({
      x: defeated.x + (Math.random() - .5) * stats.w * .7,
      y: defeated.y + (Math.random() - .5) * stats.h * .45,
      r: 5, vx: (Math.random() - .5) * 90, vy: -45 - Math.random() * 70,
      phase: Math.random() * 7
    });
  }
  boss = null;
  clearedBoss = defeated.type;
  stageClearing = true;
  enemyShots.length = 0;
  screenFlash = .4;
}

function destroyEnemy(index) {
  const enemy = enemies[index];
  GameAudio.playSound(enemyDeathSound, .025);
  for (let i = 0; i < enemy.drops; i++) {
    scoreItems.push({
      x: enemy.x + (Math.random() - .5) * 12,
      y: enemy.y + (Math.random() - .5) * 10,
      r: 5,
      vx: (Math.random() - .5) * 45,
      vy: -35 - Math.random() * 35,
      phase: Math.random() * 7
    });
  }
  enemies.splice(index, 1);
}

function hitPlayer() {
  if (player.invulnerable > 0 || gameOver) return;
  lives--;
  enemyShots.length = 0;
  player.x = W / 2;
  player.y = H - 76;
  player.invulnerable = 2;
  if (lives < 1) {
    gameOver = true;
    GameAudio.stopMusic();
  }
}

function shuffled(items) {
  items = [...items];
  for (let i = items.length - 1; i; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function makeUpgradeOptions() {
  const ownedWeapons = weaponLevels.slice(1).filter(Boolean).length;
  const ownedAbilities = abilityLevels.filter(Boolean).length;
  const weapons = weaponDefinitions.map((definition, index) => ({
    type: 'weapon', index, definition, level: weaponLevels[index] + 1
  })).filter(option => option.level <= 3 && (weaponLevels[option.index] || ownedWeapons < 3));
  const abilities = abilityDefinitions.map((definition, index) => ({
    type: 'ability', index, definition, level: abilityLevels[index] + 1
  })).filter(option => option.level <= 3 && (abilityLevels[option.index] || ownedAbilities < 3));
  const choices = [];
  if (ownedWeapons < 3) choices.push(shuffled(weapons.filter(option => option.index && option.level === 1))[0]);
  if (ownedAbilities < 3) choices.push(shuffled(abilities.filter(option => option.level === 1))[0]);
  const used = new Set(choices.filter(Boolean).map(option => `${option.type}${option.index}`));
  for (const option of shuffled([...weapons, ...abilities])) {
    const key = `${option.type}${option.index}`;
    if (choices.length === 4) break;
    if (!used.has(key)) { choices.push(option); used.add(key); }
  }
  while (choices.length < 4) choices.push(choices.length % 2 ? {
    type: 'life', definition: { name: 'Extra Life', descriptions: ['Gain 1 life now'] }, level: 1
  } : {
    type: 'gold', definition: { name: 'Pot of Gold', descriptions: ['Gain 10000 points'] }, level: 1
  });
  return shuffled(choices);
}

function openUpgradeScreen(label, next = 0) {
  enemyShots.length = 0;
  playerShots.length = 0;
  bursts.length = 0;
  upgradeOptions = makeUpgradeOptions();
  upgradeChoice = 0;
  upgradeLabel = label;
  upgradeNext = next;
  choosingUpgrade = true;
}

function startNextStage() {
  stageNumber++;
  stageClock = 0;
  stageIndex = 0;
  stageClearing = false;
  clearedBoss = -1;
  spawnTimer = .5;
  const horseshoe = abilityLevels[4];
  if (horseshoe) {
    lifeCredit += 1.25 ** (horseshoe - 1);
    const gained = Math.floor(lifeCredit);
    lives += gained;
    lifeCredit -= gained;
  }
  if (abilityLevels[7]) bombs++;
}

function takeUpgrade(option) {
  if (option.type === 'weapon') {
    weaponLevels[option.index]++;
    weaponCooldowns[option.index] = 0;
  } else if (option.type === 'ability') {
    abilityLevels[option.index]++;
  } else if (option.type === 'gold') {
    addScore(10000);
  } else {
    lives++;
  }
  choosingUpgrade = false;
  if (upgradeNext) startBoss(upgradeNext - 1);
  else startNextStage();
}

function updateUpgradeChoice() {
  if (pressed.ArrowLeft || pressed.ArrowRight) upgradeChoice ^= 1;
  if (pressed.ArrowUp || pressed.ArrowDown) upgradeChoice ^= 2;
  for (let i = 0; i < 4; i++) if (pressed[`Digit${i + 1}`]) upgradeChoice = i;
  if (pressed.KeyZ || pressed.Enter) takeUpgrade(upgradeOptions[upgradeChoice]);
}

function update(dt) {
  if (!started) {
    if (keys.KeyZ || keys.Enter) {
      started = true;
      GameAudio.startMusic(UnicornFissionMIDI2Song);
    }
    return;
  }
  if (gameOver) {
    if (keys.KeyR) {
      reset();
      GameAudio.startMusic(UnicornFissionMIDI2Song);
    }
    return;
  }
  if (choosingUpgrade) {
    updateUpgradeChoice();
    return;
  }

  let dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  let dy = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
  if (dx || dy) {
    const length = Math.hypot(dx, dy);
    const speed = player.speed * abilityMultiplier(3) * (focused() ? .5 : 1);
    player.x += dx / length * speed * dt;
    player.y += dy / length * speed * dt;
  }
  player.x = Math.max(24, Math.min(W - 24, player.x));
  player.y = Math.max(28, Math.min(H - 28, player.y));
  player.invulnerable -= dt;
  screenFlash = Math.max(0, screenFlash - dt);
  for (let i = bursts.length - 1; i >= 0; i--) {
    bursts[i].life -= dt;
    if (bursts[i].life <= 0) bursts.splice(i, 1);
  }

  fireWeapons(dt);
  useBomb();

  if (!boss) {
    if (stageNumber < stageSpawns.length && !stageClearing) {
      stageClock = Math.min(stageDurations[stageNumber], stageClock + dt);
      const spawns = stageSpawns[stageNumber];
      while (stageIndex < spawns.length) {
        const packed = spawns.charCodeAt(stageIndex) * 256 + spawns.charCodeAt(stageIndex + 1);
        if ((packed >> 5) * .05 > stageClock) break;
        spawnEnemy(packed >> 3 & 3, packed & 7);
        stageIndex += 2;
      }
      if (stageClock >= stageDurations[stageNumber]) stageClearing = true;
    } else if (stageNumber >= stageSpawns.length && !stageClearing) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        if (endlessFormation || enemies.length < 36) spawnEndlessWave();
        else spawnTimer = .5;
      }
    }
  }
  updateBoss(dt);

  for (let i = playerShots.length - 1; i >= 0; i--) {
    const shot = playerShots[i];
    if (shot.turn) updateHomingShot(shot, dt);
    shot.oldX = shot.x;
    shot.oldY = shot.y;
    shot.x += shot.vx * dt;
    shot.y += shot.vy * dt;
    shot.life -= dt;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const stats = enemyTypes[enemy.type];
    enemy.phase += dt;
    enemy.fire -= dt;
    enemy.flash = Math.max(0, enemy.flash - dt);

    if (enemy.type === 0) {
      enemy.x += (enemy.vx + Math.sin(enemy.phase * 2) * 20) * dt;
      enemy.y += enemy.vy * dt;
      if (enemy.fire <= 0 && !enemy.entering && enemy.y < player.y) {
        shootAtPlayer(enemy);
        enemy.fire = stats.fire;
      }
    } else if (enemy.type === 2) {
      if (enemy.moving) {
        const x = enemy.targetX - enemy.x;
        const y = enemy.targetY - enemy.y;
        const distance = Math.hypot(x, y) || 1;
        const step = Math.min(distance, 90 * dt);
        enemy.x += x / distance * step;
        enemy.y += y / distance * step;
        if (distance < 2) enemy.moving = false;
      } else if (enemy.fire <= 0 && !enemy.entering && enemy.y < player.y) {
        const spread = Math.PI / 36;
        shootAtPlayer(enemy, -spread);
        shootAtPlayer(enemy);
        shootAtPlayer(enemy, spread);
        enemy.fire = stats.fire;
        chooseTarget(enemy);
      }
    } else {
      enemy.angle += (enemy.type === 1 ? .35 : .22) * dt;
      enemy.x += enemy.vx * dt;
      enemy.y += enemy.vy * dt;
      const bottom = H * .75 - enemy.r;
      if (enemy.x < enemy.r || enemy.x > W - enemy.r) {
        enemy.x = Math.max(enemy.r, Math.min(W - enemy.r, enemy.x));
        enemy.vx *= -1;
      }
      if (enemy.y > bottom || (enemy.y < enemy.r && enemy.vy < 0)) {
        enemy.y = Math.min(bottom, Math.max(enemy.r, enemy.y));
        enemy.vy *= -1;
      }
      if (enemy.fire <= 0 && !enemy.entering) {
        if (enemy.type === 1) {
          radialShot(enemy, 3, enemy.angle);
        } else {
          radialShot(enemy, 7, enemy.shotAngle);
          enemy.shotAngle += .38;
        }
        enemy.fire = stats.fire;
      }
    }

    // At these thresholds, at least three quarters of the sprite is on screen.
    if (enemy.entering && enemy.x >= stats.w / 4 && enemy.x <= W - stats.w / 4 && enemy.y >= stats.h / 4) {
      enemy.entering = false;
    }
    if (!enemy.entering && enemy.type === 0) {
      if (enemy.x < enemy.r) {
        enemy.x = enemy.r;
        if (enemy.vx < 0) enemy.vx *= -1;
      } else if (enemy.x > W - enemy.r) {
        enemy.x = W - enemy.r;
        if (enemy.vx > 0) enemy.vx *= -1;
      }
    }

    if (!enemy.entering && circleHit(player, enemy)) hitPlayer();
    if (enemy.type === 0 && (enemy.y > H + 30 || enemy.x < -60 || enemy.x > W + 60)) {
      enemies.splice(i, 1);
      continue;
    }
  }

  updateHalo(dt);
  for (let i = playerShots.length - 1; i >= 0; i--) {
    const shot = playerShots[i];
    let removed = false;
    const bossTarget = boss;
    if (bossTarget && !bossTarget.entering && !shot.hit?.includes(bossTarget.id) && shotHit(bossTarget, shot)) {
      if (shot.explosion) detonateCloud(shot);
      else damageBoss(shot.damage);
      if (shot.pierce) shot.hit.push(bossTarget.id);
      else {
        playerShots.splice(i, 1);
        removed = true;
      }
    }
    if (removed) continue;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (enemy.entering || shot.hit?.includes(enemy.id) || !shotHit(enemy, shot)) continue;
      if (shot.explosion) detonateCloud(shot);
      else damageEnemy(j, shot.damage);
      if (shot.pierce) {
        shot.hit.push(enemy.id);
      } else {
        playerShots.splice(i, 1);
        removed = true;
        break;
      }
    }
    if (!removed && (shot.life <= 0 || shot.y < -35 || shot.y > H + 35 || shot.x < -35 || shot.x > W + 35)) playerShots.splice(i, 1);
  }

  for (let i = enemyShots.length - 1; i >= 0; i--) {
    const shot = enemyShots[i];
    shot.x += shot.vx * dt;
    shot.y += shot.vy * dt;
    if (circleHit(player, shot)) {
      enemyShots.splice(i, 1);
      hitPlayer();
      // hitPlayer clears every enemy shot, so no old loop index remains valid.
      break;
    } else if (shot.y < -12 || shot.y > H + 12 || shot.x < -12 || shot.x > W + 12) {
      enemyShots.splice(i, 1);
    }
  }

  const pickupRadius = player.pickupR * abilityMultiplier(5, .25);
  const collectAll = stageClearing || player.y < COLLECTION_LINE;
  for (let i = scoreItems.length - 1; i >= 0; i--) {
    const item = scoreItems[i];
    const x = player.x - item.x;
    const y = player.y - item.y;
    const length = Math.hypot(x, y) || 1;
    if (collectAll || length < pickupRadius * 3) {
      item.magnetSpeed = Math.min(430, (item.magnetSpeed || 80) + 900 * dt);
      // Direct steering prevents momentum from carrying an item past the player.
      // The distance cap also prevents overshooting during a long frame.
      const speed = Math.min(item.magnetSpeed, length / (dt || 1));
      item.vx = x / length * speed;
      item.vy = y / length * speed;
    } else {
      item.vy += 95 * dt;
      item.vx *= 1 - Math.min(1, dt * 2);
    }
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    if (circleHit(player, item, pickupRadius)) {
      addScore(10 * abilityMultiplier(6, .2));
      GameAudio.playSound(pointSound, .025);
      scoreItems.splice(i, 1);
    } else if (item.y > H + 15) {
      scoreItems.splice(i, 1);
    }
  }
  if (stageClearing && !enemies.length && !scoreItems.length) {
    const nextBoss = clearedBoss < 0 ? stageNumber === 3 ? 1 : stageNumber === 7 ? 2 : 0 : 0;
    const label = clearedBoss < 0 ? `STAGE ${stageNumber + 1} CLEAR` : `${bossTypes[clearedBoss].name} DEFEATED`;
    openUpgradeScreen(label, nextBoss);
  }
}

function hue(time, offset = 0, lightness = 65) {
  return `hsl(${(time * .08 + offset) % 360} 100% ${lightness}%)`;
}

// originX/Y are this drawing surface's top-left position in world space.
function rainbowGradient(context, originX, originY, time, lightness = 65) {
  const gradient = context.createLinearGradient(-originX, -originY, W - originX, H - originY);
  for (let i = 0; i < 7; i++) gradient.addColorStop(i / 6, hue(time, i * 60, lightness));
  return gradient;
}

function drawPlayer(time) {
  if (player.invulnerable > 0 && Math.floor(time / 80) % 2) return;
  tint.clearRect(0, 0, 72, 72);
  // The 1.5 px vertical adjustment aligns the SVG's marker circle with player.x/y.
  if (playerImage.complete) tint.drawImage(playerImage, 7, 9.5, 58, 53);
  tint.globalCompositeOperation = 'source-in';
  tint.fillStyle = rainbowGradient(tint, player.x - 36, player.y - 36, time);
  tint.fillRect(0, 0, 72, 72);
  tint.globalCompositeOperation = 'source-over';
  ctx.drawImage(tintCanvas, player.x - 36, player.y - 36);
}

function drawEnemy(enemy, time) {
  const stats = enemyTypes[enemy.type];
  enemyTint.clearRect(0, 0, 96, 96);
  enemyTint.save();
  enemyTint.translate(48, 48);
  enemyTint.rotate(enemy.angle);
  if (enemyImages[enemy.type].complete) {
    enemyTint.drawImage(enemyImages[enemy.type], -stats.w / 2, -stats.h / 2, stats.w, stats.h);
  }
  enemyTint.restore();
  enemyTint.globalCompositeOperation = 'source-in';
  enemyTint.fillStyle = rainbowGradient(enemyTint, enemy.x - 48, enemy.y - 48, time);
  enemyTint.fillRect(0, 0, 96, 96);
  if (enemy.flash > 0) {
    enemyTint.globalCompositeOperation = 'source-atop';
    enemyTint.globalAlpha = Math.min(1, enemy.flash * 10);
    enemyTint.fillStyle = '#fff';
    enemyTint.fillRect(0, 0, 96, 96);
    enemyTint.globalAlpha = 1;
  }
  enemyTint.globalCompositeOperation = 'source-over';
  ctx.drawImage(enemyCanvas, enemy.x - 48, enemy.y - 48);
}

function drawBoss(time) {
  if (!boss) return;
  const stats = bossTypes[boss.type];
  bossTint.clearRect(0, 0, 160, 160);
  bossTint.save();
  bossTint.translate(80, 80);
  bossTint.rotate(Math.sin(boss.time * 1.5) * .025);
  if (bossImages[boss.type].complete) bossTint.drawImage(bossImages[boss.type], -stats.w / 2, -stats.h / 2, stats.w, stats.h);
  bossTint.restore();
  bossTint.globalCompositeOperation = 'source-in';
  bossTint.fillStyle = rainbowGradient(bossTint, boss.x - 80, boss.y - 80, time);
  bossTint.fillRect(0, 0, 160, 160);
  if (boss.flash > 0) {
    bossTint.globalCompositeOperation = 'source-atop';
    bossTint.globalAlpha = Math.min(1, boss.flash * 10);
    bossTint.fillStyle = '#fff';
    bossTint.fillRect(0, 0, 160, 160);
    bossTint.globalAlpha = 1;
  }
  bossTint.globalCompositeOperation = 'source-over';
  ctx.drawImage(bossCanvas, boss.x - 80, boss.y - 80);
}

function drawDiamond(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.PI / 4);
  ctx.fillRect(-size / 2, -size / 2, size, size);
  ctx.restore();
}

function drawUpgradeScreen() {
  ctx.fillStyle = '#000e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = '28px monospace';
  ctx.fillText('CHOOSE AN UPGRADE', W / 2, 92);
  ctx.font = '13px monospace';
  ctx.fillStyle = '#bbc2d8';
  ctx.fillText(upgradeLabel, W / 2, 120);

  for (let i = 0; i < upgradeOptions.length; i++) {
    const option = upgradeOptions[i];
    const x = 15 + i % 2 * 230;
    const y = 155 + Math.floor(i / 2) * 170;
    ctx.fillStyle = i === upgradeChoice ? '#263b45' : '#111522';
    ctx.fillRect(x, y, 220, 145);
    ctx.strokeStyle = i === upgradeChoice ? '#fff' : option.type === 'weapon' ? '#63f0d8' : '#c17cff';
    ctx.lineWidth = i === upgradeChoice ? 3 : 1;
    ctx.strokeRect(x, y, 220, 145);
    ctx.textAlign = 'left';
    ctx.fillStyle = option.type === 'weapon' ? '#63f0d8' : option.type === 'ability' ? '#c17cff' : '#ffd86b';
    ctx.font = '11px monospace';
    const current = option.type === 'weapon' ? weaponLevels[option.index] : option.type === 'ability' ? abilityLevels[option.index] : 0;
    ctx.fillText(`${option.type.toUpperCase()} · ${current ? `LEVEL ${option.level}` : 'NEW'}`, x + 12, y + 24);
    ctx.fillStyle = '#fff';
    ctx.font = '17px monospace';
    ctx.fillText(option.definition.name, x + 12, y + 53);
    ctx.fillStyle = '#c6cada';
    ctx.font = '12px monospace';
    ctx.fillText(option.definition.descriptions[option.level - 1] || option.definition.descriptions[0], x + 12, y + 82);
    ctx.fillStyle = '#737f9d';
    ctx.fillText(`${i + 1}`, x + 12, y + 128);
  }
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = '14px monospace';
  ctx.fillText('ARROWS TO CHOOSE · Z / ENTER TO TAKE', W / 2, 540);
  ctx.textAlign = 'left';
}

function draw(time) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const rainbow = rainbowGradient(ctx, 0, 0, time);

  // Canvas uses draw order in place of sorting layers. Pickups are drawn first
  // so every projectile, enemy, boss, and the player appears above them.
  const pointRainbow = rainbowGradient(ctx, 0, 0, time + 750, 82.5);
  for (const item of scoreItems) {
    ctx.save();
    ctx.translate(item.x, item.y);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = pointRainbow;
    const pointSize = 6 + Math.sin(time * .012 + item.phase) * 1.5;
    ctx.fillRect(-pointSize / 2, -pointSize / 2, pointSize, pointSize);
    ctx.restore();
  }

  ctx.fillStyle = rainbow;
  for (const shot of playerShots) {
    if (shot.kind === 'lance') ctx.fillRect(shot.x - shot.width / 2, shot.y - 14, shot.width, 28);
    else if (shot.kind === 'star' || shot.kind === 'sparkle') drawDiamond(shot.x, shot.y, shot.r * 2);
    else if (shot.kind === 'cloud') { ctx.beginPath(); ctx.arc(shot.x, shot.y, shot.r, 0, 7); ctx.fill(); }
    else ctx.fillRect(shot.x - 2, shot.y - 6, 4, 10);
  }

  const haloLevel = weaponLevels[5];
  if (haloLevel) {
    const count = haloLevel + 3;
    for (let i = 0; i < count; i++) {
      const star = haloPosition(i, count);
      drawDiamond(star.x, star.y, 10);
    }
  }

  for (const enemy of enemies) drawEnemy(enemy, time);
  drawBoss(time);

  for (const burst of bursts) {
    ctx.globalAlpha = Math.min(.35, burst.life * 1.4);
    ctx.beginPath();
    ctx.arc(burst.x, burst.y, burst.r * (1.25 - burst.life), 0, 7);
    ctx.fillStyle = rainbow;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const shot of enemyShots) {
    ctx.beginPath();
    ctx.arc(shot.x, shot.y, 7, 0, 7);
    ctx.fillStyle = rainbow;
    ctx.fill();
  }

  drawPlayer(time);
  if (screenFlash > 0) {
    ctx.globalAlpha = screenFlash * 2.5;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText(`SCORE ${Math.floor(score)}`, 14, 26);
  ctx.textAlign = 'right';
  ctx.fillText(`LIVES ${lives}`, W - 14, 26);
  if (abilityLevels[7] || bombs) ctx.fillText(`BOMBS ${bombs}`, W - 14, boss ? 72 : 50);
  ctx.textAlign = 'center';
  ctx.font = '14px monospace';
  ctx.fillText(boss ? 'BOSS' : stageNumber < stageSpawns.length ? `STAGE ${stageNumber + 1}` : 'ENDLESS', W / 2, 24);
  if (boss) {
    const barX = 40;
    const barY = 49;
    const barWidth = W - barX * 2;
    ctx.font = '11px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(bossTypes[boss.type].name, W / 2, 44);
    ctx.fillStyle = '#191c2b';
    ctx.fillRect(barX, barY, barWidth, 11);
    ctx.fillStyle = rainbow;
    ctx.fillRect(barX, barY, barWidth * Math.max(0, boss.hp / boss.maxHp), 11);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(barX - .5, barY - .5, barWidth + 1, 12);
  }
  if (stageClearing && !choosingUpgrade) ctx.fillText(clearedBoss < 0 ? 'FINISH THE WAVE' : 'COLLECT THE SPOILS', W / 2, 74);
  ctx.textAlign = 'left';

  if (!started) {
    ctx.fillStyle = '#000b';
    ctx.fillRect(0, H / 2 - 105, W, 210);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '30px monospace';
    ctx.fillText('PHANTASMAKU', W / 2, H / 2 - 52);
    ctx.font = '16px monospace';
    ctx.fillText('ARROWS MOVE · Z SHOOTS', W / 2, H / 2 - 8);
    ctx.fillText('X BOMB · HOLD SHIFT TO FOCUS', W / 2, H / 2 + 24);
    ctx.fillText('PRESS Z OR ENTER TO START', W / 2, H / 2 + 64);
    ctx.textAlign = 'left';
  } else if (gameOver) {
    ctx.fillStyle = '#000b';
    ctx.fillRect(0, H / 2 - 65, W, 130);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '30px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 8);
    ctx.font = '16px monospace';
    ctx.fillText('PRESS R TO RESTART', W / 2, H / 2 + 30);
    ctx.textAlign = 'left';
  } else if (choosingUpgrade) {
    drawUpgradeScreen();
  }
}

function frame(time) {
  const dt = Math.min(.033, (time - lastTime) / 1000 || 0);
  lastTime = time;
  update(dt);
  GameAudio.update();
  syncVolumeControl();
  draw(time);
  for (const code in pressed) delete pressed[code];
  requestAnimationFrame(frame);
}

addEventListener('keydown', event => {
  if ((event.target === musicVolumeSlider || event.target === soundVolumeSlider) && event.code.startsWith('Arrow')) return;
  if ((!started && (event.code === 'KeyZ' || event.code === 'Enter')) || (gameOver && event.code === 'KeyR')) GameAudio.unlock();
  if (!keys[event.code]) pressed[event.code] = true;
  keys[event.code] = true;
  if (event.code.startsWith('Arrow') || event.code.startsWith('Shift') || event.code === 'KeyZ' || event.code === 'KeyX' || event.code === 'Enter') event.preventDefault();
});
addEventListener('keyup', event => keys[event.code] = false);
addEventListener('blur', () => {
  for (const key in keys) keys[key] = false;
  for (const key in pressed) delete pressed[key];
});

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
