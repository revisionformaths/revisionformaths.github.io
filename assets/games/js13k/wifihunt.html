        <script>const kontra = {
    init(canvas) {
        // check if canvas is a string first, an element next, or default to getting
        // first canvas on page
        let canvasEl = this.canvas = document.getElementById(canvas) || canvas || document.querySelector('canvas');

        this.context = canvasEl.getContext('2d');
    },

    _noop: new Function(),

    _tick: new Function()
};

(function () {
    kontra.gameLoop = function (properties) {
        properties = properties || {};

        // animation variables
        const fps = properties.fps || 60;
        let accumulator = 0;
        const delta = 1E3 / fps; // delta between performance.now timings (in ms)
        const step = 1 / fps;

        const clear = (properties.clearCanvas === false
            ? kontra._noop
            : function clear() {
            kontra.context.clearRect(0, 0, kontra.canvas.width, kontra.canvas.height);
        });
        let last; let rAF; let now; let dt;

        function frame() {
            rAF = requestAnimationFrame(frame);

            now = performance.now();
            dt = now - last;
            last = now;

            // prevent updating the game with a very large dt if the game were to lose focus
            // and then regain focus later
            if (dt > 1E3) {
                return;
            }

            kontra._tick();
            accumulator += dt;

            while (accumulator >= delta) {
                gameLoop.update(step);

                accumulator -= delta;
            }

            clear();
            gameLoop.render();
        }

        // game loop object
        let gameLoop = {
            update: properties.update,
            render: properties.render,
            isStopped: true,

            start() {
                last = performance.now();
                this.isStopped = false;
                requestAnimationFrame(frame);
            },

            stop() {
                this.isStopped = true;
                cancelAnimationFrame(rAF);
            }
        };

        return gameLoop;
    };
}());

(function () {
    const callbacks = {};
    let pressedKeys = {};

    const keyMap = {
        // named keys
        13: 'enter',
        27: 'esc',
        32: 'space',
        37: 'left',
        38: 'up',
        39: 'right',
        40: 'down'
    };

    // alpha keys
    // @see https://stackoverflow.com/a/43095772/2124254
    for (let i = 0; i < 26; i++) {
        keyMap[65 + i] = (10 + i).toString(36);
    }
    // numeric keys
    for (i = 0; i < 10; i++) {
        keyMap[48 + i] = `${i}`;
    }

    addEventListener('keydown', keydownEventHandler);
    addEventListener('keyup', keyupEventHandler);
    addEventListener('blur', blurEventHandler);

    function keydownEventHandler(e) {
        const key = keyMap[e.which];
        pressedKeys[key] = true;

        if (callbacks[key]) {
            callbacks[key](e);
        }
    }

    function keyupEventHandler(e) {
        pressedKeys[keyMap[e.which]] = false;
    }

    function blurEventHandler(e) {
        pressedKeys = {};
    }

    kontra.keys = {
        bind(keys, callback) {
            // smaller than doing `Array.isArray(keys) ? keys : [keys]`
            [].concat(keys).map((key) => {
        callbacks[key] = callback;
      });
        },

        unbind(keys, undefined) {
            [].concat(keys).map((key) => {
                callbacks[key] = undefined;
            });
        },

        pressed(key) {
            return !!pressedKeys[key];
        }
    };
}());

(function () {
    class Vector {
        constructor(x, y) {
            this._x = x || 0;
            this._y = y || 0;
        }

        add(vector, dt) {
            this.x += (vector.x || 0) * (dt || 1);
            this.y += (vector.y || 0) * (dt || 1);
        }

        clamp(xMin, yMin, xMax, yMax) {
            this._c = true;
            this._a = xMin;
            this._b = yMin;
            this._d = xMax;
            this._e = yMax;
        }

        get x() {
            return this._x;
        }

        get y() {
            return this._y;
        }

        set x(value) {
            this._x = (this._c ? Math.min(Math.max(this._a, value), this._d) : value);
        }

        set y(value) {
            this._y = (this._c ? Math.min(Math.max(this._b, value), this._e) : value);
        }
    }

    kontra.vector = (x, y) => {
        return new Vector(x, y);
    };
    kontra.vector.prototype = Vector.prototype;


    class Sprite {
        // @see https://github.com/jed/140bytes/wiki/Byte-saving-techniques#use-placeholder-arguments-instead-of-var
        init(properties, prop, temp, firstAnimation) {
            properties = properties || {};

            this.position = kontra.vector(properties.x, properties.y);
            this.velocity = kontra.vector(properties.dx, properties.dy);
            this.acceleration = kontra.vector(properties.ddx, properties.ddy);

            // defaults
            this.width = this.height = 0;
            this.context = kontra.context;

            // loop through properties before overrides
            for (prop in properties) {
                this[prop] = properties[prop];
            }

            // image sprite
            if (temp = properties.image) {
                this.image = temp;
                this.width = temp.width;
                this.height = temp.height;
            }

            // animation sprite
            else if (temp = properties.animations) {
                // clone each animation so no sprite shares an animation
                for (prop in temp) {
                    this.animations[prop] = temp[prop].clone();

                    // default the current animation to the first one in the list
                    firstAnimation = firstAnimation || temp[prop];
                }

                this._ca = firstAnimation;
                this.width = firstAnimation.width;
                this.height = firstAnimation.height;
            }

            return this;
        }

        // define getter and setter shortcut functions to make it easier to work with the
        // position, velocity, and acceleration vectors.

        get x() {
            return this.position.x;
        }

        get y() {
            return this.position.y;
        }

        get dx() {
            return this.velocity.x;
        }

        get dy() {
            return this.velocity.y;
        }

        get ddx() {
            return this.acceleration.x;
        }

        get ddy() {
            return this.acceleration.y;
        }

        set x(value) {
            this.position.x = value;
        }

        set y(value) {
            this.position.y = value;
        }

        set dx(value) {
            this.velocity.x = value;
        }

        set dy(value) {
            this.velocity.y = value;
        }

        set ddx(value) {
            this.acceleration.x = value;
        }

        set ddy(value) {
            this.acceleration.y = value;
        }

        isAlive() {
            return this.ttl > 0;
        }

        collidesWith(object) {
            return this.x < object.x + object.width
             && this.x + this.width > object.x
             && this.y < object.y + object.height
             && this.y + this.height > object.y;
        }

        update(dt) {
            this.advance(dt);
        }

        render() {
            this.draw();
        }

        playAnimation(name) {
            this._ca = this.animations[name];

            if (!this._ca.loop) {
                this._ca.reset();
            }
        }

        advance(dt) {
            this.velocity.add(this.acceleration, dt);
            this.position.add(this.velocity, dt);

            this.ttl--;

            if (this._ca) {
                this._ca.update(dt);
            }
        }

        draw() {
            if (this.image) {
                this.context.drawImage(this.image, this.x, this.y);
            } else if (this._ca) {
                this._ca.render(this);
            } else {
                this.context.fillStyle = this.color;
                this.context.fillRect(this.x, this.y, this.width, this.height);
            }
        }
    }

    kontra.sprite = (properties) => {
        return (new Sprite()).init(properties);
    };
    kontra.sprite.prototype = Sprite.prototype;
}());

        <script>function toFixed(number, precision) {
    return Math.round(number * (10 ** precision)) / (10 ** precision);
}

function toRadians(angle) {
    return toFixed(angle * (Math.PI / 180), 4);
}

function polarToCartesian(angle, radius) {
    const inRadians = toRadians(angle);
    const ratios = [Math.cos(inRadians), Math.sin(inRadians)];

    return ratios.map(ratio => toFixed(radius * ratio, 4));
}

// not cryptographically secure
// see https://stackoverflow.com/a/34842797
function hash(str) {
    return str.split('').reduce((prevHash, currVal) => (((prevHash << 5) - prevHash) + currVal.charCodeAt(0)) | 0, 0);
}

function colorInGradient(begin, end, weight) {
    const partOfEnd = weight;
    const partOfBegin = 1 - partOfEnd;

    return [
        Math.round((begin[0] * partOfBegin) + (end[0] * partOfEnd)),
        Math.round((begin[1] * partOfBegin) + (end[1] * partOfEnd)),
        Math.round((begin[2] * partOfBegin) + (end[2] * partOfEnd))
    ];
}
</script>
        <script>class Point {
    constructor(x, y) {
        this.x = x; this.y = y;
    }

    distanceTo(other) {
        return Math.sqrt(
            ((this.x - other.x) ** 2) + ((this.y - other.y) ** 2)
        );
    }
}

        <script>class AccessPoint {
    constructor(options) {
        this.ssid = options.ssid;
        this.centre = options.centre;
        this.radius = options.radius;
        this.speed = options.speed; // in MiB per second
        this.jitter = options.jitter;
        this.encryption = options.encryption;
        this.password = options.password; // stored as a hash
        this.cost = options.cost; // if purchased, this is set to zero
    }

    isInRange(point) {
        return point.distanceTo(this.centre) <= this.radius;
    }

    speedAt(point, type) {
        if (!['download', 'upload'].includes(type)) {
            throw new Error(`Invalid speed type '${type}'`);
        }

        const distance = point.distanceTo(this.centre);

        // the `+ 0.01` is to prevent division by zero when `distance` is zero
        const calculated = this.speed[type] / ((distance + 0.01) ** 2);

        if (calculated < 0) return 0;

        return calculated;
    }
}
</script>

        },

        update() {
            if (isNetworkListOpen) {
                battery.dropRate.current = battery.dropRate.active;
            } else {
                battery.dropRate.current = battery.dropRate.idle;
            }

            if (!isPaused) {
                const dropPerFrame = battery.dropRate.current / fps;
                battery.level -= dropPerFrame;
            }

            if (battery.level < 0) {
                battery.level = 0;
                gameOver(false);
                loop.stop();
            }
        },

        render() {
            const red = [139, 0, 0];
            const green = [34, 228, 71];

            const dimensions = { width: 30, height: 19 };
            const position = { x: 25, y: 25 };

            kontra.context.strokeStyle = 'gray';
            kontra.context.strokeRect(
                position.x, position.y,
                dimensions.width, dimensions.height
            );

            const capDimensions = { width: 3, height: 8 };
            const capPosition = {
                x: position.x + dimensions.width,
                y: position.y + (((dimensions.height - capDimensions.height) / 2))
            };

            kontra.context.fillStyle = 'gray';
            kontra.context.fillRect(
                capPosition.x, capPosition.y,
                capDimensions.width, capDimensions.height
            );

            const indicatorColour = colorInGradient(red, green, battery.level / 100);
            kontra.context.fillStyle = `rgb(${indicatorColour.join(', ')})`;
            kontra.context.fillRect(
                position.x, position.y,
                dimensions.width * (battery.level / 100), dimensions.height
            );

            kontra.context.fillStyle = 'black';
            kontra.context.font = `${dimensions.height}px monospace`;
            kontra.context.fillText(
                `${Math.ceil(battery.level)}%`,
                position.x + dimensions.width + 15,
                position.y + dimensions.height
            );
        }
    });

    const networkIndicator = kontra.sprite({
        render() {
            if (currentAP !== null) {
                kontra.context.strokeStyle = 'black';
                kontra.context.fillStyle = 'black';
            } else {
                kontra.context.strokeStyle = 'gray';
                kontra.context.fillStyle = 'gray';
            }

            const centre = { x: 40, y: 90 };

            const startAngle = toRadians(-50);
            const endAngle = toRadians(-130);

            for (let r = 10; r <= 20; r += 5) {
                kontra.context.beginPath();
                kontra.context.arc(centre.x, centre.y, r, startAngle, endAngle, true);
                kontra.context.stroke();
            }

            kontra.context.beginPath();
            kontra.context.arc(centre.x, centre.y, 5, startAngle, endAngle, true);
            kontra.context.lineTo(centre.x, centre.y);
            kontra.context.fill();

            if (currentAP !== null) {
                kontra.context.font = '19px monospace';
                kontra.context.fillText(
                    currentAP.ssid,
                    25 + 45,
                    centre.y
                );
            }
        }
    });

    const money = kontra.sprite({
        remaining: 500,
        render() {
            const position = { x: 25, y: 130 };

            kontra.context.fillStyle = 'hsl(50, 90%, 40%)';
            kontra.context.font = '19px monospace';

            kontra.context.fillText(
                '💰',
                position.x,
                position.y
            );

            kontra.context.fillStyle = 'black';
            kontra.context.fillText(
                money.remaining,
                position.x + 45,
                position.y
            );
        }
    });

    const remainingGoal = kontra.sprite({
        // in MiB
        download: 2048,
        upload: 1024,

        update() {
            if (currentAP !== null) {
                remainingGoal.download -= currentAP.speedAt(currentPosition, 'download') / fps;
                remainingGoal.upload -= currentAP.speedAt(currentPosition, 'upload') / fps;
            }

            if (remainingGoal.download < 0) remainingGoal.download = 0;
            if (remainingGoal.upload < 0) remainingGoal.upload = 0;

            if (remainingGoal.download === 0 && remainingGoal.upload === 0) {
                gameOver(true);
                loop.stop();
            }
        },

        render() {
            kontra.context.fillStyle = 'black';
            kontra.context.font = '19px monospace';

            kontra.context.fillText(
                `↓ Goal: ${Math.ceil(remainingGoal.download)} MiB`,
                25, 190
            );

            kontra.context.fillText(
                `↑ Goal: ${Math.ceil(remainingGoal.upload)} MiB`,
                25, 190 + 30
            );
        }
    });

    const speedIndicator = kontra.sprite({
        render() {
            if (currentAP === null) {
                return;
            }

            kontra.context.fillStyle = 'black';
            kontra.context.font = '19px monospace';

            kontra.context.fillText(
                `↓ Speed: ${Math.ceil(currentAP.speedAt(currentPosition, 'download') * 1024)} KiB/s`,
                25, 270
            );

            kontra.context.fillText(
                `↑ Speed: ${Math.ceil(currentAP.speedAt(currentPosition, 'upload') * 1024)} KiB/s`,
                25, 270 + 30
            );
        }
    });

    const positionIndicator = kontra.sprite({
        render() {
            kontra.context.font = '16px monospace';
            kontra.context.fillText(
                `(${toFixed(currentPosition.x, 2)}, ${toFixed(currentPosition.y, 2)})`,
                25, kontra.canvas.height - 20
            );

            kontra.context.fillText(
                `${angleOfRotation}°`,
                25, kontra.canvas.height - 45
            );
        }
    });

    const road = kontra.sprite({
        width: kontra.canvas.width / 3,
        render() {
            kontra.context.save();

            kontra.context.translate(kontra.canvas.width / 2, kontra.canvas.height - 80);
            kontra.context.rotate(toRadians(-(90 - angleOfRotation)));
            kontra.context.translate(-(kontra.canvas.width / 2), -(kontra.canvas.height - 80));

            const sine = Math.abs(Math.sin(toRadians(angleOfRotation) + 0.1));

            kontra.context.fillStyle = 'hsl(220, 2%, 35%)';
            kontra.context.fillRect(
                road.width, -300,
                road.width, (kontra.canvas.height / sine) + 300 + 100
            );

            // zebra crossing
            kontra.context.fillStyle = 'white';

            // `% 200` allows for the wrap-around
            // `- 200` brings the initial zebra crossing a bit lower.
            // stuff breaks when i remove it though so it must be doing a lot more ¯\_(ツ)_/¯
            // `* 10` makes the zebra crossing move ten times more for each key press
            for (let y = ((currentPosition.y % 200) - 200) * 10; y <= 700; y += 200) {
                kontra.context.fillRect(
                    (kontra.canvas.width - 25) / 2, y,
                    25, 100
                );
            }

            kontra.context.restore();

            // trees

            kontra.context.font = '200px monospace';

            let x1 = road.width - 190;
            let x2 = road.width + road.width - 100;

            for (let y = 0; y <= kontra.canvas.height + 100; y += 150) {
                kontra.context.fillText(
                    '🌳',
                    x1 - (100 * Math.cos(angleOfRotation)), y + 50
                );

                kontra.context.fillText(
                    '🌳',
                    x2 - (100 * Math.cos(angleOfRotation)), y
                );

                x1 -= 150 * Math.tan(toRadians(90 + angleOfRotation));
                x2 -= 175 * Math.tan(toRadians(90 + angleOfRotation));
            }
        }
    });

    // navigation //

    function moveForward() {
        const [xComponent, yComponent] = polarToCartesian(angleOfRotation, 1);

        currentPosition.x += xComponent;
        currentPosition.y += yComponent;
    }

    function moveBackward() {
        const [xComponent, yComponent] = polarToCartesian(angleOfRotation, 1);

        currentPosition.x -= xComponent;
        currentPosition.y -= yComponent;
    }

    function turnLeft() {
        // fix aOR when it is off by one
        // due to frame-by-frame updating of aOR
        if (angleOfRotation % 5 !== 0) angleOfRotation += 1;

        if (angleOfRotation < 180) {
            angleOfRotation += 5;
        }
    }

    function turnRight() {
        if (angleOfRotation % 5 !== 0) angleOfRotation += 1;

        if (angleOfRotation > 0) {
            angleOfRotation -= 5;
        }
    }

    // toggle states //

    function togglePause() {
        if (!isPaused) pause();
        else unPause();
    }

    function toggleNetworkList() {
        if (!isNetworkListOpen) showNetworkList();
        else hideNetworkList();
    }

    function pause() {
        isPaused = true;
        kontra.keys.unbind([...movementKeys, 'n', 'h']);
    }

    function unPause() {
        isPaused = false;

        bindMovementKeys();
        kontra.keys.bind('n', toggleNetworkList);
    }

    function showNetworkList() {
        isNetworkListOpen = true;
        cursor = 0;
        kontra.keys.unbind([...movementKeys, 'p', 'h']);

        kontra.keys.bind('down', () => {
            if (cursor < getAccessPoints(currentPosition).length - 1) cursor++;
        });

        kontra.keys.bind('up', () => {
            if (cursor > 0) cursor--;
        });

        kontra.keys.bind('enter', () => {
            const available = getAccessPoints(currentPosition);
            const selected = available[cursor];

            if (selected.cost !== undefined && selected.cost > 0) {
                const wishToPurchase = window.confirm(
                    `Do you wish to pay ${selected.cost} to use this network?`
                );

                if (wishToPurchase) {
                    if (money.remaining >= selected.cost) {
                        money.remaining -= selected.cost;
                        selected.cost = 0;
                    } else {
                        alert('You don\'t have enough money to afford this network');
                        return;
                    }
                } else {
                    return;
                }
            }

            if (selected.password !== undefined) {
                const attempt = prompt(`Enter a ${selected.encryption} password:`);

                if (hash(attempt) !== selected.password) {
                    alert('You entered an incorrect password');
                    return;
                }
            }

            currentAP = selected;

            hideNetworkList();
        });
    }

    function hideNetworkList() {
        isNetworkListOpen = false;
        kontra.keys.unbind(['down', 'up', 'enter']);

        bindMovementKeys();
        kontra.keys.bind('p', togglePause);
    }

    function gameOver(wasSuccessful) {
        console.log(`game up. you ${wasSuccessful ? 'won' : 'lost'}.`);
    }

    // utility //

    function bindMovementKeys() {
        kontra.keys.bind(['up', 'w'], moveForward);
        kontra.keys.bind(['down', 's'], moveBackward);
        kontra.keys.bind(['left', 'a'], turnLeft);
        kontra.keys.bind(['right', 'd'], turnRight);
    }

    function getAccessPoints(point) {
        return accessPoints.filter((accessPoint) => {
            return accessPoint.isInRange(point);
        });
    }

    function drawDialogBox(dimensions, writeText) {
        // fade window
        kontra.context.fillStyle = 'hsla(0, 0%, 0%, 0.25)';
        kontra.context.fillRect(
            0, 0,
            kontra.canvas.width, kontra.canvas.height
        );

        const position = {
            x: (kontra.canvas.width - dimensions.width) / 2,
            y: (kontra.canvas.height - dimensions.height) / 2
        };

        kontra.context.fillStyle = 'hsl(218, 9%, 17%)';
        kontra.context.fillRect(
            position.x, position.y,
            dimensions.width, dimensions.height
        );

        kontra.context.fillStyle = 'white';
        kontra.context.font = '19px monospace';
        writeText(position, dimensions);
    }
};
</script>
