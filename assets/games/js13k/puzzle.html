<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Puzzle Game</title>
    <style>body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    background: #2c3e50;
    font-family: Arial, Helvetica, sans-serif;
    color:white;    
    margin: 0;
}

h1 {
    margin-bottom: 10px;
}

#message {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

#shuffle-button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}
#shuffle-button:hover {
    background-color: #2980b9;
}

#game-container {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    margin-top: 20px;
}

#puzzle-section {
    display: flex;
    flex-direction: column;
    align-items: center;
}

#puzzle {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 5px;
    background: #34495e;
    padding: 5px;
    border-radius: 10px;
    margin-top: 20px;
}

}

<body>
    <h1>🐾 Cat Puzzle</h1>
    <div id="game-container">
        <div id="puzzle-section">
            <div id="message">Arrange the cat picture!</div>
            <button id="shuffle-button">Shuffle</button>
            <div id="puzzle"></div>
        </div>

    <script>const puzzle = document.getElementById('puzzle');
const message = document.getElementById('message');
const shuffleButton = document.getElementById('shuffle-button');

let tiles = [];

function initPuzzle() {
    tiles = [...Array(15).keys()].map(n => n + 1);
    tiles.push(""); // empty slot
    shuffleTiles();
    drawPuzzle();
    message.textContent = "Arrange the cat picture!";
}

function shuffleTiles() {
    do {
        tiles.sort(() => Math.random() - 0.5);
    } while (!isSolvable(tiles) || isSolved());
}

function drawPuzzle() {
    puzzle.innerHTML = '';
    tiles.forEach((tile, index) => {
        const tileElement = document.createElement('div');
        tileElement.classList.add('tile');

        if (tile === "") {
            tileElement.classList.add('empty');
        } else {
            const x = (tile - 1) % 4;
            const y = Math.floor((tile - 1) / 4);
            tileElement.style.backgroundPosition = `-${x * 100}px -${y * 100}px`;
            tileElement.addEventListener('click', () => moveTile(index));
        }

        puzzle.appendChild(tileElement);
    });
}

function moveTile(index) {
    const emptyIndex = tiles.indexOf("");
    const validMoves = [emptyIndex - 1, emptyIndex + 1, emptyIndex - 4, emptyIndex + 4];

    if (index === emptyIndex - 1 && emptyIndex % 4 === 0) return; // left edge
    if (index === emptyIndex + 1 && emptyIndex % 4 === 3) return; // right edge

    if (validMoves.includes(index)) {
        [tiles[emptyIndex], tiles[index]] = [tiles[index], tiles[emptyIndex]];
        drawPuzzle();
        checkWin();
    }
}

function checkWin() {
    const winState = [...Array(15).keys()].map(n => n + 1).concat("");
    if (JSON.stringify(tiles) === JSON.stringify(winState)) {
        message.textContent = "🎉 Congratulations! You solved the puzzle!";
    }
}

function isSolvable(arr) {
    let invCount = 0;
    const puzzleArr = arr.filter(n => n !== "");
    for (let i = 0; i < puzzleArr.length; i++) {
        for (let j = i + 1; j < puzzleArr.length; j++) {
            if (puzzleArr[i] > puzzleArr[j]) invCount++;
        }
    }
    const emptyRow = Math.floor(arr.indexOf("") / 4) + 1;
    return (invCount + emptyRow) % 2 === 0;
}

function isSolved() {
    const winState = [...Array(15).keys()].map(n => n + 1).concat("");
    return JSON.stringify(tiles) === JSON.stringify(winState);
}

shuffleButton.addEventListener('click', initPuzzle);

// start game
initPuzzle();
</script>
