    />

    <title>TextGames</title>
    <style>@property --extra {
  syntax: "<number>";
  inherits: false;
  initial-value: 1;
}

html,
body {
  font-family: sans-serif;
  margin: 0;
  height: 100%;
  overflow: clip;
  font-size: min(1.5vh, 1.5vw);
  background-color: #fff;

  --cT0: #000;
  --cT1: #f00;
  --cT2: #ff7f00;
  --cT3: #ff0;
  --cT4: #0f0;
  --cT5: #00f;
  --cT6: #4b0082;
  --cT7: #8f00ff;
  --cT8: #000;

  --cB0: #000;
  --cB1: #800000;
  --cB2: #994000;
  --cB3: #808000;
  --cB4: #008000;
  --cB5: #000080;
  --cB6: #2a004a;
  --cB7: #4a006a;
  --cB8: #000;
}

.scene {
  width: 100vw;
  height: 100vh;
  z-index: 0;
  position: absolute;
  box-sizing: border-box;
  perspective: 800px;
  background: transparent;
  transform-style: preserve-3d;
  pointer-events: none;
}

.scene * {
  transform-style: preserve-3d;
}

#menu {
  position: absolute;
  animation: menuFadeIn 1s ease forwards;

  &.hide {
    animation: menuFadeOut 0.5s ease forwards;
  }
  z-index: 1;

  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  padding-top: 4vh;
  padding-bottom: 4vh;
  display: flex;
  justify-content: space-between;

  background: linear-gradient(
    to bottom,
    var(--cB0) 0%,
    var(--cB1) 5%,
    var(--cB1) 16%,
    var(--cB2) 19%,
    var(--cB2) 29%,
    var(--cB3) 32%,
    var(--cB3) 42%,
    var(--cB4) 45%,
    var(--cB4) 55%,
    var(--cB5) 58%,
    var(--cB5) 68%,
    var(--cB6) 71%,
    var(--cB6) 81%,
    var(--cB7) 84%,
    var(--cB7) 94%,
    var(--cB8) 100%
  );

  #menui {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
  }

  #gn {
    writing-mode: vertical-rl;
    font-size: 10rem;
    color: #000a;
    text-align: center;
    text-shadow:
      0 0 4px #000,
      0 0 8px #000,
      0 0 12px #000;
    transform-origin: 0 0;
    transform: rotateZ(-5deg);
  }
  #sig {
    writing-mode: vertical-rl;
    background: #000a;
    color: #fff8;
    padding: 2em 0.5em;
    border-radius: 1rem 0 0 1rem;
    font-size: 1.5rem;
  }
  .lev {
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: inset 0 0 1em 0 #000a;
    color: #fff;
    text-align: center;
    min-width: 50vw;
    font-size: 2.5rem;
    border-radius: 10vh;
    padding: 1rem 5rem;
    cursor: pointer;
    &.lock {
      opacity: 0.3;
      pointer-events: none;
      cursor: not-allowed;
    }
    div {
      font-size: 50%;
    }
  }
}

@keyframes menuFadeOut {
  0% {
    opacity: 1;
    pointer-events: none;
  }
  100% {
    opacity: 0;
  }
}

@keyframes menuFadeIn {
  0% {
    opacity: 0;
    display: flex;
  }
  100% {
    opacity: 1;
    pointer-events: all;
    display: flex;
  }
}

@keyframes starFlash {
  0% {
    transform: scale(1);
    color: #fff;
  }
  100% {
    color: #ff0;
    transform: scale(1.5);
  }
}

.wall,
.dlayer,
.letter {
  /* Isolates rendering boundaries so child transforms don't force full-page reflows */
  contain: layout style;
  -webkit-font-smoothing: antialiased;
}

.map {
  font-size: 20rem;
  line-height: calc(1.2 * var(--extra, 1));

  --zHeight: 5rem;
  --dct: #fff;
  --dcb: #000;
  position: relative;

  --gridX: calc(1ch * var(--extra, 1));
  --gridY: calc(1lh / 2);
  --gridXO: calc(var(--gridX) / 2);
  background-size: var(--gridX) var(--gridY);

  width: calc(var(--gridXF, 1) * var(--gridX));
  height: calc(var(--gridYF, 1) * var(--gridY));

  --viewX: 0;
  --viewY: 0;
  --viewRZ: 0;
  --viewS: 1;
  transform-origin: left top;

  min-width: 100%;
  transform: translate3d(50vw, 50vh, 0.1rem)
    rotateZ(calc(var(--viewRZ) * 90deg))
    scale3d(var(--viewS, 1), var(--viewS, 1), 1)
    translate3d(
      calc(((var(--viewX, 0) * var(--gridX) + var(--gridX)) * -1)),
      calc((var(--viewY, 0) * var(--gridY) + var(--gridXO)) * -1),
      0rem
    );
  background-position: var(--gridXO) 0;
  background-imagex:
    linear-gradient(to right, rgba(0, 0, 0, 0.15) 2px, transparent 2px),
    linear-gradient(to bottom, rgba(0, 0, 0, 0.15) 2px, transparent 2px);
  --extra: 0.95;
  transition: --extra 1s ease-in;

  &.paused {
    --extra: 1.2;
    transition: --extra 1s ease-in;
  }

  .ga {
    border-radius: 0 50% 50% 50%;
    top: calc(var(--gridY) / 2);
    left: var(--gridXO);
    position: absolute;
    transform: translate3d(
      calc(var(--gX, 0) * var(--gridX) + var(--gridXO)),
      calc(var(--gY, 0) * var(--gridY)),
      calc(var(--zHeight, 0) * (var(--gridZ, 0) + 0.5))
    );

    .arch .letter {
      --letZ: calc(
        (-4 * var(--lir, 0) * var(--lir, 0) + 4 * var(--lir, 0)) * 2rem
      );
    }

    .rbow .letter {
      color: oklch(0.3 0.2 calc(var(--lir) * 360));
    }

    .sprite {
      transform: rotateZ(calc(var(--gRZ, 0) * -90deg))
        rotateY(calc(var(--gRY, 0) * 180deg));
    }

    .marker {
      font-size: 1rem;
    }
  }

  .wall {
    position: absolute;

    top: 0;
    left: 0;
    transform: translateX(calc(var(--col, 0) * var(--gridX)));
    span.deco {
      color: #0002;
    }
  }
}

.map::after {
  content: "";
  position: absolute;

  /* Extend beyond the parent using negative inset values */
  top: -200vh;
  left: -200vw;
  right: -200vw;
  bottom: -200vh;

  /* Place the element visually behind the parent content */
  z-index: -1;

  /* Define your radial fill */
  background: linear-gradient(
    to bottom,
    var(--trc) 0,
    var(--trc) 180vh,
    var(--dcb) calc(200vh + var(--gridX) * 4),
    var(--dcb) calc(100% - 200vh - var(--gridX) * 4),
    var(--brc) calc(100% - 180vh),
    var(--brc) 100%
  );
  transform: translateZ(-10px);
  pointer-events: none;
}

pre {
  margin: 0;
  padding: 0;
  margin-block: 0;
}

.base {
  margin: 0;
  padding: 0;
  position: relative;
}

.dlayer {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate3d(
    0,
    0,
    calc(var(--i, 0) * var(--zHeight, 1em) + var(--zOffset, 0em))
  );
  color: color-mix(
    in oklch,
    var(--dct, currentcolor) calc((var(--i, 0)) * 100%),
    var(--dcb, #000)
  );
}

.dlayer.AB {
  color: color-mix(
    in oklch,
    var(--dct, currentcolor) calc((1 - abs(var(--i, 0))) * 100%),
    transparent
  );
  transform: translate3d(
      0,
      0,
      calc(var(--i, 0) * var(--zHeight, 1em) + var(--zOffset, 0em))
    )
    scale3d(
      calc(1 - 0.1 * abs(var(--i, 0))),
      calc(1 - 0.1 * abs(var(--i, 0))),
      1
    );
}

.letter {
  position: absolute;
  transform: translate3d(
      calc(var(--letX, 0) - (1ch / 2)),
      calc(var(--letY, 0) - (1lh / 2)),
      var(--letZ, 0)
    )
    rotateZ(var(--letRZ, 0)) scale3d(1, var(--letHS, 1), 1);
}

  <script>const buildDepth = (el, layers) => {
  const content = el.innerHTML;
  el.innerHTML = "";
  const base = document.createElement("div");
  base.innerHTML = content;
  el.appendChild(base);
  base.classList.add("base");
  return [...Array(layers)].map((_, i) => {
    const span = document.createElement("div");
    span.innerHTML = content;
    span.style.setProperty("--i", i / layers);
    span.classList.add("dlayer");
    base.appendChild(span);
    return span;
  });
};

const buildA_B = (el, num) => {
  //builds num layer above and a layer below to thicken the object
  const content = el.innerHTML;
  el.innerHTML = "";
  const base = document.createElement("div");
  base.innerHTML = content;
  el.appendChild(base);
  base.classList.add("base", "AB");
  [...Array(num)].forEach((_, i) => {
    const e1 = document.createElement("div");
    e1.innerHTML = content;
    e1.style.setProperty("--i", (i + 1) / num / 2);
    e1.classList.add("dlayer", "AB");
    base.appendChild(e1);
    const e2 = document.createElement("div");
    e2.innerHTML = content;
    e2.style.setProperty("--i", -(i + 1) / num / 2);
    e2.classList.add("dlayer", "AB");
    base.appendChild(e2);
  });
};
</script>
  <script>mkCtl = (par, text, dn, up) => {
  const c = {
    el: document.createElement("div"),
    down: 0,
    dtime: 0,
    utime: 0,
    wasDown: 0,
  };
  c.el.textContent = text;
  c.el.classList.add("ctl");
  par.appendChild(c.el);

  const setActive = (v) => {
    c.el.classList.toggle("active", v);
    c.down = v;
    if (v) c.dtime = Date.now();
    else c.utime = Date.now();
  };

  c.el.addEventListener("pointerdown", (e) => {
    c.el.setPointerCapture(e.pointerId); // Captures release events even off-element
    setActive(true);
    dn?.();
  });

  c.el.addEventListener("pointerup", () => {
    setActive(false);
    up?.();
  });

  // Revert if interaction is interrupted (e.g., system gesture, call, drag cancel)
  c.el.addEventListener("pointercancel", () => setActive(false));
  c.el.addEventListener("contextmenu", (e) => {
    e.preventDefault();
  });

  return c;
};

mkCtls = (par, endLevel) => {
  const buts = {
    ld: mkCtl(par, "↙"),
    lu: mkCtl(par, "↖"),
    l: mkCtl(par, "←"),
    c: mkCtl(par, "☰", () => ctl.pause()),
    v: mkCtl(
      par,
      "⛶",
      () => ctl.showF(),
      () => ctl.hideF(),
    ),
    r: mkCtl(par, "→"),
    ru: mkCtl(par, "↗"),
    rd: mkCtl(par, "↘"),
  };

  const kmap = [
    {
      //special mappings if facing right
      b: [65, 37, "l", "lu", "ld"],
      f: [68, 39, "r"],
      u: [87, 38, "ru"],
      d: [83, 40, "rd"],
    },
    {
      //special mappings if facing left
      f: [65, 37, "l"],
      b: [68, 39, "r", "ru", "rd"],
      u: [87, 38, "lu"],
      d: [83, 40, "ld"],
    },
  ];
  //attach keyboard to parent
  par.onkeydown = function (e) {
    e = e || window.event;
    buts[e.keyCode] = {
      ...buts[e.keyCode],
      down: true,
      dtime: Date.now(),
    };
  };
  par.onkeyup = function (e) {
    e = e || window.event;
    buts[e.keyCode] = {
      ...buts[e.keyCode],
      down: false,
      utime: Date.now(),
    };
  };
  par.focus();
  const ctl = {
    base: par,
    topbar: document.getElementById("topbar"),
    buts,
    cli: 0,
    przCount: 0,
    stTime: 0,
    time: 0,
    wasDownTime: 0,
    timerOn: false,
    status: 0, //new level
    down(i) {
      return !!(this.buts[i]?.down || this.buts[i]?.wasDown);
    },
    anyDown(a) {
      return a.some((i) => this.down(i));
    },
    setWasDown() {
      //first check through them hoping for a currently active
      let bl = [
        65,
        37,
        "l",
        "lu",
        "ld",
        68,
        39,
        "r",
        87,
        38,
        "ru",
        83,
        40,
        "rd",
      ];
      let dc = 0,
        maxt = 0,
        maxi = "";
      bl.forEach((i) => {
        let b = this.buts[i];
        if (!b) return;
        if (b.down) {
          b.wasDown = true;
          dc += 1;
        } else {
          b.wasDown = false;
          if (b.utime > maxt) {
            maxt = b.utime;
            maxi = i;
          }
        }
      });
      if (!dc && maxt > this.wasDownTime + 100) this.buts[maxi].wasDown = true; //if nothing is currently down look at the last one
      this.wasDownTime = Date.now();
    },

    act(c, d) {
      return this.anyDown(kmap[d % 2][c]);
    },
    startUp(li) {
      document.getElementById("tl1").textContent = "<" + levs[li].time1 + "s";
      document.getElementById("tl2").textContent = "<" + levs[li].time2 + "s";
      document.getElementById("title").textContent = levs[li].title;
      this.cli = li;
      this.status = 0;
      pChimes(levs[li].m);
      return this.start();
    },

    start(go) {
      document.getElementById("bst").textContent = lastT(this.cli);
      document.getElementById("scene").innerHTML = "";
      this.status = 0; //new game
      if (this.map) this.map.isDead = 1;
      this.map = mkMap(levs[this.cli], this, document.getElementById("scene"));
      this.przCount = 0;
      this.stTime = Date.now();
      this.time = 0;
      if (go) this.cont();
      else this.pause();
      return this.map;
    },
    updateTB() {
      if (this.timerOn) this.time += (Date.now() - this.stTime) / 1000;
      this.stTime = Date.now();
      for (let i = 0; i < 5; i += 1) {
        document
          .getElementById("s" + i)
          .classList.toggle("set", this.przCount > i);
      }
      document.getElementById("time").textContent = this.time.toFixed(1) + "s";
      document.getElementById("C_C").classList.toggle("a", this.status == 1);
      document.getElementById("C_S").classList.toggle("a", this.status == 0);
      document.getElementById("C_R").classList.toggle("a", this.status != 0);
      document.getElementById("C_N").classList.toggle("a", this.status == 2);
    },
    tkPrz() {
      this.przCount += 1;
    },
    showF() {
      this.timerOn = false;
      this.updateTB();
      this.base.classList.toggle("hide", true);
      this.topbar.classList.toggle("hide", true);
      this.map.lookAt(this.map.gridXF / 2, this.map.gridYF / 2);
      this.map.setVPW(this.map.gridYF + 3);
    },
    hideF() {
      this.timerOn = true;
      this.updateTB();
      this.base.focus();
      this.topbar.classList.toggle("closed", true);
      this.topbar.classList.toggle("hide", false);
      this.base.classList.toggle("hide", false);
      this.map.setVPW(6);
      this.map.doFollow();
    },
    pause() {
      this.timerOn = false;
      this.updateTB();
      this.topbar.classList.toggle("closed", false);
      this.base.classList.toggle("disable", true);
      this.map.base.classList.toggle("paused", true);
      this.map.lookAt(this.map.gridXF / 2, this.map.gridYF / 2);
      this.map.setVPW(this.map.gridYF + 2);
    },
    cont() {
      this.status = 1;
      this.timerOn = true;
      this.updateTB();
      this.base.focus();
      this.topbar.classList.toggle("closed", true);
      this.base.classList.toggle("disable", false);
      this.map.base.classList.toggle("paused", false);
      this.map.setVPW(6);
      this.map.doFollow();
    },
    exit() {
      pChimes();
      endLevel();
    },
    end(isFinal = false) {
      //freeze and unzoom the camera
      if (this.przCount >= 3) {
        if (this.time < levs[this.cli].time1) this.przCount += 1;
        if (this.time < levs[this.cli].time2) this.przCount += 1;
      }
      this.status = 2; //done
      this.isFinal = isFinal;
      this.timerOn = false;
      this.updateTB();
      this.topbar.classList.toggle("closed", false);
      this.base.classList.toggle("disable", true);
      if (!isFinal) {
        this.map.lookAt(this.map.follow.gx, this.map.follow.gy + 2);
        this.map.setVPW(6);
      }
      if (this.przCount >= 3) {
        if ((loc[this.cli + "t"] ?? 10000) > this.time)
          loc[this.cli + "t"] = this.time;
      }
      if ((loc[this.cli + "p"] ?? 0) < this.przCount)
        loc[this.cli + "p"] = this.przCount;
      saveLoc();
    },
  };
  //launch score board and timer updater.
  everyX(100, () => {
    ctl.updateTB();
    return true;
  });
  //bind the button handlers
  document.getElementById("C_C").onclick = () => ctl.cont();

  <script>const makeLetters = (el, text, cb) => {

const updateCurveLetterPos = (el, t, [x1, y1, x2, y2, x3, y3, w1, w2, w3]) => {
  const u = 1 - t;
  const x = u * u * x1 + 2 * u * t * x2 + t * t * x3;
  const y = u * u * y1 + 2 * u * t * y2 + t * t * y3;
  const dx = 2 * u * (x2 - x1) + 2 * t * (x3 - x2);
  const dy = 2 * u * (y2 - y1) + 2 * t * (y3 - y2);
  const angle = Math.atan2(dy, dx);
  //these are not used yet but are the normalised normal vector
  const len = Math.hypot(dx, dy);
  const nx = len === 0 ? 0 : -dy / len;
  const ny = len === 0 ? 0 : dx / len;

  el.style.setProperty("--letX", x + "rem");
  el.style.setProperty("--letY", y + "rem");
  el.style.setProperty("--letRZ", angle + "rad");

  //Widths
  const w = t < 0.5 ? inter(t * 2, w1, w2, so) : inter(t * 2 - 1, w2, w3, si);
  el.style.setProperty("--letHS", w);
};

const mkAnimatedCurve = (c, parentEl, numPos, is = 0) => {
  fillUp(c.pos, numPos, []).forEach((a) => fillFrom(c.pos[0], a)); //fill in extra pos numbers if we have to
  const ctl = document.createElement("div");
  ctl.className = c.style + " curvebit";
  parentEl?.appendChild(ctl);
  const curve = {
    ctl: ctl,
    letters: makeLetters(ctl, c.text),
    pos: c.pos,
    state: is,
    position(pos) {
      this.letters.forEach((l, li) =>
        updateCurveLetterPos(
          l,
          clamp(0, 1, li / (this.letters.length - 1)),
          pos,
        ),
      );
    },
    positionR(r, os, ns, func) {
      this.position(interA(r, this.pos[os], this.pos[ns], func));
    },
  };
  if (c.layers) {
    curve.letters.forEach((l) => buildA_B(l, c.layers));
  }
  curve.position(curve.pos[is]);
  return curve;
};

  <script>const addSprite = (c, map, gx = 0, gy = 0, rz = 0, is = 0, next) => {
  const ctl = document.createElement("div");
  ctl.className = "sprite " + c.style;
  const bits = c.bits.map((b) =>
    mkAnimatedCurve(b, ctl, c.bits[0].pos.length, is),
  );
  sp = {
    ctl,
    bits,
    state: is,
    moveTF: 1, //Scales the time it takes to make a move
    moves: c.moves,
    ga: map.addA(ctl, gx, gy), //adds it to the map and gets a grid anchor node
    gx, //actual displayed co-ordinates
    gy,
    rz: rz + 100,
    ry: 0,
    f: 0, //flipped into the alt world?
    cgx: gx, //current game co-ordinates (always ordinal)
    cgy: gy,
    crz: rz + 100,
    cry: 0,
    cf: 0,
    dirX(x, y) {
      return (
        x * [1, 0, -1, 0][this.crz % 4] * (this.cry % 2 ? -1 : 1) +
        y * [0, 1, 0, -1][this.crz % 4]
      );
    },
    dirY(x, y) {
      return (
        x * [0, -1, 0, 1][this.crz % 4] * (this.cry % 2 ? -1 : 1) +
        y * [1, 0, -1, 0][this.crz % 4]
      );
    },

    moveBit(mb) {
      const ix = this.gx;
      const iy = this.gy;
      const irz = this.rz;
      const iry = this.ry;
      const fx = this.cgx + this.dirX(mb.tx || 0, mb.ty || 0);
      const fy = this.cgy + this.dirY(mb.tx || 0, mb.ty || 0);
      const frz = this.crz + (mb.trz || 0) * (this.cry % 2 ? -1 : 1);
      const fry = this.cry + (mb.try || 0);
      const ff = (this.cf + (mb.tf || 0)) % 2;
      if (mb.sVP && map.followOn) map.setVPW(mb.sVP); //move has a scale suggestion

      if (mb.sS) snd[mb.sS](((mb.sSt ?? mb.t) * this.moveTF) / 1000); //play a sounds

      if (mb.sZ) {
        //set our lift offset
        this.ga.style.setProperty("--gridZ", mb.sZ);
      }

      return animateOver(
        mb.t * this.moveTF,
        (r) => {
          bits.forEach((b) => b.positionR(r, this.state, mb.ts));
          this.setP(
            inter(r, ix, fx),
            inter(r, iy, fy),
            inter(r, irz, frz),
            inter(r, iry, fry),
          );
        },
        () => {
          bits.forEach((b) => b.positionR(1, this.state, mb.ts));
          this.state = mb.ts;
          this.setP(fx, fy, frz, fry);
          this.f = ff; //maybe flipped?
        },
      );
    },
    async start() {
      while (!map.isDead && (await this.move(next?.(this))));
    },
    async move(mn) {
      if (!mn) return false;
      this.cgx = this.gx;
      this.cgy = this.gy;
      this.crz = this.rz;
      this.cry = this.ry;
      this.cf = this.f;
      for (const bit of this.moves[mn]) await this.moveBit(bit);
      //update currents to last position
      this.cgx = this.gx;
      this.cgy = this.gy;
      this.crz = this.rz;
      this.cry = this.ry;
      this.cf = this.f;
      return true;
    },
    setP(x, y, rz, ry) {
      this.gx = x;
      this.gy = y;
      this.rz = rz;
      this.ry = ry;
      this.ga.style.setProperty("--gX", x);
      this.ga.style.setProperty("--gY", y);
      this.ga.style.setProperty("--gRZ", rz);
      this.ga.style.setProperty("--gRY", ry);
    },

    animateToState(ns, time, func = id) {
      return animateOver(
        time,
        (r) => {
          bits.forEach((b) => b.positionR(r, this.state, ns));
        },
        () => {
          bits.forEach((b) => b.positionR(1, this.state, ns));
          this.state = ns;
        },
      );
    },
  };
  sp.setP(sp.gx, sp.gy, sp.rz, sp.ry);
  sp.start();
  return sp;
};

const addUni = (map, ctl, gx = 0, gy = 0, rz = 0, is = 0) => {
  const sol = (sp, x, y) =>
    map.g_solid(sp.gx + sp.dirX(x, y), sp.gy + sp.dirY(x, y)) ^ sp.f; //XOR turns solid to empty if the world is flipped.
  const fsol = (sp, x, y) => sol(sp, x, y) & 8;
  const stk = (sp, x, y) =>
    map.g_stick(sp.gx + sp.dirX(x, y), sp.gy + sp.dirY(x, y));
  const flp = (sp, x, y) =>
    map.g_flp(sp.gx + sp.dirX(x, y), sp.gy + sp.dirY(x, y));

  const emp = (sp, x, y) => !sol(sp, x, y);
  let active = true;
  let idle = 0;

  const sA = (s) => {
    let oidle = idle;
    idle = 0;
    if (!active) return null;
    if (ctl.status == 2) {
      //level ended
      active = false;
      return ctl.isFinal ? "xf" : "x";
    }
    if (!ctl.timerOn) return "p";
    if (flp(s, 0, 0) && sol(s, 1, 1)) return "f"; //can always flip from a bridge into rock
    if (ctl.act("b", s.cry)) return "tb"; //can always turn

    if (ctl.act("u", s.cry) && sol(s, 1, 0) && emp(s, 1, -1)) return "u1";
    if (ctl.act("u", s.cry) && sol(s, 2, 0) && emp(s, 2, -1)) return "u1l";
    if (
      ctl.act("u", s.cry) &&
      sol(s, 2, -1) &&
      emp(s, 2, -2) &&
      emp(s, 0, -1) &&
      emp(s, 1, -1) &&
      emp(s, 1, -2)
    )
      return "u2";
    if (
      ctl.act("u", s.cry) &&
      sol(s, 2, 1) &&
      emp(s, 1, 0) &&
      emp(s, 1, -1) &&
      emp(s, 2, 0)
    )
      return "j2";
    if (
      ctl.act("u", s.cry) &&
      sol(s, 3, 1) &&
      emp(s, 3, 0) &&
      emp(s, 1, 0) &&
      emp(s, 1, -1) &&
      emp(s, 2, 0) &&
      emp(s, 2, -1)
    )
      return "j3";
    if (ctl.act("d", s.cry) && sol(s, 1, 2) && emp(s, 1, 1)) return "d1";
    if (ctl.act("d", s.cry) && sol(s, 2, 2) && emp(s, 2, 1)) return "d1l";
    if (
      ctl.act("d", s.cry) &&
      sol(s, 2, 3) &&
      emp(s, 1, 0) &&
      emp(s, 1, 1) &&
      emp(s, 2, 1) &&
      emp(s, 2, 2)
    )
      return "d2";
    if (
      ctl.act("d", s.cry) &&
      sol(s, 2, 4) &&
      emp(s, 1, 0) &&
      emp(s, 1, 1) &&
      emp(s, 1, 2) &&
      emp(s, 1, 3) &&
      emp(s, 2, 1) &&
      emp(s, 2, 2) &&
      emp(s, 2, 3)
    )
      return "d3";
    if (ctl.act("f", s.cry) && sol(s, 1, 1) && emp(s, 1, 0)) return "fd";
    if (ctl.act("f", s.cry) && stk(s, 0, 0) && sol(s, 1, 0) && !fsol(s, 1, 0))
      return "ru";
    if (ctl.act("f", s.cry) && stk(s, 0, 0) && emp(s, 1, 1) && stk(s, 1, 1))
      return "rd";

    //no more legal moves
    //if we're holding controls we can deny
    if (ctl.act("f", s.cry)) return "fx";
    if (ctl.act("u", s.cry)) return "ux";
    if (ctl.act("d", s.cry)) return "dx";
    idle = oidle + 1;
    if (idle < 20) {
      return rnd(1, 3); //randomly return 1,2,3
    }
    if (!rnd(0, 10)) idle = 0;
    return "i";
  };

  let mom = 0;
  let uniE = addSprite(uni, map, gx, gy, rz, is, (s) => {
    ctl.setWasDown();
    const m = sA(s);
    //lets change momentum.
    if (["fd", "ru", "rd", "jf"].includes(m)) mom = clamp(0, 5, mom + 1);
    if (["u2", "d3", "f"].includes(m)) mom = clamp(0, 5, mom - 1);
    if (["i", "tb", "ux", "dx", "fx", "x", "xf"].includes(m)) mom = 0;

    //set the timescale
    s.moveTF = 1 - (0.6 * mom) / 5;

    return m;
  });
  map.setCameraFollow(uniE);
  return uniE;
};

addNBSprite = (c, map, x, y, rz, cb, r = 0.5) => {
  let is = 0;
  return addSprite(c, map, x, y, rz, 0, (sp) => {

      if (this.followOn) {
        this.followOn = false;
        this.camX = this.follow.gx;
        this.camY = this.follow.gy;
        this.camRZ = this.follow.rz;

      let srz = this.camRZ - (this.camRZ % 4);
      animateOver(
        500,
        (r) =>
          this.setCamera(
            inter(r, this.camX, x),
            inter(r, this.camY, y),
            inter(r, this.camRZ, srz),
          ),
        () => {
          this.camX = x;
          this.camY = y;
          this.camZ = srz;

      );

    setCamera(x, y, rz) {

      this.base.style.setProperty("--viewRZ", rz);

  <script>//interpolation, curves and clamping
const siso = (r) => 3 * r * r - 2 * r * r * r;
const so = (r) => 2 * r - r * r;
const si = (r) => r * r;
const id = (r) => r;

const clamp = (s, e, v) => (v < s ? s : v > e ? e : v);
const inter = (r, st, end, func = id) => {
  r = func(clamp(0, 1, r));
  return r * end + (1 - r) * st;
};

rnd = (s, e) => s + ((Math.random() * (e - s + 1)) | 0);
randA = (a) => a[Math.floor(Math.random() * a.length)]; //select a random element of array
ranR = (s, e) => s + Math.random() * (e - s); //random in range s to e smooth

//array handling
const fillFrom = (s, t) => s.forEach((v, i) => (t[i] = t[i] ?? s[i]));
const fillUp = (arr, x, y) => Array.from({length: x}, (_, i) => arr[i] ?? y);
const interA = (r, st, end, func) =>
  st.map((_, i) => inter(r, st[i], end[i], func)); //like inter across each element in an array

//weird quick directional things
const dirX = (d) => (d % 2 ? (d % 4 == 1 ? 1 : -1) : 0);
const dirY = (d) => (d % 2 ? 0 : d % 4 == 0 ? 1 : -1);

//frame runners

//call each frame
var _onFrameList = [];
var _lastFrameT = 0;
const onFrame = (f) => _onFrameList.push(f);

const frame = (t) => {
  if (!_lastFrameT) _lastFrameT = t - 10;
  const ft = t - _lastFrameT;
  _lastFrameT = t;
  const ofl = _onFrameList;
  _onFrameList = [];
  ofl.forEach((f) => f(t, ft));
  requestAnimationFrame(frame);
};

requestAnimationFrame(frame);

animateOver = (time, each, end) => {
  var startTime = 0;
  var endTime = 0;
  return new Promise((resolve, reject) => {
    const func = (t, ft) => {
      if (!startTime) {
        startTime = t;
        endTime = t + time;
      }
      var r = clamp(0, 1, (t - startTime) / time);
      each(r, t, ft);
      if (r < 1) onFrame(func);
      else {
        if (end) end();
        resolve();
      }
    };
    onFrame(func); //call it the first time
  });
};

eachFrame = (on) => {
  const func = (t, ft) => {
    if (on(t, ft)) onFrame(func);
  };
  onFrame(func); //call it the first time
};

everyX = (time, on) => {
  const func = (t, ft) => {
    if (on(t, ft)) setTimeout(func, time);
  };
  func(); //call it the first time
};

//local storage
loc = JSON.parse(localStorage.getItem("Glyphicon") ?? "{}");
saveLoc = () => {
  localStorage.setItem("Glyphicon", JSON.stringify(loc));
};

//Text builders
lastT = (li) => {
  let ps = loc[li + "p"] ?? 0;
  return (
    "★".repeat(ps) +
    "☆".repeat(5 - ps) +
    (ps >= 3 ? " (" + (loc[li + "t"] ?? 1000).toFixed(1) + "s)" : "")
  );
};

          snd.g();
          sl(i);
        };
        p.appendChild(ctl);
      });
    },
    show: () => {
      p.parentElement.style.display = "inherit";
      p.parentElement.classList.toggle("hide", false);
    },
    hide: () => {
      p.parentElement.classList.toggle("hide", true);
      setTimeout(() => (p.parentElement.style.display = "none"), 500);
    },
  };
};

    menu.hide();

    menu.update();

  <script>const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const mVolume = audioCtx.createGain(); //music master volume
mVolume.connect(audioCtx.destination);
mVolume.gain.setValueAtTime(0.2, audioCtx.currentTime);

const fxVolume = audioCtx.createGain(); //fx master volume
fxVolume.connect(audioCtx.destination);
fxVolume.gain.setValueAtTime(0.8, audioCtx.currentTime);

//make noiseBuffer
const bufferSize = 2 * audioCtx.sampleRate;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
  output[i] = Math.random() * 2 - 1; // white noise
}

function noiseS() {
  //creates a node for white noise
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;
  return noise;
}

function playHoof(time, volume = 1.0, pitch = 1) {
  const osc = audioCtx.createOscillator();
  const oscGain = audioCtx.createGain();
  if (!time) time = audioCtx.currentTime;

  // Low-frequency impact body
  osc.type = "triangle";
  osc.frequency.setValueAtTime(120 * pitch, time);
  osc.frequency.exponentialRampToValueAtTime(30 * pitch, time + 0.08);

  oscGain.gain.setValueAtTime(0.8 * volume, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);

  osc.connect(oscGain);
  oscGain.connect(fxVolume);

  // Bandpass filter to sculpt the impact surface sound
  const filter = audioCtx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(800 * pitch, time);
  filter.Q.setValueAtTime(1.5, time);

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.5 * volume, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

  const noiseSource = noiseS();
  noiseSource.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(fxVolume);

  osc.start(time);
  osc.stop(time + 0.09);

  noiseSource.start(time);
  noiseSource.stop(time + 0.06);
}

function nay(dur, off = 0, fr = 600, fre = 400, rep = 10) {
  const now = audioCtx.currentTime + off;

  // Base vocal oscillator
  const osc = audioCtx.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(400, now); // base pitch (~cat meow)
  osc.frequency.exponentialRampToValueAtTime(fr, now + dur * 0.2); // upward screech
  osc.frequency.linearRampToValueAtTime(fre, now + dur * 0.8); // then settle

  // First formant filter (throat resonance)
  const formant1 = audioCtx.createBiquadFilter();
  formant1.type = "bandpass";
  formant1.frequency.value = 1000; // resonance frequency
  formant1.Q.value = 4;

  // Second formant filter (mouth resonance)
  const formant2 = audioCtx.createBiquadFilter();
  formant2.type = "bandpass";
  formant2.frequency.value = 2500;
  formant2.Q.value = 6;

  // Add jittery modulation (for angry instability)
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = rep; // jitter speed
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 40; // +/- Hz
  lfo.connect(lfoGain).connect(osc.frequency);
  lfo.start(now);

  // Amplitude envelope
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(5.0, now + dur * 0.05); // quick attack
  gain.gain.setValueAtTime(4.0, now + dur * 0.5); // sustain
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur * 1.2); // decay

  // Connect chain: osc -> formants -> gain -> out
  osc.connect(formant1).connect(formant2).connect(gain).connect(fxVolume);

  // Start/stop
  osc.start(now);
  osc.stop(now + dur);
}

const snd = {
  g: (l = 1) => {
    let t = audioCtx.currentTime;
    playHoof(t, 0.6, 0.85);
    playHoof(t + l * 0.05, 1, 1);
    playHoof(t + l * 0.2, 0.8, 1.15);
  },
  t: (l = 0.5) => {
    let t = audioCtx.currentTime;
    playHoof(t, 0.3, 1.1);
    playHoof(t + l * 0.25, 0.4, 0.9);
    playHoof(t + l * 0.55, 0.4, 0.9);
    playHoof(t + l * 0.75, 0.2, 1);
  },
  n: (l = 1) => nay(l, 0, 600, 400, 10), //refusenay
  o: (l = 1) => nay(l, 0, 600, 400, 30), //oomph
  w: (l = 1.5) => nay(l, 0, 600, 850, 15), //weeeeee
};

function playGong(STC, oct, dur = 10, v = 1) {
  //play a single chime
  const baseFreq = 440 * Math.pow(2, (oct * 12 + STC - 57) / 12);
  const now = audioCtx.currentTime;

  const master = audioCtx.createGain();
  master.gain
    .setValueAtTime(0.2 * v, now)
    .exponentialRampToValueAtTime(0.0001, now + dur);
  master.connect(mVolume);

  // Fundamental
  makeTone(baseFreq, master, now, dur);

  // Gong-like inharmonic partials
  makeTone(baseFreq * 2.01, master, now, dur * 0.9);
  makeTone(baseFreq * 2.62, master, now, dur * 0.7);
  makeTone(baseFreq * 3.95, master, now, dur * 0.5);
}

// Helper: tone with exponential decay
function makeTone(freq, destination, startTime, duration) {
  const osc = audioCtx.createOscillator();
  osc.frequency.setValueAtTime(freq, startTime);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(1, startTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  osc.connect(gain).connect(destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

var _c = null;

var _k = [
  [0, 2, 4, 7, 9], //0:Major
  [0, 3, 5, 7, 10], //1:minor
  [0, 2, 5, 7, 10], //2:egyptian
  [0, 1, 5, 7, 10], //3:In Sen
  [0, 2, 5, 7, 9], //4: Yo
];

function _chime() {
  //time to strike a random chime
  if (!_c) return;
  playGong(
    randA(_k[_c.t]),
    randA(_c.o),
    randA(_c.d || [10, 20, 25]),
    ranR(_c.vs || 0.1, _c.ve || 0.5),
  );
  setTimeout(_chime, ranR(_c.gs || 0.5, _c.ge || 1) * 1000);
}

function pChimes(c = null) {
  //start the chimes with a set up or null to silence
  if (!_c) setTimeout(_chime, 10); //start it if we need to
  _c = c;
}
