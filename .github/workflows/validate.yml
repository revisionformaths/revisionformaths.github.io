name: validate

# The site ships no third-party pages any more, so there is nothing to probe on
# the open web: the tests are the whole check.

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 3"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install locked dependencies
        run: npm ci
      - name: Run the regression tests
        run: npm test
