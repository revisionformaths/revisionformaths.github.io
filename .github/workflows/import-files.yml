name: import files

# Grows the offline library on its own. Each run walks the js13kGames org,
# turns any game it has not seen into one self-contained HTML file, records
# the author and source, regenerates the list both pages read, and commits.
# It stops at a hard file budget, so the site can never grow past what
# GitHub Pages will serve.

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many new files to add in this run"
        required: false
        default: "400"
      dry_run:
        description: "Report only, write nothing (true/false)"
        required: false
        default: "false"

concurrency:
  group: import-files
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import new games
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/import-js13k.py \
            --limit "${{ github.event.inputs.limit || '400' }}" \
            --max-minutes 150 \
            --budget-mb 750 \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Regenerate the shared list and the sitemap
        run: |
          python3 scripts/build-local-list.py
          python3 scripts/build-sitemap.py

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Commit what came back
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add assets/games assets/img/pack data/local-files.json assets/js/local-games.js sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing new this run."
            exit 0
          fi
          count=$(git diff --cached --numstat -- assets/games | wc -l)
          git commit -m "Import $count offline files from js13kGames"
          git pull --rebase --autostash
          git push
